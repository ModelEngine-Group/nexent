name: Docker Build Backend Images

concurrency:
  group: docker-build-main-dev-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    branches: [develop, 'release/**', 'hotfix/**']
    paths:
      - 'backend/**'
      - 'infrastructure/**'
      - 'sdk/**'
      - 'deploy/images/dockerfiles/main/**'
      - 'deploy/images/dockerfiles/ops/**'
      - 'deploy/common/**'
      - 'deploy/sql/**'
      - 'deploy/tests/smoke-independent-service-images.sh'
      - 'VERSION'
      - 'deploy/images/build.sh'
      - '.dockerignore'
      - '.github/workflows/auto-build-main-dev.yml'
  push:
    branches: [develop, 'release/**', 'hotfix/**']
    paths:
      - 'backend/**'
      - 'infrastructure/**'
      - 'sdk/**'
      - 'deploy/images/dockerfiles/main/**'
      - 'deploy/images/dockerfiles/ops/**'
      - 'deploy/common/**'
      - 'deploy/sql/**'
      - 'deploy/tests/smoke-independent-service-images.sh'
      - 'VERSION'
      - 'deploy/images/build.sh'
      - '.dockerignore'
      - '.github/workflows/auto-build-main-dev.yml'

jobs:
  build-independent-services:
    name: Build and start independent services (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build independent backend images
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          bash deploy/images/build.sh --images management,runtime,ops \
            --platform "linux/$ARCH" --version "dev-$ARCH" --load
      - name: Start and check independent services
        timeout-minutes: 8
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          bash deploy/tests/smoke-independent-service-images.sh \
            "nexent/nexent-management:dev-$ARCH" "nexent/nexent-runtime:dev-$ARCH" \
            "nexent/nexent-ops:dev-$ARCH"
