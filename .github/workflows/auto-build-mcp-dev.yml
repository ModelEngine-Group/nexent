name: Docker Build MCP Proxy Image

concurrency:
  group: docker-build-mcp-dev-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    branches: [develop, 'release/**', 'hotfix/**']
    paths:
      - 'deploy/images/dockerfiles/mcp/**'
      - 'deploy/images/build.sh'
      - '.dockerignore'
      - '.github/workflows/auto-build-mcp-dev.yml'
  push:
    branches: [develop, 'release/**', 'hotfix/**']
    paths:
      - 'deploy/images/dockerfiles/mcp/**'
      - 'deploy/images/build.sh'
      - '.dockerignore'
      - '.github/workflows/auto-build-mcp-dev.yml'

jobs:
  build-mcp:
    name: build-mcp-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build MCP proxy
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          bash deploy/images/build.sh --images mcp --platform "linux/$ARCH" \
            --version "dev-$ARCH" --load
