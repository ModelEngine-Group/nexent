name: Run Automated Unit Tests

permissions:
  contents: read

concurrency:
  group: automated-unit-test-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      pytest_file_timeout:
        description: 'per-file timeout in seconds (0=disabled)'
        required: false
        # Raised from 300 → 600 because trajectory cleanup tests that
        # enumerate 1000 OTLP files consistently need ~350s on CI runners
        # (self-hosted jason-workstation-2 has slower disk I/O than the
        # development Docker image).  Anything under 600s is still faster
        # than the overall job timeout and gives those slow-but-legitimate
        # tests headroom without letting truly hung subprocesses run wild.
        default: '600'
      codecov_os:
        description: 'Optional Codecov OS override; blank detects the executing runner architecture'
        required: false
        default: ''
  pull_request:
    branches: [develop, 'release/**', 'hotfix/**']
    paths:
      - 'backend/**'
      - 'infrastructure/**'
      - 'sdk/**'
      - 'deploy/common/**'
      - 'deploy/tests/**'
      - 'deploy/offline/**'
      - 'deploy/docker/**'
      - 'deploy/k8s/**'
      - 'test/**'
      - '.github/workflows/**'
  push:
    branches: [develop, 'release/**', 'hotfix/**']
    paths:
      - 'backend/**'
      - 'infrastructure/**'
      - 'sdk/**'
      - 'deploy/common/**'
      - 'deploy/tests/**'
      - 'deploy/offline/**'
      - 'deploy/docker/**'
      - 'deploy/k8s/**'
      - 'test/**'
      - '.github/workflows/**'

jobs:
  test:
    runs-on: ut
    env:
      UV_PYTHON: "3.11.15"
      CODECOV_CLI_VERSION: "11.3.2"
    steps:
      - name: Restore write access to leftover test directories
        shell: bash
        run: |
          test_root="${GITHUB_WORKSPACE}/.pytest-tmp"
          if [[ -d "$test_root" && ! -L "$test_root" ]]; then
            find -P "$test_root" -xdev -type d -uid "$(id -u)" -exec chmod u+rwx -- {} \;
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # clean: false — skip git-clean so checkout does not trip over
          # root-owned leftover files inside .pytest-tmp/ (some earlier
          # tests spawn subprocesses that land files owned by root; the
          # runner user cannot unlink them).  New temp dirs are already
          # kept outside the repo tree (see test/conftest.py) so the old
          # .pytest-tmp/ is now dead weight and nothing writes there.
          clean: false

      - name: Clean leftover pre-refactor paths (best-effort)
        run: |
          # Self-hosted runners (jason-workstation-2-container-*) keep
          # persistent workspaces.  actions/checkout with clean: false
          # preserves everything — but earlier refactors (#4314 Gateway
          # independent image, #4160 split backend into API/DB/contracts)
          # deleted directories that still linger on disk as un-tracked
          # files from pre-refactor runs.  Regression guards such as
          # test_management_relocation.py / test_gateway_layout.py assert
          # these paths DO NOT EXIST, so leftover dirs turn into hard
          # test failures that have nothing to do with the PR content.
          #
          # Strategy (two layers):
          #   1) git clean -ffdx with excludes.  Clears every untracked /
          #      ignored path that git sees, while skipping the small set
          #      of known root-owned leftovers (.pytest-tmp, .pytest_cache)
          #      that actions/checkout default clean: true also cannot
          #      touch.  Covers all future refactors automatically.
          #   2) Fallback chmod + rm for the excluded dirs themselves and
          #      any path git clean could not remove.  Anything still
          #      root-owned is logged but not a blocker — pytest no
          #      longer writes to these paths (test/conftest.py moved
          #      tmp_root outside the repo tree), so they are dead weight.
          #
          # Diagnostic: after both passes, print a ls of whatever untracked
          # junk still remains so the next CI failure tells us exactly
          # what was left behind.
          echo "=== Layer 1: git clean -ffdx (excluding known root-owned dirs) ==="
          git clean -ffdx -e .pytest-tmp -e .pytest_cache 2>&1 | head -50 || true
          echo ""

          echo "=== Layer 2: chmod + rm fallback for excluded / stubborn paths ==="
          clean_tree() {
            local target="$1"
            [ -e "$target" ] || return 0
            echo "  Removing leftover path: $target"
            find "$target" -type d -exec chmod u+rwx {} + 2>/dev/null || true
            find "$target" -type f -exec chmod u+rw {} + 2>/dev/null || true
            rm -rf "$target" 2>/dev/null || echo "    (some files still unremovable — non-blocking)"
          }
          clean_tree ".pytest-tmp"
          clean_tree ".pytest_cache"
          # Legacy refactor paths — git clean already handled them on a
          # clean checkout, but re-assert explicitly if anything was left.
          clean_tree "backend/gateway/api"
          clean_tree "backend/services/providers"
          clean_tree "backend/management/security"
          clean_tree "backend/utils"
          echo ""

          echo "=== Remaining untracked files (diagnostic) ==="
          git clean -ffdxn 2>&1 | head -50 || true
          echo "=== End diagnostic ==="

      - name: Install uv
        # astral-sh/setup-uv@v10.3.3
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "latest"

      - name: Set up managed Python
        run: |
          uv python install 3.11.15 --no-bin
          managed_python_bin="$(dirname "$(uv python find --managed-python 3.11.15)")"
          echo "$managed_python_bin" >> "$GITHUB_PATH"

      - name: Install Helm test dependency
        uses: azure/setup-helm@v4
        with:
          version: "v3.21.3"

      - name: Install dependencies
        run: |
          cd backend
          uv sync --managed-python --extra data-process --extra test --index pytorch-cpu --upgrade-package torch --upgrade-package torchvision
          cd ..

      - name: Run all tests and collect coverage
        # Configure NEXENT_PYTEST_WORKERS in the runner environment; the default is the CPU count.
        env:
          NEXENT_PYTEST_TMPDIR: ${{ runner.temp }}/nexent-pytest-${{ github.run_id }}-${{ github.run_attempt }}
          NEXENT_PYTEST_FILE_TIMEOUT: ${{ github.event.inputs.pytest_file_timeout || '600' }}
        run: |
          source backend/.venv/bin/activate && python test/run_all_test.py
          TEST_EXIT_CODE=$?

          if [ -f "test/coverage.xml" ]; then
            echo "Coverage XML file generated successfully."
          else
            echo "Coverage XML file not found."
            exit 1
          fi

          if [ $TEST_EXIT_CODE -ne 0 ]; then
            echo "Tests failed with exit code $TEST_EXIT_CODE"
            exit $TEST_EXIT_CODE
          else
            echo "All tests passed successfully."
          fi

      - name: Set up cached Codecov CLI
        id: codecov-cli
        env:
          CODECOV_OS: ${{ inputs.codecov_os || (runner.arch == 'ARM64' && 'linux-arm64' || 'linux') }}
        run: |
          set -euo pipefail
          # Pin release digests so cache hits are verified without network requests.
          case "$CODECOV_OS" in
            linux)
              asset=codecovcli_linux
              checksum=8e1bfb71661378530f6ea21e82b414095899e565cbb4cf555c613064be17b973
              ;;
            linux-arm64)
              asset=codecovcli_linux_arm64
              checksum=a4b71cac685742e272e7cfd4a390cafc3736f57ebc3cf7ba2e24010f19c7f23f
              ;;
            *) echo "Unsupported Codecov OS: $CODECOV_OS" >&2; exit 1 ;;
          esac
          # Prefer runner configuration, then the standard Unix cache location.
          cache_dir="${CODECOV_CACHE_DIR:-${XDG_CACHE_HOME:-$HOME/.cache}/codecov}"
          mkdir -p "$cache_dir"
          cache_dir="$(cd "$cache_dir" && pwd)"
          binary="$cache_dir/codecov"
          verify_binary() {
            printf '%s  %s\n' "$checksum" "$1" | sha256sum --check --status
          }
          if [ -f "$binary" ] && verify_binary "$binary"; then
            echo "Using cached Codecov CLI $CODECOV_CLI_VERSION ($CODECOV_OS)"
          else
            temporary_binary="$(mktemp "$cache_dir/codecov.XXXXXX")"
            trap 'rm -f "$temporary_binary"' EXIT
            curl --fail --silent --show-error --location --retry 3 \
              --connect-timeout 15 --max-time 180 \
              "https://github.com/codecov/codecov-cli/releases/download/v$CODECOV_CLI_VERSION/$asset" \
              --output "$temporary_binary"
            if ! verify_binary "$temporary_binary"; then
              echo "Codecov CLI checksum verification failed" >&2
              exit 1
            fi
            chmod +x "$temporary_binary"
            mv -f "$temporary_binary" "$binary"
          fi
          if [ ! -x "$binary" ]; then chmod +x "$binary"; fi
          echo "binary=$binary" >> "$GITHUB_OUTPUT"

      - name: Upload coverage to Codecov
        # codecov/codecov-action@v7
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          binary: ${{ steps.codecov-cli.outputs.binary }}
          version: ${{ env.CODECOV_CLI_VERSION }}
          files: test/coverage.xml
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true
          os: ${{ inputs.codecov_os || (runner.arch == 'ARM64' && 'linux-arm64' || 'linux') }}
          verbose: false
