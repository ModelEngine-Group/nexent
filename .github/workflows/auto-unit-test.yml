name: Run Automated Unit Tests

permissions:
  contents: read

concurrency:
  group: automated-unit-test-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      runner_label_json:
        description: 'Optional JSON runner labels; leave blank for automatic self-hosted selection with hosted fallback'
        required: false
        default: ''
      pytest_workers:
        description: 'parallel test workers (auto=CPU count, 0=serial, N=fixed count)'
        required: false
        default: 'auto'
      pytest_file_timeout:
        description: 'per-file timeout in seconds (0=disabled)'
        required: false
        default: '300'
      codecov_os:
        description: 'Optional Codecov OS override; blank detects the executing runner architecture'
        required: false
        default: ''
  pull_request:
    branches: [develop, 'release/**', 'hotfix/**']
    paths:
      - 'backend/**'
      - 'sdk/**'
      - 'deploy/common/**'
      - 'deploy/tests/**'
      - 'deploy/offline/**'
      - 'deploy/docker/**'
      - 'deploy/k8s/**'
      - 'test/**'
      - '.github/workflows/**'
  push:
    branches: [develop, 'release/**', 'hotfix/**']
    paths:
      - 'backend/**'
      - 'sdk/**'
      - 'deploy/common/**'
      - 'deploy/tests/**'
      - 'deploy/offline/**'
      - 'deploy/docker/**'
      - 'deploy/k8s/**'
      - 'test/**'
      - '.github/workflows/**'

jobs:
  select-runner:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      labels: ${{ steps.select.outputs.labels }}
    steps:
      - name: Select available UT runner
        id: select
        uses: actions/github-script@v7
        env:
          RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
          RUNNER_LABEL_JSON: ${{ inputs.runner_label_json }}
        with:
          github-token: ${{ secrets.RUNNER_STATUS_TOKEN || github.token }}
          script: |
            const hosted = ['ubuntu-24.04'];
            const selfHosted = ['self-hosted', 'linux', 'x64'];
            const emit = (labels) => {
              core.info(`Selected runner labels: ${JSON.stringify(labels)}`);
              core.setOutput('labels', JSON.stringify(labels));
            };

            // Fork PRs must not execute untrusted code on persistent runners.
            const pr = context.payload.pull_request;
            if (pr && pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.info('Fork PR: using a GitHub-hosted runner.');
              emit(hosted);
              return;
            }

            const override = process.env.RUNNER_LABEL_JSON?.trim();
            if (context.eventName === 'workflow_dispatch' && override) {
              let labels;
              try {
                labels = JSON.parse(override);
              } catch {
                throw new Error('runner_label_json must be a JSON array of nonempty strings.');
              }
              if (!Array.isArray(labels) || labels.length === 0 ||
                  labels.some(label => typeof label !== 'string' || !label.trim())) {
                throw new Error('runner_label_json must be a JSON array of nonempty strings.');
              }
              emit(labels.map(label => label.trim()));
              return;
            }

            if (!process.env.RUNNER_STATUS_TOKEN) {
              core.info('RUNNER_STATUS_TOKEN is unavailable; using a GitHub-hosted runner.');
              emit(hosted);
              return;
            }

            try {
              const runners = await github.paginate(
                github.rest.actions.listSelfHostedRunnersForRepo,
                { ...context.repo, per_page: 100 }
              );
              const available = runners.some(runner =>
                runner.status === 'online' && runner.busy === false &&
                selfHosted.every(label => runner.labels.some(
                  candidate => candidate.name.toLowerCase() === label
                ))
              );
              emit(available ? selfHosted : hosted);
            } catch (error) {
              // Do not log API response bodies, which may contain sensitive data.
              core.warning(`Runner lookup failed (status ${error.status || 'unknown'}); using a GitHub-hosted runner.`);
              emit(hosted);
            }

  test:
    needs: select-runner
    runs-on: ${{ fromJson(needs.select-runner.outputs.labels) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run deployment script tests
        run: |
          bash deploy/tests/test_common.sh
          bash deploy/tests/test_docker_backup.sh
          bash deploy/tests/test_k8s_backup.sh
          bash deploy/tests/test_sql_migrations.sh
          bash deploy/tests/test_super_admin_init.sh
          bash deploy/tests/test_build_offline_package.sh

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install --upgrade uv

      - name: Install dependencies
        run: |
          cd backend
          uv sync --extra data-process --extra test
          uv pip install -e "../sdk[dev]"
          cd ..

      - name: Run all tests and collect coverage
        env:
          NEXENT_PYTEST_WORKERS: ${{ github.event.inputs.pytest_workers || 'auto' }}
          NEXENT_PYTEST_FILE_TIMEOUT: ${{ github.event.inputs.pytest_file_timeout || '300' }}
        run: |
          source backend/.venv/bin/activate && python test/run_all_test.py
          TEST_EXIT_CODE=$?

          if [ -f "test/coverage.xml" ]; then
            echo "Coverage XML file generated successfully."
          else
            echo "Coverage XML file not found."
            exit 1
          fi

          if [ $TEST_EXIT_CODE -ne 0 ]; then
            echo "Tests failed with exit code $TEST_EXIT_CODE"
            exit $TEST_EXIT_CODE
          else
            echo "All tests passed successfully."
          fi

      - name: Upload coverage to Codecov
        # codecov/codecov-action@v7
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          files: test/coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true
          os: ${{ inputs.codecov_os || (runner.arch == 'ARM64' && 'linux-arm64' || 'linux') }}
          verbose: true
