name: Docker Image Pull Test

on:
  schedule:
    # Run every 30 minutes (at minute 0 and 30 of every hour)
    - cron: '0,30 * * * *'
  workflow_dispatch:
    inputs:
      runner_label_json:
        description: 'runner array in json format (e.g. ["ubuntu-latest"] or ["self-hosted"])'
        required: true
        default: '["ubuntu-latest"]'

jobs:
  test-image-pull:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && fromJson(inputs.runner_label_json) || fromJson('["ubuntu-latest"]') }}
    steps:
      - name: Test Docker Hub image pulls
        run: |
          images=(
            nexent/nexent-management:latest
            nexent/nexent-runtime:latest
            nexent/nexent-ops:latest
            nexent/nexent-gateway:latest
            nexent/nexent-web:latest
            nexent/nexent-data-process:latest
            nexent/nexent-ubuntu-terminal:latest
          )
          pull_count=$(shuf -i 2-5 -n 1)
          for image in "${images[@]}"; do
            for ((attempt = 1; attempt <= pull_count; attempt++)); do
              docker image rm "$image" 2>/dev/null || true
              echo "Pull attempt $attempt/$pull_count for $image"
              docker pull "$image"
              if ((attempt < pull_count)); then sleep 5; fi
            done
            docker image rm "$image" 2>/dev/null || true
          done
