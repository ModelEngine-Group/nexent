name: Deploy Nexent Community

on:
  workflow_dispatch:
    inputs:
      deployment_mode:
        description: 'Deployment mode: development or production'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - production
      runner_label_json:
        description: 'runner array in json format (e.g. ["ubuntu-latest"] or ["self-hosted"])'
        required: true
        default: '[]'
      app_version:
        description: 'Docker image tag to build and deploy (e.g. v1.7.1)'
        required: true
        default: 'latest'
        type: string
      build_full_sandbox:
        description: 'Also build the optional full sandbox image'
        required: true
        default: false
        type: boolean

jobs:
  build-main:
    runs-on: ${{ fromJson(inputs.runner_label_json) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build main application image
        run: docker build --build-arg MIRROR=https://pypi.tuna.tsinghua.edu.cn/simple --build-arg APT_MIRROR=tsinghua -t nexent/nexent:${{ github.event.inputs.app_version }} -t nexent/nexent -f deploy/images/dockerfiles/main/Dockerfile .

  build-web:
    runs-on: ${{ fromJson(inputs.runner_label_json) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build web frontend image
        run: docker build --build-arg MIRROR=https://registry.npmmirror.com --build-arg APK_MIRROR=tsinghua -t nexent/nexent-web:${{ github.event.inputs.app_version }} -t nexent/nexent-web -f deploy/images/dockerfiles/web/Dockerfile .

  build-docs:
    runs-on: ${{ fromJson(inputs.runner_label_json) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build docs image
        run: docker build --progress=plain -t nexent/nexent-docs:${{ github.event.inputs.app_version }} -t nexent/nexent-docs -f deploy/images/dockerfiles/docs/Dockerfile .

  build-sandbox:
    runs-on: ${{ fromJson(inputs.runner_label_json) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build sandbox image
        run: docker build --build-arg MIRROR=https://pypi.tuna.tsinghua.edu.cn/simple --build-arg APT_MIRROR=tsinghua -t nexent/nexent-sandbox:${{ github.event.inputs.app_version }} -t nexent/nexent-sandbox -f deploy/images/dockerfiles/sandbox/Dockerfile .
      - name: Build optional full sandbox image
        if: ${{ inputs.build_full_sandbox }}
        run: docker build --build-arg MIRROR=https://pypi.tuna.tsinghua.edu.cn/simple --build-arg APT_MIRROR=tsinghua -t nexent/nexent-sandbox-full:${{ github.event.inputs.app_version }} -t nexent/nexent-sandbox-full -f deploy/images/dockerfiles/sandbox-full/Dockerfile .

  build-mcp:
    runs-on: ${{ fromJson(inputs.runner_label_json) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build MCP image
        run: docker build --build-arg MIRROR=https://pypi.tuna.tsinghua.edu.cn/simple --build-arg APT_MIRROR=tsinghua -t nexent/nexent-mcp:${{ github.event.inputs.app_version }} -t nexent/nexent-mcp -f deploy/images/dockerfiles/mcp/Dockerfile .

  deploy:
    runs-on: ${{ fromJson(inputs.runner_label_json) }}
    needs: [ build-main, build-web, build-docs, build-sandbox, build-mcp ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build Gateway image on the deployment runner
        env:
          APP_VERSION: ${{ inputs.app_version }}
        run: |
          docker build --build-arg MIRROR=https://pypi.tuna.tsinghua.edu.cn/simple \
            -t "nexent/nexent-gateway:$APP_VERSION" -t nexent/nexent-gateway:latest \
            -f deploy/images/dockerfiles/gateway/Dockerfile .
      - name: Build Management and Runtime images on the deployment runner
        env:
          APP_VERSION: ${{ inputs.app_version }}
        run: |
          bash deploy/images/build.sh --management --runtime --version "$APP_VERSION" --registry general --load
          if [ "$APP_VERSION" != latest ]; then
            for role in management runtime; do
              docker tag "nexent/nexent-$role:$APP_VERSION" "nexent/nexent-$role:latest"
            done
          fi
      - name: Copy project to $HOME/nexent
        run: |
          rm -rf $HOME/nexent
          mkdir -p $HOME/nexent
          cp -r $GITHUB_WORKSPACE/* $HOME/nexent/
      - name: Force APP_VERSION to latest in deploy.sh (CI only)
        run: |
          sed -i 's/APP_VERSION="$(get_app_version)"/APP_VERSION="${{ github.event.inputs.app_version }}"/' $HOME/nexent/deploy/docker/deploy.sh
      - name: Start docs container
        run: |
          docker stop nexent-docs 2>/dev/null || true
          docker rm nexent-docs 2>/dev/null || true
          docker run -d --name nexent-docs -p 4173:4173 nexent/nexent-docs
      - name: Ensure deploy.sh is executable
        run: chmod +x $HOME/nexent/deploy.sh $HOME/nexent/deploy/docker/deploy.sh
      - name: Deploy with deploy.sh
        env:
          DEPLOYMENT_MODE: ${{ github.event.inputs.deployment_mode }}
        run: |
          cd $HOME/nexent
          cp deploy/env/.env.example deploy/env/.env
          
          sed -i "s/APPID=.*/APPID=${{ secrets.VOICE_APPID }}/" deploy/env/.env
          sed -i "s/TOKEN=.*/TOKEN=${{ secrets.VOICE_TOKEN }}/" deploy/env/.env
          
          if [ "$DEPLOYMENT_MODE" = "production" ]; then
            ./deploy.sh docker --mode 3 --is-mainland N --enable-terminal N --version 2 --root-dir "$HOME/nexent-production-data"
          else
            ./deploy.sh docker --mode 1 --is-mainland N --enable-terminal N --version 2 --root-dir "$HOME/nexent-development-data"
          fi
