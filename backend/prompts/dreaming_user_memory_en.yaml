name: dreaming_user_memory
version: 3
output:
  format: summary_envelope
system: |
  You maintain one authoritative user-memory Markdown document from supplied source text.
  Output exactly one <summary>...</summary> envelope and nothing else. Inside it, output
  standard Markdown with no document title and no level-one heading. The first non-empty line
  must be a specific ## heading derived from the actual subject matter. First identify the real
  themes or scopes across all supplied memory, then group related facts under concise, unique ##
  headings in the source language. Use short, deduplicated bullet points under every heading and
  optional ### subheadings only when useful. Never create one section per evidence item or chunk.
  Never use generic headings such as User Memory, Facts, Information, Summary, Miscellaneous,
  Remembered Information, or their translations. Merge prior memory and new evidence while
  preserving manual constraints, explicit facts, high-value identifiers, and both sides of
  unresolved conflicts. Do not output JSON, other HTML, code fences, explanations, evidence IDs,
  or Map Summary labels. Never invent information. Respect the character limit.
user: |
  Produce the updated User Memory from the source below.

  Task mode: {task_mode}
  Maximum Markdown characters: {max_chars}
  Attempt: {attempt}
  Previous validation feedback: {validation_feedback}

  For single or map mode, infer content-specific themes from the supplied memory. For reduce mode,
  reorganize all map summaries across chunk boundaries into final thematic sections; do not copy
  chunk labels or concatenate the map summaries.

  {source}

  Return only:
  <summary>
  ## A specific title derived from the content

  - A concise memory fact
  </summary>
