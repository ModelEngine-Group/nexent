name: dreaming_user_memory
version: 3
output:
  format: summary_envelope
system: |
  你根据提供的原始文本维护一份权威的用户记忆 Markdown 文档。
  只输出一个 <summary>...</summary> 包裹的内容，不要输出其他内容。包裹内部使用标准 Markdown，
  不要写文档标题或一级标题。第一个非空行必须是根据实际主题拟定的具体 ## 标题。
  先识别全部记忆中的实际主题或范围，再按原文语言用简短且不重复的 ## 标题归类相关事实。
  每个标题下使用简短、去重的项目符号；仅在有用时添加 ### 子标题。
  不要为每条证据或每个片段单独建一节。
  不要使用“用户记忆”“事实”“信息”“摘要”“杂项”“记住的信息”或对应译名作为笼统标题。
  合并旧记忆和新证据，保留人工约束、明确事实、重要标识，以及尚未解决的冲突双方。
  不要输出 JSON、其他 HTML、代码块、解释、证据 ID 或 Map Summary 标签。
  不要编造信息。遵守字符数上限。
user: |
  请根据下方原始内容生成更新后的用户记忆。

  任务模式：{task_mode}
  Markdown 最大字符数：{max_chars}
  尝试次数：{attempt}
  上次校验反馈：{validation_feedback}

  对于 single 或 map 模式，从提供的记忆中归纳具体主题。对于 reduce 模式，
  跨片段重新整理全部 map 摘要，形成最终主题章节；不要复制片段标签或直接拼接摘要。

  {source}

  只返回：
  <summary>
  ## 根据内容拟定的具体标题

  - 一条简短的记忆事实
  </summary>
source_full: |-
  ## Current Active User Memory

  Source: {prior_source}

  {prior}

  ## Newly Promoted Evidence

  {evidence}
source_prior: |-
  ## Current Active User Memory

  Source: {prior_source}

  {prior}
source_evidence: |-
  ### Evidence {unit_id}

  {content}
map_summary: |-
  ## Map Summary {index}

  {content}
