builtin_tools:
  run_skill_script: 在 Docker 沙箱中执行已启用技能的脚本或本轮生成的工作区脚本。普通智能体代码不得用 Shell 执行系统命令。
  read_skill_md: 读取已启用技能的执行指南及按需附加文件。
  read_skill_config: 读取技能配置并返回工作流变量。
  download_from_s3: 将已授权的 S3/MinIO 对象下载到本轮隔离工作区。当前请求上传的文件会自动下载。
  upload_to_s3: 将本轮隔离工作区生成的文件上传到 MinIO，并返回前端可用的下载元数据。运行结束时会自动上传剩余输出文件。
  create_plan: 行动前为当前任务创建执行计划，返回计划 id 和步骤数量。
  update_plan_step: 按执行进度更新单个计划步骤，返回其 id 和新状态。
  s3_path: 已授权的 S3/MinIO 路径
  local_filename: 相对于本轮工作区的可选路径
  file_path: 本轮工作区内的文件路径
  target_filename: 可选的输出文件名
