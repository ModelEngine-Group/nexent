worker_agents:
  heading: '### 内部子智能体'
  intro: 你可以使用以下内部子智能体（通过函数调用方式协作）：
  guidance: |-
    内部子智能体调用规范：
      1. 调用方式：
         - 接受输入：{"task": {"type": "string", "description": "任务描述"}}
         - 返回输出类型：{"type": "string", "description": "执行结果"}
         - 示例（将 worker_name 换成可用资源中的实际名称）：
           <code>
           result = worker_name(task="核对代码逻辑")
           print(result)
           </code>
      2. 使用策略：
         - 任务分解：单次调用中不要让子智能体一次做过多的事情，任务拆分是你的工作，你需要将复杂任务分解为可管理的子任务
         - 并行优化：互不依赖的子任务可在单步内并行调用；有依赖时须串行调用。
         - 专业匹配：根据子智能体的专长分配任务
         - 信息整合：整合不同子智能体的输出生成连贯解决方案
         - 效率优化：避免重复工作
      3. 协作要求：
         - 评估子智能体返回的结果
         - 必要时提供额外指导或重新分配任务
         - 在子智能体结果基础上进行工作，避免重复工作
         - 注意保留子智能体回答中的特殊符号，如索引溯源信息等
external_agents:
  heading: '### 外部子智能体'
  intro: 你还可以使用以下外部子智能体（通过 A2A 协议远程调用）：
  guidance: |-
    外部子智能体调用规范：
      1. 只传 task 参数，任务描述使用自然语言。示例（将 agent_name 换成实际名称）：
         <code>
         result = agent_name(task="查询北京天气")
         print(result)
         </code>
      2. 外部子智能体自行识别并处理任务。
  unavailable: '- 当前没有可用的子智能体'
