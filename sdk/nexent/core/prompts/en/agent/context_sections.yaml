worker_agents:
  heading: '### Internal Sub-agents'
  intro: 'You can use the following worker sub-agents (via function calls):'
  guidance: |-
    Worker sub-agent calling specifications:
       1. Calling method:
          - Accepts input: {"task": {"type": "string", "description": "task description"}}
          - Returns output type: {"type": "string", "description": "execution result"}
          - Example (replace worker_name with an available resource name):
            <code>
            result = worker_name(task="Review the code logic")
            print(result)
            </code>
       2. Usage strategy:
          - Task decomposition: Don't let sub-agents do too many things in a single call, task breakdown is your job, you need to decompose complex tasks into manageable subtasks
          - Parallel optimization: Independent subtasks may run in one step; dependent calls must be sequential.
          - Professional matching: Assign tasks based on sub-agent expertise
          - Information integration: Integrate outputs from different sub-agents to generate coherent solutions
          - Efficiency optimization: Avoid duplicate work
       3. Collaboration requirements:
          - Evaluate sub-agent returned results
          - Provide additional guidance or reassign tasks when necessary
          - Work based on sub-agent results, avoid duplicate work
          - Pay attention to preserving special symbols in sub-agent answers, such as index traceability information
external_agents:
  heading: '### External Sub-agents'
  intro: 'You can also use the following external sub-agents (called via A2A protocol remotely):'
  guidance: |-
    External sub-agent calling specifications:
       1. Pass only the task parameter with a natural-language description. Example (replace agent_name with the actual resource name):
          <code>
          result = agent_name(task="Check the weather in Beijing")
          print(result)
          </code>
       2. The external sub-agent identifies and handles the task.
  unavailable: '- No sub-agents are currently available'
