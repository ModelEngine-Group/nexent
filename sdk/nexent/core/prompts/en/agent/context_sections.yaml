builtin_tools:
  run_skill_script: Execute an enabled skill script or a script generated in this run's workspace inside the Docker sandbox. Ordinary agent code must not use shell commands.
  read_skill_md: Read an enabled skill's guide and any needed additional files.
  read_skill_config: Read skill configuration and return workflow variables.
  download_from_s3: Download an authorized S3/MinIO object into this run's isolated workspace. Files uploaded with the current request are downloaded automatically.
  upload_to_s3: Upload a generated file from this run's isolated workspace to MinIO and return frontend-compatible download metadata. Remaining output files are uploaded automatically when the run finishes.
  create_plan: Create an execution plan before acting and return its id and step count.
  update_plan_step: Update one plan step as work proceeds and return its id and new status.
  s3_path: Authorized S3/MinIO path
  local_filename: Optional path relative to the run workspace
  file_path: Path inside the run workspace
  target_filename: Optional output filename
