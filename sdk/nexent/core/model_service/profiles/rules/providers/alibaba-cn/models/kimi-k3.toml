schema_version = 1
rule_id = "alibaba_cn_kimi_k3_controls_v1"
version = 2
target_kind = "provider_model"
target_key = "alibaba-cn/kimi-k3"
reason = "Bind only the exact upstream-declared reasoning controls for OpenAI Chat"
evidence = "https://help.aliyun.com/zh/model-studio/deep-thinking; pinned models.dev providers/alibaba-cn/models/kimi-k3.toml and provider.toml; reviewed 2026-10-16"

[[parameters]]
key = "reasoning_effort"
visible = true
editable = true
required = false
allowed_scopes = ["outlet", "conversation"]
ui_group = "reasoning"
owner = "combination"
schema = {"type" = "string", "enum" = ["low", "high", "max"]}
source = {"ref" = "alibaba_cn_kimi_k3_controls_v1", "version" = 1, "evidence" = "https://help.aliyun.com/zh/model-studio/deep-thinking; pinned models.dev providers/alibaba-cn/models/kimi-k3.toml and provider.toml; reviewed 2026-10-16"}
api_binding = {"path" = "/reasoning_effort", "transform_ref" = "identity_v1", "transform_version" = 1}

[[capability_overrides]]
path = "/reasoning/can_disable"
value = true
reason = "The provider documents a switchable hybrid mode"
evidence = "https://platform.qianwenai.com/docs/developer-guides/text-generation/thinking; reviewed 2026-11-05"

[[capability_overrides]]
path = "/reasoning/controls"
value = [{mode="toggle", parameter_key="enable_thinking", values=[false,true]}, {mode="effort", parameter_key="reasoning_effort", values=["low","high","max"]}]
reason = "Register the missing documented toggle while retaining existing degree controls"
evidence = "https://platform.qianwenai.com/docs/developer-guides/text-generation/thinking; reviewed 2026-11-05"

[[parameters]]
key = "enable_thinking"
visible = true
editable = true
required = false
allowed_scopes = ["outlet", "conversation"]
ui_group = "reasoning"
owner = "combination"
default_value = true
schema = {type="boolean"}
source = {ref="alibaba_cn_kimi_k3_shutdown_preference_v1", version=1, evidence="https://platform.qianwenai.com/docs/developer-guides/text-generation/thinking"}
api_binding = {path="/enable_thinking", transform_ref="identity_v1", transform_version=1}
