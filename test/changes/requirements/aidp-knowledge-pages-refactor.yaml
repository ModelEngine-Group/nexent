schema_version: '1.0'
changes:
  - change_id: AKPR-REQ-001
    change_type: requirement
    requirement_id: AKPR-001
    title: AIDP knowledge base list and creation page refactor
    description: Split the AIDP knowledge base overview and its file management into separate views with a card or table overview, an independent name search, a collapsible three-step guide, a column visibility setting and a full-page file view that restores list state. Creation moves to a dedicated two-step page carrying permission, safety guard, graph, chunking, model and retrieval configuration, and the previously hidden document download and delete entries become available again under the documented permission gates.
    feature_contract_changed: true
    affected_features: {existing: [], added: [AKPR-001], modified: [], retired: []}
    affected_cases:
      existing: []
      added:
        - AKPR-D1-001
        - AKPR-D1-002
        - AKPR-D1-003
        - AKPR-D1-004
        - AKPR-D1-005
        - AKPR-D1-006
        - AKPR-D1-007
        - AKPR-D1-008
        - AKPR-D1-009
        - AKPR-D1-010
        - AKPR-D1-011
        - AKPR-D1-012
        - AKPR-D2-001
        - AKPR-D2-002
        - AKPR-D2-003
        - AKPR-D2-004
        - AKPR-D3-001
        - AKPR-D3-002
        - AKPR-D4-001
        - AKPR-D4-002
        - AKPR-D4-003
        - AKPR-D4-004
        - AKPR-D5-001
        - AKPR-D5-002
        - AKPR-D5-003
        - AKPR-D5-004
      modified: []
      retired: []
    notes: The AIDP-only scope is preserved; the ES knowledge base path keeps its current components and endpoints. D3, D4 and D5 cases remain blocked until a disposable deployment and the upstream safety guard contract are available.
  - change_id: AKPR-REQ-002
    change_type: requirement
    requirement_id: AKPR-001
    title: Remove AIDP knowledge-base safety guard
    description: Remove the safety guard from AIDP knowledge-base creation, update and detail interfaces because the feature is no longer in scope. Keep unrelated agent safety controls unchanged.
    feature_contract_changed: true
    affected_features: {existing: [], added: [], modified: [AKPR-001, AKDT-001], retired: []}
    affected_cases:
      existing: []
      added: []
      modified: [AKPR-D2-003, AKPR-D3-001, AKPR-D4-003, AKPR-D5-001, AKPR-D5-003]
      retired: [AKPR-D1-012]
    notes: The API request and response models, AIDP-facing UI and mock no longer expose sensitive_intercept_enalbe. The ES knowledge-base path and unrelated agent safety controls are outside this change.
  - change_id: AKPR-REQ-003
    change_type: requirement
    requirement_id: AKPR-001
    title: Create AIDP knowledge bases directly from the configuration page
    description: Remove the creation step indicator and optional import stage. Keep all knowledge-base configuration on one full-page form; submitting it creates the knowledge base and opens its detail page, where users can upload files. The create and detail page titles and detail information section headings use 18px text.
    feature_contract_changed: true
    affected_features: {existing: [], added: [], modified: [AKPR-001], retired: []}
    affected_cases:
      existing: []
      added: []
      modified: [AKPR-D1-014, AKPR-D4-005]
      retired: []
    notes: The create API payload and permission/configuration fields remain unchanged; file upload remains available from the detail page. No ES page behavior changes.
  - change_id: AKPR-REQ-004
    change_type: requirement
    requirement_id: AKPR-001
    title: Stage AIDP file imports in a scrollable drawer with visible per-file progress
    description: Replace the AIDP import modal with one shared right-side drawer used from the overview and detail page. Selecting or dropping files stages them for review; Import sends them to AIDP. Keep a 50-file cap including failures, independent scrolling, browser-measured progress, status-specific dashed/solid borders, and delete-only failure actions.
    feature_contract_changed: true
    affected_features: {existing: [], added: [], modified: [AKPR-001], retired: []}
    affected_cases:
      existing: []
      added: [AKPR-D1-015]
      modified: [AKPR-D4-002]
      retired: []
    notes: Superseded by AKPR-REQ-005 for upload timing, confirmation and in-flight deletion. The new drawer is AIDP-only; the ES upload UI is unchanged.
  - change_id: AKPR-REQ-005
    change_type: requirement
    requirement_id: AKPR-001
    title: Restore immediate AIDP upload on selection and use Confirm to dismiss results
    description: Selecting or dropping files immediately starts the existing Nexent-to-AIDP upload. Confirm only closes the drawer; transfer completion must wait for the actual AIDP result before success. Preserve successful and failed rows for review, and disable deletion of in-flight files because cancelling a browser request cannot reliably withdraw an upstream AIDP upload.
    feature_contract_changed: true
    affected_features: {existing: [], added: [], modified: [AKPR-001], retired: []}
    affected_cases:
      existing: []
      added: []
      modified: [AKPR-D1-015, AKPR-D4-002]
      retired: []
    notes: One selection sends one multipart batch with repeated files fields. Copy batch progress to each uploading ring, show total file size without transferred-byte text, and expose delete only on failed rows. Confirm, Cancel, Escape and mask/close actions are disabled until the upload response returns; transfer 100% alone does not enable them. No separate backend staging, MinIO, ES or AIDP API changes.
