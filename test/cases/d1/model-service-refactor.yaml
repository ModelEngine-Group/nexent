schema_version: '1.0'
stage: D1
module: MODEL-MANAGEMENT
cases:
  - case_id: MSRF-D1-001
    feature_id: MSRF-001
    requirement_ids: [MSRF-001]
    business_rule_ids: [MSRF-RULE-001]
    title: Model implementation has one bounded canonical location
    type: BE-UT
    priority: P1
    status: active
    automation: automated
    objective: Verify canonical locations and an acyclic internal import graph.
    preconditions: [Use repository Python sources without external services.]
    test_data: {profile: mock, max_physical_lines: 1500}
    steps:
      - {order: 1, action: Inspect model sources and all backend SDK and test imports., expected: Canonical files exist and obsolete imports and duplicate implementations are absent.}
      - {order: 2, action: Traverse model internal imports including function-local imports., expected: No cycle connects provider health and probe.}
    expected_results: [Every model code file is at most 1500 lines., All internal dependencies are acyclic.]
    forbidden_side_effects: [No database or provider connection occurs during source inspection.]
    unit_boundary: Model source ownership and dependency graph
    inputs: [Repository Python source files]
    assertions: [Required canonical modules exist., Obsolete modules are absent., Import graph has no cycle., Names depends only on standard library.]
  - case_id: MSRF-D1-002
    feature_id: MSRF-001
    requirement_ids: [MSRF-001]
    business_rule_ids: [MSRF-RULE-002]
    title: Relocated model methods and shared types preserve their contracts
    type: BE-UT
    priority: P1
    status: active
    automation: automated
    objective: Compare signatures to the develop baseline and check immutable result defaults.
    preconditions: [Use the captured develop signature fixture and pure contracts.]
    test_data: {profile: mock, configurations: [empty name, repository qualified name, legacy modelName]}
    steps:
      - {order: 1, action: Compare canonical function signatures to baseline declarations., expected: Arguments defaults return annotations and async declarations match.}
      - {order: 2, action: Construct model descriptors and capacity results and format model names., expected: Defaults enum values and name fallback behavior match the preserved contract.}
    expected_results: [All captured signatures match., Shared dataclasses remain frozen., Name formatting preserves legacy fields.]
    forbidden_side_effects: [No model client database or telemetry initialization is required for contracts or names.]
    unit_boundary: Public model signatures immutable contracts and pure name helpers
    inputs: [Baseline signatures, Empty and legacy model name dictionaries]
    assertions: [Public signatures are unchanged., Contract defaults and enum values match., Dataclasses reject mutation., Pure helpers use no business imports.]
