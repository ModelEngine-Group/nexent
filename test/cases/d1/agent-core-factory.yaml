  feature_id: AGENT-CORE-001
  business_rule_ids:
  - AGENT-CORE-001-R1
  title: Factory default and native dispatch
  type: SDK-UT
  priority: P1
  status: active
  automation: automated
  objective: Factory default and native dispatch
  preconditions:
  - Use isolated run resources and deterministic local fixtures.
  test_data:
    core: jiuwen
    legacy_core: smolagents
  steps:
  - order: 1
    action: 'Exercise scenario: Default selection is smolagents.'
    expected: Default selection is smolagents
  - order: 2
    action: 'Exercise scenario: Explicit jiuwen resolves a native adapter.'
    expected: Explicit jiuwen resolves a native adapter
  - order: 3
    action: 'Exercise scenario: Unknown and duplicate registrations fail.'
    expected: Unknown and duplicate registrations fail
  expected_results: &id001
  - Default selection is smolagents
  - Explicit jiuwen resolves a native adapter
  - Unknown and duplicate registrations fail
  forbidden_side_effects:
  - No smolagents execution in the Jiuwen branch.
  - No unauthorized tools or cross-run resources.
  execution:
    profiles:
    - name: mock
      required_services: []
    timeout_seconds: 60
  unit_boundary: Agent core factory and adapter
  inputs:
  - Resolved Nexent agent and run configuration
  assertions: *id001
