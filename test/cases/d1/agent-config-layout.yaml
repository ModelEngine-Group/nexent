  business_rule_ids:
  - AGENT-CONFIG-RULE-010
  title: Reuse the resource drawer and preserve controlled model membership and order
  type: FE-COMP
  priority: P1
  status: active
  automation: automated
  objective: Verify actual common drawer controls, scroll/mask, controlled model add/remove
    and no render-time selection callback.
  preconditions:
  - Render real AddResourceDrawer and AddModelDrawer with existing model query controlled
    at its hook boundary.
  test_data:
    profile: mock
    model_ids:
    - 2
    - 1
  steps:
  - order: 1
    action: Open shared drawer and inspect right placement,mask,header and close/confirm
      controls.
    expected: Existing shared drawer design renders; close and confirm invoke only
      their supplied callbacks.
  - order: 2
    action: Render model drawer with ordered configured IDs, remove a configured model
      and select a new model.
    expected: Callbacks retain remaining order and append new IDs without replacing
      priority or mutating on render.
  expected_results:
  - Shared right drawer is reused with original close/confirm callbacks.
  - Controlled model add/remove preserves order and no callback occurs on render.
  - Standalone drawer defaults remain compatible.
  forbidden_side_effects:
  - Do not save on render/open/close or discard retained model IDs/overrides.
  unit_boundary: Real shared drawer and model selector components with model query
    mocked.
  inputs:
  - ordered model IDs
  - catalog
  - close/confirm interactions
  assertions:
  - Right masked drawer and scroll region render.
  - Model callbacks preserve remaining IDs and append newly selected ID.
  - Rendering does not change selection.
  execution:
    profiles:
    - name: mock
      required_services: []
