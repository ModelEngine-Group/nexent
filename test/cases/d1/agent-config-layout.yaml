schema_version: '1.0'
stage: D1
module: AGENT-EDITOR
cases:
- case_id: AGENT-CONFIG-D1-001
  feature_id: AGENT-CONFIG-LAYOUT
  requirement_ids:
  - AGENT-CONFIG-REQ-001
  - AGENT-CONFIG-REQ-002
  business_rule_ids:
  - AGENT-CONFIG-RULE-001
  - AGENT-CONFIG-RULE-002
  - AGENT-CONFIG-RULE-003
  - AGENT-CONFIG-RULE-004
  - AGENT-CONFIG-RULE-005
  title: Regroup the empty draft into four cards without breaking section focus or
    action gates
  type: FE-COMP
  priority: P1
  status: active
  automation: automated
  objective: Verify four-card composition, preserved section state/focus, guardrail
    reachability, action validation/permission gates, and absence of writes from render/collapse
    using the AgentConfig component boundary.
  preconditions:
  - Render AgentConfig with an initialized Agent draft and mocked existing section
    components.
  - Control mocked save outcomes and read-only state; expose localized keys as visible
    text.
  test_data:
    profile: mock
    draft:
      asset_ref: empty_agent_draft
    card_count: 4
    resource_order:
    - knowledge_base
    - conversation_guide
    - skills
    - tools
    - collaborative_agents
  steps:
  - order: 1
    action: Render AgentConfig with an initialized Agent draft.
    expected: Basic, model/prompt, shared-resource, and permission/advanced cards
      appear in one scroll region; all existing field groups including guardrail remain
      reachable, resources follow the design order, outer category tabs are absent,
      and workflow actions remain outside that region.
  - order: 2
    action: Collapse a collapsible resource section, then issue matching NL2Agent
      resource and nested prompt focus requests.
    expected: The requested section reopens and scrolls into view, nested prompt targeting
      remains supported, and each request clears without losing draft values.
  - order: 3
    action: Invoke unlock, debug, and publish actions.
    expected: Unlock and debug call their existing callbacks; publish validates and
      awaits save before opening the existing modal.
  - order: 4
    action: Repeat debug/publish with rejected validation, failed save, and a read-only
      draft.
    expected: Failed validation/save prevents downstream actions; read-only disables
      editing/publication, while existing allowed read-only inspection remains reachable.
  expected_results:
  - Exactly four outer card groups exist in one scroll region, including all existing
    field groups and guardrail.
  - Shared resources follow knowledge/welcome/skills/tools/child-Agent order and start
    expanded.
  - Section collapse and NL2Agent focus preserve draft values, reopen and scroll to
    the exact target.
  - Successful actions retain callbacks; invalid or unsaved drafts do not invoke downstream
    debug/publication.
  - Rendering, collapsing and focusing do not request backend updates; read-only prevents
    mutation/publication.
  forbidden_side_effects:
  - Do not omit or duplicate any existing configuration section.
  - Do not invoke backend services or mutate persisted Agent data as a result of rendering
    or collapsing sections.
  - Do not bypass save/validation/permission checks or move workflow actions into
    the scrolling module list.
  unit_boundary: AgentConfig React component rendered inside Ant Design App and Form
    providers, with existing section components, Agent store, route query, translations,
    and save guard mocked.
  inputs:
  - initialized Agent draft
  - localized strings
  - focus request
  - section interactions
  - action callbacks
  - save failure
  - read-only state
  assertions:
  - Exactly four outer cards group existing field components; no outer category tabs
    appear.
  - Resources are in the specified order and guardrail remains available.
  - Collapse/focus reopens the targeted resource without dropping state and calls
    scrollIntoView.
  - Unlock/debug callbacks and publish modal occur only after applicable successful
    validation/save/permission gates.
  - Render/collapse/focus do not persist changes.
  execution:
    profiles:
    - name: mock
      required_services: []
- case_id: AGENT-CONFIG-D1-004
  feature_id: AGENT-CONFIG-LAYOUT
  requirement_ids:
  - AGENT-CONFIG-REQ-002
  business_rule_ids:
  - AGENT-CONFIG-RULE-005
  - AGENT-CONFIG-RULE-009
  title: Enforce measured text-entry limits without truncating stored drafts
  type: FE-COMP
  priority: P1
  status: active
  automation: automated
  objective: Exercise real AgentInfo, AgentGuide, and AgentPrompt inputs to verify
    measured high-fidelity limits, exact boundary entry, preserved legacy overlong
    values, and default-mode compatibility.
  preconditions:
  - Render real field components with Ant Design providers and controlled Agent-store
    callbacks.
  - Provide separate empty, exact-boundary, and overlong legacy values without replacing
    the inputs with mocks.
  test_data:
    description_limit: 200
    greeting_limit: 200
    duty_limit: 1000
    legacy_description_length: 201
    legacy_greeting_length: 201
    legacy_duty_length: 1001
  steps:
  - order: 1
    action: Render high-fidelity inputs and enter exactly 200 description/greeting
      characters and 1000 duty characters.
    expected: Entry limits expose the measured boundaries and existing callbacks retain
      complete boundary values.
  - order: 2
    action: Render legacy overlong stored values without interaction, then shorten
      them below their measured limits.
    expected: Complete stored values remain visible without a load-time update; shortening
      produces the exact reduced value through the existing callback.
  - order: 3
    action: Render default component mode with its preexisting field limits.
    expected: Default limits and legacy editing behavior remain compatible; the new
      high-fidelity limit is not applied globally.
  expected_results:
  - High-fidelity description and greeting entry use a 200-character limit; duty uses
    1000.
  - Exact boundary values remain complete, and legacy overlong values are never sliced
    or silently persisted on load.
  - Shortening stored overlong content remains possible and preserves expected callback
    payloads.
  - Default-mode field constraints remain unchanged.
  forbidden_side_effects:
  - Do not truncate persisted content, write on render, or change backend request/response
    contracts.
  unit_boundary: Real AgentInfo, AgentGuide, and AgentPrompt controls with store/query/resource
    dependencies controlled at their existing hook boundaries.
  inputs:
  - empty values
  - boundary text
  - overlong legacy values
  - shortened text
  - default component mode
  assertions:
  - Actual input limits match 200, 200, and 1000 in high-fidelity mode.
  - Callback values preserve the full exact-boundary or shortened text.
  - Legacy values render intact without automatic callbacks.
  - Default-mode limits match the existing component contract.
  execution:
    profiles:
    - name: mock
      required_services: []
- case_id: AGENT-CONFIG-D1-002
  feature_id: AGENT-CONFIG-LAYOUT
  requirement_ids:
  - AGENT-CONFIG-REQ-002
  business_rule_ids:
  - AGENT-CONFIG-RULE-005
  - AGENT-CONFIG-RULE-007
  title: Limit new preset questions to five without truncating legacy drafts
  type: FE-COMP
  priority: P1
  status: active
  automation: automated
  objective: Execute the real AgentGuide component against controlled draft state
    to prove five-item additions, value-preserving edits/removal, and legacy six-item
    load compatibility.
  preconditions:
  - Render the real AgentGuide inside Ant Design Form/App with a mocked Agent store
    update callback and translations.
  - Provide separate logical drafts with zero, four, five, and six stored questions.
  test_data:
    question_counts:
    - 0
    - 4
    - 5
    - 6
    legacy_draft:
      asset_ref: agent_draft_six_questions
  steps:
  - order: 1
    action: Render zero questions and add one; edit its value and the greeting.
    expected: The localized counter uses maximum five and update callbacks retain
      the entered question/greeting values.
  - order: 2
    action: Render four questions and add the fifth, then render the updated five-question
      state.
    expected: The callback appends exactly one empty question and add becomes disabled
      at5/5.
  - order: 3
    action: Remove one of five questions and render the four-question result.
    expected: The correct item is removed, other values remain intact, and add re-enables.
  - order: 4
    action: Render a legacy six-question draft without interacting.
    expected: All six question values remain rendered, add is disabled, and no update
      callback occurs from load.
  expected_results:
  - The effective maximum for additions and localized count/tooltip is five.
  - Add is enabled below five and disabled at five or above.
  - Greeting/question edits and removal retain the existing update contract and unaffected
    values.
  - Legacy six-item drafts are not truncated or automatically saved.
  forbidden_side_effects:
  - Do not discard legacy questions, make a write during render, or introduce a backend
    schema/API change.
  unit_boundary: Real AgentGuide component with controlled Agent-store state; UI behavior
    is not replaced by a mocked child.
  inputs:
  - zero-question draft
  - four-question draft
  - five-question draft
  - legacy six-question draft
  - edit and remove interactions
  assertions:
  - The fifth addition appends one item and the add control disables at the boundary.
  - Removal from five retains the other values and permits a new addition.
  - Six question values render unchanged without a load-time update.
  - Counter translation receives maximum5 and edits preserve expected payload values.
  execution:
    profiles:
    - name: mock
      required_services: []
- case_id: AGENT-CONFIG-D1-003
  feature_id: AGENT-CONFIG-LAYOUT
  requirement_ids:
  - AGENT-CONFIG-REQ-002
  business_rule_ids:
  - AGENT-CONFIG-RULE-001
  - AGENT-CONFIG-RULE-005
