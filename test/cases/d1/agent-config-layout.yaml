  title: Render ordered selected tool and child-Agent rows with actionable resource
    entries and preserved configuration/removal
  type: FE-COMP
  priority: P1
  status: active
  automation: automated
  objective: Execute the real resource-add control, ToolManagement and CollaborativeAgent
    to prove empty-entry compatibility, ordered compact selected rows, real metadata,
    configuration/removal callbacks and read-only behavior without render-time writes.
  preconditions:
  - Render the actual new or existing resource-add presentation with empty resources
    and explicit association/create callbacks.
  - Mock existing resource services/state without replacing the add control or owning
    resource component.
  - Render real populated ToolManagement and CollaborativeAgent in high-fidelity
    mode with logical catalog, saved child-version, internal/external relation and
    read-only fixtures; keep store/service hooks controlled.
  test_data:
    association_count: 0
    reference_row_width: 1213
    reference_entry_width: 602.5
    entry_height: 48
    grid_gap: 8
    selected_tools:
      asset_ref: selected_tools_with_managed_knowledge_tool
    selected_child_agents:
      asset_ref: selected_internal_external_agents_with_saved_versions
    selected_row:
      height: 48
      radius: 4
      border_color: "#DFDFDF"
      horizontal_padding: 12
      vertical_padding: 8
      name_font_size: 14
      name_line_height: 22
      name_font_weight: 400
      name_color: "#191919"
      tag_font_size: 12
      tag_line_height: 18
      tag_color: "#777777"
      content_gap: 8
      tool_icon_size: 24
      child_avatar_size: 32
      action_target_size: 24
      action_glyph_size: 14
  steps:
  - order: 1
    action: Render the empty resource module without interacting.
    expected: A two-column row contains a first-column add entry with48px height,
      radius8, padding8/12 and3%
  - order: 2
    action: Activate the add entry.
    expected: The association-selection path opens exactly once, with creation/manage
      callback untouched.
  - order: 3
    action: Activate the separate new/manage action.
    expected: The creation/management path opens with association callback untouched.
  - order: 4
    action: Repeat with a read-only resource module.
    expected: Mutation actions are disabled and do not invoke association/create callbacks.
  - order: 5
    action: Render populated tool and child-Agent modules, including missing optional
      labels, a managed knowledge tool and a saved child version differing from the
      latest catalog version.
    expected: Visible resources keep their selection order in a two-column grid;
      names and real neutral tags share compact48px rows, full names and saved child
      versions remain available in tooltips, the add entry follows selected rows,
      managed knowledge tools remain hidden without removal from state, and rendering
      makes no mutation or relation request.
  - order: 6
    action: Open settings on a configurable selected tool, remove one selected tool,
      then remove an internal and an external child Agent through their existing
      actions.
    expected: Tool configuration retains canonical parameters and prerequisites;
      tool removal preserves other tools including managed knowledge tools; internal
      removal updates matching ID/relation entries without changing other snapshots;
      external removal uses the existing relation-service callback and only updates
      selection on its successful result.
  - order: 7
    action: Render populated read-only and default-mode modules and attempt disabled
      selected-row actions.
    expected: Read-only tool settings/removal and child removal do not mutate state;
      default mode retains its grouped tool and internal/external child presentation,
      and missing optional catalog labels produce no invented tag values.
  expected_results:
  - Add remains in the left column and does not become a full-width dashed placeholder.
  - Measured48px height,8px gap/radius and3% background are represented by the actual
    control.
  - Association and creation callbacks are separate and permission gated.
  - Real selected tool and child-Agent rows use the frozen common shell, names/tags,
    icon/avatar sizes and always-visible24px action targets, followed by the add entry.
  - Real labels, full names and saved child versions remain available without invented
    screenshot data; managed knowledge tools stay in state but are not displayed.
  - Configuration and internal/external removals retain existing callbacks, unaffected
    selections and read-only gates; default presentation remains compatible.
  forbidden_side_effects:
  - Do not persist a resource, duplicate associations, or call a creation API merely
    by rendering or opening selection.
  - Do not remove managed knowledge tools, overwrite retained child versions, fabricate
    optional metadata, or restyle knowledge rows/association drawers.
  unit_boundary: Actual resource-add control, ToolManagement and CollaborativeAgent
    rendered with Ant Design providers and existing query/store/service hooks controlled;
    selected-row components and actions are not replaced by mocks.
  inputs:
  - empty resources
  - association callback
  - creation callback
  - read-only state
  - ordered populated tool and child-Agent selections
  - managed knowledge tool
  - canonical tool parameters and missing optional labels
  - saved child version and internal/external removal results
  - default presentation mode
  assertions:
  - Two-column layout and first-column add entry retain measured styling.
  - Add and create interactions each call only their own workflow.
  - Render and disabled controls issue no mutation callback.
  - Selected rows represent the frozen shell/name/tag/icon/action contract and preserve
    selected order with the add entry last.
  - Settings opens the actual existing tool configuration path; removals change only
    intended selections/relations and preserve managed knowledge tools and other snapshots.
  - Read-only prevents selected-row mutations; missing optional metadata stays absent;
    saved-version/full-name tooltips and default presentation remain available.
  source:
    bug_ids: [AGENT-CONFIG-BUG-001]
    handoff: docs/handoffs/2026-10-10-selected-tools-child-agents.md
  execution:
    profiles:
    - name: mock
      required_services: []
- case_id: AGENT-CONFIG-D1-005
