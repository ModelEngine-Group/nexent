schema_version: '1.0'
stage: D1
module: AIDP-KNOWLEDGE
cases:
  - case_id: AKPR-D1-013
    feature_id: AKPR-001
    requirement_ids: [AKPR-001]
    business_rule_ids: [AKPR-RULE-001, AKPR-RULE-002, AKPR-RULE-015]
    title: Overview tutorial and knowledge cards follow the approved visual hierarchy
    type: FE-COMP
    priority: P0
    status: active
    automation: automated
    objective: Verify the overview structure keeps clear guide spacing and the prototype card layout without changing the shared list state.
    preconditions:
      - Render the AIDP overview with four knowledge bases and a 1382-pixel desktop viewport.
    test_data: {profile: mock, viewport_width: 1382, card_count: 4}
    steps:
      - order: 1
        action: Render the expanded guide.
        expected: The explanation heading and paragraph are distinct from three step cards with at least 24 pixels of separation.
      - order: 2
        action: Inspect one knowledge card.
        expected: The fixed icon, name and menu occupy the first row, description uses the full card width, and update time, file count and capacity share one footer row.
      - order: 3
        action: Render a final page with fewer cards.
        expected: Remaining cards keep the same width and height and the page footer stays at the bottom of the content area.
    expected_results:
      - Tutorial content has readable vertical separation and matches the three-step design.
      - Card descriptions do not share a narrow icon column.
      - Card metadata aligns on one row and cards do not stretch to fill unused grid space.
    forbidden_side_effects:
      - No fabricated timestamps, file counts or capacity values are rendered.
      - No ES page component or global style changes are required.
    unit_boundary: AIDP guide and card DOM structure at desktop viewport
    inputs: [expanded guide, card metadata, short final page]
    assertions:
      - The guide paragraph and step cards have a rendered gap of at least 24 pixels.
      - Every card exposes one footer row containing update time, document count and capacity.
      - Card grid uses auto-fit columns and a short last page leaves card dimensions unchanged.
  - case_id: AKPR-D1-014
    feature_id: AKPR-001
    requirement_ids: [AKPR-001]
    business_rule_ids: [AKPR-RULE-010, AKPR-RULE-016, AKPR-RULE-017]
    title: Creation page uses 18px titles and submits directly from its single form
    type: FE-COMP
    priority: P0
    status: active
    automation: automated
    objective: Verify the AIDP create page uses the approved title sizes and single-page submit flow while keeping section controls aligned.
    preconditions:
      - Render the AIDP creation page at desktop width with a valid mock create response.
    test_data: {profile: mock, viewport_width: 1382, chunk_modes: [0, 1]}
    steps:
      - order: 1
        action: Render the page header and form.
        expected: The creation form uses the available content width; breadcrumb labels are 18px and no step indicator or optional upload stage is rendered.
      - order: 2
        action: Inspect graph and VLM toggle groups.
        expected: Each switch sits beside its corresponding label and help icon.
      - order: 3
        action: Inspect section headings and fields that share a row.
        expected: Both controls use the same label structure and their input or slider starts differ by no more than one pixel.
      - order: 4
        action: Fill required fields and submit the create form.
        expected: One create request is sent, no upload request is sent, and success navigates to the created knowledge base detail page.
      - order: 5
        action: Render the detail information tab for a seeded knowledge base.
        expected: The detail breadcrumb and configuration, graph and permission section headings use 18px text.
    expected_results:
      - No fixed narrow modal-sized content column constrains the create page.
      - The create breadcrumb title and form section headings use 18px text.
      - The form creates the knowledge base directly without an intermediate step or upload stage.
      - Switches are adjacent to their own labels rather than the far edge of the row.
      - Paired model, chunking and retrieval controls align consistently.
    forbidden_side_effects:
      - No global Ant Design or ES knowledge-base style override is introduced.
      - No change to values submitted for chunk_mode 0 or 1.
    unit_boundary: AIDP create form title, direct-submit flow, section layout and toggle grouping
    inputs: [desktop viewport, graph toggle, VLM toggle, paired model controls, valid create response]
    assertions:
      - The creation header and form fill the available page content width.
      - The current create breadcrumb and section heading computed font sizes are 18px.
      - The current detail breadcrumb and detail information section heading computed font sizes are 18px.
      - No stepper or optional-upload control is rendered; one submit calls create once and does not call upload.
      - Switches are grouped within 12 pixels of their labels.
      - Paired controls use consistent label and field alignment.
  - case_id: AKPR-D1-015
    feature_id: AKPR-001
    requirement_ids: [AKPR-001]
    business_rule_ids: [AKPR-RULE-018]
    title: AIDP import drawer uploads on selection and keeps results until confirmation
    type: FE-COMP
    priority: P0
    status: active
    automation: automated
    objective: Verify selection immediately uploads valid files, actual transfer progress is distinct from AIDP acceptance, and Confirm closes without a second upload.
    preconditions:
      - Render the import drawer with a writable mock knowledge base and a mocked upload API response.
    test_data: {profile: mock, file: guide.txt, upload_bytes: [716800, 2621440]}
    steps:
      - order: 1
        action: Select multiple supported files together.
        expected: One multipart batch starts automatically; every row has a dashed gray border and Confirm is disabled while the request is active.
      - order: 2
        action: Report intermediate progress, then complete browser transfer without resolving the upload response.
        expected: Each uploading ring shows the same batch percentage; the second line only shows the file size. Transfer completion changes rings to waiting indicators, borders stay dashed, Confirm remains disabled, and no delete action is present.
      - order: 3
        action: Resolve the upload response as accepted.
        expected: The row changes to a solid near-black border and the accepted file id is passed to the parent refresh flow; the drawer remains open.
      - order: 4
        action: Click Confirm.
        expected: The drawer closes and no additional upload request is sent.
    expected_results:
      - Choosing a valid file immediately uploads it through the existing AIDP route.
      - Progress text and ring are derived from the upload event, not a timer.
      - A successful response changes the row border to solid near-black.
      - Results remain visible until Confirm, which never sends files again.
    forbidden_side_effects:
      - No per-file transferred-byte text or batch-progress label is rendered.
      - No retry action is rendered in the import row.
      - No change to the ES upload component.
    unit_boundary: AIDP import drawer automatic upload, progress, result retention and confirmation
    inputs: [mock knowledge base, supported file, progress event, accepted upload response]
    assertions:
      - The upload API is called on selection and not on confirmation.
      - The rows share batch percentage rings and display only their own total file sizes while uploading.
      - Mixed responses map by file name; accepted rows become solid near-black and are reported to their parent. Only failed rows show delete; deleting removes a frontend row without any network call. Network errors mark all rows failed and enable Confirm. A 50-file selection makes one request, and further batches contain only newly selected files.
