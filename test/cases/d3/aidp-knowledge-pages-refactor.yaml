schema_version: '1.0'
stage: D3
module: AIDP-KNOWLEDGE
cases:
  - case_id: AKPR-D3-001
    feature_id: AKPR-001
    requirement_ids: [AKPR-001]
    business_rule_ids: [AKPR-RULE-011, AKPR-RULE-013]
    title: Real AIDP create and readback close the loop
    type: INTEGRATION
    priority: P0
    status: blocked
    automation: automated
    objective: Verify against a reachable AIDP service that a created knowledge base returns the submitted chunking, retrieval and graph configuration.
    preconditions:
      - A reachable AIDP service accepts Nexent credentials.
      - A disposable tenant and user group are available.
    test_data: {profile: real_smoke, chunk_mode: 0}
    steps:
      - order: 1
        action: Create a knowledge base with chunking, retrieval and graph configuration through the Nexent proxy.
        expected: The upstream accepts the payload and returns a knowledge base identifier.
      - order: 2
        action: Read the created knowledge base back.
        expected: The chunking, retrieval and graph values match the submitted configuration.
    expected_results:
      - Submitted configuration is readable from the upstream.
    forbidden_side_effects:
      - No duplicate knowledge base created by retries.
      - No permission row created without its knowledge base.
      - No test data left in a shared tenant.
    integration_boundary:
      - Nexent AIDP knowledge base proxy
      - Upstream AIDP knowledge base API
      - Nexent AIDP permission store
    observations:
      - Outgoing create payload field names and types
      - Readback values per configuration group
      - Permission row and configuration readback after creation
    cleanup:
      - Delete the created knowledge base through the proxy.
      - Remove local permission rows and document tag associations created by the case.
    execution:
      profiles:
        - name: real_smoke
          required_services: [knowledge-provider]
  - case_id: AKPR-D3-002
    feature_id: AKPR-001
    requirement_ids: [AKPR-001]
    business_rule_ids: [AKPR-RULE-012]
    title: Real model categories return only their own models and survive readback
    type: INTEGRATION
    priority: P0
    status: blocked
    automation: automated
    objective: Verify against a reachable AIDP service that each model control receives its own category and that a configuration selected from real models is accepted and readable. This case stays blocked until a real AIDP environment with a model inventory is reachable.
    preconditions:
      - A reachable AIDP service exposes llm, vlm and embedding model inventories.
      - At least one model exists in the llm and vlm categories.
    test_data: {profile: real_smoke, categories: [llm, vlm, embedding]}
    steps:
      - order: 1
        action: Query each model category through the Nexent proxy.
        expected: Each response contains only models of the requested category and scope.
      - order: 2
        action: Create a knowledge base using a real llm model for the graph and a real vlm model for multimodal captioning.
        expected: The upstream accepts both model fields.
      - order: 3
        action: Read the knowledge base back.
        expected: The graph and multimodal model fields match the submitted values.
    expected_results:
      - Category queries stay separated.
      - Both model fields are accepted and readable.
      - No unverified default model replaces a missing selection.
    forbidden_side_effects:
      - No model from one category submitted through another category control.
      - No credential exposed to the browser.
      - No change to non-AIDP model configuration.
    integration_boundary:
      - Nexent AIDP model query proxy
      - Upstream AIDP model inventory API
      - Nexent AIDP knowledge base create path
    observations:
      - Requested category per query
      - Returned model identifiers and their categories
      - Readback values for both model fields
    cleanup:
      - Delete the created knowledge base through the proxy.
      - Discard recorded model identifiers that are environment specific.
    execution:
      profiles:
        - name: real_smoke
          required_services: [knowledge-provider]
