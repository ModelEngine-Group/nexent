schema_version: '1.0'
module:
  id: AIDP-KNOWLEDGE
  name: AIDP knowledge base
  description: AIDP knowledge base overview, file view and single-page creation form inside the Nexent frontend, including the AIDP-only branch selected by the deployment flag.
features:
  - feature_id: AKPR-001
    name: AIDP knowledge base list and creation page refactor
    status: active
    description: AIDP knowledge bases are listed in a card or table overview with an independent name search, a collapsible three-step guide and a full-page file view per knowledge base; creation uses one dedicated full-page form for permissions, chunking, retrieval, graph and model configuration, submits directly, and leaves file upload to the detail page. The ES knowledge base path stays untouched.
    business_rules:
      - rule_id: AKPR-RULE-001
        description: The overview renders a knowledge base guide with the fixed steps "create knowledge base, upload files, configure the knowledge base in an agent"; the guide collapses and reopens without losing the rest of the page state.
      - rule_id: AKPR-RULE-002
        description: The overview defaults to the card view and can switch to a table; both views project the same permission-scoped, server-paginated result set and switching never calls a mutating endpoint.
      - rule_id: AKPR-RULE-003
        description: The independent name search reuses the existing keyword query, resets to the first page on change and restores the unfiltered set when cleared; no column-level search or filter exists in this version.
      - rule_id: AKPR-RULE-004
        description: The table exposes a column visibility setting that hides and restores optional columns, keeps the name and action columns available, and never mutates backend state.
      - rule_id: AKPR-RULE-005
        description: Selecting a knowledge base opens a full-page file view for that base only; returning restores the previous search, page, view mode and column setting, and a delayed response from a previously opened base never overwrites the current one.
      - rule_id: AKPR-RULE-006
        description: Displayed metadata uses real response values, except the creator name resolves the Nexent permission owner in the current tenant; unknown or missing owners render as an em dash. The personal/enterprise type comes from AIDP rather than Nexent group permission. Update time, file count and capacity remain unchanged in this integration fix.
      - rule_id: AKPR-RULE-007
        description: Existing EDIT and READ_ONLY permissions, unavailable resource states and the hidden modification entry points for them are preserved in both overview and file view.
      - rule_id: AKPR-RULE-008
        description: The AIDP page selection by the deployment flag stays isolated; ES deployments keep rendering the original ES knowledge base components and the new AIDP guide, overview and file view never enter that render path.
      - rule_id: AKPR-RULE-009
        description: File upload, processing-status polling, download and deletion inside the AIDP file view keep their permission gates, expose partial-failure feedback, and clean up their polling state when the view is left.
      - rule_id: AKPR-RULE-010
        description: Creation uses one dedicated full-page form for name, description, permission, user groups and configuration; the create action submits the knowledge base directly without a step indicator or optional upload stage, and file upload remains available from the detail page.
      - rule_id: AKPR-RULE-011
        description: Chunking submits chunk_mode 0 for smart splitting and 1 for legal clauses, converts the overlap percentage to floor(tokens * percent / 100) integer tokens bounded by 50 percent of the chunk size, and keeps the existing default chunking values.
      - rule_id: AKPR-RULE-012
        description: One KnowledgeBase ModelService query populates LLM, VLM and embedding controls by model_type; display_name is displayed and model_name is submitted. Graph defaults, choices, constraints and domain prompts come from GraphConfigTemplate, queried by language. Domain or language changes update an unchanged default prompt and preserve manually edited text, with an explicit restore action. Configuration errors block graph-enabled creation. Disabling a capability omits its hidden configuration.
      - rule_id: AKPR-RULE-013
        description: Graph configuration is a JSON string containing the seven live template keys plus llm_model_name; hop count is a string, switches are Chinese 是 or 否, language and domain use Chinese values, and prompt length is 1 to 4096 characters. Thinking maps inversely onto no_think_mode. No graph Top K is displayed or submitted; the outer knowledge-base topk remains supported. Tooltips use the recorded AIDP screenshots without renaming existing fields.
      - rule_id: AKPR-RULE-015
        description: The overview guide uses a rounded pale-blue gradient introduction area, a configuration-flow heading and three 156px-high step cards separated by 16px gaps; the knowledge-base cards keep a fixed Nexent icon, a full-width two-line description, and update time, document count and capacity on one aligned footer row, with stable card and right-aligned pagination geometry. Fonts and icons retain Nexent conventions.
      - rule_id: AKPR-RULE-016
        description: The full-page creation form follows the designed section order and spacing; page and section titles use 18px text; graph and VLM switches sit beside their labels, same-row fields align, and the chunking and retrieval controls retain slider layout and consistent value widths.
      - rule_id: AKPR-RULE-017
        description: The current breadcrumb title on the create and detail pages and the detail information section headings use 18px text while ancestor breadcrumb links remain visually secondary.
      - rule_id: AKPR-RULE-018
        description: Selecting or dropping files immediately sends one multipart batch through Nexent to AIDP. Each uploading row displays the batch transfer percentage on its icon and only its total file size below its name. Keep dashed borders until per-file acceptance; success is solid near-black. Only failed rows expose a local delete action. Confirm and all close controls stay disabled until requests return success or failure; Confirm only dismisses results. Preserve the 50-file cap and independent scrolling.
    required_test_stages: [D1, D2, D3, D4, D5]
    source:
      requirement_ids: [AKPR-001]
      spec_path: nexent-doc/nexent/knowledge-base-pages-refactor/proposal.md
