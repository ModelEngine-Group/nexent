# pytest configuration file
[pytest]
# Automatically detect and handle async test functions
asyncio_mode = auto
# Create a new event loop for each test function to ensure isolation
asyncio_default_fixture_loop_scope = function
# Keep the cache OUTSIDE the repository checkout tree.  Previously it
# landed at test/.pytest_cache inside the workspace, so GitHub Actions'
# post-job workspace cleanup hit root-owned leftover files from tests
# that spawn subprocesses.  Leaving it in /tmp keeps pytest caches fast
# while making the directory invisible to post-job git-clean.
cache_dir = $TMPDIR/pytest-cache
# Configure warning filters to ignore all warnings
filterwarnings =
    # Disable all warnings
    ignore

# Custom markers
markers =
    local_only: marks tests that require external resources (API keys, network) and should only run locally (deselect with '-m "not local_only"')
