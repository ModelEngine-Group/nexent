# Default values for nexent helm chart.
global:
  # Kubernetes SYSTEM execution is opt-in.
  sandboxProvider: "kubernetes"
  # Only for local verification; sandbox Pods stay on the Runtime node.
  sandboxSingleNodeDevelopment: false
  # Confirm only after the target cluster passes the network-policy negative probe.
  sandboxNetworkPolicyVerified: true
  # Deployment scripts keep business Pods stopped until bootstrap succeeds.
  businessPaused: false
  bootstrapRunId: ""
  systemBootstrapTimeoutSeconds: 1800
  namespace: nexent
  dataDir: "/var/lib/nexent-data"
  sharedStorage:
    mode: "dynamic"
    # An empty value lets Kubernetes select the default StorageClass.
    storageClassName: ""
    accessModes:
      - ReadWriteMany
    workspace:
      size: "10Gi"
      localPath: "/var/lib/nexent"
      existingClaim: "nexent-workspace"
    skills:
      size: "5Gi"
      localPath: "/var/lib/nexent-data/skills"
      existingClaim: "nexent-skills"
    memoryPlugins:
      size: "5Gi"
      localPath: "/var/lib/nexent-data/memory-provider-plugins"
      existingClaim: "nexent-memory-plugins"
    logs:
      size: "5Gi"
      localPath: "/var/lib/nexent-data/logs"
      existingClaim: "nexent-logs"
    trajectory:
      size: "50Gi"
      localPath: "/var/lib/nexent-data/trajectory"
      existingClaim: "nexent-trajectory"
    projectConfig:
      size: "1Gi"
      localPath: "/var/lib/nexent-data/project-config"
      existingClaim: "nexent-project-config"
    sshKeys:
      size: "1Gi"
      localPath: "/var/lib/nexent-data/nexent-ssh-keys"
      existingClaim: "nexent-ssh-keys"
  deploymentVersion: "full"
  deploymentComponents:
    infrastructure: false
    application: true
    data-process: true
    terminal: false
    monitoring: false
  portPolicy: "development"
  imageSource: "registry"
  monitoring:
    enabled: false
    provider: otlp
    localFileEnabled: true
    trajectoryRootDir: "/mnt/nexent-data/trajectory"
    trajectoryReadEnabled: false
    projectName: "nexent"
    serviceName: nexent-backend
    otlpEndpoint: http://nexent-otel-collector:4318
    otlpTracesEndpoint: ""
    otlpMetricsEndpoint: ""
    otlpProtocol: http
    otlpHeaders: ""
    otlpAuthorization: ""
    otlpApiKey: ""
    otlpLangfuseIngestionVersion: ""
    langsmithApiKey: ""
    langsmithProject: "nexent"
    otlpMetricsEnabled: true
    instrumentRequests: false
    fastapiIncludedUrls: "/agent/run,/conversation/generate_title,/nb/v1/generate_title"
    fastapiExcludedUrls: ""
    fastapiExcludeSpans: "receive,send"
    dashboardUrl: ""
    dashboardAllowedRoles: "SU,SPEED"
    telemetrySampleRate: "1.0"
    traceContentMode: "full"
    traceMaxChars: "4000"
    traceMaxItems: "20"

# Optional monitoring stack. Set provider to one of:
# otlp, phoenix, langfuse, langsmith.
nexent-common:
  # Shared ConfigMap values rendered into the Kubernetes nexent-config ConfigMap.
  config:
    cas:
      enabled: "false"
      serverUrl: ""
      validatePath: "/p3/serviceValidate"
      callbackBaseUrl: "http://localhost:30000"
      # Supported values:
      # - disabled: disable CAS login entry and automatic CAS redirects.
      # - button: show CAS as an optional login entry.
      # - force: automatically redirect unauthenticated users to CAS login.
      loginMode: "disabled"
      userAttribute: ""
      emailAttribute: "email"
      roleAttribute: "role"
      defaultRole: "USER"
      tenantAttribute: "tenant_id"
      defaultTenantId: "tenant_id"
      roleMapJson: ""
      sessionMaxAgeSeconds: "3600"
      localSessionMaxAgeSeconds: "3600"
      heartbeatUrl: ""
      heartbeatIntervalSeconds: "300"
      heartbeatCookieName: ""
      renewBeforeSeconds: "300"
      renewTimeoutSeconds: "10"
      syntheticEmailDomain: "cas.local"
      logoutUrl: ""
      sslVerify: "true"
      caBundle: ""

nexent-config:
  enabled: true
  replicaCount: 1
nexent-ops:
  enabled: true
nexent-runtime:
  enabled: true
  replicaCount: 3
nexent-mcp:
  enabled: true
nexent-gateway:
  enabled: true
  replicaCount: 1
nexent-web:
  enabled: true
  replicaCount: 1
  config:
    fileUploadSizeLimit: "10"
nexent-data-process:
  enabled: true
nexent-openssh:
  enabled: false
nexent-monitoring:
  enabled: false

# Ingress configuration
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: nexent.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: nexent-tls
  #    hosts:
  #      - nexent.local
