replicaCount: 1

images:
  backend:
    repository: nexent/nexent
    tag: latest
    pullPolicy: IfNotPresent

config:
  logLevel: info
  isDebug: "false"
  logMaxBytes: 52428800
  logRotationInterval: 1
  logBackupCount: 30

logs:
  existingClaim: nexent-logs

service:
  type: NodePort
  port: 5016
  nodePort: 30016

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
