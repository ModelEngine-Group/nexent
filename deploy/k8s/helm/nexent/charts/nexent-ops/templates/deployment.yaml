{{- $global := default dict .Values.global -}}
{{- $monitoring := default dict $global.monitoring -}}
{{- $localCapture := ternary (get $monitoring "localFileEnabled") true (hasKey $monitoring "localFileEnabled") | toString | lower -}}
{{- $trajectory := or (eq (toString $monitoring.trajectoryReadEnabled | lower) "true") (eq $localCapture "true") -}}
{{- $logs := dig "sharedStorage" "logs" (dict) $global -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexent-ops
  namespace: {{ default .Release.Namespace $global.namespace }}
  labels:
    app: nexent-ops
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: nexent-ops
  template:
    metadata:
      labels:
        app: nexent-ops
      annotations:
        checksum/nexent-backend-image: {{ dig "rolloutChecksums" "opsImage" "" $global | quote }}
        checksum/nexent-env: {{ dig "rolloutChecksums" "env" "" $global | quote }}
        checksum/ops-config: {{ dict "port" .Values.service.port "monitoring" $monitoring | toJson | sha256sum | quote }}
        {{- if $trajectory }}
        checksum/nexent-secret: {{ dig "rolloutChecksums" "authSecret" "" $global | quote }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: nexent-ops
          image: "{{ .Values.images.backend.repository }}:{{ .Values.images.backend.tag }}"
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          command:
            - /opt/nexent/scripts/start-ops.sh
            - python
            - -m
            - backend.http.ops_service
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          {{- if $trajectory }}
          envFrom:
            - configMapRef:
                name: nexent-config
            - secretRef:
                name: nexent-env
            - secretRef:
                name: nexent-monitoring-env
            - secretRef:
                name: nexent-secrets
          {{- end }}
          env:
            {{- if not $trajectory }}
            {{- range list "MONITORING_PROVIDER" "LOCAL_FILE_MONITORING_ENABLED" "TRAJECTORY_READ_ENABLED" }}
            - name: {{ . }}
              valueFrom:
                configMapKeyRef:
                  name: nexent-config
                  key: {{ . }}
            {{- end }}
            {{- end }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: LOG_DIR
              value: "/mnt/nexent-data/logs/$(POD_NAME)"
            - name: GATEWAY_AUTH_ENABLED
              value: "true"
            - name: OPS_PORT
              value: {{ .Values.service.port | quote }}
            {{- range list "LOG_LEVEL" "IS_DEBUG" "LOG_MAX_BYTES" "LOG_ROTATION_INTERVAL" "LOG_BACKUP_COUNT" "REDIS_URL" "OPS_MONITORING_ENABLED" "OPS_MONITORING_TIMEZONE" "OPS_MONITORING_REPLICAS" "OPS_POSTGRES_DB" }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: nexent-env
                  key: {{ . }}
                  optional: true
            {{- end }}
            {{- range list "POSTGRES_HOST" "POSTGRES_PORT" "POSTGRES_USER" "POSTGRES_DB" "JWT_ISSUER" }}
            - name: {{ . }}
              valueFrom:
                configMapKeyRef:
                  name: nexent-config
                  key: {{ . }}
            {{- end }}
            {{- range list "NEXENT_POSTGRES_PASSWORD" "JWT_SECRET" "GATEWAY_SIGNING_SECRET" }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: nexent-secrets
                  key: {{ . }}
                  {{- if eq . "GATEWAY_SIGNING_SECRET" }}
                  optional: true
                  {{- end }}
            {{- end }}
            - name: ELASTICSEARCH_HOST
              valueFrom:
                configMapKeyRef:
                  name: nexent-config
                  key: ELASTICSEARCH_HOST
                  optional: true
            - name: ELASTICSEARCH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nexent-secrets
                  key: ELASTICSEARCH_API_KEY
                  optional: true
            - name: NEXENT_SQL_STARTUP_MODE
              value: "off"
            - name: PYTHON_DOTENV_DISABLED
              value: "1"
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          resources:
{{ toYaml .Values.resources | indent 12 }}
          volumeMounts:
            - name: ops-logs
              mountPath: /mnt/nexent-data/logs
            {{- if $trajectory }}
            - name: ops-trajectory
              mountPath: {{ default "/mnt/nexent-data/trajectory" $monitoring.trajectoryRootDir | quote }}
            {{- end }}
      volumes:
        - name: ops-logs
          persistentVolumeClaim:
            claimName: {{ default .Values.logs.existingClaim $logs.existingClaim }}
        {{- if $trajectory }}
        - name: ops-trajectory
          persistentVolumeClaim:
            claimName: {{ default "nexent-trajectory" (dig "sharedStorage" "trajectory" "existingClaim" "" $global) }}
        {{- end }}
