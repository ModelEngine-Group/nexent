{{- $global := default dict .Values.global -}}
apiVersion: v1
kind: Service
metadata:
  name: nexent-ops
  namespace: {{ default .Release.Namespace $global.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector:
    app: nexent-ops
