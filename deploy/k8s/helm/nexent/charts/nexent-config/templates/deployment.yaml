{{- if ne (int .Values.replicaCount) 1 -}}
{{- fail "nexent-config must remain single-replica for startup task recovery" -}}
{{- end -}}
{{- if ne .Values.strategy.type "Recreate" -}}
{{- fail "nexent-config strategy.type must be Recreate for startup task recovery" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexent-config
  namespace: {{ .Values.global.namespace }}
  labels:
    app: nexent-config
  annotations:
    "helm.sh/hook-weight": "20"
spec:
  replicas: {{ ternary 0 .Values.replicaCount (default false .Values.global.businessPaused) }}
  strategy:
{{ toYaml .Values.strategy | indent 4 }}
  selector:
    matchLabels:
      app: nexent-config
  template:
    metadata:
      labels:
        app: nexent-config
      annotations:
        checksum/nexent-env: {{ dig "rolloutChecksums" "env" "" .Values.global | quote }}
        checksum/nexent-backend-image: {{ dig "rolloutChecksums" "backendImage" "" .Values.global | quote }}
        checksum/nexent-sql: {{ dig "rolloutChecksums" "sql" "" .Values.global | quote }}
    spec:
{{ include "nexent-config.podSpec" . | indent 6 }}
