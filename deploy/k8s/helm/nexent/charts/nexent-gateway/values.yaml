replicaCount: 1

strategy:
  type: RollingUpdate

images:
  backend:
    repository: nexent/nexent-gateway
    tag: latest
    pullPolicy: IfNotPresent

resources:
  backend:
    requests:
      memory: 256Mi
      cpu: 500m
    limits:
      memory: 2Gi
      cpu: 1

probes:
  startup:
    initialDelaySeconds: 30
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 60

services:
  northbound:
    type: NodePort
    nodePort: 30013
