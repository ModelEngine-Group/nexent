apiVersion: v1
kind: Secret
metadata:
  name: nexent-env
  namespace: {{ .Values.global.namespace }}
type: Opaque
data:
  {{- $rootData := deepCopy .Values.envFiles.rootData }}
  {{- if not (hasKey $rootData "NEXENT_MCP_INTERNAL_TOKEN") }}
  {{- $_ := set $rootData "NEXENT_MCP_INTERNAL_TOKEN" (.Values.secrets.mcpInternalToken | b64enc) }}
  {{- end }}
{{ toYaml $rootData | indent 2 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: nexent-monitoring-env
  namespace: {{ .Values.global.namespace }}
type: Opaque
data:
{{ toYaml .Values.envFiles.monitoringData | indent 2 }}
