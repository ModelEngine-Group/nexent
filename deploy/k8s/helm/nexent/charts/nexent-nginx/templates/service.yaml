{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: nexent-nginx
  namespace: {{ .Values.global.namespace }}
spec:
  type: {{ .Values.services.nginx.type }}
  ports:
    - port: 3000
      targetPort: 3000
      name: https
      {{- if eq .Values.services.nginx.type "NodePort" }}
      nodePort: {{ .Values.services.nginx.nodePort }}
      {{- end }}
  selector:
    app: nexent-nginx
{{- end }}

