{{- if .Values.enabled }}
{{- if and .Values.tls.cert .Values.tls.key }}
apiVersion: v1
kind: Secret
metadata:
  name: nexent-nginx-tls
  namespace: {{ .Values.global.namespace }}
type: Opaque
data:
  server.pem: {{ .Values.tls.cert | b64enc | quote }}
  server.key: {{ .Values.tls.key | b64enc | quote }}
{{- end }}
{{- end }}
