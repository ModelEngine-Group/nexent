{{- $global := default dict .Values.global -}}
{{- $sharedStorage := default dict $global.sharedStorage -}}
{{- $workspaceStorage := default dict $sharedStorage.workspace -}}
{{- $logsStorage := default dict $sharedStorage.logs -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexent-mcp
  namespace: {{ .Values.global.namespace }}
  labels:
    app: nexent-mcp
  annotations:
    "helm.sh/hook-weight": "20"
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: nexent-mcp
  template:
    metadata:
      labels:
        app: nexent-mcp
      annotations:
        checksum/nexent-env: {{ dig "rolloutChecksums" "env" "" .Values.global | quote }}
        checksum/nexent-auth: {{ dig "rolloutChecksums" "authSecret" "" .Values.global | quote }}
        checksum/nexent-backend-image: {{ dig "rolloutChecksums" "backendImage" "" .Values.global | quote }}
    spec:
      initContainers:
        - name: wait-for-management
          image: "{{ .Values.images.backend.repository }}:{{ .Values.images.backend.tag }}"
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - until curl --noproxy '*' -fsS http://nexent-config:5010/health/ready >/dev/null; do sleep 2; done
      containers:
        - name: nexent-mcp
          image: "{{ .Values.images.backend.repository }}:{{ .Values.images.backend.tag }}"
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          ports:
            - containerPort: 5011
              name: http
            - containerPort: 5015
              name: http-alt
          command:
            - /opt/nexent/scripts/start-backend.sh
            - python
            - -m
            - backend.http.mcp_service
          envFrom:
            - configMapRef:
                name: nexent-config
            - secretRef:
                name: nexent-env
            - secretRef:
                name: nexent-secrets
          env:
            - name: GATEWAY_AUTH_ENABLED
              value: "true"
            - name: GATEWAY_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: nexent-config
                  key: GATEWAY_SERVICE_URL
{{ include "nexent.backendPlatformEnv" . | indent 12 }}
            - name: NEXENT_SQL_STARTUP_MODE
              value: "off"
            - name: DEPLOYMENT_VERSION
              value: {{ .Values.global.deploymentVersion | quote }}
            - name: skip_proxy
              value: {{ .Values.config.skipProxy | quote }}
            - name: UMASK
              value: {{ .Values.config.umask | quote }}
          volumeMounts:
            - name: nexent-workspace
              mountPath: /mnt/nexent
            - name: nexent-logs
              mountPath: /mnt/nexent-data/logs
          resources:
            requests:
              memory: {{ .Values.resources.backend.requests.memory }}
              cpu: {{ .Values.resources.backend.requests.cpu }}
            limits:
              memory: {{ .Values.resources.backend.limits.memory }}
              cpu: {{ .Values.resources.backend.limits.cpu }}
          readinessProbe:
            tcpSocket:
              port: 5011
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            tcpSocket:
              port: 5011
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: nexent-workspace
          persistentVolumeClaim:
            claimName: {{ default "nexent-workspace" $workspaceStorage.existingClaim }}
        - name: nexent-logs
          persistentVolumeClaim:
            claimName: {{ default "nexent-logs" $logsStorage.existingClaim }}
