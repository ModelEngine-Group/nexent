replicaCount: 1

strategy:
  type: Recreate

images:
  backend:
    repository: nexent/nexent
    tag: latest
    pullPolicy: IfNotPresent

resources:
  backend:
    requests:
      memory: 256Mi
      cpu: 500m
    limits:
      memory: 2Gi
      cpu: 1

config:
  skipProxy: "true"
  umask: "0022"

probes:
  startup:
    initialDelaySeconds: 30
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 60

service:
  type: ClusterIP
