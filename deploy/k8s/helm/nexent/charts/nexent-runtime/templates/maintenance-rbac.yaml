{{- if and .Values.global.businessPaused .Values.global.maintenanceEpoch }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nexent-runtime-maintenance
  namespace: {{ .Values.global.namespace }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nexent-runtime-maintenance
  namespace: {{ .Values.global.namespace }}
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [nexent-runtime]
    verbs: [get]
  - apiGroups: ['']
    resources: [pods]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nexent-runtime-maintenance
  namespace: {{ .Values.global.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nexent-runtime-maintenance
subjects:
  - kind: ServiceAccount
    name: nexent-runtime-maintenance
    namespace: {{ .Values.global.namespace }}
{{- end }}
