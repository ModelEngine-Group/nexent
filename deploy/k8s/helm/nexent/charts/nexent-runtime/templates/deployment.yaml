{{- if ne .Values.strategy.type "Recreate" -}}
{{- fail "nexent-runtime strategy.type must be Recreate for idle deployments" -}}
{{- end -}}
{{- $global := default dict .Values.global -}}
{{- $sharedStorage := default dict $global.sharedStorage -}}
{{- $storageMode := default "dynamic" $sharedStorage.mode -}}
{{- if gt (int .Values.replicaCount) 1 -}}
  {{- if not (has $storageMode (list "dynamic" "existing")) -}}
    {{- fail "nexent-runtime multi-replica deployment requires dynamic or existing shared RWX storage" -}}
  {{- end -}}
  {{- if eq $storageMode "dynamic" -}}
    {{- if eq $sharedStorage.storageClassName "nexent-local" -}}
      {{- fail "nexent-runtime multi-replica deployment requires an RWX StorageClass in dynamic mode. The nexent-local class is for static volumes." -}}
    {{- end -}}
    {{- if not (has "ReadWriteMany" (default (list "ReadWriteMany") $sharedStorage.accessModes)) -}}
      {{- fail "nexent-runtime multi-replica deployment requires ReadWriteMany shared volume access" -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- $workspaceStorage := default dict $sharedStorage.workspace -}}
{{- $skillsStorage := default dict $sharedStorage.skills -}}
{{- $memoryPluginsStorage := default dict $sharedStorage.memoryPlugins -}}
{{- $logsStorage := default dict $sharedStorage.logs -}}
{{- $sshKeysStorage := default dict $sharedStorage.sshKeys -}}
{{- $sshKeysClaim := ternary (default "nexent-ssh-keys" $sshKeysStorage.existingClaim) "nexent-ssh-keys" (eq $storageMode "existing") -}}
{{- $mountSshKeys := dig "deploymentComponents" "application" true $global -}}
{{- $kubernetesSandbox := and (eq (default "docker" $global.sandboxProvider) "kubernetes") (ne (default "lightweight" $global.sandboxMode) "disabled") -}}
{{- $networkVerified := default false $global.sandboxNetworkPolicyVerified -}}
{{- if and $kubernetesSandbox (not (kindIs "bool" $networkVerified)) -}}
{{- fail "sandboxNetworkPolicyVerified must be a boolean" -}}
{{- end -}}
{{- if and $kubernetesSandbox (eq $storageMode "local") (not (default false $global.sandboxSingleNodeDevelopment)) -}}
{{- fail "Kubernetes sandbox requires verified CSI RWX storage; local storage is only allowed with sandboxSingleNodeDevelopment=true" -}}
{{- end -}}
{{- if and $kubernetesSandbox (not $networkVerified) -}}
{{- fail "Kubernetes sandbox requires an enforced NetworkPolicy; run the target-cluster negative probe before setting sandboxNetworkPolicyVerified=true" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexent-runtime
  namespace: {{ .Values.global.namespace }}
  labels:
    app: nexent-runtime
  annotations:
    "helm.sh/hook-weight": "20"
spec:
  replicas: {{ ternary 0 .Values.replicaCount (default false .Values.global.businessPaused) }}
  strategy:
{{ toYaml .Values.strategy | indent 4 }}
  selector:
    matchLabels:
      app: nexent-runtime
  template:
    metadata:
      labels:
        app: nexent-runtime
      annotations:
        checksum/nexent-env: {{ dig "rolloutChecksums" "env" "" .Values.global | quote }}
        checksum/nexent-secret: {{ dig "rolloutChecksums" "authSecret" "" .Values.global | quote }}
        checksum/nexent-backend-image: {{ dig "rolloutChecksums" "runtimeImage" "" .Values.global | quote }}
    spec:
      enableServiceLinks: false
{{- if eq (default "docker" $global.sandboxProvider) "kubernetes" }}
      serviceAccountName: nexent-runtime-sandbox
{{- end }}
      initContainers:
        - name: wait-for-management
          image: "{{ .Values.images.backend.repository }}:{{ .Values.images.backend.tag }}"
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - until curl --noproxy '*' -fsS http://nexent-config:5010/health/ready >/dev/null; do sleep 2; done
{{- if $mountSshKeys }}
          volumeMounts:
            - name: nexent-ssh-keys
              mountPath: /opt/ssh-keys
              readOnly: true
{{- end }}
{{- if $kubernetesSandbox }}
        - name: sandbox-workspace-permissions
          image: "{{ .Values.images.backend.repository }}:{{ .Values.images.backend.tag }}"
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
          envFrom:
            - configMapRef:
                name: nexent-config
            - secretRef:
                name: nexent-env
          command:
            - python
            - -c
            - |
              import os
              import sys
              from pathlib import Path
              sys.path.insert(0, '/opt/backend')
              from contracts.constants.environment import NEXENT_SANDBOX_EXECUTION_GID
              root = Path('/mnt/nexent')
              info = root.stat()
              if info.st_gid != NEXENT_SANDBOX_EXECUTION_GID:
                  os.chown(root, -1, NEXENT_SANDBOX_EXECUTION_GID)
              if info.st_mode & 0o2070 != 0o2070:
                  root.chmod((info.st_mode & 0o777) | 0o2070)
          volumeMounts:
            - name: nexent-workspace
              mountPath: /mnt/nexent
{{- if $mountSshKeys }}
            - name: nexent-ssh-keys
              mountPath: /opt/ssh-keys
              readOnly: true
{{- end }}
{{- end }}
      containers:
        - name: nexent-runtime
          image: "{{ .Values.images.backend.repository }}:{{ .Values.images.backend.tag }}"
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          ports:
            - containerPort: 5014
              name: http
          command:
            - /opt/nexent/scripts/start-backend.sh
            - python
            - -m
            - backend.http.runtime_service
          envFrom:
            - configMapRef:
                name: nexent-config
            - secretRef:
                name: nexent-env
            - secretRef:
                name: nexent-monitoring-env
            - secretRef:
                name: nexent-secrets
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: LOG_DIR
              value: "/mnt/nexent-data/logs/$(POD_NAME)"
            - name: GATEWAY_AUTH_ENABLED
              value: "true"
{{ include "nexent.backendPlatformEnv" . | indent 12 }}
            - name: NEXENT_RUNTIME_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NEXENT_RUNTIME_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NEXENT_RUNTIME_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: NEXENT_RUNTIME_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NEXENT_RUNTIME_CONTAINER_NAME
              value: "nexent-runtime"
            - name: NEXENT_SANDBOX_WORKSPACE_CLAIM
              value: {{ default "nexent-workspace" $workspaceStorage.existingClaim | quote }}
            - name: NEXENT_SANDBOX_WORKSPACE_MOUNT
              value: "/mnt/nexent"
            - name: NEXENT_SANDBOX_SINGLE_NODE_DEVELOPMENT
              value: {{ default false $global.sandboxSingleNodeDevelopment | toString | quote }}
            - name: NEXENT_SQL_STARTUP_MODE
              value: "off"
            - name: NEXENT_RECOVERY_MODE
              value: "fixed_replicas"
            - name: DEPLOYMENT_VERSION
              value: {{ .Values.global.deploymentVersion | quote }}
            - name: skip_proxy
              value: {{ .Values.config.skipProxy | quote }}
            - name: UMASK
              value: {{ .Values.config.umask | quote }}
          startupProbe:
            httpGet:
              path: /health/live
              port: 5014
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: 5014
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 5014
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: nexent-workspace
              mountPath: /mnt/nexent
{{- if $mountSshKeys }}
            - name: nexent-ssh-keys
              mountPath: /opt/ssh-keys
              readOnly: true
{{- end }}
            - name: nexent-skills
              mountPath: /mnt/nexent-data/skills
            - name: nexent-memory-plugins
              mountPath: /mnt/nexent-data/memory-provider-plugins
            - name: nexent-logs
              mountPath: /mnt/nexent-data/logs
            - name: nexent-trajectory
              mountPath: {{ default "/mnt/nexent-data/trajectory" .Values.global.monitoring.trajectoryRootDir | quote }}
          resources:
            requests:
              memory: {{ .Values.resources.backend.requests.memory }}
              cpu: {{ .Values.resources.backend.requests.cpu }}
            limits:
              memory: {{ .Values.resources.backend.limits.memory }}
              cpu: {{ .Values.resources.backend.limits.cpu }}
      volumes:
        - name: nexent-workspace
          persistentVolumeClaim:
            claimName: {{ default "nexent-workspace" $workspaceStorage.existingClaim }}
{{- if $mountSshKeys }}
        - name: nexent-ssh-keys
          persistentVolumeClaim:
            claimName: {{ $sshKeysClaim | quote }}
            readOnly: true
{{- end }}
        - name: nexent-skills
          persistentVolumeClaim:
            claimName: {{ default "nexent-skills" $skillsStorage.existingClaim }}
        - name: nexent-memory-plugins
          persistentVolumeClaim:
            claimName: {{ default "nexent-memory-plugins" $memoryPluginsStorage.existingClaim }}
        - name: nexent-logs
          persistentVolumeClaim:
            claimName: {{ default "nexent-logs" $logsStorage.existingClaim }}

        - name: nexent-trajectory
          persistentVolumeClaim:
            claimName: {{ default "nexent-trajectory" (default dict .Values.global.sharedStorage.trajectory).existingClaim }}
