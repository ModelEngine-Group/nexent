{{- if ne (int .Values.replicaCount) 1 -}}
{{- fail "nexent-runtime must remain single-replica for startup task recovery" -}}
{{- end -}}
{{- if ne .Values.strategy.type "Recreate" -}}
{{- fail "nexent-runtime strategy.type must be Recreate for startup task recovery" -}}
{{- end -}}
{{- $global := default dict .Values.global -}}
{{- $sqlFileNames := default dict $global.sqlFileNames -}}
{{- $sharedStorage := default dict $global.sharedStorage -}}
{{- $workspaceStorage := default dict $sharedStorage.workspace -}}
{{- $skillsStorage := default dict $sharedStorage.skills -}}
{{- $logsStorage := default dict $sharedStorage.logs -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexent-runtime
  namespace: {{ .Values.global.namespace }}
  labels:
    app: nexent-runtime
  annotations:
    "helm.sh/hook-weight": "20"
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
{{ toYaml .Values.strategy | indent 4 }}
  selector:
    matchLabels:
      app: nexent-runtime
  template:
    metadata:
      labels:
        app: nexent-runtime
      annotations:
        checksum/nexent-env: {{ dig "rolloutChecksums" "env" "" .Values.global | quote }}
        checksum/nexent-backend-image: {{ dig "rolloutChecksums" "backendImage" "" .Values.global | quote }}
        checksum/nexent-sql: {{ dig "rolloutChecksums" "sql" "" .Values.global | quote }}
    spec:
      containers:
        - name: nexent-runtime
          image: "{{ .Values.images.backend.repository }}:{{ .Values.images.backend.tag }}"
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          ports:
            - containerPort: 5014
              name: http
          command:
            - /opt/nexent/scripts/start-backend.sh
            - python
            - backend/runtime_service.py
          envFrom:
            - configMapRef:
                name: nexent-config
            - secretRef:
                name: nexent-secrets
          env:
            - name: NEXENT_SQL_STARTUP_MODE
              value: "wait"
            - name: DEPLOYMENT_VERSION
              value: {{ .Values.global.deploymentVersion | quote }}
            - name: skip_proxy
              value: {{ .Values.config.skipProxy | quote }}
            - name: UMASK
              value: {{ .Values.config.umask | quote }}
          startupProbe:
            httpGet:
              path: /health/live
              port: 5014
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: 5014
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 5014
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: nexent-sql-files
              mountPath: /opt/nexent/sql
              readOnly: true
            - name: nexent-workspace
              mountPath: /mnt/nexent
            - name: nexent-skills
              mountPath: /mnt/nexent-data/skills
            - name: nexent-logs
              mountPath: /mnt/nexent-data/logs
          resources:
            requests:
              memory: {{ .Values.resources.backend.requests.memory }}
              cpu: {{ .Values.resources.backend.requests.cpu }}
            limits:
              memory: {{ .Values.resources.backend.limits.memory }}
              cpu: {{ .Values.resources.backend.limits.cpu }}
      volumes:
        - name: nexent-sql-files
          configMap:
            name: nexent-sql-files
            items:
              - key: init.sql
                path: init.sql
              - key: migrations-.keep
                path: migrations/.keep
{{ range $name := default (list) $sqlFileNames.migrations }}
              - key: {{ printf "migrations-%s" $name | quote }}
                path: {{ printf "migrations/%s" $name | quote }}
{{ end }}
              - key: supabase-.keep
                path: supabase/.keep
{{ range $name := default (list) $sqlFileNames.supabase }}
              - key: {{ printf "supabase-%s" $name | quote }}
                path: {{ printf "supabase/%s" $name | quote }}
{{ end }}
        - name: nexent-workspace
          persistentVolumeClaim:
            claimName: {{ default "nexent-workspace" $workspaceStorage.existingClaim }}
        - name: nexent-skills
          persistentVolumeClaim:
            claimName: {{ default "nexent-skills" $skillsStorage.existingClaim }}
        - name: nexent-logs
          persistentVolumeClaim:
            claimName: {{ default "nexent-logs" $logsStorage.existingClaim }}
