# Independent authenticated edge; downstream services verify signed identities.
services:
  nexent-gateway:
    image: ${NEXENT_GATEWAY_IMAGE:-nexent/nexent-gateway:dev}
    build:
      context: ../../..
      dockerfile: deploy/images/dockerfiles/gateway/Dockerfile
    restart: unless-stopped
    entrypoint: ["python", "backend/gateway_service.py"]
    ports:
      - "${NEXENT_GATEWAY_PORT:-5016}:5013"
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      GATEWAY_DB_HOST: "${GATEWAY_DB_HOST:-${POSTGRES_HOST:-nexent-postgresql}}"
      GATEWAY_DB_PORT: "${GATEWAY_DB_PORT:-${POSTGRES_PORT:-5432}}"
      GATEWAY_DB_NAME: "${GATEWAY_DB_NAME:-${POSTGRES_DB:-nexent}}"
      GATEWAY_DB_USER: "${GATEWAY_DB_USER:-${POSTGRES_USER:-root}}"
      GATEWAY_DB_PASSWORD: "${GATEWAY_DB_PASSWORD:-${NEXENT_POSTGRES_PASSWORD:?PostgreSQL password is required}}"
      GATEWAY_DB_POOL_SIZE: "${GATEWAY_DB_POOL_SIZE:-8}"
      GATEWAY_DB_TIMEOUT: "${GATEWAY_DB_TIMEOUT:-5}"
      GATEWAY_AUTH_ENABLED: "true"
      GATEWAY_PORT: "5013"
      DEPLOYMENT_VERSION: "${DEPLOYMENT_VERSION:-full}"
      JWT_ISSUER: "${JWT_ISSUER:-nexent}"
      JWT_SECRET: "${JWT_SECRET:?Gateway requires the configured JWT_SECRET}"
      GATEWAY_SIGNING_SECRET: "${GATEWAY_SIGNING_SECRET:-}"
      GATEWAY_MANAGEMENT_URL: "http://nexent-config:5010"
      GATEWAY_RUNTIME_URL: "http://nexent-runtime:5014"
      GATEWAY_NORTHBOUND_URL: "http://nexent-config:5010"
    networks:
      - nexent
