[pytest]
testpaths = cases
python_files = test.py test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = --strict-markers --strict-config --import-mode=importlib
markers =
    case_id(value): exact formal case ID represented by the test
    stage(value): D1, D2, D3, or D5
    p0: blocking priority
    p1: important priority
    p2: non-blocking priority
    be_ut: backend unit behavior
    sdk_ut: SDK unit behavior
    fe_comp: frontend component behavior
    api_it: HTTP API integration
    contract: protocol/wire contract
    agent_it: real-model agent integration
    sec: security
    rel: reliability
    deploy: deployment
    special_id(value): D5 expanded special-matrix ID contributing evidence to a parent case
