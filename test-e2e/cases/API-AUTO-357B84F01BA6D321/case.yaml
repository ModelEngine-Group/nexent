  integration_boundary:
  - LOCAL_COMPONENTS_REQUIRED：依赖本地 PostgreSQL、本地 Elasticsearch/向量库与本地知识库文档；不访问真实 AIDP 或外部模型（aidp 仅用于验证 unsupported 降级路径）。
