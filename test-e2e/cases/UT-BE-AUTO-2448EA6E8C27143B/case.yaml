    - ${NEXENT_TEST_HOME}/config/secrets.env'
  assertions:
  - SU pending_review→rejected：返回 summary 且 status=rejected；create_repository_review_notification 以 review_status=rejected
    调用；因 current=pending_review，deactivate_notifications 被调用；reset_agent_repository_status 以 status=rejected 调用。
  - SU pending_review→shared：返回 status=shared；审核通知 review_status=shared；待审核通知去活被调用；peer 重置 status=shared。
  - SU shared→not_shared：返回 status=not_shared；因 not_shared 不在 {shared,rejected} 集合，不触发审核通知；因 current 非 pending_review 不去活待审核通知；peer
    重置 status=not_shared。
  - SU 非法迁移在 _validate_repository_status_transition 中因未命中 _SU_STATUS_TRANSITIONS 而抛出 ValueError，不产生任何 DB 更新或通知副作用。
  - 非法 status / 记录不存在 / rows_affected=0 均抛出 ValueError，不出现半写入、重复副作用或跨租户泄露。
  - 测试过程无未处理异常，日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
