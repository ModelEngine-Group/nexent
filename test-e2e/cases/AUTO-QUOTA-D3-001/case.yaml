  case_id: AUTO-QUOTA-D3-001
  feature_id: F-126
  requirement_ids:
  - CHAT-AUTOMATION-ACTIVITY-20261020
  business_rule_ids:
  - F-126-RULE-02
  title: Automation quota and activity through real persistence and list API
  type: INTEGRATION
  priority: P1
  status: active
  automation: automated
  objective: Automation quota and activity through real persistence and list API
  preconditions:
  - Repository dependencies and the declared controlled profile are available; fixtures are isolated.
  test_data:
    profile: mock
    identities:
    - owner
    - other
    histories:
    - ordinary
    - automation
    - mixed
    - deleted
    - older
    - newer
  steps:
  - order: 1
    action: Create ordinary and automation user rows through real services in isolated PostgreSQL, reaching the
      ordinary limit.
    expected: Automation appends above the ordinary limit; the next ordinary row is rejected; client-supplied source
      cannot bypass quota.
  - order: 2
    action: Persist assistant visible output and compare activity, administrative edits, HTTP list order, cursor
      and bucket counts.
    expected: Committed messages move an old owned history to the head; placeholder/admin writes do not; fresh clients
      receive consistent pagination and buckets.
  expected_results:
  - Automation appends above the ordinary limit; the next ordinary row is rejected; client-supplied source cannot
    bypass quota.
  - Committed messages move an old owned history to the head; placeholder/admin writes do not; fresh clients receive
    consistent pagination and buckets.
  forbidden_side_effects:
  - No production data/schema mutation, quota bypass by ordinary requests, loss of composer/stream state or changes
    to unrelated histories.
  integration_boundary:
  - Real automation adapter, conversation persistence, SQLAlchemy/PostgreSQL and FastAPI list router; authentication
    identity is controlled.
  observations:
  - Persisted source/activity, API order and errors, visible browser state or migration output.
  cleanup:
  - Dispose only the fixture schema, browser context and temporary test data.
  execution:
    profiles:
    - name: mock
      required_services: []
