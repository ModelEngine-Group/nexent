stage: D5
module: V5-BASELINE
case:
  case_id: REL-AUTO-D426EB1254C4E6BE
  feature_id: V5-REL-AUTO-D426EB1254C4E6BE
  business_rule_ids:
  - V5-REL-AUTO-D426EB1254C4E6BE-RULE-01
  title: MCP 管理 API 与容器日志流托管线程管理器的启停、优雅关闭、重启重建与异常不崩溃
  type: RELIABILITY
  priority: P1
  status: active
  automation: automated
  objective: MCP 管理服务与容器日志流由裸 Thread 重构为托管线程管理器后，若 register_service/start_service/cancel/shutdown/close_hook 语义不正确，会导致管理 API
    线程或日志流后台线程无法优雅退出、shutdown 未关闭日志流造成资源（线程/流句柄）泄漏、重启后残留旧线程、日志流线程异常导致进程崩溃。目标为验证正常启停、shutdown 时 close_hook 关闭日志流、无后台线程/日志流泄漏、重启后重建、故障不崩溃。
  preconditions:
  - MCP 后端源码：backend/mcp_service.py、backend/services/mcp_container_service.py；托管线程管理器：nexent.core.concurrency（ManagedThreadSpec/ManagedTaskSpec）与
    services/thread_lifecycle_service（线程管理器）；本地 Docker 或 Kubernetes 容器运行环境（用于容器日志流跟随拉取）；无外部模型依赖。
  test_data:
    legacy_asset_declaration: MCP 后端源码：backend/mcp_service.py、backend/services/mcp_container_service.py；托管线程管理器：nexent.core.concurrency（ManagedThreadSpec/ManagedTaskSpec）与
      services/thread_lifecycle_service（线程管理器）；本地 Docker 或 Kubernetes 容器运行环境（用于容器日志流跟随拉取）；无外部模型依赖。
  steps:
  - order: 1
    action: 前置：以本地 Docker/Kubernetes 环境启动 MCP 管理服务，调用 run_mcp_server_with_management()（backend/mcp_service.py:434-478），确认线程管理器
      start() 后 register_service 注册 mcp-management-api 后台任务（close_hook 将 uvicorn server.should_exit 置 True）并经 start_service
      启动，管理 API 在 5015 端口可访问。
    expected: 正常启动时 mcp-management-api 后台任务进入运行态，5015 端口可访问，容器日志流持续输出。
  - order: 2
    action: 调用 MCPContainerManager.stream_container_logs(container_id, follow=True)（backend/services/mcp_container_service.py:289-491），确认
      Kubernetes 与 Docker 分支均通过 thread_manager.register_service（close_hook=_close_stream）注册 *-mcp-log-stream 后台任务并 start_service，日志行持续输出。
    expected: 停止时 close_hook 生效（server.should_exit=True），管理 API 线程在 wait_timeout=5、shutdown timeout=15 内退出，无悬挂线程。
  - order: 3
    action: 触发 MCP 服务器停止使 run_mcp_server_with_management 进入 finally 分支，调用 mcp_thread_manager.cancel(management_execution.execution_id,
      wait_timeout=5) 并 shutdown(timeout=15)；验证 close_hook 将 server.should_exit 置 True、管理 API 线程退出、clear_default_thread_manager
      清理默认线程管理器，进程可优雅退出不挂起。
    expected: 日志流关闭时 close_hook=_close_stream 被调用且底层 stream.close() 执行，后台 *-mcp-log-stream 线程退出，无后台线程或日志流泄漏。
  - order: 4
    action: 关闭日志消费端（客户端断开或异步生成器被关闭，backend/services/mcp_container_service.py:387-392、478-483），finally 分支调用 thread_manager.cancel(execution.execution_id,
      wait_timeout=5) 触发 close_hook=_close_stream 调用底层 stream.close()（Docker/Kubernetes log stream），后台 *-mcp-log-stream 线程退出，无遗留阻塞线程或未关闭流。
    expected: 重启后线程管理器可重建并重新启动管理 API 与日志流，无残留或重复线程。
  - order: 5
    action: 重启重建：再次调用 run_mcp_server_with_management() 并再次 stream_container_logs，验证线程管理器可重新 start_service，管理 API 与日志流恢复正常，且无旧线程残留或重复注册。
    expected: 日志流线程内部异常被捕获并优雅退出，进程不崩溃、不向调用方泄漏未处理异常。
  - order: 6
    action: 故障注入：令日志流线程 _stream_logs_sync 在读取 log_stream 时抛异常，验证 except 分支捕获异常后向 log_queue 写入 None（backend/services/mcp_container_service.py:356-360、444-448），消费者正常结束并进入
      cancel 清理，进程不崩溃、无未处理异常外泄。
    expected: 日志流线程内部异常被捕获并优雅退出，进程不崩溃、不向调用方泄漏未处理异常。
  expected_results:
  - 正常启动时 mcp-management-api 后台任务进入运行态，5015 端口可访问，容器日志流持续输出。
  - 停止时 close_hook 生效（server.should_exit=True），管理 API 线程在 wait_timeout=5、shutdown timeout=15 内退出，无悬挂线程。
  - 日志流关闭时 close_hook=_close_stream 被调用且底层 stream.close() 执行，后台 *-mcp-log-stream 线程退出，无后台线程或日志流泄漏。
  - 重启后线程管理器可重建并重新启动管理 API 与日志流，无残留或重复线程。
  - 日志流线程内部异常被捕获并优雅退出，进程不崩溃、不向调用方泄漏未处理异常。
  forbidden_side_effects: []
