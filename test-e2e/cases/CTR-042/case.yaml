  preconditions:
  - Nexent服务与仓库受控A2A Mock就绪，无其他故障注入批次。
  - config/a2a.yaml符合统一Schema，控制令牌由既有环境或secrets.env提供。
  - 使用本次动态ID、唯一source URL及受控测试身份，不借用历史资源。
  test_data:
    configuration: config/a2a.yaml
    mock_service: a2a-agent
  steps:
  - order: 1
    action: 发现JWT卡片并保存受控损坏JWT
    expected: 配置可保存，不将格式检查误作真实认证
  - order: 2
    action: 经Nexent调用受保护Agent
    expected: 400并明确外部401；wire认证失败，不判成功
  - order: 3
    action: 提交非对象metadata
    expected: 422且不新增外部调用
  - order: 4
    action: 清理本次Agent
    expected: 回读404，保存脱敏wire
  expected_results:
  - 配置可保存，不将格式检查误作真实认证
  - 400并明确外部401；wire认证失败，不判成功
