    description: 仅待审迁入审核表，content/update_time/来源创建人映射正确；已上架和驳回不补造历史，Skill来源列保留。
    steps:
    - 1
    expected_results:
    - 1
    forbidden_side_effects:
    - 1
    - 2
  - id: AC-02
    description: 同一历史待审只导入一次；正式脚本不增删旧18列，原仓库内容与ID保留。
    steps:
    - 2
    expected_results:
    - 2
    forbidden_side_effects:
    - 1
    - 2
  - id: AC-03
    description: 异常中止并整体回滚，不出现先删列后丢申请，版本不得记成功。
    steps:
    - 3
    expected_results:
    - 3
    forbidden_side_effects:
    - 1
    - 2
  - id: AC-04
    description: 未适配客户端不切新读；不直接退回只读仓库的旧服务，保留审核数据与备份。
    steps:
    - 4
