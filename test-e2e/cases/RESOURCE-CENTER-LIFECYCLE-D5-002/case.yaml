  risk_type: DEPLOYMENT
  risk: 增量迁移破坏历史数据或新旧读写发布顺序失配
  condition:
  - 由统一准备工具建立一次性旧schema测试库；不得复用开发/生产库。
  - 本Case不改变应用启动flag或重部署用户栈；若实施需要互斥启动模式，先补deployment-exception和显式恢复选项。
  metrics:
  - 历史数据差异条数、schema契约差异数、新旧协议smoke失败数、测试库清理结果
  thresholds:
  - 旧表旧列与旧数据保留；新增列类型/nullability/default与设计一致，历史时间/说明/意见及来源为null，revision为0；迁移失败不得登记目标版本为成功。
  - 旧必需契约仍可读写，新字段不阻塞旧协议；保留新列与兼容后端，不执行drop列式回滚；写入结果可由新读正确读取。
  - 未确认旧写入者全部升级时新入口不得开放；回退到双写前后端之前必须停止新入口和新语义读取；清理完成。该Case不证明实际旧后端二进制已部署回退。
  - 新URL登记到原默认角色集合，运行时不依赖旧URL；新增submitted_user_id为VARCHAR(100)可空，历史保持NULL且不回填；普通用户审核中心不显示历史申请，原审核资格用户仍可读，重新提交后本人可见，原“我的”视图不变。
  recovery_expectations:
  - 失败只处理一次性测试库，保留诊断，不改用户运行环境；正式发布回退仍需task人工演练证据。
  observations: *id001
