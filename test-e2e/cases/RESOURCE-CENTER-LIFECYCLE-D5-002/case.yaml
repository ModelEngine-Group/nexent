schema_version: '1.0'
stage: D5
module: RESOURCE-CENTER
case:
  case_id: RESOURCE-CENTER-LIFECYCLE-D5-002
  feature_id: RESOURCE-CENTER-LIFECYCLE
  requirement_ids:
  - RESOURCE-CENTER-REQ-20261031
  business_rule_ids:
  - RESOURCE-CENTER-LIFECYCLE-RULE-016
  title: 隔离数据库增量迁移与旧协议回退兼容
  type: DEPLOYMENT
  priority: P0
  status: blocked
  automation: automated
  objective: D5部署边界验证迁移、历史数据和兼容回退；不自动重部署用户环境。
  preconditions:
  - 配置专用一次性数据库创建权限及本地兼容后端；先验证迁移和双写，再执行新协议，不执行用户环境重部署。
  - 在仓库外的隔离测试环境准备run_id及独立租户；禁止使用生产数据或记录密钥。
  - 使用真实产品鉴权、服务和持久层；外部依赖使用受控fixture；不要求真实模型调用。
  test_data:
    environment: 专用一次性PostgreSQL测试库；旧schema来自基线准备资产，目标schema由正式迁移入口按版本发现，不硬编码SQL路径。
  steps:
  - order: 1
    action: 准备三类型旧待审、已上架、驳回和历史Skill，执行正式版本迁移
    expected: 仅待审迁入审核表，content/update_time/来源创建人映射正确；已上架和驳回不补造历史，Skill来源列保留。
  - order: 2
    action: 重复执行迁移并核对结构与记录数量
    expected: 同一历史待审只导入一次；正式脚本不增删旧18列，原仓库内容与ID保留。
  - order: 3
    action: 构造来源、创建人、时间或快照缺失及重复同源待审，再执行迁移
    expected: 异常中止并整体回滚，不出现先删列后丢申请，版本不得记成功。
  - order: 4
    action: 核对旧写入者适配、停写备份和前向恢复限制
    expected: 未适配客户端不切新读；不直接退回只读仓库的旧服务，保留审核数据与备份。
  expected_results: &id001
  - 仅待审迁入审核表，content/update_time/来源创建人映射正确；已上架和驳回不补造历史，Skill来源列保留。
  - 同一历史待审只导入一次；正式脚本不增删旧18列，原仓库内容与ID保留。
  - 异常中止并整体回滚，不出现先删列后丢申请，版本不得记成功。
  - 未适配客户端不切新读；不直接退回只读仓库的旧服务，保留审核数据与备份。
  forbidden_side_effects:
  - 不得绕过审核表提前覆盖仓库内容或修改已完成申请。
  - 失败事务不得留下仓库半写入或丢失申请数据。
  tags:
  - resource-center
  - design-only
