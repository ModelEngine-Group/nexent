schema_version: '1.0'
stage: D2
module: AUTH-IDENTITY
case:
  case_id: CAS-DISPLAY-D2-001
  feature_id: CAS-USER-DISPLAY
  business_rule_ids: [CAS-DISPLAY-RULE-02, CAS-DISPLAY-RULE-03]
  title: User list and group member APIs preserve identity contracts with optional CAS metadata
  type: API-IT
  priority: P1
  status: active
  automation: automated
  objective: Verify real HTTP serialization and enrichment preserve legacy user/member fields and pagination.
  contract:
    protocol: HTTP API
    request_expectations:
    - POST /users/list
    - GET /groups/{group_id}/members
    response_expectations:
    - Existing status, identity values and pagination are preserved with optional CAS username fields.
  preconditions:
  - Authentication and database I/O are controlled; product routes and enrichment execute unchanged.
  test_data:
    profile: mock
    user_id: display-user
    email: member@example.test
    cas_username: 示例用户
  steps:
  - order: 1
    action: Request tenant users and group members with an active CAS identity.
    expected: Existing emails and IDs remain unchanged, optional usernames are returned, and pagination is unchanged.
  - order: 2
    action: Repeat requests when CAS enrichment raises an exception.
    expected: The original successful responses remain available without fabricated usernames.
  expected_results:
  - User and member responses retain legacy IDs/emails and supply optional CAS username metadata.
  - Lookup failures preserve response status, original values and pagination.
  forbidden_side_effects:
  - No account writes, identity substitutions, or filter/pagination changes.
  acceptance:
  - id: AC-01
    description: Preserve legacy identity and pagination contracts with additive metadata and safe lookup failure.
    steps: [1, 2]
    expected_results: [1, 2]
    forbidden_side_effects: [1]
