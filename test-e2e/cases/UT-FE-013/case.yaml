  title: 模型 V2 容量与推理字段默认值、边界及序列化
  type: FE-COMP
  priority: P1
  status: active
  automation: automated
  objective: 模型 V2 容量与推理字段默认值、边界及序列化
  preconditions:
  - 本地依赖/组件测试环境可运行；不要求外部模型服务在线。
  - 设置 NEXENT_TEST_HOME，目录不位于 Nexent Git 仓库内。
  - 当次 run_id 已生成，所有新建资源名称带 run_id；测试基线固定为 develop 当前批次锁定的产品提交；执行时另记录实际被测commit。
  - 所需本地资产存在且校验通过：${NEXENT_TEST_HOME}/config/models.yaml；${NEXENT_TEST_HOME}/config/secrets.env；${NEXENT_TEST_HOME}/assets/images/；${NEXENT_TEST_HOME}/assets/expected/vlm_expected.json
  test_data:
    legacy_asset_declaration: '- ${NEXENT_TEST_HOME}/config/models.yaml

      - ${NEXENT_TEST_HOME}/config/secrets.env

      - ${NEXENT_TEST_HOME}/assets/images/

      - ${NEXENT_TEST_HOME}/assets/expected/vlm_expected.json'
  steps:
  - order: 1
    action: 构造 LLM/Embedding/VLM 的容量和推理字段。
    expected: 合法字段按产品列/extra_params 契约序列化。
  - order: 2
    action: 校验 max_tokens、temperature、top_p、enable_thinking 和自定义参数的边界。
    expected: 空值表示继承。
  - order: 3
    action: 将表单值序列化为请求 payload。
    expected: 非法范围被前端阻止。
  - order: 4
    action: 对空值、非法范围和重复自定义键执行校验。
    expected: 自定义键清理稳定且不丢合法数值。
  expected_results:
  - 合法字段按产品列/extra_params 契约序列化。
  - 空值表示继承。
  - 非法范围被前端阻止。
  - 自定义键清理稳定且不丢合法数值。
  forbidden_side_effects: []
