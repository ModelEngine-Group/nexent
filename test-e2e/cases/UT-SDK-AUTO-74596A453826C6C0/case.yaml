  assertions:
  - register_closer 每次返回唯一 ResourceToken（uuid4 hex）；未取消时注册不执行钩子，cancelled 保持 False。
  - unregister_closer 对其 token 生效：被注销钩子不在取消时执行；对未知 token 重复注销幂等且不抛异常。
  - 首次 cancel() 将 cancelled 置为 True、stop_event 置位，并按注册顺序执行所有仍未注销的关闭钩子，每个恰好一次。
  - cancel() 具备幂等性：第二次调用直接返回，已注册钩子不二次执行。
  - 取消后 register_closer 走 close_immediately 分支：新钩子立即同步执行一次并返回 token。
  - cancel() 中单个关闭钩子抛异常被吞掉（继续执行其余），不影响其他钩子执行，cancel() 不向调用方抛异常。
  - 并发 register/unregister/cancel 无死锁、无未处理异常，钩子各执行一次且最终状态一致。
