  - 交互型 ResourceCard 的 button 可聚焦、aria-labelledby 关联标题、aria-pressed 同步 selected，selected=true 时容器带 border-blue-400 与 ring
    高亮。
  - 各 filter button 的 aria-pressed 仅对 activeFilter 为 true，点击回调携带对应 key。
  - 分页 totalPages=ceil(itemCount/itemsPerPage)，点击分页触发 onPageChange；totalPages<=1 或 itemCount=0 时不渲染 Pagination。
  - 空清单渲染 emptyState，且不渲染 Pagination。
  - create 卡片占位渲染且 aria-label=createCardTitle，点击触发 onCreate，并占用一个槽位。
  - search 受控输入触发 onSearchChange；未提供 onSearchChange 时 Input 只读；无 onSearchChange/search/filters 时工具栏隐藏。
  - page 溢出 totalPages 时自动通过 onPageChange 收敛到 totalPages。
