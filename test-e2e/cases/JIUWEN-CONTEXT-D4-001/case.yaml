schema_version: '1.0'
stage: D4
module: AGENT-CORE
case:
  case_id: JIUWEN-CONTEXT-D4-001
  feature_id: JIUWEN-CONTEXT
  requirement_ids:
  - JIUWEN-M4-20261016
  business_rule_ids:
  - JIUWEN-CONTEXT-RULE-001
  - JIUWEN-CONTEXT-RULE-002
  title: Persisted Core change and saved CM D4
  type: E2E
  priority: P1
  status: active
  automation: automated
  objective: Change the configured Core and CM setting, reopen the old chat and continue
    in both directions.
  preconditions:
  - Running built frontend with controlled configuration and conversation HTTP fixtures.
  test_data:
    profile: mock
    locale: zh
    viewport:
      width: 1920
      height: 1080
  steps:
  - order: 1
    action: Open an existing conversation, change the Agent Core to Jiuwen and enable
      CM on its configuration page, reload configuration and reopen the conversation.
    expected: Old answers and tool cards load; the saved Core and enabled CM survive
      reload; loading alone creates no run request.
  - order: 2
    action: Submit one follow-up, change the configured Core back to smolagents and
      disable CM, then reopen and submit another follow-up.
    expected: Both replies appear, both requests retain conversation_id 101 and only
      their respective new query, and old records and unrelated configuration remain
      intact.
  expected_results: &id001
  - Old answers and tool cards load; the saved Core and enabled CM survive reload;
    loading alone creates no run request.
  - Both replies appear, both requests retain conversation_id 101 and only their respective
    new query, and old records and unrelated configuration remain intact.
  forbidden_side_effects:
  - No historical tool replay, second authoritative memory, checkpoint corruption,
    cross-owner history or duplicate current input.
  actor: Authorized Agent development user
  journey:
  - Open an existing conversation, change the Agent Core to Jiuwen and enable CM on
    its configuration page, reload configuration and reopen the conversation.
  - Submit one follow-up, change the configured Core back to smolagents and disable
    CM, then reopen and submit another follow-up.
  final_business_result: *id001
  failure_evidence:
  - Fixed Playwright journey assertions, sanitized request payloads and terminal audit.
  acceptance:
  - id: AC-01
    description: Configuration-side Core changes preserve old conversations and saved
      CM semantics.
    steps:
    - 1
    - 2
    expected_results:
    - 1
    - 2
    forbidden_side_effects:
    - 1
