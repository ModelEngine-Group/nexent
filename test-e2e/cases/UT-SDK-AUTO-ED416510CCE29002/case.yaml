  assertions:
  - RunCancellationScope 取消时通过 register_closer 正确触发 cancel_active，在途 asyncio 任务被取消、httpx 连接被关闭，外部 A2A 流式/非流式调用及时释放且不再产出重复回调。
  - _activate_call/_deactivate_call 正确维护活动 loop/task/token 生命周期，注册与注销成对、无泄漏。
  - 边界分支（无 cancellation_scope、loop 已关闭）不抛异常、不产生额外副作用。
  - 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
