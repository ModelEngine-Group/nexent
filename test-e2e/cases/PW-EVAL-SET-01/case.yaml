  - order: 6
    action: 打开评估集详情检查query/expected映射。
    expected: 解析边界由API-IT。
  - order: 7
    action: 进入当前页面Annotation Labels入口（若角色可见），新增run_id label。
    expected: 解析边界由API-IT。
  - order: 8
    action: 刷新确认评估集/label持久化。
    expected: 解析边界由API-IT。
  - order: 9
    action: 删除run_id资产。
    expected: 解析边界由API-IT。
  expected_results:
