  title: Chat displays fast and promoted tool tasks correctly
  type: E2E
  priority: P0
  status: blocked
  automation: automated
  objective: Chat displays fast and promoted tool tasks correctly
  preconditions:
  - A disposable Nexent deployment with this implementation and an approved controlled provider profile is available.
  - A disposable authenticated browser session and a working current sandbox image are available.
  - The maintained private TFP fixture and runner-owned controlled provider are available for the published test Agent.
  test_data:
    profile: mock
  steps:
  - order: 1
    action: Open a disposable Agent chat and request an approved skill configuration lookup with JSON processing.
    expected: A single tool event and correct final answer appear.
  - order: 2
    action: Request Python promotion in a separate owned chat, then reload that conversation and download the report.
    expected: The task completes and history preserves the result without duplicates.
  expected_results:
  - The final answer and artifact are accessible.
  - Refreshed history matches the live result.
  forbidden_side_effects:
  - No duplicate tool card or stale sibling output.
  actor: Authenticated disposable tenant user
  journey:
  - Open chat.
  - Run approved tool task.
  - Run ordinary Python task.
  - Reload history and download artifact.
  final_business_result:
  - Both task types complete with correct visible output.
  failure_evidence:
  - Retain Playwright trace, screenshot and network evidence on failure.
  execution:
    profiles:
    - name: mock
      required_services:
      - model-provider
  acceptance:
  - id: AC-LIVE
    description: Both real browser runs show their exact final output and one card per actual official tool invocation.
    steps: [1, 2]
    expected_results: [1]
    forbidden_side_effects: [1]
  - id: AC-HISTORY
    description: Reload preserves final output, tool cards and downloadable artifact bytes without duplicated or stale results.
