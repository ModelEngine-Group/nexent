case:
  case_id: AGT-047
  feature_id: F-113
  business_rule_ids:
  - F-113-RULE-01
  title: 基于问题生成标题并持久化、模型失败 fallback｜核心流程
  type: AGENT-IT
  priority: P2
  status: active
  automation: automated
  objective: 基于问题生成标题并持久化、模型失败 fallback｜核心流程
  preconditions:
  - Nexent 本地测试全栈已启动，health check 通过。
  - 设置 NEXENT_TEST_HOME，目录不位于 Nexent Git 仓库内。
  - 当次 run_id 已生成，所有新建资源名称带 run_id；测试基线固定为 develop 当前批次锁定的产品提交；执行时另记录实际被测commit。
  - 所需本地资产存在且校验通过：${NEXENT_TEST_HOME}/config/models.yaml；${NEXENT_TEST_HOME}/config/secrets.env
  - models.yaml 中本用例所需真实 Provider 已配置，secrets.env 中凭据有效，预检连通性通过。
  test_data:
    legacy_asset_declaration: '- ${NEXENT_TEST_HOME}/config/models.yaml

      - ${NEXENT_TEST_HOME}/config/secrets.env'
  steps:
  - order: 1
    action: 使用真实测试用户和 Agent 创建固定会话，至少包含文本、附件和可识别 marker 的消息。
    expected: 功能结果与代码契约一致，测试过程无未处理异常。
  - order: 2
    action: 按“基于问题生成标题并持久化、模型失败 fallback｜核心流程”通过实际会话/分享 API 创建、修改、反馈或生成 share snapshot，记录 conversation_id/share_id。
    expected: 关键状态在 API 返回、数据库/存储和后续读取中保持一致。
  - order: 3
    action: 重新读取会话列表、消息详情和分享快照，检查消息顺序、标题、来源、附件引用与持久化。
    expected: 失败路径返回明确错误，不出现半写入、重复副作用或跨租户泄露。
  - order: 4
    action: 公共分享使用未登录客户端访问 share URL；验证只返回快照内消息与附件。
    expected: 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
  - order: 5
    action: Range/附件场景分别发送正常 Range、越界 Range、无 Range 请求，检查 200/206/416、Content-Range/MIME。
    expected: 真实模型调用成功，stream/Agent run 正常结束；自然语言只做稳定关键词/结构/工具调用断言。
  - order: 6
    action: 过期/撤销后再次访问 share token 必须失败，且旧附件链接不可继续越权使用。
    expected: 真实模型调用成功，stream/Agent run 正常结束；自然语言只做稳定关键词/结构/工具调用断言。
  - order: 7
    action: 使用另一用户猜测 conversation/share/asset ID，确认无法访问。
    expected: 真实模型调用成功，stream/Agent run 正常结束；自然语言只做稳定关键词/结构/工具调用断言。
  - order: 8
    action: '删除临时会话/分享与附件。

      补充异常断言：对本用例涉及的非法/失败条件至少重复一次，确认重试不会产生重复资源、脏状态或权限绕过。'
    expected: 真实模型调用成功，stream/Agent run 正常结束；自然语言只做稳定关键词/结构/工具调用断言。
  expected_results:
  - 功能结果与代码契约一致，测试过程无未处理异常。
  - 关键状态在 API 返回、数据库/存储和后续读取中保持一致。
  - 失败路径返回明确错误，不出现半写入、重复副作用或跨租户泄露。
  - 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
  - 真实模型调用成功，stream/Agent run 正常结束；自然语言只做稳定关键词/结构/工具调用断言。
  forbidden_side_effects: []
  source:
    legacy_workbook_sha256: aa4b32414d30f12b3b64e14236268145e556bd7cfc5d3eb8df80731608ebc022
