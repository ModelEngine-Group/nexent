schema_version: '1.0'
stage: D5
module: V5-BASELINE
case:
  case_id: REL-AUTO-ECAC7A02C22B21FF
  feature_id: V5-REL-AUTO-ECAC7A02C22B21FF
  business_rule_ids:
  - V5-REL-AUTO-ECAC7A02C22B21FF-RULE-01
  title: northbound 进程启动任务恢复与中断上传清理
  type: RELIABILITY
  priority: P1
  status: active
  automation: automated
  objective: northbound 进程重启或崩溃后，遗留中断 chat 任务与中断上传产生的残留对象若未在启动时恢复/清理，将导致任务状态永久不一致、用户消息丢失或 MinIO 残留对象泄漏；线程管理器未按 NORTHBOUND_THREAD_SHUTDOWN_GRACE_SECONDS
    优雅关闭则可能丢弃执行中的受管任务。本专项验证 lifespan 启动恢复与优雅关闭契约，降低数据不一致与资源泄漏风险。
  preconditions:
  - '- 本地依赖/组件测试环境可运行，不要求外部模型服务在线。

    - 使用 mock 验证 northbound_thread_manager 与 services.startup_recovery_service 的调用契约，不依赖真实 DB/MinIO。

    - ${NEXENT_TEST_HOME}/config/environment.yaml（仅本地测试环境参数）'
  test_data:
    legacy_asset_declaration: '- 本地依赖/组件测试环境可运行，不要求外部模型服务在线。

      - 使用 mock 验证 northbound_thread_manager 与 services.startup_recovery_service 的调用契约，不依赖真实 DB/MinIO。

      - ${NEXENT_TEST_HOME}/config/environment.yaml（仅本地测试环境参数）'
  steps:
  - order: 1
    action: 直接导入 backend/apps/northbound_base_app.py，将 northbound_thread_manager 状态置为 ManagerState.CREATED，并 mock services.startup_recovery_service.recover_northbound_tasks
      与 schedule_interrupted_upload_cleanup。
    expected: lifespan 启动顺序与 northbound_base_app.py:77-87 契约一致：CREATED→start→设默认 manager→set_thread_manager→recover→schedule
      cleanup。
  - order: 2
    action: 调用 recover_northbound_tasks_on_startup()，断言 northbound_thread_manager.run 以 "control-io" profile 与 ManagedTaskSpec(task_name="recover-northbound-tasks",
      owner="apps.northbound_base_app") 执行 recover_northbound_tasks。
    expected: recover_northbound_tasks 在 control-io 线程池以恢复专用 task_name/owner 执行，cleanup 以 NORTHBOUND_SERVICE_NAME 调用。
  - order: 3
    action: 断言 recover_northbound_tasks 完成后调用 schedule_interrupted_upload_cleanup(NORTHBOUND_SERVICE_NAME)，服务名来自 consts.task_recovery。
    expected: 关闭时按 NORTHBOUND_THREAD_SHUTDOWN_GRACE_SECONDS 优雅 shutdown 且 clear_default_thread_manager 被调用，无未处理异常。
  - order: 4
    action: 进入 northbound_lifespan 上下文，断言 manager 状态为 CREATED 时调用 start()，并执行 set_default_thread_manager(northbound_thread_manager)
      与 runtime_state_service.set_thread_manager(northbound_thread_manager)。
    expected: 恢复失败不吞异常，启动以失败暴露；/internal/thread-capacity 返回容量快照且不带鉴权。
  - order: 5
    action: 正常退出 lifespan，断言调用 northbound_thread_manager.shutdown(timeout=NORTHBOUND_THREAD_SHUTDOWN_GRACE_SECONDS) 及 clear_default_thread_manager(northbound_thread_manager)。
    expected: 未出现明文 API Key/Token/Password，测试可重复执行。
  - order: 6
    action: 异常路径：mock recover_northbound_tasks 抛异常，断言异常向上传播，lifespan 不吞掉启动失败。
    expected: 未出现明文 API Key/Token/Password，测试可重复执行。
  - order: 7
    action: 调用 /internal/thread-capacity 端点（include_in_schema=False），断言返回 northbound_thread_manager.snapshot() 且无需鉴权。
    expected: 未出现明文 API Key/Token/Password，测试可重复执行。
  - order: 8
    action: 测试结束释放 mock 与受管任务资源，确保可重复执行。
    expected: 未出现明文 API Key/Token/Password，测试可重复执行。
  expected_results:
  - lifespan 启动顺序与 northbound_base_app.py:77-87 契约一致：CREATED→start→设默认 manager→set_thread_manager→recover→schedule cleanup。
  - recover_northbound_tasks 在 control-io 线程池以恢复专用 task_name/owner 执行，cleanup 以 NORTHBOUND_SERVICE_NAME 调用。
  - 关闭时按 NORTHBOUND_THREAD_SHUTDOWN_GRACE_SECONDS 优雅 shutdown 且 clear_default_thread_manager 被调用，无未处理异常。
  - 恢复失败不吞异常，启动以失败暴露；/internal/thread-capacity 返回容量快照且不带鉴权。
  - 未出现明文 API Key/Token/Password，测试可重复执行。
