schema_version: '1.0'
stage: D4
module: CHAT-SIDEBAR
case:
  case_id: CHAT-ACTIVITY-D4-001
  feature_id: CHAT-SIDEBAR
  requirement_ids:
  - CHAT-AUTOMATION-ACTIVITY-20261020
  - CHAT-EVENT-HISTORY-20261105
  business_rule_ids:
  - CHAT-SIDEBAR-RULE-004
  title: Event-driven history refresh avoids idle polling and preserves the active composer
  type: E2E
  priority: P1
  status: active
  automation: automated
  objective: Event-driven history refresh avoids idle polling and preserves the active composer
  preconditions:
  - Repository dependencies and the declared controlled profile are available; fixtures are isolated.
  test_data:
    profile: mock
    identities:
    - owner
    - other
    histories:
    - ordinary
    - automation
    - mixed
    - deleted
    - older
    - newer
  steps:
  - order: 1
    action: Open Workbench with newer and older histories, type an unsent draft, change the controlled backend
      activity of the older history, and advance sixty seconds without a foreground or operation event.
      Then return to the page to reconcile history.
    expected: Idle time causes no history request; foreground return brings the older history first without a page reload and the draft remains.
  - order: 2
    action: Exercise overlapping focus/network events with a delayed list response while observing existing rows,
      their scroll position, the active conversation and pins.
    expected: Events coalesce into one reload; existing rows remain mounted with no skeleton replacement, duplication or active-runtime reset.
  - order: 3
    action: Send the first message in the active local Workbench thread through a controlled run endpoint that assigns its server ID and adds a new history row.
    expected: The new row appears while the original composer remains mounted and the sent message and controlled response remain visible.
  expected_results:
  - Idle time causes no history request; foreground return brings the older history first without a page reload and the draft remains.
  - Events coalesce into one reload; existing rows remain mounted with no skeleton replacement, duplication or active-runtime reset.
  - First persistence preserves the mounted active chat and displays the new history, sent message and controlled response without historical rehydration blanking the view.
  forbidden_side_effects:
  - No production data/schema mutation, quota bypass by ordinary requests, loss of composer/stream state or changes
    to unrelated histories.
  observations:
  - Persisted source/activity, API order and errors, visible browser state or migration output.
  cleanup:
  - Dispose only the fixture schema, browser context and temporary test data.
  execution:
    profiles:
    - name: mock
      required_services: []
  acceptance:
  - id: AC-01
    description: Idle time causes no history request; foreground return brings the older history first without a page reload and the draft remains.
    steps:
    - 1
    expected_results:
    - 1
    forbidden_side_effects:
    - 1
  - id: AC-02
    description: Events coalesce into one reload; existing rows remain mounted with no skeleton replacement, duplication or active-runtime reset.
    steps:
    - 2
    expected_results:
    - 2
    forbidden_side_effects:
    - 1
  - id: AC-03
    description: First persistence preserves the mounted chat and displays its new history and run output.
    steps: [3]
    expected_results: [3]
    forbidden_side_effects: [1]
  actor: Authenticated Workbench user
  journey:
  - Open and retain a draft
  - Remain idle without history reads, then return to observe external activity
  - Refocus and recover network
  final_business_result:
  - The newly active conversation fronts the list without changing the active composer or stream.
  failure_evidence:
  - Playwright trace and screenshot on assertion failure
