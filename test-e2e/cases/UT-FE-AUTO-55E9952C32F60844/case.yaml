  preconditions:
  - 本地前端组件/单元测试环境（Vitest/Jest + React Testing Library）可运行；不要求后端或外部模型服务在线。
  - 设置 NEXENT_TEST_HOME，目录不位于 Nexent Git 仓库内。
  - 当次 run_id 已生成；测试基线固定为 develop 当前批次锁定的产品提交；执行时另记录实际被测 commit。
  - The newchat stream/history adapters and ReadOnlyConversation are available; external
    transport uses inline deterministic fixtures.
