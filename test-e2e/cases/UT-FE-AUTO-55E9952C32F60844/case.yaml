  steps:
  - order: 1
    action: Compacting events create one history-summary data part; the conversation
      shows a spinner and compacting label without a summary body.
    expected: Compacting events create one history-summary data part; the conversation
      shows a spinner and compacting label without a summary body.
  - order: 2
    action: Accepted events replace compacting and repeated accepted payloads without
      duplication; covered message ID and final string summary render in a collapsed
      card.
    expected: Accepted events replace compacting and repeated accepted payloads without
      duplication; covered message ID and final string summary render in a collapsed
      card.
  - order: 3
    action: Idle removes the current history-summary part while preserving ordinary
      answer content.
    expected: Idle removes the current history-summary part while preserving ordinary
      answer content.
  - order: 4
    action: Malformed JSON or an unsupported summary status leaves the previous accepted
      summary unchanged without an unhandled error.
    expected: Malformed JSON or an unsupported summary status leaves the previous
      accepted summary unchanged without an unhandled error.
  - order: 5
    action: Persisted accepted summaries restore their covered message ID and render
      string or summary.markdown bodies.
    expected: Persisted accepted summaries restore their covered message ID and render
      string or summary.markdown bodies.
  - order: 6
    action: The deterministic fixture causes no real model/public network requests;
      rendered output does not contain plaintext secrets.
    expected: The deterministic fixture causes no real model/public network requests;
      rendered output does not contain plaintext secrets.
  expected_results:
  - Compacting events create one history-summary data part; the conversation shows
    a spinner and compacting label without a summary body.
  - Accepted events replace compacting and repeated accepted payloads without duplication;
    covered message ID and final string summary render in a collapsed card.
  - Idle removes the current history-summary part while preserving ordinary answer
    content.
  - Malformed JSON or an unsupported summary status leaves the previous accepted summary
    unchanged without an unhandled error.
  - Persisted accepted summaries restore their covered message ID and render string
    or summary.markdown bodies.
  - The deterministic fixture causes no real model/public network requests; rendered
    output does not contain plaintext secrets.
