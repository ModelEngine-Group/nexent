schema_version: '1.0'
stage: D5
module: V5-BASELINE
case:
  case_id: EVOLUTION-DEVELOPMENT-RECOVERY-D5-001
  feature_id: AGENT-EVOLUTION-REPLAY
  business_rule_ids: [AGENT-EVOLUTION-REPLAY-RULE-08]
  title: 开发评测进程退出后仅恢复尚未发出的试跑
  type: RELIABILITY
  priority: P0
  status: active
  automation: automated
  objective: 验证开发评测进程退出后的有界恢复、附件回收和旧回执写入限制。
  preconditions: [可创建临时数据库的 PostgreSQL 实例，独占附件目录及可记录请求的 Runtime 替身。]
  test_data:
    profile: 同批三道隔离业务重放任务，首题已完成，第二题可能中断。
  steps:
  - order: 1
    action: 复制第二题附件后、发送请求前退出进程。租约到期后继续处理同一实验，先模拟一次存储清理故障，再恢复存储。
    expected: 清理失败时不能重领第二题。收回副本后换回执重排，首题不重跑，旧回执不能发请求或写判分。
  - order: 2
    action: 第二题收到 Runtime 回执后、写回判分前退出进程。重启处理。同样检查升级前无发出状态的旧租约。
    expected: 可能已发出的组保留中断结果，清理临时副本，余题继续。缺少判分的第二题不能进入提名。
  - order: 3
    action: 在第二题重排后再次使进程在发出之前退出。
    expected: 试跑恢复只重排一次。再退出时终结发出的机会并清理剩余副本。
  expected_results: [未发出的试跑在附件回收后至多重排一次。, 已有判分和旧回执边界保留。, 已发出或发出情况未知的组不自动重发。]
  forbidden_side_effects: [未清理附件就重派，旧回执发起运行或覆盖判分。, 重复执行可能已发出的试跑，或凭缺少判分的目标组提名。]
  acceptance:
  - id: AC-01
    description: 验证清理故障、重排次数和旧回执失效。
    steps: [1, 3]
    expected_results: [1, 2]
    forbidden_side_effects: [1]
  - id: AC-02
    description: 已发出的试跑和旧格式作业保留中断，余题继续，缺证拦截提名。
    steps: [2]
    expected_results: [2, 3]
    forbidden_side_effects: [2]
  execution:
    profiles:
    - name: mock
      required_services: []
  risk_type: RELIABILITY
  risk: 重跑可能已执行的外部动作，或在恢复过程中覆盖结果、遗留临时附件。
  condition: [真实子进程退出，使用 PostgreSQL、可控 Runtime 和本地对象目录。]
  metrics: [实际发送次数，保存的结果，附件残留，提名资格。]
  thresholds: [每组实际发出最多一次，终结后无临时副本，持旧回执成功发出或写回次数为零。]
  recovery_expectations: [已判结果复用，剩余试跑继续，发出状态不确定时保留原因，收回测试资源。]
