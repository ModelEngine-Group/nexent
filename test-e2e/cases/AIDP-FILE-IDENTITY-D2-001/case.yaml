schema_version: '1.0'
stage: D2
module: AIDP-KNOWLEDGE
case:
  case_id: AIDP-FILE-IDENTITY-D2-001
  feature_id: AIDP-CHAT-FILE-IDENTITY
  business_rule_ids:
    - AIDP-CHAT-FILE-IDENTITY-RULE-04
  title: 北向 AIDP 原文件下载路由按 API Key 与知识库 READ 返回准确字节
  type: CONTRACT
  priority: P1
  status: active
  automation: automated
  objective: >-
    验证新增北向 GET 下载路由的鉴权、知识库 READ 校验、AIDP 转发参数与响应头/字节契约，
    以及缺少凭证、越权、跨库/已删除和上游错误时不泄露 AIDP 凭据或原文件。
  preconditions:
    - 使用 FastAPI 应用内真实 northbound 路由和真实 API Key 上下文解析逻辑。
    - Token 查询、AIDP 权限记录与 AIDP 下载流由固定测试替身提供；不访问真实 AIDP 或数据库。
  test_data:
    knowledge_base: kb-42
    file_uuid: 11111111-2222-4333-8444-555555555555
    authentication_header: Bearer fixture-key
    original_bytes: original-bytes
  contract:
    protocol: HTTP
    method: GET
    endpoint: /nb/v1/knowledge-bases/{kds_id}/files/{file_uuid}/download
    request_expectations:
      - 路径仅含 kds_id 与 file_uuid，不带 API Key、签名令牌或 AIDP 地址。
      - Authorization 缺失或无效时不进入权限检查或 AIDP 请求。
      - 合法 API Key 解析出当前用户与租户后，以目标 kds_id 检查 READ。
      - 非法 UUID 在业务处理前被拒绝。
    response_expectations:
      - 有 READ 权限时返回 AIDP 当前文件的完整字节、Content-Type、文件名与长度头。
      - 无 READ 权限返回 403，知识库不存在返回 404，均不调用 AIDP 下载。
      - AIDP 文件不存在映射为 404，其他上游错误映射为 5xx 且不转发上游原因或凭据。
      - 响应体与响应头不含北向 API Key 或 AIDP 凭据。
  steps:
    - order: 1
      action: 携合法 API Key 请求已授权知识库中文件，读取响应字节与响应头。
      expected: 返回原始字节、正确 MIME/文件名/长度，AIDP 转发参数与路径完全对应。
    - order: 2
      action: 分别省略 Authorization、使用错误 Key、请求无 READ 权限和不存在知识库。
      expected: 前两者 401，越权 403，未知知识库 404；均不调用 AIDP 下载。
    - order: 3
      action: 让 AIDP 返回文件 404、认证错误和任意运行时错误。
      expected: 文件 404 映射 404，其他错误映射 5xx；响应不含 AIDP 凭据或上游原因。
    - order: 4
      action: 以非法 file_uuid 请求下载。
      expected: 返回 422，且不触发权限检查或 AIDP 下载。
  expected_results:
    - 合法北向调用得到对应 AIDP 原文件的当前字节和准确元数据。
    - 无凭证、越权、跨库/删除与上游错误均明确失败且不泄露凭据。
    - 下载 URL 仅含定位字段，不承担匿名分享能力。
  forbidden_side_effects:
    - 不得复用无鉴权的 /nb/v1/file/fetch。
    - 不得向调用方返回 AIDP API Key、上游内部地址或上游错误正文。
    - 权限失败时不得发起 AIDP 下载请求。
  acceptance:
    - id: AC-01
      description: Authorized download streams the original bytes with accurate metadata.
      steps: [1]
      expected_results: [1]
      forbidden_side_effects: [1, 2]
    - id: AC-02
      description: Missing or invalid credentials and missing READ permission are rejected before AIDP.
      steps: [2]
      expected_results: [2]
      forbidden_side_effects: [2, 3]
    - id: AC-03
      description: Upstream and validation failures are mapped without leaking secrets.
      steps: [3, 4]
      expected_results: [2, 3]
      forbidden_side_effects: [1, 2]
  tags:
    - aidp
    - northbound
    - download
    - security
