    阈值与目标均符合契约。
  - 三种不确定性预留 basis（none/context_window_10pct/approved_profile）分别输出 0、ceil(10%)、approved_profile 值；context_window_10pct 场景
    warnings 含 "uncertainty_reserve_active"。
  - compaction_trigger_threshold_tokens 与 compaction_target_tokens 均不小于 1（max(1,floor) 下限成立）。
  - field_sources 反映各字段来源（derived/code_default/model_default/request 等）；fingerprint 与 validate_context_budget_snapshot 校验自洽。
  - 五类领域异常（InvalidReservePolicy、RequestedOutputExceedsCapacity、NoSafeInputCapacity、UncertaintyReserveBasisUnknown、ReserveExceedsCapacity）在对应非法输入下被精确抛出，无吞异常或伪成功。
