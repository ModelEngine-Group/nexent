  risk_type: RELIABILITY
  risk: 审核并发、提交竞争与事务故障不污染新轮次
  condition:
  - 真实产品鉴权与PostgreSQL；使用可重复的同步屏障/受控故障，不用睡眠推断竞争已发生。
  metrics:
  - 成功/拒绝请求数、跨租户泄露数、事务后状态及通知事件数
  thresholds:
  - 无进程崩溃的同步竞争场景每轮成功数=1，其余409；DB状态对应唯一成功决策，提交后通知尝试数=1。
  - 重新提交后的revision递增；旧审核409，不污染新提交说明、内容及状态；锁顺序一致，无死锁遗留。
  - 失败事务整体回滚，失败通知0；恢复后当前revision可成功且通知只在提交后；不能因通知投递失败把已提交决策重复执行。
  - 数据库已提交决策不回滚；重试409且不二次审核或通知重放，查询可恢复当前结果；通知失败有可检索日志，崩溃窗口允许漏通知，不声称必达或exactly-once。
  recovery_expectations:
  - 移除故障后以当前revision重试可正常完成；清理run_id数据且无遗留锁或待恢复事务。
