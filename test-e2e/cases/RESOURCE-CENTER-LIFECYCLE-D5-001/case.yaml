  title: 审核并发、提交竞争与事务故障不污染新轮次
  type: RELIABILITY
  priority: P0
  status: blocked
  automation: automated
  objective: 审核并发、提交竞争与事务故障不污染新轮次
  preconditions:
  - 隔离测试后端具备一次性schema权限，固定并发/故障脚本与执行配置就绪；统一验证阶段执行，不提前宣称PASS。
  - 在仓库外的隔离测试环境准备run_id及独立租户；禁止使用生产数据或记录密钥。
  - 使用真实产品鉴权、服务和持久层；外部依赖使用受控fixture；不要求真实模型调用。
  - 决策成功场景使用已登记新URL且具有对应decision_types资格的审核者，本人/他人提交均沿用原有操作规则；本人查看场景使用独立mine身份。
  test_data: {}
  steps:
  - order: 1
    action: 同review_id并发通过/通过和通过/驳回
    expected: 唯一成功，其余409；仓库发布和审核结果一致，无重复通知尝试。
  - order: 2
    action: 同源并发提交相同及不同快照
    expected: 一条待审；相同申请返回原ID，不同内容409，快照不被覆盖。
  - order: 3
    action: 发布仓库与保存审核结果间注入异常
    expected: 仓库和审核记录全部回滚，申请仍待审，提交前无通知。
  - order: 4
    action: 响应丢失后重试决策及并发下架
    expected: 重复决策409；GET原review_id恢复结果，下架与审批按源锁串行，完成历史不变。
  expected_results:
  - 唯一成功，其余409；仓库发布和审核结果一致，无重复通知尝试。
  - 一条待审；相同申请返回原ID，不同内容409，快照不被覆盖。
  - 仓库和审核记录全部回滚，申请仍待审，提交前无通知。
  - 重复决策409；GET原review_id恢复结果，下架与审批按源锁串行，完成历史不变。
  forbidden_side_effects:
  - 不得绕过审核表提前覆盖仓库内容或修改已完成申请。
  - 失败事务不得留下仓库半写入或丢失申请数据。
