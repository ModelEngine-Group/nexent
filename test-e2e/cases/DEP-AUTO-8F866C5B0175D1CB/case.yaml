schema_version: '1.0'
stage: D5
module: V5-BASELINE
case:
  case_id: DEP-AUTO-8F866C5B0175D1CB
  feature_id: V5-DEP-AUTO-8F866C5B0175D1CB
  business_rule_ids:
  - V5-DEP-AUTO-8F866C5B0175D1CB-RULE-01
  title: 一次性标签数据迁移 backfill：tool.labels、skill.skill_tags、agent_repository.tags、skill_repository.tags、mcp_record.tags、mcp_community.tags、mcp_market.tags
    迁移为 keywords 定义/值/分配，含 preflight 冲突检测与 post_backfill 奇偶校验
  type: DEPLOYMENT
  priority: P1
  status: active
  automation: automated
  objective: 升级时一次性迁移可能因 legacy 数据畸形（空租户、非字符串 JSON、源缺失/租户不匹配）、容量超限（定义100/值1000/分配100）导致标签丢失、错标或重复分配；迁移非幂等会在重跑时产生重复定义/值/分配；失败未整体回滚会破坏既有
    tag 表与 legacy 字段。
  preconditions:
  - deploy/sql/migrations/v2.5.2_unified_tag_management.sql；deploy/sql/preflight/unified_tag_management_preflight.sql；deploy/sql/init.sql；deploy/tests/test_unified_tag_management.sh（PostgreSQL
    15 docker 测试容器）
  test_data:
    legacy_asset_declaration: deploy/sql/migrations/v2.5.2_unified_tag_management.sql；deploy/sql/preflight/unified_tag_management_preflight.sql；deploy/sql/init.sql；deploy/tests/test_unified_tag_management.sh（PostgreSQL
      15 docker 测试容器）
  steps:
  - order: 1
    action: 按 test_unified_tag_management.sh 的 create_legacy_schema 建 legacy 表，灌入覆盖 tool.labels(JSON)、skill.skill_tags、agent_repository.tags、skill_repository.tags、mcp_record.tags、mcp_community.tags、mcp_market.tags
      的样例数据。
    expected: preflight 只读、不创建 tag 表，并准确列出全部冲突类别。
  - order: 2
    action: 执行 preflight 脚本（只读事务），校验能输出 null_or_empty_tenant、json_array_contains_non_string、canonical_source_missing_or_tenant_mismatch、value_capacity_exceeded、assignment_capacity_exceeded
      等冲突行，且不创建 tag 表。
    expected: 合法 legacy 值迁移为 keywords 定义/值/分配，归一化去重正确，display_value 取 C 排序最小值，legacy 源字段不被改写。
  - order: 3
    action: 执行迁移 v2.5.2_unified_tag_management.sql，验证 keywords 定义/值/分配正确生成、归一化(lower/btrim/C 排序)去重、display_value 取确定最小、legacy
      字段保持不变。
    expected: 迁移重跑后各表计数不变，无重复定义/值/分配。
  - order: 4
    action: 重跑迁移脚本，验证幂等（桶/定义/值/分配计数不变、无重复定义/值/分配）。
    expected: post_backfill_parity 无 legacy_missing_assignment 与 assignment_missing_legacy_source。
  - order: 5
    action: 迁移后执行 preflight 的 post_backfill_parity 段，验证无 legacy_missing_assignment 与 assignment_missing_legacy_source。
    expected: 任一冲突或容量超限触发 "Unified tag migration blocked" 异常并整体回滚，tag 表不残留、legacy 数据保留。
  - order: 6
    action: 构造冲突数据（如 1001 个值、101 个分配、非空 community 标签、被占用的保留权限 ID），执行迁移验证 fail-closed 报 "Unified tag migration blocked" 并整体回滚。
    expected: 任一冲突或容量超限触发 "Unified tag migration blocked" 异常并整体回滚，tag 表不残留、legacy 数据保留。
  expected_results:
  - preflight 只读、不创建 tag 表，并准确列出全部冲突类别。
  - 合法 legacy 值迁移为 keywords 定义/值/分配，归一化去重正确，display_value 取 C 排序最小值，legacy 源字段不被改写。
  - 迁移重跑后各表计数不变，无重复定义/值/分配。
  - post_backfill_parity 无 legacy_missing_assignment 与 assignment_missing_legacy_source。
  - 任一冲突或容量超限触发 "Unified tag migration blocked" 异常并整体回滚，tag 表不残留、legacy 数据保留。
