    legacy_row: 328
  unit_boundary: Agent选择器
  inputs:
  - '- ${NEXENT_TEST_HOME}/config/models.yaml

    - ${NEXENT_TEST_HOME}/config/secrets.env'
  assertions:
  - 点击选择仅更新 URL 的 agent_id 参数，不触发额外 searchAgentInfo/initialize 调用，URL 是选择状态的唯一事实来源。
  - 快速连续切换后，陈旧 searchAgentInfo 响应被 requestedAgentIdRef 守卫丢弃，最终展示最新选择且无旧数据覆盖。
  - 非法或不存在的 agent_id 触发 reset() 并清理 URL 中的 agent_id，页面回到未选中状态，无残留查询参数或跨账号残留。
  - 切换期间出现 role="status" 加载遮罩且内容面板 visibility=hidden，加载完成后恢复，无白屏或闪跳。
  - 选择 NEW Agent 调用 clearAgentNewMark，成功/失败路径下的 badge 与查询失效处理符合契约。
  - 测试过程无未处理异常，无明文 API Key/Token/Password 泄露，失败路径展示明确错误提示。
