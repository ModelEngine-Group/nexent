schema_version: '1.0'
stage: D4
module: CHAT-SIDEBAR
case:
  case_id: CHAT-SIDEBAR-D4-002
  feature_id: CHAT-SIDEBAR
  requirement_ids:
  - CHAT-SIDEBAR-COLLAPSE-20261020
  business_rule_ids:
  - CHAT-SIDEBAR-RULE-008
  title: Conversation lists collapse without a permanent rail
  type: E2E
  priority: P2
  status: active
  automation: automated
  objective: Inspect zero-width collapse and original conversation operations on the real Workbench and Agent-chat pages.
  preconditions:
  - Running frontend with controlled Workbench and Agent API fixtures; no generation or persistent writes.
  test_data:
    routes:
    - /zh/workbench
    - /zh/newchat
  steps:
  - order: 1
    action: On both routes, collapse the expanded conversation list, including Agent chat discovery and an existing conversation.
    expected: The entire conversation rail disappears; content starts beside the primary navigation. Workbench has no conversation
      header and exposes floating expand and compose controls. Agent discovery exposes one expand action. Selected-Agent chat
      uses floating responsive controls without adding a header; narrow mode preserves symmetric conversation gutters.
  - order: 2
    action: Expand via the available button and inspect search, history and Agent selection; collapse again.
    expected: Existing list operations return, duplicate header actions disappear, and the active conversation/composer remain
      unchanged.
  - order: 3
    action: Start a new conversation through the collapsed floating compose action; verify the existing Workbench blank-conversation
      behavior.
    expected: Existing new-conversation and Agent navigation semantics are preserved without generation or lost saved history;
      the collapsed list stays collapsed through loading and the expanded list stays expanded.
  - order: 4
    action: Repeat collapse and expansion at a mobile viewport, then close the sheet.
    expected: The mobile sheet opens and closes; no permanent rail remains and desktop state does not prevent reopening.
  - order: 5
    action: Collapse Workbench, visit Agent chat and another route, then return. Set different visibility on Agent chat, navigate
      back, and finally reload the browser document.
    expected: Both pages restore the expanded default after leaving and returning; no cross-page visibility state is retained.
      New conversations within the current Workbench page retain the current visibility. The discovery expand button is vertically
      aligned with its title. Main navigation behavior remains unchanged.
  - order: 6
    action: Expand the Agent-chat discovery sidebar, then select an Agent and return to discovery without sending a message.
    expected: Discovery shows an Agent Chat title, search and collapse controls, without the current-Agent dropdown or new-conversation
      action. Selecting an Agent restores conversation actions. Returning to discovery hides them again. The discovery page
      never displays model selection or a composer.
  - order: 7
    action: With a selected Agent and collapsed history, resize or zoom the page through available chat widths 1900px, 1500px,
      1340px, 1188px, 1106px, 1034px and 400px; then restore the original width.
    expected: The name first shortens, then hides at 1340px; back and its separator hide at 1188px; compose hides at 1106px.
      At 1034px or below the sole panel-expand button retains its original 12px left/top inset and 32px target. Controls remain
      within the centered message column's left gutter at wider sizes and never cover scrolling replies. Hidden controls cannot
      receive keyboard focus. Narrow mode reserves a 32px additional gutters on both sides combined with existing message
      padding to separate the original button from the menu and answer text. The icon keeps its vertical center, and navigation
      hover expansion covers the button. Wider modes preserve conversation positioning; widening restores controls without
      losing the conversation.
  expected_results:
  - Both routes reclaim collapsed rail width with their specified controls and preserve conversation semantics.
  forbidden_side_effects:
  - Do not send messages, delete history, change stored Agent configuration or modify authentication.
  actor: Authorized mock conversation user
  journey:
  - Collapse list
  - expand list
  - start blank conversation
  - toggle mobile sheet
  final_business_result:
  - Conversation navigation remains reachable without wasting content width.
  failure_evidence:
  - Screenshot and route
  - viewport
  - active conversation and observed action result
  acceptance:
  - id: AC-01
    description: Desktop collapse, expansion, new conversations and route returns preserve navigation and drafts.
    steps:
    - 1
    - 2
    - 3
    - 5
    - 6
    expected_results:
    - 1
    forbidden_side_effects:
    - 1
  - id: AC-02
    description: Mobile drawers reopen and close independently of desktop state.
    steps:
    - 4
    expected_results:
    - 1
    forbidden_side_effects:
    - 1
  - id: AC-03
    description: Responsive controls hide whole items at the documented thresholds and preserve reply clearance and symmetric
      gutters.
    steps:
    - 7
    expected_results:
    - 1
    forbidden_side_effects:
    - 1
