schema_version: '1.0'
stage: D5
module: V5-BASELINE
case:
  case_id: DEP-AUTO-E89502155049473D
  feature_id: V5-DEP-AUTO-E89502155049473D
  business_rule_ids:
  - V5-DEP-AUTO-E89502155049473D-RULE-01
  title: user_tenant_t 插入触发器预置 default_resource/knowledge_content 桶、六类资源绑定与 agent_category 预设20值的幂等
  type: DEPLOYMENT
  priority: P1
  status: active
  automation: automated
  objective: 验证统一标签管理的租户预置语义：provision_unified_tag_management 在 user_tenant_t AFTER INSERT 触发器（provision_unified_tag_management_trigger）下，为每个租户预置
    default_resource、knowledge_content 两个标签桶、六类资源类型绑定（default_resource 桶的 agent/skill/tool/mcp_service/knowledge_base 与 knowledge_content
    桶的 knowledge_document）以及 definition_key='agent_category' 的 multi_select 定义与 20 个预设值；并保证同一租户多条用户记录（触发器重复触发）或函数重复调用时保持幂等、不产生重复桶/绑定/定义/值。风险：预置缺失或重复会导致租户标签录入、查询、筛选失效或跨租户数据异常，租户创建流程中断。
  preconditions:
  - '- deploy/sql/migrations/v2.5.2_unified_tag_management.sql

    - deploy/tests/test_unified_tag_management.sh

    - postgres:15-alpine（本地 Docker 测试库，可通过 POSTGRES_TEST_IMAGE 覆盖）'
  test_data:
    legacy_asset_declaration: '- deploy/sql/migrations/v2.5.2_unified_tag_management.sql

      - deploy/tests/test_unified_tag_management.sh

      - postgres:15-alpine（本地 Docker 测试库，可通过 POSTGRES_TEST_IMAGE 覆盖）'
  steps:
  - order: 1
    action: 在本地测试数据库（postgres:15-alpine 容器）按版本顺序执行 deploy/sql/init.sql 及 deploy/sql/migrations 至 v2.5.2_unified_tag_management.sql，使最终版
      provision_unified_tag_management、provision_unified_tag_management_after_user_tenant_insert 与 provision_unified_tag_management_trigger
      生效。
    expected: 每个新租户预置后 tag_bucket 活跃行=2（default_resource、knowledge_content）、tag_bucket_resource_type 活跃行=6、agent_category
      定义=1、agent_category 值=20，与部署脚本断言 "2|6|1|20" 一致。
  - order: 2
    action: 向 nexent.user_tenant_t 插入同一租户（tenant_id 固定、delete_flag='N'）的第一条成员记录，断言该租户在 tag_bucket 中恰有 default_resource、knowledge_content
      两个 delete_flag='N' 的活跃桶。
    expected: 触发器重复触发（同租户多次插入用户）与函数重复调用后计数仍为 2|6|1|20，无重复行产生。
  - order: 3
    action: 断言 tag_bucket_resource_type 中该租户恰有 6 条 delete_flag='N' 的活跃绑定：default_resource 桶的 agent/skill/tool/mcp_service/knowledge_base
      与 knowledge_content 桶的 knowledge_document。
    expected: delete_flag='Y' 的租户插入不触发预置，不产生任何桶/绑定/定义/值行。
  - order: 4
    action: 断言 tag_definition 中存在该租户 definition_key='agent_category'、selection_mode='multi_select'、delete_flag='N' 的活跃定义，且
      tag_value 为该定义下恰好 20 个 delete_flag='N' 的活跃预设值（normalized_value 覆盖 marketing 到 office）。
    expected: 测试过程无未处理异常；日志不输出明文密码/密钥（POSTGRES_PASSWORD 仅用于测试容器）。
  - order: 5
    action: 再次向同一租户插入第二条成员记录（不同 user_id、相同 tenant_id），使 AFTER INSERT 触发器二次触发 provision_unified_tag_management。
    expected: 测试过程无未处理异常；日志不输出明文密码/密钥（POSTGRES_PASSWORD 仅用于测试容器）。
  - order: 6
    action: 复测桶/绑定/定义/值的活跃计数，断言仍为 2|6|1|20 且无新增重复行（触发器幂等：同租户多用户插入不重复预置）。
    expected: 测试过程无未处理异常；日志不输出明文密码/密钥（POSTGRES_PASSWORD 仅用于测试容器）。
  - order: 7
    action: 手动重复调用 SELECT nexent.provision_unified_tag_management('tenant', 'test')，断言计数仍为 2|6|1|20，不产生重复数据（函数级幂等）。
    expected: 测试过程无未处理异常；日志不输出明文密码/密钥（POSTGRES_PASSWORD 仅用于测试容器）。
  - order: 8
    action: 构造 delete_flag='Y' 的 user_tenant_t 插入，断言触发器因 COALESCE(NEW.delete_flag,'N') <> 'Y' 判定跳过预置，不产生任何桶/绑定/定义/值行。
    expected: 测试过程无未处理异常；日志不输出明文密码/密钥（POSTGRES_PASSWORD 仅用于测试容器）。
  expected_results:
  - 每个新租户预置后 tag_bucket 活跃行=2（default_resource、knowledge_content）、tag_bucket_resource_type 活跃行=6、agent_category 定义=1、agent_category
    值=20，与部署脚本断言 "2|6|1|20" 一致。
  - 触发器重复触发（同租户多次插入用户）与函数重复调用后计数仍为 2|6|1|20，无重复行产生。
  - delete_flag='Y' 的租户插入不触发预置，不产生任何桶/绑定/定义/值行。
  - 测试过程无未处理异常；日志不输出明文密码/密钥（POSTGRES_PASSWORD 仅用于测试容器）。
  forbidden_side_effects: []
