schema_version: '1.0'
stage: D1
module: RUNTIME-SANDBOX
case:
  case_id: SAI-D1-007
  feature_id: SAI-001
  business_rule_ids:
  - SAI-001-R2
  title: Cancellation constructor supports parent event hotpatch callers
  type: SDK-UT
  priority: P1
  status: active
  automation: automated
  objective: Accept parent_stop_event while preserving legacy local event behavior.
  preconditions:
  - The SDK cancellation module is loaded.
  test_data:
    children: 2
  steps:
  - order: 1
    action: Construct legacy and parent-linked scopes including an explicit local
      event.
    expected: All constructor forms succeed; the legacy event identity is preserved.
  - order: 2
    action: Cancel one child then stop the parent and observe the sibling.
    expected: Child cancellation does not stop the parent; parent cancellation wakes
      the sibling and closes resources once.
  expected_results:
  - Parent propagation and local cancellation remain independent.
  forbidden_side_effects:
  - No parent cancellation from a child
  - No unmanaged watcher threads
  unit_boundary: Public RunCancellationScope constructor and event contract
  inputs:
  - Local event
  - Parent event
  assertions:
  - Constructor accepts parent_stop_event
  - Legacy event identity is unchanged
  - Parent stop wakes waiters
  - Resource closers execute once
  execution:
    profiles:
    - name: mock
      required_services: []
  acceptance:
  - id: AC-01
    description: Accept parent_stop_event while preserving legacy local event behavior.
    steps:
    - 1
    - 2
    expected_results:
    - 1
    forbidden_side_effects:
    - 1
    - 2
