  objective: 升级前备份遗漏持久化目录、目标目录冲突、空间不足、交互式阻塞或生成不完整恢复资产。
  preconditions:
  - '- ${NEXENT_TEST_HOME}/config/environment.yaml'
  test_data:
    legacy_asset_declaration: '- ${NEXENT_TEST_HOME}/config/environment.yaml'
  steps:
  - order: 1
    action: 执行 deploy/tests/test_docker_backup.sh。
    expected: 两个仓库内确定性契约脚本均退出 0。
  - order: 2
    action: 执行 deploy/tests/test_k8s_backup.sh。
    expected: 所有失败分支错误明确且未开始复制。
  - order: 3
    action: 校验缺参/未知参数/目录嵌套/名称冲突/空间不足均在复制前失败。
    expected: 成功产物目录和文件完整。
  - order: 4
    action: 校验成功路径包含 ROOT_DIR、NEXENT_USER_DIR、Docker volume 或 Kubernetes PVC 数据和元数据。
    expected: 无生产数据写入或残留。
  - order: 5
    action: 确认执行无交互提示、临时目录自动清理。
    expected: 无生产数据写入或残留。
  expected_results:
  - 两个仓库内确定性契约脚本均退出 0。
