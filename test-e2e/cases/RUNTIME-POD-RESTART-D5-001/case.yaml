schema_version: '1.0'
stage: D5
module: RUNTIME-SCALING
case:
  case_id: RUNTIME-POD-RESTART-D5-001
  feature_id: RUNTIME-REPLICAS
  requirement_ids:
  - RUNTIME-FIXED-REPLICAS-20261105
  business_rule_ids:
  - RUNTIME-REPLICAS-RULE-08
  title: B 重启不影响 A，失联预约保留至下一全停维护
  type: RELIABILITY
  priority: P0
  status: blocked
  automation: automated
  objective: 证明第一阶段普通 Pod 生命周期隔离及无自动失联接管的可观察边界。
  preconditions:
  - 使用本次测试拥有的独立应用实例、专属 PostgreSQL/Redis 数据域和支持两个工作节点的真实动态 RWX。
  - 至少两个 Runtime 进程使用同一维护完成批次；可确定性访问 A/B 实例并另测稳定 Service，不能以随机路由证明跨实例。
  - 运行协调、数据库、Redis 和 HTTP 路径使用真实实现；长流及故障由受控模型协议服务提供，不替换被测协调器。
  - 机器本地配置提供集群/实例连接与凭据，凭据不写入合同；每次生成资源标签和数据标识，只清理本次拥有的资源。
  - 隔离 Kubernetes namespace 及专属 DB/Redis；A 有长会话、评测、自动任务、租约和 Run 目录，B 可单独重启/强杀；维护 Job 已实现。
  test_data:
    scope: 每次运行生成 tenant_a、tenant_b、user_a、user_b、Agent、已存在 conversation_a 及 request_tag；不同租户的共享系统 Agent 使用相同逻辑作用域。
    model: 受控协议服务输出唯一轮次和递增事件序列，支持屏障、长流、完成和失败。
    preparation: 两个子场景各自准备独占 release 和定向 Gateway。正常重启场景用受控模型同时阻塞真实会话、评测和自动任务，失联场景缩短真实 Redis 运行键 TTL，不人工删除键。
  steps:
  - order: 1
    action: 在 A 建立上述长运行，记录状态、消息、目录和租约快照及正常续租变化范围，然后只重启 B。
    expected: A 的状态与文件未被 B 的启动恢复改写，续租继续，没有全局 TIMEOUT 或锁释放。
  - order: 2
    action: 确认 B 以原 epoch 就绪，让 A 的受控运行继续输出并最终完成一次正常运行。
    expected: B 不新建维护批次，A 的有效输出与终态完整。
  - order: 3
    action: 另起 A 的长运行后强杀 owner，重启该 Pod 并让两个实例同时请求同一会话；等待超过原 Redis 运行键 TTL。
    expected: 持久化预约及全局配额仍被失联 owner 占用；两个请求均不重放模型，不因 TTL 或进程重启释放。
  - order: 4
    action: 向失联运行发停止请求，随后全停所有业务并执行新 epoch 维护，再启动固定副本并重试合法请求。
    expected: 停止请求不被伪装为 worker 已完成；全停维护收敛失联预约后才允许新运行成功。
  - order: 5
    action: 结束本次运行，回收 namespace 和专属测试数据域并核对资源归属。
    expected: 没有残留任务、目录、预约或外部资源改写。
  expected_results:
  - B 普通重启不恢复 A 的消息、评测、自动任务、锁或工作区，A 可继续完成。
  - 第一阶段 owner 失联仍占预约/容量至维护，没有接管或自动重放。
  - 全停维护后容量恢复，清理完整。
  forbidden_side_effects:
  - 重启 B 导致 A 的任务被标记中断或目录消失。
  - TTL 到期或失联停止请求直接释放预约，导致外部业务重复执行。
  - 把失联运行当作正常完成，或影响非测试资源。
  acceptance:
  - id: AC-P1-008
    description: 重启隔离与失联预约的停机收敛边界。
    steps:
    - 1
    - 2
    - 3
    - 4
    - 5
    expected_results:
    - 1
    - 2
    - 3
    forbidden_side_effects:
    - 1
    - 2
    - 3
  tags:
  - phase-1
  source:
    spec_path: nexent-doc/docs/Developing/runtime-replica-scaling/proposal.md
    blocked_reason: 正常同伴重启和失联恢复路径均已绑定且隔离双进程验证通过；仍欠获准双工作节点和真实动态 RWX 上的正式执行和清理。
    primary_domain: runtime
    preparation_plan: 基于实际部署入口准备独占实例、数据库/Redis 数据域、身份和模型协议服务。正常重启校验健康 owner 容器标识不变；失联验证校验 Pod UID 后以短宽限期删除 owner，验证原流中断且接替 Pod 不接管。
    cleanup_plan: 关闭定向 Gateway 端口转发，回收本次 namespace、数据和动态卷；确认外部 PVC 及其他实例未被改动。
  risk_type: RELIABILITY
  risk: Pod 启动误恢复健康实例；丢失 owner 后预约自动过期导致重复外部副作用。
  condition:
  - 两个真实 Runtime Pod；单独重启 B、强杀 A 的 owner、跨 Redis TTL 观察及下一全停维护。
  metrics:
  - 健康 owner 的消息/评测/自动任务状态、租约和文件校验和，实际模型调用标记，失联预约和配额。
  thresholds:
  - 健康 owner 被误恢复数=0；失联后全停维护前额外业务调用数=0，预约始终未终态。
  - 维护后失联预约全部收敛，合法新运行成功；资源泄漏数=0。
  recovery_expectations:
  - 仅下一次全停维护释放失联预约；普通 Pod 重启保持原维护批次。第一阶段不验证自动接管。
