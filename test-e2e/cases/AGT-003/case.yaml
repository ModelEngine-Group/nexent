    卡。
  - 关键状态在 API 返回、数据库/存储和后续读取中保持一致；失败路径返回明确错误，不出现半写入、重复副作用或跨租户泄露。
  - 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
