  contract:
    protocol: HTTP JSON; preserve router prefix
    request_expectations:
    - 安装仓库Skill并查询普通仓库列表installed_copies和installation_state
    - 准备同名不同源、两个本地副本、只读副本和source=repository但无来源ID的历史副本
    - 以只读、其他租户或伪造skill_id执行卸载请求
    response_expectations:
    - 新安装返回本地skill_id；列表批量按租户和当前用户可见性联查skill_id/name/can_uninstall；installation_state仅为installed/not_installed/unknown，来源ID不作为授权依据。
    - 已知匹配副本时为installed（包括只读）；无匹配且存在当前用户可见的历史未知来源时为unknown；无匹配且无此歧义时为not_installed；多副本逐项列出，同名不同源不混淆，unknown不阻止按既有规则再次安装。
    - 调用已有本地删除权限校验，拒绝越权且仓库原件不受影响；用户需在已知副本中明确选定目标。
