schema_version: '1.0'
stage: D3
module: V5-BASELINE
case:
  case_id: API-AUTO-A89B8311DF78ECC0
  feature_id: F-079
  business_rule_ids:
  - F-079-RULE-01
  title: 删除 Skill 级联软清理统一标签分配且不越权清理其他租户标签｜核心流程
  type: INTEGRATION
  priority: P1
  status: active
  automation: automated
  objective: 删除 Skill 级联软清理统一标签分配且不越权清理其他租户标签｜核心流程
  preconditions:
  - Nexent 本地测试全栈已启动，health check 通过，真实 PostgreSQL 持久化与统一标签管理可用。
  - 设置 NEXENT_TEST_HOME，目录不位于 Nexent Git 仓库内。
  - 当次 run_id 已生成，所有新建资源名称带 run_id；测试基线固定为 develop 当前批次锁定的产品提交；执行时另记录实际被测commit。
  - 所需本地资产存在且校验通过：${NEXENT_TEST_HOME}/config/users.yaml；${NEXENT_TEST_HOME}/config/secrets.env；${NEXENT_TEST_HOME}/assets/skills/
  - users.yaml 中 TenantA Admin、TenantB Admin 两个隔离租户账号可登录，测试租户数据可被清理。
  - 统一标签库已初始化且 skill 资源类型已绑定激活标签库，可为 Skill 分配标签。
  test_data:
    legacy_asset_declaration: '- ${NEXENT_TEST_HOME}/config/users.yaml

      - ${NEXENT_TEST_HOME}/config/secrets.env

      - ${NEXENT_TEST_HOME}/assets/skills/'
  steps:
  - order: 1
    action: 从 config/users.yaml 准备 TenantA Admin 与 TenantB Admin 两个隔离账号，密码/Token 仅从 secrets.env 注入；所有新建 Skill 与标签分配均带 run_id
      唯一前缀。
    expected: 功能结果与代码契约一致，测试过程无未处理异常。
  - order: 2
    action: 在 TenantA 通过实际 Skill API（POST /skills）创建带 run_id 名称的临时 Skill，记 name_A；调用 GET /skills/{name_A} 读取其 skill_id，记为
      skill_id_A。
    expected: 关键状态在 API 返回、数据库/存储和后续读取中保持一致。
  - order: 3
    action: 对 skill_id_A 通过统一标签管理 API 分配固定标签（resource_type=skill），并查询标签分配详情，确认存在 active（delete_flag=N）的 ResourceTagAssignment
      记录（assignment_count>0）。
    expected: 失败路径返回明确错误，不出现半写入、重复副作用或跨租户泄露。
  - order: 4
    action: 在 TenantB 创建带 run_id 名称的临时 Skill（记 name_B，读取 skill_id_B）并同样为其分配标签，作为跨租户对照组；确认 TenantB 该 skill 的 active 标签分配存在。
    expected: 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
  - order: 5
    action: 以 TenantA Admin 身份调用 DELETE /skills/{name_A} 删除 skill_A，断言返回 HTTP 200 且响应消息为 "Skill {name_A} deleted successfully"。
    expected: DELETE /skills/{name_A} 后，skill_A 的 ResourceTagAssignment（tenant_id=TenantA、resource_type='skill'、resource_id=skill_id_A）全部由
      delete_flag='N' 变更为 'Y'（软删除）；TenantB 中 skill_id_B 的标签分配保持 delete_flag='N' 且可读，证明标签清理只作用于被删 Skill 及其租户。
  - order: 6
    action: 删除后重新 GET /skills/{name_A} 或读取数据库，确认 ag_skill_info_t 记录 delete_flag='Y'（软删除）且关联 SkillInstance 同步软删除，无孤儿实例。
    expected: DELETE /skills/{name_A} 后，skill_A 的 ResourceTagAssignment（tenant_id=TenantA、resource_type='skill'、resource_id=skill_id_A）全部由
      delete_flag='N' 变更为 'Y'（软删除）；TenantB 中 skill_id_B 的标签分配保持 delete_flag='N' 且可读，证明标签清理只作用于被删 Skill 及其租户。
  - order: 7
    action: 查询数据库 ResourceTagAssignment 表，断言 tenant_id=TenantA、resource_type='skill'、resource_id=str(skill_id_A) 的 active（delete_flag='N'）记录数量为
      0，即 cleanup_resource_assignments 已将其软删除为 'Y'。
    expected: DELETE /skills/{name_A} 后，skill_A 的 ResourceTagAssignment（tenant_id=TenantA、resource_type='skill'、resource_id=skill_id_A）全部由
      delete_flag='N' 变更为 'Y'（软删除）；TenantB 中 skill_id_B 的标签分配保持 delete_flag='N' 且可读，证明标签清理只作用于被删 Skill 及其租户。
  - order: 8
    action: 断言 tenant_id=TenantB、resource_id=str(skill_id_B) 的 ResourceTagAssignment 仍保持 delete_flag='N' 且可正常读取，证明清理仅作用于被删
      Skill 及其租户，不越权清理其他租户资源标签。
    expected: DELETE /skills/{name_A} 后，skill_A 的 ResourceTagAssignment（tenant_id=TenantA、resource_type='skill'、resource_id=skill_id_A）全部由
      delete_flag='N' 变更为 'Y'（软删除）；TenantB 中 skill_id_B 的标签分配保持 delete_flag='N' 且可读，证明标签清理只作用于被删 Skill 及其租户。
  - order: 9
    action: 清理本次创建的临时 Skill（name_A、name_B）与遗留标签分配，确保可重复执行。
    expected: DELETE /skills/{name_A} 后，skill_A 的 ResourceTagAssignment（tenant_id=TenantA、resource_type='skill'、resource_id=skill_id_A）全部由
      delete_flag='N' 变更为 'Y'（软删除）；TenantB 中 skill_id_B 的标签分配保持 delete_flag='N' 且可读，证明标签清理只作用于被删 Skill 及其租户。
  expected_results:
  - 功能结果与代码契约一致，测试过程无未处理异常。
  - 关键状态在 API 返回、数据库/存储和后续读取中保持一致。
  - 失败路径返回明确错误，不出现半写入、重复副作用或跨租户泄露。
  - 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
  - DELETE /skills/{name_A} 后，skill_A 的 ResourceTagAssignment（tenant_id=TenantA、resource_type='skill'、resource_id=skill_id_A）全部由
    delete_flag='N' 变更为 'Y'（软删除）；TenantB 中 skill_id_B 的标签分配保持 delete_flag='N' 且可读，证明标签清理只作用于被删 Skill 及其租户。
