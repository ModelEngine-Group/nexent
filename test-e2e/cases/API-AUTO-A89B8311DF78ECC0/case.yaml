  - 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
  - DELETE /skills/{name_A} 后，skill_A 的 ResourceTagAssignment（tenant_id=TenantA、resource_type='skill'、resource_id=skill_id_A）全部由
    delete_flag='N' 变更为 'Y'（软删除）；TenantB 中 skill_id_B 的标签分配保持 delete_flag='N' 且可读，证明标签清理只作用于被删 Skill 及其租户。
