case:
  case_id: UT-BE-AUTO-3B69B045EA9A318F
  feature_id: F-156
  business_rule_ids:
  - F-156-RULE-01
  title: 系统提示 header 移除 tenant app 名称/描述与 user_id，改注入静态 Nexent 身份，authority 由 tenant 变 platform｜核心流程
  type: BE-UT
  priority: P1
  status: active
  automation: automated
  objective: 系统提示 header 移除 tenant app 名称/描述与 user_id，改注入静态 Nexent 身份，authority 由 tenant 变 platform｜核心流程
  preconditions:
  - 本地依赖/组件测试环境可运行；不要求外部模型服务在线。
  - backend/utils/context_utils.py 及其导入的 nexent.core.agents.context（ContextItemInput/ContextItemType/ContextInput）与 consts.const
    可正常导入。
  - 当次 run_id 已生成；测试基准为被测仓库 backend/utils/context_utils.py 当前源码，执行时记录实际被测 commit 与 repo 相对路径。
  test_data:
    legacy_asset_declaration: '- 无额外本地资产；测试直接导入 backend/utils/context_utils.py 与 SDK 上下文类型定义（nexent.core.agents.context /
      context_input）。'
  steps:
  - order: 1
    action: 从 backend/utils/context_utils.py 直接导入 `_build_header_text` 与 `build_context_inputs`。
    expected: '`_build_header_text` 签名仅含 language（默认 "zh"），不再接收 app_name/app_description/user_id。'
  - order: 2
    action: 分别以 language="zh" 与 language="en" 调用 `_build_header_text(language)`，记录返回的 header 文本。
    expected: 'zh header 文本为固定静态内容 "### 基本信息\n你是 Nexent，Nexent 是一个开源智能体平台，...（含 [Current time: ...] 时间提示）"，不含 tenant app 名称/描述或
      user_id。'
  - order: 3
    action: 断言 zh 文本以 "### 基本信息" 开头，包含静态身份 "你是 Nexent" 与静态描述 "Nexent 是一个开源智能体平台"。
    expected: 'en header 文本为固定静态内容 "### Basic Information\nYou are Nexent. Nexent is an open-source agent platform...（含 [Current
      time: ...] 时间提示）"。'
  - order: 4
    action: 断言 en 文本以 "### Basic Information" 开头，包含 "You are Nexent." 与 "Nexent is an open-source agent platform"。
    expected: '`build_context_inputs` 输出中存在唯一 header 项：id=="system:header"、authority=="platform"、priority==100、source 为 agent_prompt:header。'
  - order: 5
    action: 断言 header 文本不包含 tenant 传入的 app 名称/描述或 user_id 注入位置；用 inspect.signature 校验函数签名不含 app_name/app_description/user_id
      形参。
    expected: '`build_context_inputs` 签名不含 app_name/app_description/user_id，无法再注入 tenant 身份信息。'
  - order: 6
    action: 调用 `build_context_inputs()`（不传 app_name/app_description/user_id），从返回值中找到 id=="system:header" 的 ContextItemInput。
    expected: 无未处理异常；日志不输出 API Key/Token/Password。
  - order: 7
    action: 断言该 header item 的 metadata["authority"]=="platform"、priority==100、source==("agent_prompt:header",) 且 content["text"]
      等于 `_build_header_text(language)` 的输出。
    expected: 无未处理异常；日志不输出 API Key/Token/Password。
  - order: 8
    action: 断言返回值中不存在 authority 为 "tenant" 的 header 项；调用过程无未处理异常且日志不输出任何密钥。
    expected: 无未处理异常；日志不输出 API Key/Token/Password。
  expected_results:
  - '`_build_header_text` 签名仅含 language（默认 "zh"），不再接收 app_name/app_description/user_id。'
  - 'zh header 文本为固定静态内容 "### 基本信息\n你是 Nexent，Nexent 是一个开源智能体平台，...（含 [Current time: ...] 时间提示）"，不含 tenant app 名称/描述或 user_id。'
  - 'en header 文本为固定静态内容 "### Basic Information\nYou are Nexent. Nexent is an open-source agent platform...（含 [Current time:
    ...] 时间提示）"。'
  - '`build_context_inputs` 输出中存在唯一 header 项：id=="system:header"、authority=="platform"、priority==100、source 为 agent_prompt:header。'
  - '`build_context_inputs` 签名不含 app_name/app_description/user_id，无法再注入 tenant 身份信息。'
  - 无未处理异常；日志不输出 API Key/Token/Password。
  forbidden_side_effects: []
