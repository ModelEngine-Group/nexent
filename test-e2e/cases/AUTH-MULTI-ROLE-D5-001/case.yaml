schema_version: '1.0'
stage: D5
module: AUTH-IDENTITY
case:
  case_id: AUTH-MULTI-ROLE-D5-001
  feature_id: AUTH-MULTI-ROLE
  requirement_ids:
  - AUTH-MULTI-ROLE-20261031
  business_rule_ids:
  - AUTH-MULTI-ROLE-RULE-03
  - AUTH-MULTI-ROLE-RULE-04
  - AUTH-MULTI-ROLE-RULE-06
  title: 并发角色更新不破坏最后管理员与邀请码容量
  type: RELIABILITY
  priority: P0
  status: active
  automation: automated
  objective: 并发角色更新不破坏最后管理员与邀请码容量
  preconditions:
  - Current-source management and required operations permission entry shell are available in an isolated test deployment.
  - Logical fixture accounts su, tenant_a_admin_1, tenant_a_admin_2, tenant_a_user and tenant_b_admin have isolated
    owned data.
  - No mutation touches shared users; cleanup uses the fixture SU account and keeps all evidence outside Git.
  test_data:
    tenants:
    - tenant_a
    - tenant_b
    ordinary_roles:
    - ADMIN
    - DEV
    - USER
    - OPS
  steps:
  - order: 1
    action: Prepare exactly two effective tenant ADMIN users and use isolated SU requests with a synchronization
      barrier to concurrently remove ADMIN from both; repeat with fresh fixtures for 20 rounds.
    expected: Each round retains at least one effective ADMIN, at least one invalidating request returns 409, and
      denied writes do not partially change roles or user state.
  - order: 2
    action: Prepare a non-admin target with two editor forms; commit DEV plus OPS successfully, then commit USER
      plus OPS successfully; race two signups against a capacity-one invitation.
    expected: User ends with USER plus OPS, each successful change audits the actual prior and final array, no version
      is required; at most one signup consumes the invitation and no failed signup leaves partial local rows.
  - order: 3
    action: Restore administrator fixtures through SU and reread user/invite state after releasing transactions.
    expected: Locks are released, final roles and invitation usage agree with committed transactions, and fixture
      cleanup succeeds.
  expected_results:
  - Each round retains at least one effective ADMIN, at least one invalidating request returns 409, and denied writes
    do not partially change roles or user state.
  - User ends with USER plus OPS, each successful change audits the actual prior and final array, no version is
    required; at most one signup consumes the invitation and no failed signup leaves partial local rows.
  - Locks are released, final roles and invitation usage agree with committed transactions, and fixture cleanup
    succeeds.
  forbidden_side_effects:
  - Zero effective tenant admins, over-capacity invite consumption, treating stale-form replacement as a version
    conflict.
  acceptance:
  - id: AC-01
    description: Each round retains at least one effective ADMIN, at least one invalidating request returns 409,
      and denied writes do not partially change roles or user state.
    steps:
    - 1
    expected_results:
    - 1
  - id: AC-02
    description: User ends with USER plus OPS, each successful change audits the actual prior and final array, no
      version is required; at most one signup consumes the invitation and no failed signup leaves partial local
      rows.
    steps:
    - 2
    expected_results:
    - 2
  - id: AC-03
    description: Locks are released, final roles and invitation usage agree with committed transactions, and fixture
      cleanup succeeds.
    steps:
    - 3
    expected_results:
    - 3
    forbidden_side_effects:
    - 1
  risk_type: RELIABILITY
  risk: Concurrent administrator removal or capacity consumption bypasses transaction-wide invariants.
  condition:
  - Two actual concurrent PostgreSQL-backed requests synchronized at the transaction boundary; no mocked locks or
    counters.
  metrics:
  - Effective ADMIN users per round, successful role commits, capacity usage and remaining partial rows.
  thresholds:
  - 20 of 20 rounds retain at least one ADMIN; capacity never exceeds one; zero partial failed writes.
  recovery_expectations:
  - SU can restore owned fixtures and all transaction locks are released after each round.
