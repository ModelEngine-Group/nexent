case:
  case_id: JIUWEN-OUTPUT-D4-001
  feature_id: JIUWEN-OUTPUT
  requirement_ids:
  - JIUWEN-M5-20261016
  - JIUWEN-UNIFIED-OUTPUT-20261016
  business_rule_ids:
  - JIUWEN-OUTPUT-RULE-001
  - JIUWEN-OUTPUT-RULE-002
