notes: Self-contained HTTP contract with actual FastAPI routing, ThreadManager and
  product OTLP file storage/reader. Only PG authority/catalog and existing unrelated
  directory services are controlled; no live PG, provider or deployed multiworker
  proof is claimed. Each fixture owns its temporary root and TestClient, shuts down
  the managed workers in finally and asserts zero active workers. No shared preparation
  family, deployment, browser or business asset is required. The after-read content
  transition variants invoke the actual decoder before controlled expiry, real local
  cleanup or catalog membership revocation. Final HTTP responses must reject that
  already-read chunk without a success body. These assertions are prepared; their
  current execution remains deferred by the user.
