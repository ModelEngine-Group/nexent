notes: Self-contained HTTP contract with actual FastAPI routing, ThreadManager and product OTLP file storage/reader.
  The tenant-facet variants execute actual catalog ORM on owned in-memory SQLite membership rows, dispose the engine,
  and assert the connection is released; PostgreSQL syntax is covered separately by traditional UT compilation.
  Global schedule tests control only the configuration persistence boundary; repository transaction/lock
  assertions remain traditional UT and do not establish live PostgreSQL atomicity. Manual scope tests
  delete real owned tenant files and verify another tenant remains readable. The retained-summary regression
  controls the PG persistence result while checking actual HTTP file cleanup, preserved metric DTOs and no
  archive access from subsequent list requests; it does not claim real PostgreSQL retention validation.
  Only PG authority/catalog and existing unrelated directory services are controlled; no live PG, provider or deployed
  multiworker proof is claimed. Each fixture owns its temporary root and TestClient, shuts down the managed workers
  in finally and asserts zero active workers. No shared preparation family, deployment, browser or business asset
  is required. The after-read content transition variants invoke the actual decoder before controlled expiry, real
  local cleanup or catalog membership revocation. Final HTTP responses must reject that already-read chunk without
  a success body. These assertions are prepared; their current execution remains deferred by the user.
