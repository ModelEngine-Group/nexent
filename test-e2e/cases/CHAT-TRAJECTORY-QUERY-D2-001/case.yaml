    description: 工具结果和大正文共用contents且每块至多1MiB，通过普通HTTP读取；非白名单来源422、跨会话引用404。轨迹读取GET保持4条，另增设置GET/PUT，三级选择直接复用用户POST并扩展2个会话GET，未知指标为null，新归档仅在新查询中出现；页面的网络请求及交互均对应静态历史查看。
    steps:
    - 4
    expected_results:
    - 4
    forbidden_side_effects:
    - 1
    - 2
  - id: AC-05
    description: 仅新增1个清理POST，轨迹读取GET保持4条，另增设置GET/PUT、2个会话GET的原分支保持兼容，用户POST直接复用；成功沿用code/message/data，逐批返回固定cutoff_at、scanned_runs/deleted_runs/deleted_bytes/skipped_active/pending_runs/failed_runs/next_cursor/done。统计为本批，done只表示扫描结束，失败或待处理明确展示；每批重新授权。非法参数/游标422、普通角色403、占用409且有Retry-After、挂载失败503；客户端只能传天数/游标，无法指定租户或路径。
    steps:
    - 5
    expected_results:
    - 5
  - id: AC-06
    description: 直接复用用户分页搜索并保持原message/data/pagination；两个会话路由默认查询登录用户，权限/包装/512字符游标及置顶保持。view=trajectory时只准ADMIN/SU，target_user_id必填且先核验可信租户；agent:ID/other及普通/工作台分类正确，items默认20最多100，pinned/included为空，游标在服务端绑定actor/tenant/owner/分类/组/搜索且上限2048。非轨迹请求传target_user_id拒绝，跨用户/租户游标不可复用；meta归属不符候选不泄漏，短页按已检查位置推进。
    steps:
    - 6
    expected_results:
    - 6
  - id: AC-07
    description: 集合在ADMIN当前租户/SU授权全部范围先授权再筛选，按历史root_agent_id、模型、状态、UTC闭区间及会话ID筛选；分页排序基于固定查询成员；四卡只读授权租户或全局的全量统计快照，新执行仅刷新纳入、撤权及过期立即排除。后台生成全量去重会话数、根耗时均值/线性插值分位数及有效模型TTFT（含0），接口返回computed_at和统计范围；空值最后，超预算503而非部分总数。facet候选授权、搜索分页及上下级范围正确；智能体Token/调用次数按完整子树计算，与节点分页无关，fragment/重复Span不重复计数，未知保留null。
    steps:
    - 7
    expected_results:
    - 7
  - id: AC-08
    description: 引用为服务端随机ID，成功正文与原值一致；未知/错类型/跨身份及缓存失效引用422且不返回正文，重新查询的新引用可读取；普通角色仍403。
    steps:
    - 8
    expected_results:
    - 8
  - id: AC-09
    description: view=conversation每会话一行，最新执行状态优先于历史模型/ID条件；累计指标与命中执行汇总分开；四态可筛选且未知不填零。查询快照固定成员和最新状态，详情按顺序分页返回round_no、版本和匹配标记，清理与撤权仍即时失效；省略view保留逐执行合同。
    steps:
    - 9
    expected_results:
    - 9
  - id: AC-10
    description: records与facet仅调用PG，摘要按会话聚合且NULL累计不冒充完整；搜索不匹配子Trace ID。同一执行同时命中模型/Agent/时间；最新状态先确定。query_id固定成员与顺序，更新仅新查询纳入；撤权/清理使旧快照失效。顶部统计不随列表筛选重算，读取完整统计行及computed_at；详情仍按需读取OTLP。
      PostgreSQL累计Token按NUMERIC/Decimal边界输入，HTTP返回JSON整数，null与零保持，查询快照可继续翻页。
    steps:
    - 10
    expected_results:
    - 10
  - id: AC-11
    description: ADMIN/SU通过GET/PUT /trajectory/cleanup/schedule读取和持久化租户扫描周期，重读保留新值；普通角色403、跨租户404，非法或未知字段422，数据库故障503；配置请求保持private,no-store且不访问轨迹文件。
    steps:
    - 11
    expected_results:
    - 11
