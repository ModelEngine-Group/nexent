    blocked_reason: Product and fixed automation are not implemented; this is a design contract.
  execution:
    profiles:
    - name: mock
      required_services: []
  contract:
    protocol: HTTP/JSON
    endpoint: POST /users/list; GET /conversation/agent_groups; GET /conversation/agent_groups/{group_key}/conversations; GET /trajectory/conversations/{conversation_id};
      GET /trajectory/conversations/{conversation_id}/snapshot; GET /trajectory/conversations/{conversation_id}/contents/{content_id}; POST /trajectory/cleanup
    method: GET / POST
    request_expectations:
    - 所有轨迹读取（含view=trajectory分支）先校验ADMIN/SU、可信租户和选定用户/智能体/会话关联；会话列表要求view=trajectory、target_user_id和路径group_key，NULL组为other。
    - 签名游标绑定actor/tenant/target_user/selected_agent/会话/快照；不接入实时协议。
    - 清理POST只接收before_days及cursor；ADMIN当前租户/SU受信目标租户，签名游标绑定身份/租户/天数/固定UTC截止时间和扫描位置。
    response_expectations:
    - 用户/智能体/会话分页、静态节点DTO、正文引用、覆盖和错误符合设计“查询与自研展示”。
    - 思考只展示真实已采集值；静态快照及再次查询的成员规则明确，contents仅接受聊天正文和record的input/output/raw/reasoning。
    - 清理结果及422/403/409 Retry-After/503遵守设计；单批统计与next_cursor保持有界，done不掩盖失败/待处理。
