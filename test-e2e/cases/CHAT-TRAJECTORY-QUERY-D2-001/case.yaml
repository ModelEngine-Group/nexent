schema_version: '1.0'
stage: D2
module: CHAT-MESSAGE
case:
  case_id: CHAT-TRAJECTORY-QUERY-D2-001
  feature_id: CHAT-TRAJECTORY
  requirement_ids:
  - CHAT-LOCAL-TRAJECTORY-20261103
  business_rule_ids:
  - TRJ-RULE-002
  - TRJ-RULE-003
  - TRJ-RULE-004
  - TRJ-RULE-005
  - TRJ-RULE-007
  - TRJ-RULE-006
  title: 管理员历史GET保持有界，主动清理POST按固定范围分批返回
  type: CONTRACT
  priority: P1
  status: blocked
  automation: automated
  objective: 管理员历史GET保持有界，主动清理POST按固定范围分批返回
  preconditions:
  - 设计阶段；轨迹产品接口、固定脚本和 case-local execution.yaml 尚未实现，本 Case 不可计为通过。
  - 使用隔离测试会话、租户和独占轨迹根目录；记录被测提交、配置快照和本用例资源清单。
  - 读取使用可信ADMIN/SU身份，目标会话由独立普通用户创建；actor与owner区分，非管理员读取应拒绝。
  - 业务trace_id直接复用现有conversation_id；菜单按用户→最近根智能体→会话，打开后读取整个会话范围；PG复用现有表结构和查询，轨迹正文及执行清单全部为文件。
  - 基于现有MonitoringManager，通过MONITORING_TRACE_SINK选择otlp/local_file/both；本地业务正文为正文内嵌的标准OTLP JSONL，会话meta.json保存归属、执行清单和确认进度。
  - 目录使用tenant/user/storage_agent/conversation业务ID，storage_agent_id固定为首次采集根Agent；稳定owner/会话锁串行首次定位与登记。会话切换根Agent仍读写同一物理目录。
  - 所有正文内嵌OTLP Span属性/Events；256KiB为批量刷盘阈值，单行可更大。读写须处理大型字符串的增量编码/解码，正文API按解码后的UTF-8区间返回。
  - 清理服务具备可控UTC时钟与独占文件夹具；定期默认30天/3600秒，可关闭；主动POST /trajectory/cleanup固定可信租户和首次截止时间，全部产品/脚本仍待实现。
  - 用户搜索直接复用POST /users/list；Agent/会话选择在既有两个GET增加view=trajectory、target_user_id及普通/工作台分类；新增仅3个轨迹GET及清理POST，原分支行为保持。
  test_data:
    profile: mock
  steps:
  - order: 1
    action: 用ADMIN准备两个用户、超过两页最近Agent分组/会话、切换过根Agent的会话及已删除/未知Agent/旧会话；分页选择并手输不匹配ID、篡改筛选/游标；构造一页候选中有文件头租户不符的会话，普通创建者直接请求。
    expected: 授权目录默认20最多100，用户/最近agent_id/会话不匹配404，普通创建者403；actor与target_user区分，HTTP包装不变。分组只用现有agent_id，切换后仅在最近组，子Agent不入根组，未知不造ID；文件头不符候选被过滤且无标题/聊天泄漏，允许短页并按已检查候选返回游标，不扫描正文或无界追读凑页。
      物理目录按tenant/user/首次根Agent/conversation组织，meta各层一致；最近Agent筛选不要求其等于storage_agent_id，切换和删除Agent后仍可读取全部保留执行。
  - order: 2
    action: 通过详情固定publication_no/cleanup_version和聊天message_id上界，分页读取节点DTO/源摘要；期间归档新运行，篡改cursor和limit，并测试清理换代。
    expected: 摘要默认50最多200且≤2MiB，节点DTO单段≤500条/8MiB，源UUID/seq保持字符串；原快照内旧成员无重复/跳过，新归档仅显式查询后出现；清理换代返回snapshot_reset，参数/游标篡改拒绝。最近Agent只筛会话，不裁剪会话内其他Agent执行，trace_id与conversation_id同值。
  - order: 3
    action: 以管理员冷读OTLP中已归档reasoning、模型输入输出及工具结果，覆盖内嵌值和Unicode/尾随换行；核对节点DTO的parent_id/source、物理attempt和片段归并，另测试未返回思考、未采集、过期、损坏及未挂载。 覆盖1MiB及4MiB字段、转义引号/反斜杠/换行、Unicode多字节跨块，监测解析缓冲。
    expected: OTLP→节点DTO思考/工具内容和业务父子正确，物理attempt各自独立；fragment与最终Span按源ID/区间去重。普通正文完整，超大字段按至多1MiB分块读全；未知思考不补造，410/503/trajectory_corrupt明确。节点id复用record_id、parent_id关联业务父，source保留实际traceId/spanId及export_seq，排序位置独立；duration_ms=20表示20ms，OTLP业务trace属性与原生ID分别保留。
      大行中的正文增量解码后与原安全值一致，正文游标使用解码后UTF-8字节区间，拼接各块无缺失/重复/乱码；不把JSON转义字节偏移当作正文偏移。解析缓冲及峰值内存有实际证据。
  - order: 4
    action: 使用快照中的output正文引用，经统一contents反复冷读工具结果并分块取大结果；以合法管理员篡改为内部文件来源及跨会话引用；完成新运行后再次查询，检查缺usage/时间记录及新增路由集合。
    expected: 工具结果和大正文共用contents且每块至多1MiB，通过普通HTTP读取；非白名单来源422、跨会话引用404。新增轨迹GET恰为3条，三级选择直接复用用户POST并扩展2个会话GET，未知指标为null，新归档仅在新查询中出现；页面的网络请求及交互均对应静态历史查看。
  - order: 5
    action: 使用ADMIN/SU向POST /trajectory/cleanup提交before_days=7并沿next_cursor遍历；覆盖1/3650边界、0/负数/小数/3651、篡改/跨actor/跨租户游标、批次间撤权、409占用与503挂载失败；检查GET保持只读。
    expected: 仅新增1个清理POST，新增轨迹GET保持3条、2个会话GET的原分支保持兼容，用户POST直接复用；成功沿用code/message/data，逐批返回固定cutoff_at、scanned_runs/deleted_runs/deleted_bytes/skipped_active/pending_runs/failed_runs/next_cursor/done。统计为本批，done只表示扫描结束，失败或待处理明确展示；每批重新授权。非法参数/游标422、普通角色403、占用409且有Retry-After、挂载失败503；客户端只能传天数/游标，无法指定租户或路径。
  - order: 6
    action: 依次请求POST /users/list、两个现有会话GET的默认分支和view=trajectory分支；比较旧调用响应、普通身份自己的轨迹视图、跨用户/租户参数、工作台/NULL组、大量置顶项及篡改游标，核对路由数量。
    expected: 直接复用用户分页搜索并保持原message/data/pagination；两个会话路由默认查询登录用户，权限/包装/512字符游标及置顶保持。view=trajectory时只准ADMIN/SU，target_user_id必填且先核验可信租户；agent:ID/other及普通/工作台分类正确，items默认20最多100，pinned/included为空，游标签名绑定actor/tenant/owner/分类/组/搜索且上限2048。非轨迹请求传target_user_id拒绝，跨用户/租户游标不可复用；meta归属不符候选不泄漏，短页按已检查位置推进。
