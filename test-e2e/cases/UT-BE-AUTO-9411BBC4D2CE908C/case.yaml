    - 测试代码不得读取生产凭据。'
  assertions:
  - capacity_snapshot=None 时 _resolve_context_budget 返回 None，不触发 ContextBudgetCalculator 调用。
  - W2 预算可用时返回 ContextBudgetSnapshot，且 effective_input_limit_tokens、compaction_trigger_threshold_tokens、compaction_target_tokens
    与计算器输出一致（非 None）。
  - 无 agent 请求输出 token 时 output_reserve_source="model_default"；有 agent 请求输出 token 时 output_reserve_source="agent"；request_requested_output_tokens
    非空时透传至 request_overrides.requested_output_tokens。
  - 计算器抛出 UncertaintyReserveBasisUnknown 时返回 None（供 create_agent_config 回退：token_threshold=input_budget，三个新字段置 0），不向上抛出该异常。
  - 回退路径日志包含 "falling back to W1 input_budget"，且日志/报告不含明文凭据，测试可重复执行无残留副作用。
