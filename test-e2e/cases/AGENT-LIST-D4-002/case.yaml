  steps:
  - order: 1
    action: Open the Agent list at the desktop viewport and inspect content/header/expanded-guide
      and card grid bounding boxes. Inspect representative card title/description/footer/status/more
      glyph computed styles and positions. Hover and keyboard-focus an editable card,
      open the existing more menu, collapse and expand the guide, then search for
      a matching Agent. Switch to table view and back to cards, change page size/page,
      and activate an existing configuration/publication or creation control.
    expected: Content is 1856px wide with 24px padding and a 48px header; the 1808x378px
      guide, introduction/process typography and four 440x148px card columns match
      the inspected sub-layout and gaps within 1px. The scroll viewport retains 1px
      drawing space around first-row and outer-column cards so the outside stroke
      is visible without changing card coordinates, toolbar-to-card gap12 or pagination
      position. The header contains 收起教程 with text before its arrow; the hidden guide-internal
      toggle is absent. The frozen typography, colors, padding, radius, outside stroke
      retaining 392px inner width, 86px body with header-description gap4, 18px footer
      at top98 with left-aligned date/status gap78 and status left197, 8px status
      dot with 4px text gap and 12px more glyph at top16/right24 match. Parent group
      gap8 is not assigned an unconfirmed child role; date slot119 and footer gap12
      are labeled as derived. Data labels remain truthful. Existing configure/publication/more
      controls stay reachable, the header toggles between 展开教程 and 收起教程 with matching
      expanded state, search shows the same data-backed collection, and presentation
      interactions cause no business write. Existing table columns/actions/timestamp
      semantics and server-backed pagination remain intact, card mode restores the
      refined layout, and controls use existing navigation/dialog flows.
  - order: 2
    action: Return to the list, mock an empty response and inspect the guide height/divider,
      then restore populated data and resize to the constrained viewport. At the constrained
      viewport inspect guide/card/toolbar reachability and document width.
    expected: Empty data retains the 378px guide and a visible divider that adds no
      guide height; populated data restores the same measured desktop guide. Existing
      responsive card reflow keeps visible controls usable without horizontal page
      overflow; desktop pixel constants do not force a fixed-width page.
  - order: 3
    action: Open the English locale and inspect longer translated introduction/step
      copy and tutorial toggle.
    expected: Steps retain their 156px minimum and may grow naturally to avoid text
      clipping; Expand tutorial and Collapse tutorial remain usable without page overflow.
      Chinese exact-height assertions are not applied to longer translated text.
  expected_results:
  - Desktop browser bounds match each frozen guide/card measurement within 1px and
    numeric typography/colors match the exact contract. Guide expanded height is 378px
    for populated and empty data; collapse/expand preserves list data and the empty-only
    divider sits outside the guide height. Header tutorial toggle has the frozen 72x22px
    bounds, 14/22px/400/#191919 text before an 8px arrow and 6px gap; no hidden guide-internal
    toggle is implemented. Introduction/process copy has the frozen font sizes, line
    heights, weights, colors and positions; steps are 339.2x156px with 16px gaps.
    Card grid has four desktop columns, 16px horizontal and 12px vertical gaps; title
    and description do not collide with adjacent controls. The 1px outside stroke
    is not clipped by the scroll viewport along the first row or the left/right outer
    columns, while original card bounds and pagination positioning are retained. Real
    metadata determines date/status/category values; unavailable values are placeholders
    and imported-Agent grouping remains disabled. Search, pagination, view switching
    and existing card/dialog/navigation controls remain available.
  - Narrow layout reflows without horizontal document overflow and retains usable
    controls.
  - Longer English guide copy remains readable with naturally growing step cards,
    localized tutorial controls and no horizontal page overflow.
  forbidden_side_effects:
  - Layout inspection, guide toggle, hover/focus and view switching must not cause
    an Agent write or model/provider call.
  - Do not change backend routes, payloads or response contracts.
  - Do not claim matching unavailable proprietary font glyphs from a font-family declaration
    alone.
  - Do not claim that missing five-step illustration or purple-avatar assets were
    replaced precisely; retain existing decoration, actual avatars and general fallback
    without generating guessed artwork.
  - Do not fabricate creator, update dates, publication status or import provenance.
  actor: Agent development list user
  journey:
  - Open expanded populated list
  - inspect measured guide/cards
  - use hover/focus controls
  - toggle guide
  - search and paginate
  - switch presentations
  - open existing operation
  - resize
  final_business_result:
  - The existing Agent collection is available with the measured presentation and
    unchanged action/data boundaries.
  - Existing list workflows remain reachable at desktop and constrained widths.
  failure_evidence:
  - Bounding-box or computed-style mismatch against the frozen inspector contract.
  - Lost metadata, navigation, search, pagination or action/permission behavior.
  - Business mutation caused solely by a presentation interaction or horizontal page
    overflow.
  acceptance:
