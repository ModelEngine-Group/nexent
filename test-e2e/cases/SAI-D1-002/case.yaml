schema_version: '1.0'
stage: D1
module: RUNTIME-SANDBOX
case:
  case_id: SAI-D1-002
  feature_id: SAI-001
  business_rule_ids:
  - SAI-001-R2
  title: Invocation failure and parent cancellation preserve resource ownership
  type: SDK-UT
  priority: P1
  status: active
  automation: automated
  objective: Clean partial construction and execution failures without releasing sibling
    resources.
  preconditions:
  - Invocation factories expose owned cleanup and cancellation hooks.
  test_data:
    failure_phases:
    - construction
    - execution
    close_grace_seconds: 5
  steps:
  - order: 1
    action: Fail construction after recording an owned executor and fail one task
      body.
    expected: Each owner is cleaned once and errors propagate.
  - order: 2
    action: Cancel the parent with an active child.
    expected: Child cancellation is delivered and teardown waits for completion.
  - order: 3
    action: Invoke after parent admission closes.
    expected: No new model or kernel is allocated.
  expected_results:
  - No invocation-owned resource remains after terminating callbacks.
  forbidden_side_effects:
  - No shared-container kill from a kernel lease cleanup failure
  - No false successful drain of a stuck invocation
  unit_boundary: Invocation lifecycle and sandbox lease cleanup
  inputs:
  - Partial allocation failure
  - Active child
  - Parent cancellation
  assertions:
  - Cleanup is invocation-owned and idempotent
  - Cancellation closes active resources
  - Late calls are rejected
  - A stuck child prevents workspace reclamation
  - Lease fallback never kills shared container
  execution:
    profiles:
    - name: mock
      required_services: []
  acceptance:
  - id: AC-01
    description: Clean partial construction and execution failures without releasing
      sibling resources.
    steps:
    - 1
    - 2
    - 3
    expected_results:
    - 1
    forbidden_side_effects:
    - 1
    - 2
