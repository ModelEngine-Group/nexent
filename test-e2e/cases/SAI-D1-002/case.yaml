schema_version: '1.0'
stage: D1
module: RUNTIME-SANDBOX
case:
  case_id: SAI-D1-002
  feature_id: SAI-001
  business_rule_ids:
  - SAI-001-R2
  title: Invocation failure and parent cancellation preserve resource ownership
  type: SDK-UT
  priority: P1
  status: active
  automation: automated
  objective: Invoke owned cleanup on construction/execution failure and drain active
    calls before allowing shared teardown.
  preconditions:
  - Invocation factories expose owned cleanup and cancellation hooks.
  test_data:
    failure_phases:
    - construction
    - execution
    close_grace_seconds: 5
  steps:
  - order: 1
    action: Fail construction after recording an owned executor and fail one task
      body.
    expected: Each owner is cleaned once and errors propagate.
  - order: 2
    action: Cancel the parent with an active child.
    expected: Child cancellation is delivered and teardown waits for completion.
  - order: 3
    action: Invoke after parent admission closes.
    expected: No new model or kernel is allocated.
  - order: 4
    action: Set only the parent stop_event with an active child and no parent cancellation_scope.
    expected: The active child observes its linked stop event and exits; its registration
      is drained.
  expected_results:
  - Terminated invocations unregister; stuck invocations retain registration and prevent
    shared teardown.
  forbidden_side_effects:
  - No false successful drain of a stuck invocation
  - No allocation after parent admission closes
  unit_boundary: Real invocation factory, wrapper, cancellation and drain collaboration;
    controlled model/CoreAgent and resource adapters
  inputs:
  - Partial allocation failure
  - Active child
  - Parent cancellation
  assertions:
  - Partial construction and execution failures call owned cleanup
  - Active children terminate before drain returns
  - Late calls are rejected
  - A stuck child prevents workspace reclamation
  - An event-only parent stop reaches the active invocation
  execution:
    profiles:
    - name: mock
      required_services: []
  acceptance:
  - id: AC-01
    description: Construction and execution failures invoke owned cleanup; parent
      drain rejects late calls and retains stuck registrations.
    steps:
    - 1
    - 2
    - 3
    expected_results:
    - 1
    forbidden_side_effects:
    - 1
    - 2
  - id: AC-02
    description: An event-only parent stop reaches the active child through the invocation
      factory.
    steps:
    - 4
