    - 列表响应结构稳定含 value/total_count/has_more/total_reliable；total_count 为目录∩权限交集数量，分页 value 无重复 kds_id 且长度不超过 page_size。
    - 详情失败仅该项降级为 resource_status=UNAVAILABLE，整页仍返回 200，其余项为 ACTIVE；is_multimodal 由 caption_enable 反推正确。
    - /knowledge-bases/count 的 total_count 与列表交集 total_count 一致，反映过滤后的可见集合而非租户总数。
    - 越权/未授权返回 401/403/404 且不泄露其他租户资源；失败路径不出现半写入、重复副作用或跨租户泄露。
    - 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
