  contract:
    protocol: HTTP API
    request_expectations:
    - 从 config/users.yaml 读取隔离测试账号（SU/Admin/UserA/UserB）及租户、用户组关系；密码/Token 仅从 secrets.env 注入，AIDP 凭据从部署配置读取。
    - 在测试租户内预置多个知识库权限记录，并在本地 AIDP 测试桩中返回覆盖这些 kb_id 的目录列表（含缺少卡片元数据 name/description/created_at/caption_enable 的条目）。
    - 以 UserA 的 Authorization 调用 GET /aidp-mgmt/knowledge-bases?page=1&page_size=2，记录 HTTP 状态与 JSON 结构。
    - 校验响应含 value/total_count/has_more/total_reliable 字段；total_count 等于目录与本地权限交集后的知识库数（不含 PRIVATE、非授权组及其他租户条目），value 长度不超过
      page_size。
    - 调用 page=2 校验交集分页：value 为交集剩余条目，无重复 kds_id；has_more 满足 page*page_size<total_count，越界页返回空 value 不报错。
    - 对 page_size=1、page_size=100 及 illegal page=0 发起请求，确认参数校验（page ge=1、page_size ge=1/le=100）返回 422 且不进入业务过滤。
    - 对目录中缺少卡片元数据的 kb_id，断言列表项通过惰性加载详情补齐 kds_name/description/created_at；caption_enable=1 时 is_multimodal=true，caption_enable
      为 0/"0" 时 is_multimodal=false。
    - 使本地 AIDP 测试桩对某一 kb_id 的详情返回失败：断言该项 resource_status="UNAVAILABLE" 且仍保留在 value 中，其余项 resource_status="ACTIVE"，整页返回 200
      不中断。
    - 调用 GET /aidp-mgmt/knowledge-bases/count，断言返回 total_count 与步骤 4 的交集 total_count 一致，反映过滤后可见集合而非租户总数。
    - 使用不在任何授权组且非 owner 的用户调用列表与计数，断言交集为空（total_count=0 且 value=[]）；缺失/非法 Authorization 返回 401；日志与错误响应不含明文密码/token/API key；清理本次预置记录。
