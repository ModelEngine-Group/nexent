schema_version: '1.0'
stage: D3
module: RUNTIME-KNOWLEDGE
case:
  case_id: DPR-KB-WORKER-D3-001
  feature_id: DPR-KNOWLEDGE
  requirement_ids: [DPR-002, DPR-003, DPR-006]
  business_rule_ids: [DPR-KNOWLEDGE-RULE-01, DPR-KNOWLEDGE-RULE-02, DPR-KNOWLEDGE-RULE-05]
  title: Execute a Runtime upload through signed authorization and real object/vector storage
  type: INTEGRATION
  priority: P1
  status: active
  automation: automated
  objective: Prove the owned upload worker reads pinned artifacts, invokes ModelService and publishes only confirmed vector generations.
  preconditions:
  - Docker and cached PostgreSQL 15, MinIO and Elasticsearch 8.17.2 images are available.
  test_data:
    resources: Three owned infrastructure containers and one Management authorization HTTP server.
    fixtures: Synthetic source, actual Management artifact publication and completed cleanse record; parser and model adapters are controlled.
  steps:
  - order: 1
    action: Prepare owned stores, publish a pinned source and cleanse artifact through production ports, and persist resource and cleansing records.
    expected: Source and artifact versions and checksums are confirmed; no data-process endpoint is started.
  - order: 2
    action: Admit an upload and let Runtime lifespan discover it from the read-only durable queue and execute it using signed Management authorization, production composition and ModelService.
    expected: Confirmed vectors carry the attempt generation and the job/manifest publish the same visible generation.
  - order: 3
    action: Deliver the same completed job again and inspect both the new vector index and a preexisting legacy sentinel index.
    expected: Model invocation and physical chunk counts stay unchanged; the legacy sentinel remains intact.
  - order: 4
    action: Search through the signed Runtime HTTP endpoint in accurate, semantic and hybrid modes, use Model.invoke rerank, and submit wrong-user, wrong-tenant and tampered requests. Run the bound tool search component, resolve exact source paths through Management RecordStore and pass its versioned references to Runtime; also query an unknown path and deny an unknown actor.
    expected: Only the visible authorized generation is returned; rerank receives its content and rejected calls do not invoke models. Weighted lexical hits expose plain matched terms, and hybrid score_details retain both normalized branch scores. Exact paths resolve authorized file IDs and source versions; unknown paths and an empty fixed file scope cannot become unrestricted queries.
  - order: 5
    action: Admit a version-zero deletion, let lifespan discover it, then inspect real vector keys for the deleted generation, a newer version, another file and another tenant.
    expected: The covered version is physically absent and the job confirms cleanup; newer and other scope vectors remain, and no model is called for deletion or completed redelivery. A subsequent signed search returns no deleted or unpublished generation.
  - order: 6
    action: Revoke membership after the controlled embedding returns but before its vector checkpoint, then query the running health server.
    expected: No new vector is written or version published; the failed attempt confirms writer closure without replaying the model. The dispatch task exits once, readiness returns 503 and liveness stays 200.
  - order: 7
    action: Stop the server, drain managed workers, close ports and remove owned containers and anonymous volumes.
    expected: No owned resource remains; application data, unrelated indexes and real model providers were not accessed.
  expected_results:
  - Exact source/artifact grants and actual storage protocols preserve actor, version and checksum.
  - Only confirmed current writes publish an authoritative visible generation.
  - Completed duplicate delivery does not rerun inference or multiply vectors, and legacy data is preserved.
  - Revocation prevents the next storage side effect and owner resources close.
  - Physical cleanup removes only the authorized file versions without depending on model configuration.
  - Signed text search and rerank preserve current KB scope and return only authoritative visible generations before and after deletion, including matched terms and normalized hybrid score_details. Management path selection supplies authorized file IDs and versions to Runtime; unknown paths and empty fixed scopes return no files.
  forbidden_side_effects:
  - No application storage, external model provider, data-process service, fallback query or automatic retry is used.
  integration_boundary:
  - Actual PostgreSQL, MinIO, Elasticsearch, Management signed HTTP authorization, Runtime job/worker/ingestor and ModelService with controlled parser and embedding adapter.
  - Final application images, real provider inference, legacy title/highlight/image/citation parity and Management source/artifact cleanup are not proved.
  observations:
  - Actual vector keys/count/generation, record visibility, artifact revisions, invocation count and retained legacy sentinel.
  cleanup:
  - Parent and probe remove only containers labeled with their generated run ID, including anonymous volumes; all ports, sockets and managed tasks close.
  acceptance:
  - id: AC-01
    description: Real pinned artifact and vector writes produce one visible Runtime generation.
    steps: [1, 2]
    expected_results: [1, 2]
    forbidden_side_effects: [1]
  - id: AC-02
    description: Duplicate completion does not rerun a model or overwrite legacy indexes.
    steps: [3]
    expected_results: [3]
    forbidden_side_effects: [1]
  - id: AC-03
    description: Revocation blocks vector publication and owned resources close.
    steps: [6, 7]
    expected_results: [4]
    forbidden_side_effects: [1]
  - id: AC-04
    description: Lifespan discovers fresh queued uploads and unstarted eligible deletes, owns shutdown and exposes dispatch termination through local readiness without retry or restart.
    steps: [2, 5, 6, 7]
    expected_results: [2, 4]
    forbidden_side_effects: [1]
  - id: AC-05
    description: One persisted delete attempt confirms actual vector absence and preserves newer and other scope data without model calls.
    steps: [5]
    expected_results: [5]
    forbidden_side_effects: [1]
  - id: AC-06
    description: Signed Runtime search and Management grants enforce scope and visibility while embedding/rerank use Model.invoke and deleted generations remain absent.
    steps: [4, 5]
    expected_results: [6]
    forbidden_side_effects: [1]
  - id: AC-07
    description: The Runtime tool search component reads the authorized visible generation through standard knowledge retrieval and an empty fixed file whitelist performs no query.
    steps: [4]
    expected_results: [6]
    forbidden_side_effects: [1]
  - id: AC-08
    description: Management resolves exact source paths to authorized versioned file identities using real PG; unknown paths return an empty scope and an unauthorized actor cannot select files.
    steps: [4]
    expected_results: [6]
    forbidden_side_effects: [1]
