case:
  case_id: REL-AUTO-0ED11882BC558420
  feature_id: V5-REL-AUTO-0ED11882BC558420
  business_rule_ids:
  - V5-REL-AUTO-0ED11882BC558420-RULE-01
  title: 孤儿虚拟评测集启动清理与引用判定
  type: RELIABILITY
  priority: P1
  status: active
  automation: automated
  objective: 风险：no-set 评测场景在配置服务重启后，若评测集物化过程中断（进程崩溃/未成功挂接 pending run），会残留 source_filename=__no_set_virtual__ 且不被任何 AgentEvaluation
    引用的孤儿虚拟评测集及其 case，造成数据膨胀与后续引用误判。目标：验证 cleanup_orphaned_virtual_evaluation_sets 仅删除未被任何 delete_flag=N 的 run 引用的 __no_set_virtual__
    评测集及其全部 case，同时保留已被 run 引用的虚拟集、普通评测集与软删除记录。
  preconditions:
  - '- ${NEXENT_TEST_HOME}/config/secrets.env

    - 可读写的本地/组件测试数据库（含 evaluation_set / evaluation_set_case / agent_evaluation 表）

    - 当次 run_id 已生成，所有新建资源名称带 run_id，且测试租户数据可被清理'
  test_data:
    legacy_asset_declaration: '- ${NEXENT_TEST_HOME}/config/secrets.env

      - 可读写的本地/组件测试数据库（含 evaluation_set / evaluation_set_case / agent_evaluation 表）

      - 当次 run_id 已生成，所有新建资源名称带 run_id，且测试租户数据可被清理'
  steps:
  - order: 1
    action: 在测试数据库中构造四类评测集数据：A）source_filename=__no_set_virtual__、delete_flag=N 且不被任何 delete_flag=N 的 AgentEvaluation 引用的孤儿虚拟集
      S1 及其 2 条 EvaluationSetCase；B）source_filename=__no_set_virtual__、delete_flag=N 且被一条 delete_flag=N 的 AgentEvaluation
      引用的虚拟集 S2 及其 2 条 case；C）source_filename 为普通文件名的评测集 S3 及其 case（不命中过滤条件）；D）source_filename=__no_set_virtual__ 但 delete_flag=Y
      的软删除虚拟集 S4 及其 case。
    expected: cleanup_orphaned_virtual_evaluation_sets() 返回的删除数量等于实际孤儿虚拟集数量（示例数据为 1）。
  - order: 2
    action: 直接导入并调用 backend/database/evaluation_set_db.py 中的 cleanup_orphaned_virtual_evaluation_sets()，记录返回的删除评测集数量。
    expected: 未被引用（不在 delete_flag=N 的 AgentEvaluation.evaluation_set_id 集合内）的 __no_set_virtual__ 评测集及其全部 case 已从数据库删除。
  - order: 3
    action: 重新查询数据库，断言 S1 的 EvaluationSet 与 EvaluationSetCase 记录已被删除。
    expected: 被 run 引用的虚拟集、普通评测集、软删除评测集及其 case 均原样保留，字段无变化。
  - order: 4
    action: 断言 S2 及其 case、S3 及其 case、S4 及其 case 仍存在且字段完整，未被误删。
    expected: 重复调用返回 0，无额外删除、无半写入或跨租户数据丢失。
  - order: 5
    action: 二次调用 cleanup_orphaned_virtual_evaluation_sets()，断言返回 0 且无新增删除，确认幂等。
    expected: 重复调用返回 0，无额外删除、无半写入或跨租户数据丢失。
  expected_results:
  - cleanup_orphaned_virtual_evaluation_sets() 返回的删除数量等于实际孤儿虚拟集数量（示例数据为 1）。
  - 未被引用（不在 delete_flag=N 的 AgentEvaluation.evaluation_set_id 集合内）的 __no_set_virtual__ 评测集及其全部 case 已从数据库删除。
  - 被 run 引用的虚拟集、普通评测集、软删除评测集及其 case 均原样保留，字段无变化。
  - 重复调用返回 0，无额外删除、无半写入或跨租户数据丢失。
