notes: >-
  Self-contained preparation uses an opted-in, isolated machine-local Kubernetes
  cluster, an owned namespace and dynamic volumes, two individually routed Runtime
  Pods, test-only identities and a controlled provider. Cleanup uses the namespace
  UID and verifies reclamation. Directed Gateway fixtures keep the production
  Management and Runtime calls and point Management to the selected Runtime
  Pod. The program reads the unified SQL execution, the run-scoped AgentOS
  journal, or the Creator stream. Workbench quota is observed while Runtime
  work is active. An older owner's settlement runs against an active successor
  before the successor's independent assistant projection. Creator preparation
  holds a case-owned message write after admission, preserving the quota test.
  Evaluation uses two isolated Management dispatch processes, a real conditional
  PostgreSQL claim, six live workers and twelve distinct queued submissions on
  one process. Failure to submit rolls its evaluation row back to pending.
  Northbound uses the same directed Management path. The local Agent lane
  and fault branches still require candidate integration against the public
  wire contracts.
  Formal execution and cleanup are pending for all branches.
