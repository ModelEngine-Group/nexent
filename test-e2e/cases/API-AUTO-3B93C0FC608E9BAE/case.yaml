  contract:
    protocol: HTTP API
    request_expectations:
    - 使用 DEV 或 ADMIN 账号登录获取 authorization；同时准备 USER 角色账号与无效/缺失 token。
    - 在测试租户内准备技能仓库记录：创建 status=shared、delete_flag≠Y 且带标签（如 tags=["nlp","math"]）的共享记录，并准备 status=shared 但 delete_flag=Y、status=not_shared/pending_review/rejected
      的记录，记录期望标签及计数。
    - 携带 authorization 调用 GET /repository/skill/tags，记录响应状态码与 JSON 体。
    - 断言响应体为 {items:[{tag,count}]}，items 仅含 status=shared 且 delete_flag≠Y 记录的标签，tag 按字典序升序，count 为对应共享 listing 数量；非 shared
      与软删除记录的标签不出现。
    - 使用 USER 角色账号调用 GET /repository/skill/tags 断言返回 403 Forbidden；使用缺失/无效 authorization 断言返回 401 Unauthorized。
    - 携带 authorization 调用 GET /repository/skill/mine/counts，记录响应状态码与 JSON 体。
    - 断言响应体为 {counts:{all,created,others}}，其中 all/created/others 均为非负整数，all 等于当前用户可视技能总数，created 等于 created_by 为当前用户的技能数，且
      all==created+others 与数据库一致。
    - 使用缺失/无效 authorization 调用 GET /repository/skill/mine/counts 断言返回 401 Unauthorized。
    - 确认响应与日志不包含明文 token/凭据，测试结束后清理测试租户数据。
    response_expectations:
    - GET /repository/skill/tags 返回 HTTP 200，body 形如 {items:[{tag,count},...]}。
    - items 仅含 status=shared 且 delete_flag≠Y 的租户内共享标签；tag 升序，count 为 int 且与数据库计数一致；not_shared/pending_review/rejected 及软删除记录的标签不出现；相同
      tag 合并计次。
    - USER 角色访问 /repository/skill/tags 返回 403，缺失或无效 token 返回 401。
    - GET /repository/skill/mine/counts 返回 HTTP 200，body 为 {counts:{all,created,others}}，三者均为 int 且满足 all==created+others。
    - 缺失或无效 token 调用 /repository/skill/mine/counts 返回 401。
    - 关键状态在 API 返回与数据库保持一致，无跨租户泄露，响应中不包含明文 token。
