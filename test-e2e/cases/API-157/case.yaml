schema_version: '1.0'
stage: D2
module: V5-BASELINE
case:
  case_id: API-157
  feature_id: F-152
  business_rule_ids:
  - F-152-RULE-01
  title: northbound knowledge endpoints 的 CRUD/检索/权限｜异常/边界/越权
  type: API-IT
  priority: P1
  status: active
  automation: automated
  objective: northbound knowledge endpoints 的 CRUD/检索/权限｜异常/边界/越权
  preconditions:
  - Nexent 本地测试全栈已启动，health check 通过。
  - 设置 NEXENT_TEST_HOME，目录不位于 Nexent Git 仓库内。
  - 当次 run_id 已生成，所有新建资源名称带 run_id；测试基线固定为 develop 当前批次锁定的产品提交；执行时另记录实际被测commit。
  - 所需本地资产存在且校验通过：${NEXENT_TEST_HOME}/config/users.yaml；${NEXENT_TEST_HOME}/config/secrets.env；${NEXENT_TEST_HOME}/assets/knowledge/；${NEXENT_TEST_HOME}/assets/expected/kb_expected.json；${NEXENT_TEST_HOME}/config/northbound.yaml
  - models.yaml 中本用例所需真实 Provider 已配置，secrets.env 中凭据有效，预检连通性通过。
  test_data:
    legacy_asset_declaration: '- ${NEXENT_TEST_HOME}/config/users.yaml

      - ${NEXENT_TEST_HOME}/config/secrets.env

      - ${NEXENT_TEST_HOME}/assets/knowledge/

      - ${NEXENT_TEST_HOME}/assets/expected/kb_expected.json

      - ${NEXENT_TEST_HOME}/config/northbound.yaml'
  steps:
  - order: 1
    action: 从 config/northbound.yaml 读取测试 API user/API Key、默认 agent_id/knowledge_base_id；Key 通过 secrets.env 注入。
    expected: 功能结果与代码契约一致，测试过程无未处理异常。
  - order: 2
    action: 先调用 Northbound health/鉴权入口确认本地服务与测试身份有效，并记录 base_url 与当前 git commit。
    expected: 关键状态在 API 返回、数据库/存储和后续读取中保持一致。
  - order: 3
    action: 根据“northbound knowledge endpoints 的 CRUD/检索/权限｜异常/边界/越权”构造真实 /nb/v1 请求，显式填写 metadata、meta_data、tool_params、attachments、model
      override 或 Idempotency-Key 等相关字段。
    expected: 失败路径返回明确错误，不出现半写入、重复副作用或跨租户泄露。
  - order: 4
    action: 发起真实 HTTP 请求并保存状态码、响应头、request_id/run_id 与脱敏响应体。
    expected: 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
  - order: 5
    action: Chat Run 类等待流式/异步执行结束，检查实际 Agent/模型/KB/工具调用结果，而不是只断言 200。
    expected: 固定测试 marker 对应文档进入期望 Top-K/Top-N，向量维度和模型绑定正确。
  - order: 6
    action: 幂等类重复发送同一 Idempotency-Key，确认不会产生重复会话/任务/资源；不同 key 应产生独立执行。
    expected: API Key 鉴权、metadata/tool_params/idempotency 等契约按实际请求生效。
  - order: 7
    action: 权限/参数类使用无权限 key、未知 tool 参数、非法附件等请求，确认明确 4xx/429 且无半写入。
    expected: 北向知识库 DELETE 触发业务异常时，/nb/v1/knowledge/indices/{index_name} 响应保留原 AppException/EDS 的 code 与 details（如 KNOWLEDGE_DELETE_BLOCKED
      及 blocking_files 逐文件 file_name/status），而非退回通用 500 “Error deleting index”；重试不产生重复副作用。
  - order: 8
    action: 查询数据库/会话/运行记录验证 metadata 与审计字段作用域正确，且 API Key 不出现在日志和响应中。
    expected: 北向知识库 DELETE 触发业务异常时，/nb/v1/knowledge/indices/{index_name} 响应保留原 AppException/EDS 的 code 与 details（如 KNOWLEDGE_DELETE_BLOCKED
      及 blocking_files 逐文件 file_name/status），而非退回通用 500 “Error deleting index”；重试不产生重复副作用。
  - order: 9
    action: '对 /nb/v1/knowledge/indices/{index_name} 发起 DELETE 触发业务异常（如删除仍含受保护/未处理文件的索引，使后端抛 AppException/EDS KNOWLEDGE_DELETE_BLOCKED；或删除不存在的索引），断言响应保留原
      AppException 的 EDS code 与 details（含 blocking_files 逐文件 file_name/status），而非落入通用 500 “Error deleting index”；再以相同参数重试一次，确认不产生重复副作用或越权。

      补充异常断言：对本用例涉及的非法/失败条件至少重复一次，确认重试不会产生重复资源、脏状态或权限绕过。'
    expected: 北向知识库 DELETE 触发业务异常时，/nb/v1/knowledge/indices/{index_name} 响应保留原 AppException/EDS 的 code 与 details（如 KNOWLEDGE_DELETE_BLOCKED
      及 blocking_files 逐文件 file_name/status），而非退回通用 500 “Error deleting index”；重试不产生重复副作用。
  expected_results:
  - 功能结果与代码契约一致，测试过程无未处理异常。
  - 关键状态在 API 返回、数据库/存储和后续读取中保持一致。
  - 失败路径返回明确错误，不出现半写入、重复副作用或跨租户泄露。
  - 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
  - 固定测试 marker 对应文档进入期望 Top-K/Top-N，向量维度和模型绑定正确。
  - API Key 鉴权、metadata/tool_params/idempotency 等契约按实际请求生效。
  - 北向知识库 DELETE 触发业务异常时，/nb/v1/knowledge/indices/{index_name} 响应保留原 AppException/EDS 的 code 与 details（如 KNOWLEDGE_DELETE_BLOCKED
    及 blocking_files 逐文件 file_name/status），而非退回通用 500 “Error deleting index”；重试不产生重复副作用。
  forbidden_side_effects: []
