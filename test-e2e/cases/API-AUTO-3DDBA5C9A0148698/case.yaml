  contract:
    protocol: HTTP API
    request_expectations:
    - 从 config/users.yaml 读取隔离测试账号（SU/Admin/SPEED/ASSET_OWNER/DEV/USER）与租户关系；密码/Token 仅从 secrets.env 注入。
    - 使用 SU/Admin 角色调用 GET /tag-libraries 与 GET /tag-libraries/{bucket_id}/definitions，读取 default_resource/knowledge_content
      桶及其 active 定义/值，确认统一标签库预置成功。
    - 以可读账号对六类资源逐一调用 GET /tag-libraries/assignments/{resource_type}/{resource_id}（knowledge_document 携带 provider/knowledge_base_id
      查询参数），记录 200 响应中的 resource_type、resource_id、assignment_count、assignment_capacity(=100)、assignments[] 结构。
    - 以可编辑账号对 agent/skill/tool/mcp_service 调用 PUT /tag-libraries/assignments/{resource_type}/{resource_id}，body
      为 {"value_ids":[...]}，断言 200 后 assignment_count 与 assignments[]（含 definition_id/definition_key/definition_name/selection_mode/value_id/display_value/value_status）与提交一致；随后再次
      GET 校验分配持久化。
    - 对 single_select 定义向同一资源提交多个 value_ids，断言 400（detail 为 "A single-select tag definition accepts only one assigned
      value"），且原分配保持不变。
    - 构造提交包含未激活或不属于该资源库的 value_id，断言 400（detail 为 "Each assigned tag value must be active and belong to the resource
      library"）。
    - 构造提交超过 100 个 value_ids，断言 409（Resource tag assignment capacity exceeded，details.scope=assignment）。
    - 对 knowledge_base 调用 GET/PUT /tag-libraries/assignments/knowledge_base/{index_name}；对 knowledge_document 携带
      provider/knowledge_base_id 查询参数读写，断言文档 canonical resource_id 为 base64 编码、所属桶为 knowledge_content。
    - 调用 PUT /tag-libraries/assignments/{resource_type}/bulk，body 为 {"targets":[{"resource_id":"...","value_ids":[...]}]}，断言返回数组且每项
      outcome ∈ {updated, not_found_or_forbidden, validation}：可编辑目标返回 assignment，跨租户/不可编辑目标返回 not_found_or_forbidden。
    - 调用 POST /tag-libraries/assignments/{resource_type}/filter，body 为 {"resource_ids":[...],"predicates":[{"definition_id":...,"value_ids":[...]}]}，断言返回
