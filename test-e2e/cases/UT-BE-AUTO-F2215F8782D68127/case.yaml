  assertions:
  - 旧 backend/utils/thread_utils（GlobalThreadPool、submit、pool）已删除，模块不可导入且仓库内无残留引用。
  - run_async 无运行事件循环时返回协程结果；事件循环内且 nest_asyncio 缺失时经 ThreadManager 在 model-tool-io lane 受管线程返回协程结果，任务名 jiuwen-coroutine、owner
    runtime。
  - nexent.core.concurrency 暴露 ManagedTaskSpec、get_current_thread_manager、ThreadManager；manager start/run_sync/shutdown 全链路正常，shutdown
    后 manager.state 为 CLOSED（无 stuck），无活跃执行。
  - 异常路径抛出明确领域异常（KeyError 未知 lane、ThreadManagerNotRunning 未启动），不返回伪成功。
  - 日志、Trace、报告不出现明文 API Key/Token/Password/模型密钥。
