notes: >-
  The fixed journey runs the product frontend from the configured base URL
  with private HTTP fixtures, cookies and a Playwright browser context. Deferred
  cleanup releases held responses, unregisters routes and clears cookies.
  Playwright releases the context even on failure. The Case provisions no shared
  tenant, Agent, model, file or backend resources. The partial script covers
  calendar filters and sorting, keyboard row activation, historical versions,
  model input and output modes, UTF-8 body loading and segment navigation, delayed
  list cancellation, explicit refresh, unavailable records, locale and role
  checks, and tenant-scoped cleanup. The schedule save failure registers the
  specific intercepted request and injected HTTP 503 before checking that the
  UI retains the input and supports retry. The Case remains blocked pending the
  remaining assertions listed in its blocked reason and a full audited run.
