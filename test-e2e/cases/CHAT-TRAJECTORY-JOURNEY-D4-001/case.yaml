case:
  case_id: CHAT-TRAJECTORY-JOURNEY-D4-001
  feature_id: CHAT-TRAJECTORY
  requirement_ids:
  - CHAT-LOCAL-TRAJECTORY-20261103
  - CHAT-TRAJECTORY-FRONTEND-20261110
  business_rule_ids:
  - TRJ-RULE-002
  - TRJ-RULE-003
  - TRJ-RULE-004
