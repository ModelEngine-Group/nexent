    blocked_reason: Backend historical query and cleanup APIs are implemented. The production administrator page/viewer and this Case's fixed browser script and binding are not implemented; the interaction Demo is a design reference and does not prove the product journey.
  execution:
    profiles:
    - name: mock
      required_services: []
  actor: 当前可信租户的已登录ADMIN；额外USER/DEV负面身份
  journey:
  - 管理员登录并打开菜单
  - 选择用户、智能体与会话ID并查询
  - 检查历史思考和工具详情
  - 静态分段与完整正文
  - 再次查询和选择切换
  - 输入天数主动清理当前租户轨迹，检查逐批结果/失败重试及离开停止
  - 普通角色拒绝及卸载清理
  final_business_result:
  - 管理员通过用户、智能体和会话ID检查历史轨迹；不需要实时读取或重放，普通用户不可进入。
  - 管理员可按天数主动清理并看到真实批次结果；新运行、聊天和范围外文件保持。
  failure_evidence:
  - Playwright trace、失败截图、网络请求与事件顺序记录
