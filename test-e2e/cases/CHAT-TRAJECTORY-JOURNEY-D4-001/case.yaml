    成功Python/code.execute重复包装层合并，具体工具直接显示原名，生成代码显示Python调用，有沙箱时保留代码执行分组；节点原ID/source/正文/耗时及汇总指标保持，分页祖先及父导航指向保留节点，异常包装仍可读；记忆准备和沙箱初始化的phase节点可点击，显示中文名称、起止时间、耗时及正文；节点类型可筛选阶段并保留父级路径，阶段不展示Token/TTFT/吞吐及智能体版本。
  - 旧响应不串数据，身份切换释放缓存和HTTP；无自动轮询/焦点刷新，新成员只在显式查询后显示；原聊天草稿保持且新增模型工具调用为0。
  - 状态原因与重试入口明确，禁止伪造零和完整性；普通身份不发送轨迹请求或展示受限标题正文。
  - 清理不受列表用户/Agent筛选影响，SU须在弹窗选择租户，POST包含目标tenant_id且不含path；OPS固定本租户；未确认不发请求，执行中不显示停止入口且不能关闭或通过Esc取消，自动续批，部分失败不显示全部完成并保留弹窗，全部批次成功且无待处理/失败项时自动关闭弹窗并刷新列表，零删除也关闭；释放独占浏览器和路由资源。
  - 列表以会话为行并展示轮数和四态；打开详情从首轮开始连续追加后续轮次/节点，各轮从0计时且跨轮节点ID互不覆盖。搜索和类型筛选作用于已加载轮次并保留父级；切换会话取消请求并释放缓存，正文失效清除查看器。
  - OPS配置本租户；SU无需筛选租户即可读取全租户统一/混合配置，确认后同步所有现有有效租户，取消不写入；保存开关及1至30天天数、关闭重开保留设置，显示每天00:00；错误可重试、保存失败保留输入；修改设置不触发手动删除。
  forbidden_side_effects:
  - 不得以静态截图替代自研查看器的实际节点交互验收。
  - 不得因历史查看/再次查询启动模型或工具，也不得对普通用户开放轨迹。
