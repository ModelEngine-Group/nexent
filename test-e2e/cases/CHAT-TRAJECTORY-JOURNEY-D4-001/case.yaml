    blocked_reason: >-
      The fixed browser journey covers only part of the contract. Delayed
      facet, snapshot and body reads, in-page identity changes, capture gaps
      and storage failures, full byte and cache budgets, cross-tenant list
      scope, cleanup transport failures and conversation switching remain
      incomplete. Formal activation requires a complete audited browser run.
  execution:
    profiles:
    - name: mock
      required_services: []
  actor: 当前可信租户的已登录OPS；额外USER/DEV负面身份
  journey:
  - 以OPS/SU进入可观测中心，搜索分页选择租户→用户→智能体→会话，使用表头模型/状态/时间及ID筛选、排序和分页。
  - 点击指定执行行，展开并行/嵌套节点并点击父级、模型和工具，关闭遮罩后重开。
  - 搜索名称及已加载输入输出，与类型条件交集；切换节点、前后段并读取超大正文。
  - 延迟旧列表/facet/snapshot/正文响应并切换过滤/身份；归档新执行后触发焦点再显式查询。
  - 查看未归档/未采集/过期/缺口/损坏/存储故障/snapshot_reset，使用普通角色直接访问。
  - 明确租户后输入7天确认清理，检查多批固定截止和累计统计，模拟pending/failed及错误重试；关闭/切租户/离开。
  final_business_result:
  - 管理员通过用户、智能体和会话ID检查历史轨迹；不需要实时读取或重放，普通用户不可进入。
  - 管理员可按天数主动清理并看到真实批次结果；新运行、聊天和范围外文件保持。
  failure_evidence:
  - Playwright trace、失败截图、网络请求与事件顺序记录
