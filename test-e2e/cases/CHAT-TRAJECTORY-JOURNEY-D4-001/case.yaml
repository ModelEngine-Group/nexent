  title: 管理员从菜单选择用户、智能体与会话，用自研TraceViewer组件检查历史思考和工具
  type: E2E
  priority: P1
  status: blocked
  automation: automated
  objective: 管理员从菜单选择用户、智能体与会话，用自研TraceViewer组件检查历史思考和工具
  preconditions:
  - 设计阶段；轨迹产品接口、固定脚本和 case-local execution.yaml 尚未实现，本 Case 不可计为通过。
  - 使用隔离测试会话、租户和独占轨迹根目录；记录被测提交、配置快照和本用例资源清单。
  - 读取使用可信ADMIN/SU身份，目标会话由独立普通用户创建；actor与owner区分，非管理员读取应拒绝。
  - 业务trace_id直接复用现有conversation_id；菜单按用户→最近根智能体→会话，打开后读取整个会话范围；PG复用现有表结构和查询，轨迹正文及执行清单全部为文件。
  - 基于现有MonitoringManager，通过MONITORING_TRACE_SINK选择otlp/local_file/both；本地业务正文为正文内嵌的标准OTLP JSONL，会话meta.json保存归属、执行清单和确认进度。
  - 目录使用tenant/user/storage_agent/conversation业务ID，storage_agent_id固定为首次采集根Agent；稳定owner/会话锁串行首次定位与登记。会话切换根Agent仍读写同一物理目录。
  - 所有正文内嵌OTLP Span属性/Events；256KiB为批量刷盘阈值，单行可更大。读写须处理大型字符串的增量编码/解码，正文API按解码后的UTF-8区间返回。
  - 清理服务具备可控UTC时钟与独占文件夹具；定期默认30天/3600秒，可关闭；主动POST /trajectory/cleanup固定可信租户和首次截止时间，全部产品/脚本仍待实现。
  - 用户搜索直接复用POST /users/list；Agent/会话选择在既有两个GET增加view=trajectory、target_user_id及普通/工作台分类；新增仅3个轨迹GET及清理POST，原分支行为保持。
  test_data:
    profile: mock
  steps:
  - order: 1
    action: 以ADMIN登录打开轨迹菜单，选择用户→最近根Agent→会话并查询；使用稳定HTTP fixture和本项目自研TraceViewer，包含根Agent切换、已删除/未知和工作台样本。
    expected: 选择器有界、ID明确，自研查看器列表/概览/详情和中英文/键盘操作可用，原聊天独立；分组复用最近agent_id，切换后会话移到新组，打开仍展示全部保留执行；trace_id=conversation_id，已删除/未知Agent状态明确，普通和工作台会话均可选。
  - order: 2
    action: 展开已归档模型思考、回答、工具参数/结果、失败attempt及嵌套子调用；另查看Provider未返回reasoning的会话。
    expected: 自研查看器渲染内容和父子关系正确，失败attempt不丢失，工具结果服务重启后仍能查；缺思考明确不可用，不补造或再次请求模型。
  - order: 3
    action: 折叠调用、搜索本段摘要并点击时间概览；使用更早/更晚导航切换超过500条或8MiB的历史段，并查看超大正文入口。
    expected: 本段选择/详情联动，搜索和时间范围标识清楚；每段不超500条/8MiB，超大正文标识后可分块读全；切段释放旧查看器状态，Nexent正文缓存至多32MiB。
  - order: 4
    action: 页面停留时在fixture后端归档新运行，触发窗口焦点/网络恢复，再点击查询；随后延迟旧响应，依次改选智能体、用户和租户，检查下游选择及旧轨迹视图清空。
    expected: 没有轨迹SSE/WebSocket/长轮询/定时刷新，新记录只显式查询后出现；改选用户清空智能体/会话和视图，改选智能体清空会话和视图，旧响应不能串数据，tool result仅一次普通HTTP读取。
  - order: 5
    action: 分别展示未归档、未采集、过期、缺口、存储失败和401；通过trace定位同一会话，再以USER/DEV与公开分享身份直接访问菜单路由。
    expected: 范围和错误各有明确提示，trace仍映射同一会话且遵循管理员权限；普通角色没有菜单且页面/API被拒绝，不暴露标题或正文；用户搜索复用已有POST，会话选择与轨迹读取使用普通GET，主动清理使用独立POST。
  - order: 6
    action: 离开页面并重新进入，核对请求/监听/缓存清理，检查原聊天页草稿和内容，最后释放独占资源。 离开前打开清理弹窗，核对“当前租户全部用户/智能体/会话”范围，输入7天并提交；fixture模拟多批、部分失败和待处理，重试后刷新查看；再次开始并切换租户/离开页面。
    expected: 卸载释放HTTP、store和查看器资源，旧内容不残留于其他选择；原聊天行为不变，物理模型/工具新增调用数为0，独占资源清理。 只有明确提交才发清理POST，显示固定截止时间并累计数量/逻辑字节，待处理/失败不显示为全部完成；旧快照/正文清理后失效，新执行和聊天仍在。租户切换/卸载停止后续批次，旧清理响应不串入新租户，已完成删除保持。
  expected_results:
  - 选择器有界、ID明确，自研查看器列表/概览/详情和中英文/键盘操作可用，原聊天独立；分组复用最近agent_id，切换后会话移到新组，打开仍展示全部保留执行；trace_id=conversation_id，已删除/未知Agent状态明确，普通和工作台会话均可选。
  - 自研查看器渲染内容和父子关系正确，失败attempt不丢失，工具结果服务重启后仍能查；缺思考明确不可用，不补造或再次请求模型。
  - 本段选择/详情联动，搜索和时间范围标识清楚；每段不超500条/8MiB，超大正文标识后可分块读全；切段释放旧查看器状态，Nexent正文缓存至多32MiB。
  - 没有轨迹SSE/WebSocket/长轮询/定时刷新，新记录只显式查询后出现；改选用户清空智能体/会话和视图，改选智能体清空会话和视图，旧响应不能串数据，tool result仅一次普通HTTP读取。
  - 范围和错误各有明确提示，trace仍映射同一会话且遵循管理员权限；普通角色没有菜单且页面/API被拒绝，不暴露标题或正文；用户搜索复用已有POST，会话选择与轨迹读取使用普通GET，主动清理使用独立POST。
  - 卸载释放HTTP、store和查看器资源，旧内容不残留于其他选择；原聊天行为不变，物理模型/工具新增调用数为0，独占资源清理。 只有明确提交才发清理POST，显示固定截止时间并累计数量/逻辑字节，待处理/失败不显示为全部完成；旧快照/正文清理后失效，新执行和聊天仍在。租户切换/卸载停止后续批次，旧清理响应不串入新租户，已完成删除保持。
  forbidden_side_effects:
  - 不得以静态截图替代自研查看器的实际节点交互验收。
  - 不得因历史查看/再次查询启动模型或工具，也不得对普通用户开放轨迹。
