  title: 管理员在可观测中心筛选执行、检查层级轨迹并清理可信租户历史
  type: E2E
  priority: P1
  status: blocked
  automation: automated
  objective: 管理员在可观测中心筛选执行、检查层级轨迹并清理可信租户历史
  preconditions:
  - 管理员OPS/SU登录，菜单授权含/observability；普通角色无菜单且页面/API拒绝。
  - 运行真实Nexent前端及受控HTTP夹具，使用隔离身份、十进制字符串会话ID和并行/嵌套/大正文/缺口样本；记录被测版本。
  - 集合GET /trajectory/records返回执行行、query_id、全量summary和分页facet；详情使用指定conversation_id+trajectory_id的snapshot与contents。
  - 清理POST携带before_days、已授权的tenant_id及可选cursor，禁止传入path；SU须在弹窗选择租户，列表筛选不改变清理授权上下文。
  test_data:
    profile: mock
  steps:
  - order: 1
    action: 以OPS/SU进入可观测中心，搜索分页选择租户→用户→智能体→会话，使用表头模型/状态/时间及ID筛选、排序和分页；选择起止日期并确认，再清除时间条件，检查排序保持。
    expected: 候选有界并显示名称；上级变化重置下级、最近项和请求；四卡读取租户/全局统计快照，显示范围和统计时间，筛选及翻页保持同范围结果，零与未知分开。分页排序沿用query_id，显式刷新才纳入新执行。
  - order: 2
    action: 点击指定执行行，展开并行/嵌套节点并点击父级、模型和工具；在模型输入切换表格与原始文本，滚动到模型输出底部后切换文本、JSON 和表格，关闭遮罩后重开。
    expected: 右侧抽屉保留列表状态，52/48层级时间线与单页详情联动，起止时间明确；Agent显示完整子树次数/usage，模型才显示TTFT和吞吐。 列表根V3、树和详情子V2/草稿/未知各自正确，切换模型或工具隐藏智能体版本。完整模型请求按角色显示消息，正文的标题和表格正常渲染，文本模式保留原始请求。模型输出切换格式前后的详情滚动偏移相同。
  - order: 3
    action: 搜索名称及已加载输入输出，与类型条件交集；切换节点、前后段并读取超大正文。
    expected: 保留匹配父路径并展开，标记搜索覆盖范围；单段≤500/8MiB，旧段释放；正文首块自动读取，滚动触底按UTF8≤1MiB分块追加、缓存≤32MiB，失败原位重试且切换节点取消旧请求；格式/折叠/复制可用，输入输出可独立切换自动换行，按当前框宽度断开长行，JSON/文本及复制内容保持不变，切节点滚顶。
      成功Python/code.execute重复包装层合并，具体工具直接显示原名，生成代码显示Python调用，有沙箱时保留代码执行分组；节点原ID/source/正文/耗时及汇总指标保持，分页祖先及父导航指向保留节点，异常包装仍可读；记忆准备和沙箱初始化的phase节点可点击，显示中文名称、起止时间、耗时及正文；节点类型可筛选阶段并保留父级路径，阶段不展示Token/TTFT/吞吐及智能体版本。
  - order: 4
    action: 延迟旧列表/facet/snapshot/正文响应并切换过滤/身份；归档新执行后触发焦点再显式查询。
    expected: 旧响应不串数据，身份切换释放缓存和HTTP；无自动轮询/焦点刷新，新成员只在显式查询后显示；原聊天草稿保持且新增模型工具调用为0。
  - order: 5
    action: 查看未归档/未采集/过期/缺口/损坏/存储故障/snapshot_reset，使用普通角色直接访问。
    expected: 状态原因与重试入口明确，禁止伪造零和完整性；普通身份不发送轨迹请求或展示受限标题正文。
  - order: 6
    action: 明确租户后输入7天确认清理，检查多批固定截止和累计统计，模拟pending/failed及错误重试；关闭/切租户/离开。
    expected: 清理不受列表用户/Agent筛选影响，SU须在弹窗选择租户，POST包含目标tenant_id且不含path；OPS固定本租户；未确认不发请求，执行中不显示停止入口且不能关闭或通过Esc取消，自动续批，部分失败不显示全部完成并保留弹窗，全部批次成功且无待处理/失败项时自动关闭弹窗并刷新列表，零删除也关闭；释放独占浏览器和路由资源。
  - order: 7
    action: 准备同会话失败后成功及过期/未采集数据，筛选历史执行并翻页打开多轮详情，期间新增执行/清理并切换会话。
    expected: 列表以会话为行并展示轮数和四态；打开详情从首轮开始连续追加后续轮次/节点，各轮从0计时且跨轮节点ID互不覆盖。搜索和类型筛选作用于已加载轮次并保留父级；切换会话取消请求并释放缓存，正文失效清除查看器。
  - order: 8
    action: 打开定时清理设置，修改并保存每日零点清理策略，重读并覆盖非SU、非法参数及故障。
    expected: OPS配置本租户；SU无需筛选租户即可读取全租户统一/混合配置，确认后同步所有现有有效租户，取消不写入；保存开关及1至30天天数、关闭重开保留设置，显示每天00:00；错误可重试、保存失败保留输入；修改设置不触发手动删除。
  expected_results:
  - 候选有界并显示名称；上级变化重置下级、最近项和请求；四卡读取租户/全局统计快照，显示范围和统计时间，筛选及翻页保持同范围结果，零与未知分开。分页排序沿用query_id，显式刷新才纳入新执行。
