  title: 管理员在可观测中心筛选执行、检查层级轨迹并清理可信租户历史
  type: E2E
  priority: P1
  status: blocked
  automation: automated
  objective: 管理员在可观测中心筛选执行、检查层级轨迹并清理可信租户历史
  preconditions:
  - 管理员ADMIN/SU登录，菜单授权含/observability；普通角色无菜单且页面/API拒绝。
  - 运行真实Nexent前端及受控HTTP夹具，使用隔离身份、十进制字符串会话ID和并行/嵌套/大正文/缺口样本；记录被测版本。
  - 集合GET /trajectory/records返回执行行、query_id、全量summary和分页facet；详情使用指定conversation_id+trajectory_id的snapshot与contents。
  - 清理POST只携带before_days/cursor，固定可信认证租户；SU筛选租户不改变清理授权上下文。
  test_data:
    profile: mock
  steps:
  - order: 1
    action: 以ADMIN/SU进入可观测中心，搜索分页选择租户→用户→智能体→会话，使用表头模型/状态/时间及ID筛选、排序和分页。
    expected: 候选有界并显示名称/ID；上级变化重置下级、最近项和请求；四卡使用服务端全量summary，零与未知分开。分页排序沿用query_id，显式刷新才纳入新执行。
  - order: 2
    action: 点击指定执行行，展开并行/嵌套节点并点击父级、模型和工具，关闭遮罩后重开。
    expected: 右侧抽屉保留列表状态，52/48层级时间线与单页详情联动，起止时间明确；Agent显示完整子树次数/usage，模型才显示TTFT和吞吐。
  - order: 3
    action: 搜索名称及已加载输入输出，与类型条件交集；切换节点、前后段并读取超大正文。
    expected: 保留匹配父路径并展开，标记搜索覆盖范围；单段≤500/8MiB，旧段释放；正文按UTF8≤1MiB分块且缓存≤32MiB；格式/折叠/复制可用，切节点滚顶。
  - order: 4
    action: 延迟旧列表/facet/snapshot/正文响应并切换过滤/身份；归档新执行后触发焦点再显式查询。
    expected: 旧响应不串数据，身份切换释放缓存和HTTP；无自动轮询/焦点刷新，新成员只在显式查询后显示；原聊天草稿保持且新增模型工具调用为0。
  - order: 5
    action: 查看未归档/未采集/过期/缺口/损坏/存储故障/snapshot_reset，使用普通角色直接访问。
    expected: 状态原因与重试入口明确，禁止伪造零和完整性；普通身份不发送轨迹请求或展示受限标题正文。
  - order: 6
    action: 明确租户后输入7天确认清理，检查多批固定截止和累计统计，模拟pending/failed及错误重试；关闭/切租户/离开。
    expected: 清理不受列表用户/Agent筛选影响，POST不含tenant/path；未确认不发请求，取消后不续批，部分失败不显示全部完成，成功后刷新列表；释放独占浏览器和路由资源。
  expected_results:
  - 候选有界并显示名称/ID；上级变化重置下级、最近项和请求；四卡使用服务端全量summary，零与未知分开。分页排序沿用query_id，显式刷新才纳入新执行。
  - 右侧抽屉保留列表状态，52/48层级时间线与单页详情联动，起止时间明确；Agent显示完整子树次数/usage，模型才显示TTFT和吞吐。
  - 保留匹配父路径并展开，标记搜索覆盖范围；单段≤500/8MiB，旧段释放；正文按UTF8≤1MiB分块且缓存≤32MiB；格式/折叠/复制可用，切节点滚顶。
  - 旧响应不串数据，身份切换释放缓存和HTTP；无自动轮询/焦点刷新，新成员只在显式查询后显示；原聊天草稿保持且新增模型工具调用为0。
  - 状态原因与重试入口明确，禁止伪造零和完整性；普通身份不发送轨迹请求或展示受限标题正文。
  - 清理不受列表用户/Agent筛选影响，POST不含tenant/path；未确认不发请求，取消后不续批，部分失败不显示全部完成，成功后刷新列表；释放独占浏览器和路由资源。
  forbidden_side_effects:
  - 不得以静态截图替代自研查看器的实际节点交互验收。
  - 不得因历史查看/再次查询启动模型或工具，也不得对普通用户开放轨迹。
