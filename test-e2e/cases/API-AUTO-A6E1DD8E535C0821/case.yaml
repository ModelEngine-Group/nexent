case:
  case_id: API-AUTO-A6E1DD8E535C0821
  feature_id: F-112
  business_rule_ids:
  - F-112-RULE-01
  title: ES accurate-search 大分值 score_overall 写入与无损回读｜核心流程
  type: INTEGRATION
  priority: P1
  status: active
  automation: automated
  objective: ES accurate-search 大分值 score_overall 写入与无损回读｜核心流程
  preconditions:
  - 每日测试环境已完成 v2.5.0_0813 迁移，conversation_source_search_t.score_overall 列类型为 numeric(14,6)。
  - 设置 NEXENT_TEST_HOME，目录不位于 Nexent Git 仓库内；当次 run_id 已生成，新建资源名称带 run_id。
  - 测试租户账号可登录，会话/消息/来源记录数据可被清理。
  - 所需本地资产存在且校验通过：${NEXENT_TEST_HOME}/config/users.yaml；${NEXENT_TEST_HOME}/config/secrets.env
  test_data:
    legacy_asset_declaration: '- ${NEXENT_TEST_HOME}/config/users.yaml

      - ${NEXENT_TEST_HOME}/config/secrets.env'
  steps:
  - order: 1
    action: 确认 conversation_source_search_t.score_overall 列类型已为 numeric(14,6)，无待执行迁移残留。
    expected: score_overall = 12.345678 写入成功，不报数值越界或精度错误。
  - order: 2
    action: 调用 PUT /conversation/create 创建测试会话，并通过消息保存链路创建一条消息，取得 conversation_id 与 message_id。
    expected: POST /conversation/sources 返回 code=0，对应 search.score 与写入值 12.345678 精确相等。
  - order: 3
    action: 通过被测写入链路 save_source_search → create_source_search（与 ES accurate-search 结果落库同一路径）写入一条来源搜索记录，score_overall = 12.345678（超过旧精度上限
      9.999999，保留 6 位小数）。
    expected: 数据库回读的 score_overall 与写入值无损一致，无四舍五入或截断。
  - order: 4
    action: 调用 POST /conversation/sources（body 传 conversation_id 与 type=search）读取该会话来源。
    expected: 清理后无残留测试数据，日志不泄露 API Key/Token/密码。
  - order: 5
    action: 断言响应 code=0 且 data.searches 中对应记录 score 精确等于 12.345678。
    expected: 清理后无残留测试数据，日志不泄露 API Key/Token/密码。
  - order: 6
    action: 直接回查 conversation_source_search_t.score_overall 列，确认落库值与写入值逐位一致，无舍入或截断。
    expected: 清理后无残留测试数据，日志不泄露 API Key/Token/密码。
  - order: 7
    action: 清理测试会话、消息与来源记录，确保用例可重复执行。
    expected: 清理后无残留测试数据，日志不泄露 API Key/Token/密码。
  expected_results:
  - score_overall = 12.345678 写入成功，不报数值越界或精度错误。
  - POST /conversation/sources 返回 code=0，对应 search.score 与写入值 12.345678 精确相等。
  - 数据库回读的 score_overall 与写入值无损一致，无四舍五入或截断。
  - 清理后无残留测试数据，日志不泄露 API Key/Token/密码。
  forbidden_side_effects: []
  source:
    legacy_workbook_sha256: aa4b32414d30f12b3b64e14236268145e556bd7cfc5d3eb8df80731608ebc022
    legacy_sheet: 02_测试用例基线
    legacy_row: 531
  integration_boundary:
  - NO_EXTERNAL：仅本地 PostgreSQL 持久化与本地服务；不使用真实模型或公网服务。ES accurate-search 超过 9.999999 的原始分值通过被测写入链路构造，避免外部搜索服务不确定性。
  observations:
  - score_overall = 12.345678 写入成功，不报数值越界或精度错误。
  - POST /conversation/sources 返回 code=0，对应 search.score 与写入值 12.345678 精确相等。
  - 数据库回读的 score_overall 与写入值无损一致，无四舍五入或截断。
  - 清理后无残留测试数据，日志不泄露 API Key/Token/密码。
  cleanup:
  - pytest JUnit/XML、stdout/stderr、失败堆栈、数据库回读对比日志。
