schema_version: '1.0'
stage: D4
module: AGENT-EDITOR
case:
  case_id: AGENT-EDITOR-D4-001
  feature_id: AGENT-EDITOR-WORKFLOWS
  requirement_ids:
  - AGENT-EDITOR-REQ-001
  business_rule_ids:
  - AGENT-EDITOR-RULE-001
  title: Correct invalid and duplicate names before creating an Agent
  type: E2E
  priority: P1
  status: active
  automation: automated
  objective: Empty/duplicate names perform no write; exactly one successful creation
    preserves trimmed display name and reload restores the editor without repeating
    onboarding.
  preconditions:
  - A running frontend is reachable; deterministic existing HTTP fixtures isolate
    Agent data, authorization and model/resource boundaries.
  test_data:
    profile: mock
    locale: zh
    viewport:
      width: 1920
      height: 1080
  steps:
  - order: 1
    action: Submit an empty display name.
    expected: Required validation remains visible and no Agent is created.
  - order: 2
    action: Submit a duplicate display name, then correct it.
    expected: Duplicate validation prevents creation; a unique trimmed value creates
      exactly one Agent and enters onboarding.
  - order: 3
    action: Dismiss onboarding and reload the editor.
    expected: The created title is restored and guide dismissal is remembered.
  expected_results:
  - Empty/duplicate names perform no write; exactly one successful creation preserves
    trimmed display name and reload restores the editor without repeating onboarding.
  forbidden_side_effects:
  - No unrelated writes, publication or Agent/model execution; only explicitly requested
    creation/autosave writes are allowed.
  actor: Authorized Agent development user
  journey:
  - Submit an empty display name.
  - Submit a duplicate display name, then correct it.
  - Dismiss onboarding and reload the editor.
  final_business_result:
  - Empty/duplicate names perform no write; exactly one successful creation preserves
    trimmed display name and reload restores the editor without repeating onboarding.
  failure_evidence:
  - Fixed Playwright journey assertions, sanitized request payloads and terminal audit.
  acceptance:
  - id: AC-01
    description: Empty/duplicate names perform no write; exactly one successful creation
      preserves trimmed display name and reload restores the editor without repeating
      onboarding.
    steps:
    - 1
    - 2
    - 3
    expected_results:
    - 1
    forbidden_side_effects:
    - 1
