  contract:
    protocol: HTTP API
    request_expectations:
    - 以测试租户 SU/Admin 账号登录获取 authorization token，记录 run_id、被测 commit 与租户 ID，确认后端 /agent 路由可用。
    - 在测试租户内准备已知 Agent 数据：创建 name=dup_name、display_name=Dup Name 的两个 Agent（AgentA、AgentB），再准备一个 name=free_name 的不冲突 Agent。
    - 调用 POST /agent/check_name，请求体 items=[{"name":"dup_name","display_name":"Dup Name"}]（不带 agent_id）；断言 HTTP 200。
    - 断言响应为数组且长度与 items 一致；首个元素 name_conflict=true、display_name_conflict=true，conflict_agents 至少包含两条记录，每条含 name 与 display_name
      字段。
    - 调用 POST /agent/check_name，请求体 items=[{"name":"dup_name","agent_id":AgentA 的 ID}]；断言该元素排除自身后 name_conflict=true，且 conflict_agents
      只包含 AgentB 相关记录、不含 AgentA。
    - 调用 POST /agent/check_name，请求体 items=[{"name":"free_name"}]；断言该元素 name_conflict=false、display_name_conflict=false、conflict_agents
      为空数组。
    - 配置租户 quick-config LLM 模型；调用 POST /agent/regenerate_name，请求体 items=[{"name":"dup_name","display_name":"Dup Name"}]；断言
      HTTP 200。
    - 断言响应为数组且长度与 items 一致，每个元素含 name、display_name；再生结果与原冲突值不同且不等于租户内既有 Agent 的 name/display_name（租户内唯一）。
    - 同一请求内提交两个共享冲突名 name=dup_name 的 item；断言两个 item 的再生 name 互不相同（批内去重）。
    - 模拟 quick-config LLM 调用持续失败（mock 返回异常）；调用 POST /agent/regenerate_name 传冲突 item；断言对应 name/display_name 回退为 {原值}_{数字后缀}
      形式且租户内唯一，接口不返回 500。
    - 清空/未配置 quick-config LLM（无可用 model_id）；调用 POST /agent/regenerate_name 传冲突 item；断言 HTTP 400，message 含 "No available model
      for regeneration. Please configure an LLM model first."。
    - 调用 POST /agent/check_name，请求体 items=[]；断言 HTTP 200 且响应为空数组。
    - 使用其他租户已有的同名 name 构造 item 调用 check_name；断言 name_conflict=false，且响应不包含其他租户 Agent 的 name/display_name（不跨租户泄露）。
    - 核对全程请求/响应序列化、状态码与错误码符合契约，确认日志不输出 API Key、Token、用户密码或模型密钥。
    response_expectations:
    - check_name 对每个 item 返回 {name_conflict, display_name_conflict, conflict_agents}，布尔与冲突记录与租户内实际重名情况一致，并正确排除自身 agent_id。
    - check_name 检测范围限于当前租户，不返回跨租户 Agent 信息。
    - regenerate_name 返回数组长度与 items 一致，每个元素含 name/display_name；冲突字段被再生为租户内唯一、批内唯一且不同于原值的新值。
    - quick-config LLM 调用失败时，再生值回退为 {原值}_{数字后缀} 且租户内唯一，接口不因此返回 500。
    - 未配置可用 LLM 时，regenerate_name 返回 HTTP 400，message 含 "No available model for regeneration. Please configure an LLM model
      first."。
    - 空 items 数组返回 HTTP 200 与空数组，接口对无输入幂等、无副作用。
    - 所有接口状态码/错误码符合 controller 契约：ValueError→400，其余异常→500；失败路径不产生半写入、重复副作用或跨租户泄露。
    - 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
