schema_version: '1.0'
stage: D2
module: V5-BASELINE
case:
  case_id: API-AUTO-DDE7582FFE405D54
  feature_id: F-185
  business_rule_ids:
  - F-185-RULE-01
  title: Agent 批量命名 check_name/regenerate_name 契约（冲突检测、quick-config LLM 重生成、数字后缀回退、无模型抛错）｜核心流程
  type: API-IT
  priority: P1
  status: active
  automation: automated
  objective: Agent 批量命名 check_name/regenerate_name 契约（冲突检测、quick-config LLM 重生成、数字后缀回退、无模型抛错）｜核心流程
  preconditions:
  - 本地后端服务可运行并完成鉴权，测试数据库可连接，/agent 路由可用；测试基线固定为 develop 当前批次锁定的产品提交，执行时另记录实际被测 commit。
  - 设置 NEXENT_TEST_HOME，目录不位于 Nexent Git 仓库内；当次 run_id 已生成，新建资源名称带 run_id。
  - 所需本地资产存在且校验通过：${NEXENT_TEST_HOME}/config/users.yaml；${NEXENT_TEST_HOME}/config/secrets.env；${NEXENT_TEST_HOME}/config/models.yaml。
  - users.yaml 中 SU/Admin/UserA/UserB 等隔离账号可登录，测试租户数据可被清理。
  - 测试租户内已准备固定 Agent 数据用于构造冲突：两个 name=dup_name、display_name=Dup Name 的 Agent（AgentA、AgentB）与一个不冲突的 name=free_name；用于 regenerate
    成功路径的租户 quick-config LLM 模型已配置。
  test_data:
    legacy_asset_declaration: '- ${NEXENT_TEST_HOME}/config/users.yaml

      - ${NEXENT_TEST_HOME}/config/secrets.env

      - ${NEXENT_TEST_HOME}/config/models.yaml'
  steps:
  - order: 1
    action: 以测试租户 SU/Admin 账号登录获取 authorization token，记录 run_id、被测 commit 与租户 ID，确认后端 /agent 路由可用。
    expected: check_name 对每个 item 返回 {name_conflict, display_name_conflict, conflict_agents}，布尔与冲突记录与租户内实际重名情况一致，并正确排除自身 agent_id。
  - order: 2
    action: 在测试租户内准备已知 Agent 数据：创建 name=dup_name、display_name=Dup Name 的两个 Agent（AgentA、AgentB），再准备一个 name=free_name 的不冲突
      Agent。
    expected: check_name 检测范围限于当前租户，不返回跨租户 Agent 信息。
  - order: 3
    action: 调用 POST /agent/check_name，请求体 items=[{"name":"dup_name","display_name":"Dup Name"}]（不带 agent_id）；断言 HTTP 200。
    expected: regenerate_name 返回数组长度与 items 一致，每个元素含 name/display_name；冲突字段被再生为租户内唯一、批内唯一且不同于原值的新值。
  - order: 4
    action: 断言响应为数组且长度与 items 一致；首个元素 name_conflict=true、display_name_conflict=true，conflict_agents 至少包含两条记录，每条含 name 与 display_name
      字段。
    expected: quick-config LLM 调用失败时，再生值回退为 {原值}_{数字后缀} 且租户内唯一，接口不因此返回 500。
  - order: 5
    action: 调用 POST /agent/check_name，请求体 items=[{"name":"dup_name","agent_id":AgentA 的 ID}]；断言该元素排除自身后 name_conflict=true，且
      conflict_agents 只包含 AgentB 相关记录、不含 AgentA。
    expected: 未配置可用 LLM 时，regenerate_name 返回 HTTP 400，message 含 "No available model for regeneration. Please configure an
      LLM model first."。
  - order: 6
    action: 调用 POST /agent/check_name，请求体 items=[{"name":"free_name"}]；断言该元素 name_conflict=false、display_name_conflict=false、conflict_agents
      为空数组。
    expected: 空 items 数组返回 HTTP 200 与空数组，接口对无输入幂等、无副作用。
  - order: 7
    action: 配置租户 quick-config LLM 模型；调用 POST /agent/regenerate_name，请求体 items=[{"name":"dup_name","display_name":"Dup Name"}]；断言
      HTTP 200。
    expected: 所有接口状态码/错误码符合 controller 契约：ValueError→400，其余异常→500；失败路径不产生半写入、重复副作用或跨租户泄露。
  - order: 8
    action: 断言响应为数组且长度与 items 一致，每个元素含 name、display_name；再生结果与原冲突值不同且不等于租户内既有 Agent 的 name/display_name（租户内唯一）。
    expected: 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
  - order: 9
    action: 同一请求内提交两个共享冲突名 name=dup_name 的 item；断言两个 item 的再生 name 互不相同（批内去重）。
    expected: 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
  - order: 10
    action: 模拟 quick-config LLM 调用持续失败（mock 返回异常）；调用 POST /agent/regenerate_name 传冲突 item；断言对应 name/display_name 回退为 {原值}_{数字后缀}
      形式且租户内唯一，接口不返回 500。
    expected: 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
  - order: 11
    action: 清空/未配置 quick-config LLM（无可用 model_id）；调用 POST /agent/regenerate_name 传冲突 item；断言 HTTP 400，message 含 "No available
      model for regeneration. Please configure an LLM model first."。
    expected: 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
  - order: 12
    action: 调用 POST /agent/check_name，请求体 items=[]；断言 HTTP 200 且响应为空数组。
    expected: 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
  - order: 13
    action: 使用其他租户已有的同名 name 构造 item 调用 check_name；断言 name_conflict=false，且响应不包含其他租户 Agent 的 name/display_name（不跨租户泄露）。
    expected: 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
  - order: 14
    action: 核对全程请求/响应序列化、状态码与错误码符合契约，确认日志不输出 API Key、Token、用户密码或模型密钥。
    expected: 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
  expected_results:
  - check_name 对每个 item 返回 {name_conflict, display_name_conflict, conflict_agents}，布尔与冲突记录与租户内实际重名情况一致，并正确排除自身 agent_id。
  - check_name 检测范围限于当前租户，不返回跨租户 Agent 信息。
  - regenerate_name 返回数组长度与 items 一致，每个元素含 name/display_name；冲突字段被再生为租户内唯一、批内唯一且不同于原值的新值。
  - quick-config LLM 调用失败时，再生值回退为 {原值}_{数字后缀} 且租户内唯一，接口不因此返回 500。
  - 未配置可用 LLM 时，regenerate_name 返回 HTTP 400，message 含 "No available model for regeneration. Please configure an LLM model
    first."。
  - 空 items 数组返回 HTTP 200 与空数组，接口对无输入幂等、无副作用。
  - 所有接口状态码/错误码符合 controller 契约：ValueError→400，其余异常→500；失败路径不产生半写入、重复副作用或跨租户泄露。
  - 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
  forbidden_side_effects: []
