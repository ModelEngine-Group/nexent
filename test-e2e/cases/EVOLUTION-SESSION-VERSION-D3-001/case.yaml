schema_version: '1.0'
stage: D3
module: V5-BASELINE
case:
  case_id: EVOLUTION-SESSION-VERSION-D3-001
  feature_id: AGENT-EVOLUTION-RELEASE
  business_rule_ids: [AGENT-EVOLUTION-RELEASE-RULE-01]
  title: 默认版本变化时按会话保留实际运行版本
  type: AGENT-IT
  priority: P0
  status: active
  automation: automated
  objective: 在真实数据库跨事务验证首次选择、发送前核对及既有版本保留。
  preconditions: [可创建临时数据库的 PostgreSQL 测试实例。]
  test_data:
    profile: 一个业务智能体，三个版本，两名会话所有者及带运行回执的历史会话。
  steps:
  - order: 1
    action: 启用前后读取默认版本，登记首轮，把默认版本从二切到三再退回二。分别续聊和新开会话。
    expected: 已绑定的版本不变。新会话跟随默认值，即使客户端携带旧值。
  - order: 2
    action: 在选版与提交之间切换默认版本，并发提交同一首轮。检查旧会话的执行回执和无回执分支。
    expected: 拒绝过时编译，重复提交只有一条绑定，已知旧版按实际执行恢复，缺失证据时保留原选版路径。
  - order: 3
    action: 为 V2 隐藏一个工具，再从 V2 发布另一项工具调整，逐版读取编译器使用的智能体配置。
    expected: 草稿和 V1 沿用原清单，V2 只隐藏第一项，V3 同时隐藏两项，其他智能体和租户不受影响。
  - order: 4
    action: 在 V2 挂载已确认的新指南，V3 继承。尝试再次加入同名指南并从其他范围读取。
    expected: V2 和 V3 引用同一包；草稿、V1 和其他范围看不到。重复名称不会产生下一版记录。
  - order: 5
    action: 为同一 Skill 的两个智能体版本锁定新旧简介，随后修改共享目录，再分别读取 Management 模板和 Runtime 绑定。
    expected: 两版分别保留原简介和新简介。引用同一 Skill 的另一智能体使用共享说明。
  expected_results: [新旧会话使用各自版本。, 过时请求未入库，版本绑定按租户和所有者隔离。, 工具移除按版本保留且不能跨范围读取。, 新指南按版本和范围装载。, 新旧简介在模板和运行时一致且与其他智能体隔离。]
  forbidden_side_effects: [其他租户不能读取版本绑定；普通会话选版不能更改编辑草稿。]
  acceptance:
  - id: AC-01
    description: 跨发布和回退验证新旧会话。
    steps: [1]
    expected_results: [1]
  - id: AC-02
    description: 验证提交前核对、历史来源、并发和所有权。
    steps: [2]
    expected_results: [2]
    forbidden_side_effects: [1]
  - id: AC-03
    description: 后续演进版本继承已确认的工具选择。
    steps: [3]
    expected_results: [3]
    forbidden_side_effects: [1]
  - id: AC-04
    description: 按版本继承候选编号和内容摘要，拒绝同名与跨范围引用。
    steps: [4]
    expected_results: [4]
  - id: AC-05
    description: 验证改写 Skill 简介的发布范围及旧版保留。
    steps: [5]
    expected_results: [5]
  execution:
    profiles:
    - name: mock
      required_services: []
  integration_boundary:
  - Management 普通会话选版和提交时使用真实 PostgreSQL。用预设版本模拟默认指针切换，本用例单独验证会话行为。
  observations: [服务端版本读取、提交冲突和绑定记录。]
  cleanup: [销毁临时数据库。]
