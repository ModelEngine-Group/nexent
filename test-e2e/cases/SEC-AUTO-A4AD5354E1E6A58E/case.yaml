case:
  case_id: SEC-AUTO-A4AD5354E1E6A58E
  feature_id: V5-SEC-AUTO-A4AD5354E1E6A58E
  business_rule_ids:
  - V5-SEC-AUTO-A4AD5354E1E6A58E-RULE-01
  title: 标签库治理与资源分配接口跨租户越权(IDOR)及权限矩阵防护
  type: SECURITY
  priority: P1
  status: active
  automation: automated
  objective: 登录用户可读取本租户标签库及定义列表；定义/值写操作、启停、排序、置顶和 usage 要求 TAG_LIBRARY/MANAGE，DEV/USER 越权返回 403。所有 ID 从本用例创建的资源或配置身份获取；资源分配与读取接口（get/replace/bulk/filter、文档
    batch-status/projection-status、flat-tags 兼容投影）通过 tag_resource_adapters 按调用者现有 read/edit 权限 fail-closed 解析六类资源，跨租户、不存在与无权限均返回
    404 且不与“不存在”区分；文档 provider（local/aidp）权限校验正确，日志不泄露密钥。
  preconditions:
  - '- ${NEXENT_TEST_HOME}/config/users.yaml（隔离的 SU/ADMIN/SPEED/ASSET_OWNER/DEV/USER 测试账号）

    - ${NEXENT_TEST_HOME}/config/secrets.env

    - 两个独立测试租户 tenant-a/tenant-b，各自经 provision_unified_tag_management 预置 default_resource/knowledge_content 桶、六类资源绑定及 keywords/agent_category
    定义与值，并各有可标识的 agent/skill/tool/mcp_service/knowledge_base/knowledge_document 资源。'
  test_data:
    legacy_asset_declaration: '- ${NEXENT_TEST_HOME}/config/users.yaml（隔离的 SU/ADMIN/SPEED/ASSET_OWNER/DEV/USER 测试账号）

      - ${NEXENT_TEST_HOME}/config/secrets.env

      - 两个独立测试租户 tenant-a/tenant-b，各自经 provision_unified_tag_management 预置 default_resource/knowledge_content 桶、六类资源绑定及 keywords/agent_category
      定义与值，并各有可标识的 agent/skill/tool/mcp_service/knowledge_base/knowledge_document 资源。'
  steps:
  - order: 1
    action: 前置：以 tenant-a 与 tenant-b 两租户隔离数据初始化标签库（桶/定义/值/资源分配），固定各账号到租户的角色映射；DEV/USER 无 TAG_LIBRARY/MANAGE，SU/ADMIN/SPEED/ASSET_OWNER
      有。
    expected: DEV/USER 可读取本租户标签库及定义列表；写操作和 usage 返回 HTTP 403，不泄露其他租户数据。
  - order: 2
    action: 区分读权限和治理权限：DEV/USER 对 GET /tag-libraries 和 GET /tag-libraries/{bucket_id}/definitions 返回 200，结果仅包含本租户。对本用例创建的定义/值执行 POST/PATCH/DELETE 以及 usage，断言 403 且 message 为 "Tag library management permission is required"；管理角色正常操作仍成功。禁止使用固定 bucket_id/definition_id/value_id。
    expected: tenant-a 使用 tenant-b 的 bucket_id/definition_id/value_id 均返回 404，响应体不含 tenant-b 任何标签内容。
  - order: 3
    action: 治理跨租户 IDOR：以 tenant-a 的 ADMIN 账号使用 tenant-b 的 bucket_id 调用 GET /tag-libraries/{bucket_id}/definitions，以及使用 tenant-b
      的 definition_id/value_id 调用 usage、更新、删除，断言 _get_bucket/_get_definition/_get_value（backend/database/tag_management_db.py:114-174）按
      tenant_id 过滤后返回 404 "Tag library not found"/"Tag definition not found"/"Tag value not found"，响应不含 tenant-b 任何标签内容。
    expected: 对无编辑权限资源 PUT replace 返回 404；对无读取权限资源 GET 返回 404；与资源不存在响应一致，无法据此枚举他租户资源。
  - order: 4
    action: 资源分配越权：以对目标资源无编辑权限的账号调用 PUT /tag-libraries/assignments/{resource_type}/{resource_id}（replace，require_edit=True），断言
      _resolve_assignment_resource（backend/services/tag_management_service.py:260-286）在 can_edit=False 时抛 TagManagementNotFoundError
      → 404 "Resource not found"；对无读取权限资源 GET 同一路径（require_edit=False 且 can_read=False）同样 404。
    expected: 跨租户六类资源 get/replace/bulk/filter 与文档 batch-status/projection-status/flat-tags 均 fail-closed 返回 403/404，无 2xx
      越权泄露。
  - order: 5
    action: 跨租户资源解析：以 tenant-a 账号对 tenant-b 拥有的 agent/skill/tool/mcp_service/knowledge_base/knowledge_document 发起 get/replace，断言各
      adapter 经 _tenant_matches（backend/services/tag_resource_adapters.py:406-416）拒绝租户不匹配并返回 ResolvedTagResource.not_found()，最终
      404 且与资源不存在响应不可区分。
    expected: 合法角色与合法租户内的正常定义/值/分配操作仍成功，权限矩阵只收窄不放宽，无回归。
  - order: 6
    action: 文档 provider 权限：对 local 与 aidp provider 的文档分配 get/replace/batch-status/projection-status，断言 DocumentTagResourceAdapter
      与 KnowledgeBaseTagResourceAdapter 通过 provider 现有 read/edit 权限解析（backend/services/tag_resource_adapters.py:697-783），无编辑权限写入返回
      404、无读取权限读取返回 404、跨租户 knowledge_base_id 不匹配返回 404。
    expected: 全部请求与日志中不出现明文 API Key/Token/Password/模型密钥。
  - order: 7
    action: 密钥泄露：遍历上述全部越权与合法请求后抓取服务日志，断言不出现 AIDP_API_KEY、Token、用户密码等明文密钥，密钥仅在内部调用使用，不出现在响应与日志。
    expected: 全部请求与日志中不出现明文 API Key/Token/Password/模型密钥。
  expected_results:
  - DEV/USER 可读取本租户标签库及定义列表；写操作和 usage 返回 HTTP 403，不泄露其他租户数据。
  - tenant-a 使用 tenant-b 的 bucket_id/definition_id/value_id 均返回 404，响应体不含 tenant-b 任何标签内容。
  - 对无编辑权限资源 PUT replace 返回 404；对无读取权限资源 GET 返回 404；与资源不存在响应一致，无法据此枚举他租户资源。
  - 跨租户六类资源 get/replace/bulk/filter 与文档 batch-status/projection-status/flat-tags 均 fail-closed 返回 403/404，无 2xx 越权泄露。
  - 合法角色与合法租户内的正常定义/值/分配操作仍成功，权限矩阵只收窄不放宽，无回归。
  - 全部请求与日志中不出现明文 API Key/Token/Password/模型密钥。
