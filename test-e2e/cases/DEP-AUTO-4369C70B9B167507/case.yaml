case:
  case_id: DEP-AUTO-4369C70B9B167507
  feature_id: V5-DEP-AUTO-4369C70B9B167507
  business_rule_ids:
  - V5-DEP-AUTO-4369C70B9B167507-RULE-01
  title: v2.5.3 引导幂等迁移：role_permission 序列 setval 重同步与统一标签空租户跳过
  type: DEPLOYMENT
  priority: P1
  status: active
  automation: automated
  objective: 显式种子 ID 写入 nexent.role_permission_t 时不推进 SERIAL 序列，若序列落后于当前 MAX，后续插入 role_permission_id 会与已有主键冲突（unique violation），导致权限数据写入失败；平台超管预留的空租户映射若被触发预置统一标签桶，会污染预留映射。
  preconditions:
  - '- deploy/sql/migrations/v2.5.3_database_bootstrap_idempotency.sql

    - deploy/tests/test_database_bootstrap_idempotency.sh'
  test_data:
    legacy_asset_declaration: '- deploy/sql/migrations/v2.5.3_database_bootstrap_idempotency.sql

      - deploy/tests/test_database_bootstrap_idempotency.sh'
  steps:
  - order: 1
    action: 在本地工作区执行迁移契约校验脚本 deploy/tests/test_database_bootstrap_idempotency.sh，确认迁移文件存在且各静态断言通过（序列同步、MAX 取值、空租户跳过、幂等、事务边界）。
    expected: 校验脚本退出码为 0，输出 'Database bootstrap idempotency contract passed.'。
  - order: 2
    action: 核对 v2.5.3 迁移中 role_permission_id 序列使用 pg_get_serial_sequence('nexent.role_permission_t','role_permission_id')
      定位，并以 COALESCE(MAX(role_permission_id),1) 重同步，MAX 非空时 setval 第三参数为 true。
    expected: 迁移 SQL 对 role_permission_t.role_permission_id 序列执行 setval 重同步到 COALESCE(MAX(role_permission_id),1)，后续插入从 MAX+1
      推进，不与显式种子 ID 冲突。
  - order: 3
    action: 核对 CREATE OR REPLACE FUNCTION provision_unified_tag_management_after_user_tenant_insert 仅出现一次，且仅当 COALESCE(delete_flag,'N')<>'Y'
      且 NULLIF(btrim(tenant_id),'') IS NOT NULL 时才调用 provision_unified_tag_management。
    expected: 触发器函数仅当 delete_flag<>'Y' 且 btrim(tenant_id) 非空时预置统一标签桶，跳过平台超管预留的空租户映射。
  - order: 4
    action: 核对迁移体被 BEGIN;/COMMIT; 包裹，重跑不产生重复函数定义或其他副作用。
    expected: 迁移被事务包裹且幂等，可安全重复执行。
  expected_results:
  - 校验脚本退出码为 0，输出 'Database bootstrap idempotency contract passed.'。
  - 迁移 SQL 对 role_permission_t.role_permission_id 序列执行 setval 重同步到 COALESCE(MAX(role_permission_id),1)，后续插入从 MAX+1 推进，不与显式种子
    ID 冲突。
  - 触发器函数仅当 delete_flag<>'Y' 且 btrim(tenant_id) 非空时预置统一标签桶，跳过平台超管预留的空租户映射。
  - 迁移被事务包裹且幂等，可安全重复执行。
