    expected: 无OOM；错误可定位到单文件；吞吐达标；quota计算准确。
  - order: 4
    action: 预热一次后再正式测量；记录 P50/P95/P99、吞吐、错误率和资源占用。
    expected: 无OOM；错误可定位到单文件；吞吐达标；quota计算准确。
  - order: 5
    action: 性能场景仍要验证业务正确性，不能以返回快作为唯一通过条件。
    expected: 无OOM；错误可定位到单文件；吞吐达标；quota计算准确。
  - order: 6
    action: 保存原始测量 JSON/CSV、服务日志和环境快照；P2 大型场景失败默认记录但不掩盖 P0/P1结果。
    expected: 无OOM；错误可定位到单文件；吞吐达标；quota计算准确。
