    action: 从 performance.yaml 读取本用例并发量/数据规模/阈值，启动本地真实测试栈并记录机器资源信息。
    expected: 无OOM；错误可定位到单文件；吞吐达标；quota计算准确。
  - order: 2
    action: 准备“大文件/多文件上传与处理”所需固定测试数据和真实模型/向量服务（如涉及）。
    expected: 无OOM；错误可定位到单文件；吞吐达标；quota计算准确。
  - order: 3
