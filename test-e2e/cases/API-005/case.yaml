schema_version: '1.0'
stage: D2
module: V5-BASELINE
case:
  case_id: API-005
  feature_id: F-003
  business_rule_ids:
  - F-003-RULE-01
  title: Native JWT identity and legacy refresh rejection
  type: API-IT
  priority: P0
  status: active
  automation: automated
  objective: Preserve local identity queries and reject retired refresh credentials.
  preconditions:
  - Disposable PostgreSQL available through NEXENT_AUTH_TEST_DSN; actual FastAPI user
    router.
  test_data:
    profile: Isolated synthetic account and invitation
  steps:
  - order: 1
    action: Query session/current identity with local JWT or invalid credential.
    expected: Valid identity matches the persisted account; invalid JWT yields 401.
  - order: 2
    action: Submit a retired or invalid refresh credential.
    expected: HTTP 401 without access-token material.
  expected_results:
  - Local identity query obeys signature and account validation.
  - Retired refresh credentials never mint a local JWT.
  forbidden_side_effects:
  - No plaintext credentials or password hashes in HTTP errors.
  source:
    legacy_workbook_sha256: aa4b32414d30f12b3b64e14236268145e556bd7cfc5d3eb8df80731608ebc022
    legacy_sheet: 02_测试用例基线
    legacy_row: 6
  contract:
    protocol: HTTP API
    request_expectations:
    - Existing /user routes and Authorization headers.
    response_expectations:
    - Identity envelope remains compatible; retired refresh yields 401.
  acceptance:
  - id: AC-01
    description: Identity validation and refresh rejection use the local account store.
    steps:
    - 1
    - 2
    expected_results:
    - 1
    - 2
    forbidden_side_effects:
    - 1
