    - 使用无访问令牌请求对 /api/config/project-config 发起相同 multipart POST，记录响应状态码与 body。
    - 上传成功后分别 GET /modelengine-logo.png、/modelengine-logo2.png、/locales/zh/custom.json、/locales/en/custom.json，记录状态码、Content-Type、Cache-Control
      与返回内容。
    - 对 /modelengine-logo.png 发起 HEAD 请求，记录状态码、Cache-Control 及是否存在响应 body。
    - 删除本次拥有的 zh/custom.json 验证 GET 内置回退；写入带批次标记的非法 JSON，再提交合法项目配置更新，验证读取助手安全空对象路径不抛异常，持久 GET 返回 {}。不宣称重建丢失的键。
    - 校验上传/读取日志不泄露访问令牌明文；清理持久目录中的 logo 与 custom.json 后确认可重复执行。
