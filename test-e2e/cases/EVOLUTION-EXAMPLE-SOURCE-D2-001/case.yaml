schema_version: '1.0'
stage: D2
module: V5-BASELINE
case:
  case_id: EVOLUTION-EXAMPLE-SOURCE-D2-001
  feature_id: AGENT-EVOLUTION-REPLAY
  business_rule_ids: [AGENT-EVOLUTION-REPLAY-RULE-02]
  title: 提示词示例及同源改写题不能用于候选对照
  type: API-IT
  priority: P1
  status: active
  automation: automated
  objective: 从业务题登记到对照试跑入口检查示例来源；拒绝后无实验或作业落库。
  preconditions: [本机有可创建隔离临时数据库的 PostgreSQL 实例。]
  test_data:
    profile: 原生编辑者身份、已发布业务智能体、带已知示例来源的候选和判据。
  steps:
  - order: 1
    action: 通过 HTTP 保存一条仅空格和大小写变化的示例原题，再保存一条不同措辞的同源业务题。分别发起候选对照。
    expected: 两次请求均返回业务校验错误，提示另选新材料。
  - order: 2
    action: 通过接口把一条业务题两次加入固定回归，在下一版装载题单，提交只选无关专项题的候选。再移出该固定题，用旧实验中同源材料请求生成候选。
    expected: 题单及指定评估器版本跨版本保留。在原题后追加轮次仍属同源；不同材料仅共用一句“继续”可分别评测。无关专项题会带上固定题。移出后旧实验仍按冻结分区拒绝生成。
  - order: 3
    action: 使用受控资源快照提交两个单项实验。分别在单项未完成、提供错误候选号、单项有效且候选号吻合时提交组合，再重复提交。
    expected: 前两次被拒。有效组合只创建一次，数据库中每题有原版、A、B、A+B 四条待执行记录。
  - order: 4
    action: 管理员指定独立评测人。评测人在独立目录生成题集摘要并重复登记；用同源材料跨版本建开发题，再用历史开发题封存。撤销评测人授权，并发登记同源材料到两区。
    expected: 仅指定评测人可登记，重试返回原编号。两种方向的同源材料均被拒，管理员的开发页面无法取回独立题，撤权即时生效。并发时恰好一个分区登记成功。
  - order: 5
    action: 编辑者提交达到预设目标并通过固定回归的候选，独立评测人选择题集与门槛并锁定。用相同请求、修改过的门槛、改名但同源的另一套题分别重试，再撤销独立评测权。
    expected: 相同提交返回原确认编号。其他请求无法更换门槛或重复占用同源材料。只有当前授权的独立评测人能读取执行协议。
  - order: 6
    action: 编辑者查已锁定的评测进度，后台用受控结果写入结论，重复写入，再撤回独立评测权。
    expected: 页面先返回等待状态，随后只返回汇总。重复写入保留原结论，撤权后拒绝写入。
  - order: 7
    action: 在独立确认前后检查管理员、评测人和指定发布人的权限，再提交错误版本、错误摘要并撤销发布权。
    expected: 未通过确认、版本或摘要错误、未授权或已撤权的请求均被拒绝，数据库没有新增发布记录。
  expected_results: [原题和同源改写题均被拦截。, 固定题按智能体复用、自动纳入对比且历史分区受保护。, 仅有效的单项实验可组合，重复请求复用同一次四组试跑。, 独立题只登记摘要，两区互斥且按智能体授权。, 确认锁绑定已筛选候选及独立题和门槛，重复请求只创建一次。, 开发侧只能查询汇总且已完成的结论不可覆盖。, 仅指定发布人能发起晋升且版本和摘要须与已通过的独立确认一致。]
  forbidden_side_effects: [拒绝的请求均未创建任何实验或试跑作业。]
  acceptance:
  - id: AC-01
    description: 通过已登录用户的真实 API 请求和事后数据库查询验证来源隔离。
    steps: [1]
    expected_results: [1]
    forbidden_side_effects: [1]
  - id: AC-02
    description: 真实登录、题目来源隔离、跨发布版本和冻结后移出题集。
    steps: [2]
    expected_results: [2]
    forbidden_side_effects: [1]
  - id: AC-03
    description: 通过 HTTP 及真实数据库校验单项来源、组合去重和四组任务创建。
    steps: [3]
    expected_results: [3]
    forbidden_side_effects: [1]
  - id: AC-04
    description: 独立题离线封存、授权登记、旧数据隔离及并发防串题。
    steps: [4]
    expected_results: [4]
    forbidden_side_effects: [1]
  - id: AC-05
    description: 开发提交、独立授权、门槛锁定和同源题单次使用。
    steps: [5]
    expected_results: [5]
    forbidden_side_effects: [1]
  - id: AC-06
    description: 通过真实 HTTP 与数据库验证进度、汇总可见性和撤权。
    steps: [6]
    expected_results: [6]
    forbidden_side_effects: [1]
  - id: AC-07
    description: 发布权限独立授予，发布需与已确认的候选一致。
    steps: [7]
    expected_results: [7]
    forbidden_side_effects: [1]
  contract:
    protocol: HTTP API
    request_expectations: [普通开发题和实验创建接口均使用编辑者凭据。]
    response_expectations: [建题返回题号，重用示例的试跑返回客户端错误。]
