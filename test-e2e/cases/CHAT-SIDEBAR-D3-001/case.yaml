schema_version: '1.0'
stage: D3
module: CHAT-SIDEBAR
case:
  case_id: CHAT-SIDEBAR-D3-001
  feature_id: CHAT-SIDEBAR
  requirement_ids:
  - WB-SERVER-PINS-20261014
  business_rule_ids:
  - CHAT-SIDEBAR-RULE-003
  title: Authenticated Workbench pin API persists ordered state in PostgreSQL
  type: INTEGRATION
  priority: P1
  status: active
  automation: automated
  objective: Prove real HTTP router/service/PostgreSQL persistence across independent
    clients and concurrent writes.
  preconditions:
  - Reachable PostgreSQL configured through existing backend configuration; isolated
    temporary schema; controlled authentication fixture.
  test_data:
    profile: mock
    identities:
    - owner
    - other-user
    - other-tenant
    conversations:
    - workbench-a
    - workbench-b
    - agent-chat
    - deleted
    - foreign
  steps:
  - order: 1
    action: Pin Workbench histories via authenticated HTTP clients; repeat a PUT and
      read with an independent client.
    expected: Server state persists, newest pin first and repeated PUT is idempotent;
      conversation activity and content remain unchanged.
  - order: 2
    action: Unpin/repin and concurrently pin the same and distinct histories.
    expected: Repin moves first; serialized writes produce one active pin per user/tenant/conversation
      with strict order.
  - order: 3
    action: Read as another user/tenant and attempt missing, foreign, deleted, Agent-chat,
      malformed or unauthenticated writes.
    expected: Scopes are isolated; inaccessible histories return 404, malformed inputs
      422 and missing identity 401 without changing confirmed pins.
  expected_results:
  - Independent clients receive identical persisted pin state and order.
  - Invalid/unauthorized writes cannot leak or change pins.
  forbidden_side_effects:
  - No model invocation or mutation of conversation content, titles, activity, Agent-chat
    state or original schema/data.
  integration_boundary:
  - Real FastAPI router, service, SQLAlchemy session and PostgreSQL; only authentication
    identities are controlled.
  observations:
  - HTTP codes and canonical ordered items
  - Committed pin rows and independent-session reads
  - Unchanged conversation fields
  cleanup:
  - Drop only the generated isolated test schema, including fixture conversations
    and pins.
  execution:
    profiles:
    - name: mock
      required_services: []
  acceptance:
  - id: AC-01
    description: Persistent ordering and concurrency across clients.
    steps:
    - 1
    - 2
    expected_results:
    - 1
    forbidden_side_effects:
    - 1
  - id: AC-02
    description: Scope isolation and validation.
    steps:
    - 3
    expected_results:
    - 2
    forbidden_side_effects:
    - 1
