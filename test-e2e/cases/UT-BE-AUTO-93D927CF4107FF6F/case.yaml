    legacy_row: 407
  unit_boundary: 导入导出
  inputs:
  - '- ${NEXENT_TEST_HOME}/config/models.yaml

    - ${NEXENT_TEST_HOME}/config/secrets.env'
  assertions:
  - model_ids 与 model_display_names 均为空时返回 None，调用方 import_agent_by_agent_id 跳过持久化模型 id。
  - 显式 model_ids 逐项校验目标租户目录，无效 id 被丢弃、有效 id 保留且保持原始顺序。
  - 至少一个显式 id 有效时仅返回显式 id，不补充 display_name 解析结果。
  - 显式 id 全部缺失时按 model_display_names 解析为模型 id。
  - 仍无可解析模型且存在缺失项时回退 quick-config LLM 的 model_id。
  - 结果去重且顺序稳定；business_logic_model_id 分支均缺失时不写入该字段。
  - 测试过程无未处理异常、无半写入，日志中无明文 API Key/Token/Password/模型密钥。
