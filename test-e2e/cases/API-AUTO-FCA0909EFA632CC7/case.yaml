    charge 释放。
  - 非法 scope 或 source_only 作用于非终态文档：抛出明确 ValueError，消息含 Invalid scope 或 Cannot delete source file while document is in state，不产生半写入或跨租户泄露。
  - 删除开始前安装 PG tombstone（DELETE_REQUESTED）与 Redis fence；取消并 revoke 已记录 Celery 任务；返回体含 cancelled_tasks 计数字段。
  - 外部清理失败或 fence 未清：首轮返回 status=pending、deletion_pending=true、lifecycle_status=DELETE_REQUESTED，后台重试最终完成 lifecycle 硬删除与 fence
    清理（lifecycle_deleted=true）。
  - 父任务链未终态：返回 pending（等待 Celery 任务停止），父任务链进入终态后由后台重试完成清理。
  - 关键状态在 API 返回、PG、Redis、ES、MinIO 及后续读取保持一致；日志无明文凭据。
  cleanup:
  - pytest JUnit/XML、HTTP 请求/响应记录、PG lifecycle 状态快照、Redis fence/task 快照、失败堆栈与日志。
