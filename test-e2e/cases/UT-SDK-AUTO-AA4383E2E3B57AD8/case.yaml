  - authorized_skill_names 未授权时返回包含 PermissionError 和 "not enabled for agent" 的 [UnexpectedError] 错误字符串，且不调用执行后端或技能管理器；授权后正常进入执行路径。
  - execution_backend 返回 error JSON 时抛出 SkillScriptExecutionError 且不被吞；无 backend 的 workspace 请求返回包含 RuntimeError 的 [UnexpectedError]
    错误字符串，且不回退到本地脚本执行。
  - 网络启用（allow_package_installs=True）下 shell-free 的 pip install argv 被放行，关闭时被拦截；IPython magic 与 subprocess/os shell 调用均被拦截并返回具体违规项。
  - 功能结果与代码契约一致，测试过程无未处理异常；日志/Trace/报告中不出现明文 API Key/Token/Password/模型密钥。
