{
  "schema_version": "1.0",
  "stage": "D1",
  "module": "AIDP-KNOWLEDGE",
  "case": {
    "case_id": "AIDP-FILE-SCOPE-D1-001",
    "feature_id": "AIDP-FILE-SCOPE",
    "requirement_ids": [
      "AIDP-FILE-SCOPE-REQ-002",
      "AIDP-FILE-SCOPE-REQ-003"
    ],
    "business_rule_ids": [
      "AIDP-FILE-SCOPE-RULE-02",
      "AIDP-FILE-SCOPE-RULE-03",
      "AIDP-FILE-SCOPE-RULE-04"
    ],
    "title": "knowledge_scope v3 metadata filter contract and legacy compatibility",
    "type": "BE-UT",
    "priority": "P1",
    "status": "active",
    "automation": "automated",
    "objective": "Prove that conversation knowledge scopes accept a v3 AIDP metadata filter with one file-name condition, normalize its operator/value, reject unsafe combinations, and keep v1/v2 records readable without reintroducing file selection.",
    "preconditions": [
      "Parse scope payloads directly with the Pydantic contracts; no database, AIDP or model access."
    ],
    "test_data": {
      "profile": "mock",
      "schema_versions": [
        1,
        2,
        3,
        4
      ],
      "operators": [
        "contains",
        "is",
        "starts_with",
        "ends_with"
      ],
      "invalid": [
        "unknown operator",
        "blank value",
        "oversized value",
        "enabled without condition"
      ]
    },
    "steps": [
      {
        "order": 1,
        "action": "Parse a v1 scope without any filter.",
        "expected": "The parsed scope has metadata_filter.enabled = false."
      },
      {
        "order": 2,
        "action": "Parse a v2 record that still carries the retired file_scope.",
        "expected": "The retired field is ignored and no filter is enabled."
      },
      {
        "order": 3,
        "action": "Parse a v3 enabled filter and trim its value.",
        "expected": "Operator and trimmed value are preserved and schema_version stays 3."
      },
      {
        "order": 4,
        "action": "Parse a v3 disabled filter.",
        "expected": "No condition is carried."
      },
      {
        "order": 5,
        "action": "Parse enabled filters with schema v2, disabled mode, unknown operator, blank or oversized value.",
        "expected": "Every unsafe combination is rejected with a validation error."
      }
    ],
    "expected_results": [
      "v1/v2 scopes stay readable and produce no filter.",
      "A v3 filter carries exactly one operator and one trimmed value.",
      "Enabled filters require schema v3, a condition and a non-disabled AIDP mode.",
      "Invalid operators and blank/oversized values are rejected."
    ],
    "forbidden_side_effects": [
      "Do not accept the retired file_scope as an active restriction.",
      "Do not coerce invalid operators or blank values."
    ],
    "unit_boundary": "contracts/knowledge.py conversation knowledge scope models",
    "inputs": [
      "v1 scope",
      "v2 scope with file_scope",
      "v3 enabled filter",
      "v3 disabled filter",
      "invalid combinations"
    ],
    "assertions": [
      "v1 defaults to no filter",
      "v2 file_scope ignored",
      "v3 filter normalized",
      "invalid combinations rejected"
    ],
    "acceptance": [
      {
        "id": "AC-01",
        "description": "v3 filter contract",
        "steps": [
          1,
          2,
          3,
          4
        ],
        "expected_results": [
          1,
          2
        ],
        "forbidden_side_effects": [
          1
        ]
      },
      {
        "id": "AC-02",
        "description": "Legacy compatibility",
        "steps": [
          1,
          2
        ],
        "expected_results": [
          1
        ],
        "forbidden_side_effects": [
          1
        ]
      },
      {
        "id": "AC-03",
        "description": "Unsafe combinations rejected",
        "steps": [
          5
        ],
        "expected_results": [
          3,
          4
        ],
        "forbidden_side_effects": [
          1,
          2
        ]
      }
    ]
  }
}
