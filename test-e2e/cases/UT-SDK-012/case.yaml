schema_version: '1.0'
stage: D1
module: V5-BASELINE
case:
  case_id: UT-SDK-012
  feature_id: F-168
  business_rule_ids:
  - F-168-RULE-01
  title: 索引/写入/删除/搜索/filter/multi-tenant｜核心流程
  type: SDK-UT
  priority: P0
  status: active
  automation: automated
  objective: 索引/写入/删除/搜索/filter/multi-tenant｜核心流程
  preconditions:
  - 本地依赖/组件测试环境可运行；不要求外部模型服务在线。
  - 设置 NEXENT_TEST_HOME，目录不位于 Nexent Git 仓库内。
  - 当次 run_id 已生成，所有新建资源名称带 run_id；测试基线固定为 develop 当前批次锁定的产品提交；执行时另记录实际被测commit。
  - 所需本地资产存在且校验通过：${NEXENT_TEST_HOME}/assets/knowledge/；${NEXENT_TEST_HOME}/assets/expected/kb_expected.json
  test_data:
    legacy_asset_declaration: '- ${NEXENT_TEST_HOME}/assets/knowledge/

      - ${NEXENT_TEST_HOME}/assets/expected/kb_expected.json'
  steps:
  - order: 1
    action: 在本地工作区读取与“索引/写入/删除/搜索/filter/multi-tenant｜核心流程”相关的固定 fixture/配置；测试代码不得读取生产凭据。
    expected: accurate_search 每条结果包含 score、document、index、highlight_terms 四字段；document 因 _source excludes embedding 而不含 embedding。
  - order: 2
    action: 直接导入 sdk/nexent/vector_database 的 ElasticSearchCore 及 accurate_search、hybrid_search、exec_query、_extract_highlight_terms，构造最小有效输入与必要依赖对象。
    expected: highlight_terms 为命中片段内自定义标记之间的文本，经 strip 后去重保序的纯文本词列表；无 highlight 或空 highlight 时返回空列表 []。
  - order: 3
    action: 构造 accurate_search 的 ES 命中 fixture：content 片段以 __nexent_hit_start__/__nexent_hit_end__ 自定义标记包裹命中词（含重复词与带前后空白的词），记录各结果条目的
      score/document/index/highlight_terms。
    expected: hybrid_search 结果中 accurate 命中项透传 highlight_terms，仅 semantic 命中项 highlight_terms 为空列表 []，score/document/index
      字段契约不变。
  - order: 4
    action: 调用 hybrid_search（weight_accurate 指定与省略两种入参），构造 accurate 命中项与仅 semantic 命中项，记录合并结果各条目的 score/document/index/scores/highlight_terms。
    expected: _extract_highlight_terms 对空 dict 返回空列表 []，对重复命中词去重，对带前后空白命中词 strip 后输出。
  - order: 5
    action: 对 _extract_highlight_terms 直接传入空 dict、无标记片段、多个片段重复命中同一词、命中词带前后空白，记录返回的纯文本词列表。
    expected: 功能结果与代码契约一致，测试过程无未处理异常。
  - order: 6
    action: 先执行正常输入，记录返回值、状态变化和关键调用参数。
    expected: 关键状态在 API 返回、数据库/存储和后续读取中保持一致。
  - order: 7
    action: 针对边界值分别执行：空值、最小/最大值、重复调用、非法枚举或缺失字段（按该功能实际入参选择）。
    expected: 失败路径返回明确错误，不出现半写入、重复副作用或跨租户泄露。
  - order: 8
    action: 对有副作用的逻辑检查：对象状态、缓存/计数器、序列化结果以及是否出现重复写入。
    expected: 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
  - order: 9
    action: 对异常路径断言领域异常类型/错误码，不允许吞异常后返回伪成功。
    expected: 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
  - order: 10
    action: 确认日志中不输出 API Key、Token、用户密码或模型密钥。
    expected: 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
  - order: 11
    action: 测试结束后释放临时文件/临时对象，确保可重复执行。
    expected: 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
  expected_results:
  - accurate_search 每条结果包含 score、document、index、highlight_terms 四字段；document 因 _source excludes embedding 而不含 embedding。
  - highlight_terms 为命中片段内自定义标记之间的文本，经 strip 后去重保序的纯文本词列表；无 highlight 或空 highlight 时返回空列表 []。
  - hybrid_search 结果中 accurate 命中项透传 highlight_terms，仅 semantic 命中项 highlight_terms 为空列表 []，score/document/index 字段契约不变。
  - _extract_highlight_terms 对空 dict 返回空列表 []，对重复命中词去重，对带前后空白命中词 strip 后输出。
  - 功能结果与代码契约一致，测试过程无未处理异常。
  - 关键状态在 API 返回、数据库/存储和后续读取中保持一致。
  - 失败路径返回明确错误，不出现半写入、重复副作用或跨租户泄露。
  - 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
  forbidden_side_effects: []
