  - hybrid_search 结果中 accurate 命中项透传 highlight_terms，仅 semantic 命中项 highlight_terms 为空列表 []，score/document/index 字段契约不变。
  - _extract_highlight_terms 对空 dict 返回空列表 []，对重复命中词去重，对带前后空白命中词 strip 后输出。
