  - 安全闸：当前 run 内存在任一含 tool_calls 的 step 时 _provider_overflow_recovery_safe() 为 False，context_rebuild 传 None；溢出即抛 ProviderContextOverflowRetryUnsafe，不执行重建。
  - 重试耗尽：恢复调度已发生两次（_overflow_recovery_ordinal >= 2）后再次溢出，抛 ProviderContextOverflowRetryExhausted，且不再继续 rebuild。
  - 失败路径明确：Unsafe/Exhausted 领域异常按契约向上传播，不出现半写入、重复副作用或伪成功。
