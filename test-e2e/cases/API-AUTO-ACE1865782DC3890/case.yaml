  contract:
    protocol: HTTP API
    request_expectations:
    - 从 config/users.yaml 读取持有 MEM.PROVIDER 权限的 Admin 隔离账号与租户关系；密码/Token 仅从 secrets.env 注入，构造 Authorization 头（报告中只记录掩码）。
    - 通过 GET /memory/provider-plugins 确认内置插件 mem0 已发现，其 config_schema 中 api_key 为 type=secret 且 required=true。
    - POST /memory/providers 创建合法配置（provider_name 带 run_id 后缀，connection_type="plugin"，params={"plugin.name":"mem0","plugin.api_key":"sk-1234567890abcdef"}），记录返回的
      provider_config_id、enabled、timeout_seconds 及掩码后的 params。
    - 校验 connection_type 仅 plugin：POST 传 connection_type="http"（其余字段合法），断言请求被拒绝且不产生配置记录。
    - 校验 plugin.name 必填：POST 传 params 不含 plugin.name，断言返回 400 且 detail 为 "params must contain 'plugin.name'"。
    - 校验未知插件：POST 传 params={"plugin.name":"not_installed"}，断言返回 400 且 detail 含 "is not installed"。
    - 校验 config_schema 必填缺参：POST mem0 但不传 plugin.api_key，断言返回 400 且 detail 含 "Required parameter 'api_key' is missing"。
    - 校验 provider_name 唯一：再次以步骤3 相同 provider_name 发起 POST，断言返回 400（detail 含 "may already exist"），且后续列表 count 不增加。
    - GET /memory/providers 列表：断言返回 {"items":[...],"count":N}，包含步骤3 创建的配置，且 items 中 plugin.api_key 为掩码值（不含明文 sk-1234567890abcdef）。
    - GET /memory/providers/{provider_config_id} 详情：断言 200 且主表字段与 params 完整；GET 不存在的 id 断言 404 且 detail 为 "Provider configuration
      not found"。
    - PUT /memory/providers/{provider_config_id} 更新（如 enabled=true 或替换 params 全量），断言 200 返回更新后配置，被替换的旧参数不再出现。
    - 'DELETE /memory/providers/{provider_config_id} 软删除：断言 200 返回 {"success": true}；随后 GET 同一 id 断言 404、列表不再包含该配置；以相同 provider_name
      重新创建成功（唯一索引仅约束 delete_flag=''N''），且新配置的 params 无旧配置残留。'
    - 检查日志与错误响应不含明文 api_key；测试结束清理本次创建的配置与临时数据。
    response_expectations:
    - 合法创建返回 200，响应含 provider_config_id、provider_name、connection_type="plugin"、enabled、timeout_seconds 及 params；secret 字段
      plugin.api_key 按契约掩码（长度>8 显示前3位+***+后4位，即 sk-***cdef）。
    - connection_type 非 plugin 被拒绝且不落库（请求模型 Literal 校验；服务层对非 plugin 亦有 ValueError 兜底）。
    - plugin.name 缺失返回 400 "params must contain 'plugin.name'"；未知插件返回 400 且 detail 含 "is not installed"；缺 config_schema 必填字段返回
      400 且 detail 含 "Required parameter ... is missing"。
    - 同租户同名 provider_name 二次创建返回 400，列表 count 不增加，唯一约束（tenant_id+provider_name，delete_flag='N'）生效。
    - 列表返回 {"items":[...],"count":N} 结构（本契约无分页参数），详情返回单对象；两者 secret 参数始终掩码；不存在的 id 返回 404 "Provider configuration not found"。
    - '更新后主表字段与 params 反映最新值，params 为全量替换；软删除返回 200 {"success": true}，删除后 GET 404、列表排除、同名可重建且无 EAV 参数脏残留。'
    - 全部错误响应与日志不泄漏明文 api_key/凭据。
