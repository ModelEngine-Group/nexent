schema_version: '1.0'
stage: D5
module: AIDP-KNOWLEDGE
case:
  case_id: AIDP-FILE-IDENTITY-D5-001
  feature_id: AIDP-CHAT-FILE-IDENTITY
  business_rule_ids:
    - AIDP-CHAT-FILE-IDENTITY-RULE-03
    - AIDP-CHAT-FILE-IDENTITY-RULE-04
  title: 北向下载并发隔离与越权/失效拒绝不串文件、不泄露凭据
  type: SECURITY
  priority: P0
  status: active
  automation: automated
  objective: >-
    验证并发北向下载请求按各自身份、知识库与文件返回对应字节，北向/页面检索实例并发运行不串用
    下载链接设置；跨库、无凭证、撤销/删除和过期身份均被拒绝，URL 不携带 API Key。
  preconditions:
    - 使用真实 northbound 路由、真实 API Key 上下文组装与真实 SDK AIDP 工具实例。
    - Token、权限与 AIDP 流为可控替身，并在测试内记录调用参数；不访问真实 AIDP 或数据库。
  test_data:
    allowed_kb: kb-allowed
    foreign_kb: kb-foreign
    files: 两个知识库各一个 UUID；同一 UUID 在其他知识库不可用
    users: user-1 仅对 kb-allowed 有 READ
  risk_type: SECURITY
  risk: >-
    并发请求或 page/northbound 工具实例串用请求级标识，导致调用方下载到他人知识库文件、
    在普通页面结果中出现北向 URL，或错误响应泄露 AIDP 凭据。
  condition:
    - 两个及以上不同身份/知识库的下载请求同时执行。
    - 同一 UUID 用于未授权知识库；文件已被删除或权限被撤销。
    - 北向工具实例与普通页面工具实例并发处理相同命中。
  metrics:
    - 每个并发响应的字节与所请求 kds_id/file_uuid 一一对应。
    - 跨库、无 Key、错误 Key、上游 404 的拒绝数量与预期一致。
    - 只有北向工具实例的模型结果包含 northbound_api_download_url。
    - 响应体/响应头不包含 API Key 或 AIDP 凭据。
  thresholds:
    - 并发请求串值次数为 0。
    - 未授权请求触发 AIDP 下载次数为 0。
    - 普通页面工具结果出现 northbound 字段次数为 0。
  recovery_expectations:
    - 失败请求不改变已授权请求结果；后续合法请求仍可正常下载。
    - 拒绝响应保留可读状态码，不缓存上游错误正文或凭据。
  steps:
    - order: 1
      action: 并发发出两个不同知识库/文件的合法北向下载请求。
      expected: 每个响应只包含自己请求的原文件字节，AIDP 调用参数与请求一一对应。
    - order: 2
      action: 用对 kb-allowed 的凭证请求 kb-foreign 或同一文件的跨库组合。
      expected: 返回 403，且不发起 AIDP 下载。
    - order: 3
      action: 分别省略 Key、使用错误 Key、让上游返回文件 404。
      expected: 返回 401/401/404，均不返回原文件字节或凭据。
    - order: 4
      action: 并发运行北向与页面两个 AIDP 工具实例处理同一命中。
      expected: 仅北向实例的模型结果含 northbound_api_download_url，页面实例与两者页面来源数据均不含。
  expected_results:
    - 并发下载不串文件或身份，拒绝路径明确且不触达 AIDP。
    - 凭证与 URL 隔离满足要求，普通页面运行不出现北向字段。
  forbidden_side_effects:
    - 不得使用进程全局变量共享北向标识。
    - 不得把 API Key 写入下载 URL、响应头或错误正文。
    - 权限失败或上游失败不得写入缓存或影响其他请求。
  acceptance:
    - id: AC-01
      description: Concurrent authorized downloads stay isolated per identity and file.
      steps: [1]
      expected_results: [1]
      forbidden_side_effects: [1, 3]
    - id: AC-02
      description: Unauthorized, unauthenticated, cross-KB and deleted files are rejected without AIDP calls or secrets.
      steps: [2, 3]
      expected_results: [1, 2]
      forbidden_side_effects: [2, 3]
    - id: AC-03
      description: Northbound and page tool instances never share the request-scoped download link.
      steps: [4]
      expected_results: [2]
      forbidden_side_effects: [1]
  tags:
    - aidp
    - northbound
    - concurrency
    - security
