schema_version: '1.0'
stage: D2
module: V5-BASELINE
case:
  case_id: EVOLUTION-ONLINE-SCOPE-D2-001
  feature_id: AGENT-EVOLUTION-ONLINE
  business_rule_ids: [AGENT-EVOLUTION-ONLINE-RULE-01, AGENT-EVOLUTION-ONLINE-RULE-02, AGENT-EVOLUTION-ONLINE-RULE-04]
  title: 使用真实会话身份撤回证据和读取当前版本的建议
  type: API-IT
  priority: P1
  status: active
  automation: automated
  objective: 通过 Management HTTP 入口核对授权记录与建议的可见范围。
  preconditions: [隔离 PostgreSQL 实例允许创建临时数据库。]
  test_data:
    profile: 本人及他人的会话，两条已取证轮次，已发布业务智能体与不同版本的合成建议。
  steps:
  - order: 1
    action: 本人开启再关闭开关，通过撤回接口清除旧授权，并尝试撤回他人会话。
    expected: 关闭保留证据，撤回清除本人证据，他人记录保留并返回 404。
  - order: 2
    action: 为两个版本分别提交对新 Skill 的建议，再读两个版本的工作台。分别以仅能编辑智能体、仅能维护 Skill 和只有使用权的身份读取同一回执及候选。
    expected: 只有挂载新 Skill 的版本接受针对它的建议。智能体编辑者只看到对比入口，Skill 维护者只看到编辑入口，普通用户只看到文字回执；直接调用候选读写接口也检查权限。
  - order: 3
    action: 读取本人和他人的同版本出题草稿。缺少必要附件、工具初态待核实、确认材料齐全、撤回授权后分别提交业务题。
    expected: 仅本人草稿返回原问题及文件名，响应禁止缓存。缺材料和初态时拒绝保存；可登记可复位文本初态与预期，矛盾的保护要求被拒；撤回后不能使用旧草稿。
  - order: 4
    action: 用编辑者读取待处理批次和已完成批次。撤回一个问题轮次，过期一个成功轮次后再次读取并尝试从旧轮次出题。
    expected: 工作台显示获授权的归因和重复成功工具顺序。撤权的轮次排除；正文过期但授权仍有效时只显示缺证原因。两者均不可出题或参与参考流程。
  expected_results: [撤回立即清除相应的诊断。, 编辑者能看到提交给本版本的普通 Skill 和新 Skill 建议，旧版不能登记未挂载的新 Skill。, 题面和附件在授权范围内展示，逐项确认后才能入库。, 复盘展示按当前证据授权重算的批次总结与可出题来源。]
  forbidden_side_effects: [他人会话的授权与证据未受影响。, 工作台不泄露其他版本的建议或仅在澄清中的原话。, 工作台不返回其他版本的汇总、缓存的失效归因或原始对话正文。]
  acceptance:
  - id: AC-01
    description: 本人开关、撤回接口与数据库记录一致；相同凭据无法撤回他人会话。
    steps: [1]
    expected_results: [1]
    forbidden_side_effects: [1]
  - id: AC-02
    description: 核对建议的智能体及版本范围，以及同一回执的对比权和候选编辑权。
    steps: [2]
    expected_results: [2]
    forbidden_side_effects: [2]
  - id: AC-03
    description: HTTP 出题入口执行真实权限、证据和材料核对。
    steps: [3]
    expected_results: [3]
  - id: AC-04
    description: 工作台批次展示、来源定位及历史授权撤回后的重算。
    steps: [4]
    expected_results: [4]
    forbidden_side_effects: [3]
  contract:
    protocol: HTTP API
    request_expectations: [使用原生用户登录会话调用会话设置和评测工作台接口。]
    response_expectations: [设置返回 enabled；成功的工作台返回 suggestions 与 review_batches，禁止缓存，拒绝时不含诊断或建议正文。]
