schema_version: '1.0'
stage: D1
module: MODEL-MANAGEMENT
case:
  case_id: MSRF-D1-002
  feature_id: MSRF-001
  requirement_ids:
  - MSRF-001
  business_rule_ids:
  - MSRF-RULE-002
  title: Relocated model methods and shared types preserve their contracts
  type: BE-UT
  priority: P1
  status: active
  automation: automated
  objective: Compare signatures to the develop baseline and check immutable result
    defaults.
  preconditions:
  - Use the captured develop signature fixture and pure contracts.
  test_data:
    profile: mock
    configurations:
    - empty name
    - repository qualified name
    - legacy modelName
  steps:
  - order: 1
    action: Compare canonical function signatures to baseline declarations.
    expected: Arguments defaults return annotations and async declarations match.
  - order: 2
    action: Construct model descriptors and capacity results and format model names.
    expected: Defaults enum values and name fallback behavior match the preserved
      contract.
  expected_results:
  - All captured signatures match.
  - Shared dataclasses remain frozen.
  - Name formatting preserves legacy fields.
  forbidden_side_effects:
  - No model client database or telemetry initialization is required for contracts
    or names.
  unit_boundary: Public model signatures immutable contracts and pure name helpers
  inputs:
  - Baseline signatures
  - Empty and legacy model name dictionaries
  assertions:
  - Public signatures are unchanged.
  - Contract defaults and enum values match.
  - Dataclasses reject mutation.
  - Pure helpers use no business imports.
  acceptance:
  - id: AC-01
    description: Verify every declared relocation contract assertion.
    expected_results:
    - 1
    - 2
    - 3
    steps:
    - 1
    - 2
    forbidden_side_effects:
    - 1
