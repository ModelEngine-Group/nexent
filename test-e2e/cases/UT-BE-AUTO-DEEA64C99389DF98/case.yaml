schema_version: '1.0'
stage: D1
module: V5-BASELINE
case:
  case_id: UT-BE-AUTO-DEEA64C99389DF98
  feature_id: F-178
  business_rule_ids:
  - F-178-RULE-01
  title: search_all_enabled/ingest_all_enabled 并行 fan-out 与单 provider 故障隔离｜核心流程
  type: BE-UT
  priority: P1
  status: active
  automation: automated
  objective: search_all_enabled/ingest_all_enabled 并行 fan-out 与单 provider 故障隔离｜核心流程
  preconditions:
  - 本地依赖/组件测试环境可运行；不要求外部 provider 或模型服务在线。
  - 设置 NEXENT_TEST_HOME，目录不位于 Nexent Git 仓库内。
  - 当次 run_id 已生成；测试基线固定为 develop，执行时另记录实际被测 commit。
  - backend/services/memory_external_provider_service.py 可导入，PluginLoader 与 MemoryProviderConfigService 可被 mock 替换；所需 fake
    provider 桩可构造。
  test_data:
    legacy_asset_declaration: '- 无外部本地资产；仅测试内 mock PluginLoader / MemoryProviderConfigService 与 fake provider 桩（含 provider_name、provider_config_id、params.plugin.name）。'
  steps:
  - order: 1
    action: 构造 MemoryExternalProviderService 实例，注入 mock PluginLoader 与 mock MemoryProviderConfigService，并 mock build_provider
      返回可搜索/可摄取的 fake provider 桩。
    expected: search_all_enabled 并行调用所有 enabled provider，get_enabled_providers 恰好调用一次，无 provider 被遗漏。
  - order: 2
    action: mock get_enabled_providers 返回 2 个 enabled provider 配置（各含 provider_name、provider_config_id、params 含 plugin.name），调用
      search_all_enabled(tenant_id, request, limit)，断言 get_enabled_providers 被调用一次且每个 enabled provider 的 search 均被调用（fan-out
      覆盖全部）。
    expected: 单 provider 失败时 search_all_enabled 返回成功 provider 的结果集合，不抛出异常、不阻塞主记忆检索。
  - order: 3
    action: 使其中一个 provider.search 抛出异常（RetryableProviderError 或通用 Exception），另一个正常返回结果；断言调用不抛出异常、正常 provider 结果保留、失败 provider
      贡献空结果。
    expected: 返回结果顺序与 enabled provider 顺序一致，未做重排序，结果数为各 provider 结果数之和。
  - order: 4
    action: 断言返回结果顺序与 enabled provider 列表顺序一致（无重排序），结果数量等于各 provider 结果数量之和。
    expected: 无 enabled provider 时 search_all_enabled 返回空列表 []。
  - order: 5
    action: 使 get_enabled_providers 返回空列表，断言 search_all_enabled 返回空列表 []。
    expected: ingest_all_enabled 单 provider 失败时返回 status="error" 的 MemoryIngestResult，其余 provider 结果保留。
  - order: 6
    action: 对 ingest_all_enabled：mock 各 provider.ingest 返回 MemoryIngestResult；使一个 provider.ingest 抛出异常，断言返回结果包含正常 provider
      结果与 error 结果，其余 provider 不受影响。
    expected: 任一 provider.ingest 抛出未捕获异常时被转换为 error 结果，整体不抛出异常。
  - order: 7
    action: 使一个 provider.ingest 抛出未捕获 Exception 进入 gather 层（return_exceptions=True 路径），断言该异常被转换为 status="error" 的 MemoryIngestResult
      而非整体抛出。
    expected: 无 enabled provider 时 ingest_all_enabled 返回空列表 []。
  - order: 8
    action: 断言日志与测试产物中不输出明文 api_key/token；测试结束后无未关闭的副作用对象。
    expected: 日志、Trace、报告中不出现明文 API Key/Token。
  expected_results:
  - search_all_enabled 并行调用所有 enabled provider，get_enabled_providers 恰好调用一次，无 provider 被遗漏。
  - 单 provider 失败时 search_all_enabled 返回成功 provider 的结果集合，不抛出异常、不阻塞主记忆检索。
  - 返回结果顺序与 enabled provider 顺序一致，未做重排序，结果数为各 provider 结果数之和。
  - 无 enabled provider 时 search_all_enabled 返回空列表 []。
  - ingest_all_enabled 单 provider 失败时返回 status="error" 的 MemoryIngestResult，其余 provider 结果保留。
  - 任一 provider.ingest 抛出未捕获异常时被转换为 error 结果，整体不抛出异常。
  - 无 enabled provider 时 ingest_all_enabled 返回空列表 []。
  - 日志、Trace、报告中不出现明文 API Key/Token。
  forbidden_side_effects: []
  source:
    legacy_workbook_sha256: aa4b32414d30f12b3b64e14236268145e556bd7cfc5d3eb8df80731608ebc022
