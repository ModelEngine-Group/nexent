  contract:
    protocol: HTTP API
    request_expectations:
    - 查询 provider-plugins。
    - 用真实测试凭据创建、读取、更新 provider。
    - 执行 test-search 与 test-ingest。
    - 校验列表/详情掩码、错误码和软删除。
    - 跨租户重放 ID。
    response_expectations:
    - 插件元数据稳定。
    - 配置 CRUD 和连通性测试成功。
    - secret 只写不回显。
    - 错误可诊断。
    - 跨租户无读取、修改或 last_error_code 副作用。
