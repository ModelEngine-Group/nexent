  - 功能结果与代码契约一致，测试过程无未处理异常。
  - Tab 计数仅在 caseTotalQueryKey === getCaseTotalQueryKey(caseTab, annoFilters, sessionIdFilter) 时展示 caseTotal，否则回退 stats totalCases/passCount/failCount，不显示旧
    total。
  - 竞态下旧响应被 AbortController 取消，不覆盖新查询的 rows 与 total，计数标签与当前查询一致。
  - getCaseTotalQueryKey 对 filters 按 schema_id 数值升序归一化，相同语义不同插入顺序产出相同 key；sessionId 空值归一为 null。
  - 失败路径回退展示 stats fallback 值，不出现半更新或重复副作用，页面其它 Tab 计数不受影响。
  - 日志、DOM 中不输出明文 API Key/Token/Password/模型密钥。
