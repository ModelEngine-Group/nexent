  - code 命中 _CONTEXT_OVERFLOW_CODES 任一成员时 is_provider_context_overflow 返回 True。
  - code 未命中但 message/body 文本命中任一 _CONTEXT_OVERFLOW_MESSAGE_MARKERS 时返回 True（大小写不敏感）。
  - 嵌套 body 信封（error/error_code/type）中的显式上下文超限 code 可被识别并返回 True。
  - 泛化 400（无 marker、无显式 code）返回 False，不将通用 HTTP 400 误判为上下文超限。
  - 无 code/空 body/非 Mapping body 不抛异常，按 message marker 判定。
  - 溢出恢复异常层级正确：RetryUnsafe、RetryExhausted 可被 ProviderContextOverflowRecoveryError 捕获，且均为 RuntimeError 子类。
  - 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
