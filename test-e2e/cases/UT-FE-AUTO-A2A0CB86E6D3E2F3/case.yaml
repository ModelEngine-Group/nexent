    legacy_row: 444
  unit_boundary: 配置前端
  inputs:
  - '- ${NEXENT_TEST_HOME}/config/models.yaml

    - ${NEXENT_TEST_HOME}/config/secrets.env'
  assertions:
  - 组件交互结果与 dnd-kit 排序契约一致，测试过程无未处理异常。
  - 拖拽/键盘重排后 model_ids 按 active→over 重排，首位模型为主模型（model 取首位展示名、model_names 与重排顺序一致），updateAgent 被调用且参数正确。
  - 只读/无权限时拖拽手柄与多选 Select 均 disabled，无法调整优先级；模型数少于 2 时排序入口 disabled。
  - autosave（updateAgent/updateAgentConfig）被触发，重排后优先级状态被提交。
  - 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
