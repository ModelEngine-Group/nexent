schema_version: "1.0"
stage: D5
module: AIDP-KNOWLEDGE
case:
  case_id: AIDP-METADATA-D5-001
  feature_id: AIDP-METADATA
  business_rule_ids: [AIDP-METADATA-RULE-01, AIDP-METADATA-RULE-02, AIDP-METADATA-RULE-03]
  title: Metadata authorization and retrieval display chain
  type: SECURITY
  risk_type: SECURITY
  priority: P0
  status: active
  automation: automated
  objective: >-
    Prove field/annotation authorization, cross-KB rejection, undefined-key blocking and the existing SDK-to-source-panel metadata chain.
  preconditions:
    - Authentication and KB permissions are substituted with fixed user/role inputs.
  test_data:
    profile: mock
    data: "logical fixtures for AIDP-METADATA-D5-001"
  steps:
    - order: 1
      action: >-
        Attempt field-definition writes as a regular USER.
      expected: >-
        All writes are 403.
    - order: 2
      action: >-
        Annotate a READ_ONLY KB and an undefined key.
      expected: >-
        The READ_ONLY KB is 403; the undefined key is 400; neither reaches the batch upstream call.
    - order: 3
      action: >-
        Attempt to annotate a chunk from another KB.
      expected: >-
        The chunk is rejected with a readable ownership error.
    - order: 4
      action: >-
        Inspect the SDK and source-panel metadata chain.
      expected: >-
        The SDK emits metadata, the source helper extracts it into sourceMetadata and the sources panel renders it; no metadata_condition filter is added.
  expected_results:
    - Annotation is backend-authorized and KB-scoped.
    - Existing retrieval metadata is displayed without new filter parameters.
  forbidden_side_effects:
    - Do not fabricate metadata keys or hide the real upstream reason.
  unit_boundary: HTTP permission boundaries and static source-chain check
  inputs:
    - users with USER/ADMIN roles
    - KB permission maps
  assertions:
    - Denied writes make no upstream call.
    - The SDK/source chain retains metadata.
  acceptance:
    - id: AC-01
      description: >-
        Metadata authorization and retrieval display carry the documented guarantees.
      steps: [1, 2, 3, 4]
      expected_results: [1, 2]
      forbidden_side_effects: [1]

  risk: An unauthorized or cross-boundary caller changes ontology, binding or chunk metadata state.
  condition:
    - Regular USER attempts ontology definition writes.
    - A READ_ONLY or unknown knowledge base is used for binding or annotation.
    - A chunk from another knowledge base or an undefined metadata key is submitted.
  metrics:
    - HTTP status for each denied call.
    - Upstream-call count for each rejected request.
    - Presence of internal task endpoint strings in proxy source.
  thresholds:
    - Denied writes return 403 or 404; cross-boundary writes return 400/403.
    - Rejected requests make zero upstream writes.
    - No kmsctrl or ontology/tasks call exists.
  recovery_expectations:
    - Existing bindings, definitions and chunk values remain unchanged after rejection.
    - The caller can retry with an authorized KB and a defined field.

