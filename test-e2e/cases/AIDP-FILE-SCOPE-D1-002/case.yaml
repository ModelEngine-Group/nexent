{
  "schema_version": "1.0",
  "stage": "D1",
  "module": "AIDP-KNOWLEDGE",
  "case": {
    "case_id": "AIDP-FILE-SCOPE-D1-002",
    "feature_id": "AIDP-FILE-SCOPE",
    "requirement_ids": [
      "AIDP-FILE-SCOPE-REQ-002",
      "AIDP-FILE-SCOPE-REQ-003"
    ],
    "business_rule_ids": [
      "AIDP-FILE-SCOPE-RULE-02",
      "AIDP-FILE-SCOPE-RULE-03",
      "AIDP-FILE-SCOPE-RULE-04"
    ],
    "title": "Resolver injects an immutable metadata filter into every main and sub-Agent AIDP tool",
    "type": "BE-UT",
    "priority": "P1",
    "status": "active",
    "automation": "automated",
    "objective": "Prove that scope resolution projects the conversation metadata filter into every AidpSearchTool override, keeps the resolved KB range authoritative, omits the parameter when disabled, and replaces wider request-level tool parameters.",
    "preconditions": [
      "Use a synthetic root and sub-Agent runtime tree with AidpSearchTool entries and JSON kds_list defaults.",
      "Replace the AIDP access snapshot with an in-memory accessible KB set; do not contact AIDP, Elasticsearch, a database or a model."
    ],
    "test_data": {
      "profile": "mock",
      "readable_kbs": [
        "kb-1",
        "kb-2"
      ],
      "root_range": [
        "kb-1",
        "kb-2"
      ],
      "child_range": [
        "kb-1"
      ],
      "filter": "contains '合同'"
    },
    "steps": [
      {
        "order": 1,
        "action": "Resolve an override scope with a filter across a root and a child AidpSearchTool.",
        "expected": "Both tools carry the resolved KB list and the same metadata_filter."
      },
      {
        "order": 2,
        "action": "Resolve a scope whose filter is disabled.",
        "expected": "No metadata_filter parameter is added to the tool overrides."
      },
      {
        "order": 3,
        "action": "Resolve an inherit scope with a filter and a request tool_params entry carrying a wider KB list and a different filter.",
        "expected": "The resolved KB range and conversation filter replace the request values."
      }
    ],
    "expected_results": [
      "The metadata filter is projected to every AIDP tool and stored on the resolved scope.",
      "Disabled filters add no tool parameter.",
      "Request-level tool parameters cannot replace the conversation filter or widen kds_list."
    ],
    "forbidden_side_effects": [
      "Do not drop the filter for sub-Agents.",
      "Do not let request parameters override the conversation filter."
    ],
    "unit_boundary": "management.services.knowledge_base.scope.resolve_knowledge_scope with a synthetic runtime tree",
    "inputs": [
      "override scope with filter",
      "disabled filter",
      "inherit scope plus wider request params"
    ],
    "assertions": [
      "per-tool metadata_filter",
      "no parameter when disabled",
      "request values replaced"
    ],
    "acceptance": [
      {
        "id": "AC-01",
        "description": "Filter projected to root and sub-Agent tools",
        "steps": [
          1
        ],
        "expected_results": [
          1
        ],
        "forbidden_side_effects": [
          1
        ]
      },
      {
        "id": "AC-02",
        "description": "Disabled filter adds nothing",
        "steps": [
          2
        ],
        "expected_results": [
          2
        ],
        "forbidden_side_effects": [
          1
        ]
      },
      {
        "id": "AC-03",
        "description": "Request parameters remain bounded",
        "steps": [
          3
        ],
        "expected_results": [
          3
        ],
        "forbidden_side_effects": [
          2
        ]
      }
    ]
  }
}
