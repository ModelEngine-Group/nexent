  title: 模型 V2 自定义接入创建/更新与推理参数持久化
  type: INTEGRATION
  priority: P0
  status: active
  automation: automated
  objective: 模型 V2 自定义接入创建/更新与推理参数持久化
  preconditions:
  - Nexent 本地测试全栈已启动，health check 通过。
  - 设置 NEXENT_TEST_HOME，目录不位于 Nexent Git 仓库内。
  - 当次 run_id 已生成，所有新建资源名称带 run_id；测试基线固定为 develop 473b65268ba8cda3db53be735f97678e214c583b；执行时另记录实际被测commit。
  - 所需本地资产存在且校验通过：${NEXENT_TEST_HOME}/config/models.yaml；${NEXENT_TEST_HOME}/config/secrets.env；${NEXENT_TEST_HOME}/assets/knowledge/；${NEXENT_TEST_HOME}/assets/expected/kb_expected.json；${NEXENT_TEST_HOME}/assets/images/；${NEXENT_TEST_HOME}/assets/expected/vlm_expected.json；${NEXENT_TEST_HOME}/assets/audio/；${NEXENT_TEST_HOME}/assets/expected/stt_expected.json
  - models.yaml 中本用例所需真实 Provider 已配置，secrets.env 中凭据有效，预检连通性通过。
  test_data:
    legacy_asset_declaration: '- ${NEXENT_TEST_HOME}/config/models.yaml

      - ${NEXENT_TEST_HOME}/config/secrets.env

      - ${NEXENT_TEST_HOME}/assets/knowledge/

      - ${NEXENT_TEST_HOME}/assets/expected/kb_expected.json

      - ${NEXENT_TEST_HOME}/assets/images/

      - ${NEXENT_TEST_HOME}/assets/expected/vlm_expected.json

      - ${NEXENT_TEST_HOME}/assets/audio/

      - ${NEXENT_TEST_HOME}/assets/expected/stt_expected.json'
  steps:
  - order: 1
    action: 从 ${NEXENT_TEST_HOME}/config/models.yaml 读取本用例要求的真实 Provider/模型配置；密钥仅从 secrets.env/系统环境变量注入。
    expected: 功能结果与代码契约一致，测试过程无未处理异常。
  - order: 2
    action: 调用 Nexent 实际模型配置 API 创建或选取测试模型，确认数据库中的 provider、model、model_type、dimension/capacity 等字段与本地配置一致。
    expected: 关键状态在 API 返回、数据库/存储和后续读取中保持一致。
  - order: 3
    action: 执行 Nexent 自带的模型连通性/健康检查，真实请求外部 Provider；保存实际 HTTP 状态、响应耗时和脱敏后的错误信息。
    expected: 失败路径返回明确错误，不出现半写入、重复副作用或跨租户泄露。
  - order: 4
    action: 按“LLM/Embedding/Multi-Embedding/VLM/STT/TTS 模型新增/更新/软删除｜核心流程”执行目标操作；若涉及 LLM/Embedding/Rerank/VLM/STT/TTS，必须触发一次真实推理/向量化/重排/识别/合成，而不是只检查配置保存成功。
    expected: 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
  - order: 5
    action: 创建 embedding/multi_embedding 模型时，分别以“原始 URL”与“需追加 /embeddings 的 URL”两种 base_url 提交，验证 resolve_embedding_base_url
      按先 /embeddings 后原始 URL 的顺序依次探测并持久化命中的候选 URL。
    expected: 创建 embedding/multi_embedding 模型成功后，数据库中持久化的 base_url 为已验证候选 URL（命中 /embeddings 或原始 URL），max_tokens 等于探测得到的向量维度，model_factory
      按解析后 URL 推断；URL 探测失败时接口返回明确错误且不写入记录。
  - order: 6
    action: 对 LLM 检查 stream 正常结束、回答非空、model_id/model_name 正确；对 Embedding 检查向量维度；对 Rerank 检查目标文档进入期望 Top-N。
    expected: 真实模型调用成功，stream/Agent run 正常结束；自然语言只做稳定关键词/结构/工具调用断言。
  - order: 7
    action: 对 VLM 使用固定图片并检查唯一标记（如 7429）；对 STT 使用固定音频并检查关键词/CER 阈值；对 TTS 检查生成音频可解码、duration>0，必要时再用 STT 做闭环验证。
    expected: 固定测试 marker 对应文档进入期望 Top-K/Top-N，向量维度和模型绑定正确。
  - order: 8
    action: 检查 Telemetry/服务日志中模型名、TTFT/token 或错误信息合理，且 API Key 不得明文出现。
    expected: 'STT 关键词/CER 达到 expected oracle；TTS 输出可解码且时长>0。

      HTTP 响应不含 api_key，已保存模型仍可正常调用。'
  - order: 9
    action: '删除本用例创建的临时模型/Provider记录或恢复原主模型，避免污染后续每日用例。

      473b6526：模型列表/详情返回后递归检查凭证字段。'
    expected: 'STT 关键词/CER 达到 expected oracle；TTS 输出可解码且时长>0。

      HTTP 响应不含 api_key，已保存模型仍可正常调用。'
  expected_results:
  - 功能结果与代码契约一致，测试过程无未处理异常。
  - 关键状态在 API 返回、数据库/存储和后续读取中保持一致。
  - 失败路径返回明确错误，不出现半写入、重复副作用或跨租户泄露。
  - 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
  - 创建 embedding/multi_embedding 模型成功后，数据库中持久化的 base_url 为已验证候选 URL（命中 /embeddings 或原始 URL），max_tokens 等于探测得到的向量维度，model_factory
    按解析后 URL 推断；URL 探测失败时接口返回明确错误且不写入记录。
  - 真实模型调用成功，stream/Agent run 正常结束；自然语言只做稳定关键词/结构/工具调用断言。
  - 固定测试 marker 对应文档进入期望 Top-K/Top-N，向量维度和模型绑定正确。
  - 'STT 关键词/CER 达到 expected oracle；TTS 输出可解码且时长>0。

    HTTP 响应不含 api_key，已保存模型仍可正常调用。'
