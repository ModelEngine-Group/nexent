schema_version: '1.0'
stage: D3
module: V5-BASELINE
case:
  case_id: AGT-005
  feature_id: F-045
  business_rule_ids: [F-045-RULE-01]
  title: "未知外部能力的结构化澄清、资源选择或安全降级，不虚构绑定"
  type: AGENT-IT
  priority: P1
  status: active
  automation: automated
  objective: "未知外部能力的结构化澄清、资源选择或安全降级，不虚构绑定"
  preconditions:
  - Nexent 本地全栈及配置中真实 LLM 可用，当前提交及模型快照由执行器记录。
  - 使用已有配置 helper、资产注册表、隔离资产工厂和本地 test-home，不固定资源 ID 或密钥。
  test_data:
    logical_assets: [configured_llm, owned_agent_or_conversation]
  observations:
  - 记录当前产品提交、脱敏协议事件及独占资源前后状态。
  cleanup:
  - 使用已有资产工厂和资产登记清理独占资源，清理失败保留单独证据。
  steps:
  - order: 1
    action: "通过配置 helper 选择已配置真实 LLM，并创建独占临时 Agent；读取名称、Prompt、模型及工具/技能/子 Agent 绑定快照。"
    expected: "前置模型可用，临时 Agent 可读取且所有资源归本用例所有。"
  - order: 2
    action: "通过真实 NL2Agent 接口提交含 d3-missing-tool 未知能力的需求，完整消费本轮 SSE 至 EOF。"
    expected: "澄清卡片须有合法问题；资源选择卡片须属于同一草稿、候选为实际可访问工具且 is_bound=false；安全降级完成须有结构化完成事件及正常终态。"
  - order: 3
    action: "解析 nl2a / nl2a_state / error 协议事件，回读同一草稿并比较快照。"
    expected: "不要求逐字回显未知能力名；澄清或资源选择暂停分支无 error 或保存事件且草稿不变；完成降级分支保存非空职责、欢迎语和推荐问题，模型及资源绑定均不变。"
  - order: 4
    action: "保留脱敏卡片与前后快照证据，通过已有工厂清理独占 Agent。"
    expected: "临时 Agent 被清理，未修改共享 Agent 或配置。"
  expected_results:
  - "真实 NL2Agent 返回可操作澄清或待用户确认的资源卡片，或以结构化完成事件安全降级；候选工具 ID 必须在当前用户实际可访问目录中，只返回自然语言成功不算通过。"
  - "未知资源未被虚构绑定；暂停分支草稿不变，降级完成后的必需字段已实际保存，模型及资源配置保持不变。"
  - "独占 Agent 清理，证据只保存在本地且脱敏。"
  forbidden_side_effects:
  - 不修改共享产品配置、其他用户资源或 Redis 状态；不得将未完成的运行视为通过。
  source:
    legacy_workbook_sha256: aa4b32414d30f12b3b64e14236268145e556bd7cfc5d3eb8df80731608ebc022
    legacy_sheet: 02_测试用例基线
    legacy_row: 86
    notes: "本用例验证未知外部能力的安全澄清，不宣称已经注入或覆盖 Provider 超时/断连。旧标题将未知能力输入等同外部故障，原实现并未注入故障；该覆盖缺口保留在变更记录中。"
  integration_boundary:
  - 通过实际配置和运行 API 以及真实模型验证；只读观测不替代产品执行。
  acceptance:
  - id: AC-01
    description: "澄清、等待用户确认的真实资源选择或受控降级须有结构化协议、实际回读及无虚构绑定证据；所有前置、操作、终态及独占资源清理按上述定义验证。"
    steps: [1, 2, 3, 4]
    expected_results: [1, 2, 3]
    forbidden_side_effects: [1]
