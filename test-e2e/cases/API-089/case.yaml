  contract:
    protocol: HTTP API
    request_expectations:
    - 启动/确认 ${NEXENT_TEST_HOME}/services/test-mcp/ 可用，包含 echo、add、get_test_code、require_header、require_metadata、sleep、always_fail
      等固定工具。
    - 从 config/mcp.yaml 读取真实本地 MCP endpoint、transport、header/credential；密钥只从 secrets.env 注入。
    - 通过 Nexent MCP 实际 API 创建服务并执行握手/工具列表刷新，断言工具 schema 与 Test MCP Server 暴露内容一致。
    - 通过统一标签管理为新建服务分配结构化标签（resource_type=mcp_service），再调用社区 list/tag stats/mine/detail 接口。
    - 断言 list/tag stats/mine/detail 返回的标签来源于统一标签管理（结构化 resource_tag_assignment），而非遗留的 mcp_record.tags 自由文本数组。
    - 在 Test MCP Server 的 wire log 中断言请求路径、transport、tool name、arguments、custom header、metadata 等真实收到的值。
    - 对 timeout/500/畸形 schema 使用 Test MCP Server 自带故障端点，检查 Nexent 错误映射、重试和连接释放。
    - 若涉及 Agent 绑定，保存后执行一次真实 Chat，确认目标 MCP 工具被选择并把 NX-92831 等固定返回值带入回答。
    - 删除该 MCP 服务，触发 delete_mcp_service 内的 TagManagementService.cleanup_resource_assignments。
    - 删除后查询标签分配与 tag stats，断言该 mcp_service 的 resource_tag_assignment 已清理、无孤儿标签，其他资源标签不受影响；保存服务端 wire log 到运行结果目录。
    response_expectations:
    - 功能结果与代码契约一致，测试过程无未处理异常。
    - 社区 list/tag stats/mine/detail 返回的标签与统一标签管理（结构化 resource_tag_assignment）一致，遗留自由文本 mcp_record.tags 不再作为标签数据源。
    - 删除 MCP 服务后，该 mcp_service 的标签资源分配被 TagManagementService.cleanup_resource_assignments 同步清理，无孤儿标签，且其他资源的标签分配不受影响。
    - 关键状态在 API 返回、数据库/存储和后续读取中保持一致。
    - 失败路径返回明确错误，不出现半写入、重复副作用或跨租户泄露。
    - 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
    - 本地测试服务 wire log 证明协议请求、Header/metadata/参数真实到达，而不是由 UI 状态推断。
