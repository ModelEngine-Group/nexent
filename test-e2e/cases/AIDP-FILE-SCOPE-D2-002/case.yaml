    ],
    "title": "Real AIDP FusionSearch original_file_name metadata-condition protocol",
    "type": "CONTRACT",
    "priority": "P0",
    "status": "blocked",
    "automation": "manual",
    "objective": "Prove against the real AIDP service that a single original_file_name condition with the four supported operators filters before recall and is rejected for unsupported operators, and that the graph channel behavior is recorded.",
    "preconditions": [
      "A real AIDP environment reachable from the test host; no mock substitute for the acceptance conclusion."
    ],
    "test_data": {
      "profile": "real-aidp",
      "operators": [
        "contains",
        "is",
        "start with",
        "end with"
      ],
      "graph": "determine whether graph consumes metadata_condition"
    },
    "steps": [
      {
        "order": 1,
        "action": "Send a vector FusionSearch with each supported operator.",
        "expected": "Only matching files are returned and no 400/422 occurs."
      },
      {
        "order": 2,
        "action": "Send an unsupported operator or unknown field.",
        "expected": "AIDP rejects the request with an explicit error."
      },
      {
        "order": 3,
        "action": "Send graph retrieval with the same condition and compare with an unfiltered run.",
        "expected": "Record whether graph honors the filter; if it does not, the product keeps failing closed."
      }
    ],
    "expected_results": [
      "Supported operators filter before recall",
      "Invalid operators are rejected",
      "Graph behavior is recorded"
    ],
    "forbidden_side_effects": [
      "Do not claim UUID-level isolation",
      "Do not use an unfiltered retry as a fallback"
    ],
    "unit_boundary": "real AIDP FusionSearch",
    "inputs": [
      "four operators",
      "invalid operator",
      "graph comparison"
    ],
    "assertions": [
      "filtered results",
      "explicit error",
      "graph behavior"
    ],
    "acceptance": [
      {
        "id": "AC-01",
        "description": "Operator acceptance",
        "steps": [
          1,
          2
        ],
        "expected_results": [
          1,
          2
        ],
        "forbidden_side_effects": [
          1,
          2
        ]
      },
      {
        "id": "AC-02",
        "description": "Graph behavior",
        "steps": [
          3
        ],
        "expected_results": [
          3
        ],
        "forbidden_side_effects": [
          2
        ]
      }
    ],
    "contract": {
      "protocol": "AIDP FusionSearch HTTP/JSON",
      "method": "POST",
      "endpoint": "/KnowledgeBase/Tenants/{tenant_id}/Retrieval/FusionSearch",
      "request_expectations": [
        "metadata_condition is a top-level object with logical_operator and conditions[]; each condition has name, comparison_operator and value.",
        "The filter uses one condition on original_file_name with one of contains / is / start with / end with; the same condition applies to all selected KBs and is evaluated before recall.",
        "Graph retrieval does not consume metadata_condition (unverified whether any version honors it); the product must not send a filtered graph request."
      ],
      "response_expectations": [
        "Hits carry original_file_name (or an equivalent returned file name) so defensive verification is possible.",
        "Unselected names never appear in results when the condition is applied.",
        "Graph results are not treated as file-filtered."
      ]
    }
  }
