schema_version: '1.0'
stage: D2
module: CHAT-MESSAGE
case:
  case_id: CHAT-MODEL-CONTROLS-D2-001
  feature_id: CHAT-MODEL-CONTROLS
  requirement_ids: [SESSION-MODEL-UNIFY-20261020, CHAT-MODEL-CONTROLS-20261014, CHAT-SAMPLING-20261016]
  business_rule_ids: [CHAT-MODEL-CONTROLS-RULE-002, CHAT-MODEL-CONTROLS-RULE-003, CHAT-MODEL-CONTROLS-RULE-006]
  title: 三运行端点共享选模、档案参数与旧临时请求拒绝契约
  type: API-IT
  priority: P0
  status: active
  automation: automated
  objective: Verify actual HTTP DTOs and route adapters preserve absent overrides, explicit intent, canonical profile preferences and rejection of removed temporary payloads.
  preconditions:
    - use actual FastAPI routes and existing authentication/tenant dependencies after implementation.
    - Isolated tenant creator has valid Agent and Skill drafts, effort/budget/plain LLM fixtures and distinctive existing model parameters.
  test_data:
    profile: mock
    endpoints: [/api/agent/run, /api/agent/nl2agent/run, /api/skills/nl2skill/run]
    models: [effort-llm, budget-llm, plain-llm]
    variants: [legacy-absent, empty-overlay, partial-overlay, disabled-with-remembered-effort, auto, none, minimal, low, medium, high, xhigh, max, budget-zero-auto, budget-min, budget-max, invalid-enum, field-null, wrong-type, budget-outside-range, conflicting-concrete-controls, conflicting-snapshot]
  steps:
    - order: 1
      action: Submit each route's existing minimal valid payload without new fields; repeat with empty canonical preferences; compare inherited model and parameters with the baseline.
      expected: Valid streams retain their existing schema and defaults; absent fields never materialize false/low overrides and no new sampling input is required.
    - order: 2
      action: Select the effort model and submit partial enablement, explicit false with inactive effort removed, true plus inherited defaults and each declared effort value; repeat on ordinary and creator route forms including persisted Workbench creation snapshots.
      expected: Requests preserve exact enum and presence intent; false disables active reasoning, auto inherits the selected model effective default, partial effort does not implicitly enable thinking, and matching snapshot fields are accepted.
    - order: 3
      action: Select the budget model; submit minimum and maximum declared budgets; send the same canonical preference map on all routes.
      expected: Valid budgets use the declared profile domain and a single canonical preference field; resource declarations do not contain model parameters.
    - order: 4
      action: Submit invalid enum/type/null reasoning fields, out-of-capability effort, out-of-range budget, enabled concrete effort plus budget, removed temporary fields, and invalid sampling types/ranges or conflicting sampling snapshots.
      expected: Each invalid input returns 422 before SSE headers/provider execution, with field validation or model_controls_invalid detail; valid numeric sampling overrides including zero are accepted; bool/string/nonfinite/out-of-range sampling and conflicting snapshots are rejected.
  expected_results:
    - All three actual endpoints distinguish absence, disabled, automatic and concrete controls while preserving original successful stream contracts and model parameters.
    - Invalid or contradictory overrides fail at the API boundary before runtime mutation.
  forbidden_side_effects:
    - Only explicitly selected provider-scale sampling enters runtime or history; no global model configuration mutation.
    - Invalid requests never call a provider, mutate a draft or silently replace an explicit model.
  contract:
    protocol: HTTP JSON request with existing SSE success and preflight JSON errors
    method: POST
    endpoint: /api/agent/run; /api/agent/nl2agent/run; /api/skills/nl2skill/run
    request_expectations: [Preserve existing payload fields and route-specific schemas, Optional NL2 overrides have no implicit false or low values, Resource snapshots never duplicate model preferences, Sampling overrides preserve optionality and explicit zero]
    response_expectations: [Valid requests retain existing 200 stream format, Invalid reasoning fields or conflicting controls return 422 before streaming]
  execution:
    profiles: [{name: mock, required_services: [http-fixture]}]
  acceptance:
    - id: AC-01
      description: Canonical and partial requests preserve presence-aware semantics across all three routes.
      steps: [1, 2, 3]
      expected_results: [1]
      forbidden_side_effects: [1]
    - id: AC-02
      description: Invalid overlays are rejected before provider execution or writes.
      steps: [4]
      expected_results: [2]
      forbidden_side_effects: [2]
