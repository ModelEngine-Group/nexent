    - 断言 tools 为根 Agent 快照中工具显示名列表（优先取 origin_name，回退 name），元素均为非空字符串。
    - 断言 icon_url 与创建 listing 提交的卡片字段一致；downloads 为按 agent_id 聚合的下载总数（无下载时为 0）。
