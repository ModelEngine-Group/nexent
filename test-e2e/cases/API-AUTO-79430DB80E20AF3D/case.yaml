      版本发布/申请 listing 流程创建一条带唯一 RunID 的仓库 listing（含 icon_url、tags、content 卡片字段），记录 agent_repository_id、agent_id
      与发布版本快照。先发布版本，再经 POST /repository/agent/{agent_id}/versions/{version_no}/icon 上传用例拥有的仓库图标，使用返回的 icon_url 创建 listing，不使用普通 Agent 图标 URL。
    - 调用 GET /repository/agent/{agent_repository_id} 真实详情接口，记录 HTTP 状态码与完整响应 JSON。
