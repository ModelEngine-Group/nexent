    - frontend/public/locales（内置回退目录，测试中只读参照）'
  assertions:
  - FILE_UPLOAD_SIZE_LIMIT 未设置时注入默认 10；合法整数按 10-100 钳制（150→100、5→10）；非整数（abc）回退 10。
  - ensureDir 递归创建缺失目录，对已存在目录调用不失败。
  - readLocaleConfig 在可配置目录缺失 custom.json 时回退内置 public/locales，二者皆缺失返回 {}；JSON 解析异常返回 {} 且不抛异常、不返回 undefined。
  - saveLocaleConfig 自动创建语言子目录并写入 custom.json，返回 "custom.json"，写读一致。
  - 全程无未处理异常、不产生半写入或重复副作用，不向 public/locales 写入产物，日志不含敏感信息。
