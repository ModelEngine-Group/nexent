  contract:
    protocol: HTTP JSON; preserve router prefix
    request_expectations:
    - 按三类型读取/reviews/{resource_type}/{review_id}；提交后编辑源资源
    - 逐类型POST decision：approve/reject分别输入省略reason、空白、trim后1000和1001字符、非法decision/缺review_id
    - 请求未登录、无权限、授权范围不存在、非pending或review_id过期的记录
    - 在隔离fixture内准备9007199254740992和9007199254740993两条同类型仓库记录并读取列表、详情及决策定位
    - 普通仓库用户打开本人待审/已审记录、审核资格用户打开本人记录和他人记录
    response_expectations:
    - 返回共享公共字段、revision、类型化resource_detail和allowed_actions；详情内容固定在本轮提交快照，MCP字段白名单有效；非待审无approve/reject/delete。
    - 可选意见空白→null；1000成功、1001及无效/缺轮次400；成功响应含新状态和revision；UTF-8按字符而非字节计数。
    - 按顺序返回401/403/404/409；仅合法pending和匹配待审申请可修改；旧接口错误响应维持旧契约。
    - 新JSON review_id为原始十进制字符串；列表key/URL/详情操作不会因JS Number精度合并两条记录；旧接口字段类型不变。
    - 无审核资格仅可读本人快照/进度/意见，不授予决策；有审核资格能读取授权范围内本人和他人，按钮及操作按原有资格/状态/轮次，不新增提交人不等条件。
