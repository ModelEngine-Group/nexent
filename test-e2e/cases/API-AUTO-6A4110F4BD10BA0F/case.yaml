    legacy_row: 497
  contract:
    protocol: V5 protocol contract
    request_expectations:
    - 读取 backend/consts/error_code.py，定位 ErrorCode.KNOWLEDGE_DELETE_BLOCKED 枚举成员，断言其值为保留前导零的 6 位字符串 "060109"。
    - 继续读取同文件 ERROR_CODE_HTTP_STATUS 字典，断言 ErrorCode.KNOWLEDGE_DELETE_BLOCKED 键映射的 HTTP 状态码为 409。
    - 读取 backend/consts/error_message.py，断言 ErrorCode.KNOWLEDGE_DELETE_BLOCKED 存在默认英文错误消息 "Knowledge base deletion is blocked
      while files are being processed."。
    - 读取 backend/consts/exceptions.py 中 AppException.http_status 属性，断言其返回 ERROR_CODE_HTTP_STATUS.get(self.error_code, 500)，即该错误码取
      409 而非默认 500。
    - 读取 frontend/const/errorCode.ts，断言 KNOWLEDGE_DELETE_BLOCKED 常量为 "060109"，与后端字符串完全一致。
    - 校验该错误码在 HTTP 状态映射中无重复冲突、前端 ErrorCode 常量键值唯一，且校验过程与日志不泄露 API Key/Token/Password。
    response_expectations:
    - 后端 ErrorCode.KNOWLEDGE_DELETE_BLOCKED 与前端 ErrorCode.KNOWLEDGE_DELETE_BLOCKED 均为 "060109"，前后端错误码字符串完全一致。
    - 该错误码在 ERROR_CODE_HTTP_STATUS 中映射为 409，经 AppException.http_status 返回 409 而非默认 500。
    - error_message.py 为 060109 提供默认英文错误消息，错误码与消息一一对应。
    - 测试过程无未处理异常，日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
