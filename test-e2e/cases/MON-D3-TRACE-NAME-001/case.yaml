schema_version: '1.0'
stage: D3
module: V5-BASELINE
case:
  case_id: MON-D3-TRACE-NAME-001
  feature_id: F-169
  business_rule_ids: [F-169-RULE-02]
  title: Consistent main Agent trace name through real Langfuse ingestion
  type: INTEGRATION
  priority: P1
  status: blocked
  automation: manual
  objective: Verify the same new trace ID remains under its main Agent name during and after incremental ingestion and never matches the empty-name filter.
  preconditions:
  - A disposable deployment contains the current producer fix and exports through its real Collector to Langfuse.
  - An approved controlled Agent/provider profile can produce a model span and a child tool or subagent span before the main run finishes.
  - The operator has access to the isolated test project and uses synthetic non-patient input with a unique run_id.
  test_data:
    input: A harmless controlled task containing run_id; no production or patient data.
    agent_name: A unique Chinese main Agent display name containing run_id.
    timing: Keep the controlled run open after its first child span ends, for at least two configured export intervals.
  steps:
  - order: 1
    action: Start the controlled named Agent call via the real Nexent runtime and record its trace ID after the first child batch arrives in Langfuse.
    expected: There is one execution and one trace ID; received child observations carry the main Agent trace name while retaining their own node names.
  - order: 2
    action: While the main run is open, use the exact main-name filter and the empty-name filter and inspect that trace ID in each result.
    expected: The main-name filter matches the new trace ID and the empty-name filter does not; detail names agree with the list.
  - order: 3
    action: Complete the call, wait for all observations to ingest, and repeat both filters plus the trace detail inspection.
    expected: The same trace ID remains correctly named, HTTP/root/model/tool parentage is retained, and the controlled expected answer is returned once.
  - order: 4
    action: Record sanitized trace IDs, observed names, timestamps and screenshots of both filters, excluding prompt bodies and credentials.
    expected: Evidence distinguishes this new call from historical unnamed records and documents the deployed product revision and Langfuse version.
  expected_results:
  - Early and final ingestion retain the main Agent trace name for the same trace ID.
  - The empty-name filter never matches the newly observed trace; named-filter and detail results agree.
  - Child identities, parentage and business output remain correct without duplicate execution.
  forbidden_side_effects:
  - Do not delete or rewrite historical traces, modify telemetry filters, expose credentials or submit production/patient data.
  integration_boundary:
  - Running Nexent HTTP service and SDK workers -> real OTLP Collector -> Langfuse ingestion and name-filter queries.
  observations:
  - Product revision, Langfuse version, one trace ID, early/final names, filter results, observation tree and controlled business answer.
  cleanup:
  - Release controlled provider holds and temporary run resources through their normal lifecycle; retain test-project traces for evidence under its existing retention policy.
