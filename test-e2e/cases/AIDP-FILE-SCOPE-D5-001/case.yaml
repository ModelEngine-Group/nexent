    ],
    "title": "Invalid filters, revoked access and graph retrieval fail closed",
    "type": "SECURITY",
    "priority": "P0",
    "status": "blocked",
    "automation": "manual",
    "objective": "Prove that an enabled filter with no usable condition, revoked knowledge-base access, an unsupported retrieval method (graph) or an upstream rejection never falls back to an unfiltered full-KB search and never exposes out-of-scope results.",
    "preconditions": [
      "A test user with revocable AIDP KB permissions and a graph-enabled Agent."
    ],
    "test_data": {
      "profile": "mock",
      "revoked": "remove READ permission between runs",
      "graph": "vector_search plus graph_search"
    },
    "steps": [
      {
        "order": 1,
        "action": "Enable the filter with no value through a direct API call.",
        "expected": "The request is rejected or the tool fails closed; no unfiltered search runs."
      },
      {
        "order": 2,
        "action": "Revoke KB READ after a filter was saved and run again.",
        "expected": "No search runs against the revoked KB; the response is a readable failure."
      },
      {
        "order": 3,
        "action": "Run a graph-enabled Agent with the filter enabled.",
        "expected": "No FusionSearch request is sent; a readable denial is returned."
      },
      {
        "order": 4,
        "action": "Make AIDP reject the condition.",
        "expected": "The tool fails closed; no unfiltered retry occurs."
      }
    ],
    "expected_results": [
      "No unfiltered fallback",
      "No out-of-scope results",
      "Readable failures without credentials"
    ],
    "forbidden_side_effects": [
      "Do not widen to all KBs",
      "Do not retry without the filter",
      "Do not expose upstream secrets"
    ],
    "unit_boundary": "conversation scope + AidpSearchTool fail-closed paths",
    "inputs": [
      "empty condition",
      "revoked permission",
      "graph method",
      "upstream rejection"
    ],
    "assertions": [
      "no request or denial",
      "no unfiltered fallback"
    ],
    "acceptance": [
      {
        "id": "AC-01",
        "description": "Empty condition",
        "steps": [
          1
        ],
        "expected_results": [
          1
        ],
        "forbidden_side_effects": [
          1,
          2
        ]
      },
      {
        "id": "AC-02",
        "description": "Revoked access",
        "steps": [
          2
        ],
        "expected_results": [
          2
        ],
        "forbidden_side_effects": [
          1,
          3
        ]
      },
      {
        "id": "AC-03",
        "description": "Graph and upstream rejection",
        "steps": [
          3,
          4
        ],
        "expected_results": [
          3
        ],
        "forbidden_side_effects": [
          2,
          3
        ]
      }
    ],
    "risk_type": "SECURITY",
    "metrics": [
      "Number of FusionSearch requests with a missing filter when it should fail closed, unfiltered fallbacks after failure, out-of-scope records, and credential occurrences in output or logs."
    ],
    "thresholds": [
      "Zero unfiltered or out-of-scope requests; zero out-of-scope records shown to the model or user; zero credential occurrences."
    ],
    "recovery_expectations": [
      "The conversation stays usable after the user fixes the filter, restores permissions or disables graph retrieval; a readable status explains the safe failure and no retry silently widens the scope."
    ],
    "risk": "A user applying a file-name filter could unknowingly trigger a full-knowledge-base search when the filter is enabled but not effective, exposing unrelated content to the model and answer, or credentials could leak through error handling.",
    "condition": [
      "Model-generated tool arguments, sub-Agent tool instances, permission changes between turns, graph-enabled retrieval and upstream rejection of the condition."
    ]
