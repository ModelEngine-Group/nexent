  objective: 列表/来源过滤/availability/detail/refresh/delete｜异常/边界/越权
  preconditions:
  - Nexent本地服务与A2A Mock就绪，无其他故障注入批次。
  - config/a2a.yaml符合仓库Schema；控制令牌从配置引用的环境变量或secrets.env读取。
  - 使用本次唯一source URL与动态资源ID，不借用历史Agent。
  test_data:
    configuration: config/a2a.yaml
    mock_service: a2a-agent
  steps:
  - order: 1
    action: 在租户A发现本次唯一URL的受控Agent
    expected: 取得仅归租户A的动态资源ID
  - order: 2
    action: 租户B查询列表及详情
    expected: 列表不包含本次Agent，详情404
  - order: 3
    action: 租户B尝试刷新和删除
    expected: 刷新400并明确not found，删除404；未产生额外外部请求，租户A资源仍存在
  - order: 4
    action: 租户A删除本次Agent并回读
    expected: 回读404，无本次资源残留
  expected_results:
  - 取得仅归租户A的动态资源ID
  - 列表不包含本次Agent，详情404
  - 刷新400并明确not found，删除404；未产生额外外部请求，租户A资源仍存在
  - 回读404，无本次资源残留
