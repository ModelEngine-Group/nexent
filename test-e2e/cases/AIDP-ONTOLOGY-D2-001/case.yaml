schema_version: "1.0"
stage: D2
module: AIDP-KNOWLEDGE
case:
  case_id: AIDP-ONTOLOGY-D2-001
  feature_id: AIDP-ONTOLOGY
  business_rule_ids: [AIDP-ONTOLOGY-RULE-01, AIDP-ONTOLOGY-RULE-02, AIDP-ONTOLOGY-RULE-03, AIDP-ONTOLOGY-RULE-04]
  title: Ontology domain, entity, binding and JSON HTTP contracts
  type: API-IT
  priority: P0
  status: active
  automation: automated
  objective: >-
    Prove the Nexent HTTP contract for ontology CRUD, binding cardinality, shared entity counts, chunk read/annotation and import/export responses.
  preconditions:
    - The ontology router is mounted with substituted authentication, role and KB-permission boundaries; upstream calls are replaced by an in-memory fake.
  test_data:
    profile: mock
    data: "logical fixtures for AIDP-ONTOLOGY-D2-001"
  steps:
    - order: 1
      action: >-
        List and mutate ontology domains and entities.
      expected: >-
        Responses use domain_id/name/description/bound_kb_count and optional counts; list accepts search and uses total for pagination; invalid bytes, Type parent and immutable PATCH fields are rejected.
    - order: 2
      action: >-
        Bind one KB twice, bind an already-bound KB to another ontology and unbind.
      expected: >-
        Same ontology is idempotent; a different ontology returns 409; unbind removes only the target binding.
    - order: 3
      action: >-
        Exercise metadata fields, chunk list/detail/batch annotation and export/import.
      expected: >-
        The 20-field limit, defined keys/types, per-chunk results, sync counts, async task acknowledgment and filename are returned without fabricated results.
  expected_results:
    - Entity rows all report the owning ontology's bound_kb_count.
    - Ontology domain IDs are numeric at the AIDP boundary; non-numeric proxy paths are rejected.
    - List uses page/page_size/search; total is the filtered record total.
    - Missing optional counts/audit fields stay null; zero bindings remain 0.
    - One KB cannot bind two ontologies.
    - Import/export responses distinguish sync results from async acceptance.
  forbidden_side_effects:
    - Do not write ontology state to the Nexent database.
    - Do not forward the browser to AIDP or expose credentials.
  unit_boundary: FastAPI router with service boundary substituted
  inputs:
    - HTTP JSON requests
    - fake ontology store
  assertions:
    - Status codes and envelopes match the documented contract.
    - Invalid input never reaches the upstream service.
    - Sync and async results are distinct.
  acceptance:
    - id: AC-01
      description: >-
        Ontology, binding, chunk, metadata and JSON routes follow the documented contract.
      steps: [1, 2, 3]
      expected_results: [1, 2, 3, 4, 5, 6]
      forbidden_side_effects: [1, 2]
  contract:
    protocol: HTTP JSON
    method: GET/POST/PATCH/DELETE
    endpoint: /aidp-mgmt/ontology/*
    request_expectations:
      - Domain and entity bodies use snake_case fields and UTF-8 byte limits.
      - The ontology list query carries search, not keyword.
      - Binding bodies carry one kds_id; chunk metadata bodies carry domain_id, metadata and chunk_ids.
    response_expectations:
      - Lists return value, total_count, has_more and total_reliable; entity rows carry bound_kb_count.
      - Sync import/export results and async task acknowledgments are distinct and errors remain readable.
