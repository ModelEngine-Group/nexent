  case_id: UT-FE-AUTO-BA4BBC902BC06BE6
  feature_id: F-111
  business_rule_ids:
  - F-111-RULE-01
  title: AIDP 创建、更新与导入组件的当前流程
  type: FE-COMP
  priority: P0
  status: active
  automation: automated
  objective: AIDP 创建、更新与导入组件的当前流程
  preconditions:
  - 组件测试环境及产品前端依赖可用；不需要 AIDP 服务、数据库或真实模型。
  - 使用独立 QueryClient、浏览器存储和受控 HTTP/XHR；模拟时钟代替真实上传与轮询等待。
  test_data:
    source_role:
    - direct_input
    trace: 用户确认的 AIDP 创建、列表、导入及文件列表验收；2026-10-12 D1 补充审核
    data: 模型混合目录、两种语言及领域模板、不同权限知识库、有限文件数据和错误响应
  steps:
  - order: 1
    action: 提交空表单；以 USER 和管理角色填写名称描述，切换组内权限并提交。
    expected: 必填错误不发请求；USER 提交 PRIVATE 和空用户组，共享权限未选用户组时不能提交，选组后提交对应权限。
  - order: 2
    action: 加载混合模型目录，开启图谱，切换语言与领域，修改提示词并恢复默认；开启 VLM 后提交。
    expected: 按模型类型分类；提示词使用接口完整模板；提交模型标识、图谱设置与表单一致，is_personal 固定为 0。
  - order: 3
    action: Top K 输入 1.5 后失焦；关闭图谱与 VLM；在创建请求未返回时重复点击提交，再返回成功。
    expected: Top K 显示并提交整数 2；默认切片 512、重叠 51；关闭项不提交有效模型或图谱配置；只创建一次并导航至新知识库文件页。
  - order: 4
    action: 返回无 VLM 的模型目录，开启 VLM 后尝试提交；另以完整模型目录提交并返回业务错误。 同时返回模型/模板接口错误。
    expected: 无 VLM 时不虚构模型，不创建；创建业务错误展示翻译，失败不导航。 模型/模板加载失败显示业务错误并阻止创建。
  - order: 5
    action: 打开 metadata 或 permissions 更新模式，分别确认无变化、修改名称、修改权限、返回 metadata_status=failed。
    expected: 无变化不请求；修改只附带变化的元数据；PRIVATE 清空组；元数据失败保留原名称描述并提示。
  - order: 6
    action: 选择合法文件，以受控 XHR 发进度，再返回部分成功；另返回有业务码与纯文本错误。
    expected: 发送 files multipart 且不手工设置 Content-Type；进度环随进度变化，上传中不能关闭；成功保留大小；失败原因位于文件行，有码显示翻译、无码显示接口原因。
  - order: 7
    action: 同批选择重复文件、非法类型和 json/md/html 的 20 MiB 边界文件，再选择 51 个小文件。
    expected: 重复文件不重复上传；非法类型与超限文件留在失败行；三种扩展名恰好 20 MiB 可上传、超过 1 字节不上传；超过 50 个的文件不进入批次。
  expected_results:
  - 必填错误不发请求；USER 提交 PRIVATE 和空用户组，共享权限未选用户组时不能提交，选组后提交对应权限。
  - 按模型类型分类；提示词使用接口完整模板；提交模型标识、图谱设置与表单一致，is_personal 固定为 0。
  - Top K 显示并提交整数 2；默认切片 512、重叠 51；关闭项不提交有效模型或图谱配置；只创建一次并导航至新知识库文件页。
  - 无 VLM 时不虚构模型，不创建；创建业务错误展示翻译，失败不导航。 模型/模板加载失败显示业务错误并阻止创建。
  - 无变化不请求；修改只附带变化的元数据；PRIVATE 清空组；元数据失败保留原名称描述并提示。
  - 发送 files multipart 且不手工设置 Content-Type；进度环随进度变化，上传中不能关闭；成功保留大小；失败原因位于文件行，有码显示翻译、无码显示接口原因。
  - 重复文件不重复上传；非法类型与超限文件留在失败行；三种扩展名恰好 20 MiB 可上传、超过 1 字节不上传；超过 50 个的文件不进入批次。
  forbidden_side_effects:
  - 不得请求实际 AIDP、数据库、模型或修改用户的部署数据。
  unit_boundary: 真实页面/表单、查询 hooks、React Query 缓存和前端服务层协作；仅替换外部身份、路由与 HTTP/XHR 边界。
  inputs:
  - case-local 受控响应与内存文件
  assertions:
  - 必填错误不发请求；USER 提交 PRIVATE 和空用户组，共享权限未选用户组时不能提交，选组后提交对应权限。
  - 按模型类型分类；提示词使用接口完整模板；提交模型标识、图谱设置与表单一致，is_personal 固定为 0。
  - Top K 显示并提交整数 2；默认切片 512、重叠 51；关闭项不提交有效模型或图谱配置；只创建一次并导航至新知识库文件页。
  - 无 VLM 时不虚构模型，不创建；创建业务错误展示翻译，失败不导航。 模型/模板加载失败显示业务错误并阻止创建。
  - 无变化不请求；修改只附带变化的元数据；PRIVATE 清空组；元数据失败保留原名称描述并提示。
  - 发送 files multipart 且不手工设置 Content-Type；进度环随进度变化，上传中不能关闭；成功保留大小；失败原因位于文件行，有码显示翻译、无码显示接口原因。
  - 重复文件不重复上传；非法类型与超限文件留在失败行；三种扩展名恰好 20 MiB 可上传、超过 1 字节不上传；超过 50 个的文件不进入批次。
