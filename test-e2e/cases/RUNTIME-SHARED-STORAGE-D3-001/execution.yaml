notes: >-
  Self-contained storage preparation in the enabled machine-local cluster:
  the case creates and removes its own namespace, product services, data domain,
  and dynamically provisioned volumes, without switching the default test stack.
  The case also owns a secretless model Pod and an internal Service. Independent
  barriers hold two real Agent Runs. The test lets A finish and remove its own
  workspace, checks B and the unrelated files, then replaces A while B remains
  active. Both Runs must produce the correct artifact, enforce download access,
  and clean up their own objects and conversations. Multi-worker verification
  still requires the enabled dedicated cluster.
