  - 失败路径返回明确错误，不出现半写入、重复副作用或跨租户泄露。
  - 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
  - 真实模型调用成功，stream/Agent run 正常结束；自然语言只做稳定关键词/结构/工具调用断言。
  - 固定测试 marker 对应文档进入期望 Top-K/Top-N，向量维度和模型绑定正确。
  - 外部 provider 搜索超时/5xx/畸形响应时仅记录 external_search_hook failed 警告日志，本地上下文仍注入该 marker，不因外部失败阻断本地检索结果；外部 provider 写入 ingest 超时/5xx/畸形响应时仅记录
    external_memory_ingest_failed 日志，本地 memory record 仍写入成功且后续可读。
  - external_provider_top_k 配置边界：合法 1/100 成功持久化，越界 0/101 返回 400，非整数返回 406，且不影响既有记忆开关/共享策略配置。
  cleanup:
