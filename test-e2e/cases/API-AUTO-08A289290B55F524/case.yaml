schema_version: '1.0'
stage: D2
module: V5-BASELINE
case:
  case_id: API-AUTO-08A289290B55F524
  feature_id: F-185
  business_rule_ids:
  - F-185-RULE-01
  title: Agent 图标上传/读取契约：内容类型白名单、2MB上限、EDIT权限约束、非法/缺失图标错误与icon_url写回｜核心流程与异常/边界/越权
  type: API-IT
  priority: P1
  status: active
  automation: automated
  objective: Agent 图标上传/读取契约：内容类型白名单、2MB上限、EDIT权限约束、非法/缺失图标错误与icon_url写回｜核心流程与异常/边界/越权
  preconditions:
  - 独立测试运行时可导入实际 Agent service 和 icon_storage。
  - 内存 Agent/数据库写回及存储边界替身，不连接真实 MinIO/PostgreSQL，也不需要预置 Agent ID。
  - 按内容签名构造图片字节及非法边界；不是图像解码质量验证。
  test_data:
    image_formats:
    - PNG
    - JPEG
    - GIF
    - WebP
    invalid_inputs:
    - empty
    - over-2-MB
    - invalid-signature
    permissions:
    - EDIT
    - READ_ONLY
    - system-agent
  steps:
  - order: 1
    action: 调用 upload_agent_icon_impl(agent_id, png_bytes, tenant_id, user_id)，传入有效 PNG 内容，记录返回值。
    expected: '上传有效 PNG 返回 {"icon_url": "/api/agent/{agent_id}/icon?v=<UUID>", "content_type": "image/png"}，测试过程无未处理异常。'
  - order: 2
    action: 分别用有效 JPEG/GIF/WebP 内容重复调用，记录各次返回的 content_type 与 icon_url。
    expected: JPEG/GIF/WebP 分别返回 content_type 为 image/jpeg、image/gif、image/webp，icon_url 均形如 /api/agent/{agent_id}/icon?v=<UUID>。
  - order: 3
    action: 传入空内容（b""）调用，捕获并记录异常类型与消息。
    expected: 空内容抛出 ValueError，消息为 "Icon file is empty"，不产生图标写入。
  - order: 4
    action: 传入超过 2MB 的图片内容调用，捕获并记录异常类型与消息。
    expected: 超 2MB 内容抛出 ValueError，消息为 "Icon must not exceed 2 MB"。
  - order: 5
    action: 传入非法类型文件内容（如 .txt 字节）调用，捕获并记录异常类型与消息。
    expected: 非法类型内容抛出 ValueError，消息为 "Icon must be a PNG, JPEG, GIF, or WebP image"。
  - order: 6
    action: 以无 EDIT 权限的账号（如 UserB 对非其创建的 Agent）传入合法 PNG 调用，捕获并记录异常类型与消息。
    expected: 无 EDIT 权限抛出 ForbiddenError，消息为 "You do not have permission to edit this agent"，且不产生图标写入。
  - order: 7
    action: 上传成功后调用 get_agent_icon_impl(agent_id, tenant_id, user_id)，校验返回字节与 content_type。
    expected: get_agent_icon_impl 返回的字节内容与上传内容一致，content_type 与上传时一致。
  - order: 8
    action: 对一个 icon_url 为空的 Agent 调用 get_agent_icon_impl，捕获并记录异常类型与消息。
    expected: icon_url 为空时抛出 FileNotFoundError，消息为 "Agent icon not found"。
  - order: 9
    action: 上传成功后读取 agent 详情（get_agent_info_impl），校验 icon_url 写回结果。
    expected: 上传成功后 agent 记录 icon_url 写回为 /api/agent/{agent_id}/icon?v=<UUID>。
  - order: 10
    action: 系统 Agent 上传合法图标；模拟存储上传失败。
    expected: ForbiddenError 或上传 ValueError，均不写回数据库。
  - order: 11
    action: 图标 URL 非空但存储对象缺失或非法，调用读取函数。
    expected: FileNotFoundError（Icon not found / Icon is invalid）。
  expected_results: &id001
  - '上传有效 PNG 返回 {"icon_url": "/api/agent/{agent_id}/icon?v=<UUID>", "content_type": "image/png"}，测试过程无未处理异常。'
  - JPEG/GIF/WebP 分别返回 content_type 为 image/jpeg、image/gif、image/webp，icon_url 均形如 /api/agent/{agent_id}/icon?v=<UUID>。
  - 空内容抛出 ValueError，消息为 "Icon file is empty"，不产生图标写入。
  - 超 2MB 内容抛出 ValueError，消息为 "Icon must not exceed 2 MB"。
  - 非法类型内容抛出 ValueError，消息为 "Icon must be a PNG, JPEG, GIF, or WebP image"。
  - 无 EDIT 权限抛出 ForbiddenError，消息为 "You do not have permission to edit this agent"，且不产生图标写入。
  - get_agent_icon_impl 返回的字节内容与上传内容一致，content_type 与上传时一致。
  - icon_url 为空时抛出 FileNotFoundError，消息为 "Agent icon not found"。
  - 上传成功后 agent 记录 icon_url 写回为 /api/agent/{agent_id}/icon?v=<UUID>。
  - 四次成功上传的 UUID 版本均不同，数据库精确写回返回 URL；系统 Agent、无权限和存储失败不写入。
  - 缺失或非法存储内容返回 FileNotFoundError。
  forbidden_side_effects: []
  source:
    legacy_workbook_sha256: aa4b32414d30f12b3b64e14236268145e556bd7cfc5d3eb8df80731608ebc022
