    legacy_row: 487
  contract:
    protocol: Python service contract with real storage validation
    request_expectations:
    - 调用 upload_agent_icon_impl(agent_id, png_bytes, tenant_id, user_id)，传入有效 PNG 内容，记录返回值。
    - 分别用有效 JPEG/GIF/WebP 内容重复调用，记录各次返回的 content_type 与 icon_url。
    - 传入空内容（b""）调用，捕获并记录异常类型与消息。
    - 传入超过 2MB 的图片内容调用，捕获并记录异常类型与消息。
    - 传入非法类型文件内容（如 .txt 字节）调用，捕获并记录异常类型与消息。
    - 以无 EDIT 权限的账号（如 UserB 对非其创建的 Agent）传入合法 PNG 调用，捕获并记录异常类型与消息。
    - 上传成功后调用 get_agent_icon_impl(agent_id, tenant_id, user_id)，校验返回字节与 content_type。
    - 对一个 icon_url 为空的 Agent 调用 get_agent_icon_impl，捕获并记录异常类型与消息。
    - 上传成功后读取 agent 详情（get_agent_info_impl），校验 icon_url 写回结果。
    - 系统 Agent 上传合法图标；模拟存储上传失败。
    - 图标 URL 非空但存储对象缺失或非法，调用读取函数。
    response_expectations: *id001
