  actor: Nexent browser user
  journey:
  - 从页面顶部连续Tab，确认焦点进入导航和内容。
  - Agents页仅用Enter/Space打开安全的选择器/弹窗。
  - 用Tab在弹窗输入/按钮移动，确认焦点不逃逸背景。
  - 按Escape关闭，焦点返回触发元素。
  - Models页重复一个表单Dialog。
  - newchat键盘聚焦Composer、输入文本、Tab到发送并触发短消息。
  - 检查关键交互元素有可读accessible name。
  final_business_result:
  - 主要交互键盘可达。
  - Dialog焦点管理正确。
  - 发送可键盘触发。
