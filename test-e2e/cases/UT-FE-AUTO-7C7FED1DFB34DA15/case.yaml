  assertions:
  - 功能结果与代码契约一致，测试过程无未处理异常。
  - 点击 [[a1]] 后右侧面板打开、对应来源卡进入 selected 选中态并滚动定位、检索词 <mark> 高亮，与源码行为一致。
  - ENABLE_CITATION_CLICK_HIGHLIGHT=false 时仅定位不高亮：选中与滚动定位不受开关影响，回答上下文句子级高亮被关闭。
  - 不发起真实模型/公网请求，日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
