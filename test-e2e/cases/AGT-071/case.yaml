    legacy_row: 385
  integration_boundary:
  - REAL_REQUIRED：使用 secrets.env 配置的真实外部记忆 Provider 与 models.yaml 的真实 LLM。
  observations:
  - 真实写入和检索成功。
  - Agent trace 显示外部记忆命中。
  - 热更新只影响后续运行。
  - 故障有明确 provider 错误且本地记忆仍按契约工作。
  cleanup:
  - JUnit、run_id、stream/tool/retrieval trace、脱敏模型快照。
