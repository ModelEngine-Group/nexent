schema_version: '1.0'
stage: D5
module: CHAT-UI
case:
  feature_id: F-115
  business_rule_ids:
    - F-115-RULE-02
  priority: P1
  status: active
  automation: automated
  preconditions:
    - An isolated Next.js frontend is running; all test API calls are intercepted by the browser fixture.
  test_data:
    sources: 300
    attributes_per_source: 30
    profiles:
      - aidp
      - es-shaped-frontend
  forbidden_side_effects:
    - >-
      Do not access or mutate existing DEV backend data; do not truncate sources or change citation
      identities.
  case_id: PERF-SOURCES-300
  title: 300-source chat interaction latency
  type: PERFORMANCE
  objective: Measure painted interaction latency, long tasks, layout and transport calls on a warmed real chat page.
  steps:
    - order: 1
      action: >-
        Warm the page and repeat the source journey seven times, collecting browser timing and a
        representative CPU trace.
      expected: Each operation completes; P50/P95, maximum long task, layout and script time are recorded.
  expected_results:
    - >-
      No lost sources or failed metadata interactions; source-open P95 is below 500 ms, citation-switch P95
      below 150 ms, and all operations below 5000 ms on the recorded local fixture.
  risk_type: PERFORMANCE
  risk: Bulk metadata mounting blocks source inspection.
  condition:
    - 300 sources with 30 metadata fields and 101 answer citations; warmed frontend compilation.
  metrics:
    - Painted operation P50/P95, maximum long task, layout/script duration, API count.
  thresholds:
    - Source-open P95 < 500 ms; citation-switch P95 < 150 ms; all measured operations < 5000 ms.
  recovery_expectations:
    - >-
      Closing and reopening the panel remains functional; browsers and test-owned servers can be stopped
      cleanly.
  acceptance:
    - id: AC-01
      description: Record repeated measurements and enforce the declared latency thresholds.
      steps:
        - 1
      expected_results:
        - 1
      forbidden_side_effects:
        - 1
