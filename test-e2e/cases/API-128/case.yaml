  contract:
    protocol: HTTP API
    request_expectations:
    - 启动完整本地 Scheduler/Worker/DB 环境，并使用 config/environment.yaml 中的测试时区和短周期参数。
    - 准备真实测试 Agent 与 LLM 配置；创建任务时使用唯一名称和可在数分钟内完成的 Once/Interval/Cron 表达式。
    - 按“max_fire_count/end_at/misfire/restart/recovery｜核心流程”通过实际 API 创建/更新/暂停/恢复/立即执行任务，记录 task_id、schedule、next_run_at。
    - 等待或主动触发真实 scheduler tick，不通过直接改最终状态绕过调度器。
    - 查询 task run 历史、fire_count、failure_count、lock/worker 状态和 Agent run_id，确认状态机迁移正确。
    - 并发/失败场景使用可控 Test Agent/服务制造慢执行、500 或 timeout，检查重试、SKIPPED、锁释放和自动暂停。
    - 时间语义检查统一以配置时区解析，记录实际触发时间与期望时间偏差。
    - 删除任务并确认不再触发，清理对应会话/运行记录。
    response_expectations:
    - 功能结果与代码契约一致，测试过程无未处理异常。
    - 关键状态在 API 返回、数据库/存储和后续读取中保持一致。
    - 失败路径返回明确错误，不出现半写入、重复副作用或跨租户泄露。
    - 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
