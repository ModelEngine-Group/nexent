schema_version: '1.0'
stage: D4
module: AGENT-EDITOR
case:
  case_id: AGENT-EDITOR-D4-002
  feature_id: AGENT-EDITOR-WORKFLOWS
  requirement_ids:
  - AGENT-EDITOR-REQ-002
  business_rule_ids:
  - AGENT-EDITOR-RULE-002
  title: Retry creation after a rejected save without losing input
  type: E2E
  priority: P1
  status: active
  automation: automated
  objective: A controlled creation failure preserves user input; retry creates one
    persisted Agent, with exactly two requested attempts and no automatic extra creation.
  preconditions:
  - A running frontend is reachable; deterministic existing HTTP fixtures isolate
    Agent data, authorization and model/resource boundaries.
  test_data:
    profile: mock
    locale: zh
    viewport:
      width: 1920
      height: 1080
  steps:
  - order: 1
    action: Submit a valid name while the creation endpoint returns a controlled rejection.
    expected: The creation dialog retains the typed name and stays on the list.
  - order: 2
    action: Retry after the endpoint becomes available.
    expected: The second attempt succeeds and enters the created Agent editor.
  - order: 3
    action: Reload the created editor.
    expected: The persisted title remains; creation is not silently repeated.
  expected_results:
  - A controlled creation failure preserves user input; retry creates one persisted
    Agent, with exactly two requested attempts and no automatic extra creation.
  forbidden_side_effects:
  - No unrelated writes, publication or Agent/model execution; only explicitly requested
    creation/autosave writes are allowed.
  actor: Authorized Agent development user
  journey:
  - Submit a valid name while the creation endpoint returns a controlled rejection.
  - Retry after the endpoint becomes available.
  - Reload the created editor.
  final_business_result:
  - A controlled creation failure preserves user input; retry creates one persisted
    Agent, with exactly two requested attempts and no automatic extra creation.
  failure_evidence:
  - Fixed Playwright journey assertions, sanitized request payloads and terminal audit.
  acceptance:
  - id: AC-01
    description: A controlled creation failure preserves user input; retry creates
      one persisted Agent, with exactly two requested attempts and no automatic extra
      creation.
    steps:
    - 1
    - 2
    - 3
    expected_results:
    - 1
    forbidden_side_effects:
    - 1
