  AC-03:
  - test_trace_lookup_retention_reports_separate_archive_and_chat_coverage
  - test_trace_lookup_pg_history_keeps_incomplete_capture_visible
  AC-04:
  - test_trace_lookup_rechecks_committed_owner_and_preserves_other_conversations
