notes: >-
  Requires a configured PostgreSQL service that permits creation and removal
  of a UUID-owned scratch database. The test creates the relevant product
  tables, uses an owned temporary root, closes its HTTP client, and drains the
  managed read workers. The scratch database factory verifies ownership before
  dropping it. These selectors provide partial evidence for the blocked Case;
  see its source.blocked_reason for the remaining obligations.
