    blocked_reason: Backend conversation lookup, coverage and bounded chat reads are implemented, with controlled HTTP/file assertions in QUERY-D2. This independent Case still lacks its fixed script and binding; full PG-backed lookup acceptance is deferred by the user.
  execution:
    profiles:
    - name: mock
      required_services: []
  contract:
    protocol: HTTP/JSON
    endpoint: /trajectory/conversations/{conversation_id} and /trajectory/conversations/{conversation_id}/snapshot and /trajectory/conversations/{conversation_id}/contents/{content_id}
    method: GET
    request_expectations:
    - trace_id同值用作conversation_id路径参数；全部读取要求ADMIN/SU及可信租户/目标用户范围，ID不是访问凭证。
    - 聊天/轨迹使用各自有界快照游标；contents仅接受聊天正文与record的input/output/raw/reasoning。
    response_expectations:
    - 身份层级、分页字节限制、coverage和禁用能力符合设计“采集与身份”和“查询与自研展示”。
    - 过期后保留会话定位，不延长正文30天可读期。
    - 目录定位完成前不判未采集；查找预算耗尽返回503/lookup_unavailable。storage_agent_id固定且不代替当前最近Agent筛选。
