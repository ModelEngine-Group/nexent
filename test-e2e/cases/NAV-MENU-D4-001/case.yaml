  title: Preserve functional navigation while hiding inert controls
  type: E2E
  priority: P1
  status: active
  automation: automated
  objective: Verify sidebar visibility without changing existing navigation or access
    behavior.
  preconditions:
  - A reachable frontend is available; each scenario controls existing HTTP boundaries
    with deterministic authorized fixtures.
  test_data:
    profile: mock
    routes:
    - /agents
    - /newchat
    - /workbench
    - /agent-space
    locales:
    - zh
    - en
  steps:
  - order: 1
    action: Render/open the sidebar with authorized children in speed mode. Click
      chat and agent child menus; inspect account and notification controls.
    expected: Both inert section buttons are absent; authorized children remain and
      denied routes stay hidden. Localized pages open and only functional controls
      are available.
  - order: 2
    action: 'Enable workbench and grant Home and Chat routes; inspect both locales
      and click Workbench. Locale: zh'
    expected: Workbench appears immediately after Home with the requested localized
      label and opens the same localized /workbench route.
  - order: 3
    action: 'Enable workbench and grant Home and Chat routes; inspect both locales
      and click Workbench. Locale: en'
    expected: Workbench appears immediately after Home with the requested localized
      label and opens the same localized /workbench route.
  - order: 4
    action: Open a shared page outside agents/newchat, click account, inspect transferred
      entries, hover language and select English.
    expected: Global header/footer are absent. The account menu retains identity,
      profile, gated external links and locale navigation. Its width is256px with6px
      padding,60px identity and36px avatar. Primary rows are28px with default menu
      typography; link rows are24px with11px/16.5px text. The localized About header
      is22.5px with60% muted color and monospace version. Language icon, title, locale
      and chevron centers align within1px; the title aligns horizontally with Profile.
      Copyright is absent. Logout uses the reference destructive color and10% hover
      background and preserves confirmation. Profile, language setting and language-option
      hover match demo accent lab(94.1288% -2.23359 -10.9012); readonly About remains
      transparent and logout retains danger hover. Profile and language setting inherit
      default menu font family, size and line height; secondary About styling remains.
  - order: 5
    action: Inspect collapsed icons, hover sidebar, compare content position, inspect
      inline/truncated labels, pin and unpin the header control, leave and reopen
      account popup.
    expected: 'The unpinned rail expands from64px to240px without moving content.
      The expanded-only header control pins at240px and shrinks content; unpinning
      collapses to64px without immediate hover reopening. A0.5px right divider in
      #191919 at15% opacity remains visible in all states. Menu icons retain20px size
      and8px label gaps. The40px logo has a4px gap to the18px bold brand title, which
      truncates with a full-name tooltip. Header bottom spacing is8px. Selected navigation
      icons are #2673e5. Pin/PinOff, Sparkles and FolderCog identify pin, Skill and
      resource management. Pinned toggle is blue on transparent background. Popup
      holds expansion without profile-route prefetch requests; existing navigation
      and close behavior remain usable. Sidebar background matches lab(97.0939% -.108689
      -.749958); unselected hover uses70% sidebar accent and selected items use full
      lab(92.4476% -.214785 -1.49835) even on hover. Open account/notification triggers
      use selection.'
  expected_results:
  - Both inert section buttons are absent; authorized children remain and denied routes
    stay hidden. Chat navigates to localized newchat and child pages remain usable.
    Speed notification is absent and account control remains.
  - Enabled permitted workbench follows Home and precedes Start Chat; localized label
    is 工作台 / Workbench.
  - Enabled permitted workbench follows Home and precedes Start Chat; localized label
    is 工作台 / Workbench.
  - Account popup matches measured v0 compact geometry:256px width,6px padding,60px
    identity,28px primary,24px links,22.5px About header,11px secondary type and16.5px
    line height; copyright absent, logout destructive, language switching and visibility
    rules retained.
  - Hover expansion overlays content; the expanded-only header control pins and shrinks
    content, unpins and collapses without immediate hover reopening; localized navigation,
    popup usability and zero unsolicited profile-route requests are preserved.
  forbidden_side_effects:
  - No unrequested business writes or agent/provider execution.
  execution:
    profiles:
    - name: mock
      required_services: []
  actor: Authorized speed-mode user
  journey:
  - Open agent list
  - Inspect permitted menus and hidden placeholders
  - Open chat and return through agent menu
  final_business_result:
  - Existing agent list and new-chat pages remain reachable without inert section
    controls.
  failure_evidence:
  - Playwright failure screenshot and trace
  acceptance:
  - id: AC-01
    description: Verify sidebar visibility without changing existing navigation or
      access behavior.
    steps:
    - 1
    - 2
    - 3
    expected_results:
    - 1
    - 2
    - 3
    forbidden_side_effects:
    - 1
  - id: AC-02
    description: Account menu replaces global bars while retaining visibility policies,
      information and real language navigation.
    steps:
    - 4
    expected_results:
    - 4
    forbidden_side_effects:
    - 1
  - id: AC-03
    description: Hover overlays content, pinning resizes content, and unpinning collapses
      while preserving navigation and popup access. Verify18px brand,8px header gap,
      persistent divider, selected blue icons, specified pin/Skill/resource glyphs
      and secondary account typography. Verify40px logo and blue transparent pinned
      toggle; account popup uses compact grouped aligned layout.
    steps:
    - 5
    expected_results:
    - 5
    forbidden_side_effects:
    - 1
