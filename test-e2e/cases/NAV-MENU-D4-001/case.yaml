schema_version: '1.0'
stage: D4
module: NAV-MENU
case:
  case_id: NAV-MENU-D4-001
  feature_id: NAV-MENU-VISIBILITY
  requirement_ids:
  - NAV-MENU-REQ-001
  - NAV-MENU-REQ-002
  business_rule_ids:
  - NAV-MENU-RULE-001
  - NAV-MENU-RULE-002
  - NAV-MENU-RULE-003
  title: Preserve functional navigation while hiding inert controls
  type: E2E
  priority: P1
  status: active
  automation: automated
  objective: Verify sidebar visibility without changing existing navigation or access
    behavior.
  preconditions:
  - A reachable frontend is available; each scenario controls existing HTTP boundaries
    with deterministic authorized fixtures.
  test_data:
    profile: mock
    routes:
    - /agents
    - /chat
    - /agent-space
    locales:
    - zh
    - en
  steps:
  - order: 1
    action: Render/open the sidebar with authorized children in speed mode. Click
      chat and agent child menus; inspect account and notification controls.
    expected: Both inert section buttons are absent; authorized children remain and
      denied routes stay hidden. Localized pages open and only functional controls
      are available.
  - order: 2
    action: 'Enable workbench and grant Home and Chat routes; inspect both locales
      and click Workbench. Locale: zh'
    expected: Workbench appears immediately after Home with the requested localized
      label and opens the same localized /workbench route.
  - order: 3
    action: 'Enable workbench and grant Home and Chat routes; inspect both locales
      and click Workbench. Locale: en'
    expected: Workbench appears immediately after Home with the requested localized
      label and opens the same localized /workbench route.
  expected_results:
  - Both inert section buttons are absent; authorized children remain and denied routes
    stay hidden. Chat navigates to localized newchat and child pages remain usable.
    Speed notification is absent and account control remains.
  - Enabled permitted workbench follows Home and precedes Start Chat; localized label
    is 工作台 / Workbench.
  - Enabled permitted workbench follows Home and precedes Start Chat; localized label
    is 工作台 / Workbench.
  forbidden_side_effects:
  - No unrequested business writes or agent/provider execution.
  execution:
    profiles:
    - name: mock
      required_services: []
  actor: Authorized speed-mode user
  journey:
  - Open agent list
  - Inspect permitted menus and hidden placeholders
  - Open chat and return through agent menu
  final_business_result:
  - Existing agent list and new-chat pages remain reachable without inert section
    controls.
  failure_evidence:
  - Playwright failure screenshot and trace
  acceptance:
  - id: AC-01
    description: Verify sidebar visibility without changing existing navigation or
      access behavior.
    steps:
    - 1
    - 2
    - 3
    expected_results:
    - 1
    - 2
    - 3
    forbidden_side_effects:
    - 1
