  title: local/minio upload、多文件、partial success、quota、lifecycle fields｜异常/边界/越权
  type: INTEGRATION
  priority: P0
  status: active
  automation: automated
  objective: local/minio upload、多文件、partial success、quota、lifecycle fields｜异常/边界/越权
  preconditions:
  - Nexent 本地测试全栈已启动，health check 通过。
  - 设置 NEXENT_TEST_HOME，目录不位于 Nexent Git 仓库内。
  - 当次 run_id 已生成，所有新建资源名称带 run_id；测试基线固定为 develop 当前批次锁定的产品提交；执行时另记录实际被测commit。
  - 所需本地资产存在且校验通过：${NEXENT_TEST_HOME}/config/users.yaml；${NEXENT_TEST_HOME}/config/secrets.env；${NEXENT_TEST_HOME}/assets/knowledge/；${NEXENT_TEST_HOME}/assets/expected/kb_expected.json；${NEXENT_TEST_HOME}/assets/documents/
  - models.yaml 中本用例所需真实 Provider 已配置，secrets.env 中凭据有效，预检连通性通过。
  test_data:
    legacy_asset_declaration: '- ${NEXENT_TEST_HOME}/config/users.yaml

      - ${NEXENT_TEST_HOME}/config/secrets.env

      - ${NEXENT_TEST_HOME}/assets/knowledge/

      - ${NEXENT_TEST_HOME}/assets/expected/kb_expected.json

      - ${NEXENT_TEST_HOME}/assets/documents/'
  steps:
  - order: 1
    action: 从 ${NEXENT_TEST_HOME}/assets/documents/ 或 assets/knowledge/ 选择本用例固定文件，并从 expected/*.json 读取预期 marker/chunk/状态。
    expected: 功能结果与代码契约一致，测试过程无未处理异常。
  - order: 2
    action: 使用真实测试用户登录本地 Nexent，通过实际 API 创建/选择知识库或文件上下文；不得直接向数据库插入最终结果来绕过业务链路。
    expected: 关键状态在 API 返回、数据库/存储和后续读取中保持一致。
  - order: 3
    action: 上传固定文件并等待真实对象存储与数据处理任务完成；记录 file_id、object_name、task_id 和处理状态迁移。
    expected: 失败路径返回明确错误，不出现半写入、重复副作用或跨租户泄露。
  - order: 4
    action: 若涉及知识库，使用 models.yaml 中真实 Embedding 完成切分和向量入库；涉及 Rerank 时使用真实 Rerank 模型。
    expected: 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
  - order: 5
    action: 执行“local/minio upload、多文件、partial success、quota、lifecycle fields｜异常/边界/越权”对应的下载/预览/检索/摘要/权限/Range/处理操作，保存实际响应与关键头字段。
    expected: 固定测试 marker 对应文档进入期望 Top-K/Top-N，向量维度和模型绑定正确。
  - order: 6
    action: 检索类断言以固定 marker、目标 chunk 是否进入 Top-K/Top-N 为主，不要求 LLM 自然语言完全一致。
    expected: minio（携带 index_name）上传后 lifecycle 记录 upload_owner_service 等于 CONFIG_SERVICE_NAME；local 上传不写 lifecycle 记录，无归属字段残留。
  - order: 7
    action: 文件类检查 MIME、Content-Length/Content-Range、文件哈希、可解析性以及损坏/空文件时的明确错误。
    expected: 中断恢复仅失败宽限期外、归属当前服务的 UPLOADING 记录并删除其部分对象；缺失/异常归属值不破坏正常上传，空归属恢复查询被拒绝且不误清理无关记录。
  - order: 8
    action: 权限类至少再使用另一用户/租户直接请求同一资源ID，确认 401/403/404 且对象存储与DB无越权副作用。
    expected: 中断恢复仅失败宽限期外、归属当前服务的 UPLOADING 记录并删除其部分对象；缺失/异常归属值不破坏正常上传，空归属恢复查询被拒绝且不误清理无关记录。
  - order: 9
    action: 上传归属边界：同一用户对同一知识库分别以 destination=minio（携带 index_name）与 destination=local 上传相同固定文件；查询 knowledge_file_lifecycle_t
      确认 minio 场景记录存在且 upload_owner_service=CONFIG_SERVICE_NAME（consts.task_recovery 常量），local 场景不产生任何生命周期记录。
    expected: 中断恢复仅失败宽限期外、归属当前服务的 UPLOADING 记录并删除其部分对象；缺失/异常归属值不破坏正常上传，空归属恢复查询被拒绝且不误清理无关记录。
  - order: 10
    action: 中断恢复边界：通过正常上传产生一条归属 CONFIG_SERVICE_NAME 的 UPLOADING 记录后（模拟上传中断），触发 config 服务启动恢复流程；确认宽限期前、归属当前服务的旧 UPLOADING 记录被置
      FAILED 且对应 MinIO 部分对象被删除，缺失 upload_owner_service 的恢复查询被 ValueError 拒绝。
    expected: 中断恢复仅失败宽限期外、归属当前服务的 UPLOADING 记录并删除其部分对象；缺失/异常归属值不破坏正常上传，空归属恢复查询被拒绝且不误清理无关记录。
  - order: 11
    action: '清理本用例创建的 KB、文件、向量数据和临时下载文件。

      补充异常断言：对本用例涉及的非法/失败条件至少重复一次，确认重试不会产生重复资源、脏状态或权限绕过。'
    expected: 中断恢复仅失败宽限期外、归属当前服务的 UPLOADING 记录并删除其部分对象；缺失/异常归属值不破坏正常上传，空归属恢复查询被拒绝且不误清理无关记录。
