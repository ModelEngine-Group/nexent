  - 功能结果与代码契约一致，测试过程无未处理异常。
  - 关键状态在 API 返回、数据库/存储和后续读取中保持一致。
  - 失败路径返回明确错误，不出现半写入、重复副作用或跨租户泄露。
  - 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
  - 固定测试 marker 对应文档进入期望 Top-K/Top-N，向量维度和模型绑定正确。
  - minio（携带 index_name）上传后 lifecycle 记录 upload_owner_service 等于 CONFIG_SERVICE_NAME；local 上传不写 lifecycle 记录，无归属字段残留。
  - 中断恢复仅失败宽限期外、归属当前服务的 UPLOADING 记录并删除其部分对象；缺失/异常归属值不破坏正常上传，空归属恢复查询被拒绝且不误清理无关记录。
