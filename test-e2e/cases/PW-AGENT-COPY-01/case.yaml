schema_version: '1.0'
stage: D4
module: V5-BASELINE
case:
  case_id: PW-AGENT-COPY-01
  feature_id: F-043
  business_rule_ids:
  - F-043-RULE-01
  title: 智能体仓库复制→唯一后缀→副本可用
  type: E2E
  priority: P1
  status: active
  automation: automated
  objective: 验证从智能体仓库复制出的副本获得唯一名称后缀且保持可用、可发布。
  preconditions:
  - 真实LLM已配置
  - 已存在一个带 run_id 唯一展示名的源智能体
  test_data:
    legacy_asset_declaration: config/models.yaml
  steps:
  - order: 1
    action: 登录后进入智能体仓库，创建带 run_id 唯一展示名的源智能体。
    expected: 源智能体创建成功且在列表可见。
  - order: 2
    action: 在源智能体卡片的更多操作菜单中点击复制，并在确认弹窗中点击确定。
    expected: 复制请求成功，界面出现复制成功提示。
  - order: 3
    action: 读取智能体列表，检查第一份副本的名称与展示名。
    expected: 副本展示名为源展示名加“副本”，变量名与展示名带唯一 _1 后缀冲突时自动顺延。
  - order: 4
    action: 对同一源智能体再次执行复制。
    expected: 第二份副本获得 _1 或顺延的唯一后缀，不与已有名称冲突。
  - order: 5
    action: 通过列表 API 核对两份副本的可用状态与不可用原因。
    expected: 两份副本 is_available 不为 false，且不带 duplicate_name/duplicate_display_name 不可用原因。
  expected_results:
  - 复制出的副本保持可用，可被发布流程使用。
  - 副本名称带唯一数值后缀，不与源或其他副本冲突。
  forbidden_side_effects:
  - 复制不产生 duplicate_name/duplicate_display_name 不可用资源。
  - 复制不修改或删除源智能体配置。
  actor: Nexent browser user
  journey:
  - 进入智能体仓库并创建源智能体。
  - 从卡片更多操作菜单发起复制并确认。
  - 再次复制制造连续重名场景。
  - 通过列表 API 验证副本唯一后缀与可用状态。
  final_business_result:
  - 连续复制产生的副本全部保持可用且名称唯一，复制后即可发布。
  failure_evidence:
  - 'NEXENT_TEST_HOME 环境变量指向的 runs/{run_id}/playwright/PW-AGENT-COPY-01/

    - screenshot.png / trace.zip / video.webm

    - console.log / network.har / failure.json'
  acceptance:
  - id: AC-COPY-UNIQUE
    description: 复制产生的名称与展示名通过唯一数值后缀避免冲突。
    steps: [2, 3, 4]
    expected_results: [2]
    forbidden_side_effects: [1]
  - id: AC-COPY-AVAILABLE
    description: 副本保持可用且可进入发布流程，源智能体配置不被修改。
    steps: [1, 5]
    expected_results: [1]
    forbidden_side_effects: [1, 2]
