  risk: orphaned agent workspace cleanup 不误删活跃资源｜核心流程
  condition:
  - Runtime 启动清理入口收到独立临时工作目录。
  metrics:
  - 清理返回的目录计数和保留文件内容。
  thresholds:
  - 首次清理返回 1，重复调用返回 0，保留文件内容无变化。
  recovery_expectations:
  - 测试结束后释放独立临时目录。
  acceptance:
  - id: AC-01
    description: Runtime 清理入口只回收旧运行目录，保留共享与符号链接资源，且重复执行无副作用。
    steps: [1, 2, 3]
    expected_results: [1, 2]
    forbidden_side_effects: [1]
