  - F-158-RULE-01
  title: orphaned agent workspace cleanup 不误删活跃资源｜核心流程
  type: RELIABILITY
  priority: P2
  status: active
  automation: automated
  objective: orphaned agent workspace cleanup 不误删活跃资源｜核心流程
  preconditions:
  - 测试进程可以在独立临时目录创建目录、文件和符号链接。
  test_data:
    workspace_entries: [orphan_run, shared_directory, run_id_file, run_id_symlink, root_symlink]
  steps:
  - order: 1
    action: 在独立临时根目录准备上次运行的工作目录、共享目录、普通文件和指向工作区外的符号链接。
    expected: 所有测试数据由用例创建并在结束后清理。
  - order: 2
    action: 先通过符号链接根目录，再通过真实根目录调用 Runtime 启动清理入口 cleanup_orphaned_agent_workspaces。
    expected: 链接根目录不触发清理，真实根目录仅删除上次运行的工作目录并返回 1。
  - order: 3
    action: 读取保留的文件并检查符号链接，再次调用清理。
    expected: 保留内容不变，第二次清理返回 0。
  expected_results:
  - 仅删除上次运行的工作目录。
  - 重复清理返回 0。
  forbidden_side_effects:
  - 删除共享目录、普通文件、符号链接或其目标。
