  priority: P0
  status: active
  automation: automated
  objective: /agent/stop/{conversation_id} 幂等取消、资源释放｜异常/边界/越权
  preconditions:
  - Nexent 本地测试全栈已启动，health check 通过。
  - 设置 NEXENT_TEST_HOME，目录不位于 Nexent Git 仓库内。
  - 当次 run_id 已生成，所有新建资源名称带 run_id；测试基线固定为 develop 473b65268ba8cda3db53be735f97678e214c583b；执行时另记录实际被测commit。
  - 所需本地资产存在且校验通过：${NEXENT_TEST_HOME}/config/models.yaml；${NEXENT_TEST_HOME}/config/secrets.env
  - models.yaml 中本用例所需真实 Provider 已配置，secrets.env 中凭据有效，预检连通性通过。
  test_data:
    legacy_asset_declaration: '- ${NEXENT_TEST_HOME}/config/models.yaml

      - ${NEXENT_TEST_HOME}/config/secrets.env'
  steps:
  - order: 1
    action: 生成一个确定不存在的 run_id/conversation_id。
    expected: stop 遵循幂等取消契约：不存在或已停止目标返回 200 success 与 already_stopped=true。
  - order: 2
    action: 调用 GET /agent/stop/{run_id} 两次。
    expected: 不误报“已停止一个活动任务”，不创建状态，不影响其他运行。
  - order: 3
    action: 两次均断言 HTTP 200、status=success、already_stopped=true，message 明确说明没有运行中的任务。
    expected: 不误报“已停止一个活动任务”，不创建状态，不影响其他运行。
  - order: 4
    action: 查询会话/运行状态，确认未创建新状态、未影响其他用户或会话。
    expected: 不误报“已停止一个活动任务”，不创建状态，不影响其他运行。
  expected_results:
  - stop 遵循幂等取消契约：不存在或已停止目标返回 200 success 与 already_stopped=true。
  - 不误报“已停止一个活动任务”，不创建状态，不影响其他运行。
  forbidden_side_effects: []
