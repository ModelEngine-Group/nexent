schema_version: '1.0'
stage: D3
module: V5-BASELINE
case:
  case_id: AGT-019
  feature_id: F-057
  business_rule_ids: [F-057-RULE-01]
  title: "不存在运行 ID 的重复 Stop 不创建运行或业务数据"
  type: AGENT-IT
  priority: P0
  status: active
  automation: automated
  objective: "不存在运行 ID 的重复 Stop 不创建运行或业务数据"
  preconditions:
  - Nexent 本地全栈及配置中真实 LLM 可用，当前提交及模型快照由执行器记录。
  - 使用已有配置 helper、资产注册表、隔离资产工厂和本地 test-home，不固定资源 ID 或密钥。
  test_data:
    logical_assets: [configured_llm, owned_agent_or_conversation]
  observations:
  - 记录当前产品提交、脱敏协议事件及独占资源前后状态。
  cleanup:
  - 使用已有资产工厂和资产登记清理独占资源，清理失败保留单独证据。
  steps:
  - order: 1
    action: "通过已有 absent_numeric_id helper 生成并验证数据库不存在的目标；只读核对该用户目标的运行状态和流为空，建立独占 canary。"
    expected: "目标在数据库、运行记录及持久流中均不存在。"
  - order: 2
    action: "以当前用户调用目标 Stop 两次，逐次保存确认响应并观察相同目标的运行及流状态。"
    expected: "两次均返回 200 success 和非空 message；already_stopped 可选，允许仅产生有 TTL 的取消信号，不允许创建运行或持久流。"
  - order: 3
    action: "重新读取 canary 并重新验证数据库中目标 ID 不存在。"
    expected: "没有创建会话、运行、消息或业务资源，独占 canary 保持不变。"
  - order: 4
    action: "通过已有工厂清理 canary，保留脱敏确认和只读状态证据。"
    expected: "仅清理本用例资产，不删除共享 Redis 键，不扫描或修改其他运行。"
  expected_results:
  - "重复取消不存在目标返回当前产品成功确认契约。"
  - "目标始终没有运行记录、持久流和数据库资源；允许正常 TTL 的取消信号。"
  - "独占 canary 保持不变并清理，本地证据脱敏，无共享状态修改。"
  forbidden_side_effects:
  - 不修改共享产品配置、其他用户资源或 Redis 状态；不得将未完成的运行视为通过。
  source:
    legacy_workbook_sha256: aa4b32414d30f12b3b64e14236268145e556bd7cfc5d3eb8df80731608ebc022
    legacy_sheet: 02_测试用例基线
    legacy_row: 109
    notes: "取消信号的成功登记不代表存在活动运行；不得通过强制 already_stopped 标记推断幂等性。此用例不替代独立的跨租户取消授权测试。"
  integration_boundary:
  - 通过实际配置和运行 API 以及真实模型验证；只读观测不替代产品执行。
  acceptance:
  - id: AC-01
    description: "不存在运行 ID 的重复 Stop 不创建运行或业务数据；所有前置、操作、终态及独占资源清理均按上述定义验证。"
    steps: [1, 2, 3, 4]
    expected_results: [1, 2, 3]
    forbidden_side_effects: [1]
