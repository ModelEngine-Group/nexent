    notes: '#4134 retired private prompt-template synchronization. User approved forced-process restart as sufficient startup-failure recovery on 2026-10-22; retain normal shutdown guarantees.'
  risk_type: RELIABILITY
  risk: 启动失败后仍对外就绪、强制重启后不能恢复或测试自建进程未回收；正常关闭的资源泄漏仍独立判失败。
  condition:
  - 正常关闭采用进程内真实生命周期；启动失败采用真实Uvicorn及独立进程，持久化和外部副作用受控。
  metrics:
  - 启动/关闭序列、control-io元数据、旧/新进程PID及退出码、自然/强制退出方式、恢复耗时、就绪HTTP状态和敏感日志检查。
  thresholds:
  - 七项验收均有实际测试映射；恢复等待最多45秒、进程终止等待最多10秒；敏感标记泄漏为0；测试结束自建进程及进程内资源残留为0。
  recovery_expectations:
  - 启动失败允许强制重启：先确认旧进程退出，撤去注入故障后以新进程实际提供健康服务；持续配置错误不要求靠重启自行修复。
  - 正常及运行期异常关闭仍须由生命周期释放资源；测试安全清理不能替代新进程恢复验收，也不能掩盖正常关闭失败。
