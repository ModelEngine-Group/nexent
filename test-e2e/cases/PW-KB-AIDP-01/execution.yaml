schema_version: '1.0'
case_id: PW-KB-AIDP-01
# The journey always runs against the controlled AIDP served by the
# ext-knowledge mock (owned oracle copied from its seed); there is no profile selection,
# no machine-local journey file and no real AIDP environment.
required_mock_services:
- knowledge-provider
implementations:
- framework: playwright
  file: test.spec.ts
  selector: PW-KB-AIDP-01
notes: >-
  Local and AIDP execution groups are mutually exclusive by deployment
  configuration. The journey uses the suite-owned ext-knowledge mock started
  through the plain required_mock_services path; health/reset evidence is
  recorded in runtime/ext-knowledge-attach.json. No machine-local attach
  YAML, identity or lock is required.
acceptance_bindings:
  AC-01:
  - PW-KB-AIDP-01
  AC-02:
  - PW-KB-AIDP-01
  AC-03:
  - PW-KB-AIDP-01
  AC-04:
  - PW-KB-AIDP-01
preparation:
  families: []
  anchors: true
  special_assets: false
  d4_groups:
  - llm_agent
  - aidp_knowledge
