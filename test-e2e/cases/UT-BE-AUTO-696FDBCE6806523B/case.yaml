    legacy_row: 403
  unit_boundary: NL2Agent 资源推荐
  inputs:
  - '- ${NEXENT_TEST_HOME}/config/environment.yaml（仅本地测试环境参数）'
  assertions:
  - ENABLE_AIDP_KNOWLEDGE 为 True 时：knowledge_base_search 返回 False（被过滤），ind_aidp_search、aidp_search 与普通工具返回 True（可推荐）。
  - ENABLE_AIDP_KNOWLEDGE 为 False 时：aidp_search 返回 False（被过滤），knowledge_base_search、ind_aidp_search 与普通工具返回 True。
  - 过滤规则与部署模式契约一致：AIDP 部署排除 knowledge_base_search，本地部署排除 aidp_search；独立 ind_aidp_search 在两种模式均可推荐，推荐目录不含冲突工具。
  - 无未处理异常，日志/Trace/报告中不出现 API Key、Token、密码或模型密钥。
  acceptance:
  - id: AC-01
    description: 两种部署模式保持互斥知识库推荐且不隐藏独立 AIDP 搜索，目录过滤与边界输入正确。
    steps: [1, 2, 3, 4, 5, 6]
    expected_results: [1, 2, 3, 4]
