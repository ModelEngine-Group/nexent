schema_version: '1.0'
stage: D1
module: V5-BASELINE
case:
  case_id: UT-SDK-017
  feature_id: F-171
  business_rule_ids:
  - F-171-RULE-01
  title: agent/tool/context gateway 的输入输出 contract｜异常/边界/越权
  type: SDK-UT
  priority: P0
  status: active
  automation: automated
  objective: agent/tool/context gateway 的输入输出 contract｜异常/边界/越权
  preconditions:
  - 本地依赖/组件测试环境可运行；不要求外部模型服务在线。
  - 设置 NEXENT_TEST_HOME，目录不位于 Nexent Git 仓库内。
  - 当次 run_id 已生成，所有新建资源名称带 run_id；测试基线固定为 develop 当前批次锁定的产品提交；执行时另记录实际被测commit。
  - 所需本地资产存在且校验通过：${NEXENT_TEST_HOME}/config/models.yaml；${NEXENT_TEST_HOME}/config/secrets.env
  test_data:
    legacy_asset_declaration: '- ${NEXENT_TEST_HOME}/config/models.yaml

      - ${NEXENT_TEST_HOME}/config/secrets.env'
  steps:
  - order: 1
    action: 在本地工作区读取与“agent/tool/context gateway 的输入输出 contract｜异常/边界/越权”相关的固定 fixture/配置；测试代码不得读取生产凭据。
    expected: 功能结果与代码契约一致，测试过程无未处理异常。
  - order: 2
    action: 直接导入 sdk/nexent/core 对应的函数/类，构造最小有效输入与必要依赖对象（ThreadManager、RunCancellationScope、ManagedMCPToolCollection、ModelConcurrencyLimiter、OpenAIModel、RunSkillScriptTool、KnowledgeBaseSearchTool
      等）。
    expected: 关键状态在 API 返回、数据库/存储和后续读取中保持一致。
  - order: 3
    action: 先执行正常输入，记录返回值、状态变化和关键调用参数。
    expected: MCP 三类超时（工具/关闭/连接）参数 <=0 均抛 ValueError；超时后触发取消并 mark_stuck_on_timeout=True。
  - order: 4
    action: 针对边界值分别执行：空值、最小/最大值、重复调用、非法枚举或缺失字段（按该功能实际入参选择）。
    expected: 模型并发：limit<=0 或 wait timeout<=0 抛 ValueError，同一 key 冲突 limit 抛 ValueError，等待超时抛 ModelConcurrencyExceeded，cancel/stop
      抛 RuntimeError；许可 release 幂等且引用计数归零后清理 entry。
  - order: 5
    action: 对 ManagedMCPToolCollection 分别传入 tool_timeout_seconds/close_timeout_seconds/connect_timeout_seconds<=0，断言抛出 ValueError；对已构造实例分别触发工具调用超时、会话关闭超时、会话启动超时，断言超时后触发取消且
      mark_stuck_on_timeout=True。
    expected: 上下文溢出：run 已产生工具副作用时抛 ProviderContextOverflowRetryUnsafe，两次恢复耗尽后抛 ProviderContextOverflowRetryExhausted；容量指纹或
      provider/model 不一致抛 ContextBudgetCapacityMismatch。
  - order: 6
    action: 对 ModelConcurrencyLimiter.acquire 传入 limit<=0 或 timeout_seconds<=0 断言 ValueError；对同一 key 传入冲突 limit 断言 ValueError；限额占满且等待超时断言
      ModelConcurrencyExceeded；stop_event 置位断言等待被取消并清理引用；验证许可 release 幂等且引用计数归零后清理 entry。
    expected: run_skill_script 非法 source 抛 ValueError，未授权 skill 抛 PermissionError，沙箱失败抛 SkillScriptExecutionError；knowledge_base_search
      无权限时返回结构化 notice（含 permission_denied/unavailable/fallback_to_all 分支）。
  - order: 7
    action: 对 OpenAIModel 构造 provider 上下文溢出场景：断言无副作用重放闸关闭（当前 run 已产生 tool_calls）时抛 ProviderContextOverflowRetryUnsafe；连续两次恢复后第三次仍溢出断言
      ProviderContextOverflowRetryExhausted；对 W1/W2 fingerprint 或 provider/model_name 不一致断言 ContextBudgetCapacityMismatch。
    expected: 失败路径返回明确错误，不出现半写入、重复副作用或跨租户泄露。
  - order: 8
    action: 对 RunSkillScriptTool.execute 传入 source 非 skill/workspace 断言 ValueError；传入未授权 skill_name 断言 PermissionError；沙箱返回
      error 结果断言 SkillScriptExecutionError。
    expected: 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
  - order: 9
    action: 对 KnowledgeBaseSearchTool.forward 在无可访问知识库场景断言返回结构化 notice（含 permission_denied/unavailable/fallback_to_all 分支与
      reference_mark）。
    expected: 真实模型调用成功，stream/Agent run 正常结束；自然语言只做稳定关键词/结构/工具调用断言。
  - order: 10
    action: 对有副作用的逻辑检查：对象状态、缓存/计数器、序列化结果以及是否出现重复写入。
    expected: 真实模型调用成功，stream/Agent run 正常结束；自然语言只做稳定关键词/结构/工具调用断言。
  - order: 11
    action: 对异常路径断言领域异常类型/错误码，不允许吞异常后返回伪成功。
    expected: 真实模型调用成功，stream/Agent run 正常结束；自然语言只做稳定关键词/结构/工具调用断言。
  - order: 12
    action: 确认日志中不输出 API Key、Token、用户密码或模型密钥。
    expected: 真实模型调用成功，stream/Agent run 正常结束；自然语言只做稳定关键词/结构/工具调用断言。
  - order: 13
    action: 测试结束后释放临时文件/临时对象，确保可重复执行。
    expected: 真实模型调用成功，stream/Agent run 正常结束；自然语言只做稳定关键词/结构/工具调用断言。
  expected_results:
  - 功能结果与代码契约一致，测试过程无未处理异常。
  - 关键状态在 API 返回、数据库/存储和后续读取中保持一致。
  - MCP 三类超时（工具/关闭/连接）参数 <=0 均抛 ValueError；超时后触发取消并 mark_stuck_on_timeout=True。
  - 模型并发：limit<=0 或 wait timeout<=0 抛 ValueError，同一 key 冲突 limit 抛 ValueError，等待超时抛 ModelConcurrencyExceeded，cancel/stop 抛
    RuntimeError；许可 release 幂等且引用计数归零后清理 entry。
  - 上下文溢出：run 已产生工具副作用时抛 ProviderContextOverflowRetryUnsafe，两次恢复耗尽后抛 ProviderContextOverflowRetryExhausted；容量指纹或 provider/model
    不一致抛 ContextBudgetCapacityMismatch。
  - run_skill_script 非法 source 抛 ValueError，未授权 skill 抛 PermissionError，沙箱失败抛 SkillScriptExecutionError；knowledge_base_search
    无权限时返回结构化 notice（含 permission_denied/unavailable/fallback_to_all 分支）。
  - 失败路径返回明确错误，不出现半写入、重复副作用或跨租户泄露。
  - 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
  - 真实模型调用成功，stream/Agent run 正常结束；自然语言只做稳定关键词/结构/工具调用断言。
  forbidden_side_effects: []
