  - MCP 三类超时（工具/关闭/连接）参数 <=0 均抛 ValueError；超时后触发取消并 mark_stuck_on_timeout=True。
  - 模型并发：limit<=0 或 wait timeout<=0 抛 ValueError，同一 key 冲突 limit 抛 ValueError，等待超时抛 ModelConcurrencyExceeded，cancel/stop 抛
    RuntimeError；许可 release 幂等且引用计数归零后清理 entry。
  - 上下文溢出：run 已产生工具副作用时抛 ProviderContextOverflowRetryUnsafe，两次恢复耗尽后抛 ProviderContextOverflowRetryExhausted；容量指纹或 provider/model
    不一致抛 ContextBudgetCapacityMismatch。
  - run_skill_script 非法 source 抛 ValueError，未授权 skill 抛 PermissionError，沙箱失败抛 SkillScriptExecutionError；knowledge_base_search
    无权限时返回结构化 notice（含 permission_denied/unavailable/fallback_to_all 分支）。
  - 失败路径返回明确错误，不出现半写入、重复副作用或跨租户泄露。
  - 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
