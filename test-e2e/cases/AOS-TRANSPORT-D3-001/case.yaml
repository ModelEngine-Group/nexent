schema_version: '1.0'
stage: D3
module: AUTH-IDENTITY
case:
  case_id: AOS-TRANSPORT-D3-001
  feature_id: AOS-TRANSPORT
  requirement_ids:
  - AOS-REQ-001
  - AOS-REQ-002
  business_rule_ids:
  - AOS-TRANSPORT-RULE-01
  title: AgentOS compatibility transport over local HTTP
  type: INTEGRATION
  priority: P0
  status: active
  automation: automated
  objective: Prove signed AgentOS run and stop transport across actual Management
    and Runtime HTTP boundaries.
  preconditions:
  - Local loopback sockets and Python backend dependencies are available.
  test_data:
    profile: mock
    service_key: Synthetic local fixture
    execution: Recording Agent execution sink
  steps:
  - order: 1
    action: Invoke run and stop through the Management AgentOS client over loopback
      HTTP.
    expected: The Runtime dispatcher observes the signed user, tenant and exact resource;
      SSE event IDs and JSON stop results reach the caller.
  - order: 2
    action: Submit an unsigned request, a modified body, a reused token on another
      operation, an expired credential and an unknown version.
    expected: Authentication failures are 401; the unsupported path is 404; no rejected
      call enters the execution sink.
  - order: 3
    action: Run a prepared synthetic evaluation and probe the retired compatibility route.
    expected: Prepared evaluation preserves events and rejects a positive ID. The retired route returns 401 without signing, 422 for invalid input and 410 for a valid signed request.
  - order: 4
    action: Submit a signed background call with a run ID and disconnect another background client.
    expected: Runtime receives the signed actor and run ID, returns the assistant message, and cancels execution after disconnect.
  - order: 5
    action: Send a prepared evaluation over signed HTTP and attempt unsigned and cross-tenant requests.
    expected: Runtime rebuilds scoped file, attachment, skill, external A2A and direct or skill-derived MCP bindings and a child Agent with the expected model parameters. The system parallel executor retains its timeout and tool order; an invalid timeout is rejected before execution. Events stay ordered. Out-of-scope attachments and changed execution bindings are refused. The runner reads the verified skill guide and effective configuration from its isolated workspace. A changed MCP skill contributor cannot start the runner. Knowledge search respects the index and document scope; group revocation denies the run before search. The runner uses the Runtime Docker policy and regenerated sandbox context even when Management compiled local Python guidance. Image analysis binds the signed tenant model, rejects unauthorized storage aliases and refuses a stale model before execution. A configured Dify tool uses its Runtime credentials and configured dataset without exposing them over AgentOS. A skill-derived local tool keeps its order and refuses a changed contributor. Independent AIDP retrieval uses the pinned tenant binding, and the Management proxy accepts the image reference signed by Runtime. Shared AIDP retrieves only from the current authorized scope, and revocation prevents another upstream search. A deployed LangChain plugin runs in tool order, and changed plugin bytes are rejected before execution. A pinned workspace tool writes in its configured Runtime path and the model body is restored from the bound Agent version; either revision changing prevents execution. An independent AIDP image generated from a skill-derived binding resolves through Management and rejects a changed contributor.
  - order: 6
    action: Resume after a scoped event cursor and attempt the same request under a different tenant.
    expected: Replay and live events arrive in order with stable IDs; the other tenant is refused before the journal is opened.
  - order: 7
    action: Submit an ordinary conversation through the public Management route and the old signed Runtime operation; also request a cursorless resume.
    expected: Both new-start entrypoints reach Management with the signed actor, locale and timezone before Runtime consumes the claim. An explicit legacy fallback executes once with unchanged SSE and the original run ID. Cursorless resume uses its dedicated signed AgentOS operation.
  - order: 8
    action: Submit a signed conversation twice with one idempotency key and then change the request under that key.
    expected: Management returns the original run ID on retry and 409 on changed input. The execution receives the claimed ID exactly once across the Management handoff and explicit fallback; replaying the consumed execution handoff is rejected before another start.
  - order: 9
    action: Inspect and stop a retained run by ID over signed HTTP, then repeat after it reaches a terminal state.
    expected: Only the targeted run receives cancellation; the terminal response and other run are unchanged, and foreign actors receive 404.
  - order: 10
    action: Stop a registered run through the public Management and Northbound paths, and start and cancel an automation run using its persisted execution ID.
    expected: Management signs the exact Runtime run ID, a cancellation before admission fences that ID, and an unrelated run cannot be stopped. Runtime marks persistent Gateway and Northbound compatibility starts for registration, and legacy stop respects user and tenant ownership.
  - order: 11
    action: Compile an owned conversation snapshot with an explicit model temperature in Management, submit it signed and reconnect after the first event.
    expected: The exact run ID and metadata revision are retained, duplicate admission is refused, and only the signed owner can receive the remaining observer event and terminal status. Runtime uploads a declared skill file and forwards its object reference. Runtime restores authorized historical turns. Management projects the reference, accepted history checkpoint, ordered units and the terminal answer.
  - order: 12
    action: Compile a conversation with a saved disabled knowledge scope, drop the prepared automation acknowledgement after Runtime accepts the run, and recover from the persisted Automation record.
    expected: The signed snapshot excludes the disabled index. Management records the source message before compilation and the pending projection before dispatch, retains the exact execution ID, replays the signed journal, and finalizes one assistant message without starting the run again.
  - order: 13
    action: Reconnect to a prepared journal through Management's public conversation route and repeat with a foreign tenant.
    expected: The response keeps the original event IDs and terminal state, presents observer events in the public format, signs only scoped output references, and rejects the foreign tenant.
  - order: 14
    action: Deliver a prepared planning snapshot through the signed Agent.run operation.
    expected: Runtime rebuilds the built-in plan tools and injects its own Redis client. Creating a plan and completing a step emit the original SDK events and update the conversation-scoped plan.
  - order: 15
    action: Start an eligible public conversation with an idempotency key and repeat the submission.
    expected: Management stages the user input, dispatches one signed Agent.run, confirms the turn, and projects the signed journal into the reserved assistant message. Retry returns the original run ID and the other tenant receives 404.
  - order: 16
    action: Invoke the prepared SDK proposal tool through the Runtime-to-Management AgentOS callback.
    expected: Management uses the stored source message and Agent version, returns the original proposal response, and rejects unsigned, forward-signed, modified, and foreign-tenant calls.
  - order: 17
    action: Submit a first public turn without a conversation ID and repeat it with the same submission key.
    expected: Management creates one conversation with the localized default title, announces its ID without consuming a Runtime cursor, and the retry returns the same conversation and run.
  - order: 18
    action: Submit an owned Northbound turn, reject another user and tenant, and stop a staged run through signed AgentOS.
    expected: One turn stages and projects. Northbound preserves response headers and SSE data frames. Stop fences the exact staged run and keeps its public response.
  - order: 19
    action: Submit explicit runtime metadata to Northbound on an owned conversation through signed AgentOS.
    expected: Runtime receives the replacement and next version. Management stages that version and preserves it in the public response.
  - order: 20
    action: Submit an owned Workbench turn with a resolved Workbench configuration and stream signed AgentOS output.
    expected: The typed Workbench version and root generation reach Runtime and Management presents the public configuration event and version header.
  - order: 21
    action: Submit a Workbench turn with a local knowledge scope and consume the signed prepared journal.
    expected: Runtime receives the scoped knowledge binding. The response emits the resolved configuration and authorized scope before journal events.
  - order: 22
    action: Send a prepared ephemeral run through signed AgentOS and close a live response.
    expected: Runtime receives the exact authorized snapshot without a conversation. Observer events reach Management and closing the caller releases the worker and workspace.
  - order: 23
    action: Submit a Workbench turn with an authorized metadata replacement.
    expected: Signed execution receives the metadata and both revisions. The public response exposes both versions and one projected turn.
  - order: 24
    action: Send a Workbench turn with a mounted shared AIDP tool and revoke one selected KDS before Runtime materializes it.
    expected: The signed binding keeps typed retrieval options, and Runtime permits only the KDS still authorized.
  - order: 25
    action: Submit a clarification response for an owned conversation and retry with the same key.
    expected: Management stages the structured response locally and sends only the prepared execution input to Runtime. The retry keeps the original run ID and another tenant receives 404.
  - order: 26
    action: Start a public debug run, try stopping it from a second tenant, then stop it from its owner.
    expected: Management sends a signed debug snapshot and the public response retains the debug run ID. Only the owned scope emits a cancellation signal and the worker releases its resources.
  - order: 27
    action: Run an owned native conversation whose stored knowledge scope includes a revoked index.
    expected: Management stages the unchanged desired scope and signs only the authorized index. The public event preserves the warning and the journal streams once.
  - order: 28
    action: Store Agent Memory through the Management SDK bridge, retry, and try an unauthorized conversation and unsigned request.
    expected: Runtime uses the signed scope for one Model invocation and one write. Replay keeps the original ID and rejected calls do not write.
  - order: 29
    action: Submit a signed prepared conversation containing authorized Memory and execute its bound SDK store tool.
    expected: Runtime reconstructs the tool for the signed owner and journals search events before model events.
  - order: 30
    action: Execute a prepared Memory write and observe the signed Management notification. Retry with missing or modified credentials and foreign ownership.
    expected: Management ingests only the committed record for the signed owner and refuses untrusted notifications.
  - order: 31
    action: Submit an owned Memory-enabled public conversation through Management and replay its Runtime output.
    expected: Management selects the prepared route and forwards the pinned Agent to the durable projection once.
  - order: 32
    action: Start a Memory-enabled automation run, lose its admission acknowledgement, and recover after the task Agent changes.
    expected: Management projects the original signed run under the persisted Agent and prompt message without another dispatch.
  - order: 33
    action: Run a signed Workbench snapshot whose authorized root Skill overrides are obtained through the signed Management callback.
    expected: Runtime rebuilds the root SDK Skill tools and refuses a modified bundle or revoked binding.
  - order: 34
    action: Run a signed Workbench snapshot whose mounted Skill contributes Local, MCP, and LangChain tools.
    expected: Runtime reconstructs the tools from scoped catalog records and rejects a changed effective binding.
  - order: 35
    action: Run NL2Skill through its Management route, reject another conversation, and disconnect a second run.
    expected: The authorized stream retains the Skill events and closes its Runtime worker when disconnected.
  - order: 36
    action: Run NL2Agent through Management, call the scoped draft tool, and close a second Runtime stream.
    expected: Only the bound draft is written, the first interactive card ends its run, and a closed grant cannot be reused.
  - order: 37
    action: Fetch a mounted independent AIDP image after its signed Workbench run, then try a foreign user, tenant or revoked mount.
    expected: Only the authorized image reaches its provider and the image response is not cached.
  - order: 38
    action: Start a public planning debug run through the signed ephemeral Runtime endpoint and stop it using the debug run ID.
    expected: The two planning events preserve their order, the worker is released, and no conversation or shared plan key is written.
  - order: 39
    action: Run a scoped public debug request through AgentOS and wait for the scope event before allowing SDK output.
    expected: The resolved scope and warning arrive before the planning events without persisting a conversation.
  - order: 40
    action: Submit a first native conversation turn with metadata, then an existing native turn with an empty object.
    expected: The signed snapshots carry the initial or cleared value and response revision, and retries do not admit another turn.
  - order: 41
    action: Reconnect to a closed prepared conversation without a run ID, then try the same conversation from another tenant.
    expected: Management returns the legacy terminal JSON for the owner and refuses the foreign request without a Runtime call.
  - order: 42
    action: Reconnect to a registered legacy execution without a run ID and follow replay and live events over AgentOS.
    expected: Management uses the registered execution and returns legacy status frames, replay count, and the final status.
  - order: 43
    action: Send unsigned, tampered, invalid signed, and valid signed requests to both retired conversation-scoped background routes.
    expected: Runtime authenticates and validates the requests, returns 410 for valid signed input, and does not dispatch any work.
  - order: 44
    action: Reconnect without a cursor after the legacy projection is committed and the journal is unavailable, then repeat with a foreign tenant and an owned conversation without an assistant.
    expected: Management confirms the receipt through the signed run inspection operation. Foreign scope is refused before inspection, and the empty conversation does not contact Runtime.
  - order: 45
    action: Compile explicit invocation parameters for direct and Skill-derived MCP tools and send the prepared run over signed HTTP.
    expected: Runtime applies the declared overrides to SDK tool calls and continues to reject changed connection credentials or Skill bindings.
  - order: 46
    action: Compile a local search override and an ignored LangChain request parameter, then send the prepared run over signed HTTP.
    expected: The search provider receives the requested result count with the stored credential. The plugin keeps its invocation behavior, and a signed attempt to override a credential is refused.
  - order: 47
    action: Submit a public debug request with a client conversation correlation ID and cancel the debug run through the standard AgentOS lifecycle endpoint.
    expected: Management echoes the client ID and Runtime receives only the temporary run ID. The original planning and scoped cancellation behavior is preserved.
  - order: 48
    action: Submit a signed old Northbound request whose user message is already saved, retry it, and attempt the same operation with a foreign actor.
    expected: Runtime delegates saved-message selection to Management. The exact actor and message position produce a stable claim and only one execution; a compatibility fallback skips user persistence. Retry returns the existing run and a foreign source is refused before claiming or executing.
  - order: 49
    action: Send the original fixed-run-ID background request through Runtime and Management, repeat a prepared request and disconnect a waiting request.
    expected: Both service signatures bind the original actor and run ID. Management keeps the selected model and tool configuration, records projection before Agent.run and owns projection without finalizing the schedule. The explicit old-path fallback executes once. Retry replays the same run, foreign actors are refused and disconnect stops only that run.
  - order: 50
    action: Send an original internal debug request through the signed Management handoff, then exercise an unsupported export and an invalid handoff.
    expected: Management reuses the original preparation policy and configuration. Supported resources execute through AgentOS ephemeral run; unsupported resources retain one explicit fallback with the original query. Debug and correlation headers survive. Original scope denial and invalid invocation combinations cannot execute.
  expected_results:
  - Authorized operations preserve principal, body, stream events and stop JSON.
  - Invalid credentials, modified requests and unknown versions do not dispatch.
  - Evaluation returns exact ordered events without using a real conversation.
  - Background execution returns the exact run ID and assistant message ID, and stops after the caller disconnects.
  - Prepared evaluation returns ordered events and releases the run registration and staged skill files. Unauthorized requests cannot start the runner.
  - Resume returns only events after the supplied cursor and never opens a journal for an unauthorized actor.
  - Management relays the Runtime response and run ID while preserving the signed scope and request context.
  - The admission claim returns the original run identity on retry without starting a second execution.
  - Run lifecycle commands preserve actor and run isolation, report the latest event cursor and distinguish a cancellation request from terminal status.
  - Public stop and background execution use the run-scoped protocol, preserve the signed actor and reject foreign scope.
  - Prepared conversation execution starts once and is resumable independently of the submit connection.
  - The prepared automation runner preserves the saved knowledge restriction, recovers the same scoped run and commits its assistant message after the lost acknowledgement.
  - The public route retains the signed cursor and presents the prepared output without exposing internal artifact paths.
  - Planning runs use built-in tool bindings and Runtime-managed plan storage.
  - One prepared public submission creates one Runtime execution and one assistant projection.
  - The SDK tool emits the original proposal event while only the signed owned turn may create it.
  - First-turn submission keeps one conversation, run, and original creation event.
  - Northbound uses signed prepared admission and projection without a duplicate user write or exposing journal control frames.
  - Northbound passes explicit metadata only as a signed prepared snapshot and retains the response version header.
  - A prepared Workbench turn preserves its resolved configuration event, version and single projection.
  - Workbench preserves the authorized local knowledge scope event and dispatches its scoped search binding once.
  - The signed ephemeral stream retains observer events and releases request-owned execution on disconnect.
  - Workbench preserves both configuration and metadata revisions across signed admission and one projection.
  - Workbench carries a scoped shared AIDP catalog binding and Runtime enforces the narrowed KDS scope.
  - A clarification response produces one signed prepared run and stays in Management history.
  - Runtime applies the explicit temperature from the signed root model while reading provider credentials locally.
  - A debug run has no persistent conversation and releases its worker and temporary resources after scoped cancellation.
  - Native knowledge scope preserves the public warning without leaking the revoked index into Runtime.
  - Agent Memory store preserves the receipt on replay and does not dispatch untrusted or out-of-scope writes.
  - Prepared Memory preserves retrieved context, search event order and the signed scope of a local store.
  - Prepared Memory notifies Management after local persistence. A notification cannot supply stored content or cross owner boundaries.
  - Memory-enabled public turns use signed prepared admission and record completion work with the owned assistant projection.
  - Automation recovery uses the original Memory Agent and prompt message under the owned automation projection.
  - Workbench root Skill execution pins visible Skill files and effective settings without transporting Skill configuration values.
  - Mounted Skills contribute only their authorized Local, MCP, and LangChain tools without transporting credentials or plugin code.
  - Management retains Skill SSE and history. Signed Runtime runs the selected model, reports one safe failure, and stops on disconnect.
  - NL2Agent uses signed bidirectional transport for execution and tools. Closing the stream revokes draft access.
  - Workbench image retrieval is bound to the admitted conversation and current mounted tool and does not transport credentials in the signed URL.
  - The request-owned debug plan stays local and retains the original plan and plan step events.
  - Management emits the resolved debug scope before Runtime observer output and retains unavailable warnings locally.
  - Native metadata follows the prepared admission path, remains scoped to its conversation, and keeps the public version header.
  - A cursorless request for a terminal prepared turn is settled by Management using the owned projection.
  - Registered legacy journals resume without invoking the compatibility execution router.
  - Retired background start and inspection require a run ID and cannot enter an execution handler.
  - Management preserves the terminal and empty conversation JSON without using the compatibility execution route.
  - MCP snapshots carry explicit invocation overrides and keep persisted defaults and connection configuration in Runtime.
  - Local search tuning reaches the provider without carrying credentials. A plugin continues to use its invocation arguments.
  - Debug correlation is kept at the public boundary and debug cancellation uses signed Agent.stop.
  - Saved-user compatibility requests use the original message identity and never execute or persist the user twice.
  - Background requests retain their original run identity and configuration through the signed Management handoff, recover without a second start and propagate disconnect cancellation.
  - Raw internal debug requests preserve their original preparation policy, model and tool configuration, metadata, response headers and single execution across signed service boundaries.
  forbidden_side_effects:
  - Rejected calls must not invoke any execution handler.
  - Verification must release temporary loopback servers.
  integration_boundary:
  - Actual Management AgentOS HTTP client and Runtime router behind the downstream
    signature middleware; controlled execution sink.
  observations:
  - HTTP status, stream bytes, stop response and recorded invocations.
  cleanup:
  - Close HTTP streams and stop temporary servers.
