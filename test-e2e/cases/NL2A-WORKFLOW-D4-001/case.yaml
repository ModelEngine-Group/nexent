schema_version: '1.0'
stage: D4
module: NL2A-WORKFLOW
case:
  case_id: NL2A-WORKFLOW-D4-001
  feature_id: F-045
  requirement_ids: [NL2AGENT-WORKFLOW-PROGRESS-20261113]
  business_rule_ids: [F-045-RULE-02, F-045-RULE-11]
  title: NL2Agent shows fixed workflow steps from trusted facts across matching, waiting and replay
  type: E2E
  priority: P1
  status: active
  automation: automated
  objective: Verify the real editor panel projects trusted execution and historical facts without model-generated progress or business writes.
  preconditions:
    - Local frontend is available with isolated authorized editor API fixtures and controlled creator SSE/history responses.
  test_data:
    profile: controlled browser APIs, editable draft, fuzzy and hybrid runs, trusted cards and completion receipts
  steps:
    - order: 1
      action: Open the Agent editor, submit a request, return fuzzy matching progress and a coverage card.
      expected: No step card appears before an actual creation run. During creation four steps stay above the scroll region, coverage waits, and fuzzy matching has no semantic failure warning.
    - order: 2
      action: Start a hybrid run, return index/search/verification progress and a binding card, then return to requirement clarification.
      expected: Matching details reflect trusted stages, binding waits without a spinner, and returning requirements moves the current step back without duplicate tool calls. The higher-scoring DataMate alternative appears before the native knowledge tool and starts selected; the user can select the lower-scoring native tool without an automatic binding write.
    - order: 3
      action: Return generation saves, a controlled generation failure, and then a trusted completion receipt in a subsequent turn.
      expected: Saves alone do not mark complete, failure remains retryable, only completion marks the final step complete.
    - order: 4
      action: Restore a creator conversation and start a new conversation; inspect a narrow panel and scroll the chat.
      expected: Creation history restores the correct step; inactive historical resource cards retain their recorded installation status without querying the latest status. New conversation hides the card, optimization of an existing draft stays hidden, and active creation fits narrow panels without overflow.
  expected_results:
    - Steps and matching details accurately reflect trusted current workflow facts and explicit waiting states.
    - Completion, rollback and historical replay preserve user control without false success or stale progress.
    - The header is fixed outside chat scrolling and fits desktop and narrow panels.
    - Server recommendation order and defaults are rendered faithfully while manual resource choice remains under user control.
  forbidden_side_effects:
    - No extra model progress fields, calls, Agent update or persistent resource creation is introduced by the step display.
    - Assistant text or cross-target state does not advance the steps.
  actor: Authorized controlled tenant user
  journey: [Open editor, Discover resources, Review coverage, Bind resources, Return requirements, Generate, Restore history, Start new conversation]
  final_business_result:
    - The user can tell the current step and required next action while the existing creator workflow remains authoritative.
    - The binding card preserves score-based defaults and optional native knowledge selection under user control.
  failure_evidence: [Browser assertions, failed-step screenshot and trace]
  acceptance:
    - id: AC-KNOWLEDGE-CHOICE
      description: The binding card renders the higher-scoring DataMate tool first and selected, retains the lower-scoring native tool as an alternative, and allows manual changes without a binding write.
      steps: [2]
      expected_results: [4]
      forbidden_side_effects: [1]
    - id: AC-STEPS
      description: Fixed workflow and matching details follow current trusted facts and waiting states.
      steps: [1, 2]
      expected_results: [1, 3]
      forbidden_side_effects: [1, 2]
    - id: AC-REPLAY
      description: Generation completion, returning requirements and replay/reset do not fabricate or leak progress. Inactive historical cards retain recorded installation status and make no latest-status request.
      steps: [2, 3, 4]
      expected_results: [2, 3]
      forbidden_side_effects: [1, 2]
