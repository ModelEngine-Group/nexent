schema_version: '1.0'
stage: D5
module: V5-BASELINE
case:
  case_id: DEP-AUTO-2D0252F1DB402184
  feature_id: V5-DEP-AUTO-2D0252F1DB402184
  business_rule_ids:
  - V5-DEP-AUTO-2D0252F1DB402184-RULE-01
  title: MCP 标签历史数据迁移完整性（mcp_record.tags / mcp_community.tags / mcp_market.tags → 统一标签管理 backfill）
  type: DEPLOYMENT
  priority: P1
  status: active
  automation: automated
  objective: 风险：v2.5.2 迁移将 mcp_record.tags / mcp_community.tags / mcp_market.tags 迁入统一标签管理（utm_legacy_source → tag_definition
    'keywords' / tag_value / resource_tag_assignment）时，历史数据若存在空标签、软删除（delete_flag='Y'）记录或无法唯一归属的社区/市场关联（source_mcp_id 缺失或多匹配）记录，可能导致标签丢失、重复、软删除记录复活为
    active、跨租户/跨资源串标，或迁移静默丢弃数据后 MCP 服务的 list 与 tag stats 读取与源数据不一致，影响标签筛选与已发布详情展示。
  preconditions:
  - '- deploy/sql/migrations/v2.5.2_unified_tag_management.sql（被测迁移脚本）

    - 迁移前种子 fixture：nexent.mcp_record_t / mcp_community_record_t / mcp_market_record_t 样例（含多标签、大小写/空白差异、delete_flag ''N''/''Y''、空数组与
    NULL tags、市场 source_mcp_id 可解析与不可解析）

    - ${NEXENT_TEST_HOME}/config/secrets.env（测试 PostgreSQL 连接，不含生产凭据）'
  test_data:
    legacy_asset_declaration: '- deploy/sql/migrations/v2.5.2_unified_tag_management.sql（被测迁移脚本）

      - 迁移前种子 fixture：nexent.mcp_record_t / mcp_community_record_t / mcp_market_record_t 样例（含多标签、大小写/空白差异、delete_flag ''N''/''Y''、空数组与
      NULL tags、市场 source_mcp_id 可解析与不可解析）

      - ${NEXENT_TEST_HOME}/config/secrets.env（测试 PostgreSQL 连接，不含生产凭据）'
  steps:
  - order: 1
    action: 在独立测试 PostgreSQL schema（nexent）装载迁移前种子数据：mcp_record_t 写入多标签记录（含 normalize 后等价的大小写/首尾空白标签）、delete_flag='N' 与 'Y'
      各若干、tags 为空数组与 NULL 的记录；mcp_community_record_t 与 mcp_market_record_t 写入带标签记录（market.source_mcp_id 分别指向唯一 mcp_record、指向不存在记录、指向多个记录）。
    expected: mcp_record.tags 中所有非空标签按归一化规则完整迁入统一标签管理，无丢失、无重复；active 分配计数与源去重标签数一致。
  - order: 2
    action: 记录迁移前基线：将各源表非空 tags 逐条展开为 (tenant_id, resource_type, resource_id, lower(btrim(tag))) 去重集合，并记录各记录的 delete_flag
      分布。
    expected: delete_flag='Y' 记录的分配为软删除状态，不出现在 active 读取与 tag stats 中，也不复活为 active。
  - order: 3
    action: 在事务中执行 deploy/sql/migrations/v2.5.2_unified_tag_management.sql，观察 utm_legacy_source → utm_normalized_source →
      tag_definition/tag_value/resource_tag_assignment 的迁移结果。
    expected: 空或 NULL tags 不产生任何标签定义值或分配行，无脏数据残留。
  - order: 4
    action: 校验 mcp_record.tags 迁移完整性：对 resource_type='mcp_service' 且 delete_flag='N' 的记录，断言 tag_value.normalized_value 与源
      tags 归一化后逐项一致（无丢失、无重复），active resource_tag_assignment 行数与源去重标签数一致。
    expected: 无法唯一归属的 mcp_community / mcp_market 记录触发迁移阻断并返回可见冲突明细，不静默丢弃、不错误归属到其它租户或资源。
  - order: 5
    action: 校验 delete_flag 传播：对 delete_flag='Y' 的 mcp_record，断言对应 resource_tag_assignment.delete_flag='Y'（软删除而非硬删除或复活为 active），且不计入
      active 读取与容量检查统计。
    expected: 迁移可幂等重放，唯一约束不被违反，无重复标签或重复分配。
  - order: 6
    action: 校验空标签：断言 tags 为 NULL 或 '[]' 的记录不产生任何 tag_value / resource_tag_assignment 行，不残留脏数据。
    expected: 迁移后读取接口返回与源数据一致的标签集合，且无跨租户串扰，限制（limit≤100）生效。
  - order: 7
    action: 校验 community/market 关联记录无法唯一归属：断言 canonical_match_count=0 的 mcp_community.tags 进入 utm_conflict（community_canonical_source_unprovable）并触发迁移
      RAISE EXCEPTION 阻断，不静默丢弃；mcp_market.tags 在 source_mcp_id 零匹配/多匹配时分别产生 canonical_source_missing_or_tenant_mismatch /
      canonical_source_ambiguous 冲突并阻断。
    expected: 迁移后读取接口返回与源数据一致的标签集合，且无跨租户串扰，限制（limit≤100）生效。
  - order: 8
    action: 校验幂等与唯一性：在干净状态重复执行迁移，断言 ON CONFLICT 合并后仍满足 uq_tag_value_active_normalized_value 与 resource_tag_assignment 唯一约束，无重复
      tag_value 或重复 assignment。
    expected: 迁移后读取接口返回与源数据一致的标签集合，且无跨租户串扰，限制（limit≤100）生效。
  - order: 9
    action: 校验读取路径：通过 backend/services/tag_management_service.py 的 list_resource_assignments / get_legacy_flat_tags_projection
      读取迁移后的 mcp_service 标签，断言返回 display_value 集合与源标签一致、去重且 limit≤100，无跨租户串扰。
    expected: 迁移后读取接口返回与源数据一致的标签集合，且无跨租户串扰，限制（limit≤100）生效。
  expected_results:
  - mcp_record.tags 中所有非空标签按归一化规则完整迁入统一标签管理，无丢失、无重复；active 分配计数与源去重标签数一致。
  - delete_flag='Y' 记录的分配为软删除状态，不出现在 active 读取与 tag stats 中，也不复活为 active。
  - 空或 NULL tags 不产生任何标签定义值或分配行，无脏数据残留。
  - 无法唯一归属的 mcp_community / mcp_market 记录触发迁移阻断并返回可见冲突明细，不静默丢弃、不错误归属到其它租户或资源。
  - 迁移可幂等重放，唯一约束不被违反，无重复标签或重复分配。
  - 迁移后读取接口返回与源数据一致的标签集合，且无跨租户串扰，限制（limit≤100）生效。
  forbidden_side_effects: []
