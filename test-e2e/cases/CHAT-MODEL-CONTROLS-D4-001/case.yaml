schema_version: '1.0'
stage: D4
module: CHAT-MESSAGE
case:
  case_id: CHAT-MODEL-CONTROLS-D4-001
  feature_id: CHAT-MODEL-CONTROLS
  requirement_ids:
  - SESSION-MODEL-UNIFY-20261020
  - CHAT-MODEL-CONTROLS-20261014
  - CHAT-WORKBENCH-REFINEMENTS-20261015
  business_rule_ids:
  - CHAT-MODEL-CONTROLS-RULE-001
  - CHAT-MODEL-CONTROLS-RULE-002
  - CHAT-MODEL-CONTROLS-RULE-003
  title: 四个创建入口使用共享选模并提交有效模型与思考配置
  type: E2E
  priority: P0
  status: active
  automation: automated
  objective: Verify browser journeys on all four creator surfaces, including NL2Agent welcome and follow-up, serialize the
    visible model/controls through the actual frontend adapter.
  preconditions:
  - use the real frontend and isolated authenticated mock creator, model directory and deterministic generation SSE endpoints.
  - Workbench ordinary view, editable Agent draft and SkillBuildModal are available; tenant default A differs from selected
    B.
  test_data:
    profile: mock
    entries:
    - workbench-agent-create
    - workbench-skill-create
    - independent-nl2agent
    - independent-nl2skill
    models:
    - default-A
    - effort-B
    - budget-B
    - plain-model
    supported_efforts:
    - none
    - minimal
    - low
    - medium
    - high
    - xhigh
    - max
    localized_xhigh:
      zh: 极高
      en: Extra high
    output_fixtures:
    - agent-clarification-then-non-model-draft-update
    - skill-structured-files
  steps:
  - order: 1
    action: Enter each creator through its real navigation/mode action; open the shared model menu on the initial composer,
      select effort-B, enable thinking and select xhigh.
    expected: All four expose the shared controls and tenant LLM candidates; effort options match capability with correct
      localized labels, including high distinct from xhigh. NL2Agent initial welcome can select before the first message.
  - order: 2
    action: Send a fixed creation request, inspect the actual frontend POST, consume deterministic clarification/structured
      file events, then send a follow-up from the subsequent composer.
    expected: Both turns use B and true/xhigh through the original route; custom defaults do not replace B. Existing agent_id,
      history, attachments, language, draft_snapshot, persistence and retry fields retain their route meanings; canonical conversation preference snapshots agree with the effective controls; Workbench config contains resources only. NL2Agent draft updates and NL2Skill file views remain usable.
  - order: 3
    action: Reset the effort override to its inherited outlet value and explicitly send; disable thinking and send; switch to budget-B and choose
      a valid concrete budget; then inspect plain-model controls.
    expected: Requests preserve inherited versus disabled versus budget intent with no concrete effort/budget conflict; plain
      model has no fabricated levels. The menu's enabled state does not change capability values and original messages/drafts
      remain visible. Thinking off collapses the effort or budget row, and enabling restores applicable configured reasoning
      defaults without changing candidate capability.
  expected_results:
  - Four creators share the same capability-derived selection UI, including the initial and subsequent NL2Agent composer.
  - Captured real frontend requests and shared conversation preference snapshots match visible effective selections, while original creation events
    and draft interfaces remain functional.
  forbidden_side_effects:
  - No real provider calls, global model mutations or unrelated real database writes from browser mock fixtures.
  - No silent default-model override, unrelated target Agent model update, invented effort value or duplicate message from
    merely changing the model.
  actor: Isolated tenant user with agent:create and skill:create
  journey:
  - Open creator entry
  - Select non-default model
  - Enable supported thinking
  - Send first request
  - Consume original creation events
  - Send follow-up
  - Exercise inherited/off/budget/plain model
  final_business_result:
  - Creator selection is visible and reaches real frontend serialization consistently without disturbing creation flows
  failure_evidence:
  - Browser trace and screenshots
  - Sanitized captured POST bodies and mocked event log
  execution:
    profiles:
    - name: mock
      required_services: []
  acceptance:
  - id: AC-01
    description: Shared creator controls and initial/follow-up request state agree through real browser actions.
    steps:
    - 1
    - 2
    - 3
    expected_results:
    - 1
    - 2
    forbidden_side_effects:
    - 1
    - 2
