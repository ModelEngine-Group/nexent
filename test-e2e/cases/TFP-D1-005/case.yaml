schema_version: '1.0'
stage: D1
module: RUNTIME-SANDBOX
case:
  case_id: TFP-D1-005
  feature_id: TFP-001
  requirement_ids:
  - TFP-001
  business_rule_ids:
  - TFP-RULE-004
  title: Exceptions, cancellation and cleanup are safe
  type: SDK-UT
  priority: P0
  status: active
  automation: automated
  objective: Exceptions, cancellation and cleanup are safe
  preconditions:
  - Use isolated official tool instances and a controlled executor factory.
  test_data:
    profile: mock
  steps:
  - order: 1
    action: Fail an approved tool, close an unused wrapper, fail workspace or variable initialization and cancel during acquisition.
    expected: No failed call is replayed and acquired resources close once.
  - order: 2
    action: AIDP provider errors propagate without acquiring or replaying through Docker.
    expected: The existing AIDP authorization and complete-step routing contract is preserved.
  - order: 3
    action: Fail JSON parsing between admitted imports, then reuse completed imports or activate ordinary code. Fail or cancel
      import restoration during activation.
    expected: Do not replay errors, tools or unfinished imports; preserve actual bindings and release acquired executors exactly
      once.
  expected_results: &id001
  - Local errors do not trigger remote replay.
  - JSON errors retain only executed imports and never acquire an executor by themselves.
  - Failed or cancelled import restoration releases the acquired executor without replay.
  - Cleanup is idempotent.
  - Cancellation before execution prevents tool calls and releases acquired resources.
  - AIDP provider errors propagate without acquiring or replaying through Docker.
  forbidden_side_effects:
  - No initialization during cleanup.
  - No execution after cancellation.
  unit_boundary: Restricted AST admission, real LocalPythonExecutor and NexentAgent executor lifecycle
  inputs:
  - Exceptions, cancellation and cleanup are safe
  assertions: *id001
