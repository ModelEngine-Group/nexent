schema_version: "1.0"
stage: D3
module: AIDP-KNOWLEDGE
case:
  case_id: AIDP-ONTOLOGY-D3-001
  feature_id: AIDP-ONTOLOGY
  business_rule_ids: [AIDP-ONTOLOGY-RULE-01, AIDP-ONTOLOGY-RULE-02, AIDP-ONTOLOGY-RULE-03, AIDP-ONTOLOGY-RULE-04]
  title: Real backend to AIDP mock ontology runtime
  type: INTEGRATION
  priority: P0
  status: active
  automation: automated
  objective: >-
    Run the actual proxy service over HTTP against the standalone AIDP mock, covering CRUD, binding counts, export/import round trips, partial failures, async acceptance and chunk metadata read-back.
  preconditions:
    - The standalone AIDP mock runs on a loopback port with an isolated state file.
  test_data:
    profile: mock
    data: "logical fixtures for AIDP-ONTOLOGY-D3-001"
  steps:
    - order: 1
      action: >-
        Create a domain and Type/Entity, bind a knowledge base and refresh entities.
      expected: >-
        AIDP persists the objects; bound_kb_count changes from 0 to 1 and the same value appears on every entity row.
    - order: 2
      action: >-
        Export the seeded ontology and import it into another domain twice.
      expected: >-
        First import creates the objects; the second skips existing (api_name, kind) pairs; relations keep endpoint kinds.
    - order: 3
      action: >-
        Trigger a configured partial import failure and an async import over 200 items.
      expected: >-
        Partial counts/errors are returned; async acceptance exposes a task ID and no counts or progress polling.
    - order: 4
      action: >-
        Annotate seeded chunks and re-read them; delete an in-use field.
      expected: >-
        Saved metadata is visible in list/detail; partial annotation reports the failed chunk; the in-use delete is rejected without losing values.
  expected_results:
    - The real HTTP path preserves Nexent permissions and AIDP error messages.
    - Bindings and counts stay consistent.
    - Export/import round trips and skipped duplicates are observable.
  forbidden_side_effects:
    - Do not call the AIDP internal task API.
    - Do not mutate any shared or historical data directory.
  unit_boundary: Nexent router and service over real HTTP to the AIDP mock
  inputs:
    - seeded mock state
    - HTTP requests
  assertions:
    - Objects persist through AIDP.
    - Counts refresh after bind/unbind.
    - Sync, partial and async paths are distinguished.
  acceptance:
    - id: AC-01
      description: >-
        The backend-to-AIDP runtime preserves ontology, binding and JSON behavior.
      steps: [1, 2, 3, 4]
      expected_results: [1, 2, 3]
      forbidden_side_effects: [1, 2]

  integration_boundary:
    - Nexent ontology router and service
    - real HTTP to the standalone AIDP mock
  observations:
    - Created domain and Type/Entity objects are visible after re-query.
    - The entity row count changes after binding and unbinding a knowledge base.
    - Export/import round trips preserve types, entities and relation endpoint kinds; repeats skip existing pairs.
    - Partial and asynchronous acknowledgments are distinguishable.
    - The list returns the filtered total for pagination and preserves optional demo fields.
    - A domain with no bindings reports 0, not an unavailable value.
  cleanup:
    - Stop the loopback AIDP mock and remove its isolated state file.
    - No shared deployment, historical data or browser state is touched.

