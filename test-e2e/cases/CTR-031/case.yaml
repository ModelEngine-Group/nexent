  integration_boundary:
  - Nexent HTTP API到本地真实A2A协议；自定义发现Header与刷新持久化。
  observations:
  - 返回动态ID、名称及协议接口，source URL与本次请求一致
  - 刷新成功，wire记录证明发现和刷新都携带同一自定义Header
  - 资源不存在，wire证据脱敏归档
  cleanup:
