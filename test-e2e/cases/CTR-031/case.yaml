  objective: URL Agent Card discover + custom headers｜核心流程
  preconditions:
  - Nexent本地服务与A2A Mock就绪，无其他故障注入批次。
  - config/a2a.yaml符合仓库Schema；控制令牌从配置引用的环境变量或secrets.env读取。
  - 使用本次唯一source URL与动态资源ID，不借用历史Agent。
  test_data:
    configuration: config/a2a.yaml
    mock_service: a2a-agent
  steps:
  - order: 1
    action: 通过Nexent发现带唯一source URL的受控Agent并传入本次自定义Header
    expected: 返回动态ID、名称及协议接口，source URL与本次请求一致
  - order: 2
    action: 通过Nexent刷新同一Agent Card
    expected: 刷新成功，wire记录证明发现和刷新都携带同一自定义Header
  - order: 3
    action: 删除本次Agent并回读
    expected: 资源不存在，wire证据脱敏归档
  expected_results:
  - 返回动态ID、名称及协议接口，source URL与本次请求一致
  - 刷新成功，wire记录证明发现和刷新都携带同一自定义Header
  - 资源不存在，wire证据脱敏归档
  forbidden_side_effects: []
