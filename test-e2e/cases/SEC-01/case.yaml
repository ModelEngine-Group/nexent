case:
  case_id: SEC-01
  feature_id: V5-SEC-01
  business_rule_ids:
  - V5-SEC-01-RULE-01
  title: 跨租户IDOR矩阵
  type: SECURITY
  priority: P0
  status: active
  automation: automated
  objective: 所有带tenant/user/group/resource/provider_config id的读写接口不能被猜ID越权，外部记忆 provider 配置/测试端点需按 tenant 隔离且无未授权副作用。
  preconditions:
  - '- ${NEXENT_TEST_HOME}/config/users.yaml

    - ${NEXENT_TEST_HOME}/config/secrets.env'
  test_data:
    legacy_asset_declaration: '- ${NEXENT_TEST_HOME}/config/users.yaml

      - ${NEXENT_TEST_HOME}/config/secrets.env'
  steps:
  - order: 1
    action: 使用本地隔离账号/资源准备“跨租户IDOR矩阵”正常基线，记录资源ID和初始状态。
    expected: 0个跨租户资源泄露；敏感存在性尽量不暴露；写入无副作用。
  - order: 2
    action: 用UserA创建资源，UserB/SameTenantOtherGroup/OtherTenant直接调用每个资源ID接口；检查401/403/404和DB无变化；会话历史读取允许返回200且data为空列表，但不得泄露资源内容，写入仍必须拒绝。
    expected: 0个跨租户资源泄露；敏感存在性尽量不暴露；写入无副作用。
  - order: 3
    action: 外部记忆provider专项：UserA（TenantA）通过POST /memory/providers创建provider配置，记录返回的provider_config_id与params；UserB（TenantB）以该provider_config_id直访GET/PUT/DELETE
      /memory/providers/{provider_config_id}、POST /memory/providers/{provider_config_id}/test-search、POST /memory/providers/{provider_config_id}/test-ingest。
    expected: 0个跨租户资源泄露；敏感存在性尽量不暴露；写入无副作用。
  - order: 4
    action: 验证UserB的上述请求均返回401/403/404，且TenantA的provider配置未被读取/修改/软删除，last_error_code未被回写。
    expected: 0个跨租户资源泄露；敏感存在性尽量不暴露；写入无副作用。
  - order: 5
    action: 所有越权/攻击请求必须直接命中真实本地API/浏览器入口，不能只检查按钮隐藏。
    expected: 0个跨租户资源泄露；敏感存在性尽量不暴露；写入无副作用。
  - order: 6
    action: 每个攻击变体执行后重新检查memory_provider_config_t与memory_provider_config_param_t（delete_flag、enabled、params、last_error_code）及会话状态，确认失败请求无副作用。
    expected: 0个跨租户资源泄露；敏感存在性尽量不暴露；写入无副作用。
  - order: 7
    action: 扫描HTTP响应、backend/frontend日志、Playwright trace中是否出现secret/api_key/内部路径/敏感堆栈。
    expected: 0个跨租户资源泄露；敏感存在性尽量不暴露；写入无副作用。
  - order: 8
    action: 保存脱敏请求响应、失败截图/trace（如有UI）、资源前后状态到当次run目录。
    expected: 0个跨租户资源泄露；敏感存在性尽量不暴露；写入无副作用。
  expected_results:
  - 0个跨租户资源泄露；敏感存在性尽量不暴露；写入无副作用。
  forbidden_side_effects: []
