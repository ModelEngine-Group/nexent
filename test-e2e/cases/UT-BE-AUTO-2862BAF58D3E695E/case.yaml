  unit_boundary: 运行时状态
  inputs:
  - '- 无外部本地资产；使用测试内联 fake ThreadManager / fake Redis client，并通过 monkeypatch 控制 consts.RUNTIME_STATE_REDIS_URL。'
  assertions:
  - 注入 manager 时所有异步封装方法均经 lane="control-io"、owner="services.runtime_state_service" 与对应固定 task_name 的 ManagedTaskSpec 调用 ThreadManager.run，不发生直接同步调用。
  - 未注入 manager 时回退为直接调用对应同步方法，返回值与同步方法一致。
  - managed 与 direct 两条路径对 stop/resume、取消信号、流事件读写的 Redis 写入/读取结果一致，共享 Redis 的服务副本可读回一致状态；reset_stream 清除上一轮取消，register_run 保留准备期间新产生的 Stop，其他用户/会话状态不变。
  - 同步方法捕获异常后返回安全默认值（{} / None / False / []），不向上抛出未处理异常；client 在缺失 RUNTIME_STATE_REDIS_URL 或未安装 redis 时抛 ValueError。
  - 日志/Trace/报告中不出现明文 API Key/Token/Password/模型密钥。
