schema_version: '1.0'
stage: D4
module: AGENT-EDITOR
case:
  case_id: AGENT-EDITOR-D4-004
  feature_id: AGENT-EDITOR-WORKFLOWS
  requirement_ids:
  - AGENT-EDITOR-REQ-004
  business_rule_ids:
  - AGENT-EDITOR-RULE-004
  title: Cancel resource selection without changing associations
  type: E2E
  priority: P1
  status: active
  automation: automated
  objective: Cancelling all five resource drawers preserves original associations
    and leaves no blocking overlay or business mutation.
  preconditions:
  - A running frontend is reachable; deterministic existing HTTP fixtures isolate
    Agent data, authorization and model/resource boundaries.
  test_data:
    profile: mock
    locale: zh
    viewport:
      width: 1920
      height: 1080
  steps:
  - order: 1
    action: Open an editable draft and capture its original resources.
    expected: The existing model and knowledge association are displayed.
  - order: 2
    action: Open and close model, knowledge, skill, tool and child-Agent drawers without
      selecting resources.
    expected: Each drawer is reachable and cancellation removes its overlay.
  - order: 3
    action: Reload the editor and inspect resource associations.
    expected: Original resources remain selected and no update request has been sent.
  expected_results:
  - Cancelling all five resource drawers preserves original associations and leaves
    no blocking overlay or business mutation.
  forbidden_side_effects:
  - No unrelated writes, publication or Agent/model execution; only explicitly requested
    creation/autosave writes are allowed.
  actor: Authorized Agent development user
  journey:
  - Open an editable draft and capture its original resources.
  - Open and close model, knowledge, skill, tool and child-Agent drawers without selecting
    resources.
  - Reload the editor and inspect resource associations.
  final_business_result:
  - Cancelling all five resource drawers preserves original associations and leaves
    no blocking overlay or business mutation.
  failure_evidence:
  - Fixed Playwright journey assertions, sanitized request payloads and terminal audit.
  acceptance:
  - id: AC-01
    description: Cancelling all five resource drawers preserves original associations
      and leaves no blocking overlay or business mutation.
    steps:
    - 1
    - 2
    - 3
    expected_results:
    - 1
    forbidden_side_effects:
    - 1
