    - name: mock
      required_services: []
  risk_type: DEPLOYMENT
  risk: 持久单节点与共享目录部署可恢复，错挂载明确失败
  condition:
  - 独占部署且操作者显式允许切换；产品开关实现后再登记 deployment-exceptions profile 与 Local recovery Case
  metrics:
  - 跨实例读写成功
  - 错误挂载误接受数
  - 容器重建后已确认丢失
  - Local恢复/cleanup
  thresholds:
  - 合法交叉读写成功
  - 错误挂载误接受=0，进程/容器重建后确认丢失=0
  - 恢复与cleanup全部成功；永久宿主盘丢失按另行定义RPO/RTO验证
  recovery_expectations:
  - 恢复原 Local 部署与持久卷，执行既有聊天 Case 和该 Case 的冷读取回归；保留恢复证据。
