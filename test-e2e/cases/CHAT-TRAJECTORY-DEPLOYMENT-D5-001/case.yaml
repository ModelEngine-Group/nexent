schema_version: '1.0'
stage: D5
module: CHAT-MESSAGE
case:
  case_id: CHAT-TRAJECTORY-DEPLOYMENT-D5-001
  feature_id: CHAT-TRAJECTORY
  requirement_ids:
  - CHAT-LOCAL-TRAJECTORY-20261103
  business_rule_ids:
  - TRJ-RULE-007
  - TRJ-RULE-006
  title: 持久单节点与共享目录部署可恢复，错挂载明确失败
  type: DEPLOYMENT
  priority: P0
  status: blocked
  automation: automated
  objective: 持久单节点与共享目录部署可恢复，错挂载明确失败
  preconditions:
  - 后端配置、采集、查询和清理接口已实现；本 Case 的真实容器/共享卷部署环境、固定脚本和 case-local execution.yaml 待就绪。
  - 使用隔离测试会话、租户和独占轨迹根目录；记录被测提交、配置快照和本用例资源清单。
  - 读取使用可信ADMIN/SU身份，目标会话由独立普通用户创建；actor与owner区分，非管理员读取应拒绝。
  - 业务trace_id直接复用现有conversation_id；菜单按用户→最近根智能体→会话，打开后读取整个会话范围；PG复用现有表结构和查询，轨迹正文及执行清单全部为文件。
  - 基于现有MonitoringManager，通过MONITORING_TRACE_SINK选择otlp/local_file/both；本地业务正文为正文内嵌的标准OTLP JSONL，会话meta.json保存归属、执行清单和确认进度。
  - 目录使用tenant/user/storage_agent/conversation业务ID，storage_agent_id固定为首次采集根Agent；稳定owner/会话锁串行首次定位与登记。会话切换根Agent仍读写同一物理目录。
  - 所有正文内嵌OTLP Span属性/Events；256KiB为批量刷盘阈值，单行可更大。读写须处理大型字符串的增量编码/解码，正文API按解码后的UTF-8区间返回。
  - 清理服务具备可控UTC时钟与独占文件夹具；定期默认30天/3600秒，可关闭；主动POST /trajectory/cleanup固定可信租户和首次截止时间，需在真实部署模式验证。
  test_data:
    profile: mock
  steps:
  - order: 1
    action: 记录PG定义和原监控行为，通过environment→bootstrap→MonitoringConfig验证默认otlp、local_file/both及非法目标；本地模式关闭Metrics，使用single_node持久卷归档后重建容器，再以空根/错误root_id启动读取并对账PG。
      经environment验证TRAJECTORY_CLEANUP_ENABLED、TRAJECTORY_RETENTION_DAYS、TRAJECTORY_CLEANUP_INTERVAL_SECONDS默认值和覆盖；测试天数0/负数/3651/小数以及周期小于60，查看环境示例。
    expected: 默认保持远端行为，目标注入SDK且非法值明确配置错误；纯本地Trace/Metrics配置不连接远端。容器重建后OTLP及目录可冷读，PG结构/序列复用；空根/错标识明确不可用，存储依赖不以临时目录替代，原聊天兼容。 定期默认true/30/3600，天数1～3650且周期至少60秒；非法配置启动时报错，读取集中environment.py并注入。停止新采集后，独立清理开关仍能回收历史；部署示例布尔和数字字符串符合兼容要求。
  - order: 2
    action: 在shared_directory启动两个实例，A追加并刷盘OTLP、B读取已发布执行，进行双向探针；竞争实际运行文件锁及稳定owner/会话锁，持锁实例超时后尝试接管，释放后校验已确认前缀，检查smolagents Core注入。 两实例以不同根Agent同时首次采集同一owner/会话。 在两实例触发同存储根定时与手动清理，随后退出lifespan并检查受管清理lane。
    expected: 实际访问同一持久文件，跨实例锁保证单执行单写入者、meta.json串行原子提交；超时不绕过实际锁，不可靠锁的卷拒绝多实例写入。SDK仅接参数，配置依赖保持持久目录。 稳定.locks/<user_id>/<conversation_id>.lock使首次定位/登记串行，只产生一份固定storage_agent_id和会话meta；正文清理保留仍被持有/等待的锁inode。
      共享.locks/cleanup.lock按批互斥，清理lane有界且lifespan退出释放资源；扫描预算和固定元信息归属有效。
  - order: 3
    action: 将 B 换成独立本地卷或中断挂载，再验证 single_node 被错误跨宿主扩容的部署检查。
    expected: 错挂载被根标识和交叉读写校验发现，不能将相同路径名或复制标识文件当成共享证据；故障不返回假空轨迹。
  - order: 4
    action: 恢复原Local配置和卷，将目标切回otlp或关闭总开关，保持历史读取并运行原聊天及监控回归。
    expected: 本地采集目标与历史读取分别受控，原远端默认行为、聊天和冷读可用；配置注入、切换、环境还原、回归及owned cleanup有证据，共享卷保持。
  expected_results:
  - 默认保持远端行为，目标注入SDK且非法值明确配置错误；纯本地Trace/Metrics配置不连接远端。容器重建后OTLP及目录可冷读，PG结构/序列复用；空根/错标识明确不可用，存储依赖不以临时目录替代，原聊天兼容。 定期默认true/30/3600，天数1～3650且周期至少60秒；非法配置启动时报错，读取集中environment.py并注入。停止新采集后，独立清理开关仍能回收历史；部署示例布尔和数字字符串符合兼容要求。
  - 实际访问同一持久文件，跨实例锁保证单执行单写入者、meta.json串行原子提交；超时不绕过实际锁，不可靠锁的卷拒绝多实例写入。SDK仅接参数，配置依赖保持持久目录。 稳定.locks/<user_id>/<conversation_id>.lock使首次定位/登记串行，只产生一份固定storage_agent_id和会话meta；正文清理保留仍被持有/等待的锁inode。
    共享.locks/cleanup.lock按批互斥，清理lane有界且lifespan退出释放资源；扫描预算和固定元信息归属有效。
  - 错挂载被根标识和交叉读写校验发现，不能将相同路径名或复制标识文件当成共享证据；故障不返回假空轨迹。
  - 本地采集目标与历史读取分别受控，原远端默认行为、聊天和冷读可用；配置注入、切换、环境还原、回归及owned cleanup有证据，共享卷保持。
  forbidden_side_effects:
  - 不得静默重部署开发者或共享服务，不得删除原卷。
  - 不得将配置文本或 Mock 启动成功当作共享存储/灾难恢复已通过。
