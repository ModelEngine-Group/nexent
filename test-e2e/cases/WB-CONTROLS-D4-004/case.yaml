schema_version: '1.0'
stage: D4
module: CHAT-WORKBENCH
case:
  case_id: WB-CONTROLS-D4-004
  feature_id: WB-CONTROLS
  requirement_ids:
  - WB-SHARED-SELECTORS-20261019
  business_rule_ids:
  - WB-CONTROLS-RULE-006
  title: AIDP knowledge selection across configuration and Workbench
  type: E2E
  priority: P1
  status: active
  automation: automated
  objective: Prove AIDP routing, shared presentation, string scope and scene persistence in a real browser with controlled
    HTTP.
  preconditions:
  - Local frontend with authorized mock AIDP deployment and two accessible KDS records.
  test_data:
    profile: mock
  steps:
  - order: 1
    action: Open configuration knowledge selector, choose an AIDP KDS and confirm, then reopen.
    expected: AIDP catalog is shown by shared drawer; configuration saves the unchanged string KDS in aidp_search kds_list
      and reopens selected.
  - order: 2
    action: Open Workbench knowledge selector, cancel one draft, then confirm another selection, reopen and send.
    expected: No management action or local catalog; canceled draft is discarded, confirmed scope reopens and the run request
      contains the selected AIDP KDS ID.
  expected_results:
  - Both entries use AIDP catalog and preserve string identities in their distinct save contracts.
  - Workbench management is absent and canceled drafts do not mount resources.
  forbidden_side_effects:
  - No real resource creation, credential persistence or local catalog fallback.
  actor: Authorized mock tenant user
  journey:
  - Configure AIDP knowledge
  - Reopen configured selection
  - Cancel Workbench draft
  - Confirm and send Workbench scope
  final_business_result:
  - AIDP scope reaches each owning save contract without changing source or identity.
  failure_evidence:
  - Browser trace, assertion screenshot and captured sanitized request.
  execution:
    profiles:
    - name: mock
      required_services: []
  acceptance:
  - id: AC-01
    description: AIDP catalog and unchanged string identities across both entries, with cancellation isolation.
    steps:
    - 1
    - 2
    expected_results:
    - 1
    - 2
    forbidden_side_effects:
    - 1
