schema_version: '1.0'
stage: D5
module: AUTH-IDENTITY
case:
  case_id: AUTH-LOCAL-D5-001
  feature_id: AUTH-LOCAL
  business_rule_ids:
  - AUTH-LOCAL-RULE-02
  title: Historical account migration atomicity and repeat safety
  type: DEPLOYMENT
  priority: P1
  status: active
  automation: automated
  objective: Prove account-only migration preserves credentials and ownership without
    reading source audit logs
  preconditions:
  - Isolated test process and dependency runtime available.
  - Disposable PostgreSQL source and target databases available.
  - Docker available for an isolated source-stack cleanup proof using owned containers only.
  test_data:
    profile: local isolated synthetic users, no external credentials
  steps:
  - order: 1
    action: Import synthetic source accounts, preserving original IDs/hash and tenant
      ownership.
    expected: Original password verifies after import; ownership is unchanged.
  - order: 2
    action: Repeat import, then exercise duplicate/conflict and dry-run failure.
    expected: Repeat skips existing data; conflicts roll back and dry-run writes nothing.
  - order: 3
    action: Make the source audit relation fail on reads and migrate accounts through
      the host CLI.
    expected: Migration succeeds without reading audit rows, creating an audit archive
      or reporting audit counts.
  - order: 4
    action: Replay the single account SQL against old account/membership schemas and
      conflicting metadata.
    expected: Role/email move to account, original associations and credentials survive,
      replay preserves local edits, and conflicts roll back all schema/data changes.
  - order: 5
    action: Upgrade legacy API-only memberships and keys, then replay against old disabled placeholders and explicitly disabled/deleted identities.
    expected: Empty-email USER/DEV identities with historical keys and active membership become passwordless active accounts; original keys and IDs survive, replay preserves subsequent disablement, and normal/deleted identities remain unavailable.
  - order: 6
    action: Apply an import using an isolated stopped Supabase source DB and owned Auth/Kong containers; exercise failure and preview before a successful apply.
    expected: Preview/failure preserve the stack; successful committed apply removes its DB/Auth/Kong containers without deleting data volumes, backups or unrelated containers.
  - order: 7
    action: Run deployment prepare and apply hooks around the normal versioned SQL runner, repeat deployment and retry a failed import using its retained private snapshot.
    expected: One standalone Python script automatically imports only when the account SQL/data checkpoint requires it; fresh installs and completed upgrades skip source access, failures remain retryable, and SQL success alone never marks credential migration complete.
  - order: 8
    action: Execute the actual historical SPEED seed statement, migrate and replay against a prior pending placeholder and an operator-modified account.
    expected: The fixed demo identity retains its original ID/tenant and remains disabled for normal login, has system provenance without pending credentials, and replay preserves operator changes. Mixed-user deployment still imports human credentials.
  expected_results:
  - Successful identity behavior matches the preserved HTTP/data contract.
  - Negative paths reject access or writes deterministically.
  - No authentication audit history is read or imported; CLI output contains only
    account counters.
  - Canonical user_email/user_role exist only on accounts; old membership columns
    are removed atomically and credential-pending rows are hydrated safely.
  - API-only account upgrades preserve existing keys, keep password login disabled and never reactivate explicitly disabled or deleted accounts on replay.
  - Source containers are reclaimed only after a successful local apply and all persistent data is retained.
  - Deployment requires no manual Python invocation or host database packages; private snapshots survive incomplete upgrades and are removed only after committed import and successful cleanup.
  - Default SPEED system identity is never pending for Supabase import and receives no normal login access; operator changes are preserved.
  forbidden_side_effects:
  - No plaintext password/hash/token/DSN in returned errors or logs; no writes to
    unrelated users.
  acceptance:
  - id: AC-01
    description: Success, negative and no-leak contracts hold.
    steps:
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
    - 8
    expected_results:
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
    - 8
    forbidden_side_effects:
    - 1
  risk_type: DEPLOYMENT
  risk: Credential loss or duplicate activation during cutover
  condition:
  - Fresh target and repeated/conflicting import
  metrics:
  - Preserved IDs and password verification
  - Partial writes on failure
  thresholds:
  - All eligible accounts preserved
  - Zero partial writes
  recovery_expectations:
  - Rollback target transaction and keep original source backup.
