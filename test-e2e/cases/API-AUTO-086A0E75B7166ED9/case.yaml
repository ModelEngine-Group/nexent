    - 调用 GET /tenants/{tenant_id}/quota/usage 并置 detail=true、force_refresh=true，记录顶层字段及 breakdown[] 元素字段。
    - 调用 GET /platform/quota/overview（SU/ASSET_OWNER/SPEED 角色），记录顶层汇总字段及 tenants[] 元素字段。
    - 以 kb.capacity:read 权限账号调用 GET /capacity/personal/me、GET /capacity/personal/users?page=1&page_size=20 及 GET /capacity/personal/summary，记录
