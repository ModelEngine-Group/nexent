    legacy_row: 454
  unit_boundary: 配置前端
  inputs:
  - '- 无外部资产；使用组件测试夹具注入 mock agentStore（agentId、editedAgent.unavailable_reasons、serverSnapshotRevision、replaceServerSnapshot）与
    searchAgentInfo。'
  assertions:
  - editedAgent.unavailable_reasons 非空时渲染 warning 告警与刷新入口，文案包含各不可用原因；为空时不渲染该告警。
  - 点击刷新后 searchAgentInfo(agentId) 恰好调用一次；成功时 replaceServerSnapshot(agentId, data) 恰好调用一次，快照被更新为最新服务端数据。
  - 刷新失败（success=false 或抛出异常）时 replaceServerSnapshot 不被调用，当前快照保持不变，message.error 输出对应错误文案。
  - 刷新进行中按钮处于 loading 且 disabled，结束后恢复，无未处理异常。
