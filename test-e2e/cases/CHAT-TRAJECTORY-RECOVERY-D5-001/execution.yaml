implementations:
- framework: pytest
  file: test.py
  selector: test_trj_recovery
acceptance_bindings:
  AC-01:
  - test_trj_recovery_process_death_preserves_confirmed_prefix
  - test_trj_recovery_active_fragments_and_abandoned_temporaries
  - test_trj_recovery_publication_retries_after_repeated_metadata_failure
  AC-02:
  - test_trj_recovery_live_file_lock_and_corruption
  - test_trj_recovery_active_fragments_and_abandoned_temporaries
  - test_trj_recovery_process_death_preserves_confirmed_prefix
  AC-03:
  - test_trj_recovery_queue_and_disk_failures_keep_business_independent
  AC-04:
