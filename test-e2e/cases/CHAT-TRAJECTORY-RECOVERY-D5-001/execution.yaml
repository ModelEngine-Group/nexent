preparation:
  families: []
  anchors: false
  special_assets: false
  d4_groups: []
notes: >-
  Self-contained POSIX file durability proof with controlled trusted identities.
  Each test provisions a private temporary root; subprocesses and pipes are
  reaped in finally, ThreadManager services are stopped and checked for zero
  active workers. Fault injection affects only owned files and is restored by
  pytest fixtures. No PG, product deployment, providers, shared business assets
  or asset factories are required. HTTP/PG authorization is covered separately
  by CHAT-TRAJECTORY-ISOLATION-D5-001.
