      required_services: []
  risk_type: RELIABILITY
  risk: 归档中断与磁盘写失败后保留已确认前缀并明确采集缺口
  condition:
  - 独占可重启文件写入/查询进程和真实POSIX卷，授权上下文由fixture固定；故障注入限定本Case目录，其他授权入口由隔离Case验证。
  metrics:
  - 已确认内容丢失/重复
  - 内存待写字节
  - 悬空成功引用
  - 确认前缀校验及终态发布耗时
  thresholds:
  - 已确认丢失/重复及悬空成功引用均为0
  - 进程/运行队列不超配置字节预算，未持久化提前确认=0
  - 故障后重试幂等且状态明确；已确认损坏误报ready=0
  recovery_expectations:
  - 恢复目录权限、Worker 与测试配置，验证 canary 和 cleanup；永久丢盘不在该进程恢复承诺内。
