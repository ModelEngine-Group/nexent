schema_version: '1.0'
stage: D5
module: CHAT-MESSAGE
case:
  case_id: CHAT-TRAJECTORY-RECOVERY-D5-001
  feature_id: CHAT-TRAJECTORY
  requirement_ids:
  - CHAT-LOCAL-TRAJECTORY-20261103
  business_rule_ids:
  - TRJ-RULE-006
  title: 归档中断与磁盘写失败后保留已确认前缀并明确采集缺口
  type: RELIABILITY
  priority: P0
  status: active
  automation: automated
  objective: 归档中断与磁盘写失败后保留已确认前缀并明确采集缺口
  preconditions:
  - Python 3.11、现有OTel依赖及本机POSIX文件系统可用；文件存储和本地处理器已实现，固定脚本绑定后执行。
  - 使用隔离测试会话、租户和独占轨迹根目录；记录被测提交、配置快照和本用例资源清单。
  - 本Case证明授权后的文件持久化风险；可信采集身份由自包含fixture提供，PG/HTTP权限隔离继续由ISOLATION-D5-001独立证明。
  - 业务trace_id直接复用现有conversation_id；菜单按用户→最近根智能体→会话，打开后读取整个会话范围；PG复用现有表结构和查询，轨迹正文及执行清单全部为文件。
  - 基于现有MonitoringManager，通过MONITORING_PROVIDER选择互斥的local_file/otlp及远端提供方；本地业务正文为正文内嵌的标准OTLP JSONL，会话meta.json保存归属、执行清单和确认进度。
  - 目录使用tenant/user/storage_agent/conversation业务ID，storage_agent_id固定为首次采集根Agent；稳定owner/会话锁串行首次定位与登记。会话切换根Agent仍读写同一物理目录。
  - 所有正文内嵌OTLP Span属性/Events；256KiB为批量刷盘阈值，单行可更大。读写须处理大型字符串的增量编码/解码，正文API按解码后的UTF-8区间返回。
  test_data:
    profile: mock
  steps:
  - order: 1
    action: 在真实文件卷于OTLP追加、fsync、临时meta写入/fsync、rename/目录fsync和终态发布边界逐次终止进程；包括实际Span未结束但fragment已确认、meta发布持续失败后恢复可写的场景。 在大字符串编码中途、JSON对象结束前和换行写入前分别终止进程。
    expected: OTLP和meta确认偏移均持久化才导出成功；所有故障点已确认内容丢失/重复为0。按confirmed_bytes/hash校验，已确认fragment保留实际输入/部分输出并标interrupted，未确认尾部可裁掉，已确认范围损坏报corrupt；终态缺失按last_durable_at或started_at固定终结，到期不因重启延期。
      meta仅确认完整OTLP请求行，未闭合大行属于未确认尾部；此前已确认前缀保留，重试幂等且不把半行当可读正文。
  - order: 2
    action: 原写入者持实际OTLP文件锁时尝试接管，释放后校验确认前缀；重发最后batch及同一实际Span，覆盖同键同内容/异内容，保留未发布有效文件及孤儿临时文件。
    expected: 实际运行文件锁保证单写入者，超时不绕过锁；同batch/hash返回原收据，同Span键/安全内容不重复，异hash/错expected_offset拒绝。export_seq与已确认范围一致；未发布有效文件保留校验，真正孤儿核验后清理。
  - order: 3
    action: 注入磁盘满/权限拒绝并使内存待写队列达到字节预算，继续普通聊天，再恢复可写；保留其他会话canary。
    expected: 进程级/单运行内存队列不超预算；未刷盘不得确认，轨迹显式incomplete/gap，聊天保持既有行为。文件修复只封存已确认文件前缀，未确认内存损失不伪称完整，缺口不被抹掉。
  - order: 4
    action: 核对OTLP及meta的confirmed_bytes/hash、最终file_bytes/hash和publication_no；制造到期/删除后重试终态发布，检查清理并还原环境。
    expected: meta只发布可验证的已确认文件，无悬空成功引用；重复发布幂等，永久错误保留incomplete/corrupt。终态时间/到期不因重启延期，到期/删除不能被重新发布；原配置/canary恢复，独占资源释放。
  expected_results:
  - OTLP和meta确认偏移均持久化才导出成功；所有故障点已确认内容丢失/重复为0。按confirmed_bytes/hash校验，已确认fragment保留实际输入/部分输出并标interrupted，未确认尾部可裁掉，已确认范围损坏报corrupt；终态缺失按last_durable_at或started_at固定终结，到期不因重启延期。
    meta仅确认完整OTLP请求行，未闭合大行属于未确认尾部；此前已确认前缀保留，重试幂等且不把半行当可读正文。
  - 实际运行文件锁保证单写入者，超时不绕过锁；同batch/hash返回原收据，同Span键/安全内容不重复，异hash/错expected_offset拒绝。export_seq与已确认范围一致；未发布有效文件保留校验，真正孤儿核验后清理。
  - 进程级/单运行内存队列不超预算；未刷盘不得确认，轨迹显式incomplete/gap，聊天保持既有行为。文件修复只封存已确认文件前缀，未确认内存损失不伪称完整，缺口不被抹掉。
  - meta只发布可验证的已确认文件，无悬空成功引用；重复发布幂等，永久错误保留incomplete/corrupt。终态时间/到期不因重启延期，到期/删除不能被重新发布；原配置/canary恢复，独占资源释放。
  forbidden_side_effects:
  - 不丢弃已确认正文，不把 incomplete 当作 ready。
  - 不重新执行业务模型或工具，不故障注入共享生产目录。
