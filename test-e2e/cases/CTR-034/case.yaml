  contract:
  contract:
    protocol: Nexent Nacos management API and real Nacos A2A discovery
    request_expectations:
    - 创建独立 Nacos 配置并读取详情
    - 更新名称，停用配置并按停用状态过滤
    - 启用配置并按启用状态过滤
    - 通过真实 Nacos 发现已注册 Mock Agent，重复发现
    - 删除本用例发现的 Agent 与配置并回读
    response_expectations:
    - 配置名称及动态 config_id 一致
    - 列表包含当前配置，停用配置发现返回 400
    - 配置出现在启用列表
    - 返回 source_type=nacos，同一配置和 Agent 名称复用同一动态 ID
    - 均返回 404，无残留资源
