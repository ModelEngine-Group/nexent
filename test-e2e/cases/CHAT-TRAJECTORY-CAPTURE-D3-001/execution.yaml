notes: 'Current assertions own private loopback Provider/OTLP HTTP servers, real smolagents
  workers and sandbox executor, private local OTLP roots, real cold FastAPI readers
  including an independent Uvicorn process with asserted shutdown, and bounded ThreadManager
  lanes. Tool implementations and PG identities/catalog are controlled boundaries.
  SDK configuration/exporters are real; repeated startup provider registration is
  isolated inside this process. The backend bootstrap assertion starts a fresh Runtime
  process using one registered scratch database from the configured PostgreSQL service.
  It verifies committed message IDs and capture facts against the same database and
  archive, disposes both process-local database engines, and drops the owned database
  through the scratch factory. All created model clients close, private sandbox pool
  shuts down on its owning manager, HTTP server threads join and managed active_count
  is asserted zero. No shared preparation family is used. Bindings describe implemented
  assertion locations only. This Case remains blocked pending full Runtime/Ops application
  lifespans, public chat-stream persistence, and configured database/cache cold reads.
  The creator
  regression uses the public NL2Agent and NL2Skill routes, real signed AgentOS requests
  over isolated ASGI transport, real Runtime workers and HTTP model capture, and cold file
  reads. PG history and model catalog reads are controlled. It owns no additional shared
  resources; existing teardown applies. AC-07
  uses the same private resources and asserted teardown; cold snapshot and content
  chunks must reconstruct the exact original Agent query while physical model requests
  remain complete. AC-08 reuses private provider and cold reader resources; all model
  body chunks are compared with native provider fields, with existing fixture-owned
  teardown. Per-agent memory grouping reuses the same fixture resources; success,
  recovered failure and cancellation variants compare grouped steps, identity and
  original time ranges through file export and cold content reads.'
