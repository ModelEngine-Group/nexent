  - 默认otlp沿用原上报；local_file仅保存本地且关闭远端Trace/Metrics，otlp仅远端导出，远端保持原预览/过滤/采样。本地在原DROP决策下提升RECORD_ONLY并保留sampled位，实际Span ID有效且正文完整；入队不等于成功，只有OTLP先刷盘，再持久化meta.json的confirmed_bytes/hash才确认。每行按标准OTLP解码，hex
    ID/纳秒字符串/数字枚举/AnyValue正确。PG结构/序列复用，新增业务UUID由宿主生成；模型请求/响应/思考共用一个record及物理Span，业务父与Span父分别保存，异步归档不串上下文。 大正文完整内嵌属性/Events，单个请求行可超过刷盘阈值，落盘值不因预览长度被截断；每执行的业务事实均在一份OTLP文件。
  - 两种配置均停止新本地轨迹写入，旧归档仍按读取开关访问；otlp目标保留原远端行为，监控关闭时原聊天结果和canary不变。
  - 业务trace_id=str(conversation_id)且在session.id/nexent.trace_id等属性保存，原生traceId仍为实际128位值；轮次/根执行及每个物理attempt独立，子调用归属正确。最近agent_id分组沿现有逻辑更新，打开会话读取全部保留执行；停用区间coverage保守标未采集/未知，资源释放。
    物理会话目录及agent_id保持首次采集值，当前root_agent_id各自保存；未知目录_unknown同样固定，全部执行位于同一meta及目录。
  - 配置页及工作台的智能体对话创建在保存会话后绑定可信身份，新建/续聊/重试均以系统创建助手为根执行者并按最终会话归档；重试关联原用户消息且不重复保存。实际模型调用次数和聊天结果不因采集改变，创建目标与执行者独立，关闭流恢复上下文并释放资源。
  forbidden_side_effects:
  - 不重复调用模型或业务工具，不把失败 attempt 写回正常聊天。
  - 不修改共享 Provider、租户或其他会话数据。
