    blocked_reason: The fixed script covers actual smolagents retries, parallel and nested tools, cancellation, real HTTP exporter faults, SDK configuration setup and independent-process cold HTTP reads. Live PG schema/sequence and committed chat reconciliation, plus backend environment bootstrap across processes remain unverified. The user has deferred integration acceptance; controlled PG identities and in-process provider configuration do not prove the remaining obligations.
  execution:
    profiles:
    - name: mock
      required_services:
      - model-provider
  integration_boundary:
  - 真实 Agent 入口与smolagents Core 到 Provider HTTP 协议 Mock
  - MonitoringManager到本地受管处理器/Exporter，真实OTLP及meta.json原子提交，再到查询API
  observations:
  - 物理请求与工具次数
  - attempt/invocation 父子关联
  - OTLP持久化确认、meta.json的confirmed_bytes/hash和终态发布、PG结构复用
  - 聊天历史回归
  cleanup:
  - 关闭并删除独占 Mock fixture、Agent、会话与轨迹目录；保存清理和 canary 核验结果。
