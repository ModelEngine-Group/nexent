  title: persist_history_summary_candidate 持久化 compaction 指标字段并正确回读｜核心流程
  type: INTEGRATION
  priority: P1
  status: active
  automation: automated
  objective: persist_history_summary_candidate 持久化 compaction 指标字段并正确回读｜核心流程
  preconditions:
  - 本地依赖/集成测试环境可运行，后端服务与本地 PostgreSQL 数据库可连接；不要求外部模型服务在线。
  - 设置 NEXENT_TEST_HOME，目录不位于 Nexent Git 仓库内。
  - 当次 run_id 已生成，所有新建资源名称带 run_id；测试基线固定为 develop 当前批次锁定的产品提交；执行时另记录实际被测commit。
  - 所需本地资产存在且校验通过：${NEXENT_TEST_HOME}/config/users.yaml；${NEXENT_TEST_HOME}/config/secrets.env
  - users.yaml 中隔离账号可登录，测试租户数据可被清理。
  test_data:
    legacy_asset_declaration: '- ${NEXENT_TEST_HOME}/config/users.yaml

      - ${NEXENT_TEST_HOME}/config/secrets.env'
  steps:
  - order: 1
    action: 在本地工作区读取与“persist_history_summary_candidate 持久化 compaction 指标字段并正确回读”相关的 fixture/配置；测试代码不得读取生产凭据。
    expected: persist_history_summary_candidate 成功写库并返回正整数 unit_id，插入 unit_type=history_summary、unit_status=completed 的 ConversationMessageUnit。
  - order: 2
    action: 使用隔离账号创建会话并写入用户消息与一条 status=completed 的 assistant 消息，得到 conversation_id 与覆盖边界的 assistant message_id。
    expected: 回读 history_summary 中 history_tokens_before、history_tokens_after、compaction_attempts、compaction_trigger_threshold_tokens、compaction_target_tokens
      与写入值一致且为 int 类型。
  - order: 3
    action: 构造 history summary candidate（dict 或候选对象），包含 summary、covered_through_message_id、trigger，以及五个压缩指标字段 history_tokens_before、history_tokens_after、compaction_attempts、compaction_trigger_threshold_tokens、compaction_target_tokens。
    expected: summary、covered_through_message_id、trigger 字段正确持久化并可回读。
  - order: 4
    action: 调用 backend/services/conversation_management_service.py 的 persist_history_summary_candidate 持久化该 candidate，记录返回的
      unit_id。
    expected: 覆盖边界非 completed assistant、summary 非 dict、缺凭据时抛出 HistorySummaryPersistenceError，不出现半写入或跨租户泄露。
  - order: 5
    action: 通过 load_historical_context（底层 get_historical_context）回读该会话的 history_summary，校验 summary 内容与五个压缩指标字段。
    expected: 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
  - order: 6
    action: 对边界/异常路径分别执行：覆盖边界非 completed assistant 消息、summary 非 dict、缺 user_id/tenant_id，断言抛出 HistorySummaryPersistenceError
      且不产生半写入。
    expected: 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
  - order: 7
    action: 确认日志中不输出 API Key、Token、用户密码或模型密钥。
    expected: 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
  - order: 8
    action: 测试结束后清理测试会话及其消息/单元，确保可重复执行。
    expected: 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
  expected_results:
  - persist_history_summary_candidate 成功写库并返回正整数 unit_id，插入 unit_type=history_summary、unit_status=completed 的 ConversationMessageUnit。
  - 回读 history_summary 中 history_tokens_before、history_tokens_after、compaction_attempts、compaction_trigger_threshold_tokens、compaction_target_tokens
    与写入值一致且为 int 类型。
  - summary、covered_through_message_id、trigger 字段正确持久化并可回读。
  - 覆盖边界非 completed assistant、summary 非 dict、缺凭据时抛出 HistorySummaryPersistenceError，不出现半写入或跨租户泄露。
  - 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
  forbidden_side_effects: []
