schema_version: '1.0'
stage: D5
module: V5-BASELINE
case:
  case_id: DEP-IMAGE-BASE-TOOLS
  feature_id: F-173
  requirement_ids: [IMAGE-BASE-TOOLS]
  business_rule_ids: [F-173-RULE-03]
  title: Runtime utility installation layers and sandbox user access
  type: DEPLOYMENT
  priority: P2
  status: manual
  automation: manual
  objective: Verify actual OS package installation and command execution without building or starting the complete application stack.
  preconditions:
    - Docker is available, and the declared base images and their package repositories are reachable.
    - Use a temporary directory outside Git and uniquely named disposable containers or probe images.
  test_data:
    base_images: [python:3.11-slim, ubuntu:24.04, node:22-alpine, nginx:1.27-alpine]
    apt_packages: [vim, procps, curl, wget, less]
    apk_packages: [vim, procps-ng, curl, wget, less]
    runtime_images: [main, web, docs, data-process, mcp, terminal, sandbox, sandbox-full]
    variants: [data-process-cpu, data-process-gpu, terminal-slim, terminal-conda]
    commands: [vim, ps, top, curl, wget, less]
  steps:
    - order: 1
      action: Inspect each runtime Dockerfile, including inherited base stages. Confirm all six commands are installed in a stage inherited by the final image; terminal tools must be outside the conda conditional and data-process tools outside the CPU/GPU conditional.
      expected: All eight runtime paths and four variants retain the utility packages; sandbox final USER remains sandbox.
    - order: 2
      action: In disposable containers based on the four declared base images, use the corresponding apt/apk utility packages and existing installation flags. Preserve each base image's package repositories and record its image ID and OS release.
      expected: All four real package installations exit zero; the Alpine installations include procps-ng rather than relying on BusyBox ps/top.
    - order: 3
      action: Check command -v for vim, ps, top, curl, wget and less. Run vim/ps/curl/wget/less version checks, ps -ef and top -b -n 1. Use vim in noninteractive mode to write a temporary file, then read it through less and compare its contents.
      expected: All six commands execute successfully, ps supports -ef, top produces a process snapshot, and vim/less preserve the expected file contents.
    - order: 4
      action: Repeat the command checks in the Debian probe as UID/GID 1000 without elevated privileges, matching the sandbox runtime user. Save sanitized evidence outside Git and remove disposable containers/probe images.
      expected: Sandbox-equivalent ordinary users execute every command; the existing stack and repository runtime configuration are unchanged.
  expected_results:
    - All runtime inheritance paths and variants include the utility installation layer.
    - All four base-system installations and six command checks pass.
    - Sandbox-equivalent non-root command checks pass.
    - Evidence explicitly covers installation layers, not full application-image builds or application startup.
  forbidden_side_effects:
    - Do not publish images, restart existing containers, redeploy Kubernetes or rewrite local deployment configuration.
    - Do not log application secrets or leave disposable test containers/images behind.
  risk_type: DEPLOYMENT
  risk: Tools installed only in a builder or optional variant are absent when troubleshooting runtime containers.
  condition:
    - Verify the final runtime inheritance graph and real package installation on Debian, Ubuntu and both Alpine bases.
    - Verify unprivileged execution for the Debian-based sandbox runtime.
  metrics:
    - Number of runtime Dockerfiles with inherited utility packages.
    - Number of successful base-system installation probes and non-root command probes.
  thresholds:
    - Eight runtime Dockerfiles and all four variants have the common tools.
    - Four base-system probes and one non-root probe pass every declared command check.
  recovery_expectations:
    - Disposable containers and probe images are removed, with local evidence retained outside Git.
