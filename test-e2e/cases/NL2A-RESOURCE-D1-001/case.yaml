    expected_results:
    - 3
    forbidden_side_effects:
    - 1
  - id: AC-04
    description: Pending/bound grouping and visual state
    steps:
    - 4
    expected_results:
    - 4
  - id: AC-05
    description: Concrete knowledge presentation and binding
    steps:
    - 5
    expected_results:
    - 5
