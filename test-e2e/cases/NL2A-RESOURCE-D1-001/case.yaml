schema_version: '1.0'
stage: D1
module: V5-BASELINE
case:
  case_id: NL2A-RESOURCE-D1-001
  feature_id: F-045
  requirement_ids:
  - NL2A-RESOURCE-CARD-20261021
  business_rule_ids:
  - F-045-RULE-02
  title: Three resource types share one NL2Agent binding card
  type: FE-COMP
  priority: P1
  status: active
  automation: automated
  objective: Exercise actual binding card state and knowledge picker with controlled
    external dependencies.
  preconditions:
  - Render current editable Agent with controlled tool/skill catalogs and persistence
    adapters.
  test_data:
    profile: mock
  steps:
  - order: 1
    action: Render mixed knowledge/tool/skill recommendations and an independent AIDP
      tool.
    expected: Local/MCP/Skill and additional Knowledge tags appear; no recommendation
      tags, recommended resources start selected and ordinary configuration remains.
  - order: 2
    action: Open/cancel/confirm local and AIDP selections and revisit existing values.
    expected: Names and stable IDs persist in the draft; cancel performs no binding.
  - order: 3
    action: Bind empty, valid and failing knowledge selections then continue.
    expected: Empty cannot save; success refreshes then permits continuation; failure
      remains retryable without advancing.
  - order: 4
    action: Inspect pending/bound regions, toggle selection, collapse/expand bound
      rows, and bind a pending row.
    expected: Counts/highlight update, bound rows are separate and collapsible, successful
      binding moves to bound.
  - order: 5
    action: Render suggested, empty and bound knowledge rows; open suggested selection
      and bind.
    expected: Initial recommendation names/None render; cancelling keeps recommendation
      attribution; confirming a manual selection changes the label to Selected; successful
      binding uses Associated. Existing ranges and deferred persistence remain.
  expected_results:
  - One card displays Local/MCP/Skill sources plus Knowledge without exposing managed
    names.
  - Local index arrays and AIDP string IDs are preserved; selection does not save
    prematurely.
  - Only successfully saved nonempty knowledge binding permits continuation.
  - Pending/bound sections maintain counts, selection presentation and collapsible
    bound content.
  - Suggested ranges preselect without premature persistence; manual confirmation
    labels chosen ranges Selected, cancellation retains attribution, and bound ranges
    use Associated.
  forbidden_side_effects:
  - No persistence on drawer cancellation or empty selection; no generation on failed
    binding.
  unit_boundary: Real card reducer, draft validation, presentation helpers and knowledge
    picker; controlled external drawer, catalogs, assistant API, store and persistence.
  inputs:
  - Mixed resource recommendations; local/AIDP knowledge catalogs; empty and failing
    persistence.
  assertions:
  - Type labels, knowledge selection draft, persistence payload, continuation gating.
  acceptance:
  - id: AC-01
    description: Mixed resource presentation
    steps:
    - 1
    expected_results:
    - 1
  - id: AC-02
    description: Knowledge selection identity and draft isolation
    steps:
