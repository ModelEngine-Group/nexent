  execution:
    profiles:
    - name: mock
      required_services: []
  risk_type: SECURITY
  risk: 普通用户或范围外管理员越权读取历史轨迹，或主动清理扩大到未授权范围
  condition:
  - 隔离管理员/普通用户身份、受信租户上下文和可控文件攻击目录
  metrics:
  - 普通用户读取成功数
  - 范围外读取成功数
  - 根外canary变化数
  - 凭证落盘数
  - 未授权清理数
  thresholds:
  - 上述四项均为0，合法ADMIN正向读取成功
  - 未授权清理=0，合法当前租户清理可完成
  recovery_expectations:
  - 移除攻击文件和身份，合法ADMIN仍可查询，普通创建者继续拒绝。
