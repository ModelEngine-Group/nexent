schema_version: '1.0'
stage: D3
module: V5-BASELINE
case:
  case_id: NB-OTEL-001
  feature_id: F-146
  business_rule_ids:
  - F-146-RULE-03
  title: Northbound to Runtime complete real-model response trace
  type: AGENT-IT
  priority: P0
  status: active
  automation: automated
  objective: Prove actual W3C cross-service trace and complete HTTP response with
    real model and Phoenix.
  preconditions:
  - Northbound/Runtime run tested source with telemetry and both routes included.
  - Task-local NEXENT_TEST_CREDENTIALS contains Northbound URL/key, real Agent and
    skill marker, Phoenix URL/key/project.
  test_data:
    variants:
    - real_model_stream
    - unauthenticated
  steps:
  - order: 1
    action: POST chat with unique W3C traceparent; consume complete SSE from real
      model and bound skill.
    expected: HTTP 200, actual skill marker, no error event.
  - order: 2
    action: Read trace from authenticated Phoenix and inspect Northbound/Runtime HTTP,
      Agent, model and tool spans.
    expected: Shared trace and valid ancestry; ended Northbound and Runtime HTTP spans
      each enclose normal Agent/model/tool work. Independent HTTP cleanup tails need
      not end in parent-child order; actual model input and tokens are visible.
  - order: 3
    action: POST chat without Authorization with another W3C traceparent and inspect
      Phoenix.
    expected: HTTP 401, ended Northbound span, no downstream invocation.
  - order: 4
    action: Close another real request after response headers without consuming body;
      inspect ended HTTP trace and poll actual persisted conversation.
    expected: Northbound HTTP span ends; original persisted run completes exactly
      one user/assistant pair with actual skill marker, without stop or resubmission.
  expected_results:
  - Actual final answer agrees with real tool/model execution.
  - Normal Northbound and Runtime HTTP durations each enclose Agent/model/tool work
    with shared trace and ancestry; independent HTTP cleanup end times are not ordered.
  - Unauthorized HTTP is traced without downstream execution.
  - Disconnected HTTP span ends while the existing persisted-run continuation policy
    remains unchanged.
  forbidden_side_effects:
  - Do not record Authorization or API keys in span attributes.
  - Do not replace real model or product collaborators.
  integration_boundary:
  - Actual Northbound HTTP -> Runtime -> real Agent/model/tool -> Phoenix; no mocks.
  observations:
  - Sanitized trace IDs, ancestry, times, token usage and HTTP status.
  cleanup:
  - Retain task-owned conversations for trace review; preserve user data.
  acceptance:
  - id: AC-STREAM
    description: Real complete streaming and cross-service trace.
    steps:
    - 1
    - 2
    expected_results:
    - 1
    - 2
    forbidden_side_effects:
    - 1
    - 2
  - id: AC-AUTH
    description: Ended rejection span with no downstream execution.
    steps:
    - 3
    expected_results:
    - 3
    forbidden_side_effects:
    - 1
  - id: AC-DISCONNECT
    description: HTTP cancellation ends its span while persisted Agent work continues.
    steps:
    - 4
    expected_results:
    - 4
    forbidden_side_effects:
    - 1
    - 2
