case:
  case_id: UT-BE-AUTO-51975A59626F5BE8
  feature_id: F-131
  business_rule_ids:
  - F-131-RULE-01
  title: 仓库导入预检模型可用性：_check_model_available 迁移 resolver.is_model_available 后可用/不可用/缺失/无 connect_status｜核心流程
  type: BE-UT
  priority: P1
  status: active
  automation: automated
  objective: 仓库导入预检模型可用性：_check_model_available 迁移 resolver.is_model_available 后可用/不可用/缺失/无 connect_status｜核心流程
  preconditions:
  - 本地依赖/组件测试环境可运行；不要求外部模型服务在线。
  - 设置 NEXENT_TEST_HOME，目录不位于 Nexent Git 仓库内。
  - 当次 run_id 已生成，所有新建资源名称带 run_id；测试基线固定为 develop 当前批次锁定的产品提交；执行时另记录实际被测 commit。
  - get_model_id_by_display_name / get_model_by_model_id 依赖已通过 mock 提供，无需真实数据库连接与模型记录。
  test_data:
    legacy_asset_declaration: '- 无固定本地资产；get_model_id_by_display_name / get_model_by_model_id 依赖以 mock 注入，不使用真实数据库或模型。'
  steps:
  - order: 1
    action: 在本地工作区直接导入 backend/services/repository_import_precheck.py 的 _check_model_available 与 backend/management/services/model/resolver.py
      的 is_model_available，mock get_model_id_by_display_name 与 get_model_by_model_id，构造最小有效输入；测试代码不得读取生产凭据。
    expected: display_name 为 None/空/仅空白时返回 (True, None)，不产生模型不可用误报。
  - order: 2
    action: 构造 display_name 为 None、空字符串、仅空白字符串的输入，调用 _check_model_available，记录返回元组并断言不触发任何模型库查询。
    expected: 模型不存在（无 model_id）时返回 (False, "model_unavailable")。
  - order: 3
    action: 构造 display_name 非空但 get_model_id_by_display_name 返回 None/0 的情况，调用 _check_model_available，记录返回元组。
    expected: 模型存在且 connect_status 归一为 AVAILABLE 时返回 (True, None)。
  - order: 4
    action: 构造 model_id 存在且 model_info 的 connect_status 经 ModelConnectStatusEnum.get_value 归一到 AVAILABLE 的情况，调用 _check_model_available，记录返回元组。
    expected: 模型存在但 connect_status 归一为非 AVAILABLE 时返回 (False, "model_unavailable")。
  - order: 5
    action: 构造 model_id 存在但 model_info 的 connect_status 归一为非 AVAILABLE（不可用/失败）的情况，调用 _check_model_available，记录返回元组。
    expected: model_info 为 None/空 dict 时返回 (False, "model_unavailable")（is_model_available 对 falsy model 返回 False）。
  - order: 6
    action: 构造 model_id 存在但 get_model_by_model_id 返回 None 或空 dict 的情况，调用 _check_model_available，记录返回元组。
    expected: 缺少 connect_status 字段时返回 (False, "model_unavailable")。
  - order: 7
    action: 构造 model_info 缺少 connect_status 字段（connect_status 为 None）的情况，调用 _check_model_available，记录返回元组。
    expected: 所有路径均返回稳定 (available, reason_code) 元组，无未处理异常；reason_code 取值仅 "model_unavailable" 或 None，与迁移前内联判定等价。
  - order: 8
    action: 逐项核对上述判定是否与 resolver.is_model_available 的归一化逻辑等价；测试结束后释放 mock 对象，确保可重复执行。
    expected: 所有路径均返回稳定 (available, reason_code) 元组，无未处理异常；reason_code 取值仅 "model_unavailable" 或 None，与迁移前内联判定等价。
  expected_results:
  - display_name 为 None/空/仅空白时返回 (True, None)，不产生模型不可用误报。
  - 模型不存在（无 model_id）时返回 (False, "model_unavailable")。
  - 模型存在且 connect_status 归一为 AVAILABLE 时返回 (True, None)。
  - 模型存在但 connect_status 归一为非 AVAILABLE 时返回 (False, "model_unavailable")。
  - model_info 为 None/空 dict 时返回 (False, "model_unavailable")（is_model_available 对 falsy model 返回 False）。
  - 缺少 connect_status 字段时返回 (False, "model_unavailable")。
  - 所有路径均返回稳定 (available, reason_code) 元组，无未处理异常；reason_code 取值仅 "model_unavailable" 或 None，与迁移前内联判定等价。
  forbidden_side_effects: []
  source:
    legacy_workbook_sha256: aa4b32414d30f12b3b64e14236268145e556bd7cfc5d3eb8df80731608ebc022
    legacy_sheet: 02_测试用例基线
    legacy_row: 400
  unit_boundary: 仓库导入预检
  inputs:
  - '- 无固定本地资产；get_model_id_by_display_name / get_model_by_model_id 依赖以 mock 注入，不使用真实数据库或模型。'
  assertions:
  - display_name 为 None/空/仅空白时返回 (True, None)，不产生模型不可用误报。
  - 模型不存在（无 model_id）时返回 (False, "model_unavailable")。
  - 模型存在且 connect_status 归一为 AVAILABLE 时返回 (True, None)。
  - 模型存在但 connect_status 归一为非 AVAILABLE 时返回 (False, "model_unavailable")。
  - model_info 为 None/空 dict 时返回 (False, "model_unavailable")（is_model_available 对 falsy model 返回 False）。
  - 缺少 connect_status 字段时返回 (False, "model_unavailable")。
  - 所有路径均返回稳定 (available, reason_code) 元组，无未处理异常；reason_code 取值仅 "model_unavailable" 或 None，与迁移前内联判定等价。
