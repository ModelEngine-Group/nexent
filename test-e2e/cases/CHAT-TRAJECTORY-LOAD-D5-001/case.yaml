  risk_type: PERFORMANCE
  risk: 200 并行运行与长历史读取下无确认事件丢失且缓存有界
  condition:
  - 独占性能环境；明确模型事件速率和浏览请求频率，Provider 使用可控边界
  metrics:
  - 真实并发
  - 吞吐与P50/P95/P99
  - 内存待写字节及积压斜率
  - meta大小/原子更新/锁等待
  - 每请求实际扫描字节/行数
  - 已确认丢失/重复
  - 浏览器页数/缓存字节
  - 单行最大字节与JSON转义放大率
  - 源正文持有/编码解码缓冲/并发峰值内存
  thresholds:
  - 真实并发=200
  - 已确认丢失=0、重复=0
  - 稳态待写积压无持续增长，停止后300秒内完成已接收队列刷盘及终态发布
  - 节点DTO单段最多500条/8MiB，Nexent正文缓存最多32MiB，轨迹实时连接=0
  recovery_expectations:
  - 卸载全部负载客户端、测试会话与文件，确认积压清空和测试机资源恢复。
