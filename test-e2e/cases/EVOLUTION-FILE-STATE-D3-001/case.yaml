  - 真实 Management 重放、签名 AgentOS HTTP、Runtime 文件目录和 SDK 文件工具；HTTP 使用进程内传输，受控执行器代替模型及模型配置加载。
  observations: [每轮输入与文件摘要、附件路径和传输记录、实际写入、目录归属、独立终态判定。]
  cleanup: [核对所有试跑临时目录均已删除。]
