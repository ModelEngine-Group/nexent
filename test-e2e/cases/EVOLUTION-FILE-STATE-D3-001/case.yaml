    expected: 每组独立从初态开始，仅首轮挂载只读附件，模型使用工作区路径。第二轮承接本组草稿，只回复和触碰保护文件失败，写终稿通过。
  expected_results: [六个独立目录均已释放，覆盖文件判分与口头回答不一致。]
  forbidden_side_effects: [每组的写入不能更改其他组的初始文件或发送到外部服务。]
  acceptance:
  - id: AC-01
    description: 跨边界核对附件按轮提供、状态重置、跨轮传递、文件差异、受保护写入及回收。
    steps: [1]
    expected_results: [1]
    forbidden_side_effects: [1]
