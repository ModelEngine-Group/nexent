  title: metadata 进入 Agent context，与 meta_data 审计字段隔离｜外部依赖异常与超时
  type: AGENT-IT
  priority: P0
  status: active
  automation: automated
  objective: metadata 进入 Agent context，与 meta_data 审计字段隔离｜外部依赖异常与超时
  preconditions:
  - Nexent 本地测试全栈已启动，health check 通过。
  - 设置 NEXENT_TEST_HOME，目录不位于 Nexent Git 仓库内。
  - 当次 run_id 已生成，所有新建资源名称带 run_id；测试基线固定为 develop 473b65268ba8cda3db53be735f97678e214c583b；执行时另记录实际被测commit。
  - 所需本地资产存在且校验通过：${NEXENT_TEST_HOME}/config/models.yaml；${NEXENT_TEST_HOME}/config/secrets.env
  - models.yaml 中本用例所需真实 Provider 已配置，secrets.env 中凭据有效，预检连通性通过。
  test_data:
    legacy_asset_declaration: '- ${NEXENT_TEST_HOME}/config/models.yaml

      - ${NEXENT_TEST_HOME}/config/secrets.env'
  steps:
  - order: 1
    action: 使用 allow_chat_metadata=true 的独立 Agent。
    expected: 超限 metadata 必须返回 413，不得返回 500。
  - order: 2
    action: 提交超过 64 KiB 上限的 metadata（例如 value 含 2,000,000 个字符）。
    expected: 错误信息明确且不回显完整超大载荷。
  - order: 3
    action: 断言 /agent/run 在运行前返回 HTTP 413，并包含稳定、脱敏的 metadata-too-large/invalid 错误。
    expected: 校验失败无模型调用、无持久化副作用。
  - order: 4
    action: 确认未调用模型/工具、未写入会话 metadata。
    expected: 校验失败无模型调用、无持久化副作用。
  expected_results:
  - 超限 metadata 必须返回 413，不得返回 500。
  - 错误信息明确且不回显完整超大载荷。
  - 校验失败无模型调用、无持久化副作用。
  forbidden_side_effects: []
  source:
