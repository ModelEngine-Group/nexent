  contract:
    protocol: HTTP API
    request_expectations:
    - 启动 Nexent 本地全栈（Runtime 与 Config 两个进程），确认 GET /health/live 与 GET /health/ready 均返回 200；所有可变资源使用 RunID 前缀。
    - 通过 backend/apps/runtime_app.py 与 backend/apps/config_app.py 对外暴露的真实 HTTP 入口执行探测，不直接修改数据库状态绕过业务逻辑。
    - 调用 Runtime 与 Config 的 GET /health/live，记录返回状态码与响应体，断言恒为 200 且 body 为 {"status":"alive"}。
    - 调用 Runtime 与 Config 的 GET /health/ready，在进程 thread_manager 状态为 running 且 stuck_count=0 时记录返回 200，body 含 status=ready、manager_state=running、stuck_count=0。
    - 调用 Runtime 与 Config 的 GET /internal/thread-capacity，记录返回的进程级线程快照（各 lane 的 state、worker/队列容量、stuck 计数等）。
    - 调用 GET /openapi.json，检查 /health/live、/health/ready、/internal/thread-capacity 是否出现在 paths 中，记录 include_in_schema=False
      的实际表现。
    - 故障注入制造非 running / stuck 状态：向 Runtime 某 lane 注入卡住任务使 stuck_count>0（或使 manager state 离开 running），随后调用 GET /health/ready，记录返回
      503 与 body（status=not_ready、manager_state、stuck_count）。
    - 优雅关闭验证：在 Runtime 启动一个长时间运行的 agent 流任务后向进程发送关闭信号，记录关闭时长与顺序；断言先执行 shutdown_agent_stream_tasks、再 SandboxPoolManager.shutdown、最后
      thread_manager.shutdown（受 RUNTIME_THREAD_SHUTDOWN_GRACE_SECONDS 约束），超出的流任务被记录 "Agent stream tasks exceeded shutdown
      grace" 告警且仍被清理，进程最终退出。
    - 线程管理器 shutdown 异常边界：验证 thread_manager.shutdown 抛异常时仍通过 finally 执行 clear_default_thread_manager，进程不挂起、无残留线程管理器。
    - 重新查询 /health/ready 与 /internal/thread-capacity 验证一致性，检查日志不泄露 secret，清理临时数据与故障注入任务。
    - 对上述非法/失败条件（503、shutdown grace 超时、shutdown 异常）至少重复一次，确认重试不产生重复资源、脏状态或权限绕过。
    response_expectations:
    - /health/live 恒返回 200 与 {"status":"alive"}，不依赖 thread_manager 是否注入。
    - /health/ready 在 manager 为 running 且 stuck_count=0 时返回 200（status=ready）；在 manager state 非 running 或 stuck_count>0 时返回
      503（status=not_ready），并携带 manager_state 与 stuck_count。
    - /internal/thread-capacity 返回 200 与进程级线程快照，其内容与 /health/ready 内部读取的 manager snapshot 一致。
    - /health/live、/health/ready、/internal/thread-capacity 均未暴露在 OpenAPI schema（include_in_schema=False）。
    - 优雅关闭按 shutdown_agent_stream_tasks → SandboxPoolManager.shutdown → thread_manager.shutdown 顺序执行，整体受 RUNTIME_THREAD_SHUTDOWN_GRACE_SECONDS
      约束；超出 grace 的流任务被记录告警并仍被清理，无残留线程/进程。
    - thread_manager.shutdown 异常时仍通过 finally 调用 clear_default_thread_manager，进程不挂起、不泄漏线程管理器。
    - 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
    - 失败路径返回明确错误，不出现半写入、重复副作用或跨租户泄露。
