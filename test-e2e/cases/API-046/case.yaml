schema_version: '1.0'
stage: D2
module: V5-BASELINE
case:
  case_id: API-046
  feature_id: F-030
  business_rule_ids:
  - F-030-RULE-01
  title: 用户 quota/default quota 设置与 unlimited 语义｜核心流程
  type: API-IT
  priority: P1
  status: active
  automation: automated
  objective: 用户 quota/default quota 设置与 unlimited 语义｜核心流程
  preconditions:
  - Nexent 本地测试全栈已启动，health check 通过。
  - 设置 NEXENT_TEST_HOME，目录不位于 Nexent Git 仓库内。
  - 当次 run_id 已生成，所有新建资源名称带 run_id；测试基线固定为 develop 当前批次锁定的产品提交；执行时另记录实际被测commit。
  - 所需本地资产存在且校验通过：${NEXENT_TEST_HOME}/config/users.yaml；${NEXENT_TEST_HOME}/config/secrets.env
  - users.yaml 中 SU/Admin/UserA/UserB 等隔离账号可登录，测试租户数据可被清理。
  test_data:
    legacy_asset_declaration: '- ${NEXENT_TEST_HOME}/config/users.yaml

      - ${NEXENT_TEST_HOME}/config/secrets.env'
  steps:
  - order: 1
    action: 从 config/users.yaml 准备 SU、TenantA Admin/User、TenantB Admin/User，所有测试资源使用 RunID 前缀。
    expected: 功能结果与代码契约一致，测试过程无未处理异常。
  - order: 2
    action: 按“用户 quota/default quota 设置与 unlimited 语义｜核心流程”通过实际资源管理 API 创建/修改租户、用户组、邀请码、角色或配额。
    expected: 关键状态在 API 返回、数据库/存储和后续读取中保持一致。
  - order: 3
    action: 每次写操作后重新 GET 列表/详情，并在数据库/配额状态中检查目标租户数据一致。
    expected: 失败路径返回明确错误，不出现半写入、重复副作用或跨租户泄露；set_personal_user_quota 低于用量冲突仅基于源文件账本用量（source_size_bytes）比较，ES 物理索引容量不参与冲突判断。
  - order: 4
    action: 使用不同角色重复读取和写入，确认 UI/API 对应 RBAC 与 tenant scope 一致。
    expected: 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
  - order: 5
    action: 对删除/级联操作，在执行前记录关联用户、组、KB、Agent、MCP 等ID，删除后逐项确认不可访问且无孤儿记录。
    expected: unlimited 语义一致：quota_limit_bytes 为 null 或 unlimited=true 时删除个人硬限额，GET 回读返回 quota_limit_bytes=null（unlimited=true），个人剩余配额按源文件账本口径计算，不含
      ES 物理容量。
  - order: 6
    action: 配额类用固定大小文件/知识库真实消耗容量，检查 warning/hard limit 与释放后的 usage 回落；对个人配额调用 PUT /capacity/personal/users/{user_id}/quota
      将配额设置为低于该用户当前源文件账本用量（source_size_bytes）的值，确认返回低于用量冲突（TENANT_PERSONAL_KB_QUOTA_BELOW_USAGE），且冲突仅比较源文件账本用量，ES 物理索引容量（es_physical_bytes/store_size_bytes）不参与判断；清空
      quota_limit_bytes 或 unlimited=true 即删除个人硬限额，GET 回读确认 quota_limit_bytes=null/unlimited。
    expected: unlimited 语义一致：quota_limit_bytes 为 null 或 unlimited=true 时删除个人硬限额，GET 回读返回 quota_limit_bytes=null（unlimited=true），个人剩余配额按源文件账本口径计算，不含
      ES 物理容量。
  - order: 7
    action: 越权/非法输入不得改变其他租户数据；错误响应不暴露资源是否真实存在。
    expected: unlimited 语义一致：quota_limit_bytes 为 null 或 unlimited=true 时删除个人硬限额，GET 回读返回 quota_limit_bytes=null（unlimited=true），个人剩余配额按源文件账本口径计算，不含
      ES 物理容量。
  - order: 8
    action: 清理当次创建的租户/用户/邀请码/配额配置。
    expected: unlimited 语义一致：quota_limit_bytes 为 null 或 unlimited=true 时删除个人硬限额，GET 回读返回 quota_limit_bytes=null（unlimited=true），个人剩余配额按源文件账本口径计算，不含
      ES 物理容量。
  expected_results:
  - 功能结果与代码契约一致，测试过程无未处理异常。
  - 关键状态在 API 返回、数据库/存储和后续读取中保持一致。
  - 失败路径返回明确错误，不出现半写入、重复副作用或跨租户泄露；set_personal_user_quota 低于用量冲突仅基于源文件账本用量（source_size_bytes）比较，ES 物理索引容量不参与冲突判断。
  - 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
  - unlimited 语义一致：quota_limit_bytes 为 null 或 unlimited=true 时删除个人硬限额，GET 回读返回 quota_limit_bytes=null（unlimited=true），个人剩余配额按源文件账本口径计算，不含
    ES 物理容量。
  forbidden_side_effects: []
  source:
    legacy_workbook_sha256: aa4b32414d30f12b3b64e14236268145e556bd7cfc5d3eb8df80731608ebc022
