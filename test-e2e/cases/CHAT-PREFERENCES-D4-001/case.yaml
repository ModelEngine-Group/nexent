schema_version: '1.0'
stage: D4
module: CHAT-MESSAGE
case:
  case_id: CHAT-PREFERENCES-D4-001
  feature_id: CHAT-MODEL-CONTROLS
  business_rule_ids: [CHAT-MODEL-CONTROLS-RULE-003, CHAT-MODEL-CONTROLS-RULE-005, CHAT-MODEL-CONTROLS-RULE-007]
  title: Saved model controls honor server defaults and localize validation failures
  type: E2E
  priority: P1
  status: active
  automation: automated
  objective: Prove saved Agent chat controls and summary agree with normalized server preferences despite conflicting legacy Agent metadata.
  preconditions:
  - Local frontend with browser-owned authenticated route fixtures, no real provider calls or persistent server writes.
  test_data:
    profile: mock
    locales: [zh, en]
    parameters: Legacy Agent thinking true and auto; saved server thinking false; declared effort low, medium and high.
  steps:
  - order: 1
    action: Open the saved conversation in each locale, inspect its summary and model controls, then enable thinking.
    expected: Initial thinking is off with no degree summary; enabling saves true and declared low without legacy auto or unrelated parameter changes.
  - order: 2
    action: Reject a subsequent effort edit with a structured dependency error and an advanced temperature edit with a fixed-parameter error.
    expected: Both controls show localized field-specific errors, preserve prior preferences and do not mislabel validation as a version conflict.
  - order: 3
    action: Reload the saved conversation and inspect thinking, summary and server preferences.
    expected: The successful preference change is restored, rejected edits do not persist, and reads do not execute an Agent or rewrite configuration.
  expected_results:
  - Saved controls and summary use the same effective server values across reload.
  - Quick and advanced failures display accurate localized validation without configuration loss.
  forbidden_side_effects:
  - No real provider calls, shared data changes, unknown auto submission or silent preference reset.
  actor: Authorized browser fixture user
  journey: [Open saved conversation, Enable thinking, Reject invalid edits, Reload]
  final_business_result:
  - Existing conversation model preferences remain editable, consistent and recoverable.
  failure_evidence:
  - Browser assertions, localized errors and captured preference requests.
  acceptance:
  - id: AC-01
    description: Server-normalized values govern controls, summary, writes and reload.
    steps: [1, 3]
    expected_results: [1]
    forbidden_side_effects: [1]
  - id: AC-02
    description: Both editors localize validation and retain prior preferences.
    steps: [2, 3]
    expected_results: [2]
    forbidden_side_effects: [1]
