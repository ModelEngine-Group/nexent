schema_version: '1.0'
stage: D1
module: RUNTIME-SANDBOX
case:
  case_id: TFP-D1-004
  feature_id: TFP-001
  requirement_ids:
  - TFP-001
  business_rule_ids:
  - TFP-RULE-002
  title: Tool identity cannot be forged by names or sources
  type: SDK-UT
  priority: P0
  status: active
  automation: automated
  objective: Tool identity cannot be forged by names or sources
  preconditions:
  - Use isolated official tool instances and a controlled executor factory.
  test_data:
    profile: mock
  steps:
  - order: 1
    action: Provide an exact official tool, an unknown subclass, a same-name custom tool and an MCP source.
    expected: Only the approved official source and exact implementation qualify.
  - order: 2
    action: Only exact AidpSearchTool from the local source qualifies; MCP, custom, subclass and IndependentAidpSearchTool
      identities cannot impersonate aidp_search. Explicit omission from the allowlist delegates.
    expected: The existing AIDP authorization and complete-step routing contract is preserved.
  expected_results: &id001
  - Unapproved identities delegate to the original executor.
  - Reserved names and callable aliases do not qualify.
  - Only exact AidpSearchTool from the local source qualifies; MCP, custom, subclass and IndependentAidpSearchTool identities
    cannot impersonate aidp_search. Explicit omission from the allowlist delegates.
  forbidden_side_effects:
  - No unauthorized local invocation.
  unit_boundary: Restricted AST admission, real LocalPythonExecutor and NexentAgent executor lifecycle
  inputs:
  - Tool identity cannot be forged by names or sources
  assertions: *id001
