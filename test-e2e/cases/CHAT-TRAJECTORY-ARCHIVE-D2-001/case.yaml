    expected: 401/403/404/422/413/409/503依合同明确返回，不泄漏标题/正文/路径；没有半份ZIP成功响应，临时文件回收，既有服务轨迹读取与统计保持。
  - order: 3
    action: 使用含partial/expired/unarchived及长Unicode正文的会话下载，校验文件hash、执行顺序及原文。
    expected: 缺失状态明确，未发布正文不导出，长正文和历史版本/null正确；无导入、去重、档案管理或目标租户接口。
  expected_results:
