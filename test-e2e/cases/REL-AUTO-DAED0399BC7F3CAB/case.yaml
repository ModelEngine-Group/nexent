module: V5-BASELINE
case:
  case_id: REL-AUTO-DAED0399BC7F3CAB
  feature_id: V5-REL-AUTO-DAED0399BC7F3CAB
  business_rule_ids:
  - V5-REL-AUTO-DAED0399BC7F3CAB-RULE-01
  title: 服务重启后 stale RUNNING 评测与 PENDING/RUNNING case 状态同步收割（reap_stale_runs）
  type: RELIABILITY
  priority: P1
  status: active
  automation: automated
  objective: 服务重启后 in-flight 托管任务丢失，会使 RUNNING 评测及其 PENDING/RUNNING case 成为僵尸记录：状态永久挂起、活跃计数失真、结果无法收敛且无法重新派发。需验证 reap_stale_runs
    能按 update_time 超时阈值精确收割，同步把 PENDING/RUNNING case 置 FAILED 并写入一致 error_message，同时保证租户隔离、cutoff 内运行与已完成 case 不受影响。
  preconditions:
  - '- ${NEXENT_TEST_HOME}/config/environment.yaml（本地测试库连接、隔离租户账号）

    - 本地测试库预置的 stale RUNNING 评测与 PENDING/RUNNING/SUCCEEDED case fixture（带 run_id，测试后可清理）'
  test_data:
    legacy_asset_declaration: '- ${NEXENT_TEST_HOME}/config/environment.yaml（本地测试库连接、隔离租户账号）

      - 本地测试库预置的 stale RUNNING 评测与 PENDING/RUNNING/SUCCEEDED case fixture（带 run_id，测试后可清理）'
  steps:
  - order: 1
    action: 设置 NEXENT_TEST_HOME，连接本地测试库，初始化被测租户 tenant_A 与对照租户 tenant_B，并记录本次 run_id。
    expected: reap_stale_runs 返回计数等于 1（仅 run_stale 被收割），run_fresh 与 run_other 不计入。
  - order: 2
    action: 在 tenant_A 下构造评测运行 run_stale（status=RUNNING，update_time 早于当前时间 11 分钟，即超过 timeout_minutes=10 的 cutoff），并为其挂接三条
      case：case_pending（status=PENDING）、case_running（status=RUNNING）、case_done（status=SUCCEEDED）。
    expected: run_stale 的 case_pending 与 case_running 均被置为 FAILED，error_message 为 "Server restarted — evaluation was interrupted"，update_time
      被刷新；case_done 保持 SUCCEEDED 且 error_message 不变。
  - order: 3
    action: 在 tenant_A 下构造评测运行 run_fresh（status=RUNNING，update_time 为当前时间 5 分钟前，cutoff 之内），并挂接 case_pending2（status=PENDING）。
    expected: run_stale 行本身被置为 FAILED，error_message 与 case 行一致。
  - order: 4
    action: 在 tenant_B 下构造评测运行 run_other（status=RUNNING，update_time 早于 11 分钟前），并挂接 case_other（status=RUNNING）。
    expected: run_fresh（update_time 在 cutoff 内）保持 RUNNING，其 case_pending2 保持 PENDING，未被误收割。
  - order: 5
    action: 直接调用 database.agent_evaluation_db.reap_stale_runs(tenant_id=tenant_A, timeout_minutes=10)，记录返回计数与日志输出。
    expected: tenant_B 的 run_other 与 case_other 的 status、error_message 完全不变（跨租户隔离）。
  - order: 6
    action: 查询 tenant_A 下 run_stale 及其三条 case、run_fresh 及其 case 的 status、error_message、update_time。
    expected: 第二次调用返回 0，不存在残留 RUNNING 目标行（幂等，可重复执行）。
  - order: 7
    action: 查询 tenant_B 下 run_other 与 case_other 的 status 与 error_message，确认未被改动。
    expected: 第二次调用返回 0，不存在残留 RUNNING 目标行（幂等，可重复执行）。
  - order: 8
    action: 再次调用 reap_stale_runs(tenant_A, 10)，确认返回 0 且无残留 RUNNING 目标行。
    expected: 第二次调用返回 0，不存在残留 RUNNING 目标行（幂等，可重复执行）。
  - order: 9
    action: 测试结束后清理 run_id 相关数据，确保可重复执行。
    expected: 第二次调用返回 0，不存在残留 RUNNING 目标行（幂等，可重复执行）。
  expected_results:
  - reap_stale_runs 返回计数等于 1（仅 run_stale 被收割），run_fresh 与 run_other 不计入。
  - run_stale 的 case_pending 与 case_running 均被置为 FAILED，error_message 为 "Server restarted — evaluation was interrupted"，update_time
    被刷新；case_done 保持 SUCCEEDED 且 error_message 不变。
  - run_stale 行本身被置为 FAILED，error_message 与 case 行一致。
  - run_fresh（update_time 在 cutoff 内）保持 RUNNING，其 case_pending2 保持 PENDING，未被误收割。
  - tenant_B 的 run_other 与 case_other 的 status、error_message 完全不变（跨租户隔离）。
  - 第二次调用返回 0，不存在残留 RUNNING 目标行（幂等，可重复执行）。
  forbidden_side_effects: []
