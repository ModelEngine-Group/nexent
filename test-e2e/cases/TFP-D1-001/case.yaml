schema_version: '1.0'
stage: D1
module: RUNTIME-SANDBOX
case:
  case_id: TFP-D1-001
  feature_id: TFP-001
  requirement_ids:
  - TFP-001
  business_rule_ids:
  - TFP-RULE-001
  - TFP-RULE-005
  title: Simple official tool steps and final answers never acquire Docker
  type: SDK-UT
  priority: P0
  status: active
  automation: automated
  objective: Simple official tool steps and final answers never acquire Docker
  preconditions:
  - Use isolated official tool instances and a controlled executor factory.
  test_data:
    profile: mock
  steps:
  - order: 1
    action: Execute assignment, print and final_answer using an approved official tool.
    expected: The value, logs and final flag match the local interpreter.
  - order: 2
    action: Official aidp_search uses its existing allowed KDS scope and emits real tool events without Docker, including
      an empty permission scope with no provider request.
    expected: The existing AIDP authorization and complete-step routing contract is preserved.
  - order: 3
    action: Import json or loads/dumps using direct and aliased forms, parse an official tool result, serialize it with nested
      JSON calls and reuse aliases in later steps.
    expected: Values and logs match the real local interpreter with no ordinary executor.
  expected_results: &id001
  - Factory acquisition and warm-up counts are zero.
  - JSON loads/dumps and their import aliases work across steps without Docker.
  - The wrapped tool is called once and final_answer returns the saved result.
  - Official aidp_search uses its existing allowed KDS scope and emits real tool events without Docker, including an empty
    permission scope with no provider request.
  forbidden_side_effects:
  - No Docker bridge, container or kernel is created.
  unit_boundary: Restricted AST admission, real LocalPythonExecutor and NexentAgent executor lifecycle
  inputs:
  - Simple official tool steps and final answers never acquire Docker
  assertions: *id001
