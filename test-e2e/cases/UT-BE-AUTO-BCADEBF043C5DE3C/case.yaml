  assertions:
  - _normalize_skill_description 对 None/空字符串返回空字符串，对 ≤1000 字符输入原样返回。
  - 对 >1000 字符输入，返回长度恒为 SKILL_DESCRIPTION_MAX_LENGTH(1000)，内容为原始描述前 1000 字符，无截断外多余字符。
  - 超长描述经 create_skill/upsert_scanned_skills 写入 DB 成功、无异常抛出，落库 skill_description 长度为 1000。
  - 截断场景产生 warning 日志；日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
