  case_id: DEP-05
  feature_id: V5-DEP-05
  business_rule_ids:
  - V5-DEP-05-RULE-01
  title: 离线包完整性
  type: DEPLOYMENT
  priority: P1
  status: active
  automation: automated
  objective: 离线部署不访问公网
  preconditions:
  - '- ${NEXENT_TEST_HOME}/config/environment.yaml'
  test_data:
    legacy_asset_declaration: '- ${NEXENT_TEST_HOME}/config/environment.yaml'
  steps:
  - order: 1
    action: 使用 ${NEXENT_TEST_HOME}/config/environment.yaml 中的本地测试部署参数，记录当前 develop commit 和数据库版本。
    expected: 无意外公网依赖。
  - order: 2
    action: 使用 deploy/offline/build_offline_package.sh 以 --include-sandbox-full true 构建离线包，校验 manifest.yaml 的 includeFullSandbox
      为 "true"、images 列表包含 nexent-sandbox-full:<tag> 且 images/nexent-sandbox-full-*.tar 已生成。
    expected: 镜像/依赖缺失有明确清单。
  - order: 3
    action: 以 --target k8s 构建离线包，校验 deploy/docker/assets/official-skills-zip 目录含官方技能 zip 资产且 checksums.txt 记录其相对路径，并确认 k8s
      包剔除 deploy/docker 部署脚本、docker 包剔除 deploy/k8s 部署脚本。
    expected: --include-sandbox-full 时 manifest 含完整 Sandbox 镜像及对应 tar，--target k8s 时官方技能 zip 资产齐全且计入 checksums。
  - order: 4
    action: 在断网环境运行 load-images.sh：k8s 目标经 ctr -n k8s.io images import 导入、docker 目标经 docker load -i 导入，验证 images/*.tar 全部导入且无回退失败。
    expected: load-images.sh 在 k8s 目标经 ctr/containerd 导入、docker 目标经 docker load 导入均成功。
  - order: 5
    action: 部署/重启/迁移后依次检查 frontend、backend、DB、对象存储、向量库、worker/scheduler health。
    expected: load-images.sh 在 k8s 目标经 ctr/containerd 导入、docker 目标经 docker load 导入均成功。
  - order: 6
    action: 执行最小真实 Smoke：登录→真实 LLM Chat；如本用例涉及 KB 再执行一次真实 Embedding 检索。
    expected: load-images.sh 在 k8s 目标经 ctr/containerd 导入、docker 目标经 docker load 导入均成功。
  - order: 7
    action: 检查持久化数据和 schema version，确认重启/升级不会丢数据。
    expected: load-images.sh 在 k8s 目标经 ctr/containerd 导入、docker 目标经 docker load 导入均成功。
  - order: 8
    action: 保存安装日志、容器/Pod状态、migration输出和Smoke结果到当次 run 目录。
    expected: load-images.sh 在 k8s 目标经 ctr/containerd 导入、docker 目标经 docker load 导入均成功。
  expected_results:
  - 无意外公网依赖。
  - 镜像/依赖缺失有明确清单。
  - --include-sandbox-full 时 manifest 含完整 Sandbox 镜像及对应 tar，--target k8s 时官方技能 zip 资产齐全且计入 checksums。
  - load-images.sh 在 k8s 目标经 ctr/containerd 导入、docker 目标经 docker load 导入均成功。
