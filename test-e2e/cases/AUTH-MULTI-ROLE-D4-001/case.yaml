schema_version: '1.0'
stage: D4
module: AUTH-IDENTITY
case:
  case_id: AUTH-MULTI-ROLE-D4-001
  feature_id: AUTH-MULTI-ROLE
  requirement_ids:
  - AUTH-MULTI-ROLE-20261031
  business_rule_ids:
  - AUTH-MULTI-ROLE-RULE-02
  - AUTH-MULTI-ROLE-RULE-03
  - AUTH-MULTI-ROLE-RULE-04
  - AUTH-MULTI-ROLE-RULE-05
  - AUTH-MULTI-ROLE-RULE-06
  title: 管理员多选角色与邀请码并使用户入口即时匹配
  type: E2E
  priority: P1
  status: active
  automation: automated
  objective: 管理员多选角色与邀请码并使用户入口即时匹配
  preconditions:
  - Current-source management and required operations permission entry shell are available in an isolated test deployment.
  - Logical fixture accounts su, tenant_a_admin_1, tenant_a_admin_2, tenant_a_user and tenant_b_admin have isolated
    owned data.
  - No mutation touches shared users; cleanup uses the fixture SU account and keeps all evidence outside Git.
  test_data:
    tenants:
    - tenant_a
    - tenant_b
    ordinary_roles:
    - ADMIN
    - DEV
    - USER
    - OPS
  steps:
  - order: 1
    action: Login as tenant_a_admin_1, select DEV plus OPS in the user editor, save and filter the user list by
      OPS.
    expected: Two role labels are displayed, the target appears once, and the saved selection survives reopening.
  - order: 2
    action: Create an ADMIN plus OPS invitation, inspect its fixed role labels, then login with an owned pure OPS
      fixture.
    expected: Invitation has both roles and no role-edit control; pure OPS sees only operations dashboard, system
      configuration and the shared resource page. User search and model browsing work, with business mutation controls absent.
  - order: 3
    action: Use owned DEV plus OPS and SU sessions to inspect entries and tenant scope. As SU select another
      tenant in resource management and open the API Key tab. Remove OPS from the active target in a second
      admin session and refresh its authorization. The ADMIN viewer then adds OPS to
      their own roles through the editor without reloading the page.
    expected: Combined roles retain development entries; SU can select another tenant and see API Key metadata in the last tab; the revoked target
      loses OPS entries and direct protected navigation is denied or redirected without executing a business write.
      Saving the viewer's own roles refreshes the navigation immediately while retaining ADMIN.
  expected_results:
  - Two role labels are displayed, the target appears once, and the saved selection survives reopening.
  - Invitation has both roles and no role-edit control; pure OPS sees only operations dashboard, system configuration
    and the shared resource page with working user search and model browsing. Business mutation controls are absent.
  - Combined roles retain development entries; SU can select another tenant and see API Key metadata in the last tab; the revoked target loses
    OPS entries and direct protected navigation is denied or redirected without executing a business write. Saving
    the viewer's own roles refreshes navigation immediately while retaining ADMIN.
  forbidden_side_effects:
  - Implementing or treating dashboard/configuration business CRUD as part of this journey, modifying shared users
    or exposing keys.
  acceptance:
  - id: AC-01
    description: Two role labels are displayed, the target appears once, and the saved selection survives reopening.
    steps:
    - 1
    expected_results:
    - 1
  - id: AC-02
    description: Invitation has both roles and no role-edit control; pure OPS sees only operations dashboard, system
      configuration and the shared resource page with working user search and model browsing. Business mutation controls are absent.
    steps:
    - 2
    expected_results:
    - 2
  - id: AC-03
    description: Combined roles retain development entries; SU can select another tenant and see API Key metadata in the last tab; the revoked
      target loses OPS entries and direct protected navigation is denied or redirected without executing a business
      write. Saving the viewer's own roles refreshes navigation immediately while retaining ADMIN.
    steps:
    - 3
    expected_results:
    - 3
    forbidden_side_effects:
    - 1
  actor: Tenant ADMIN edits roles and invitations; isolated target and SU sessions observe resulting access.
  journey:
  - Admin role multi-select and role filtering.
  - Invitation creation and pure OPS workspace.
  - Combined roles and permission refresh after revocation.
  final_business_result:
  - Role selections, labels, menus and backend authorization agree without switching an active role.
  failure_evidence:
  - Sanitized Playwright trace, step screenshots on failure and actual response statuses without tokens.
