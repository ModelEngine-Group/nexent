schema_version: '1.0'
stage: D3
module: V5-BASELINE
case:
  case_id: AGT-025
  feature_id: F-059
  business_rule_ids: [F-059-RULE-01]
  title: 真实 Planning 受控外部工具故障、跳过与有界收口
  type: AGENT-IT
  priority: P0
  status: active
  automation: automated
  objective: 验证真实模型生成计划后调用受控失败工具，显式跳过失败步骤并有界收口，重复运行不复用历史资产。
  preconditions:
  - 本地 Nexent 服务和配置中的真实 LLM 可用。
  - 由仓库运行器启动受控 MCP 服务，提供 always_fail 及独占 wire 日志；不修改用户已有 MCP 配置。
  - 所有临时资源、运行和故障标记由本用例独占，配置和结果位于本地 test-home。
  test_data:
    logical_assets: [configured_llm, owned_agent, owned_failure_mcp, controlled_mcp_wire]
  steps:
  - order: 1
    action: 通过实际 API 注册独占 MCP 服务，刷新并查询 always_fail 工具，创建绑定该工具和配置中真实 LLM 的独占 Agent。
    expected: 服务健康，工具 ID 来自实际目录，Agent 可正常运行，不借用历史 plan_id。
  - order: 2
    action: 开启 enable_plan，通过真实运行接口要求创建三个步骤的计划、实际调用带唯一故障标记的 always_fail、跳过失败步骤并输出有界报告。
    expected: 返回当前独占 Debug run_id；实际 MCP wire 记录一次调用及相同故障码。
  - order: 3
    action: 完整消费 SSE，保存计划和步骤状态事件、故障 wire、运行 ID 及中断时已收到的协议事件。
    expected: 一次真实计划创建、有效且唯一的步骤 ID、引用当前步骤的状态更新及明确 skipped 事件；不是自然语言模拟计划。
  - order: 4
    action: 检查正常失败报告或根级错误终态；正常报告必须包含实际故障码，不得声称依赖成功。
    expected: 流完整结束且存在有界终态；超时、中断、嵌套错误或没有真实工具调用不能算通过。
  - order: 5
    action: 使用新故障标记再次执行同一故障场景，独立核验计划、wire、状态及终态。
    expected: 两次运行分别产生一次真实故障调用，不混入旧运行证据或重试重复调用。
  - order: 6
    action: 失败或中断时停止当前独占运行；删除独占 Agent 和 MCP 服务，通过资产日志记录清理状态，保留脱敏本地证据。
    expected: 不停止共享服务；清理失败单独保留，不吞掉异常。
  expected_results:
  - 真实模型与真实 Planning 运行调用实际绑定的受控外部失败工具，wire 证明故障发生。
  - 实际计划及步骤事件可解析且引用一致，失败依赖被跳过，不用关键词替代状态机验证。
  - 两次故障运行均有界收口；未完成、无调用或掩盖故障不得通过。
  - 独占资源清理且本地证据脱敏，不修改产品配置、其他用户资源或共享服务。
  forbidden_side_effects:
  - 不写入共享 Redis、不修改默认模型或共享 MCP 服务、不把中断计为通过。
  source:
    legacy_workbook_sha256: aa4b32414d30f12b3b64e14236268145e556bd7cfc5d3eb8df80731608ebc022
    legacy_sheet: 02_测试用例基线
    legacy_row: 115
    notes: 原实现只要求模型让工具超时，没有故障工具或调用证据。本次验证真实 MCP 异常及 Planning 跳过收口；不宣称覆盖真实网络超时、全部调整/停止/恢复路径，这些覆盖仍需对应专用用例验证。
  integration_boundary:
  - 真实配置 LLM 和产品运行接口；Mock 仅提供不可稳定制造的确定性外部工具异常。
  observations:
  - 计划和步骤状态事件、独占 run_id、MCP wire、终态与清理日志均保存本地并脱敏。
  cleanup:
  - 通过实际 API 停止失败的独占运行并删除本用例 Agent/MCP；清理失败不得吞掉。
  acceptance:
  - id: AC-01
    description: 真实 Planning 与受控 MCP 故障的重复执行、步骤状态、终态和清理按上述完整流程验证。
    steps: [1, 2, 3, 4, 5, 6]
    expected_results: [1, 2, 3, 4]
    forbidden_side_effects: [1]
