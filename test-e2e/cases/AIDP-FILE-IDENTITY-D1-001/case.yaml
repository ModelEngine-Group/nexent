schema_version: '1.0'
stage: D1
module: AIDP-KNOWLEDGE
case:
  case_id: AIDP-FILE-IDENTITY-D1-001
  feature_id: AIDP-CHAT-FILE-IDENTITY
  business_rule_ids:
    - AIDP-CHAT-FILE-IDENTITY-RULE-01
    - AIDP-CHAT-FILE-IDENTITY-RULE-03
  title: AIDP 命中身份进入来源技术引用，北向链接仅由请求级工具配置产生
  type: BE-UT
  priority: P1
  status: active
  automation: automated
  objective: >-
    验证后端组装 AIDP 工具配置时只在北向运行写入请求级标识，SDK 工具把 metadata.file_uuid/kds_id
    投影到页面来源技术引用，并且只有北向实例把 northbound_api_download_url 放进模型结果。
  preconditions:
    - 本机具备 Python 3.11 及仓库 backend/SDK 依赖；测试不访问真实 AIDP、数据库或模型服务。
    - 后端工具记录、AIDP 权限快照和北向外部基址由固定测试数据替换。
  test_data:
    knowledge_base: kb-42
    file_uuid: 11111111-2222-4333-8444-555555555555
    northbound_base: https://api.example.com/api
    records: 同文件两块、缺身份一块
  unit_boundary: >-
    create_tool_config_list 的 AIDP 分支与 SDK AidpSearchTool 实例化/命中转换协作；外部
    AIDP 请求、数据库、模型与进程环境均被替换。
  inputs:
    - 页面运行的 AIDP ToolConfig
    - 北向运行的 AIDP ToolConfig
    - 带完整身份、缺 file_uuid、缺 kds_id 的 FusionSearch 命中
  assertions:
    - 页面与北向工具配置都把完整 kds_id/file_uuid 写入 score_details，缺任一字段不形成 locator。
    - northbound_run 与外部基址只出现在北向 ToolConfig.metadata，不出现在 params，也不进入页面来源数据。
    - 北向模型结果对同文件多块给出同一 URL，缺身份命中省略字段；普通页面模型结果无该字段。
    - 非法北向基址使工具退化为不提供链接，而不是拼接相对地址或伪造身份。
  steps:
    - order: 1
      action: 以 northbound_run=false 组装 AIDP ToolConfig，实例化 SDK 工具并处理带身份命中。
      expected: score_details 保留 kds_id/file_uuid；页面与模型结果都没有 northbound_api_download_url。
    - order: 2
      action: 以 northbound_run=true 组装同一工具配置，处理同文件两块和缺身份命中。
      expected: metadata 含请求级标识与外链基址，模型结果仅对带身份命中增加逐字北向 URL，同文件多块 URL 相同，页面结果无该字段。
    - order: 3
      action: 检查 ToolConfig.params，并用非法外部基址重新安装北向链接。
      expected: params 不含请求级标识；非法基址下模型结果不出现北向字段。
  expected_results:
    - 身份只从 metadata.file_uuid 与 metadata.kds_id 同时存在时形成，逐命中保留且不合并。
    - 北向字段只在北向运行的模型结果出现，URL 只含 kds_id/file_uuid。
    - 页面运行无北向字段，缺身份或非法基址安全退化。
  forbidden_side_effects:
    - 不得发起真实 AIDP、数据库或模型请求。
    - 不得从文件名、file_url、chunk id 或知识库配置范围推断原文件身份。
    - 不得把 northbound_api_download_url 写入 search_results_json 或通用 url/file_url。
  acceptance:
    - id: AC-01
      description: Per-hit identity reaches the page technical reference without any northbound field.
      steps: [1]
      expected_results: [1, 3]
      forbidden_side_effects: [1, 2, 3]
    - id: AC-02
      description: Only a northbound tool configuration adds a model-only, locator-only URL.
      steps: [2, 3]
      expected_results: [2, 3]
      forbidden_side_effects: [1, 2, 3]
  tags:
    - aidp
    - citation
    - northbound
