notes: >-
  Partial binding. This case owns its opted-in Kubernetes release, two Runtime
  Pods, PostgreSQL/Redis data domain, identities, Northbound keys and controlled
  model. It uses loopback forwards to the deployed Web and stable Gateway
  Services and releases those processes before namespace and volume reclamation.
  One binding exercises public success, conflict, business quota and access
  control. It temporarily denies Redis journal XADD with exact ACL restoration,
  then cancels a PostgreSQL waiter on the case-owned Agent admission scope.
  The journal failure leaves a terminal execution without messages or journal
  events. The PostgreSQL rollback leaves no execution.
  A second disposable release has one Agent worker per Pod and no queue: the
  full Pod refuses a request that its peer can accept in a separate Agent scope.
  A third disposable release observes an upstream signed RUN acknowledgement
  of 202, buffers the initial signed RESUME stream without forwarding headers,
  then cuts it. Web returns 503 and Northbound returns 502. Each path must
  submit RUN and the initial RESUME once while the original execution
  settles. The relay restores the original selector and Ready Pod targets.
  All three check reservation and stream snapshots, model calls and owned cleanup.
  Formal execution and cleanup on a two-worker cluster remain unverified.
