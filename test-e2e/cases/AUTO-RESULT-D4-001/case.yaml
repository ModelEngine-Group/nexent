schema_version: '1.0'
stage: D4
module: V5-BASELINE
case:
  case_id: AUTO-RESULT-D4-001
  feature_id: F-126
  requirement_ids: [AUTO-RESULT-EXPAND-20261020]
  business_rule_ids: [F-126-RULE-01]
  title: Recent Result is the sole automation result control
  type: E2E
  priority: P1
  status: active
  automation: automated
  objective: Verify the redundant expansion column is removed and Recent Result retains loading, caching and retry.
  preconditions:
  - A running frontend and isolated authenticated browser with controlled task, run and conversation responses.
  test_data:
    profile: mock
    task: One completed run linked to an assistant message; first result request can be failed deterministically.
  steps:
  - order: 1
    action: Open the task page, verify no left expansion control or empty column, then view, collapse and reopen using Recent Result.
    expected: Only the seven business columns remain; the assistant output is shown and each result endpoint is fetched once; collapse and cached reopen do not refetch.
  - order: 2
    action: Reload the page, make the first result request fail, open using View Result, then collapse and retry using View Result.
    expected: The failure is reported and a fresh request displays the assistant output.
  expected_results:
  - Recent Result is the sole expansion control, displays the linked assistant output and reuses successful cache.
  - Failed loads remain retryable and report an error.
  forbidden_side_effects:
  - Viewing or collapsing results does not run, edit or delete a task or conversation.
  observations:
  - Result request counts and rendered assistant output.
  cleanup:
  - Dispose the isolated browser routes and context.
  execution:
    profiles:
    - name: mock
      required_services: []
  acceptance:
  - id: AC-01
    description: Remove the left expansion column and retain working result loading and cache through Recent Result.
    steps: [1]
    expected_results: [1]
    forbidden_side_effects: [1]
  - id: AC-02
    description: A failed first load is reported and can be retried through Recent Result.
    steps: [2]
    expected_results: [2]
    forbidden_side_effects: [1]
  actor: Authenticated automation owner
  journey:
  - Inspect a completed result using only Recent Result.
  - Recover a failed result load through the same control.
  final_business_result:
  - The completed automation output is available through Recent Result without a duplicate expansion column.
  failure_evidence:
  - Playwright trace and screenshot on assertion failure.
