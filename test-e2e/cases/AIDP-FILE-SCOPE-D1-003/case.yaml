{
  "schema_version": "1.0",
  "stage": "D1",
  "module": "AIDP-KNOWLEDGE",
  "case": {
    "case_id": "AIDP-FILE-SCOPE-D1-003",
    "feature_id": "AIDP-FILE-SCOPE",
    "requirement_ids": [
      "AIDP-FILE-SCOPE-REQ-002",
      "AIDP-FILE-SCOPE-REQ-003"
    ],
    "business_rule_ids": [
      "AIDP-FILE-SCOPE-RULE-02",
      "AIDP-FILE-SCOPE-RULE-03",
      "AIDP-FILE-SCOPE-RULE-04"
    ],
    "title": "AidpSearchTool emits original_file_name conditions per row and ignores the filter for graph",
    "type": "SDK-UT",
    "priority": "P0",
    "status": "active",
    "automation": "automated",
    "objective": "Prove that an enabled metadata filter becomes a FusionSearch metadata_condition on original_file_name with one condition per row and the mapped operator, that graph-enabled retrieval ignores the filter and still issues the request, and that unsupported operators fail closed without a request.",
    "preconditions": [
      "Construct AidpSearchTool directly with a fake AIDP URL and API key; replace the transport so no network call is possible.",
      "Operators follow the confirmed AIDP contract: contains / is / start with / end with."
    ],
    "test_data": {
      "profile": "mock",
      "kds_list": [
        "kb-1"
      ],
      "filter": "file name contains 合同",
      "operators": [
        "contains",
        "is",
        "starts_with",
        "ends_with"
      ],
      "graph": "vector_search plus graph_search"
    },
    "steps": [
      {
        "order": 1,
        "action": "Call forward with an enabled filter and vector retrieval for each supported operator.",
        "expected": "FusionSearch carries one original_file_name condition per row using the mapped wire operator; logical_operator follows the all/any match policy."
      },
      {
        "order": 2,
        "action": "Call forward with an enabled filter while the method includes graph_search.",
        "expected": "The FusionSearch request is sent without metadata_condition; the filter is ignored for graph retrieval."
      },
      {
        "order": 3,
        "action": "Call forward with the filter disabled.",
        "expected": "The existing retrieval payload is preserved and no metadata_condition is sent."
      },
      {
        "order": 4,
        "action": "Call forward with an unsupported operator.",
        "expected": "No request is sent and the unavailable denial is returned."
      },
      {
        "order": 5,
        "action": "Construct the tool with a malformed filter object.",
        "expected": "Construction raises a validation error."
      }
    ],
    "expected_results": [
      "Supported operators map to contains / is / start with / end with in one AND condition.",
      "Graph-enabled retrieval ignores the filter and still issues the request without metadata_condition.",
      "Disabled filters keep the existing payload.",
      "Malformed filters are rejected at construction."
    ],
    "forbidden_side_effects": [
      "Do not send an unfiltered request when a filter is enabled.",
      "Do not attach metadata_condition to a graph-enabled retrieval.",
      "Do not change retrieval method, Top K, thresholds or reranking."
    ],
    "unit_boundary": "sdk/nexent/core/ext_components/aidp/aidp_search_tool.py and metadata_filter.py with the transport replaced",
    "inputs": [
      "vector filter payload",
      "graph method",
      "disabled filter",
      "unsupported operator",
      "malformed filter"
    ],
    "assertions": [
      "single original_file_name condition",
      "graph denial",
      "no condition when disabled",
      "operator denial",
      "construction error",
      "Graph-enabled retrieval sends the request without metadata_condition."
    ],
    "acceptance": [
      {
        "id": "AC-01",
        "description": "File conditions become original_file_name conditions in the payload.",
        "steps": [
          1
        ],
        "expected_results": [
          1
        ],
        "forbidden_side_effects": [
          1,
          3
        ]
      },
      {
        "id": "AC-02",
        "description": "Graph retrieval ignores the filter.",
        "steps": [
          2
        ],
        "expected_results": [
          2
        ],
        "forbidden_side_effects": [
          1,
          2
        ]
      },
      {
        "id": "AC-03",
        "description": "Disabled filter keeps payload",
        "steps": [
          3
        ],
        "expected_results": [
          3
        ],
        "forbidden_side_effects": [
          1
        ]
      },
      {
        "id": "AC-04",
        "description": "Unsupported/malformed filters stop the request",
        "steps": [
          4,
          5
        ],
        "expected_results": [
          4
        ],
        "forbidden_side_effects": [
          1,
          2
        ]
      }
    ]
  }
}
