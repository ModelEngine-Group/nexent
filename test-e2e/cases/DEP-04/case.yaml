  objective: 大数据迁移超时或重复写；HITL 能力关闭/开启时表和触发器状态错误；重复升级破坏已有数据。
  preconditions:
  - '- ${NEXENT_TEST_HOME}/config/environment.yaml'
  test_data:
    legacy_asset_declaration: '- ${NEXENT_TEST_HOME}/config/environment.yaml'
  steps:
  - order: 1
    action: 对旧快照执行合并迁移并与全新安装 schema 等价比较。
    expected: 新装与升级 schema 等价。
  - order: 2
    action: 连续执行迁移两次验证幂等。
    expected: 两次迁移无重复/丢失。
  - order: 3
    action: 运行 test_unified_tag_management.sh，覆盖大数据量、断点和重复迁移。
    expected: 标签大数据迁移收敛。
  - order: 4
    action: 运行 test_sql_migrations.sh，覆盖 HITL 表/触发器按能力条件创建与清理。
    expected: HITL 表/触发器状态符合开关。
  - order: 5
    action: '迁移后执行真实 P0 Agent smoke 并读取持久化会话。

      473b6526：旧快照先升级 v2.5 merged，再分别走 v2.6 merged 与原文件序列，最后执行 P0 smoke。'
    expected: '真实 Agent smoke 与持久化读取成功。

      升级无冲突、无重复授权，数据库状态等价且 P0 可用。'
