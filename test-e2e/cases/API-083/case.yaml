    - 从 assets/skills/ 读取固定 Skill 包/SKILL.md，使用唯一名称避免与已有 Skill 冲突。
    - 按“listing list/search/status/mine/detail｜核心流程”通过实际 Skill API 执行上传、解析、编辑、同步、仓库发布/安装或 NL2Skill。
    - 调用 GET /repository/skill 并传入 tag=<精确标签>，断言仅返回 tags 包含该精确标签的 listing；再传入 tag_predicates=<JSON 数组结构化标签谓词>，断言结果按授权 skill_ids
      集合过滤且不出现跨租户数据。
    - '传入非 JSON 的 tag_predicates（如 {"a": ），断言返回 400 且 detail 提示“tag_predicates must be valid JSON”；传入 JSON 但非数组的值，断言返回 400
      且 detail 提示“tag_predicates must be a list”。'
    - 调用 GET /repository/skill/tags，断言返回 {"items":[{"tag","count"}]}，且仅统计本租户 status=shared 的 listing 标签计数。
    - 调用 GET /repository/skill/mine/counts，断言返回 {"counts":{"all","created","others"}}，计数与 /repository/skill/mine 的可见技能归属一致。
    - 检查文件树、元数据、入口文件、版本/状态与对象存储/本地工作区一致。
    - 需要生成的 Skill 使用真实 LLM，断言生成结果可保存且 SKILL.md 结构可被 loader 解析。
    - 将 Skill 绑定到测试 Agent，执行一次真实 Chat，确认 Skill 被按需加载并影响 Agent 上下文/工具。
    - 恶意 ZIP/路径场景使用本地安全资产，确认不会写出允许目录。
    - 市场发布/安装后用另一测试租户验证可见性和隔离。
    - 删除临时 Skill、市场记录和 Agent 绑定。
