    - tag 精确过滤仅返回 tags 包含指定标签的 listing；tag_predicates 按结构化谓词过滤后仅返回授权 skill_ids 集合内的 listing，且不出现跨租户结果。
    - tag_predicates 非 JSON 或非数组返回 400，detail 说明参数非法，不出现半写入或服务端异常。
    - GET /repository/skill/tags 仅返回本租户 status=shared 的标签及其计数，字段为 {tag, count}。
    - GET /repository/skill/mine/counts 返回 {all, created, others} 三个归属计数，且与 /repository/skill/mine 可见技能集合一致。
    - 失败路径返回明确错误，不出现半写入、重复副作用或跨租户泄露。
