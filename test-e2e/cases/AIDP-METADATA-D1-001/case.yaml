schema_version: "1.0"
stage: D1
module: AIDP-KNOWLEDGE
case:
  case_id: AIDP-METADATA-D1-001
  feature_id: AIDP-METADATA
  business_rule_ids: [AIDP-METADATA-RULE-02]
  title: Validate Metadata values and normalize per-chunk results
  type: BE-UT
  priority: P0
  status: active
  automation: automated
  objective: >-
    Prove string/number/time validation, byte limits and per-chunk result normalization without any HTTP call.
  preconditions:
    - The ontology service value helper is importable.
  test_data:
    profile: mock
    data: "logical fixtures for AIDP-METADATA-D1-001"
  steps:
    - order: 1
      action: >-
        Validate values for each supported field type.
      expected: >-
        Only matching types pass; booleans, nulls and mismatched types fail; string values over 256 bytes fail.
    - order: 2
      action: >-
        Normalize wrapped and unwrapped batch results.
      expected: >-
        Success/failure lists keep chunk ids and readable messages; missing summaries are derived from list lengths.
  expected_results:
    - Invalid values are rejected before submission.
    - Partial results remain per-chunk.
  forbidden_side_effects:
    - Do not guess a time format or coerce number strings.
  unit_boundary: aidp_ontology_service metadata_value_error and normalize_batch_metadata_result
  inputs:
    - field types and values
    - batch result envelopes
  assertions:
    - Type and byte checks match AIDP's documented contract.
    - Result counts and messages are preserved.
  acceptance:
    - id: AC-01
      description: >-
        Metadata values and batch results follow the contract.
      steps: [1, 2]
      expected_results: [1, 2]
      forbidden_side_effects: [1]

