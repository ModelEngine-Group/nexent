schema_version: '1.0'
stage: D2
module: V5-BASELINE
case:
  case_id: CTR-035
  feature_id: F-090
  business_rule_ids: [F-090-RULE-01]
  title: Nacos config CRUD/active/discover｜外部依赖异常与超时
  type: CONTRACT
  priority: P2
  status: active
  automation: automated
  objective: Nacos config CRUD/active/discover｜外部依赖异常与超时
  preconditions:
  - Nexent 测试服务和租户管理员身份可用。
  - 受控 A2A Mock 与真实 Nacos 就绪，config/a2a.yaml 符合维护的 Schema。
  - Mock 控制令牌从已声明配置获取，故障代理没有其他批次的注入。
  test_data:
    resource_ownership: 每次执行生成唯一名称和动态资源 ID，凭据由受保护 Mock fixture 提供。
  steps:
  - order: 1
    action: 创建使用受控 Nacos 网络代理的独立配置
    expected: 配置使用声明的机器级地址，不写固定资源 ID
  - order: 2
    action: 注入 40 秒下行延迟，通过 Nexent 发起发现
    expected: 产品发现总时限约 10 秒，返回明确的 504 超时提示，而不是测试客户端先超时
  - order: 3
    action: 恢复网络并检查 Agent 列表
    expected: 超时没有新增半成品 Agent；本用例 toxic 已删除
  - order: 4
    action: 重新通过同一配置发现 Agent
    expected: 返回 200，发现一条真实注册记录
  - order: 5
    action: 删除独立 Agent 与配置并回读
    expected: 均返回 404，清理失败独立报告
  expected_results:
  - 配置使用声明的机器级地址，不写固定资源 ID
  - 产品发现总时限约 10 秒，返回明确的 504 超时提示，而不是测试客户端先超时
  - 超时没有新增半成品 Agent；本用例 toxic 已删除
  - 返回 200，发现一条真实注册记录
  - 均返回 404，清理失败独立报告
  forbidden_side_effects:
  - 不覆盖已有 Nacos 配置、不删除其他批次资源、不泄露密码。
  source:
    legacy_workbook_sha256: aa4b32414d30f12b3b64e14236268145e556bd7cfc5d3eb8df80731608ebc022
    legacy_sheet: 02_测试用例基线
    legacy_row: 178
  contract:
    protocol: Nexent Nacos management API and real Nacos A2A discovery
    request_expectations:
    - 创建使用受控 Nacos 网络代理的独立配置
    - 注入 40 秒下行延迟，通过 Nexent 发起发现
    - 恢复网络并检查 Agent 列表
    - 重新通过同一配置发现 Agent
    - 删除独立 Agent 与配置并回读
    response_expectations:
    - 配置使用声明的机器级地址，不写固定资源 ID
    - 产品发现总时限约 10 秒，返回明确的 504 超时提示，而不是测试客户端先超时
    - 超时没有新增半成品 Agent；本用例 toxic 已删除
    - 返回 200，发现一条真实注册记录
    - 均返回 404，清理失败独立报告
  acceptance:
  - id: AC-01
    description: An owned proxy configuration reaches the 10-second product discovery deadline with an actionable 504.
    steps: [1, 2]
    expected_results: [1, 2]
    forbidden_side_effects: [1]
  - id: AC-02
    description: Fault removal leaves no partial Agent, discovery recovers and owned resources are cleaned up.
    steps: [3, 4, 5]
    expected_results: [3, 4, 5]
    forbidden_side_effects: [1]
