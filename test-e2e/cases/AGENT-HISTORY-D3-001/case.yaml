schema_version: '1.0'
stage: D3
module: V5-BASELINE
case:
  case_id: AGENT-HISTORY-D3-001
  feature_id: F-171
  business_rule_ids:
  - F-171-RULE-01
  title: Real Agent execution history summary and authorized result recall
  type: AGENT-IT
  priority: P0
  status: active
  automation: manual
  objective: Verify actual Agent/model/result-store collaboration with Phoenix evidence.
  preconditions:
  - Run the tested source revision in Nexent-Test with real model and Phoenix configured.
  - Use isolated test conversation and model resources; retain evidence below task worktree.
  test_data:
    legacy_asset_declaration: Deterministic long tool result with a middle sentinel and an error-after-output scenario;
      no secrets.
  steps:
  - order: 1
    action: Run short and multi-code-block tasks and inspect subsequent real model input.
    expected: One assistant read-only completed_action_history contains completed_action, actual tool/input and
      outcome/recorded_result/recorded_error fields. Code and identical result text appear once, including Docker
      OUTPUT versus its Python string representation in RETURN_VALUE; false values, distinct returns and partial
      errors remain.
  - order: 2
    action: Run a long result across the configured context threshold; inspect summary call and repeated assembly.
    expected: Only selected finished result is summarized once; SUMMARIED_RESULT and real message/unit reference
      replace full output.
  - order: 3
    action: Ask Agent to recall a middle sentinel using the reference; attempt an unauthorized reference.
    expected: Read real original text without rerunning original tool; deny unauthorized reference; loaded text
      reaches next model request.
  - order: 4
    action: Finish run and inspect stored unit JSON and browser history.
    expected: Original content and summary preserved; page still shows original code and results.
  - order: 5
    action: Inspect Phoenix prompts, tool spans, summary output, latency and final output for all scenarios.
    expected: No masked raw data returns; record actual source/model/trace IDs and separate missing performance
      evidence.
  - order: 6
    action: Complete a CodeAgent step whose interpreter computes a large business-tool argument, then send a second
      user turn; repeat after accepted post-response summary or preview and with a rejected pre-execution candidate.
    expected: Authorized persisted history restores the actual dispatched interpreter source and original result
      or committed compact view exactly once. Expanded business arguments stay in raw storage; uncovered or unproven
      records remain conservative evidence, rejected code is never promoted to execution, and an irreducible new
      frame at or above the combined window still fails without an auxiliary request.
  - order: 7
    action: On both real Agent runtimes, reject a cold oversized full frame with eligible committed history and
      a fitting protected frame; recover old history once, continue the request and a later user turn. Repeat summary
      failure, no gain, cancellation/deadline, stale/conflicting sources, repeated prepare/final checks and provider
      overflow. Inspect covered checkpoint recall and Phoenix phases.
    expected: Normal fitting prepare makes no summary call. One logical completion shares a single recovery transaction
      and at most three auxiliary summary subrequests (transport retries remain separately counted). Only actual
      rendered reduction with final full frame below C commits old facts; rejected candidates roll back with no
      truncation or half-registered references. Accepted old summaries survive a later main failure. Both runtimes
      recall an authorized original middle range through bounded real tools, reject foreign/invalid/stale references,
      and behave identically with tracing off; private source bodies never enter the summary wire. All physical
      usage and recovery phase provenance are retained.
  - order: 8
    action: On both real runtimes, use actual authorized user-message and native/CodeAgent result sources to compact
      structured bulk; continue across a persisted checkpoint and inspect original middle-page numbers and Phoenix
      source provenance. Keep same-ID outside facts and run missing/stale/foreign/invalid source negatives.
    expected: Only fully covered arrays with useful reduction use trusted kind/ref/hash/path/count descriptors.
      Original values/types and array order remain recoverable; object key order is insignificant. Unknown, ambiguous
      duplicate-key, incomplete or stale proof stays unexempted. Cross-checkpoint proofs are revalidated atomically.
      Current prompt and open transactions remain protected; no arbitrary history RPC, dataset/model special case
      or output cap is added.
  expected_results:
  - Real Agent completes with correct final answer and no repeated side effects.
  - Summary and recall match tested source and persisted execution record.
  - Cross-turn context retains only proven action coverage and accepted representations while original facts remain
    authorized and readable.
  - Explicit capacity recovery preserves current prompt, system/developer, schemas, overlays and unfinished native
    groups; full originals remain authorized, independently readable and absent from compact wire views.
  - Structured bulk uses only complete typed source coverage; native local IDs and wire provider IDs stay distinct,
    and original user text is never mislabeled as execution output.
  forbidden_side_effects:
  - Cross-conversation result access
  - Replacing or deleting original tool results
  - Changing guardrail rules
  source:
    notes: Approved chat-action-history-offload design; current change AGENT-HISTORY-20261030.
  integration_boundary:
  - Actual CoreAgent/provider and result unit storage; real model and Phoenix.
  observations:
  - Final messages, tool execution count, summary count, recalled sentinel and actual latency.
  cleanup:
  - Remove only task test resources after retaining sanitized evidence.
  acceptance:
  - id: AC-01
    description: Accepted code appears once followed by actual execution evidence, including false values and partial
      errors.
    steps:
    - 1
    expected_results:
    - 1
  - id: AC-02
    description: Only selected finished results are summarized once, replacing the full result with a stable reference.
    steps:
    - 2
    expected_results:
    - 2
  - id: AC-03
    description: Recall authorized original ranges without rerunning business tools; deny unauthorized references
      and preserve loaded text for the next request.
    steps:
    - 3
    expected_results:
    - 1
    - 2
    forbidden_side_effects:
    - 1
  - id: AC-04
    description: Persist original content and summary with the real message and unit index; preserve browser history.
    steps:
    - 4
    expected_results:
    - 2
    forbidden_side_effects:
    - 2
  - id: AC-05
    description: Inspect Phoenix prompts and results for masking compatibility, observed latency, and the final
      answer.
    steps:
    - 5
    expected_results:
    - 1
    - 2
    forbidden_side_effects:
    - 3
  - id: AC-06
    description: Restore backend-bound completed actions and accepted views across user turns without reinjecting
      computed argument copies, losing errors, or relaxing the hard guard.
    steps:
    - 6
    expected_results:
    - 1
    - 2
    - 3
    forbidden_side_effects:
    - 1
    - 2
    - 3
  - id: AC-07
    description: Verify one transactional history-only recovery after typed capacity rejection, shared budgets and
      deadline, exact rendered full-frame fit, rollback and cross-run original recall on both runtimes; distinguish
      local capacity, provider overflow and post-response phases.
    steps:
    - 7
    expected_results:
    - 2
    - 3
    - 4
    forbidden_side_effects:
    - 1
    - 2
    - 3
  - id: AC-08
    description: Real-model/container evidence for exact typed source-backed bulk, strict outside facts and atomic
      cross-checkpoint original recall on both runtimes; full frozen long-task scale is tested separately from static
      estimates.
    steps:
    - 8
    expected_results:
    - 2
    - 3
    - 5
    forbidden_side_effects:
    - 1
    - 2
    - 3
