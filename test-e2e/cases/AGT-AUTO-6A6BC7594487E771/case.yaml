  - 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
  - 真实模型调用成功，stream/Agent run 正常结束；自然语言只做稳定关键词/结构/工具调用断言。
  - update_fields/manage_resources/optimize_conversation/clarify_requirements 各局部任务只执行对应最小流程，均不进入完整生成链；局部保存可发送 agent_draft_fields_saved 或 agent_generation_completed，实际保存范围必须通过 execution_logs 的成功回执 updated_fields 和草稿回读交叉验证。
