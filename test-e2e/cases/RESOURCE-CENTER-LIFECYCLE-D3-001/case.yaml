  integration_boundary:
  - HTTP → real service/adapters → migrated PostgreSQL; repository snapshots and local Skill relations are real.
  - Use sandbox storage for Skill archives and record notification enqueue after commit; no substituted database
    or repository adapters.
  observations:
  - create_time固定；每次进入pending设submitted_at并增revision；每次批准设published_at，其他动作不变；提交新轮清review_comment且保留本轮说明。
  - 有效内容替换递增revision；纯无变化请求不伪装新提交；Agent相同版本旧路径不擅自替换冻结agent_info_json。
  - 历史时间保持null，legacy_note标明旧备注而不复制两字段；后续动作写新字段，空审核意见明确保存null，不残留上架说明为审核意见。
  - UNSET/保留与NULL/清空可区分；说明不被覆盖；仓库、源对象及受影响同源记录共用同一Session，任一步失败全部回滚，无内部提前commit。
  - 每轮submitted_user_id等于真实认证提交人；审核和撤回不改；新轮以新实际提交人重算mine/all_authorized；display邮箱变化不改用户ID授权。
  cleanup:
  - 按run_id清理本Case创建的仓库记录、源资源、归档及通知；不触及基线资源。
  - 保存脱敏请求、逐步DB断言和清理结果；清理失败不得报告PASS。
