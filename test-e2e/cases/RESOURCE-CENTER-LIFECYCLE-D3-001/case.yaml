  - RESOURCE-CENTER-LIFECYCLE-RULE-008
  title: 三类业务时间、意见与提交轮次持久化
  type: INTEGRATION
  priority: P1
  status: blocked
  automation: automated
  objective: 三类业务时间、意见与提交轮次持久化
  preconditions:
  - BLOCKED：目标功能尚未实施；接口、增量迁移、固定脚本和case-local execution绑定是执行前置条件。
  - 在仓库外的隔离测试环境准备run_id及独立租户；禁止使用生产数据或记录密钥。
  - 使用真实产品鉴权、服务和持久层；外部依赖使用受控fixture；不要求真实模型调用。
  test_data:
    timeline: 每步持久化前后快照；使用可控制时钟或可区分的fixture时间，避免sleep比较
    types:
    - agent
    - skill
    - mcp
  steps:
  - order: 1
    action: 三类型首次提交并修改本地配置
    expected: 只新增审核申请，仓库不变；审核详情仍为提交快照。
  - order: 2
    action: 提交相同内容及不同内容
    expected: 相同返回原review_id且时间不变；不同409，不替换快照。
  - order: 3
    action: 驳回后重新提交，再审核通过
    expected: 驳回不写仓库；重提新ID，通过后从新申请快照发布。
  - order: 4
    action: 下架后查询申请和仓库最新排序
    expected: 已通过记录仍可查；上架时间取reviewed_at，计数和下架不改该时间。
  - order: 5
    action: 认证CAS身份提交并读取本人范围
    expected: 使用映射内部ID；历史迁入明确使用创建人ID，邮箱变化不影响权限。
  expected_results:
  - 只新增审核申请，仓库不变；审核详情仍为提交快照。
  - 相同返回原review_id且时间不变；不同409，不替换快照。
  - 驳回不写仓库；重提新ID，通过后从新申请快照发布。
  - 已通过记录仍可查；上架时间取reviewed_at，计数和下架不改该时间。
  - 使用映射内部ID；历史迁入明确使用创建人ID，邮箱变化不影响权限。
  forbidden_side_effects:
  - 不得绕过审核表提前覆盖仓库内容或修改已完成申请。
  - 失败事务不得留下仓库半写入或丢失申请数据。
