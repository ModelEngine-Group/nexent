schema_version: '1.0'
stage: D2
module: V5-BASELINE
case:
  case_id: SKILL-LIST-CONTENT-D2-001
  feature_id: F-072
  business_rule_ids: [F-072-RULE-02]
  title: 技能列表默认省略正文，显式请求和详情保留正文
  type: API-IT
  priority: P1
  status: active
  automation: automated
  objective: Verify the deployed HTTP list opt-in and detail compatibility using an owned skill.
  preconditions:
  - The authenticated tenant_a_user anchor can create and delete a skill in the running config service.
  - The suite runtime and ownership cleanup journal are prepared outside the repository.
  test_data:
    skill: Unique run-scoped custom skill with a nonempty body, created by this case.
  steps:
  - order: 1
    action: Create an owned skill, then request the list without a flag and with include_content=false.
    expected: Both lists contain that skill with no content key and otherwise equal metadata.
  - order: 2
    action: Request include_content=true and retrieve the created skill by ID.
    expected: Both expose the same nonempty body; list metadata matches the default response.
  - order: 3
    action: Request an invalid include_content value and read the skill again.
    expected: The invalid flag returns 422 and the stored body is unchanged.
  - order: 4
    action: Delete the owned skill in finally and confirm it is absent.
    expected: No owned skill remains, including after a failed assertion.
  expected_results:
  - Default and false list reads omit content while retaining all other fields.
  - True list reads and single-skill details contain the original nonempty body.
  - Invalid flag validation returns 422 without changing stored content.
  - Owned skill cleanup is confirmed by a 404 detail read.
  forbidden_side_effects:
  - List flags must not modify the stored skill or leave case-owned resources behind.
  contract:
    protocol: HTTP API
    request_expectations:
    - GET /skills supports omitted, false, true and invalid include_content values.
    - GET /skills/{skill_id} remains a full-detail read.
    response_expectations:
    - Default and false responses omit content; true retains it with otherwise identical metadata.
    - Invalid include_content returns 422; reads preserve the stored body.
  acceptance:
  - id: AC-01
    description: List content selection and full detail compatibility are observable through the deployed API.
    steps: [1, 2]
    expected_results: [1, 2]
  - id: AC-02
    description: Invalid flags do not mutate content and owned resources are always cleaned up.
    steps: [3, 4]
    expected_results: [3, 4]
    forbidden_side_effects: [1]
