schema_version: '1.0'
stage: D5
module: OPS-PLATFORM
case:
  case_id: OPS-MODEL-MONITORING-D5-001
  feature_id: OPS-MODEL-MONITORING
  requirement_ids: [OPS-MODEL-MONITORING-20261116, OPS-AUTOMATIC-INITIALIZATION-20261119]
  business_rule_ids: [OPS-MODEL-MONITORING-RULE-01]
  title: Ops monitoring migration is repeatable and confined to the Ops database
  type: DEPLOYMENT
  priority: P1
  status: active
  automation: automated
  objective: Verify that the Ops service alone owns automatic independent control storage initialization, while other services start without Ops migration dependencies.
  preconditions: [An isolated PostgreSQL server can host separate Nexent and Ops databases]
  test_data: {databases: Existing Nexent database and an Ops database that does not yet exist}
  steps:
  - order: 1
    action: Launch through the Ops-only start-ops.sh with monitoring and Ops connection overrides omitted and the business database already present.
    expected: Both monitoring control tables exist under the Ops schema.
  - order: 2
    action: Run the same migration again and inspect both databases.
    expected: The Ops schema is unchanged and the Nexent database has no monitoring control tables.
  - order: 3
    action: Start two Ops initializers concurrently and run the SQL helper's read-only wait probe before another Ops initialization completes.
    expected: Both initializers succeed, existing data is preserved, and the read-only probe completes only after Ops migrations are applied.
  - order: 4
    action: Explicitly disable monitoring, attempt a shared database name, and attempt initialization with a role without database creation permission.
    expected: Disabled startup creates no Ops storage; invalid or unauthorized initialization fails before application launch.
  - order: 5
    action: Launch a non-Ops service through the generic backend entrypoint with monitoring enabled and no Ops migration helper in its image directory.
    expected: Its application command starts successfully and no Ops database is created.
  expected_results: [Both Ops control tables exist after migration, Reapplying preserves the schema, Concurrent and waiting starts respect initialization ordering, Disabled and failed initialization preserve isolation and do not start an unready application, Non-Ops startup succeeds without Ops migration files or storage initialization]
  forbidden_side_effects: [Creating an Ops monitoring table in the Nexent database, Requiring Ops migration files or creating an Ops database during an explicitly excluded service startup]
  acceptance:
  - id: AC-01
    description: New setup and repeated migration target the Ops database only.
    steps: [1, 2]
    expected_results: [1, 2]
    forbidden_side_effects: [1]
  - id: AC-02
    description: Default deployment creates Ops storage automatically and concurrent startup preserves ordering and existing data.
    steps: [1, 2, 3]
    expected_results: [1, 2, 3]
    forbidden_side_effects: [1]
  - id: AC-03
    description: Explicit disable and initialization failures never create Ops tables in the business database or launch an unready application.
    steps: [4]
    expected_results: [4]
    forbidden_side_effects: [1]
  - id: AC-04
    description: Non-Ops service entrypoints never run Ops SQL initialization, regardless of the shared monitoring switch.
    steps: [5]
    expected_results: [5]
    forbidden_side_effects: [2]
  risk_type: DEPLOYMENT
  risk: A migration targets the Nexent business database or changes the Ops schema on reapplication.
  condition: [Use distinct databases and run the deployment migration twice]
  metrics: [Database target and control-table count]
  thresholds: [Two control tables in Ops and zero in Nexent]
  recovery_expectations: [A subsequent deployment can reuse the initialized Ops database]
