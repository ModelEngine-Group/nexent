  unit_boundary: 前端流式状态
  inputs:
  - '- history_summary SSE 事件固定 fixture（compacting/accepted/idle/malformed JSON JSON.stringify 样例，内嵌于测试代码）'
  assertions:
  - history_summary SSE 事件映射为 name=history-summary 的 data part；status=compacting 渲染加载态（spinner + 文案），不显示摘要正文。
  - status=accepted 渲染可折叠卡片，展示标题、covered_through_message_id 与 markdown 摘要正文。
  - summary 为空（无 markdown）时组件返回 null，不产生空摘要卡片。
  - status=idle 移除已有 history-summary 卡片；compacting/accepted 之外的 status 不改变渲染。
  - malformed JSON 被静默降级，不抛出异常、不产生伪卡片，功能结果与代码契约一致。
  - 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
