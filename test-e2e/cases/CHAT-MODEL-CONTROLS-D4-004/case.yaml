schema_version: '1.0'
stage: D4
module: CHAT-MESSAGE
case:
  case_id: CHAT-MODEL-CONTROLS-D4-004
  feature_id: CHAT-MODEL-CONTROLS
  requirement_ids: [CHAT-MODEL-CONTROLS-20261014, CHAT-SAMPLING-DISPLAY-20261019]
  business_rule_ids: [CHAT-MODEL-CONTROLS-RULE-006, CHAT-MODEL-CONTROLS-RULE-007]
  title: 窄窗口的模型菜单可读、可操作且可还原
  type: E2E
  priority: P1
  status: active
  automation: automated
  objective: Exercise the shared model controls in a representative Workbench composer at 908 by 608 CSS pixels.
  preconditions:
  - The Workbench loads with an isolated mock model whose outlet declares effort choices and has no saved effort or sampling default.
  test_data:
    profile: mock
    viewport: 908x608
    locales: [zh, en]
    model: Effort B
  steps:
  - order: 1
    action: Enable thinking, choose Extra high in the compact dropdown, reset it and reopen the menu in both languages.
    expected: The long choice is readable in the popup and selected field, and the selected control is at most 128 CSS pixels wide. The field and trigger agree after selecting and resetting. The dropdown remains operable after reset.
  - order: 2
    action: Open Advanced settings, try zero, the minimum slider position, and 0.995 in Top P, then clear it. Change temperature, reset and dismiss the panel with Escape.
    expected: The temperature and Top P inputs and reset button fit in the viewport. Both missing values start empty with readable Service default placeholders. Top P rejects zero, the slider minimum is 0.01, and 0.995 survives confirmation. Clearing restores the empty input. Temperature accepts and clears an explicit zero. The temperature slider creates an explicit temperature, reset returns it to empty, and Escape leaves the parent menu's quick controls usable.
  expected_results:
  - Reasoning selection and reset remain readable and consistent in the shared model menu.
  - The narrow sampling panel accepts and clears an explicit value, then returns control to the model menu.
  forbidden_side_effects:
  - Draft-only menu interaction neither starts a run nor writes model, configuration or conversation preferences to the server.
  actor: Isolated authenticated Workbench user
  journey: [Open model controls, Change and reset effort, Change and reset sampling, Close nested panel]
  final_business_result:
  - Users can change and restore model parameters without losing access to the controls in a narrow window.
  failure_evidence: [Browser screenshot and trace]
  execution:
    profiles:
    - name: mock
      required_services: []
  acceptance:
  - id: AC-01
    description: Narrow reasoning controls display the selected and reset values consistently in Chinese and English.
    steps: [1]
    expected_results: [1]
    forbidden_side_effects: [1]
  - id: AC-02
    description: Narrow advanced controls allow sampling edits and reset with accessible nested dismissal.
    steps: [2]
    expected_results: [2]
    forbidden_side_effects: [1]
