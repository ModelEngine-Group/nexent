schema_version: '1.0'
stage: D3
module: V5-BASELINE
case:
  case_id: AGT-015
  feature_id: F-055
  business_rule_ids:
  - F-055-RULE-01
  title: /agent/run SSE 基础流、事件顺序、终态｜外部依赖异常与超时
  type: AGENT-IT
  priority: P0
  status: active
  automation: automated
  objective: /agent/run SSE 基础流、事件顺序、终态｜外部依赖异常与超时
  preconditions:
  - Nexent 本地测试全栈已启动，health check 通过。
  - 设置 NEXENT_TEST_HOME，目录不位于 Nexent Git 仓库内。
  - 当次 run_id 已生成，所有新建资源名称带 run_id；测试基线固定为 develop 当前批次锁定的产品提交；执行时另记录实际被测commit。
  - 所需本地资产存在且校验通过：${NEXENT_TEST_HOME}/config/models.yaml；${NEXENT_TEST_HOME}/config/secrets.env
  - Runner 已启动受控 HTTP 资产服务并提供现有服务 URL。创建仅本用例使用的有效模型记录，其 Provider 固定返回 503；不修改租户默认模型，不以不存在模型 ID 代替 Provider 故障。
  - 使用已有 tenant_a_admin 账号创建及清理模型；使用同租户 tenant_a_user 执行 Runtime 请求，不要求普通用户拥有 model:create 权限。
  test_data:
    legacy_asset_declaration: '- ${NEXENT_TEST_HOME}/config/models.yaml

      - ${NEXENT_TEST_HOME}/config/secrets.env'
  steps:
  - order: 1
    action: 从本地 models.yaml 读取真实 LLM 配置，并准备固定测试 Agent、Prompt、Tool/KB/子Agent 依赖；记录当前 git commit 和 model snapshot。
    expected: 功能结果与代码契约一致，测试过程无未处理异常。
  - order: 2
    action: 通过 Nexent 实际 Agent API 创建/选择测试 Agent，保证配置已保存并可在运行接口中解析到正确 agent_id/model_id。
    expected: 关键状态在 API 返回、数据库/存储和后续读取中保持一致。
  - order: 3
    action: 用本用例创建的有效模型 ID 覆盖运行模型，通过真实 Agent Runtime 发起请求；读取独立 nonce 的 Provider 调用回执和完整 SSE。
    expected: Provider 至少收到一次本用例请求且固定返回 503；SSE 以显式根 error 终态结束，不允许由默认模型成功回答或任意文本中的 error 字样代替故障验收。
  - order: 4
    action: 保存本次独立 nonce 的调用次数和 503 回执；检查 SSE 最后有效 payload 为根 error 且错误内容非空。
    expected: 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
  - order: 5
    action: 删除本用例创建的模型并清理本次 nonce 的受控服务回执；由资产注册表记录模型清理结果。
    expected: 本用例模型已删除，清理失败单独呈现；租户默认模型未被替换。
  expected_results:
  - 功能结果与代码契约一致，测试过程无未处理异常。
  - 关键状态在 API 返回、数据库/存储和后续读取中保持一致。
  - 失败路径返回明确错误，不出现半写入、重复副作用或跨租户泄露。
  - 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
  - 本用例有效模型记录对应的受控 Provider 收到请求并返回 503；SSE 显式根 error 终态，不以默认模型回答代替失败验收。
  forbidden_side_effects: []
  source:
    legacy_workbook_sha256: aa4b32414d30f12b3b64e14236268145e556bd7cfc5d3eb8df80731608ebc022
    legacy_sheet: 02_测试用例基线
    legacy_row: 105
  integration_boundary:
  - REAL_REQUIRED：使用 ${NEXENT_TEST_HOME}/config/models.yaml 中配置的真实模型/向量/Rerank/语音/多模态能力；Mock 仅用于不可稳定制造的 5xx/超时/畸形响应故障注入。
  observations:
  - 受控 503 Provider 仅用于不可稳定制造的外部依赖故障；清理本用例模型和回执，不改共享模型配置。
  - 功能结果与代码契约一致，测试过程无未处理异常。
  - 关键状态在 API 返回、数据库/存储和后续读取中保持一致。
  - 失败路径返回明确错误，不出现半写入、重复副作用或跨租户泄露。
  - 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
  - 本用例有效模型记录对应的受控 Provider 收到请求并返回 503；SSE 显式根 error 终态，不以默认模型回答代替失败验收。
  cleanup:
  - JUnit/XML、完整Agent run_id、stream事件摘要、tool/retrieval trace、model snapshot、Telemetry span（脱敏）。
