  - REAL_REQUIRED：使用 ${NEXENT_TEST_HOME}/config/models.yaml 中配置的真实模型/向量/Rerank/语音/多模态能力；Mock 仅用于不可稳定制造的 5xx/超时/畸形响应故障注入。
  observations:
  - 开启 allow_chat_metadata 的 Agent 接受合法 metadata 并正常到达终态。
  - D3-META-314159 可从运行结果或受控工具观察到。
  - runtime metadata 与审计 meta_data 字段保持隔离。
