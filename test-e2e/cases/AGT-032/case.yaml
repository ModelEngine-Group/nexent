  title: metadata 进入 Agent context，与 meta_data 审计字段隔离｜核心流程
  type: AGENT-IT
  priority: P0
  status: active
  automation: automated
  objective: metadata 进入 Agent context，与 meta_data 审计字段隔离｜核心流程
  preconditions:
  - Nexent 本地测试全栈已启动，health check 通过。
  - 设置 NEXENT_TEST_HOME，目录不位于 Nexent Git 仓库内。
  - 当次 run_id 已生成，所有新建资源名称带 run_id；测试基线固定为 develop 473b65268ba8cda3db53be735f97678e214c583b；执行时另记录实际被测commit。
  - 所需本地资产存在且校验通过：${NEXENT_TEST_HOME}/config/models.yaml；${NEXENT_TEST_HOME}/config/secrets.env
  - models.yaml 中本用例所需真实 Provider 已配置，secrets.env 中凭据有效，预检连通性通过。
  - 使用独立 metadata Agent，持久配置 allow_chat_metadata=true；不得复用默认关闭该能力的 basic Agent。
  test_data:
    legacy_asset_declaration: '- ${NEXENT_TEST_HOME}/config/models.yaml

      - ${NEXENT_TEST_HOME}/config/secrets.env'
  steps:
  - order: 1
    action: 创建 allow_chat_metadata=true 的独立持久化 Agent。
    expected: 开启 allow_chat_metadata 的 Agent 接受合法 metadata 并正常到达终态。
  - order: 2
    action: '以 metadata={project: D3-META-314159, nested:{scope:runtime}} 调用真实 /agent/run。'
    expected: D3-META-314159 可从运行结果或受控工具观察到。
  - order: 3
    action: 读取完整 SSE 到终态，断言 Agent 上下文能够访问 project marker。
    expected: runtime metadata 与审计 meta_data 字段保持隔离。
  - order: 4
    action: 查询会话记录，确认 runtime metadata 持久化在约定字段，且未混入审计 meta_data。
    expected: runtime metadata 与审计 meta_data 字段保持隔离。
  - order: 5
    action: 清理独立 Agent 与会话。
    expected: runtime metadata 与审计 meta_data 字段保持隔离。
  expected_results:
  - 开启 allow_chat_metadata 的 Agent 接受合法 metadata 并正常到达终态。
  - D3-META-314159 可从运行结果或受控工具观察到。
  - runtime metadata 与审计 meta_data 字段保持隔离。
  forbidden_side_effects: []
