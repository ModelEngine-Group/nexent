  title: 记忆检索/embedding/policy 注入 Agent context 与 token budget｜核心流程
  type: AGENT-IT
  priority: P0
  status: active
  automation: automated
  objective: 记忆检索/embedding/policy 注入 Agent context 与 token budget｜核心流程
  preconditions:
  - Nexent 本地测试全栈已启动，health check 通过。
  - 设置 NEXENT_TEST_HOME，目录不位于 Nexent Git 仓库内。
  - 当次 run_id 已生成，所有新建资源名称带 run_id；测试基线固定为 develop 当前批次锁定的产品提交；执行时另记录实际被测commit。
  - 所需本地资产存在且校验通过：${NEXENT_TEST_HOME}/config/models.yaml；${NEXENT_TEST_HOME}/config/secrets.env；${NEXENT_TEST_HOME}/assets/knowledge/；${NEXENT_TEST_HOME}/assets/expected/kb_expected.json；${NEXENT_TEST_HOME}/config/users.yaml
  - models.yaml 中本用例所需真实 Provider 已配置，secrets.env 中凭据有效，预检连通性通过。
  test_data:
    legacy_asset_declaration: '- ${NEXENT_TEST_HOME}/config/models.yaml

      - ${NEXENT_TEST_HOME}/config/secrets.env

      - ${NEXENT_TEST_HOME}/assets/knowledge/

      - ${NEXENT_TEST_HOME}/assets/expected/kb_expected.json

      - ${NEXENT_TEST_HOME}/config/users.yaml'
  steps:
  - order: 1
    action: 准备固定测试用户、测试 Agent 与真实 LLM；清空该测试命名空间已有记忆，保证用例初始状态可控。
    expected: 功能结果与代码契约一致，测试过程无未处理异常。
  - order: 2
    action: 通过实际 API 配置用户级/Agent级记忆策略、开关和阈值；如存在外部 memory provider，通过 API 启用至少一个外部 provider 并设置 external_provider_top_k（1–100）。
    expected: 关键状态在 API 返回、数据库/存储和后续读取中保持一致。
  - order: 3
    action: 按“记忆检索/embedding/policy 注入 Agent context 与 token budget｜核心流程”执行一到多轮真实对话，输入包含唯一记忆 marker（如 MEM-92831）。
    expected: 失败路径返回明确错误，不出现半写入、重复副作用或跨租户泄露。
  - order: 4
    action: 等待记忆写入/总结任务完成，查询 memory record/version/status 并检查作用域；观察外部 provider 的扇出写入（无启用 provider 跳过、部分失败不阻断本地写入）。
    expected: 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
  - order: 5
    action: 新建会话再次提问，确认 Runtime context 能取回正确 marker，且其他用户/Agent 不可见。
    expected: 真实模型调用成功，stream/Agent run 正常结束；自然语言只做稳定关键词/结构/工具调用断言。
  - order: 6
    action: 校验 build_context 的 external_search_hook 透明代理：未显式传 external_results 时自动查询启用外部 provider，外部结果以 External Memory 段并入注入的
      prompt context；未启用 provider 时跳过且不报错。
    expected: 固定测试 marker 对应文档进入期望 Top-K/Top-N，向量维度和模型绑定正确。
  - order: 7
    action: 构造超过 mmr_candidate_max=200 的候选记忆及多条内容完全相同的记录，触发 Phase4 管线，确认候选池截断到 200、SHA-256 内容精确去重后，MMR 与 token budget 下最终注入记忆的召回符合预期。
    expected: external_search_hook 透明代理生效：启用外部 provider 且未显式传 external_results 时，build_context 自动查询并将外部结果并入 context（External
      Memory 段）；未启用 provider 时跳过，外部扇出部分失败不阻断本地记忆写入。
  - order: 8
    action: Dreaming/长期记忆类检查版本、合并/总结结果和禁用后的行为变化。
    expected: Phase4 管线在 token budget 下正确召回：候选池按 fused_score 截断到 mmr_candidate_max=200，内容完全相同的记录经 SHA-256 精确去重后仅保留一份，最终注入记忆总
      token 不超过 MEMORY_TOKEN_BUDGET，外部与本地记录均按来源权重参与排序。
  - order: 9
    action: 对删除/禁用操作再次运行对话，确认旧记忆不再进入上下文。
    expected: Phase4 管线在 token budget 下正确召回：候选池按 fused_score 截断到 mmr_candidate_max=200，内容完全相同的记录经 SHA-256 精确去重后仅保留一份，最终注入记忆总
      token 不超过 MEMORY_TOKEN_BUDGET，外部与本地记录均按来源权重参与排序。
  - order: 10
    action: 保存脱敏 trace 后清理测试记忆（含外部 provider 写入数据）。
    expected: Phase4 管线在 token budget 下正确召回：候选池按 fused_score 截断到 mmr_candidate_max=200，内容完全相同的记录经 SHA-256 精确去重后仅保留一份，最终注入记忆总
      token 不超过 MEMORY_TOKEN_BUDGET，外部与本地记录均按来源权重参与排序。
  expected_results:
  - 功能结果与代码契约一致，测试过程无未处理异常。
  - 关键状态在 API 返回、数据库/存储和后续读取中保持一致。
  - 失败路径返回明确错误，不出现半写入、重复副作用或跨租户泄露。
  - 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
  - 真实模型调用成功，stream/Agent run 正常结束；自然语言只做稳定关键词/结构/工具调用断言。
  - 固定测试 marker 对应文档进入期望 Top-K/Top-N，向量维度和模型绑定正确。
  - external_search_hook 透明代理生效：启用外部 provider 且未显式传 external_results 时，build_context 自动查询并将外部结果并入 context（External Memory
    段）；未启用 provider 时跳过，外部扇出部分失败不阻断本地记忆写入。
  - Phase4 管线在 token budget 下正确召回：候选池按 fused_score 截断到 mmr_candidate_max=200，内容完全相同的记录经 SHA-256 精确去重后仅保留一份，最终注入记忆总 token 不超过
    MEMORY_TOKEN_BUDGET，外部与本地记录均按来源权重参与排序。
