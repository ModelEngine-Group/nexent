  title: Jiuwen output contract and display D3
  type: AGENT-IT
  priority: P0
  status: active
  automation: automated
  objective: Preserve ordered runtime facts and explicit terminal semantics through
    streaming, persistence and display.
  preconditions:
  - Installed Jiuwen and existing local controlled model/resource services; isolated
    PostgreSQL for persistence; frontend fixture server for D4.
  test_data:
    profile: mock
  steps:
  - order: 1
    action: Run real Jiuwen through controlled HTTP native/text model endpoints and
      authorized tool/MCP/Skill or child/A2A integrations.
    expected: Observations retain ordered content/reasoning blocks, exact tool results,
      full provider IDs, unique local IDs and invocation grouping; usage absent is
      unknown.
  - order: 2
    action: Pass output through the backend stream persistence path and reload the
      saved conversation.
    expected: Exactly one explicit RunResult determines status and final content;
      JSON envelopes and original results survive storage, with final blocks unambiguously
      linked.
  expected_results:
  - Observations retain ordered content/reasoning blocks, exact tool results, full
    provider IDs, unique local IDs and invocation grouping; usage absent is unknown.
    Public step capacity and processing mode agree with the actual Nexent ContextManager
    configuration and survive persistence.
  - Exactly one explicit RunResult determines status and final content; JSON envelopes
    and original results survive storage, with final blocks unambiguously linked.
  forbidden_side_effects:
  - No inferred success from EOF or text; no duplicate final, lost partial, cross-invocation
    tool pairing, invented reasoning or native HTTP bypass.
  acceptance:
  - id: AC-01
    description: Public output and terminal/display contract preserves execution facts.
    steps:
    - 1
    - 2
    expected_results:
    - 1
    - 2
    forbidden_side_effects:
    - 1
  execution:
    profiles:
    - name: mock
      required_services:
      - http-fixture
      - model-provider
    timeout_seconds: 240
  integration_boundary:
  - Real Jiuwen/ModelService/resource protocols to backend stream and PostgreSQL persistence.
  observations:
  - Public events, result status, tool and invocation identities, saved envelopes
    and cleanup.
  cleanup:
  - Release native session/tools and managed threads; close loopback listener and
    HTTP response.
