  unit_boundary: AIDP权限矩阵
  inputs:
  - '- 无本地资产；通过显式传参 user_role / user_groups 及 monkeypatch _get_permission_record 隔离 group_db/user_tenant_db/aidp_permission_db
    查询。'
  assertions:
  - 创建者分支返回 AidpPermissionDecision 且 permission="EDIT"、is_management_role=False、matched_group_ids=()。
  - PRIVATE 非创建者（含管理角色）返回 permission=None。
  - role="USER" 非创建者返回 permission=None。
  - 管理角色（SU/ADMIN/SPEED/ASSET_OWNER）共享 KB 返回 permission="EDIT"、is_management_role=True、matched_group_ids=()。
  - DEV 且 record_groups∩user_groups 非空返回 permission=ingroup_permission（缺省 "READ_ONLY"）、matched_group_ids 为交集升序；无交集或 record_groups
    为空返回 permission=None。
  - record 为空抛 AidpKbNotFoundError（映射 404）；权限不足时 require_permission 抛 AidpKbPermissionDeniedError（映射 403），不吞异常返回伪成功。
  - 全流程无未处理异常，日志不含明文凭据。
