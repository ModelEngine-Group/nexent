schema_version: '1.0'
stage: D4
module: CHAT-SIDEBAR
case:
  case_id: WB-PIN-DELETE-D4-001
  feature_id: CHAT-SIDEBAR
  requirement_ids: [WB-PIN-BATCH-DELETE-20261019]
  business_rule_ids: [CHAT-SIDEBAR-RULE-001, CHAT-SIDEBAR-RULE-003]
  title: Batch-deleted pinned Workbench history disappears immediately
  type: E2E
  priority: P1
  status: active
  automation: automated
  objective: Prove pin cache hydration cannot restore a confirmed batch deletion.
  preconditions:
  - Authorized mock Workbench user with two persisted histories and no generation.
  test_data:
    profile: mock
  steps:
  - order: 1
    action: Pin the older history through its menu.
    expected: The older history displays a pin marker.
  - order: 2
    action: Enter Manage, select the pinned history and confirm deletion.
    expected: The selected history disappears from every sidebar group without reload; the other history stays visible.
  - order: 3
    action: Reload the page.
    expected: The deleted history remains absent and the unrelated history remains visible.
  expected_results:
  - Confirmed deletion removes the selected pin immediately and persistently.
  forbidden_side_effects:
  - No generation request or deletion of an unselected history.
  actor: Authorized mock Workbench user
  journey: [Pin history, Manage selection, Confirm deletion, Verify immediate absence, Reload]
  final_business_result:
  - Deleted histories never reappear in ordinary recency groups.
  failure_evidence:
  - Browser assertion screenshot and trace.
  execution:
    profiles:
    - name: mock
      required_services: []
  acceptance:
  - id: AC-01
    description: Pinned batch deletion removes only the selected history without refresh.
    steps: [1, 2, 3]
    expected_results: [1]
    forbidden_side_effects: [1]
