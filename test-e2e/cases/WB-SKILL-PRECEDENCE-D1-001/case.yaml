schema_version: '1.0'
stage: D1
module: CHAT-WORKBENCH
case:
  case_id: WB-SKILL-PRECEDENCE-D1-001
  feature_id: WB-CONTROLS
  requirement_ids: [WB-SKILL-PRECEDENCE-20261113]
  business_rule_ids: [WB-CONTROLS-RULE-008]
  title: Explicit same-name Skill controls runtime files, configuration and dependencies
  type: BE-UT
  priority: P1
  status: active
  automation: automated
  objective: Prove one effective Skill identity survives the real resolver, file snapshot, dependency component and SDK Skill reader.
  preconditions:
  - Controlled platform and tenant metadata use different IDs for the same runtime Skill name and different tool definitions.
  - Case-owned temporary source directories contain distinct guides, references and configuration; no external providers or database writes.
  test_data:
    profile: mock
  steps:
  - order: 1
    action: Resolve the explicit mount with its same-name published default, materialize the frozen files, resolve tool records and read the Skill through the SDK tool.
    expected: Exactly the explicit identity, configuration, guide, reference and tool are effective, with no default-only file or mixed dependency.
  - order: 2
    action: Remove the explicit mount and execute the same component chain in a new workspace.
    expected: The default guide, configuration and dependency are restored without altering either source definition or the first run snapshot.
  expected_results:
  - Runtime Skill content, configuration and tool identity come from the same selected resource.
  - Removing the mount restores defaults and run snapshots remain isolated.
  forbidden_side_effects:
  - No persistent definitions are modified, unauthorized source files are disclosed, external service is invoked or owned source directory survives capture.
  unit_boundary: Real Workbench Skill resolver, storage capture, frozen materializer, runtime tool resolver and SDK ReadSkillMdTool; only database metadata and source-storage lookup are controlled.
  inputs:
  - Different platform and tenant Skill/tool IDs sharing the runtime name; distinct guide, reference and configuration values.
  assertions:
  - SDK guide and reference reads, effective tool ID and parameters all identify the explicit resource.
  - The default becomes effective after removing the mount and the preceding snapshot stays unchanged.
  execution:
    profiles:
    - name: mock
      required_services: []
  acceptance:
  - id: AC-01
    description: The explicit winner supplies coherent runtime resources without source mutation or leakage.
    steps: [1]
    expected_results: [1]
    forbidden_side_effects: [1]
  - id: AC-02
    description: Removing the override restores the default and preserves the preceding run snapshot.
    steps: [2]
    expected_results: [2]
    forbidden_side_effects: [1]
