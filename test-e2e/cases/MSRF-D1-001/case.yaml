schema_version: '1.0'
stage: D1
module: MODEL-MANAGEMENT
case:
  case_id: MSRF-D1-001
  feature_id: MSRF-001
  requirement_ids:
  - MSRF-001
  business_rule_ids:
  - MSRF-RULE-001
  title: Model implementation has one bounded canonical location
  type: BE-UT
  priority: P1
  status: active
  automation: automated
  objective: Verify canonical locations and an acyclic internal import graph.
  preconditions:
  - Use repository Python sources without external services.
  test_data:
    profile: mock
    max_physical_lines: 1500
  steps:
  - order: 1
    action: Inspect model sources and all backend SDK and test imports.
    expected: Canonical files exist and obsolete imports and duplicate implementations
      are absent.
  - order: 2
    action: Traverse model internal imports including function-local imports.
    expected: No cycle connects provider health and probe.
  expected_results:
  - Every model code file is at most 1500 lines.
  - All internal dependencies are acyclic.
  forbidden_side_effects:
  - No database or provider connection occurs during source inspection.
  unit_boundary: Model source ownership and dependency graph
  inputs:
  - Repository Python source files
  assertions:
  - Required canonical modules exist.
  - Obsolete modules are absent.
  - Import graph has no cycle.
  - Names depends only on standard library.
  acceptance:
  - id: AC-01
    description: Verify every declared relocation contract assertion.
    expected_results:
    - 1
    - 2
    steps:
    - 1
    - 2
    forbidden_side_effects:
    - 1
