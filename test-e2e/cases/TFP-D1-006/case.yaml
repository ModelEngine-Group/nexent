schema_version: '1.0'
stage: D1
module: RUNTIME-SANDBOX
case:
  case_id: TFP-D1-006
  feature_id: TFP-001
  requirement_ids:
  - TFP-001
  business_rule_ids:
  - TFP-RULE-001
  - TFP-RULE-004
  - TFP-RULE-005
  title: Factory defers initialization and prepares promoted workspaces
  type: SDK-UT
  priority: P0
  status: active
  automation: automated
  objective: Factory defers initialization and prepares promoted workspaces
  preconditions:
  - Use isolated official tool instances and a controlled executor factory.
  test_data:
    profile: mock
  steps:
  - order: 1
    action: Construct a root and child with Docker fast paths and omit the SDK enablement argument.
    expected: Both remain uninitialized.
  - order: 2
    action: Activate root and child ordinary executors.
    expected: The session group is shared and each workspace is initialized when its executor appears.
  - order: 3
    action: Omit the deployment enablement flag and SDK run-info field, then repeat with an explicit false flag. Exercise
      MCP and non-MCP run construction.
    expected: Omitted flags enable deferred execution; explicit false retains eager initialization in both paths. Default
      allowlists include AidpSearchTool, and explicit allowlists retain their configured contents.
  expected_results: &id001
  - Disabled mode keeps eager initialization.
  - Omitted deployment and SDK flags enable the deferred Docker path, including missing-field fallbacks in MCP and non-MCP
    run construction.
  - Enabled mode delays warm-up and script binding until activation.
  - Workspace synchronization precedes ordinary code.
  - Actual executors release exactly once.
  - Deployment and SDK default allowlists include AidpSearchTool; explicit allowlists and explicit false opt-out remain respected.
  forbidden_side_effects:
  - No kernel for unused child.
  - No duplicated session container.
  unit_boundary: Restricted AST admission, real LocalPythonExecutor and NexentAgent executor lifecycle
  inputs:
  - Factory defers initialization and prepares promoted workspaces
  assertions: *id001
