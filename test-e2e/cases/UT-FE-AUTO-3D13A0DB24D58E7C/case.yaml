    递增并刷新预览。
  - 定义管理弹窗打开时收到的 bucketId/bucketName/canManage 与契约一致；增删改定义后关闭触发 refreshTagDefinitions 重新拉取。
  - 只读态或无 Agent 时，编辑按钮禁用、canEdit=false、canManage=false，权限校验不绕过，不产生任何标签写请求。
