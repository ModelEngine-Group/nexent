  unit_boundary: 标签筛选与搜索
  inputs:
  - '- ${NEXENT_TEST_HOME}/config/environment.yaml（仅本地测试环境参数）

    - 组件 fixture：带结构化标签/无标签的本地 MCP 服务与社区 MCP 服务数据、default_resource 标签库定义、mock tagManagementApi.filterResourceIds'
  assertions:
  - 初始渲染标签筛选未激活、搜索为空，Mine/Repository 列表全量展示，无未处理异常。
  - 选择标签谓词后 filterResourceIds 以 ("mcp_service", 本地 mcpId 列表, 标签谓词) 被调用一次。
  - 仅 matched_resource_ids 中 kind=local 的本地服务可见；kind=community 与非匹配本地服务被排除。
  - 清空标签后 matchedTagIds 为 null，列表恢复显示全部 Mine 条目。
  - 搜索关键词后 matchedSearchTagIds 为各谓词 matched_resource_ids 的并集；名称/标签关键字或结构化标签任一命中即保留。
  - 无匹配时 filteredItems 为空，显示空态卡片。
  - 过滤过程中无状态串扰：过期异步结果被 cancelled 标志丢弃，不覆盖最新筛选状态。
  - Repository 标签选择与清空恢复按 browser.updateFilter 生效。
