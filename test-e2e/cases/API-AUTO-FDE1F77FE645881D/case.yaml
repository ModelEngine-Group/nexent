  observations:
  - 功能结果与代码契约一致，测试过程无未处理异常。
  - legacy 单文件与批量 SUBMITTED 两条路径提交后，knowledge_file_lifecycle_t 中对应文件的 parent_task_id 均与 data-process 返回的 task_id 一致。
  - mismatched 行被跳过并输出告警日志，未造成父链 ID 误写或覆盖其他文件记录。
  - 关键状态在 API 返回、数据库/存储和后续读取中保持一致；不出现半写入、重复副作用或跨租户泄露。
  - 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
  cleanup:
