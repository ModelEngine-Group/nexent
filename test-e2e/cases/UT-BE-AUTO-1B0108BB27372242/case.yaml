case:
  case_id: UT-BE-AUTO-1B0108BB27372242
  feature_id: F-069
  business_rule_ids:
  - F-069-RULE-01
  title: 发布卡片字段校验与标签归一化（icon 必填非空≤32、tags 1..5 个各≤20去重去空、非法输入报错）｜核心流程
  type: BE-UT
  priority: P1
  status: active
  automation: automated
  objective: 发布卡片字段校验与标签归一化（icon 必填非空≤32、tags 1..5 个各≤20去重去空、非法输入报错）｜核心流程
  preconditions:
  - 本地依赖/组件测试环境可运行；不要求外部模型服务在线。
  - 设置 NEXENT_TEST_HOME，目录不位于 Nexent Git 仓库内。
  - 当次 run_id 已生成，所有新建资源名称带 run_id；测试基线固定为 develop 当前批次锁定的产品提交；执行时另记录实际被测commit。
  - 无额外本地资产要求：被测函数 _validate_card_fields/_normalize_listing_tags 为纯校验逻辑，不依赖数据库、模型或外部服务。
  test_data:
    legacy_asset_declaration: '- 无（纯逻辑校验，不依赖本地固定资产/配置）'
  steps:
  - order: 1
    action: 直接导入 backend/services/agent_repository_service.py 中的 _normalize_listing_tags 与 _validate_card_fields，构造最小有效输入与必要依赖对象。
    expected: _normalize_listing_tags 对合法列表返回去空格、去重、去空后的标签，顺序保持首次出现。
  - order: 2
    action: 对 _normalize_listing_tags 传入合法列表 [" ai ", "coding", "ai", ""]，断言返回去空格、去重、去空后的标签列表 ["ai", "coding"]，顺序保持首次出现。
    expected: 标签数量 1..5 通过，>5 抛 ValueError；单个标签 ≤20 字符通过，>20 抛 ValueError。
  - order: 3
    action: 对标签数量边界：1 个标签（最小）与 5 个标签（最大）均通过并返回等长列表；6 个标签触发 ValueError（"tags must contain at most 5 items"）。
    expected: 非法输入：tags 非 list 或含非字符串元素抛 ValueError；全空标签抛 ValueError。
  - order: 4
    action: 对单标签长度边界：20 字符标签通过，21 字符标签触发 ValueError（"Each tag must be at most 20 characters"）。
    expected: _validate_card_fields：icon 必填非空字符串且 ≤32 字符，缺失/空/超长抛 ValueError；tags 缺失抛 ValueError。
  - order: 5
    action: 对非法 tags 输入：传入非 list（如字符串、None）或含非字符串元素的 list 触发 ValueError（"tags must be a list of strings"）；全空/全空白标签触发 ValueError（"tags
      must contain at least one non-empty tag"）。
    expected: 合法 icon+tags 通过校验，且 repository_data["tags"] 被归一化写回。
  - order: 6
    action: '对 _validate_card_fields 传入合法数据 {"icon": "🤖", "tags": ["a", "b"]}，断言不抛异常且 repository_data["tags"] 被归一化写回。'
    expected: 失败路径返回明确 ValueError，不出现吞异常后返回伪成功，无半写入副作用。
  - order: 7
    action: 对 icon 边界与异常：icon 缺失/None/空串/纯空白触发 ValueError（"icon is required and must be a non-empty string"）；32 字符通过，33 字符触发
      ValueError（"icon must be at most 32 characters"）。
    expected: 日志、报告不出现明文 API Key/Token/Password/模型密钥。
  - order: 8
    action: 对 tags 缺失：repository_data 不含 tags 键触发 ValueError（"tags is required for marketplace listing submission"）。
    expected: 日志、报告不出现明文 API Key/Token/Password/模型密钥。
  - order: 9
    action: 确认日志中不输出 API Key、Token、用户密码或模型密钥；测试结束后释放临时对象，确保可重复执行。
    expected: 日志、报告不出现明文 API Key/Token/Password/模型密钥。
  expected_results:
  - _normalize_listing_tags 对合法列表返回去空格、去重、去空后的标签，顺序保持首次出现。
  - 标签数量 1..5 通过，>5 抛 ValueError；单个标签 ≤20 字符通过，>20 抛 ValueError。
  - 非法输入：tags 非 list 或含非字符串元素抛 ValueError；全空标签抛 ValueError。
  - _validate_card_fields：icon 必填非空字符串且 ≤32 字符，缺失/空/超长抛 ValueError；tags 缺失抛 ValueError。
  - 合法 icon+tags 通过校验，且 repository_data["tags"] 被归一化写回。
  - 失败路径返回明确 ValueError，不出现吞异常后返回伪成功，无半写入副作用。
  - 日志、报告不出现明文 API Key/Token/Password/模型密钥。
  forbidden_side_effects: []
  source:
    legacy_workbook_sha256: aa4b32414d30f12b3b64e14236268145e556bd7cfc5d3eb8df80731608ebc022
