schema_version: '1.0'
stage: D1
module: V5-BASELINE
case:
  case_id: AIDP-FE-FILES-01
  feature_id: F-111
  business_rule_ids:
  - F-111-RULE-01
  title: AIDP 文件列表计数、搜索、刷新与删除
  type: FE-COMP
  priority: P0
  status: active
  automation: automated
  objective: AIDP 文件列表计数、搜索、刷新与删除
  preconditions:
  - 组件测试环境及产品前端依赖可用；不需要 AIDP 服务、数据库或真实模型。
  - 使用独立 QueryClient、浏览器存储和受控 HTTP/XHR；模拟时钟代替真实上传与轮询等待。
  test_data:
    source_role:
    - direct_input
    trace: 用户确认的 AIDP 创建、列表、导入及文件列表验收；2026-10-12 D1 补充审核
    data: 模型混合目录、两种语言及领域模板、不同权限知识库、有限文件数据和错误响应
  steps:
  - order: 1
    action: 目录树接口返回当前目录 1 个文件而总数 21；搜索命中或不命中，再清空关键词并换页。
    expected: 顶部与分页使用知识库总数 21；搜索结果不覆盖知识库总数；无匹配显示空态；分页参数正确。
  - order: 2
    action: 返回有业务码的目录树查询失败或无业务码的接口错误。
    expected: 显示对应翻译或接口具体原因，失败不能伪装成暂无文件，不增加重试按钮。
  - order: 3
    action: 正常推进时钟；打开导入后推进时钟；选择文件并点击导入，抽屉立即关闭并在上传中心完成上传。
    expected: 30 秒轮询更新目录文件列表；抽屉打开时暂停；点击导入即关闭且不等待上传完成；上传中心完成后立即刷新，新增文件可见。
  - order: 4
    action: 取消删除，随后用红色删除按钮确认；删除失败后分别取消或重试至成功。
    expected: 取消不请求；成功请求只传选中文件 UUID 并刷新列表及数量；失败展示具体原因，文件和确认框保留，且无未处理 Promise 拒绝；失败后仍可重试或取消。
  - order: 5
    action: 勾选两个文件，点击工具栏“移动”，选择目标目录；接口返回一成功一失败。
    expected: 请求携带两个文件 UUID 和目标目录；成功项刷新后消失，失败项保持勾选；页面顶部显示失败数量、目标目录和逐文件原因，不额外弹失败弹窗。
  expected_results:
  - 顶部与分页使用知识库总数 21；搜索结果不覆盖知识库总数；无匹配显示空态；分页参数正确。
  - 显示对应翻译或接口具体原因，失败不能伪装成暂无文件，不增加重试按钮。
  - 30 秒轮询更新目录文件列表；抽屉打开时暂停；点击导入即关闭且不等待上传完成；上传中心完成后立即刷新，新增文件可见。
  - 取消不请求；成功请求只传选中文件 UUID 并刷新列表及数量；失败展示具体原因，文件和确认框保留，且无未处理 Promise 拒绝；失败后仍可重试或取消。
  - 请求携带两个文件 UUID 和目标目录；成功项刷新后消失，失败项保持勾选；页面顶部显示失败数量、目标目录和逐文件原因，不额外弹失败弹窗。
  forbidden_side_effects:
  - 不得请求实际 AIDP、数据库、模型或修改用户的部署数据。
  - 不得产生未处理 Promise 拒绝，或删除失败却关闭确认框、移除文件、刷新数量或提示成功。
  unit_boundary: 真实页面/表单、查询 hooks、React Query 缓存和前端服务层协作；仅替换外部身份、路由与 HTTP/XHR 边界。
  inputs:
  - case-local 受控响应与内存文件
  assertions:
  - 顶部与分页使用知识库总数 21；搜索结果不覆盖知识库总数；无匹配显示空态；分页参数正确。
  - 显示对应翻译或接口具体原因，失败不能伪装成暂无文件，不增加重试按钮。
  - 30 秒轮询更新目录文件列表；抽屉打开时暂停；点击导入即关闭且不等待上传完成；上传中心完成后立即刷新，新增文件可见。
  - 取消不请求；成功请求只传选中文件 UUID 并刷新列表及数量；失败展示具体原因，文件和确认框保留，且无未处理 Promise 拒绝；失败后仍可重试或取消。
  - 请求携带两个文件 UUID 和目标目录；成功项刷新后消失，失败项保持勾选；页面顶部显示失败数量、目标目录和逐文件原因，不额外弹失败弹窗。
  acceptance:
  - id: AC-01
    description: 文件总数与搜索
    steps:
    - 1
    expected_results:
    - 1
    forbidden_side_effects:
    - 1
  - id: AC-02
    description: 查询错误
    steps:
    - 2
    expected_results:
    - 2
    forbidden_side_effects:
    - 1
  - id: AC-03
    description: 定时刷新与导入入队
    steps:
    - 3
    expected_results:
    - 3
    forbidden_side_effects:
    - 1
  - id: AC-04
    description: 文件删除
    steps:
    - 4
    expected_results:
    - 4
    forbidden_side_effects:
    - 1
    - 2
  - id: AC-05
    description: 批量移动与部分失败
    steps:
    - 5
    expected_results:
    - 5
    forbidden_side_effects:
    - 1
    - 2
