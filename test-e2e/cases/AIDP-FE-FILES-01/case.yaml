schema_version: '1.0'
stage: D1
module: V5-BASELINE
case:
  case_id: AIDP-FE-FILES-01
  feature_id: F-111
  business_rule_ids:
  - F-111-RULE-01
  title: AIDP 文件列表计数、搜索、刷新与删除
  type: FE-COMP
  priority: P0
  status: active
  automation: automated
  objective: AIDP 文件列表计数、搜索、刷新与删除
  preconditions:
  - 组件测试环境及产品前端依赖可用；不需要 AIDP 服务、数据库或真实模型。
  - 使用独立 QueryClient、浏览器存储和受控 HTTP/XHR；模拟时钟代替真实上传与轮询等待。
  test_data:
    source_role:
    - direct_input
    trace: 用户确认的 AIDP 创建、列表、导入及文件列表验收；2026-10-12 D1 补充审核
    data: 模型混合目录、两种语言及领域模板、不同权限知识库、有限文件数据和错误响应
  steps:
  - order: 1
    action: 返回当前页 1 个文件而总数 21；搜索命中或不命中，再清空关键词并换页。
    expected: 顶部与分页使用全局 21；搜索结果不覆盖知识库总数；无匹配显示空态；分页参数正确；导入方式显示本地导入。
  - order: 2
    action: 返回有业务码的查询失败或无业务码的接口错误。
    expected: 显示对应翻译或接口具体原因，失败不能伪装成暂无文件，不增加重试按钮。
  - order: 3
    action: 正常推进时钟；打开导入后推进时钟；完成上传，再关闭抽屉。
    expected: 30 秒刷新更新文件和顶部总数；抽屉打开时暂停；上传完成不刷新，关闭后立即刷新，新增文件可见。
  - order: 4
    action: 取消删除，随后确认删除；删除失败后分别取消或重试至成功，使用真实确认框按钮。
    expected: 取消不请求；成功请求只传选中文件 UUID 并刷新列表及数量；失败展示具体原因，文件和确认框保留，且无未处理 Promise 拒绝；失败后仍可重试或取消。
  expected_results:
  - 顶部与分页使用全局 21；搜索结果不覆盖知识库总数；无匹配显示空态；分页参数正确；导入方式显示本地导入。
  - 显示对应翻译或接口具体原因，失败不能伪装成暂无文件，不增加重试按钮。
  - 30 秒刷新更新文件和顶部总数；抽屉打开时暂停；上传完成不刷新，关闭后立即刷新，新增文件可见。
  - 取消不请求；成功请求只传选中文件 UUID 并刷新列表及数量；失败展示具体原因，文件和确认框保留，且无未处理 Promise 拒绝；失败后仍可重试或取消。
  forbidden_side_effects:
  - 不得请求实际 AIDP、数据库、模型或修改用户的部署数据。
  - 不得产生未处理 Promise 拒绝，或删除失败却关闭确认框、移除文件、刷新数量或提示成功。
  unit_boundary: 真实页面/表单、查询 hooks、React Query 缓存和前端服务层协作；仅替换外部身份、路由与 HTTP/XHR 边界。
  inputs:
  - case-local 受控响应与内存文件
  assertions:
  - 顶部与分页使用全局 21；搜索结果不覆盖知识库总数；无匹配显示空态；分页参数正确；导入方式显示本地导入。
  - 显示对应翻译或接口具体原因，失败不能伪装成暂无文件，不增加重试按钮。
  - 30 秒刷新更新文件和顶部总数；抽屉打开时暂停；上传完成不刷新，关闭后立即刷新，新增文件可见。
  - 取消不请求；成功请求只传选中文件 UUID 并刷新列表及数量；失败展示具体原因，文件和确认框保留，且无未处理 Promise 拒绝；失败后仍可重试或取消。
  acceptance:
  - id: AC-01
    description: 文件总数与搜索
    steps:
    - 1
    expected_results:
    - 1
    forbidden_side_effects:
    - 1
  - id: AC-02
    description: 查询错误
    steps:
    - 2
    expected_results:
    - 2
    forbidden_side_effects:
    - 1
  - id: AC-03
    description: 定时刷新与关闭导入
    steps:
    - 3
    expected_results:
    - 3
    forbidden_side_effects:
    - 1
  - id: AC-04
    description: 文件删除
    steps:
    - 4
    expected_results:
    - 4
    forbidden_side_effects:
    - 1
    - 2
