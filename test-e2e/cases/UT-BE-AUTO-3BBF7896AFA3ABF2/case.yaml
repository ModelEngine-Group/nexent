    legacy_row: 395
  unit_boundary: 仓库下载统计
  inputs:
  - '- 本地组件测试依赖与固定 repository 行 fixture；DB 层经 monkeypatch 固定，无外部资产。'
  assertions:
  - 列表/Mine/详情三处 downloads 均等于同 agent_id 跨全部 repository 行的 downloads 求和值（此处为 8），而非任一单行值 3 或 5。
  - agent_id 无 repository 行时 downloads 为 0，不返回 None。
  - 单行场景 downloads 等于该行自身值，且不跨 agent_id 混算。
  - 测试过程无未处理异常，日志、Trace 中不出现明文密钥。
