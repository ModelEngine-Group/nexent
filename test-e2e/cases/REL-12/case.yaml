  title: 分类日志持久化、混合轮转、容器重启与磁盘边界
  type: RELIABILITY
  priority: P1
  status: active
  automation: automated
  objective: 轮转/重启不丢关键错误，不无限占盘，不泄露密钥。
  preconditions:
  - '- ${NEXENT_TEST_HOME}/config/environment.yaml'
  test_data:
    legacy_asset_declaration: '- ${NEXENT_TEST_HOME}/config/environment.yaml'
  steps:
  - order: 1
    action: 在测试日志目录产生各分类日志。
    expected: 分类、轮转、保留和挂载符合配置。
  - order: 2
    action: 触发 size/time 轮转并超过 backupCount。
    expected: 重启后关键日志可追溯。
  - order: 3
    action: 重启容器验证挂载持久化。
    expected: 磁盘异常不导致静默崩溃。
  - order: 4
    action: 模拟目录只读/空间不足，检查服务降级和告警。
    expected: 无明文 secret。
  - order: 5
    action: 扫描全部轮转文件的 secret marker。
    expected: 无明文 secret。
