schema_version: '1.0'
stage: D1
module: RUNTIME-SANDBOX
case:
  case_id: SAI-D1-003
  feature_id: SAI-001
  business_rule_ids:
  - SAI-001-R2
  title: Invocation metadata snapshots remain isolated across nested definitions
  type: SDK-UT
  priority: P1
  status: active
  automation: automated
  objective: Parent, sibling invocation and nested lazy definition retain independent
    metadata snapshots.
  preconditions:
  - A parent supplies nested metadata to its lazy definitions.
  test_data:
    metadata:
      region: east
    calls: 2
  steps:
  - order: 1
    action: Build two invocation agents and mutate metadata in one.
    expected: The other call and parent retain original metadata.
  - order: 2
    action: Mutate metadata on one nested child definition.
    expected: The other invocation nested definition retains the original metadata.
  expected_results:
  - Nested lazy definitions inherit independent metadata snapshots.
  forbidden_side_effects:
  - No mutable metadata sharing between parent, sibling calls or nested definitions
  unit_boundary: Real factory, wrapper and metadata propagation across invocation-owned
    trees; controlled CoreAgent/model
  inputs:
  - Nested metadata snapshot
  - Two calls to one definition
  assertions:
  - Parent and sibling retain original metadata after one invocation mutates its snapshot
  - Nested definitions are distinct and do not share mutable metadata
  execution:
    profiles:
    - name: mock
      required_services: []
  acceptance:
  - id: AC-01
    description: Parent, sibling invocation and nested lazy definition retain independent
      metadata snapshots.
    steps:
    - 1
    - 2
    expected_results:
    - 1
    forbidden_side_effects:
    - 1
