{
  "schema_version": "1.0",
  "stage": "D2",
  "module": "AIDP-KNOWLEDGE",
  "case": {
    "case_id": "AIDP-FILE-SCOPE-D2-001",
    "feature_id": "AIDP-FILE-SCOPE",
    "requirement_ids": [
      "AIDP-FILE-SCOPE-REQ-002",
      "AIDP-FILE-SCOPE-REQ-003"
    ],
    "business_rule_ids": [
      "AIDP-FILE-SCOPE-RULE-02",
      "AIDP-FILE-SCOPE-RULE-03",
      "AIDP-FILE-SCOPE-RULE-04"
    ],
    "title": "Knowledge-scope API persists v3 metadata filters and isolates conversations",
    "type": "CONTRACT",
    "priority": "P1",
    "status": "blocked",
    "automation": "manual",
    "objective": "Prove through the conversation knowledge-scope API that a v3 metadata filter is stored, echoed, isolated per conversation and cleared when the AIDP source is disabled or the filter is turned off.",
    "preconditions": [
      "A running management/runtime stack with a test user and at least one AIDP-enabled Agent."
    ],
    "test_data": {
      "profile": "mock",
      "conversation_a": "file name contains 合同",
      "conversation_b": "no filter"
    },
    "steps": [
      {
        "order": 1,
        "action": "Save a v3 filter on conversation A and read it back.",
        "expected": "The response echoes the same operator and value with schema_version 3."
      },
      {
        "order": 2,
        "action": "Read conversation B.",
        "expected": "Conversation B has no filter and is not affected."
      },
      {
        "order": 3,
        "action": "Disable the filter or switch to the local source and save.",
        "expected": "The stored scope carries no metadata_filter."
      }
    ],
    "expected_results": [
      "v3 filters persist and restore",
      "Conversations remain isolated",
      "Turning the filter off clears it"
    ],
    "forbidden_side_effects": [
      "Do not leak filters across conversations",
      "Do not persist a condition with enabled=false"
    ],
    "unit_boundary": "conversation knowledge-scope API",
    "inputs": [
      "save/read filter",
      "second conversation",
      "disable filter"
    ],
    "assertions": [
      "round-trip",
      "isolation",
      "cleared"
    ],
    "acceptance": [
      {
        "id": "AC-01",
        "description": "Persistence",
        "steps": [
          1
        ],
        "expected_results": [
          1
        ],
        "forbidden_side_effects": [
          1,
          2
        ]
      },
      {
        "id": "AC-02",
        "description": "Isolation and clearing",
        "steps": [
          2,
          3
        ],
        "expected_results": [
          2,
          3
        ],
        "forbidden_side_effects": [
          1,
          2
        ]
      }
    ],
    "contract": {
      "protocol": "HTTPS/JSON through the Nexent conversation API",
      "method": "PUT",
      "endpoint": "/conversation/{conversation_id}/knowledge-scope",
      "request_expectations": [
        "Body is {scope: {...}} where scope.schema_version is 3 and scope.aidp.metadata_filter is {enabled: true, file_name: {operator: contains|is|starts_with|ends_with, value: string}}.",
        "Enabled requires a non-empty trimmed value of at most 256 characters and a non-disabled AIDP mode; disabled filters carry no file_name condition.",
        "schema_version 1 or 2 records remain accepted; the retired file_scope is ignored."
      ],
      "response_expectations": [
        "Success response contains desired_scope and effective_preview; aidp.kds_ids equal the distinct selected-file KBs and the effective preview does not add KBs.",
        "Unknown conversation returns 404; unavailable KB references keep the existing item-unavailable behavior.",
        "Stored scope is readable through conversation detail and is isolated per conversation."
      ]
    }
  }
}
