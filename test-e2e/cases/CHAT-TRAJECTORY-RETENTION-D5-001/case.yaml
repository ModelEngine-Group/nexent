schema_version: '1.0'
stage: D5
module: CHAT-MESSAGE
case:
  case_id: CHAT-TRAJECTORY-RETENTION-D5-001
  feature_id: CHAT-TRAJECTORY
  requirement_ids:
  - CHAT-LOCAL-TRAJECTORY-20261103
  - CHAT-TRAJECTORY-CONVERSATION-DELETE-20261112
  - CHAT-TRAJECTORY-SUMMARY-20261113
  business_rule_ids:
  - TRJ-RULE-006
  - TRJ-RULE-008
  title: 可配置定期和主动清理只回收符合时间的轨迹，失败可重试
  type: RELIABILITY
  priority: P0
  status: blocked
  automation: automated
  objective: 可配置定期和主动清理只回收符合时间的轨迹，失败可重试
  preconditions:
  - 后端存储及清理接口已实现；test.py包含文件故障、配置加载及批次预算部分，完整HTTP/PG及受管定时线程脚本和case-local execution.yaml尚未齐备，本Case保持blocked。
  - 使用隔离测试会话、租户和独占轨迹根目录；记录被测提交、配置快照和本用例资源清单。
  - 读取使用可信ADMIN/SU身份，目标会话由独立普通用户创建；actor与owner区分，非管理员读取应拒绝。
  - 业务trace_id直接复用现有conversation_id；菜单按用户→最近根智能体→会话，打开后读取整个会话范围；PG复用现有授权关系并保存执行摘要/统计快照，轨迹正文及执行清单由文件保存。
  - 基于现有MonitoringManager，通过MONITORING_PROVIDER选择互斥的local_file/otlp及远端提供方；本地业务正文为正文内嵌的标准OTLP JSONL，会话meta.json保存归属、执行清单和确认进度。
  - 目录使用tenant/user/agent/conversation业务ID，agent_id固定为首次采集根Agent；首次目录登记使用PG会话行锁，后续读写使用会话目录内.lock。会话切换根Agent仍读写同一物理目录。
  - 所有正文内嵌OTLP Span属性/Events；256KiB为批量刷盘阈值，单行可更大。读写须处理大型字符串的增量编码/解码，正文API按解码后的UTF-8区间返回。
  - 清理服务具备可控UTC时钟与独占文件夹具；定期默认30天/3600秒，可关闭；主动POST /trajectory/cleanup固定可信租户和首次截止时间；文件部分使用本Case独占目录，完整运行验收按用户要求暂缓。
  test_data:
    profile: mock
  steps:
  - order: 1
    action: 使用可控时钟准备同租户过期/未过期运行、另租户 canary、长期会话中的今日运行和一个活跃运行。
    expected: expires_at 基于各运行终态+30天；活跃运行不被会话创建时间误判，所有归属可核验。
  - order: 2
    action: 推进到到期边界，在清理任务执行前请求正文并启动跨边界下载，再执行分批清理及失败重试。
    expected: 到期立即拒绝新读取/新块发送；meta先撤引用，再整份删除该执行OTLP，派生缓存/内容引用一起失效。终态发布重试仍遵守到期/删除，清理周期不延长可读期。 该执行的全部正文随唯一OTLP文件一起删除，其他执行及原聊天生命周期保持。
  - order: 3
    action: 分别通过单个/批量删除入口删除独占会话，覆盖关闭定期清理、部分删除成功、PG失败、文件占用/释放、队列满及进程重启补偿；再越过7天墓碑期，核对聊天附件及其他租户/用户/会话canary。
    expected: 单个及批量删除只对PG确认删除且归属匹配的会话立即提交清理，受管线程删除全部轮次OTLP；关闭定期过期清理仍生效，失败/占用保留待删标记并重试，队列满或重启由巡检补偿；数据库失败和范围外文件保持。会话删除立即撤权；过期墓碑有界回收，会话meta.json无正文过期统计支持已过期提示；其余内容和文件校验保持，全部独占资源清理。
  - order: 4
    action: 保留未删除会话，令旧执行正文过期并越过7天墓碑期，再增加今日新运行；清理meta执行清单，查询详情/节点DTO、原正文引用及旧游标，最后清理。 覆盖当前Agent切换、初始Agent已删除且物理目录保持初始Agent ID。
    expected: trace仍按现有会话定位聊天，whole_conversation_trace_complete=false，原始过期正文不可读，新快照不续期旧数据；今日运行仍可读。逐执行墓碑有界回收，meta.json只留无正文归属/覆盖/过期汇总，清理换代旧游标snapshot_reset；30天后仍按现有最近Agent分组找到会话，删除立即撤权且文件最终清理，执行摘要标记expired，会话删除与摘要软删同事务完成。
      清理按固定agent_id定位，同会话的未过期运行与稳定会话锁保持有效。
  - order: 5
    action: 在可控UTC时钟下验证默认30天/3600秒；改为7天并跨恰好7×24小时边界，关闭/开启定时器，读取收紧期限后再调大；长会话保留今日运行，记录meta而非mtime判定。
    expected: 定时策略清理finished_at≤固定cutoff_at的已确认终态；读取取保存/当前期限较早值并原子持久化收紧，后续调大不放宽该值；关闭定时器仍禁止到期正文。已确认删除后墓碑最多额外7天回收，had_manual_cleanup与覆盖可长期解释缺口；活跃/未发布执行和新执行保留。
  - order: 6
    action: 保持定期30天，管理员主动清理7天以前的轨迹，沿游标完成多批，推进时钟并重试相同请求；对照当前租户跨用户/Agent会话、新执行、另一租户、聊天及附件canary。
    expected: 主动清理可提前回收且不更改定期配置；本轮cutoff_at固定，重复请求幂等；meta先撤引用并记录manual/时间/cleanup_version，旧快照reset、正文410，跨块读复核。成功unlink并fsync后才计删除数量/逻辑字节，pending/failed分别记录；其他租户、新执行、活跃运行、聊天及附件canary保持。
  - order: 7
    action: 定时/手动跨实例竞争cleanup锁及运行锁，注入撤引用后崩溃、unlink失败、目录fsync失败、文件已删但meta未更新；重启并重试，核对文件、meta和状态修正路径。
    expected: 批次互斥，最多检查1000执行/删除100文件或工作2秒后让出；占用/失败留pending或failed且不冒充完成。未确认删除的执行项跨7天仍保留以供重试，文件缺失幂等；物理删除确认后才回收墓碑。清理标记优先于重新发布，实际写入/聊天及全部canary保持，受管worker和测试资产释放。
  expected_results:
  - expires_at 基于各运行终态+30天；活跃运行不被会话创建时间误判，所有归属可核验。
  - 到期立即拒绝新读取/新块发送；meta先撤引用，再整份删除该执行OTLP，派生缓存/内容引用一起失效。终态发布重试仍遵守到期/删除，清理周期不延长可读期。 该执行的全部正文随唯一OTLP文件一起删除，其他执行及原聊天生命周期保持。
  - 单个及批量删除只对PG确认删除且归属匹配的会话立即提交清理，受管线程删除全部轮次OTLP；关闭定期过期清理仍生效，失败/占用保留待删标记并重试，队列满或重启由巡检补偿；数据库失败和范围外文件保持。会话删除立即撤权；过期墓碑有界回收，会话meta.json无正文过期统计支持已过期提示；其余内容和文件校验保持，全部独占资源清理。
  - trace仍按现有会话定位聊天，whole_conversation_trace_complete=false，原始过期正文不可读，新快照不续期旧数据；今日运行仍可读。逐执行墓碑有界回收，meta.json只留无正文归属/覆盖/过期汇总，清理换代旧游标snapshot_reset；30天后仍按现有最近Agent分组找到会话，删除立即撤权且文件最终清理，执行摘要标记expired，会话删除与摘要软删同事务完成。
    清理按固定agent_id定位，同会话的未过期运行与稳定会话锁保持有效。
  - 定时策略清理finished_at≤固定cutoff_at的已确认终态；读取取保存/当前期限较早值并原子持久化收紧，后续调大不放宽该值；关闭定时器仍禁止到期正文。已确认删除后墓碑最多额外7天回收，had_manual_cleanup与覆盖可长期解释缺口；活跃/未发布执行和新执行保留。
  - 主动清理可提前回收且不更改定期配置；本轮cutoff_at固定，重复请求幂等；meta先撤引用并记录manual/时间/cleanup_version，旧快照reset、正文410，跨块读复核。成功unlink并fsync后才计删除数量/逻辑字节，pending/failed分别记录；其他租户、新执行、活跃运行、聊天及附件canary保持。
  - 批次互斥，最多检查1000执行/删除100文件或工作2秒后让出；占用/失败留pending或failed且不冒充完成。未确认删除的执行项跨7天仍保留以供重试，文件缺失幂等；物理删除确认后才回收墓碑。清理标记优先于重新发布，实际写入/聊天及全部canary保持，受管worker和测试资产释放。
  forbidden_side_effects:
  - 不得删除聊天正文、聊天附件、存续会话的活跃运行或其他租户文件。
  - 不得通过备份或 soft-delete 行继续对外读取过期正文。
