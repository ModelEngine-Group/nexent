    blocked_reason: Backend cleanup is implemented, including the scheduled two-second work deadline. File-risk scripts and
      QUERY-D2 after-read HTTP expiry/cleanup/revocation variants are prepared but unexecuted. Live PG/chat reconciliation
      and managed timer startup/wakeup remain unimplemented in this Case; no complete execution binding is declared. Full
      acceptance is deferred by the user. Conversation-delete queue handoff and retry requirements are added; full API/PG/managed-worker
      runtime proof remains deferred and is not claimed from UT.
