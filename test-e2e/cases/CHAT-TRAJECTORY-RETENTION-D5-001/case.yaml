    profiles:
    - name: mock
      required_services: []
  risk_type: RELIABILITY
  risk: 可配置定期和主动清理只回收符合时间的轨迹，失败可重试
  condition:
  - 隔离时钟与目录，具备会话/租户 canary
  metrics:
  - 过期读取成功数
  - 未授权删除数
  - 遗留正文数
  - 清理边界误删数
  - 失败/待处理伪报成功数
  - 单批扫描/删除数量及工作时间
  thresholds:
  - 到期后新读取成功=0，未授权删除=0
  - 清理重试完成后正文及可检索摘要遗留=0
  - 未到期且未主动选中的执行误删=0；失败/待处理伪报成功=0
  - 批次最多检查1000执行或删除100文件或工作2秒后让出（完成当前原子步骤），下一批继续
  recovery_expectations:
  - 恢复测试时钟，清理独占墓碑和文件，验证正常新运行可归档。
