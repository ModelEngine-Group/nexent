    expected: '日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。

      v2.6.0 合并文件二次执行无状态变化；原文件路径与 merged 路径最终状态完全一致。'
  - order: 7
    action: '检查日志不泄露 secret，并清理临时数据。

      473b6526：在独立 PostgreSQL 数据库分别执行 v2.6.0 merged×2 与八个原文件+merged overlay，比较 schema/column/grant/permission 语义状态及来源 SHA。'
