      注入并指向本地/测试 AIDP 服务。
    - 创建或选定一个测试知识库并记录其 kds_id、归属租户与当前登录用户具备的 EDIT/READ 权限。
    - 数量上限：向 POST /aidp-mgmt/knowledge-bases/{kds_id}/documents 一次提交 51 个文件，记录 HTTP 状态、summary(total/success/failed) 与 failed_list
