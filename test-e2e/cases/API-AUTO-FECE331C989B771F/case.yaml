    - 部分成功：混合提交 1 个合法文件与 2 个超限文件，记录 summary(total/success/failed) 与 success_list、failed_list 的成员归属。
    - 列表分页：上传若干合法文件后调用 GET /aidp-mgmt/knowledge-bases/{kds_id}/documents?page=1&page_size=10，记录 value/total_count/has_more。
    - 计数降级：将 AIDP 文档计数接口指向失败 stub 或注入异常，再次调用列表端点，记录 total_reliable、total_count、has_more 与 next_link。
