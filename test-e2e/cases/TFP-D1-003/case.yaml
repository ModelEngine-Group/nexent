schema_version: '1.0'
stage: D1
module: RUNTIME-SANDBOX
case:
  case_id: TFP-D1-003
  feature_id: TFP-001
  requirement_ids:
  - TFP-001
  business_rule_ids:
  - TFP-RULE-003
  title: Promotion preserves user values and remains sticky
  type: SDK-UT
  priority: P0
  status: active
  automation: automated
  objective: Promotion preserves user values and remains sticky
  preconditions:
  - Use isolated official tool instances and a controlled executor factory.
  test_data:
    profile: mock
  steps:
  - order: 1
    action: Produce aliased user containers and a tool result, then submit ordinary code.
    expected: One executor is initialized and receives the user namespace.
  - order: 2
    action: Submit another approved step.
    expected: The initialized executor is reused.
  - order: 3
    action: Import json/loads/dumps with aliases, save parsed data and then activate ordinary code that uses those aliases.
      Include prior data names replaced by imports.
    expected: Recreate the actual imports once before ordinary code; migrate only user data and preserve references without
      replaying prior tools.
  expected_results: &id001
  - Values and shared container references survive migration.
  - Internal interpreter state and tool objects are not migrated.
  - JSON module/function objects are excluded; actual imported aliases are recreated.
  - The factory is called once.
  forbidden_side_effects:
  - No repeated prior tool invocation.
  unit_boundary: Restricted AST admission, real LocalPythonExecutor and NexentAgent executor lifecycle
  inputs:
  - Promotion preserves user values and remains sticky
  assertions: *id001
