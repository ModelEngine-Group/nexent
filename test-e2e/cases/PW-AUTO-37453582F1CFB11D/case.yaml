  - 在搜索框（placeholder=skillRepository.searchPlaceholder）输入关键字，等待 300ms 防抖后触发带 search 参数的列表请求，断言仅展示名称/描述/来源/提交者/标签匹配的条目（page.tsx:164-202）。
  - 点击标签过滤（TagFilterPopover）选择唯一标签 X，触发 tag_predicates 过滤请求，断言列表只显示含标签 X 的 listing 且过滤按钮高亮（RepositoryView.tsx:70-74；page.tsx:197-199）。
  - 点击列表卡片「详情」按钮，断言 SkillRepositoryDetailModal 弹出并回填 listing 的名称、描述与标签（page.tsx:729-737）。
  - 关闭详情，点击卡片「复制」按钮，弹出复用名称 Modal（RepositoryView.tsx:103-113；page.tsx:738）。
  - 在名称输入框填入当前租户已存在的技能名 Y 并点击确认，断言触发 POST /repository/skill/{id}/install 并返回 409，输入框下方显示重名冲突提示而非成功提示（skillRepository.copy.duplicateWithNames，page.tsx:420-431；backend/apps/skill_repository_app.py:362-372）。
  - 将名称改为唯一值 Z 重新确认，断言出现安装成功提示；切换到「我的」Tab 可按名搜索到该副本，随后删除该副本完成清理。
  final_business_result:
  - 「仓库」Tab 默认可见，GET /repository/skill?status=shared 返回非空 items，摘要 total 与分页 total 一致。
  - 输入搜索关键字后列表请求携带 search 参数，列表仅显示名称/描述/来源/提交者/标签匹配项。
  - 选择标签 X 后列表请求携带 tag_predicates，返回条目 tags 均包含标签 X。
  - 详情弹窗展示选中 listing 的 name、description 与 tags。
  - 目标名 Y 已存在时，复制安装请求得到 409 响应，UI 依据 detail.type=skill_duplicate 显示重名冲突文案，不出现成功提示。
  - 改名 Z 后安装成功出现成功提示，副本可在「我的」Tab 被搜索到并完成清理。
