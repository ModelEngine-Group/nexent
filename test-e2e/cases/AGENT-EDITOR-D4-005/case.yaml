schema_version: '1.0'
stage: D4
module: AGENT-EDITOR
case:
  case_id: AGENT-EDITOR-D4-005
  feature_id: AGENT-EDITOR-WORKFLOWS
  requirement_ids:
  - AGENT-EDITOR-REQ-005
  business_rule_ids:
  - AGENT-EDITOR-RULE-005
  title: Keep read-only fields protected through debug mode switches
  type: E2E
  priority: P1
  status: active
  automation: automated
  objective: Read-only configuration remains protected before and after debug navigation
    and reload, while switching modes never writes or runs an Agent.
  preconditions:
  - A running frontend is reachable; deterministic existing HTTP fixtures isolate
    Agent data, authorization and model/resource boundaries.
  test_data:
    profile: mock
    locale: zh
    viewport:
      width: 1920
      height: 1080
  steps:
  - order: 1
    action: Open a read-only draft and inspect editing/publication controls.
    expected: Identity, greeting and resource-add controls are disabled; publication
      is disabled.
  - order: 2
    action: Switch to debug mode without submitting a prompt.
    expected: The real debug pane remains reachable without Agent execution.
  - order: 3
    action: Return to configure mode and reload.
    expected: Read-only protection and persisted content remain intact with no write
      or provider execution.
  expected_results:
  - Read-only configuration remains protected before and after debug navigation and
    reload, while switching modes never writes or runs an Agent.
  forbidden_side_effects:
  - No unrelated writes, publication or Agent/model execution; only explicitly requested
    creation/autosave writes are allowed.
  actor: Authorized Agent development user
  journey:
  - Open a read-only draft and inspect editing/publication controls.
  - Switch to debug mode without submitting a prompt.
  - Return to configure mode and reload.
  final_business_result:
  - Read-only configuration remains protected before and after debug navigation and
    reload, while switching modes never writes or runs an Agent.
  failure_evidence:
  - Fixed Playwright journey assertions, sanitized request payloads and terminal audit.
  acceptance:
  - id: AC-01
    description: Read-only configuration remains protected before and after debug
      navigation and reload, while switching modes never writes or runs an Agent.
    steps:
    - 1
    - 2
    - 3
    expected_results:
    - 1
    forbidden_side_effects:
    - 1
