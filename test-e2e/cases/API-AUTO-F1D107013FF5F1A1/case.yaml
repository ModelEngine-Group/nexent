  contract:
    protocol: HTTP API
    request_expectations:
    - 确定一个含有来源检索记录（score_details 应含 retrieval_highlight_terms）的目标 conversation_id，并记录该记录持久化的期望高亮词数组。
    - 通过 backend/apps/conversation_management_app.py 对外暴露的真实入口 GET /conversation/{conversation_id} 获取会话历史，记录返回结构与状态码。
    - 断言返回 data[0].message 中对应 assistant 消息 search 列表内该来源项的 score_details.retrieval_highlight_terms 存在且为数组，内容与持久化值一致；同时 score_overall
      以 numeric(14,6) 精度正常返回。
    - 通过 POST /conversation/sources 请求体 {conversation_id, type:"search"} 获取来源信息，断言 data.searches[] 中同一来源的 score_details.retrieval_highlight_terms
      存在且与历史接口返回一致。
    - 再次 GET /conversation/{conversation_id}（模拟历史会话重载），断言 retrieval_highlight_terms 在跨重载后仍完整返回，顺序与元素不变，来源卡高亮所需字段不丢失。
    - 对 retrieval_highlight_terms 为空或不存在的来源记录，断言 score_details 不输出该字段且不产生序列化异常或 500。
    - 检查日志不泄露 secret，并清理当次临时数据。
    response_expectations:
    - GET /conversation/{conversation_id} 与 POST /conversation/sources 均在 score_details 中返回 retrieval_highlight_terms，字段为数组且与持久化值一致，测试过程无未处理异常。
    - 跨重载：重复调用历史接口返回相同的 retrieval_highlight_terms，字段不被截断、重排或丢失。
    - score_overall 按扩宽后的 numeric(14,6) 精度正常返回，不出现精度溢出或类型错误。
    - 空/缺失 retrieval_highlight_terms 时不输出该字段，不抛 500；失败路径返回明确错误。
    - 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
