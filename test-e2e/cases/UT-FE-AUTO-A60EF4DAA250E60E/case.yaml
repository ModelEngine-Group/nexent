schema_version: '1.0'
stage: D1
module: V5-BASELINE
case:
  case_id: UT-FE-AUTO-A60EF4DAA250E60E
  feature_id: F-054
  business_rule_ids:
  - F-054-RULE-01
  title: 模型可用性过滤、初始默认选择与失效后禁止发送：保留有效候选，显式重选后恢复
  type: FE-COMP
  priority: P1
  status: active
  automation: automated
  objective: 模型可用性过滤、初始默认选择与失效后禁止发送：保留有效候选，显式重选后恢复
  preconditions:
  - 本地前端组件测试环境可运行（node:test / @testing-library 等），不要求外部模型服务在线。
  - 测试可 mock useModelList/useAgentStore，注入固定的 availableLlmModels（含 connect_status）与 editedAgent/agentInfo/PublishAgent 数据。
  - 固定测试数据区分目录已移除的模型、连通性检测失败的模型和检测通过的模型。
  - 所需本地资产/配置存在且校验通过（见本地资产/配置），测试代码不读取生产凭据。
  test_data:
    legacy_asset_declaration: '- 组件测试 fixture：availableLlmModels / editedAgent(model_ids, model, model_names) / agentInfo(model_ids)
      / PublishAgent(model_ids, model_names) 的固定 mock 数据，不访问真实模型或公网。'
  steps:
  - order: 1
    action: 渲染 agent-prompt.tsx 的 AgentPrompt 组件，注入 useModelList 返回可用模型列表（如 A、B 均 connect_status=available），editedAgent.model_ids=[A,
      已失效C]。
    expected: 目录中已移除的模型不再出现在 model_ids/model/model_names 中。
  - order: 2
    action: 模型列表加载完成后检查 Agent 配置候选，确认不存在已移除的 C。
    expected: 新配置的默认回填遵循已配置的有效默认模型。
  - order: 3
    action: 断言 selectedModelIds 过滤掉已失效 C，仅保留可用 id。
    expected: model/model_names 与可用模型的展示名一致。
  - order: 4
    action: 断言 useEffect 触发 updateAgent 时 model_ids 仅含可用 id，model 与 model_names 同步为可用模型的展示名，主模型回退到首个可用模型，不产生空 model 引用。
    expected: 模型均已移除时模型列表为空，无有效选中模型且 Composer disabled=true。
  - order: 5
    action: 当 editedAgent.model_ids 为空时，断言回退到 defaultLlmConfig.id 且仅在 defaultLlmConfig.id 可用时保留，否则为空数组。
    expected: 测试过程无未处理异常，日志不含 API Key/Token/Password/模型密钥。
  - order: 6
    action: 渲染 AgentDebugPanel → Chat → Thread，注入已检测通过及检测失败的本租户 LLM。
    expected: 保留候选及原始检测状态，允许显式选择仍在目录内的检测失败模型。
  - order: 7
    action: 从目录移除已选择模型，断言选中态清空且禁止发送；候选列表保留其余模型，显式选择后恢复发送。
    expected: 测试过程无未处理异常，日志不含 API Key/Token/Password/模型密钥。
  - order: 8
    action: 渲染 newchat Thread，分别注入检测结果混合和检测均未通过的模型。
    expected: 保留候选及检测状态，只自动选择检测通过的模型。没有检测通过的候选时等待显式选择。
  - order: 9
    action: 全部场景执行后确认无空模型引用、无未处理异常，console/日志中不出现 API Key/Token/密钥。
    expected: 测试过程无未处理异常，日志不含 API Key/Token/Password/模型密钥。
  expected_results:
  - 已移除的 model_ids 不再出现在配置的 model_ids/model/model_names 中。
  - 配置侧过滤失效模型并同步主模型/展示名；新会话初始化可选用有效默认模型，已选模型动态失效后禁止发送，不静默改选。
  - model/model_names 与可用模型的展示名一致。
  - 模型均已移除时列表为空。仅检测失败时保留候选及检测状态，无有效选中模型时 Composer 禁止发送。
  - 测试过程无未处理异常，日志不含 API Key/Token/Password/模型密钥。
  forbidden_side_effects: []
  source:
    notes: Verify real Debug-Chat-Thread model selection. The approved model access contract permits explicit selection after a failed connectivity check, while removed models still require reselection.
    legacy_workbook_sha256: aa4b32414d30f12b3b64e14236268145e556bd7cfc5d3eb8df80731608ebc022
    legacy_sheet: 02_测试用例基线
    legacy_row: 445
  unit_boundary: 配置前端
  inputs:
  - '- 组件测试 fixture：availableLlmModels / editedAgent(model_ids, model, model_names) / agentInfo(model_ids) / PublishAgent(model_ids,
    model_names) 的固定 mock 数据，不访问真实模型或公网。'
  assertions:
  - 已移除的 model_ids 不再出现在配置的 model_ids/model/model_names 中。
  - 配置侧过滤失效模型并同步主模型/展示名；新会话初始化可选用有效默认模型，已选模型动态失效后禁止发送，不静默改选。
  - model/model_names 与可用模型的展示名一致。
  - 模型均已移除时列表为空。仅检测失败时保留候选及检测状态，无有效选中模型时 Composer 禁止发送。
  - 测试过程无未处理异常，日志不含 API Key/Token/Password/模型密钥。
  acceptance:
  - id: AC-FILTER
    description: 配置过滤失效模型并同步主模型和展示名，保留初始默认模型选择与无可用默认边界。
    steps:
    - 1
    - 2
    - 3
    - 4
    - 5
    expected_results:
    - 1
    - 3
  - id: AC-SELECTION
    description: 保留检测失败候选和检测状态，只自动选择检测通过的模型。已选模型移除后禁止发送，显式重选后恢复。
    steps:
    - 6
    - 7
    - 8
    expected_results:
    - 2
    - 4
  - id: AC-STABILITY
    description: 组件完成全部边界场景且不产生未处理异常或输出模型凭证。
    steps:
    - 9
    expected_results:
    - 5
