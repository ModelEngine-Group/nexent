case:
  case_id: UT-FE-AUTO-A60EF4DAA250E60E
  feature_id: F-054
  business_rule_ids:
  - F-054-RULE-01
  title: 模型可用性过滤与主模型回退：agent 配置/Debug/线程选择器中失效 model_ids 被清除且无空模型引用
  type: FE-COMP
  priority: P1
  status: active
  automation: automated
  objective: 模型可用性过滤与主模型回退：agent 配置/Debug/线程选择器中失效 model_ids 被清除且无空模型引用
  preconditions:
  - 本地前端组件测试环境可运行（node:test / @testing-library 等），不要求外部模型服务在线。
  - 测试可 mock useModelList/useAgentStore，注入固定的 availableLlmModels（含 connect_status）与 editedAgent/agentInfo/PublishAgent
    数据。
  - 固定测试数据：model_ids 同时包含已失效 id（不在 availableLlmModels 或 connect_status != available）与若干可用 id。
  - 所需本地资产/配置存在且校验通过（见本地资产/配置），测试代码不读取生产凭据。
  test_data:
    legacy_asset_declaration: '- 组件测试 fixture：availableLlmModels / editedAgent(model_ids, model, model_names) / agentInfo(model_ids)
      / PublishAgent(model_ids, model_names) 的固定 mock 数据，不访问真实模型或公网。'
  steps:
  - order: 1
    action: 渲染 agent-prompt.tsx 的 AgentPrompt 组件，注入 useModelList 返回可用模型列表（如 A、B 均 connect_status=available），editedAgent.model_ids=[A,
      已失效C]。
    expected: 已失效/不可用 model_ids 被 availableLlmModels 或 connect_status=available 过滤，不再出现在 model_ids/model/model_names 中。
  - order: 2
    action: 模型列表加载完成后，断言 modelOptions 仅由 availableLlmModels 生成，不包含已失效 C。
    expected: 主模型、Debug 默认模型、线程默认模型均回退到首个可用模型，不产生空模型引用。
  - order: 3
    action: 断言 selectedModelIds 过滤掉已失效 C，仅保留可用 id。
    expected: model/model_names 与可用模型的展示名一致。
  - order: 4
    action: 断言 useEffect 触发 updateAgent 时 model_ids 仅含可用 id，model 与 model_names 同步为可用模型的展示名，主模型回退到首个可用模型，不产生空 model 引用。
    expected: 全部不可用时 selectedModelIds/debugModelIds/defaultModelId/useAgentModels 模型列表为空且选中 ID 为 undefined，组件不崩溃、不引用畸形模型。
  - order: 5
    action: 当 editedAgent.model_ids 为空时，断言回退到 defaultLlmConfig.id 且仅在 defaultLlmConfig.id 可用时保留，否则为空数组。
    expected: 测试过程无未处理异常，日志不含 API Key/Token/Password/模型密钥。
  - order: 6
    action: 渲染 AgentDebugPanel → Chat → Thread，注入 editedAgent.model_ids 含已失效 id 与可用 id，断言 Composer.models 仅保留 connect_status=available 的 id，模型展示名
      与可用模型展示名一致，selectedModelId 回退到首个可用模型的字符串 ID。
    expected: 测试过程无未处理异常，日志不含 API Key/Token/Password/模型密钥。
  - order: 7
    action: 断言 selectedModelId 在当前值失效时回退到 defaultModelId，全部不可用时回退到 undefined 且不崩溃。
    expected: 测试过程无未处理异常，日志不含 API Key/Token/Password/模型密钥。
  - order: 8
    action: 渲染 newchat Thread 的 useAgentModels，注入 availableModels 中含 connect_status != available 的模型，断言返回列表仅含 connect_status=available
      的模型，全部不可用时返回空数组。
    expected: 测试过程无未处理异常，日志不含 API Key/Token/Password/模型密钥。
  - order: 9
    action: 全部场景执行后确认无空模型引用、无未处理异常，console/日志中不出现 API Key/Token/密钥。
    expected: 测试过程无未处理异常，日志不含 API Key/Token/Password/模型密钥。
  expected_results:
  - 已失效/不可用 model_ids 被 availableLlmModels 或 connect_status=available 过滤，不再出现在 model_ids/model/model_names 中。
  - 主模型、Debug 默认模型、线程默认模型均回退到首个可用模型，不产生空模型引用。
  - model/model_names 与可用模型的展示名一致。
  - 全部不可用时 selectedModelIds/debugModelIds/defaultModelId/useAgentModels 模型列表为空且选中 ID 为 undefined，组件不崩溃、不引用畸形模型。
  - 测试过程无未处理异常，日志不含 API Key/Token/Password/模型密钥。
  forbidden_side_effects: []
  source:
    notes: DebugConfig was replaced by AgentDebugPanel in workbench refactor 106729394; verify real Debug-Chat-Thread model selection.
    legacy_workbook_sha256: aa4b32414d30f12b3b64e14236268145e556bd7cfc5d3eb8df80731608ebc022
    legacy_sheet: 02_测试用例基线
    legacy_row: 445
  unit_boundary: 配置前端
  inputs:
  - '- 组件测试 fixture：availableLlmModels / editedAgent(model_ids, model, model_names) / agentInfo(model_ids) / PublishAgent(model_ids,
    model_names) 的固定 mock 数据，不访问真实模型或公网。'
  assertions:
  - 已失效/不可用 model_ids 被 availableLlmModels 或 connect_status=available 过滤，不再出现在 model_ids/model/model_names 中。
  - 主模型、Debug 默认模型、线程默认模型均回退到首个可用模型，不产生空模型引用。
  - model/model_names 与可用模型的展示名一致。
  - 全部不可用时 selectedModelIds/debugModelIds/defaultModelId/useAgentModels 模型列表为空且选中 ID 为 undefined，组件不崩溃、不引用畸形模型。
  - 测试过程无未处理异常，日志不含 API Key/Token/Password/模型密钥。
