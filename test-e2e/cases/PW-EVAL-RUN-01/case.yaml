schema_version: '1.0'
stage: D4
module: V5-BASELINE
case:
  case_id: PW-EVAL-RUN-01
  feature_id: V5-PW-EVAL-RUN-01
  business_rule_ids:
  - V5-PW-EVAL-RUN-01-RULE-01
  title: Create Evaluation→Agent/Version/Judge/Set/Evaluator→Try it out→Run→结果
  type: E2E
  priority: P0
  status: active
  automation: automated
  objective: 按/evaluation当前Runs真实字段验证评估全链。
  preconditions:
  - Published Agent及version
  - 真实Judge model
  - 可用Evaluator
  - 固定Evaluation Set
  test_data:
    legacy_asset_declaration: config/models.yaml；assets/evaluation/eval_set.xlsx；expected/evaluation_expected.json
  steps:
  - order: 1
    action: 打开/evaluation→评测，点击【创建评测】。
    expected: 选择控件与当前页面一致。
  - order: 2
    action: 选择Published Agent和明确Version。
    expected: Try it out真实调用Agent/Evaluator。
  - order: 3
    action: 选择真实Judge Model。
    expected: Run可轮询到终态且详情可打开。
  - order: 4
    action: 切换【有评测集评测】并选择run_id Set，确认query/expected/actual默认Mapping。
    expected: 模式切换后评估器与字段映射清空重置，自定义Evaluator仅在参考答案模式下可选。
  - order: 5
    action: 选择1+ Evaluator，检查type/status。
    expected: 评估主流程在 /evaluation 及其详情页完成，不依赖独立旧评估器页面。
  - order: 6
    action: 点击【Try it out】，等待真实Agent+Evaluator试运行并检查Trial Result。
    expected: 评估主流程在 /evaluation 及其详情页完成，不依赖独立旧评估器页面。
  - order: 7
    action: 提交正式Run。
    expected: 评估主流程在 /evaluation 及其详情页完成，不依赖独立旧评估器页面。
  - order: 8
    action: 按创建响应的run ID定位新行，检查等待中/运行中或已完成状态。
    expected: 评估主流程在 /evaluation 及其详情页完成，不依赖独立旧评估器页面。
  - order: 9
    action: 等待COMPLETED或明确失败终态。
    expected: 评估主流程在 /evaluation 及其详情页完成，不依赖独立旧评估器页面。
  - order: 10
    action: 成功后点击该run的查看按钮进入/evaluation/{id}。
    expected: 评估主流程在 /evaluation 及其详情页完成，不依赖独立旧评估器页面。
  - order: 11
    action: 检查case结果、score/evaluator输出等满足expected结构。
    expected: 评估主流程在 /evaluation 及其详情页完成，不依赖独立旧评估器页面。
  expected_results:
  - 选择控件与当前页面一致。
  - Try it out真实调用Agent/Evaluator。
  - Run可轮询到终态且详情可打开。
  - 评估主流程在 /evaluation 及其详情页完成，不依赖独立旧评估器页面。
  forbidden_side_effects: []
  source:
    legacy_workbook_sha256: aa4b32414d30f12b3b64e14236268145e556bd7cfc5d3eb8df80731608ebc022
    legacy_sheet: 03_Playwright_Journey
    legacy_row: 48
    notes: 2026-10-19 editorial correction of repeated obsolete-page wording; current /evaluation journey, fixed script and acceptance scope are unchanged. 2026-10-23 product now lists custom Evaluators only in reference-answer (有评测集评测) mode; Set selection moved before Evaluator selection and fixed script order aligned.
  actor: Nexent browser user
  journey:
  - 打开/evaluation→评测，点击【创建评测】。
  - 选择Published Agent和明确Version。
  - 选择真实Judge Model。
  - 切换【有评测集评测】并选择run_id Set，确认query/expected/actual默认Mapping。
  - 选择1+ Evaluator，检查type/status。
  - 点击【Try it out】，等待真实Agent+Evaluator试运行并检查Trial Result。
  - 提交正式Run。
  - 按创建响应的run ID定位新行，检查等待中/运行中或已完成状态。
  - 等待COMPLETED或明确失败终态。
  - 成功后点击该run的查看按钮进入/evaluation/{id}。
  - 检查case结果、score/evaluator输出等满足expected结构。
  final_business_result:
  - 选择控件与当前页面一致。
  - Try it out真实调用Agent/Evaluator。
  - Run可轮询到终态且详情可打开。
  - 评估主流程在 /evaluation 及其详情页完成，不依赖独立旧评估器页面。
  failure_evidence:
  - '${NEXENT_TEST_HOME}/runs/{run_id}/playwright/PW-EVAL-RUN-01/

    - screenshot.png / trace.zip / video.webm

    - console.log / network.har / failure.json

    - 涉及协议时关联 wire/*.jsonl；涉及下载时保留 downloads/'
