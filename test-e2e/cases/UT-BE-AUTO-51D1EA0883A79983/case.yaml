  - get_model_descriptor 正常返回 display_name 与 is_multimodal，异常/缺失回退默认值不抛错。
  - create_embedding_model 按 model_type 选择正确 modality/slot 并透传 model_factory；非法 model_type 抛 ValueError。
  - get_embedding_model_by_id 非 embedding 或缺失返回 (None, None)，无伪成功。
  - get_rerank_model 按名匹配与默认 RERANK_ID 回退正确；非 rerank 返回 None。
  - 全过程无未处理异常，日志不含 api_key 明文。
