  contract:
    protocol: HTTP API
    request_expectations:
    - 以合法 authorization 头调用 GET /repository/agent/mine?ownership=all，记录 HTTP 状态码与响应 JSON。
    - 校验响应结构含 items、counts、pagination 三个顶层字段；counts 含 all/created/others 且 all == created + others。
    - 以 ownership=created 调用，校验 items 中每个 agent 的 created_by == 当前 user_id，且未启用 new_agent_padding 时 pagination.total 与 counts.created
      一致。
    - 以 ownership=others 调用，校验 items 中每个 agent 的 created_by != 当前 user_id，且 pagination.total 与 counts.others 一致。
    - 以非法 ownership（如 unknown）调用，校验返回 HTTP 400 且 detail 提示非法 ownership 及允许值 all/created/others。
    - 校验 counts.created/others 与当前用户归属一致，且与三组 ownership 过滤后的 items 数量一致。
    - 校验分页字段 page/page_size/total/total_pages 语义正确；page_size 为 0 或大于 100 时返回参数校验错误（400/422）。
    - 以缺失或无效 authorization 调用，校验返回 HTTP 401 且不返回任何租户数据。
    response_expectations:
    - ownership=all 返回 200，items 为当前租户可见草稿 Agent 列表，counts.all 等于可见 Agent 总数，且 all == created + others。
    - ownership=created 仅返回 created_by == 当前 user_id 的 Agent；ownership=others 仅返回 created_by != 当前 user_id 的 Agent，二者无重叠。
    - 非法 ownership 返回 HTTP 400，detail 包含 "Invalid ownership filter" 与允许值 all/created/others。
    - counts.created/others 与当前用户归属一致，且与对应 ownership 过滤结果的 items 数量一致。
    - 分页字段正确：page_size 生效、total_pages == ceil(total/page_size)（total==0 时为 0），跨页无重复/遗漏。
    - 无有效 authorization 返回 HTTP 401，不返回任何租户数据，请求无副作用、无跨租户泄露。
    - 响应与日志中不出现明文 API Key/Token/Password/模型密钥。
