    blocked_reason: The smolagents backend capture and local archive path are implemented. This Case still lacks its fixed real-provider script and binding; real-model acceptance is deferred by the user and no provider result is claimed.
  execution:
    profiles:
    - name: real_smoke
      required_services:
      - model-provider
  integration_boundary:
  - 真实 Nexent Agent、配置模型 Provider 和无副作用工具
  - 真实数据库与挂载目录到冷读取 API
  observations:
  - 脱敏模型请求/工具调用关联
  - 归档全文校验与真实指标
  - 资源清理记录
  cleanup:
  - 按资源登记释放本用例 Agent、会话、工具 fixture 和文件；保留脱敏证据。
