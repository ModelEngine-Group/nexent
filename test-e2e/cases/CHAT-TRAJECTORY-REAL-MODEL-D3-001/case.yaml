schema_version: '1.0'
stage: D3
module: CHAT-MESSAGE
case:
  case_id: CHAT-TRAJECTORY-REAL-MODEL-D3-001
  feature_id: CHAT-TRAJECTORY
  requirement_ids:
  - CHAT-LOCAL-TRAJECTORY-20261103
  business_rule_ids:
  - TRJ-RULE-001
  - TRJ-RULE-002
  - TRJ-RULE-004
  title: 真实模型及无副作用工具的轨迹输入输出可冷读核验
  type: AGENT-IT
  priority: P1
  status: blocked
  automation: automated
  objective: 真实模型及无副作用工具的轨迹输入输出可冷读核验
  preconditions:
  - 设计阶段；轨迹产品接口、固定脚本和 case-local execution.yaml 尚未实现，本 Case 不可计为通过。
  - 使用隔离测试会话、租户和独占轨迹根目录；记录被测提交、配置快照和本用例资源清单。
  - 读取使用可信ADMIN/SU身份，目标会话由独立普通用户创建；actor与owner区分，非管理员读取应拒绝。
  - 业务trace_id直接复用现有conversation_id；菜单按用户→最近根智能体→会话，打开后读取整个会话范围；PG复用现有表结构和查询，轨迹正文及执行清单全部为文件。
  - 基于现有MonitoringManager，通过MONITORING_PROVIDER选择互斥的local_file/otlp及远端提供方；本地业务正文为正文内嵌的标准OTLP JSONL，会话meta.json保存归属、执行清单和确认进度。
  - 目录使用tenant/user/storage_agent/conversation业务ID，storage_agent_id固定为首次采集根Agent；稳定owner/会话锁串行首次定位与登记。会话切换根Agent仍读写同一物理目录。
  - 所有正文内嵌OTLP Span属性/Events；256KiB为批量刷盘阈值，单行可更大。读写须处理大型字符串的增量编码/解码，正文API按解码后的UTF-8区间返回。
  test_data:
    profile: real_smoke
  steps:
  - order: 1
    action: 从 configured_llm 逻辑配置创建独占 Agent，使用实际支持 Core 和固定任务调用一次受控 echo/calculator 工具。
    expected: 产品真正向模型发起请求并发生工具调用，记录实际模型/Core/配置指纹与脱敏关联 ID；无环境时保持 BLOCKED。
  - order: 2
    action: 经真实监控与local_file导出核对最终请求、工具原值和OTLP属性/Events；检查每次物理请求Span、Provider usage与首token时间，再由查询适配器读取。
    expected: 实际模型可见输入、reasoning（若返回）、工具参数/结果和最终输出与本地OTLP一致；每物理attempt有独立Span，片段归并无重复；指标来自实际观测，未知保持未知。
  - order: 3
    action: 等待 ready 并重启查询服务，重新读取全文，再清理全部独占资源。
    expected: 冷读保留内容与父子关系；没有模型/工具重放；真实执行、清理与 Mock 结果分别记录。
  expected_results:
  - 产品真正向模型发起请求并发生工具调用，记录实际模型/Core/配置指纹与脱敏关联 ID；无环境时保持 BLOCKED。
  - 实际模型可见输入、reasoning（若返回）、工具参数/结果和最终输出与本地OTLP一致；每物理attempt有独立Span，片段归并无重复；指标来自实际观测，未知保持未知。
  - 冷读保留内容与父子关系；没有模型/工具重放；真实执行、清理与 Mock 结果分别记录。
  forbidden_side_effects:
  - 不得保存凭证或修改共享模型配置。
  - 不得用健康检查成功或 Mock 结果代替真实推理和工具调用。
  acceptance:
  - id: AC-01
    description: 产品真正向模型发起请求并发生工具调用，记录实际模型/Core/配置指纹与脱敏关联 ID；无环境时保持 BLOCKED。
    steps:
    - 1
    expected_results:
    - 1
  - id: AC-02
    description: 实际模型可见输入、reasoning（若返回）、工具参数/结果和最终输出与本地OTLP一致；每物理attempt有独立Span，片段归并无重复；指标来自实际观测，未知保持未知。
    steps:
    - 2
    expected_results:
    - 2
  - id: AC-03
    description: 冷读保留内容与父子关系；没有模型/工具重放；真实执行、清理与 Mock 结果分别记录。
    steps:
    - 3
    expected_results:
    - 3
    forbidden_side_effects:
    - 1
    - 2
  source:
    spec_path: nexent-doc/docs/Developing/chat-local-file-trajectory/proposal.md
    acceptance_criteria:
