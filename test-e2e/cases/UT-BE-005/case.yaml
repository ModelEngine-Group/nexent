schema_version: '1.0'
stage: D1
module: V5-BASELINE
case:
  case_id: UT-BE-005
  feature_id: F-153
  business_rule_ids:
  - F-153-RULE-01
  title: 监控状态配置归一化与 Dashboard 角色白名单
  type: BE-UT
  priority: P2
  status: active
  automation: automated
  objective: 监控状态配置归一化与 Dashboard 角色白名单
  preconditions:
  - 本地依赖/组件测试环境可运行；不要求外部模型服务在线。
  - 设置 NEXENT_TEST_HOME，目录不位于 Nexent Git 仓库内。
  - 当次 run_id 已生成，所有新建资源名称带 run_id；测试基线固定为 develop 当前批次锁定的产品提交；执行时另记录实际被测commit。
  - 所需本地资产存在且校验通过：${NEXENT_TEST_HOME}/config/environment.yaml（仅本地测试环境参数）
  test_data:
    legacy_asset_declaration: '- ${NEXENT_TEST_HOME}/config/environment.yaml（仅本地测试环境参数）'
  steps:
  - order: 1
    action: 注入 ENABLE_TELEMETRY、provider、Dashboard URL 与包含空格/重复/大小写混合的允许角色。
    expected: provider 小写、URL 去空格。
  - order: 2
    action: 调用 monitoring status。
    expected: 角色统一大写、去重且保持配置顺序。
  - order: 3
    action: 校验 provider、URL 和 dashboard_allowed_roles。
    expected: 空配置返回空数组。
  - order: 4
    action: 覆盖空值与重复角色。
    expected: 响应不泄露其他环境变量。
  expected_results:
  - provider 小写、URL 去空格。
  - 角色统一大写、去重且保持配置顺序。
  - 空配置返回空数组。
  - 响应不泄露其他环境变量。
  forbidden_side_effects: []
  source:
    legacy_workbook_sha256: aa4b32414d30f12b3b64e14236268145e556bd7cfc5d3eb8df80731608ebc022
    legacy_sheet: 02_测试用例基线
    legacy_row: 295
  unit_boundary: 监控
  inputs:
  - '- ${NEXENT_TEST_HOME}/config/environment.yaml（仅本地测试环境参数）'
  assertions:
  - provider 小写、URL 去空格。
  - 角色统一大写、去重且保持配置顺序。
  - 空配置返回空数组。
  - 响应不泄露其他环境变量。
