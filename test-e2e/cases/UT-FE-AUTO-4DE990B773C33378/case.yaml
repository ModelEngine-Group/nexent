    legacy_sheet: 02_测试用例基线
    legacy_row: 430
  unit_boundary: 会话线程与Agent绑定
  inputs:
  - '- 无额外本地资产；测试读取 frontend/app/[locale]/newchat/page.tsx、frontend/app/[locale]/newchat/adapter/conversation-thread-list-adapter.tsx、frontend/app/[locale]/newchat/assistant-ui/thread.tsx
    源码做静态断言。'
  assertions:
  - 'handleAgentSelectedFromLanding 在写入 agentId 前先完成新线程 initialize，且 updateCustom 携带 { agentId: agent.id }。'
  - 本地新线程在服务端尚无 conversation_id 时即可保存所选 agent，updateCustom 为 no-op，不要求后端会话 ID。
  - 返回列表时 shouldRestoreAgentRef=false 且 switchToNewThread() 清理旧线程状态，onBack() 返回 landing。
  - 有历史消息的会话在标题下展示所选 agent 名称。
  - 测试过程无未处理异常，日志不输出明文 API Key/Token/Password。
