schema_version: '1.0'
stage: D3
module: FILE-CLEANSE
case:
  case_id: DPR-CLEANSE-D3-001
  feature_id: DPR-CLEANSE
  requirement_ids: [DPR-001]
  business_rule_ids: [DPR-CLEANSE-RULE-01, DPR-CLEANSE-RULE-02, DPR-CLEANSE-RULE-03]
  title: Durable cleansing admission and fenced dispatch over PostgreSQL and Redis
  type: INTEGRATION
  priority: P1
  status: active
  automation: automated
  objective: Exercise real Management job policy with real storage ports and broker delivery.
  preconditions:
  - Docker and cached postgres:15-alpine and redis:7-alpine images are available.
  - Backend Python dependencies are installed.
  test_data:
    resources: Disposable databases and synthetic user/tenant/object references.
    execution: Controlled parser-result reference; no model or object provider is invoked.
  steps:
  - order: 1
    action: Submit run and knowledge-file requests twice; attempt inspection and cancellation from foreign users, tenants and knowledge/file/version contexts.
    expected: Each scope keeps its stable job ID; scopes are disjoint and foreign access is refused.
  - order: 2
    action: Publish each scoped job twice through Redis and consume with the local registry.
    expected: Each job executes once and its durable completed artifact remains inspectable in its original scope.
  - order: 3
    action: Advance a controlled clock past a lease, take over the job and submit the old completion.
    expected: The old attempt cannot complete; the new owner can publish its result.
  - order: 4
    action: Record an unknown publication outcome and advance beyond its lease.
    expected: Automatic ready selection excludes the job.
  - order: 5
    action: Read audit timestamps under a non-UTC PostgreSQL session and remove owned test resources.
    expected: UTC values and date filters remain correct; no test containers or anonymous volumes are retained.
  - order: 6
    action: Run the synchronous consumer and request stop after durable dispatch, before broker acknowledgement.
    expected: Completion remains inspectable, acknowledgement completes with a bounded cleanup budget and the queue is closed.
  - order: 7
    action: Renew an authorized attempt, advance beyond its original lease, then cancel it and run the next lease check.
    expected: Renewal prevents takeover after the original deadline; cancellation prevents subsequent renewal.
  - order: 8
    action: Admit a KB cleansing request through actual resource catalogs and DAC, then revoke its account role and replace the file generation.
    expected: Current resource authorization succeeds; role revocation and a stale generation both refuse execution without exposing credentials.
  expected_results:
  - Idempotent admission preserves user/tenant and run or knowledge/file/version ownership.
  - Duplicate broker delivery does not repeat completed execution.
  - Lease takeover fences the previous attempt.
  - Recorded unknown outcomes are not blindly requeued.
  - Audit timestamps retain UTC semantics and disposable resources are reclaimed.
  - Consumer stop closes its queue after durable acknowledgement without a new dispatch.
  - Parent lease checks renew only an authorized current attempt and reject cancelled work.
  - Resource catalogs enforce current membership, account roles and pinned source generation.
  forbidden_side_effects:
  - No application database, broker, credentials or containers are used.
  integration_boundary:
  - Real PostgreSQL and Redis, RecordStore and WorkQueue, Management jobs and registry; real KB resource catalogs and DAC in step 8, controlled run callbacks, clock and parser result elsewhere.
  observations:
  - Job identity, persisted artifact, execution count, rejected ownership, takeover and quarantine state.
  cleanup:
  - Delete only test-owned containers by their returned IDs including anonymous volumes.
  acceptance:
  - id: AC-01
    description: Admission and inspection enforce durable identity and ownership.
    steps: [1]
    expected_results: [1]
    forbidden_side_effects: [1]
  - id: AC-02
    description: Duplicate delivery and lease takeover preserve one current execution result.
    steps: [2, 3]
    expected_results: [2, 3]
    forbidden_side_effects: [1]
  - id: AC-03
    description: Unknown outcomes and UTC audit semantics survive real storage interaction.
    steps: [4, 5]
    expected_results: [4, 5]
    forbidden_side_effects: [1]
  - id: AC-04
    description: Orderly consumer stop preserves durable completion and closes delivery resources.
    steps: [6]
    expected_results: [6]
    forbidden_side_effects: [1]
  - id: AC-05
    description: Lease guard renews current authorized work and observes cancellation.
    steps: [7]
    expected_results: [7]
    forbidden_side_effects: [1]
  - id: AC-06
    description: Actual resource records and DAC refuse revoked or stale cleansing requests.
    steps: [8]
    expected_results: [8]
    forbidden_side_effects: [1]
