schema_version: '1.0'
stage: D3
module: FILE-CLEANSE
case:
  case_id: DPR-CLEANSE-D3-001
  feature_id: DPR-CLEANSE
  requirement_ids: [DPR-001]
  business_rule_ids: [DPR-CLEANSE-RULE-01, DPR-CLEANSE-RULE-02, DPR-CLEANSE-RULE-03]
  title: Durable cleansing admission and fenced dispatch over PostgreSQL and Redis
  type: INTEGRATION
  priority: P1
  status: active
  automation: automated
  objective: Exercise real Management job policy with real storage ports and broker delivery.
  preconditions:
  - Docker and cached postgres:15-alpine and redis:7-alpine images are available.
  - Cached quay.io/minio/minio:RELEASE.2023-12-20T01-00-02Z is available for source publication.
  - Backend Python dependencies are installed.
  test_data:
    resources: Disposable databases and synthetic user/tenant/object references.
    execution: Controlled parser-result reference; no model or object provider is invoked.
  steps:
  - order: 1
    action: Submit run and knowledge-file requests twice; attempt inspection and cancellation from foreign users, tenants and knowledge/file/version contexts.
    expected: Each scope keeps its stable job ID; scopes are disjoint and foreign access is refused.
  - order: 2
    action: Publish each scoped job twice through Redis and consume with the local registry.
    expected: Each job executes once and its durable completed artifact remains inspectable in its original scope.
  - order: 3
    action: Advance a controlled clock past a lease, take over the job and submit the old completion.
    expected: The old attempt cannot complete; the new owner can publish its result.
  - order: 4
    action: Record an unknown publication outcome and advance beyond its lease.
    expected: Automatic ready selection excludes the job.
  - order: 5
    action: Read audit timestamps under a non-UTC PostgreSQL session and remove owned test resources.
    expected: UTC values and date filters remain correct; no test containers or anonymous volumes are retained.
  - order: 6
    action: Run the synchronous consumer and request stop after durable dispatch, before broker acknowledgement.
    expected: Completion remains inspectable, acknowledgement completes with a bounded cleanup budget and the queue is closed.
  - order: 7
    action: Renew an authorized attempt, advance beyond its original lease, then cancel it and run the next lease check.
    expected: Renewal prevents takeover after the original deadline; cancellation prevents subsequent renewal.
  - order: 8
    action: Submit, replay, inspect and cancel KB cleansing through the production service and owned storage composition, then revoke its account role and replace the file generation.
    expected: Current authorization succeeds, replay keeps the same job, cancellation is durable and another tenant is denied; role revocation and a stale generation both refuse execution without exposing credentials.
  - order: 9
    action: Publish source bytes to real MinIO, pin them with PostgreSQL CAS, reconcile a lost reply, then execute and replay the normal service upload helper using a real managed lane and production port composition.
    expected: The pinned source is authorized, content generation survives state updates, reconciliation does not rewrite bytes, normal helper replay preserves one charge and managed execution drains its workers.
  - order: 10
    action: Lose an actual object-write reply, age its durable intent and invoke production source discovery and per-tenant recovery composition.
    expected: The original object is pinned without reupload, the system actor is audited and upload completes after its retained-byte charge and quota check succeed.
  - order: 11
    action: Use the production combined record composition to create a ledger row and update its source lifecycle in one PostgreSQL transaction, then test rollback and cross-tenant inspection.
    expected: Commit persists both records with audit/revisions; a controlled failure rolls back both, and another tenant cannot inspect either.
  - order: 12
    action: Recover another actual lost-reply source after limiting the tenant to its previously committed source bytes.
    expected: The new source is charged and enters SOURCE_REVIEW without becoming UPLOADED; its retained object and charge remain inspectable and no write is repeated.
  - order: 13
    action: Read actual charges through production ledger facades, exercise a repeatable-read snapshot against a concurrent record update, then delete the fixture source after its sole writer has ended and release its charge.
    expected: Tenant/grouped totals and exact ownership queries are scoped, the snapshot keeps its original revision and maps concurrent update to Conflict, and charge release is audited and idempotent only after confirmed source absence.
  - order: 14
    action: Dispatch an authorized recovered KB source through production worker composition using actual record, broker and object ports with controlled text parsing.
    expected: The worker renews its authorized lease, publishes a checksummed tenant-partitioned artifact, commits completion before acknowledgement, and duplicate delivery does not parse again; another tenant cannot read the output.
  - order: 15
    action: Run the production discovery loop and fixed tenant queue factory with controlled parsing, stop after a completed dispatch, then lose a root after execution admission and expire its lease.
    expected: The loop closes discovery before execution and stops with durable completion; an execution-admitted job retains its persisted reconciliation obligation and a replacement root cannot enqueue or execute it after lease expiry.
  expected_results:
  - Idempotent admission preserves user/tenant and run or knowledge/file/version ownership.
  - Duplicate broker delivery does not repeat completed execution.
  - Lease takeover fences the previous attempt.
  - Recorded unknown outcomes are not blindly requeued.
  - Audit timestamps retain UTC semantics and disposable resources are reclaimed.
  - Consumer stop closes its queue after durable acknowledgement without a new dispatch.
  - Parent lease checks renew only an authorized current attempt and reject cancelled work.
  - Resource catalogs enforce current membership, account roles and pinned source generation.
  - Confirmed source binding and lost-reply reconciliation use real object/record ports without repeated writes.
  - Automatic discovery confirms aged source identity and finalizes upload only after accounting and quota checks.
  - Source lifecycle and storage ledger share atomic commit/rollback and tenant isolation.
  - Over-quota recovery retains its physical source charge and blocks successful publication pending cleanup.
  - Production ledger queries and release use scoped ports with snapshot consistency and audited idempotence.
  - Production KB worker composition preserves ownership, durable completion, deduplication and tenant-partitioned cleansing artifacts.
  - Production root discovery and tenant queue composition stop cleanly and fence crashed execution until reconciliation.
  forbidden_side_effects:
  - No application database, broker, credentials or containers are used.
  integration_boundary:
  - Real PostgreSQL, Redis and MinIO, storage ports, Management jobs and registry; real resource/DAC policy in step 8, source recovery/quota in steps 9-10/12 and record transactions/facades in steps 11/13; controlled run callbacks, intent age, rollback exception, clock and parser result elsewhere.
  observations:
  - Job identity, persisted artifact, execution count, rejected ownership, takeover and quarantine state.
  cleanup:
  - Delete only test-owned containers by their returned IDs including anonymous volumes.
