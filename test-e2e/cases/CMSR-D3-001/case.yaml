schema_version: '1.0'
stage: D3
module: CHAT-MESSAGE
case:
  case_id: CMSR-D3-001
  feature_id: CMSR-005
  requirement_ids:
  - CMSR-005
  business_rule_ids:
  - CMSR-RULE-013
  - CMSR-RULE-014
  - CMSR-RULE-015
  - CMSR-RULE-016
  title: Agent retry streams success and persists only committed output
  type: AGENT-IT
  priority: P0
  status: active
  automation: automated
  objective: Verify the full Nexent Agent, observer, SSE and persistence path with controlled provider failure.
  preconditions:
  - Local Nexent services and a disposable test conversation are available; the existing runner starts its container-reachable controlled HTTP fixture.
  test_data:
    profile: mock
    sequences:
    - partial transport failure then success
    - step-one protocol invalid then valid paused repair
  steps:
  - order: 1
    action: Start the Agent and fail its first response after a visible fragment.
    expected: Step 1 is emitted before begin and remains after rollback.
  - order: 2
    action: Pause the successful response after safe content.
    expected: The SSE consumer receives it before provider completion.
  - order: 3
    action: Complete execution and load history.
    expected: Only successful content, one executed code action and a genuine final-answer unit remain; the final-answer turn is separate from the repaired action.
  - order: 4
    action: Repeat with semantic repair and inspect database units.
    expected: Only corrected raw model output is stored; its fragments appeared before completion.
  - order: 5
    action: Return three truncated code responses with finish_reason length and inspect SSE and persisted assistant units.
    expected: All attempts roll back; no rejected code is parsed, executed or persisted.
  expected_results:
  - Step 1 precedes its model chunks and is stored once despite retry; the explicit final-answer turn may emit Step 2 without another code action.
  - Successful text is incremental.
  - Stored units contain no failed text.
  - History matches committed SSE.
  - Three truncated attempts roll back without executing or persisting the rejected action.
  forbidden_side_effects:
  - No failed-fragment persistence.
  - No duplicate tool execution.
  - No unexpected model request beyond the failed attempt, repaired action and separate final-answer turn.
  - No rejected truncated action execution or persistence.
  acceptance:
  - id: AC-ORDER
    description: Retry preserves Step 1 and emits live successful fragments before completion.
    steps: [1, 2]
    expected_results: [1, 2]
  - id: AC-PERSISTENCE
    description: Transport and semantic repair commit one action and retain only successful history.
    steps: [3, 4]
    expected_results: [3, 4]
    forbidden_side_effects: [1, 2, 3]
  - id: AC-REJECTION
    description: Exhausted truncated repairs never execute or persist a model action.
    steps: [5]
    expected_results: [5]
    forbidden_side_effects: [4]
  integration_boundary:
  - Agent runtime to provider fixture
  - Observer to SSE
  - SSE to conversation persistence
  observations:
  - Attempt control order
  - SSE arrival before provider release
  - persisted message units
  - sanitized repair lifecycle logs
  cleanup:
  - Delete the disposable conversation and provider fixture.
  execution:
    profiles:
    - name: mock
      required_services:
      - model-provider
