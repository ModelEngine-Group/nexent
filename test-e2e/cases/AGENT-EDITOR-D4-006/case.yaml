schema_version: '1.0'
stage: D4
module: AGENT-EDITOR
case:
  case_id: AGENT-EDITOR-D4-006
  feature_id: AGENT-EDITOR-WORKFLOWS
  requirement_ids:
  - AGENT-EDITOR-REQ-006
  business_rule_ids:
  - AGENT-EDITOR-RULE-006
  title: Load real Agent templates and recover from empty or failed catalogs
  type: E2E
  priority: P1
  status: active
  automation: automated
  objective: API names, descriptions and optional tags render without static medical
    templates; empty/error/retry states preserve blank creation and selecting a template
    sends its description exactly once.
  preconditions:
  - A running frontend is reachable; deterministic existing HTTP fixtures isolate
    Agent data, authorization and model/resource boundaries.
  test_data:
    profile: mock
    locale: zh
    viewport:
      width: 1920
      height: 1080
  steps:
  - order: 1
    action: Open creation with an empty Agent catalog.
    expected: Empty state is visible, static medical templates are absent and no write
      occurs.
  - order: 2
    action: Reopen with a failed catalog, then retry with two returned Agents.
    expected: Error and retry are visible; only returned Agent names/descriptions/tags
      render; missing tags do not become Medical.
  - order: 3
    action: Select a returned Agent, enter a unique name and create.
    expected: One real frontend creation request carries the trimmed name and selected
      API description and opens the editor.
  expected_results:
  - API names, descriptions and optional tags render without static medical templates;
    empty/error/retry states preserve blank creation and selecting a template sends
    its description exactly once.
  forbidden_side_effects:
  - No unrelated writes, publication or Agent/model execution; only explicitly requested
    creation/autosave writes are allowed.
  actor: Authorized Agent development user
  journey:
  - Open creation with an empty Agent catalog.
  - Reopen with a failed catalog, then retry with two returned Agents.
  - Select a returned Agent, enter a unique name and create.
  final_business_result:
  - API names, descriptions and optional tags render without static medical templates;
    empty/error/retry states preserve blank creation and selecting a template sends
    its description exactly once.
  failure_evidence:
  - Fixed Playwright journey assertions, sanitized request payloads and terminal audit.
  acceptance:
  - id: AC-01
    description: API names, descriptions and optional tags render without static medical
      templates; empty/error/retry states preserve blank creation and selecting a
      template sends its description exactly once.
    steps:
    - 1
    - 2
    - 3
    expected_results:
    - 1
    forbidden_side_effects:
    - 1
