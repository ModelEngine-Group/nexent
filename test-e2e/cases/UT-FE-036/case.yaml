    legacy_row: 349
  unit_boundary: 监控与通知UI
  inputs:
  - '- ${NEXENT_TEST_HOME}/config/environment.yaml（仅本地测试环境参数）'
  assertions:
  - 默认仅 SU/SPEED 可见。
  - SPEED 模式按 SPEED 判定。
  - 动态白名单覆盖默认值。
  - 未知或空角色不可见。
