schema_version: '1.0'
stage: D1
module: V5-BASELINE
case:
  case_id: UT-FE-036
  feature_id: F-153
  business_rule_ids:
  - F-153-RULE-01
  title: 监控 Dashboard 默认及动态角色白名单
  type: FE-COMP
  priority: P1
  status: active
  automation: automated
  objective: 验证监控 Dashboard 按用户实际角色及动态白名单判断可见性。
  preconditions:
  - 本地依赖/组件测试环境可运行；不要求外部模型服务在线。
  - 设置 NEXENT_TEST_HOME，目录不位于 Nexent Git 仓库内。
  - 当次 run_id 已生成，所有新建资源名称带 run_id；测试基线固定为 develop 当前批次锁定的产品提交；执行时另记录实际被测commit。
  - 所需本地资产存在且校验通过：${NEXENT_TEST_HOME}/config/environment.yaml（仅本地测试环境参数）
  test_data:
    legacy_asset_declaration: '- ${NEXENT_TEST_HOME}/config/environment.yaml（仅本地测试环境参数）'
  steps:
  - order: 1
    action: 在未配置白名单时检查混合大小写且带空格的 SU 和 TENANT_ADMIN。
    expected: 角色名归一化后，默认仅 SU 可见。
  - order: 2
    action: 配置带空格和小写的 TENANT_ADMIN 白名单，检查同时具有 USER 和 TENANT_ADMIN 的用户以及仅有 SU 的用户。
    expected: 任一实际角色匹配动态白名单即可访问，动态白名单覆盖默认值。
  - order: 3
    action: 使用遗留模式标志检查 SU、TENANT_ADMIN 和匿名用户，并在白名单中显式配置 SPEED。
    expected: 遗留模式标志不替换实际角色，已停用的 SPEED 无法获得访问权限。
  - order: 4
    action: 使用默认白名单检查未知角色、空白和缺失角色，并用空白名单检查 SU。
    expected: 未知、空白或缺失角色不可见，空白名单下 SU 也不可见。
  expected_results:
  - 角色名归一化后，默认仅 SU 可见。
  - 动态白名单覆盖默认值，支持匹配任一实际角色。
  - 遗留模式标志不授予权限，SPEED 即使出现在配置中也不可见。
  - 未知、空白和缺失角色不可见，显式空白名单拒绝 SU。
  forbidden_side_effects: []
  acceptance:
  - id: AC-DEFAULT
    description: 未配置白名单时，仅归一化后的 SU 可见。
    steps: [1]
    expected_results: [1]
  - id: AC-CONFIGURED
    description: 动态白名单替换默认值，并支持匹配用户的任一实际角色。
    steps: [2]
    expected_results: [2]
  - id: AC-RETIRED-SPEED
    description: 遗留模式标志及 SPEED 角色均不能授予访问权限。
    steps: [3]
    expected_results: [3]
  - id: AC-DENIED
    description: 拒绝未知、空白及缺失角色，并支持用显式空白名单禁用所有访问。
    steps: [4]
    expected_results: [4]
  source:
    legacy_workbook_sha256: aa4b32414d30f12b3b64e14236268145e556bd7cfc5d3eb8df80731608ebc022
    legacy_sheet: 02_测试用例基线
    legacy_row: 349
  unit_boundary: 监控与通知UI
  inputs:
  - '- ${NEXENT_TEST_HOME}/config/environment.yaml（仅本地测试环境参数）'
  assertions:
  - 角色名归一化后，默认仅 SU 可见。
  - 动态白名单覆盖默认值，多角色用户可通过任一匹配角色访问。
  - 已停用的 SPEED 与遗留模式标志均不授予权限。
  - 未知、空白和缺失角色不可见，显式空白名单拒绝 SU。
