  title: resume 参数：tab 切换/断连后从运行状态恢复｜核心流程
  type: AGENT-IT
  priority: P0
  status: active
  automation: automated
  objective: resume 参数：tab 切换/断连后从运行状态恢复｜核心流程
  preconditions:
  - Nexent 本地测试全栈已启动，health check 通过。
  - 设置 NEXENT_TEST_HOME，目录不位于 Nexent Git 仓库内。
  - 当次 run_id 已生成，所有新建资源名称带 run_id；测试基线固定为 develop 473b65268ba8cda3db53be735f97678e214c583b；执行时另记录实际被测commit。
  - 所需本地资产存在且校验通过：${NEXENT_TEST_HOME}/config/models.yaml；${NEXENT_TEST_HOME}/config/secrets.env
  - models.yaml 中本用例所需真实 Provider 已配置，secrets.env 中凭据有效，预检连通性通过。
  test_data:
    legacy_asset_declaration: '- ${NEXENT_TEST_HOME}/config/models.yaml

      - ${NEXENT_TEST_HOME}/config/secrets.env'
  steps:
  - order: 1
    action: 创建持久化会话，使用 is_debug=false 发起可产生多个 SSE 事件的 Agent 运行。
    expected: resume 仅针对持久化、已开始的会话运行；调试态或已完整消费的运行不作为恢复基线。
  - order: 2
    action: 读取到至少两个 data 事件后主动关闭客户端流，模拟 tab 切换或网络断连，不等待原流自然结束。
    expected: 断连后重连返回 resumed 流，或明确返回已完成状态；两种竞态均不得返回空 SSE。
  - order: 3
    action: 立即以同一 conversation_id 调用 /agent/run?resume=true。
    expected: 最终会话中存在 RESUME-42，消息单元无重复、无丢失、顺序连续。
  - order: 4
    action: 若运行仍在进行，断言返回 text/event-stream、出现 resumed 状态、事件序号连续且最终到达终态；若运行在重连竞态中已完成，断言返回 completed/stopped，并从会话持久化消息中读到 RESUME-42。
    expected: 最终会话中存在 RESUME-42，消息单元无重复、无丢失、顺序连续。
  - order: 5
    action: 确认没有重复用户消息、重复工具调用或跨会话事件。
    expected: 最终会话中存在 RESUME-42，消息单元无重复、无丢失、顺序连续。
  expected_results:
  - resume 仅针对持久化、已开始的会话运行；调试态或已完整消费的运行不作为恢复基线。
  - 断连后重连返回 resumed 流，或明确返回已完成状态；两种竞态均不得返回空 SSE。
  - 最终会话中存在 RESUME-42，消息单元无重复、无丢失、顺序连续。
  forbidden_side_effects: []
  source:
    legacy_workbook_sha256: aa4b32414d30f12b3b64e14236268145e556bd7cfc5d3eb8df80731608ebc022
    legacy_sheet: 02_测试用例基线
    legacy_row: 106
  integration_boundary:
  - REAL_REQUIRED：使用 ${NEXENT_TEST_HOME}/config/models.yaml 中配置的真实模型/向量/Rerank/语音/多模态能力；Mock 仅用于不可稳定制造的 5xx/超时/畸形响应故障注入。
  observations:
  - resume 仅针对持久化、已开始的会话运行；调试态或已完整消费的运行不作为恢复基线。
  - 断连后重连返回 resumed 流，或明确返回已完成状态；两种竞态均不得返回空 SSE。
  - 最终会话中存在 RESUME-42，消息单元无重复、无丢失、顺序连续。
  cleanup:
  - JUnit/XML、完整Agent run_id、stream事件摘要、tool/retrieval trace、model snapshot、Telemetry span（脱敏）。
