schema_version: '1.0'
stage: D1
module: V5-BASELINE
case:
  case_id: UT-BE-023
  feature_id: V5-UT-BE-023
  business_rule_ids:
  - V5-UT-BE-023-RULE-01
  title: config diff/merge 与无变化 no-op
  type: BE-UT
  priority: P1
  status: active
  automation: automated
  objective: config diff/merge 与无变化 no-op
  preconditions:
  - 本地依赖/组件测试环境可运行；不要求外部模型服务在线。
  - 设置 NEXENT_TEST_HOME，目录不位于 Nexent Git 仓库内。
  - 当次 run_id 已生成，所有新建资源名称带 run_id；测试基线固定为 develop 当前批次锁定的产品提交；执行时另记录实际被测commit。
  - 所需本地资产存在且校验通过：${NEXENT_TEST_HOME}/config/environment.yaml（仅本地测试环境参数）
  test_data:
    legacy_asset_declaration: '- ${NEXENT_TEST_HOME}/config/environment.yaml（仅本地测试环境参数）'
  steps:
  - order: 1
    action: 在本地工作区导入 backend/services/config_sync_service.py 的 save_config_impl、build_app_config 与 LEGACY_APP_CONFIG_KEYS，mock
      tenant_config_manager 的 load_config/set_single_config/delete_single_config/update_single_config/get_app_config；测试代码不得读取生产凭据。
    expected: save_config_impl 对 LEGACY_APP_CONFIG_KEYS（APP_NAME/APP_DESCRIPTION/NAME/DESCRIPTION）对应键跳过处理，既不写入 tenant_config
      也不进入 env_config。
  - order: 2
    action: '构造含 app 配置的最小 Config 对象（如 {"app": {"tenantName": "t", "defaultGroupId": "g", "name": "legacy", "description":
      "legacy"}}），其中 name/description/appName/appDescription 经 get_env_key 转换后落入 LEGACY_APP_CONFIG_KEYS。'
    expected: 非 legacy 键 diff/merge 语义符合契约：值相等仅 update_single_config（no-op），新值为空串仅 delete_single_config，值不同先 delete 后 set，新键仅
      set_single_config。
  - order: 3
    action: 调用 await save_config_impl(config, tenant_id, user_id)，记录对 tenant_config_manager 各方法的调用序列与 env_config 结果。
    expected: build_app_config 返回结果不含 name/description（及 appName/appDescription），仍含 tenantName/defaultGroupId/icon/datamateUrl/modelEngineEnabled。
  - order: 4
    action: 断言 LEGACY_APP_CONFIG_KEYS（APP_NAME/APP_DESCRIPTION/NAME/DESCRIPTION）对应的 env_key 不进入 env_config，且不触发 set_single_config/delete_single_config/update_single_config。
    expected: 重复调用幂等，无重复副作用、无半写入；异常路径返回明确错误，不吞异常伪成功，无跨租户泄露。
  - order: 5
    action: 对非 legacy 键覆盖 diff/merge 各分支：键已存在且值相等 → 仅调用 update_single_config（no-op 触达，不 delete+set）；键已存在且新值为空串 → 仅调用 delete_single_config；键已存在且值不同
      → 先 delete_single_config 再 set_single_config；键不存在 → 仅调用 set_single_config。
    expected: 日志/Trace/报告中不出现明文 API Key/Token/Password/模型密钥。
  - order: 6
    action: 对 build_app_config(language, tenant_id)：断言返回 dict 含 tenantName/defaultGroupId/icon/datamateUrl/modelEngineEnabled
      键，且不含 name/description（及 appName/appDescription）键。
    expected: 日志/Trace/报告中不出现明文 API Key/Token/Password/模型密钥。
  - order: 7
    action: 连续两次调用 save_config_impl，验证幂等：无重复写入、无半写入、无额外副作用。
    expected: 日志/Trace/报告中不出现明文 API Key/Token/Password/模型密钥。
  - order: 8
    action: 断言日志中不输出 API Key/Token/用户密码/模型密钥；测试结束后释放 mock 与临时对象，确保可重复执行。
    expected: 日志/Trace/报告中不出现明文 API Key/Token/Password/模型密钥。
  expected_results:
  - save_config_impl 对 LEGACY_APP_CONFIG_KEYS（APP_NAME/APP_DESCRIPTION/NAME/DESCRIPTION）对应键跳过处理，既不写入 tenant_config 也不进入 env_config。
  - 非 legacy 键 diff/merge 语义符合契约：值相等仅 update_single_config（no-op），新值为空串仅 delete_single_config，值不同先 delete 后 set，新键仅 set_single_config。
  - build_app_config 返回结果不含 name/description（及 appName/appDescription），仍含 tenantName/defaultGroupId/icon/datamateUrl/modelEngineEnabled。
  - 重复调用幂等，无重复副作用、无半写入；异常路径返回明确错误，不吞异常伪成功，无跨租户泄露。
  - 日志/Trace/报告中不出现明文 API Key/Token/Password/模型密钥。
  forbidden_side_effects: []
  source:
    legacy_workbook_sha256: aa4b32414d30f12b3b64e14236268145e556bd7cfc5d3eb8df80731608ebc022
    legacy_sheet: 02_测试用例基线
    legacy_row: 370
  unit_boundary: 配置同步
  inputs:
  - '- ${NEXENT_TEST_HOME}/config/environment.yaml（仅本地测试环境参数）'
  assertions:
  - save_config_impl 对 LEGACY_APP_CONFIG_KEYS（APP_NAME/APP_DESCRIPTION/NAME/DESCRIPTION）对应键跳过处理，既不写入 tenant_config 也不进入 env_config。
  - 非 legacy 键 diff/merge 语义符合契约：值相等仅 update_single_config（no-op），新值为空串仅 delete_single_config，值不同先 delete 后 set，新键仅 set_single_config。
  - build_app_config 返回结果不含 name/description（及 appName/appDescription），仍含 tenantName/defaultGroupId/icon/datamateUrl/modelEngineEnabled。
  - 重复调用幂等，无重复副作用、无半写入；异常路径返回明确错误，不吞异常伪成功，无跨租户泄露。
  - 日志/Trace/报告中不出现明文 API Key/Token/Password/模型密钥。
