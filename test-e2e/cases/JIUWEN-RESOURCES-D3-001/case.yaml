  test_data:
    profile: mock
  steps:
  - order: 1
    action: Execute the resource scenario through the actual factory and controlled
      protocol endpoints.
    expected: Native and text protocols execute authorized local/MCP/Skills once,
      inject hidden caller identity and return actual observations.
  - order: 2
    action: Execute the resource scenario through the actual factory and controlled
      protocol endpoints.
    expected: Follow-up does not replay effects; owned tools, sessions and managed
      workers are reclaimed.
  expected_results:
  - Native and text protocols execute authorized local/MCP/Skills once, inject hidden
