  - 三类超时参数 <=0 时构造即抛 ValueError，错误消息与契约文本一致。
  - 工具/关闭/连接任一超时触发 request_close，manager.cancel 的 mark_stuck_on_timeout 与 reason 参数符合契约。
  - 并发关闭下 _call_tool 抛 RuntimeError("MCP session is closing")，不出现死锁或半关闭。
  - register_closer/unregister_closer 成对调用，scope_token 正确绑定与解绑，无资源泄漏。
  - 日志、Trace、断言不出现明文 API Key/Token/Password/模型密钥。
