  - 无本地 fixture；租户配置通过桩/mock 注入（见详细测试步骤），不读取生产凭据。
  assertions:
  - 场景A：返回 CapacityReservePolicy，compaction_trigger_ratio == 0.8，compaction_trigger_ratio_source == "tenant_config"。
  - 场景B：返回 CapacityReservePolicy，compaction_trigger_ratio == 0.9，compaction_trigger_ratio_source == "legacy_payload"。
  - 场景C：返回 compaction_trigger_ratio == 0.8 且 source == "tenant_config"，legacy 值被忽略。
  - 场景D：返回默认 CapacityReservePolicy()，使用代码默认而非任何配置值。
  - 场景E：抛出 InvalidReservePolicy，异常消息包含 "context.compaction_trigger_ratio must be a decimal in (0, 1]"；不得吞异常返回伪成功。
  - 全程无未处理异常、无真实数据库/外部服务访问，日志不输出明文凭据。
