  - 功能结果与代码契约一致，测试过程无未处理异常。
  - 列表/筛选/状态徽标/启停/删除的状态迁移与 providerService 调用次数、参数及返回值映射一致。
  - 对话框按 config_schema 动态渲染字段；secret 编辑保留掩码且未修改时不覆盖原值，修改后提交新值。
  - 插件为空时“新增”按钮 disabled，有插件时可用；保存失败返回明确错误提示且不出现半写入或重复提交。
  - 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
