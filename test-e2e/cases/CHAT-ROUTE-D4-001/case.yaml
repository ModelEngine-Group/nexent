schema_version: '1.0'
stage: D4
module: CHAT-SIDEBAR
case:
  case_id: CHAT-ROUTE-D4-001
  feature_id: CHAT-SIDEBAR
  requirement_ids:
  - CHAT-ROUTE-SYNC-20261020
  - WB-HISTORY-DETAIL-20261022
  business_rule_ids:
  - CHAT-SIDEBAR-RULE-005
  title: Workbench selection synchronizes URL and document reload target
  type: E2E
  priority: P1
  status: active
  automation: automated
  objective: Explicit saved and new conversation selections update the address without replacing the live document or losing in-memory drafts.
  preconditions:
  - Local frontend and controlled authenticated APIs expose two owned saved Workbench histories.
  test_data:
    profile: mock
    histories:
    - saved-a
    - saved-c
  steps:
  - order: 1
    action: Open a deep link for A with an unrelated query and hash, type a draft, select C in the sidebar, then return to A.
    expected: The address matches each selection, unrelated query and hash remain, document identity is unchanged and the A draft returns.
  - order: 2
    action: Select C again and reload the entire document.
    expected: The URL and selected sidebar item still identify C; histories load normally.
  - order: 3
    action: Select a new conversation from C, then reload the document.
    expected: Both conversation_id and legacy thread_id are absent; the saved C selection is not restored.
  expected_results:
  - Saved selection and URL agree without document navigation or losing the in-memory draft during switching.
  - Document reload restores the explicitly selected saved history.
  - New conversation clears stale saved identity and reload remains on the landing view.
  - Saved history entry, re-entry and reload each issue exactly one detail GET; repeated active selection issues none.
  forbidden_side_effects:
  - No generation, deletion, pin writes or persisted draft changes; no cross-conversation message writes.
  observations:
  - Browser URL, selected sidebar item, composer value, document identity and controlled request log.
  cleanup:
  - Dispose the isolated browser context and controlled fixtures.
  execution:
    profiles:
    - name: mock
      required_services: []
  acceptance:
  - id: AC-01
    description: Saved selection updates URL while preserving document and per-thread draft.
    steps: [1]
    expected_results: [1]
    forbidden_side_effects: [1]
  - id: AC-02
    description: Reload restores the selected saved conversation.
    steps: [2]
    expected_results: [2]
    forbidden_side_effects: [1]
  - id: AC-03
    description: New conversation clears stale URL identity and survives reload as a landing view.
    steps: [3]
    expected_results: [3]
    forbidden_side_effects: [1]
  - id: AC-04
    description: Entry, re-entry and reload share one detail request without repeated active-selection reads.
    steps: [1, 2]
    expected_results: [4]
    forbidden_side_effects: [1]
  actor: Authenticated Workbench user
  journey:
  - Open A
  - Select C
  - Return to A
  - Reload C
  - Open and reload new conversation
  final_business_result:
  - The address consistently identifies the selected saved conversation and refresh restores that history.
  failure_evidence:
  - Browser trace, URL and assertion screenshot.
