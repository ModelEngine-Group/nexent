  - mark_document_delete_requested 成功时返回 True 且通过 client.set（非 setex，无 TTL）写入；空 file_id 或 set 异常时返回 False 且不抛异常。
  - is_document_delete_requested 对 exists 命中/未命中分别返回 True/False；空 file_id 返回 False；Redis 异常 re-raise 以支持调用方回退 PG。
  - clear_document_delete_fence 返回被删除键数量；空 file_id 或 delete 异常时返回 0 且不抛异常。
  - mark→is→clear→is 串联依次为 True→True→(删除数)→False，栅栏不会被无 TTL 过期或重复写入破坏。
  - 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
