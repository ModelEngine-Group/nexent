  contract:
    protocol: HTTP API
    request_expectations:
    - 从 config/users.yaml 读取隔离测试账号并登录本地 Nexent，通过实际 API 创建带 RunID 后缀的测试知识库，记录 index_name；密码/Token 仅从 secrets.env 注入。
    - 上传 assets/documents/ 中的固定测试文件到该知识库并等待处理完成，记录该文件的持久化 file_id 与 object_name（object path），并确认 ES 中存在对应 chunk。
    - 调用 DELETE /indices/{index_name}/documents?file_id=<file_id>&scope=full（不传 path_or_url），保存响应状态码、message 与 deletion_pending
      字段。
    - 重新 GET 文件列表/详情并查询该 file_id 对应 lifecycle 记录与 ES，确认删除按持久化 file_id 定位：目标 file_id 记录进入终态删除、对应 chunk 与 MinIO 源对象被移除，未被同 object_name
      的旧记录干扰。
    - 构造 lifecycle 记录存在但无 object_name（无 storage object）的 file_id，调用 DELETE /indices/{index_name}/documents?file_id=<file_id>&scope=source_only，断言返回
      400 且 detail 精确为 "A file without a storage object can only use full deletion"。
    - 对同一无 object_name 的 file_id 改用 scope=full，断言走无对象删除分支返回终态成功（message 非 deletion_pending 重试态）。
    - 不传 file_id 且不传 path_or_url 调用删除接口，断言返回 400 且 detail 为 "Either path_or_url or file_id is required"。
    - 使用无知识库编辑权限的另一租户用户重放删除请求，断言 401/403 且目标数据无越权删除副作用。
    - 清理本次创建的测试知识库、文件与 lifecycle 记录，确保可重复执行。
    response_expectations:
    - 功能结果与代码契约一致，测试过程无未处理异常。
    - 传 file_id 时按持久化 ID 定位：目标 file_id 的 lifecycle 记录进入终态删除，对应 ES chunk 与 MinIO 源对象被移除，响应 message 为终态成功（非 deletion_pending
      重试）。
    - lifecycle 记录无 object_name 且 scope=source_only 返回 400，detail 精确为 "A file without a storage object can only use full deletion"。
    - 同一无 object_name 记录 scope=full 走 delete_lifecycle_record_without_object 分支，返回终态成功。
    - 缺失 file_id 与 path_or_url 返回 400，detail 为 "Either path_or_url or file_id is required"。
    - 无编辑权限用户返回 401/403，不产生半写入、重复副作用或跨租户泄露。
    - 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
