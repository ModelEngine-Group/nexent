  steps:
  - order: 1
    action: 加载内置 model_catalog.json。
    expected: 合法目录稳定加载。
  - order: 2
    action: 校验 provider/model/profile 唯一性与必填字段。
    expected: reasoning 字段和 profile 可序列化。
  - order: 3
    action: 读取 inference field spec，覆盖 reasoning 选项和默认值。
    expected: '非法目录在启动/加载阶段给出定位明确的错误，不静默丢字段。

      模型响应任何层级均不泄漏 api_key；嵌套 custom JSON 保真。'
  - order: 4
    action: '注入重复、未知 provider、非法类型和缺字段目录。

      473b6526：构造嵌套 __custom__，验证合法 JSON 保留、非有限数/集合被过滤；递归清洗 HTTP 模型响应中的 api_key 且不修改内部源对象。'
    expected: '非法目录在启动/加载阶段给出定位明确的错误，不静默丢字段。

      模型响应任何层级均不泄漏 api_key；嵌套 custom JSON 保真。'
  expected_results:
  - 合法目录稳定加载。
  - reasoning 字段和 profile 可序列化。
  - '非法目录在启动/加载阶段给出定位明确的错误，不静默丢字段。

