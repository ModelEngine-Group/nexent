      required_services: []
  integration_boundary:
  - 真实HTTP/SSE Provider到ModelService/OpenAIModel及LLMTokenTracker
  - OTel模型Span到LocalTrajectoryProcessor和本地OTLP JSONL
  observations:
  - Provider请求数与原回答
  - 模型TTFT、首输出来源、事件、父子Span和持久化值
  - 未知值及资源清理
  cleanup:
  - 关闭自建客户端、HTTP服务并join线程；停止写线程并删除独占临时目录。
