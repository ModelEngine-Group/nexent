notes: >-
  Self-contained preparation requires an opted-in isolated Kubernetes cluster
  and an unused dynamic RWX StorageClass. The case creates its namespace,
  databases, volumes and model fixture. After a real completed chat, it
  captures the terminal execution and persisted history across each idle
  transition. Separate releases intercept the observed bootstrap result and
  either return a failure or terminate the uniquely labeled deployment lock
  session. A suspended bootstrap Job exercises prior-writer rejection. Cleanup
  uses the namespace UID and verifies storage reclamation.
