implementations:
- framework: pytest
  file: test.py
  selector: RUNTIME-OFFLINE-DEPLOY-D5-001
timeout_seconds: 7200
acceptance_bindings:
  AC-P1-001:
  - test_fixed_replica_chart_boundaries
  - test_offline_replica_sequence
  AC-P1-002:
  - test_offline_replica_sequence
  - test_activation_waits_for_bootstrap_and_deploy_lock
  - test_unfinished_bootstrap_job_does_not_pause_the_running_release
  AC-P1-003:
  - test_dynamic_pvc_uninstall_retains_then_deletes_claims
preparation:
  families: []
  anchors: false
