schema_version: '1.0'
stage: D5
module: RUNTIME-SCALING
case:
  case_id: RUNTIME-OFFLINE-DEPLOY-D5-001
  feature_id: RUNTIME-REPLICAS
  requirement_ids:
  - RUNTIME-FIXED-REPLICAS-20261105
  - RUNTIME-UNIFY-EXECUTION-20261125
  business_rule_ids:
  - RUNTIME-REPLICAS-RULE-01
  - RUNTIME-REPLICAS-RULE-02
  title: 无在途业务时停机调整固定副本，初始化失败或失锁保持停止
  type: DEPLOYMENT
  priority: P0
  status: blocked
  automation: automated
  objective: 验证无业务窗口的真实停启顺序、失败边界和恢复。
  preconditions:
  - 测试拥有独立 Kubernetes namespace、专属数据库与 Redis 数据域，以及支持跨节点使用的测试 RWX 卷。
  - 初始固定副本 1，具有一条已终态的真实会话。每次调整前该数据域没有在途业务执行。
  - 镜像、Helm、集群连接和机器本地数据通过外部配置提供。
  test_data:
    replica_sequence: [1, 3, 2, 1]
    invalid_replica_counts: ['0', '-1', '1.5', invalid]
    sentinel: 调整前实际提交的会话消息和 Agent 执行终态。
    preparation: 机器本地 runtime-scaling-k8s.yaml 指定专用集群及 RWX StorageClass。
  steps:
  - order: 1
    action: 渲染默认值、内部暂停和非法 replicaCount，观察首次部署的 1 副本。
    expected: 合法默认目标为 1；内部暂停为 0；0、负数、小数和无效配置作为目标副本时被拒绝。
  - order: 2
    action: 提交真实聊天并等待完成，然后按 1→3→2→1 运行停启部署，在每次激活前暂停 Helm 调用并检查 Kubernetes 状态。
    expected: 所有旧业务 Pod 退出并完成系统初始化后，目标固定副本 Ready，已保存消息和执行终态保持，运行期间无自动控制器。
  - order: 3
    action: 在独占部署中分别令本次系统初始化结果失败，或在成功后、激活前终止本次 PostgreSQL 部署持锁连接，然后重新部署。
    expected: 两种失败均保持业务副本为 0，恢复部署可启动目标副本，旧执行不会重放。
  - order: 4
    action: 在独占 release 保留尚未创建 Pod 的同 release 未终态 bootstrap Job，再提交一轮扩副本部署。
    expected: 拒绝启动新的部署周期，业务 Pod UID、旧 Job UID 和目标数保持。
  expected_results:
  - 合法固定副本调整等待旧业务 Pod 退出，启动目标数量并 Ready。
  - 初始化失败、部署失锁和未终态的旧 bootstrap 均阻止其后激活。
  - 停启保留已完成数据，测试环境清理完成。
  forbidden_side_effects:
  - 旧业务 Pod 未退出、系统初始化失败或无法验证部署锁时激活新业务。
  - 日常部署创建 Runtime 维护 Job，重放已完成执行、改写会话终态或影响测试外资源。
  - 创建 HPA/KEDA。
  acceptance:
  - id: AC-P1-001
    description: 核对固定副本默认值及实际停启序列。
    steps: [1, 2]
    expected_results: [1, 3]
    forbidden_side_effects: [2, 3]
  - id: AC-P1-002
    description: 初始化及锁门槛、失败后恢复和旧写入程序隔离。
    steps: [2, 3, 4]
    expected_results: [2, 3]
    forbidden_side_effects: [1, 2]
  tags: [phase-1]
  source:
    spec_path: nexent-doc/docs/Developing/runtime-replica-scaling/changes/runtime-unify-agent-execution/proposal.md
    blocked_reason: 必须在隔离 Kubernetes 和真实 RWX 上验证完整停启、受控故障及清理。
    primary_domain: deployment
    preparation_plan: 固定 kubeconfig 上下文和 UID，验证集群 owner 启用条件，使用专用动态 RWX StorageClass、带运行标识的独占 namespace、数据域和受控模型协议服务。
    cleanup_plan: 只删除本次 UID 归属的 namespace，等待自建 namespace 和专用 StorageClass 对应的 PV 消失。
  risk_type: DEPLOYMENT
  risk: 尚未完成初始化或失去部署锁时激活，或旧 Pod 与新业务重叠。
  condition:
  - 真实部署脚本与无在途业务的停启转换，依赖和测试数据域独占。
  metrics:
  - 各场景的旧 Pod UID、激活前业务副本数、初始化结果、激活命令与最终 Ready 副本数。
  - 会话终态收据、HPA/KEDA 数量及资源清理记录。
  thresholds:
  - 激活前旧业务 Pod 数为 0，Ready 后副本数等于目标数。
  - 初始化失败或激活前失去部署锁时，激活次数为 0。
  - 日常停启新增 Runtime 维护 Job、自动伸缩对象、既有终态变更和资源泄漏均为 0。
  recovery_expectations:
  - 解除受控故障后再独立发起一轮无业务部署，由产品流程启动目标固定副本。
