  thresholds:
  - 未登录401、无新URL403；DEV仅可读本人且无审核资格；ADMIN可读原有范围内本人及他人；范围外记录404，无操作资格decision403；本人不是新增拒绝条件。
  - Agent/Skill及MCP普通管理员保持原租户范围，MCP原超级管理员保持原授权范围；无审核资格才按实际提交人等值过滤；未知提交人不影响有审核资格者原本的读取权限。
