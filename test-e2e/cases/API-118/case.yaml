case:
  case_id: API-118
  feature_id: F-123
  business_rule_ids:
  - F-123-RULE-01
  title: memory config load、external provider top_k、dreaming switch、disable agent/user-agent｜核心流程
  type: INTEGRATION
  priority: P1
  status: active
  automation: automated
  objective: memory config load、external provider top_k、dreaming switch、disable agent/user-agent｜核心流程
  preconditions:
  - Nexent 本地测试全栈已启动，health check 通过。
  - 设置 NEXENT_TEST_HOME，目录不位于 Nexent Git 仓库内。
  - 当次 run_id 已生成，所有新建资源名称带 run_id；测试基线固定为 develop 当前批次锁定的产品提交；执行时另记录实际被测commit。
  - 所需本地资产存在且校验通过：${NEXENT_TEST_HOME}/config/models.yaml；${NEXENT_TEST_HOME}/config/secrets.env；${NEXENT_TEST_HOME}/config/users.yaml
  - models.yaml 中本用例所需真实 Provider 已配置，secrets.env 中凭据有效，预检连通性通过。
  test_data:
    legacy_asset_declaration: '- ${NEXENT_TEST_HOME}/config/models.yaml

      - ${NEXENT_TEST_HOME}/config/secrets.env

      - ${NEXENT_TEST_HOME}/config/users.yaml'
  steps:
  - order: 1
    action: 准备固定测试用户、测试 Agent 与真实 LLM；清空该测试命名空间已有记忆与记忆配置，保证用例初始状态可控。
    expected: 功能结果与代码契约一致，测试过程无未处理异常。
  - order: 2
    action: 通过实际 API 配置用户级/Agent级记忆策略、开关和阈值（memory switch、dreaming switch、agent share、disable agent/user-agent）。
    expected: external_provider_top_k 配置读写生效：POST /memory/config/set 在 1–100 内取值返回 200 且 success=true；GET /memory/config/load
      读回值与写入值一致（持久化）；build_memory_context 的 user_config.external_provider_top_k 与已配置值一致。
  - order: 3
    action: 通过 POST /memory/config/set 写入 external_provider_top_k 配置（key=external_provider_top_k），在 1–100 内取代表值 1、50、100 分别写入，断言每次返回
      200 且 success=true。
    expected: external_provider_top_k 非法值返回明确错误：非整数返回 406 NOT_ACCEPTABLE，越界（<1 或 >100）返回 400 BAD_REQUEST，且不产生半写入或覆盖旧值。
  - order: 4
    action: 通过 GET /memory/config/load 读回配置，断言 external_provider_top_k 与最后一次写入值（100）一致，确认已持久化到配置存储且用户间隔离。
    expected: 关键状态在 API 返回、数据库/存储和后续读取中保持一致。
  - order: 5
    action: 通过服务接口 build_memory_context(user_id, tenant_id, agent_id) 构造记忆上下文，断言 user_config.external_provider_top_k 与已写入值一致（配置在构建上下文时生效）。
    expected: 失败路径返回明确错误，不出现半写入、重复副作用或跨租户泄露。
  - order: 6
    action: 校验非法输入：非整数（如 abc）返回 406 NOT_ACCEPTABLE；越界值 0、101 返回 400 BAD_REQUEST；非法写入不覆盖此前有效值。
    expected: 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
  - order: 7
    action: 按“memory config load、external provider top_k、dreaming switch、disable agent/user-agent｜核心流程”执行一到多轮真实对话，输入包含唯一记忆
      marker（如 MEM-92831）。
    expected: 真实模型调用成功，stream/Agent run 正常结束；自然语言只做稳定关键词/结构/工具调用断言。
  - order: 8
    action: 等待记忆写入/总结任务完成，查询 memory record/version/status 并检查作用域。
    expected: 真实模型调用成功，stream/Agent run 正常结束；自然语言只做稳定关键词/结构/工具调用断言。
  - order: 9
    action: 新建会话再次提问，确认 Runtime context 能取回正确 marker，且其他用户/Agent 不可见。
    expected: 真实模型调用成功，stream/Agent run 正常结束；自然语言只做稳定关键词/结构/工具调用断言。
  - order: 10
    action: Dreaming/长期记忆类检查版本、合并/总结结果和禁用后的行为变化。
    expected: 真实模型调用成功，stream/Agent run 正常结束；自然语言只做稳定关键词/结构/工具调用断言。
  - order: 11
    action: 对删除/禁用操作再次运行对话，确认旧记忆不再进入上下文。
    expected: 真实模型调用成功，stream/Agent run 正常结束；自然语言只做稳定关键词/结构/工具调用断言。
  - order: 12
    action: 保存脱敏 trace 后清理测试记忆与本次写入的 external_provider_top_k 配置。
    expected: 真实模型调用成功，stream/Agent run 正常结束；自然语言只做稳定关键词/结构/工具调用断言。
  expected_results:
  - 功能结果与代码契约一致，测试过程无未处理异常。
  - external_provider_top_k 配置读写生效：POST /memory/config/set 在 1–100 内取值返回 200 且 success=true；GET /memory/config/load 读回值与写入值一致（持久化）；build_memory_context
    的 user_config.external_provider_top_k 与已配置值一致。
  - external_provider_top_k 非法值返回明确错误：非整数返回 406 NOT_ACCEPTABLE，越界（<1 或 >100）返回 400 BAD_REQUEST，且不产生半写入或覆盖旧值。
  - 关键状态在 API 返回、数据库/存储和后续读取中保持一致。
  - 失败路径返回明确错误，不出现半写入、重复副作用或跨租户泄露。
  - 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
  - 真实模型调用成功，stream/Agent run 正常结束；自然语言只做稳定关键词/结构/工具调用断言。
