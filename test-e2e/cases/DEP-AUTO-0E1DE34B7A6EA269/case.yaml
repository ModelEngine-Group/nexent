schema_version: '1.0'
stage: D5
module: V5-BASELINE
case:
  case_id: DEP-AUTO-0E1DE34B7A6EA269
  feature_id: V5-DEP-AUTO-0E1DE34B7A6EA269
  business_rule_ids:
  - V5-DEP-AUTO-0E1DE34B7A6EA269-RULE-01
  title: K8s 基础设施 chart(nexent-infrastructure)安装、ES API Key 初始化、validate.yaml 校验与 uninstall.sh 卸载清理的完整生命周期（含基础设施卸载守卫与本地 PV
    安全清理）
  type: DEPLOYMENT
  priority: P1
  status: active
  automation: automated
  objective: '1. 依赖顺序破坏：nexent 应用 release 仍存在时误卸载基础设施，导致应用运行中断或产生孤儿/半卸载状态。

    2. 敏感信息泄露：ES API Key 以明文或宽松权限落盘，泄露后可被用于越权访问 Elasticsearch。

    3. 数据误删：卸载清理越过白名单删除非 nexent 目录，或误删仍在使用中的本地 PV 数据。

    4. 配置失配：持久化 mode、副本数等非法组合绕过校验，造成单副本数据不一致或存储绑定失败。'
  preconditions:
  - '- deploy/k8s/deploy.sh

    - deploy/k8s/uninstall.sh

    - deploy/k8s/init-elasticsearch.sh

    - deploy/k8s/helm/nexent-infrastructure（Chart 与 templates/validate.yaml）

    - deploy/env/.env（仅测试用非生产凭据）

    - 本地 Kubernetes 集群（kubectl + helm 可用，测试 namespace nexent 可清理）'
  test_data:
    legacy_asset_declaration: '- deploy/k8s/deploy.sh

      - deploy/k8s/uninstall.sh

      - deploy/k8s/init-elasticsearch.sh

      - deploy/k8s/helm/nexent-infrastructure（Chart 与 templates/validate.yaml）

      - deploy/env/.env（仅测试用非生产凭据）

      - 本地 Kubernetes 集群（kubectl + helm 可用，测试 namespace nexent 可清理）'
  steps:
  - order: 1
    action: 前置：确认本地 K8s 集群可连接、helm/kubectl 可用；确认 deploy/k8s/deploy.sh、uninstall.sh、init-elasticsearch.sh 与 deploy/env/.env
      存在，deploy.options 已配置 persistenceMode=local；清理残留 namespace nexent。
    expected: 基础设施四组件全部 Ready，helm 仅存在 nexent-infrastructure release，基础设施资源未并入 nexent 应用 release。
  - order: 2
    action: 基础设施安装：以 bash deploy/k8s/deploy.sh --release-scope infrastructure 部署，等待 nexent-elasticsearch/nexent-postgresql/nexent-redis/nexent-minio
      四个 deployment 全部 Ready；helm ls -n nexent 仅存在 nexent-infrastructure release，且不存在 nexent 应用 release（legacy 单 release 迁移被
      reject_legacy_single_release 拒绝）。
    expected: validate.yaml 对单副本、持久化 mode、dynamic 缺 storageClassName、existing 缺 existingClaim 的非法组合均在渲染/安装阶段 fail 拒绝。
  - order: 3
    action: validate.yaml 校验：构造非法 values（replicaCount>1、persistence.mode=invalid、dynamic 模式缺 storageClassName、existing 模式缺
      existingClaim）执行 helm template/install，应被 fail 拒绝；恢复合法 values 后重新渲染通过。
    expected: init-elasticsearch.sh 生成的 ELASTICSEARCH_API_KEY 通过 /_security/_authenticate 200 校验，输出文件权限 600，日志与报告中不出现明文 key。
  - order: 4
    action: ES 初始化：以 --release-scope nexent 部署应用 release 触发 init-elasticsearch.sh；确认其从 nexent-infrastructure-secrets 读取 ELASTIC_PASSWORD，等待
      ES 集群健康（green/yellow，有界重试）后生成 ELASTICSEARCH_API_KEY，并用 /_security/_authenticate 返回 200 校验 key 有效；确认输出文件权限为 600（umask
      077）且同步回 .env 的值与生成 key 一致。
    expected: 应用 release 存在时卸载 infrastructure 被守卫拒绝，不产生孤儿基础设施状态或应用依赖缺失。
  - order: 5
    action: 卸载守卫：在 nexent 应用 release 仍存在时执行 bash uninstall.sh --release-scope infrastructure，应被 guard_infrastructure_uninstall
      拒绝并返回非零，基础设施资源保持不变。
    expected: 顺序卸载后 helm release 与基础设施 deployment/secret 全部清除；本地 PV 仅白名单路径被删除，不安全路径被拒绝，dynamic/existing 模式不误删本地数据。
  - order: 6
    action: 顺序卸载：先卸载 nexent 应用 release（--release-scope nexent 或 all），再卸载 nexent-infrastructure release；确认 helm ls -n nexent
      中两个 release 均消失，kubectl get deploy -n nexent 不再包含 nexent-elasticsearch 等基础设施 deployment。
    expected: 重复卸载幂等返回 0，非法 scope 及非 all 下 delete-namespace 均被拒绝，脚本退出码与预期一致。
  - order: 7
    action: 本地 PV 安全清理：以 delete-all（--delete-data true --delete-local-data true）卸载时仅删除 /var/lib/nexent 与 /var/lib/nexent-data/nexent-*
      白名单路径；对白名单外路径应输出拒绝删除信息并返回非零；persistenceMode 为 dynamic/existing 时应跳过本地 PV 目录清理。
    expected: 重复卸载幂等返回 0，非法 scope 及非 all 下 delete-namespace 均被拒绝，脚本退出码与预期一致。
  - order: 8
    action: 幂等与作用域校验：重复执行 uninstall.sh 对已不存在的 release 应提示已不存在并继续清理、返回 0；--delete-namespace true 仅在 --release-scope all 下允许，其它
      scope 应报错；--release-scope 非法值应报错退出。
    expected: 重复卸载幂等返回 0，非法 scope 及非 all 下 delete-namespace 均被拒绝，脚本退出码与预期一致。
  expected_results:
  - 基础设施四组件全部 Ready，helm 仅存在 nexent-infrastructure release，基础设施资源未并入 nexent 应用 release。
  - validate.yaml 对单副本、持久化 mode、dynamic 缺 storageClassName、existing 缺 existingClaim 的非法组合均在渲染/安装阶段 fail 拒绝。
  - init-elasticsearch.sh 生成的 ELASTICSEARCH_API_KEY 通过 /_security/_authenticate 200 校验，输出文件权限 600，日志与报告中不出现明文 key。
  - 应用 release 存在时卸载 infrastructure 被守卫拒绝，不产生孤儿基础设施状态或应用依赖缺失。
  - 顺序卸载后 helm release 与基础设施 deployment/secret 全部清除；本地 PV 仅白名单路径被删除，不安全路径被拒绝，dynamic/existing 模式不误删本地数据。
  - 重复卸载幂等返回 0，非法 scope 及非 all 下 delete-namespace 均被拒绝，脚本退出码与预期一致。
