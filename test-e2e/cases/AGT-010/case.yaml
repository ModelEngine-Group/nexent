schema_version: '1.0'
stage: D3
module: V5-BASELINE
case:
  case_id: AGT-010
  feature_id: F-047
  business_rule_ids: [F-047-RULE-01]
  title: section optimize：无效范围、外部 Provider 故障与超时、恢复后不自动保存
  type: AGENT-IT
  priority: P1
  status: active
  automation: automated
  objective: 使用实际有效的负例验证范围拒绝；通过受控 Provider 验证异常与超时不会部分保存，恢复真实模型后功能仍可用。
  preconditions:
  - 本地 Nexent 配置服务健康且 Jiuwen SDK 已启用。
  - 使用既有 models.yaml/secrets.env 配置及真实 LLM，健康预检通过。
  - 批次受控 HTTP 资产服务已启动；资产 URL 由既有控制器注入。
  test_data:
    configuration: config/models.yaml
    controlled_service: http-fixture
    invalid_ranges: insert 的 start_pos=-1、超过原文长度；select 的起点大于终点。
  steps:
  - order: 1
    action: 创建独占 Agent 草稿，读取名称、Prompt、模型与资源绑定快照。
    expected: 动态 ID 属于本次用例，不修改租户默认模型。
  - order: 2
    action: 分别提交无效 insert 起点、无效 select 范围；每种负例重复两次并重新读取草稿。
    expected: 返回明确 400/422、没有成功优化数据，草稿字段和绑定不变。insert 的 end_pos 不作为无效条件。
  - order: 3
    action: 创建独占受控 Provider 模型，分别注入 503 和请求超时，以合法 select 范围调用优化并读取 wire 计数及草稿。
    expected: 故障确实到达 Provider，重试次数和耗时有界；当前 select 降级返回明确能力错误 400，没有成功数据，草稿不变。
  - order: 4
    action: 移除故障，使用原配置真实模型调用合法 select 优化并再次读取草稿。
    expected: 200、Jiuwen 来源及非空优化结果；优化建议没有自动保存草稿。
  - order: 5
    action: 删除本用例 Agent、模型及故障控制状态，保存脱敏证据。
    expected: 清理失败单独呈现；结果与日志不包含认证密钥。
  expected_results:
  - 无效范围被拒绝且重复调用不产生脏状态。
  - 外部异常与超时被真实触发，不出现成功优化数据或部分保存。
  - 真实模型恢复后能完成优化，建议不会自动保存。
  - 独占资产全部清理且证据脱敏。
  forbidden_side_effects:
  - 不覆盖共享 Agent、模型、默认模型或其他用例的故障状态。
  acceptance:
  - id: AC-01
    description: 有效负例、重复请求与草稿不变
    steps: [1, 2]
    expected_results: [1]
    forbidden_side_effects: [1]
  - id: AC-02
    description: Provider 异常、超时、真实模型恢复和安全清理
    steps: [3, 4, 5]
    expected_results: [2, 3, 4]
    forbidden_side_effects: [1]
  source:
    legacy_workbook_sha256: aa4b32414d30f12b3b64e14236268145e556bd7cfc5d3eb8df80731608ebc022
    legacy_sheet: 02_测试用例基线
    legacy_row: 91
  integration_boundary:
  - 实际 Nexent HTTP 接口与真实 LLM；Mock 仅提供独占 503/超时故障，不模拟正常优化结果。
  observations:
  - 负例 HTTP 状态、Provider wire 计数、耗时、草稿读回与恢复来源。
  cleanup:
  - 按资产注册表删除本用例模型与 Agent，并移除独占故障 nonce。
