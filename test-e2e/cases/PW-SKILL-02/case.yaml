  actor: Nexent browser user
  journey:
  - 作者Mine定位run_id Skill并申请上架。
  - 确认状态进入审核中。
  - Admin进入Review搜索申请并打开。
  - 点击批准并等待状态更新。
  - 消费者Repository搜索run_id Skill。
  - 打开详情并点击安装/复制到Mine。
  - 切消费者Mine确认Skill出现且可打开。
  - 可选到Agent选择器确认该Skill可被绑定。
  final_business_result:
  - 审核权限/状态正确。
  - 批准后Repository可见。
  - 安装后消费者Mine有可用副本。
