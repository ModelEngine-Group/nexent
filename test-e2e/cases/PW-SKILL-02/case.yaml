case:
  case_id: PW-SKILL-02
  feature_id: V5-PW-SKILL-02
  business_rule_ids:
  - V5-PW-SKILL-02-RULE-01
  title: Skill申请上架→Admin Review→Repository安装
  type: E2E
  priority: P1
  status: active
  automation: automated
  objective: 验证Skill市场三Tab闭环。
  preconditions:
  - 作者Mine已有run_id Skill
  - Admin reviewer
  - 消费者租户
  test_data:
    legacy_asset_declaration: config/users.yaml；assets/skills/test_skill/
  steps:
  - order: 1
    action: 作者Mine定位run_id Skill并申请上架。
    expected: 审核权限/状态正确。
  - order: 2
    action: 确认状态进入审核中。
    expected: 批准后Repository可见。
  - order: 3
    action: Admin进入Review搜索申请并打开。
    expected: 安装后消费者Mine有可用副本。
  - order: 4
    action: 点击批准并等待状态更新。
    expected: 安装后消费者Mine有可用副本。
  - order: 5
    action: 消费者Repository搜索run_id Skill。
    expected: 安装后消费者Mine有可用副本。
  - order: 6
    action: 打开详情并点击安装/复制到Mine。
    expected: 安装后消费者Mine有可用副本。
  - order: 7
    action: 切消费者Mine确认Skill出现且可打开。
    expected: 安装后消费者Mine有可用副本。
  - order: 8
    action: 可选到Agent选择器确认该Skill可被绑定。
    expected: 安装后消费者Mine有可用副本。
  expected_results:
  - 审核权限/状态正确。
  - 批准后Repository可见。
  - 安装后消费者Mine有可用副本。
