  integration_boundary:
  - 真实Agent两Core到Provider HTTP协议Mock及受控工具
  - Core状态导出到TraceSink、真实文件写入/刷盘/封段与文件索引器，再到内部材料读取/校验服务
  observations:
  - trace/turn/执行/调用身份
  - 原始请求、state/manifest校验及已确认前缀
  - 安全边界、材料状态和effect结果
  - 物理调用计数及清理
  cleanup:
