schema_version: '1.0'
stage: D3
module: V5-BASELINE
case:
  case_id: EVOLUTION-RUN-BUDGET-D3-001
  feature_id: AGENT-EVOLUTION-REPLAY
  business_rule_ids: [AGENT-EVOLUTION-REPLAY-RULE-06]
  title: 开发试跑、候选生成和独立确认按租户限制额度
  type: AGENT-IT
  priority: P0
  status: active
  automation: automated
  objective: 在真实数据库验证多个 worker 争抢额度、租户隔离及截止后拒收迟到结果。
  preconditions: [可创建临时数据库的 PostgreSQL 实例。]
  test_data:
    profile: 两个租户，第一组有多个排队任务，第二组有独立任务。
  steps:
  - order: 1
    action: 多个 worker 同时领取第一租户的工作并尝试领取第二租户任务。
    expected: 第一租户的运行数不超过限额。第二租户可以独立领取。
  - order: 2
    action: 保留一项已完成的判分，在另一项执行中使本实验截止，提交迟到结果并重新领取。
    expected: 已完成结果保留，进行中及排队任务得到超时原因，迟到结果不能改写。
  - order: 3
    action: 多个编辑者争抢同一来源的生成额度，再从同租户另一来源和另一租户提交生成。
    expected: 额度耗尽时在模型调用前拒绝，另一租户继续生成。旧的超时尝试不能补写完成，UTC 次日可重新申请。
  - order: 4
    action: 代入供应商用量前先申请模型额度，分别尝试耗尽 token 和费用额度，再提交真实回执、越界回执与下一次请求。
    expected: 按预留金额拦截超额请求。实际用量结算后可以重用余额。越界回执保留实际值并停止本次生成。
  - order: 5
    action: 用同一个实验额度为重放和模型裁判分别申请模型调用，保留首项评分，再耗尽额度。尝试继续领取任务或沿用已完成的试跑。
    expected: 原有评分保留，未领取任务标记预算中止，已结束试跑不能继续计费。运行中的智能体收到额度拒绝后终止当前运行，未继续尝试调用模型。
  - order: 6
    action: 以已锁定的独立确认申请额度，提交供应商用量。用相同回执从开发链路申请，再撤回独立评测人资格或耗尽确认额度。
    expected: 独立确认的额度和回执不能由开发试跑复用。旧租约、撤权或余额不足在发模型请求前拦截。已有判分保留，只回传汇总用量。额度不足时结论不能为通过。
  - order: 7
    action: 为候选生成请求配置单次输出上限，分别在有用量额度和无用量额度时检查供应商请求，以及预占的输出量。
    expected: 单次上限作用于实际请求。计费时以它和供应商上限中的较小值预占。调用结束后清除该上限。
  - order: 8
    action: 完成一道两轮题的四组对照，其中一组裁判无效。分别在剩余一轮和两轮的预算下申请补跑，并发重交。旧副本清理后领取补跑，再提交旧回执。
    expected: 预算不足拒绝。预算充足只新增一个实际执行，保留三组结果、原裁判错误和旧回执，旧回执无法覆盖补跑结果。
  expected_results: [并发限制对所有 worker 生效且按租户隔离。, 截止后保留已完成行并拒绝迟到结果。, 候选生成按租户和来源扣减次数并限制并发。, 模型费用和 token 分别预留并按回执结算。, 重放与模型裁判共享同一个实验的模型预算，停止后不再派发。, 独立确认使用单独的额度与租约，余额不足时阻止晋升。, 配置的单次上限约束供应商请求及实际预占量。, 仅补跑未判定的一组且保留两次回执。]
  forbidden_side_effects: [单个租户的实验不能占用另一租户的额度。, 公共计费记录和汇总不含私有用例标识、任务和判分明细。]
  acceptance:
  - id: AC-01
    description: 多 worker 同时申请额度且其他租户可运行。
    steps: [1]
    expected_results: [1]
    forbidden_side_effects: [1]
  - id: AC-02
    description: 跨进程重领和迟到写入均服从已冻结的截止时间。
    steps: [2]
    expected_results: [2]
  - id: AC-03
    description: 限额按租户和来源执行，超额请求不会调用模型。
    steps: [3]
    expected_results: [3]
  - id: AC-04
    description: 供应商额度预占、真实用量和费用均持久化。
    steps: [4]
    expected_results: [4]
  - id: AC-05
    description: 冻结的预算同时覆盖重放与裁判。达到上限后停止派发和当前试跑，保留已完成判分。
    steps: [5]
    expected_results: [5]
  - id: AC-06
    description: 私有重放与裁判结算至同一锁定批次，拒绝跨链路及失效回执，预算中止时只提交汇总和未通过结论。
    steps: [6]
    expected_results: [6]
    forbidden_side_effects: [2]
  - id: AC-07
    description: 单次输出上限无须启用用量额度也生效，启用计费时按实际限值预占。
    steps: [7]
    expected_results: [7]
  - id: AC-08
    description: 跨 worker 补跑服从原预算，旧回执及已有判分保留。
    steps: [8]
    expected_results: [8]
  execution:
    profiles:
    - name: mock
      required_services: []
  integration_boundary: [Management 的实验提交、数据库领取及完成事务使用独立 PostgreSQL 测试库。]
  observations: [运行回执、终态、错误原因及保留的判分。]
  cleanup: [销毁临时数据库。]
