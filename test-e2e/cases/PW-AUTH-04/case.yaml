schema_version: '1.0'
stage: D4
module: V5-BASELINE
case:
  case_id: PW-AUTH-04
  feature_id: V5-PW-AUTH-04
  business_rule_ids:
  - V5-PW-AUTH-04-RULE-01
  title: CAS登录→Nexent会话→退出联动
  type: E2E
  priority: P2
  status: skipped_by_policy
  automation: not_applicable
  objective: 验证CAS跳转和Nexent本地session的浏览器联动。
  preconditions:
  - Test CAS Server可用
  - Nexent CAS配置启用
  - CAS测试账号
  test_data:
    legacy_asset_declaration: config/auth-providers.yaml；config/users.yaml；config/secrets.env
  steps:
  - order: 1
    action: 新Context打开登录页点击【CAS登录】。
    expected: CAS回跳身份正确。
  - order: 2
    action: 跳转Test CAS Server，填写测试账号并提交。
    expected: 刷新不丢会话。
  - order: 3
    action: 回跳Nexent后确认用户/租户正确。
    expected: 退出后CAS/Nexent会话按设计失效。
  - order: 4
    action: 刷新并访问/agents确认本地session有效。
    expected: 退出后CAS/Nexent会话按设计失效。
  - order: 5
    action: 执行退出登录并等待CAS/Nexent logout。
    expected: 退出后CAS/Nexent会话按设计失效。
  - order: 6
    action: 回退历史并重开受保护URL，确认旧session不能恢复。
    expected: 退出后CAS/Nexent会话按设计失效。
  expected_results:
  - CAS回跳身份正确。
  - 刷新不丢会话。
  - 退出后CAS/Nexent会话按设计失效。
  forbidden_side_effects: []
  source:
    legacy_workbook_sha256: aa4b32414d30f12b3b64e14236268145e556bd7cfc5d3eb8df80731608ebc022
    legacy_sheet: 03_Playwright_Journey
    legacy_row: 5
  actor: Nexent browser user
  journey:
  - 新Context打开登录页点击【CAS登录】。
  - 跳转Test CAS Server，填写测试账号并提交。
  - 回跳Nexent后确认用户/租户正确。
  - 刷新并访问/agents确认本地session有效。
  - 执行退出登录并等待CAS/Nexent logout。
  - 回退历史并重开受保护URL，确认旧session不能恢复。
  final_business_result:
  - CAS回跳身份正确。
  - 刷新不丢会话。
  - 退出后CAS/Nexent会话按设计失效。
  failure_evidence:
  - '${NEXENT_TEST_HOME}/runs/{run_id}/playwright/PW-AUTH-04/

    - screenshot.png / trace.zip / video.webm

    - console.log / network.har / failure.json

    - 涉及协议时关联 wire/*.jsonl；涉及下载时保留 downloads/'
