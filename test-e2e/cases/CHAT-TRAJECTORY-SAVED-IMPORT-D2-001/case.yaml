  title: 持久导入接口按导入者隔离并支持列表读取删除
  objective: 持久导入接口按导入者隔离并支持列表读取删除
  preconditions:
  - 独占临时存储根、受控管理员身份和可执行产品；runtime责任域，不依赖生产源会话或模型服务。
  - 资源由Case持有，测试结束关闭ThreadManager、文件及浏览器，删除独占测试文件。
  test_data:
    profile: mock
    corpus:
    - 原生多轮Unicode ZIP
    - 相同ZIP重复上传、两名同租户用户及跨租户SU
    - 非法包与受控存储故障
  steps:
  - order: 1
    action: 调用新接口重复上传同一原生ZIP，分页并读取详情。
    expected: 每次生成不同UUID，返回摘要和完整详情，列表倒序及分页正确，响应private,no-store。
  - order: 2
    action: 未登录、普通用户、同租户其他用户和其他租户SU访问全部新接口。
    expected: 分别401/403、读取404或空列表；删除不存在于当前归属的记录幂等成功且不影响原记录，来源身份无授权作用，错误无正文和内部路径。
  - order: 3
    action: 删除自有记录并重复删除，调用旧临时接口及上传无效包。
    expected: 删除幂等且其他记录不变，无效包不新增记录，旧接口不写持久档案。
  expected_results:
  - 每次生成不同UUID，返回摘要和完整详情，列表倒序及分页正确，响应private,no-store。
  - 分别401/403、读取404或空列表；删除不存在于当前归属的记录幂等成功且不影响原记录，来源身份无授权作用，错误无正文和内部路径。
  - 删除幂等且其他记录不变，无效包不新增记录，旧接口不写持久档案。
  forbidden_side_effects:
  - 不得访问其他用户导入记录、修改原采集数据、数据库业务记录或调用模型工具。
  - 不得将包内路径用于持久文件定位；无效ZIP不得执行代码、请求来源资源或触发模型工具。
  contract:
    protocol: HTTP
    method: POST/GET/DELETE
    endpoint: /trajectory/imports; /trajectory/imports/{import_id}
    request_expectations:
    - 真实导出接口、服务与文件处理，可信身份目录边界受控。
    response_expectations:
    - ZIP二进制及头、完整内容、错误结构和授权逐项核验。
  acceptance:
  - id: AC-01
    description: 每次生成不同UUID，返回摘要和完整详情，列表倒序及分页正确，响应private,no-store。
