schema_version: '1.0'
stage: D1
module: V5-BASELINE
case:
  case_id: EVOLUTION-PAIR-REPORT-D1-001
  feature_id: AGENT-EVOLUTION-REPLAY
  business_rule_ids: [AGENT-EVOLUTION-REPLAY-RULE-01]
  title: 由实际判据和两组回执生成逐题报告
  type: BE-UT
  priority: P1
  status: active
  automation: automated
  objective: 将两组受控输出交给产品代码判分并生成逐题变化和有效分母。
  preconditions: [使用固定回答和代码判据。]
  test_data:
    profile: mock
  steps:
  - order: 1
    action: 对同题两组结果依次构造改善、退步、均通过、均失败、无回执和未完成，然后读取实验报告。
    expected: 每种有效变化分别计数，缺证与未完成仅进入未判定数。
  - order: 2
    action: 为同一批题补入不挂载目标 Skill 的试跑及正文读取次数，重新读取报告。
    expected: 三组均有效和新旧版均读取的题数分别统计，缺少对照的题仍保留已有判分。
  expected_results: [六题中有效四题，四类有效变化各一题，零分作为有效失败。, 三题三组有效，其中两题新旧版均读到正文。]
  forbidden_side_effects: [读取报告不会重新执行智能体或修改题目。]
  acceptance:
  - id: AC-01
    description: 核对报告的逐题状态、总数与有效数。
    steps: [1]
    expected_results: [1]
    forbidden_side_effects: [1]
  - id: AC-02
    description: 区分改版收益、相对不挂载的变化以及正文使用证据。
    steps: [2]
    expected_results: [2]
    forbidden_side_effects: [1]
  assertions: [每题按旧版和候选判分配对，缺证不给任一版本加分。]
  unit_boundary: 运行实际产品判分和报告聚合；权限及试验记录读取使用测试替身。
  inputs: [六组确定的开发题试跑结果及已知业务答案。]
  execution:
    profiles:
    - name: mock
      required_services: []
