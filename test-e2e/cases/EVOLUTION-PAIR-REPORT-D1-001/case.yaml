schema_version: '1.0'
stage: D1
module: V5-BASELINE
case:
  case_id: EVOLUTION-PAIR-REPORT-D1-001
  feature_id: AGENT-EVOLUTION-REPLAY
  business_rule_ids: [AGENT-EVOLUTION-REPLAY-RULE-01]
  title: 由实际判据和两组回执生成逐题报告
  type: BE-UT
  priority: P1
  status: active
  automation: automated
  objective: 将两组受控输出交给产品代码判分并生成逐题变化和有效分母。
  preconditions: [使用固定回答和代码判据。]
  test_data:
    profile: mock
  steps:
  - order: 1
    action: 对同题两组结果依次构造改善、退步、均通过、均失败、无回执和未完成，然后读取实验报告。
    expected: 每种有效变化分别计数，缺证与未完成仅进入未判定数。
  - order: 2
    action: 为同一批题补入不挂载目标 Skill 的试跑及正文读取次数，重新读取报告。
    expected: 三组均有效和新旧版均读取的题数分别统计，缺少对照的题仍保留已有判分。
  - order: 3
    action: 单独运行现用版本并提供三条选用记录，其中一条无有效回执。
    expected: 只统计两个有效基线结果，区分应选漏选与正确选用。
  - order: 4
    action: 回答符合预期，实际工具回执显示漏调；再去掉回执。
    expected: 业务判分通过；有完整回执时标出漏调，缺少回执时标记缺证。
  - order: 5
    action: 对已确认移除的工具分别要求调用一次和禁止调用，再移除清单核验依据。
    expected: 必调题失败、禁调题通过、无移除依据时缺证。
  - order: 6
    action: 按题比较原版、A、B、A+B。第一题只有组合通过，第二题只有组合失败，第三题缺 B 的结果。
    expected: 两题可以比较四组。报告区分组合新增收益、组合导致的新错以及缺少对照，固定回归题保留失败与缺组原因。
  - order: 7
    action: 冻结要修好的专项题及一条使用独立判据的固定回归题。核对筛选结果，再在回归题加入禁止写入的回执。
    expected: 目标修好且回归通过时可提交独立确认。回归题即使回答正确，执行了禁止操作也会阻止提交。
  expected_results: [六题中有效四题，四类有效变化各一题，零分作为有效失败。, 三题三组有效，其中两题新旧版均读到正文。, 基线三题中两题有效且对照题数为零。, 答案正确时仍区分漏调与缺证。, 区分已核实移除和缺少工具回执。, 三题中两题四组有效，缺少 B 的题不能判定组合收益。, 逐题回执与题目判据和运行摘要匹配后才允许计入门槛；禁止写入拦截候选。]
  forbidden_side_effects: [读取报告不会重新执行智能体或修改题目。]
  acceptance:
  - id: AC-01
    description: 核对报告的逐题状态、总数与有效数。
    steps: [1]
    expected_results: [1]
    forbidden_side_effects: [1]
  - id: AC-02
    description: 区分改版收益、相对不挂载的变化以及正文使用证据。
    steps: [2]
    expected_results: [2]
    forbidden_side_effects: [1]
  - id: AC-03
    description: 无候选也能运行基线，选择正确率与业务交付分别展示。
    steps: [3]
    expected_results: [3]
    forbidden_side_effects: [1]
  - id: AC-04
    description: 工具调用和最终交付独立判分。
    steps: [4]
    expected_results: [4]
    forbidden_side_effects: [1]
  - id: AC-05
    description: 仅对已经核验不可调用的工具按零次判分。
    steps: [5]
    expected_results: [5]
    forbidden_side_effects: [1]
  - id: AC-06
    description: 同时检查两个单项与组合的结果，缺少任一组时单列。
    steps: [6]
    expected_results: [6]
    forbidden_side_effects: [1]
  - id: AC-07
    description: 报告按事先冻结的目标题和门槛计算能否提交独立确认。
    steps: [7]
    expected_results: [7]
    forbidden_side_effects: [1]
  assertions: [每题按旧版和候选判分配对，缺证不给任一版本加分。]
  unit_boundary: 运行实际产品判分和报告聚合；权限及试验记录读取使用测试替身。
  inputs: [六组确定的开发题试跑结果及已知业务答案。]
  execution:
    profiles:
    - name: mock
      required_services: []
