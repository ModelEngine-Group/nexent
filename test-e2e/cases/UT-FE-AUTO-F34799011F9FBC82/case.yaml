  - 无匹配或无检索词时整段 text 原样渲染，不产生 <mark>，不抛异常。
  - 检索词筛选符合契约：trim 后长度≥2、以 sourceText 大小写不敏感包含为准、去重；合并时按长度降序、剔除已保留项的子串、最多保留 8 条。
  - 从 citationContext 抽取的词仅在该词同时出现在 sourceText 时才被用于高亮（中文 3 字起按最大匹配、IP/版本号/标识符字面量）。
  - 渲染过程不发任何额外检索、模型或网络请求，服务调用次数保持 0。
