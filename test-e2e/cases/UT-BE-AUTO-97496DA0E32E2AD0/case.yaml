  unit_boundary: Agent 列表可用性
  inputs:
  - '- 无外部资产；测试输入为内存构造的 enriched_agents 列表，每个 entry 含 raw_agent（name/display_name/create_time）与 unavailable_reasons 列表。'
  assertions:
  - 同名组中 create_time 最早的 entry 的 unavailable_reasons 不新增 DUPLICATE_NAME；其余后创建 entry 各追加一个 DUPLICATE_NAME。
  - 同 display_name 组中 create_time 最早的 entry 不新增 DUPLICATE_DISPLAY_NAME；其余后创建 entry 各追加一个 DUPLICATE_DISPLAY_NAME。
  - 同时属于同名组与同 display_name 组的后创建 entry，unavailable_reasons 同时包含 DUPLICATE_NAME 与 DUPLICATE_DISPLAY_NAME。
  - 已有模型/工具原因的 entry 在追加重复原因后，原有原因保留、新原因追加且不重复；同名组内不因同一成员重复追加同一原因。
  - 单成员组与空列表不产生任何追加，函数不抛异常。
  - 函数返回 None，输入列表被原地修改，测试过程无未处理异常、无跨租户数据副作用。
