schema_version: '1.0'
stage: D4
module: V5-BASELINE
case:
  case_id: PW-KB-AIDP-02
  feature_id: V5-PW-KB-AIDP-01
  business_rule_ids:
  - V5-PW-KB-AIDP-01-RULE-01
  title: AIDP 知识库分块设置：创建页默认512/10%、详情页回显顺序、编辑弹窗复用创建模式卡并持久化
  type: E2E
  priority: P1
  status: active
  automation: automated
  objective: >-
    在真实浏览器里证明 AIDP 知识库分块配置的完整用户旅程：创建页展示 512 token 与 10% 重叠的默认值，
    详情信息页按创建顺序回显分块 token 与重叠，编辑弹窗复用创建页的分块模式卡，编辑提交后刷新页面
    仍能读回新值。三条用户路径都由点击与读屏完成，不以接口返回替代界面断言。
  preconditions:
  - AIDP服务由 ext mock 提供（knowledge-provider，种子 aidp-kb-product）；无需任何机器本地档位配置。
  - 已登录租户管理员账号。
  - /knowledges 呈现 AIDP 分支，Local 个人容量控件不出现。
  - ext mock 的 AIDP 模型模板接口已返回可用 embedding model 与 VLM model。
  test_data:
    run_id_prefix: aidp-chunk-ui
    expected_create_defaults:
      chunk_token_num: 512
      chunk_overlap_percent: 10
      topk: 10
      similarity: 0
    edit_to:
      chunk_token_num: 1024
      chunk_overlap_percent: 10
  steps:
  - order: 1
    action: 以租户管理员登录后进入 /knowledges，切到 AIDP 分支，点击创建知识库进入创建页。
    expected: 创建页呈现 AIDP 分支专属标题与字段区；Local 个人容量控件不出现。
  - order: 2
    action: 在创建页不修改任何分块参数，读取分块 token 输入框、重叠百分比输入框、Top K 与相似度阈值的当前值。
    expected: 分块 token 显示 512，重叠显示 10%，Top K 显示 10，相似度阈值显示 0；不出现 1024 或 12.5% 这类旧默认值。
  - order: 3
    action: 核对分块模式卡与既有分块默认提示：确认分块模式卡呈现智能切分与法律条款两个选项，且字段区不再重复渲染按节重复的默认值提示。
    expected: 分块模式卡可选且默认智能切分；默认值提示不在多个小节重复出现。
  - order: 4
    action: 用带 run_id 的唯一名称与描述提交创建，等待创建成功并跳转到该知识库的文件管理页。
    expected: 创建成功，进入新建知识库的文件管理；列表中新知识库名称与 run_id 一致。
  - order: 5
    action: 打开该知识库的信息页，按从上到下顺序读取配置字段序列。
    expected: 信息页展示分块 token 与分块重叠两项，顺序与创建页一致；两项均显示已存数值而非破折号。
  - order: 6
    action: 在信息页点击分块 token 配置项打开编辑弹窗，核对弹窗内分块模式卡与创建页一致。
    expected: 编辑弹窗复用创建页的分块模式卡（智能切分/法律条款），而不是另一套无关控件。
  - order: 7
    action: 在编辑弹窗把分块 token 改为 1024 并保存，等待保存成功提示。
    expected: 保存成功提示出现；弹窗关闭；重叠按百分比换算后随分块规模一起提交。
  - order: 8
    action: 整页刷新后重新打开该知识库信息页，复核分块 token 与重叠。
    expected: 分块 token 读回 1024，重叠仍显示 10%（换算为 102 个 token），未回退为默认 512。
  - order: 9
    action: 在编辑弹窗提交越界重叠（重叠百分比使 token 数超过分块一半），确认前端拦截或后端 4xx 以错误提示呈现。
    expected: 保存被拒并显示可读错误提示；信息页分块 token 仍为 1024，配置未被部分写入。
  - order: 10
    action: 清理 run-owned 知识库并通过列表确认删除结果。
    expected: 删除成功，列表中不再出现该 run_id 的知识库。
  expected_results:
  - 创建页 AIDP 分块默认值为 512 token 与 10% 重叠，Top K 10、相似度 0。
  - 信息页按创建顺序展示分块 token 与重叠，取值来自详情接口而非占位破折号。
  - 编辑弹窗复用创建页分块模式卡。
  - 编辑分块 token 后刷新页面仍读回新值，重叠百分比保持一致。
  - 越界重叠被拒且不产生部分写入。
  - run-owned 知识库清理成功。
  forbidden_side_effects:
  - 创建页仍显示旧默认值 1024 token 或 12.5% 重叠。
  - 编辑分块后刷新页面回退为 512，或重叠百分比漂移成非 10%。
  - 越界提交导致分块配置被部分写入或整体回退默认值。
  - 测试结束后残留 run-owned 知识库。
  acceptance:
  - id: AC-01
    description: The AIDP create page shows the 512 token / 10 percent overlap defaults together with Top K 10 and similarity 0, and the chunk mode cards are selectable without duplicated per-section default hints.
    steps:
    - 1
    - 2
    - 3
    expected_results:
    - 1
    - 2
    - 3
    forbidden_side_effects:
    - 1
  - id: AC-02
    description: The knowledge base Information tab lists chunk tokens and chunk overlap in create order with stored values rather than placeholders.
    steps:
    - 4
    - 5
    expected_results:
    - 2
    - 4
    forbidden_side_effects: []
  - id: AC-03
    description: The detail chunk edit modal reuses the create page chunk mode cards.
    steps:
    - 6
    expected_results:
    - 3
    forbidden_side_effects: []
  - id: AC-04
    description: Editing the chunk token to 1024 survives a full page reload with the overlap percentage unchanged, and an out-of-range overlap is rejected without partial writes.
    steps:
    - 7
    - 8
    - 9
    expected_results:
    - 4
    - 5
    forbidden_side_effects:
    - 2
    - 3
  - id: AC-05
    description: The run-owned knowledge base is removed and no longer listed.
    steps:
    - 10
    expected_results:
    - 6
    forbidden_side_effects:
    - 4
  source:
    notes: >-
      Derived from commits 01400d399 and a7048be7d. Frontend defaults come from
      frontend/ext_components/aidp/shared/utils/aidpChunking.ts; the detail order and modal reuse come
      from AidpKnowledgeDetailInformation.tsx and AidpKnowledgeInformationTab.tsx.
  actor: 租户管理员（具备 AIDP 知识库创建与编辑权限）
  journey:
  - 进入 /knowledges 并切到 AIDP 分支
  - 打开创建页并读取分块默认值
  - 提交创建进入新知识库文件管理
  - 打开信息页读取配置字段顺序
  - 打开分块编辑弹窗并核对模式卡
  - 改分块 token 为 1024 并保存
  - 整页刷新复核持久化
  - 提交越界重叠并确认被拒
  - 删除 run-owned 知识库
  final_business_result:
  - 用户在不改默认值的情况下创建出的 AIDP 知识库分块为 512 token / 10% 重叠，与其预期一致。
  - 用户改过激活分块后刷新页面不会丢失，重叠百分比保持 10%。
  - 越界重叠被界面拦下，知识库配置保持上一次成功保存的状态。
  failure_evidence:
  - 创建页分块输入框显示 1024 或重叠显示 12.5%。
  - 信息页分块字段显示破折号或顺序与创建页不一致。
  - 刷新后分块 token 回退为 512。
  - 越界提交后信息页显示被截断的中间值。
