schema_version: '1.0'
stage: D4
module: CHAT-WORKBENCH
case:
  case_id: WB-REQUIREMENT-HISTORY-D4-001
  feature_id: SYS-AGENT-LIFECYCLE
  requirement_ids: [WB-REQUIREMENT-HISTORY-20261105]
  business_rule_ids: [SYS-AGENT-LIFECYCLE-RULE-004, SYS-AGENT-LIFECYCLE-RULE-005]
  title: Replay submitted Agent requirements in Workbench and configuration histories
  type: E2E
  priority: P1
  status: active
  automation: automated
  objective: Verify actual page restoration and readonly form rendering through both creator entrypoints.
  preconditions:
  - Local frontend is available with controlled authorized tenant APIs and isolated creator history fixtures.
  test_data:
    profile: mock
  steps:
  - order: 1
    action: Open Workbench history containing submitted single-choice, multiple-choice, other-text and free-text requirements followed by another card reusing the question IDs.
    expected: The first card restores the exact saved answers and Submitted state; the later unanswered card remains blank. Reload preserves both.
  - order: 2
    action: Open the same target Agent configuration page, select the creator history and reselect it after reopening the page.
    expected: The embedded assistant restores the same saved answers and submitted state without confusing later questions or changing Agent configuration.
  - order: 3
    action: Attempt clicks on restored submitted controls, open a history with no saved answer and observe outgoing requests throughout both entries.
    expected: Submitted controls stay readonly and cannot replay; unanswered historical controls stay blank and readonly. No model run or persistent mutation occurs.
  expected_results:
  - Both entrypoints restore exact historical requirements across re-entry and reload.
  - Repeated question IDs and unanswered legacy cards do not borrow answers from another round.
  - Historical cards remain readonly without duplicate generation or configuration changes.
  forbidden_side_effects:
  - No real model requests, resource creation, publication, configuration mutation or backend data cleanup.
  actor: Authorized controlled tenant user
  journey: [Open Workbench history, Reload, Open Agent configuration, Select creator history, Re-enter, Verify no replay]
  final_business_result:
  - Users can inspect the requirements used to generate an Agent through either entrypoint.
  failure_evidence: [Browser control assertions and sanitized request counts]
  execution:
    profiles:
    - name: mock
      required_services: []
  acceptance:
  - id: AC-01
    description: Both creator entries display saved choices and text across history reload and re-entry.
    steps: [1, 2]
    expected_results: [1]
  - id: AC-02
    description: Repeated IDs and missing answers stay isolated while all historical controls prevent replay.
    steps: [1, 3]
    expected_results: [2, 3]
    forbidden_side_effects: [1]
