  title: metadata 进入 Agent context，与 meta_data 审计字段隔离｜异常/边界/越权
  type: AGENT-IT
  priority: P0
  status: active
  automation: automated
  objective: metadata 进入 Agent context，与 meta_data 审计字段隔离｜异常/边界/越权
  preconditions:
  - Nexent 本地测试全栈已启动，health check 通过。
  - 设置 NEXENT_TEST_HOME，目录不位于 Nexent Git 仓库内。
  - 当次 run_id 已生成，所有新建资源名称带 run_id；测试基线固定为 develop 473b65268ba8cda3db53be735f97678e214c583b；执行时另记录实际被测commit。
  - 所需本地资产存在且校验通过：${NEXENT_TEST_HOME}/config/models.yaml；${NEXENT_TEST_HOME}/config/secrets.env
  - models.yaml 中本用例所需真实 Provider 已配置，secrets.env 中凭据有效，预检连通性通过。
  test_data:
    legacy_asset_declaration: '- ${NEXENT_TEST_HOME}/config/models.yaml

      - ${NEXENT_TEST_HOME}/config/secrets.env'
  steps:
  - order: 1
    action: 使用 allow_chat_metadata=true 的独立 Agent，提交合法 metadata。
    expected: 非法 context_policy 返回 422；不得错误期待 200 SSE 内部错误事件。
  - order: 2
    action: 同时提交非法 context_policy={unknown:true}，验证独立字段的请求校验边界。
    expected: 校验失败不启动 Agent，不持久化 metadata，不产生半写入。
  - order: 3
    action: 断言请求在运行前返回 HTTP 422，不读取 SSE，不调用模型/工具。
    expected: 校验失败不启动 Agent，不持久化 metadata，不产生半写入。
  - order: 4
    action: 重试并检查会话，确认 metadata 未被部分写入。
    expected: 校验失败不启动 Agent，不持久化 metadata，不产生半写入。
  expected_results:
  - 非法 context_policy 返回 422；不得错误期待 200 SSE 内部错误事件。
  - 校验失败不启动 Agent，不持久化 metadata，不产生半写入。
  forbidden_side_effects: []
  source:
