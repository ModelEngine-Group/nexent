    legacy_row: 450
  unit_boundary: 标签筛选与统计
  inputs:
  - '- 无需专项本地资产；测试直接导入 frontend/services/api.ts 的 API_ENDPOINTS，构造最小 tag 谓词对象数组与 tag 字符串作为固定输入。'
  assertions:
  - agentRepository.listings 返回 `${API_BASE_URL}/repository/agent?...`，tag_predicates/search_tag_predicates 以 JSON.stringify
    后的字符串出现于同名查询参数，tag 以去除首尾空格后的字符串出现。
  - agentRepository.mineAgents 返回 `${API_BASE_URL}/repository/agent/mine?...`，正确附加 tag_predicates 与 search_tag_predicates。
  - skillRepository.listings 返回 `${API_BASE_URL}/repository/skill?...`，附加 tag_predicates 与 tag；skillRepository.mineSkills
    返回 `${API_BASE_URL}/repository/skill/mine?...`，附加 tag_predicates。
  - agentRepository.tagStats 恒等于 `${API_BASE_URL}/repository/agent/tags`，skillRepository.tagStats 恒等于 `${API_BASE_URL}/repository/skill/tags`。
  - 空数组、纯空白 tag、undefined/null 参数不追加对应查询参数，且不产生多余的 '?' 或重复参数。
  - 测试全程无未处理异常，不访问任何外部服务或网络。
