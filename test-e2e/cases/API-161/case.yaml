schema_version: '1.0'
stage: D2
module: V5-BASELINE
case:
  case_id: API-161
  feature_id: F-156
  business_rule_ids:
  - F-156-RULE-01
  title: config/tenant_config 读取写入、feature flags、租户隔离｜异常/边界/越权
  type: API-IT
  priority: P1
  status: active
  automation: automated
  objective: config/tenant_config 读取写入、feature flags、租户隔离｜异常/边界/越权
  preconditions:
  - Nexent 本地测试全栈已启动，health check 通过。
  - 设置 NEXENT_TEST_HOME，目录不位于 Nexent Git 仓库内。
  - 当次 run_id 已生成，所有新建资源名称带 run_id；测试基线固定为 develop 当前批次锁定的产品提交；执行时另记录实际被测commit。
  - 所需本地资产存在且校验通过：${NEXENT_TEST_HOME}/config/users.yaml；${NEXENT_TEST_HOME}/config/secrets.env
  test_data:
    legacy_asset_declaration: '- ${NEXENT_TEST_HOME}/config/users.yaml

      - ${NEXENT_TEST_HOME}/config/secrets.env'
  steps:
  - order: 1
    action: 准备本地真实测试环境和“config/tenant_config 读取写入、feature flags、租户隔离｜异常/边界/越权”要求的最小数据，所有可变资源使用 RunID 前缀。
    expected: 功能结果与代码契约一致，测试过程无未处理异常。
  - order: 2
    action: 通过 backend/apps/config_app.py; backend/services/config_sync_service.py 对外暴露的真实入口执行目标操作，不直接修改最终数据库状态绕过业务逻辑。
    expected: 关键状态在 API 返回、数据库/存储和后续读取中保持一致。
  - order: 3
    action: 记录请求参数、返回状态、资源ID和关键副作用。
    expected: 失败路径返回明确错误，不出现半写入、重复副作用或跨租户泄露。
  - order: 4
    action: 重新查询详情/列表/持久化状态，验证写入与读取一致。
    expected: 含旧 app 配置键（appName、appDescription、name、description）的保存请求中，这些键被 LEGACY_APP_CONFIG_KEYS 过滤而不写入 tenant_config，其余合法键正常落库。
  - order: 5
    action: 执行对应边界/错误输入，确认错误码和失败原子性。
    expected: 重新加载配置（build_app_config）返回结构中不含 name、description、appName、appDescription 字段，用户可见的 app 名称/描述定制被移除。
  - order: 6
    action: 构造包含旧 app 配置键（appName、appDescription、name、description）且值非空的保存请求并提交，观察这些键是否被写入 tenant_config。
    expected: 重复提交同一保存请求不产生重复配置项或脏状态；以非本租户身份读取仅返回本租户数据，无跨租户副作用。
  - order: 7
    action: 对同一保存请求重复提交一次（重试），并以另一租户身份读取配置，验证不产生重复配置项或跨租户副作用。
    expected: 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
  - order: 8
    action: 如涉及外部服务，优先使用本地真实协议服务或真实 Provider；Mock 仅限故障注入。
    expected: 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
  - order: 9
    action: 检查日志不泄露 secret，并清理临时数据。
    expected: 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
  expected_results:
  - 功能结果与代码契约一致，测试过程无未处理异常。
  - 关键状态在 API 返回、数据库/存储和后续读取中保持一致。
  - 失败路径返回明确错误，不出现半写入、重复副作用或跨租户泄露。
  - 含旧 app 配置键（appName、appDescription、name、description）的保存请求中，这些键被 LEGACY_APP_CONFIG_KEYS 过滤而不写入 tenant_config，其余合法键正常落库。
  - 重新加载配置（build_app_config）返回结构中不含 name、description、appName、appDescription 字段，用户可见的 app 名称/描述定制被移除。
  - 重复提交同一保存请求不产生重复配置项或脏状态；以非本租户身份读取仅返回本租户数据，无跨租户副作用。
  - 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
  forbidden_side_effects: []
