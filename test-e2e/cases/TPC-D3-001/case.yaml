schema_version: '1.0'
stage: D3
module: AGENT-OUTPUT
case:
  case_id: TPC-D3-001
  feature_id: TPC-001
  requirement_ids:
  - TPC-001
  business_rule_ids:
  - TPC-RULE-001
  - TPC-RULE-002
  - TPC-RULE-003
  title: Deployed skill read completes with explicit final and persisted evidence
  type: AGENT-IT
  priority: P1
  status: active
  automation: automated
  objective: Deployed skill read completes with explicit final and persisted evidence
  preconditions:
  - Disposable Nexent deployment, authorized skill and controlled provider are available.
  test_data:
    profile: mock
  steps:
  - order: 1
    action: Drive all seven compatible reasoning prefixes with complete code and legacy run skill actions at first attempt
      and after two rejected generations through deployed Agent.
    expected: Read executes once and returns skill text.
  - order: 2
    action: Return a separate explicit final and reload history.
    expected: Exactly one final payload and one read result are persisted.
  - order: 3
    action: Exhaust three malformed action, thinking-only, invalid final or length-truncated action responses without executing
      a tool.
    expected: No skill effect or completed/committed raw protocol final is emitted or stored. Provisional final deltas must
      roll back in their exact attempts before the terminal error.
  - order: 4
    action: Return a legal skill action followed by model final-answer text in one response, then a separate response after the real result.
    expected: Original model answer fragments stream normally before tool execution; the accepted skill still executes once, real evidence reaches the next model request and the ordinary loop completes.
  expected_results:
  - Runtime executes the skill read.
  - History matches committed stream.
  - Every rejected exhaustion is bounded to three generations and reports an error, with no skill effect or completed/committed
    SSE final. Provisional final deltas are allowed only when their exact attempts explicitly roll back; history contains
    only strictly empty compatibility final placeholders.
  - Mixed-response streaming preserves model text without terminating the accepted action or hiding its real result.
  forbidden_side_effects:
  - No run terminates as completed before executing its accepted action.
  - No duplicate tool effects.
  integration_boundary:
  - Provider to classifier
  - Executor to skill tool
  - Observer to SSE/history
  observations:
  - Raw content and parser classification
  - Skill tool effect
  - Final source and stored units
  cleanup:
  - Remove test conversation and provider fixture.
  execution:
    profiles:
    - name: mock
      required_services:
      - model-provider
    - name: real_smoke
      required_services:
      - model-provider
  acceptance:
  - id: AC-01
    description: Controlled provider drives one actual skill effect, committed SSE/history and one explicit final.
    steps:
    - 1
    - 2
    expected_results:
    - 1
    - 2
    forbidden_side_effects:
    - 1
    - 2
  - id: AC-02
    description: Malformed, thinking-only, invalid final and truncated exhaustion stays within three generations, reports
      an error, never executes a skill or completes/commits a final, rolls back any provisional answer fragments in their
      own attempts, and retains only empty history final placeholders.
    steps:
    - 3
    expected_results:
    - 3
    forbidden_side_effects:
    - 1
    - 2

  - id: AC-03
    description: Mixed action/final text streams without the removed observer gate; actual skill execution and real-result continuation remain intact.
    steps:
    - 4
    expected_results:
    - 4
    forbidden_side_effects:
    - 1
    - 2
