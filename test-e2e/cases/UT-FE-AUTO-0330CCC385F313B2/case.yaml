  assertions:
  - 角标渲染 displayIndex，data-citekey 为 citekey.trim().toLowerCase()，aria-label 语义正确，测试过程无未处理异常。
  - document 来源渲染 DatabaseIcon、url 来源渲染 ExternalLinkIcon；title、文件名（filename||title||url 回退）与 sourceLabel 显示顺序与来源卡（sources-panel）一致。
  - hover 卡片中 CiteIndexBadge 展示的索引与角标 displayIndex 一致。
  - 白名单 HTML 标签安全渲染，script/img 等危险标签被剥离，不产生 XSS 可执行内容。
  - text 为空时不渲染文本区，sourceLabel 为空时不渲染来源标签行。
  - loading 时按钮 disabled 且显示加载文案；非 loading 时按钮可交互并触发 onClick。
  - Enter/Space 键盘激活与点击等价触发 onClick，参数为 marker 元素。
  - 日志/console 不出现明文 API Key/Token/Password/模型密钥。
