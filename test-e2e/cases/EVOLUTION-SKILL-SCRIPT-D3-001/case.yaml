schema_version: '1.0'
stage: D3
module: V5-BASELINE
case:
  case_id: EVOLUTION-SKILL-SCRIPT-D3-001
  feature_id: AGENT-EVOLUTION-REPLAY
  business_rule_ids: [AGENT-EVOLUTION-REPLAY-RULE-05]
  title: 从真实沙箱进程判定 Skill 脚本的版本与输出
  type: AGENT-IT
  priority: P1
  status: active
  automation: automated
  objective: 即使工具正常返回，也可从所执行脚本的实参与标准输出区分错误结果和正确结果。
  preconditions: [Docker 可用且已安装 nexent/nexent-sandbox 镜像。]
  test_data:
    profile: 自建周报 Skill 和只处理固定字符串的脚本，在临时目录分别准备原版、修正版。
  steps:
  - order: 1
    action: 在无外网的临时容器用相同输入运行旧版与修正版，按业务要求核对标准输出及交付文件，并试跑输出正确但文件有误或多写文件的版本。
    expected: 旧版运行成功但输出不符，新版通过，错写或多写文件均失败。镜像、参数和脚本摘要可核验。
  - order: 2
    action: 运行非零退出脚本，关闭进程取证重试，再用错误镜像及本机后端运行已锁定镜像的脚本。
    expected: 非零退出判失败。缺证单列，错误镜像及本机后端均无法执行锁定的脚本。
  expected_results: [逐题报告反映实际容器里的脚本、镜像、参数和输出差异。, 非零退出和缺证有独立的判定。]
  forbidden_side_effects: [执行回执不能包含原始命令行参数或标准输出。]
  acceptance:
  - id: AC-01
    description: 区分固定输入的两种脚本结果。
    steps: [1]
    expected_results: [1]
  - id: AC-02
    description: 检验非零退出及缺证。
    steps: [2]
    expected_results: [2]
    forbidden_side_effects: [1]
  execution:
    profiles:
    - name: mock
      required_services: []
  integration_boundary: [实际 Docker 容器、SDK Skill 工具、脚本沙箱、回执契约与 Management 判分。]
  observations: [进程退出码、镜像和文件摘要及输出核对结果。]
  cleanup: [退出时删除本次新建的容器，清理本次临时文件。]
