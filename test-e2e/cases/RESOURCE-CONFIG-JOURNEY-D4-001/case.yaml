    description: The configuration table opens the categorized resource drawer.
    steps: [1]
    expected_results: [1]
    forbidden_side_effects: [1]
  - id: AC-SELECTION
    description: Service and tool selection, search and cancellation preserve intended state.
    steps: [2]
    expected_results: [2]
    forbidden_side_effects: [1]
  - id: AC-SAVE
    description: Failure preserves draft selections, retry saves the expected references, and successful reload discards unsaved edits even with unchanged revision, without another save.
    steps: [3]
    expected_results: [3]
    forbidden_side_effects: [1]
  - id: AC-EXISTING-BINDINGS
    description: Existing blocked tool and skill bindings require warning confirmation before removal and survive cancellation.
    steps: [4]
    expected_results: [4]
    forbidden_side_effects: [1]
