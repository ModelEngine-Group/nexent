  unit_boundary: 文档标签
  inputs:
  - 无强制文件资产；组件级注入内存 mock（documents、tagLibraries、assignDefinitions、documentBatchStatus）与 mock 的 useTagLibraries/useTagDefinitions/tagManagementApi.getDocumentBatchStatus。
  assertions:
  - 存在 knowledge_content 库时正确展示标签筛选与标签管理，入口由 documentLibrary/assignDefinitions/isDataMate 共同决定，渲染过程无未处理异常。
  - getDocumentBatchStatus 在 250ms 防抖后以 provider="local"、documentIds 截断至 200 调用一次，pending 显示 amber、failed 显示 red 徽标，卸载/变更后旧请求不覆盖新状态。
  - 标签筛选按 TagDocumentPredicate 过滤文档且可清除恢复；ResourceTagAssignmentModal 的 resourceType/resourceId/canEdit 与源码契约一致。
  - datamate 与 READ_ONLY 模式下相关标签入口按权限隐藏，不出现半写入或 UI 状态不一致。
