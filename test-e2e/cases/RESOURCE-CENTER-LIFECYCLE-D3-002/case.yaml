  - 与新review_id入口落入同一事务，完成结果和发布一致。
  - 明确冲突且不写仓库、不覆盖审核结果，不按最近一条猜测。
  - 全部走共享服务，只写申请快照，原已上架内容保持可用。
  forbidden_side_effects:
  - 不得绕过审核表提前覆盖仓库内容或修改已完成申请。
  - 失败事务不得留下仓库半写入或丢失申请数据。
