  type: INTEGRATION
  priority: P1
  status: blocked
  automation: automated
  objective: 真实服务和数据库验证双写协议，不在D3执行或断言schema迁移。
  preconditions:
  - BLOCKED：目标功能尚未实施；接口、增量迁移、固定脚本和case-local execution绑定是执行前置条件。
  - 在仓库外的隔离测试环境准备run_id及独立租户；禁止使用生产数据或记录密钥。
  - 使用真实产品鉴权、服务和持久层；外部依赖使用受控fixture；不要求真实模型调用。
  test_data:
    database: 由统一环境准备工具提供已迁移的隔离数据库；Case不引用具体SQL文件或执行迁移。
  steps:
  - order: 1
    action: 三类型通过旧申请和MCP修改入口提交
    expected: 全部走共享服务，只写申请快照，原已上架内容保持可用。
  - order: 2
    action: 旧审核入口按仓库ID处理唯一待审申请
    expected: 与新review_id入口落入同一事务，完成结果和发布一致。
  - order: 3
    action: 旧请求无匹配或存在多个授权申请
    expected: 明确冲突且不写仓库、不覆盖审核结果，不按最近一条猜测。
  - order: 4
    action: 三类型通过旧申请和MCP修改入口提交
    expected: 全部走共享服务，只写申请快照，原已上架内容保持可用。
