  objective: CSRF/state replay/provider错误
  preconditions:
  - '- ${NEXENT_TEST_HOME}/config/users.yaml

    - ${NEXENT_TEST_HOME}/config/secrets.env

    - ${NEXENT_TEST_HOME}/config/auth-providers.yaml'
  test_data:
    legacy_asset_declaration: '- ${NEXENT_TEST_HOME}/config/users.yaml

      - ${NEXENT_TEST_HOME}/config/secrets.env

      - ${NEXENT_TEST_HOME}/config/auth-providers.yaml'
  steps:
  - order: 1
    action: 使用本地隔离账号/资源准备“OAuth state/回调劫持”正常基线，记录资源ID和初始状态。
    expected: state不匹配拒绝；pending token单次/过期；不会绑定到错误用户。
  - order: 2
    action: 错误state、重复callback、provider error、pending token复用。
    expected: state不匹配拒绝；pending token单次/过期；不会绑定到错误用户。
  - order: 3
    action: 所有越权/攻击请求必须直接命中真实本地 API/浏览器入口，不能只检查按钮隐藏。
    expected: state不匹配拒绝；pending token单次/过期；不会绑定到错误用户。
  - order: 4
    action: 每个攻击变体执行后重新检查数据库/对象存储/会话状态，确认失败请求无副作用。
    expected: state不匹配拒绝；pending token单次/过期；不会绑定到错误用户。
  - order: 5
    action: 扫描 HTTP 响应、backend/frontend 日志、Playwright trace 中是否出现 secret/内部路径/敏感堆栈。
    expected: state不匹配拒绝；pending token单次/过期；不会绑定到错误用户。
  - order: 6
    action: 保存脱敏请求响应、失败截图/trace（如有UI）、资源前后状态到当次 run 目录。
    expected: state不匹配拒绝；pending token单次/过期；不会绑定到错误用户。
  expected_results:
  - state不匹配拒绝；pending token单次/过期；不会绑定到错误用户。
