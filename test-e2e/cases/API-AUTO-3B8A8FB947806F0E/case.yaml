  contract:
    protocol: HTTP API
    request_expectations:
    - 从 users.yaml/secrets.env 加载 SU/Admin/DEV/UserA/UserB 账号，各自获取 Authorization token；向 aidp_kb_permission_t 插入 kb_private
      与 kb_shared 两条权限 fixture，供后续 403 断言使用。
    - 对 /aidp-mgmt 全部管理端点（GET/knowledge-bases、GET/knowledge-bases/count、POST/knowledge-bases、GET/knowledge-bases/{kds_id}、PUT/knowledge-bases/{kds_id}、DELETE/knowledge-bases/{kds_id}、POST/knowledge-bases/{kds_id}/documents、GET/knowledge-bases/{kds_id}/documents、PATCH/aidp-permissions/{kds_id}、GET/models）逐一发送无
      Authorization 头的请求，断言均返回 401。
    - 携带非法/过期 Authorization token 请求详情端点与列表端点，断言返回 401，且响应体不包含 KB 列表、权限或详情数据。
    - 用 UserB token 请求 GET /knowledge-bases/{不存在的 kds_id}，断言返回 404。
    - 用 UserB token 请求 GET /knowledge-bases/kb_private（PRIVATE 且非 owner），断言返回 403；随后用 UserB token 分别 PUT/ DELETE/ POST-documents
      请求 kb_private，断言均返回 403（require_permission required=EDIT 被拒）。
    - 用 UserA token（USER 角色、kb_shared 的 owner）请求 PATCH /aidp-permissions/kb_shared，body 为 ingroup_permission=EDIT + group_ids=[g_dev]，断言返回
      403。
    - 用 SU token 请求 PATCH /aidp-permissions/kb_shared，body 为 ingroup_permission=EDIT + group_ids=[g_dev]（不含 name/description），断言返回
      200 且 permissions_saved=true；读取 aidp_kb_permission_t 验证 kb_shared 的 ingroup_permission 已更新为 EDIT。
    - 测试结束后清理 kb_private/kb_shared fixture 及本用例产生的临时资源，确保可重复执行。
    response_expectations:
    - 全部管理端点对缺失 Authorization 头、非法 token 均返回 401，不进入业务处理，不泄漏 KB/权限数据。
    - 请求不存在 kds_id 的资源操作返回 404，与 AidpKbNotFoundError 语义一致。
    - 非 owner 用户对 PRIVATE KB 的读/写操作返回 403；非 owner 对共享 KB 的 EDIT 类操作（PUT/DELETE/上传）返回 403，匹配 v7.1 权限矩阵。
    - USER 角色 PATCH 非 PRIVATE 权限返回 403，detail 为 "USER role can only manage PRIVATE personal knowledge bases"。
    - 非 USER 管理角色对共享 KB 配置 EDIT+group_ids（无 metadata）返回 200 且 permissions_saved=true，本地权限行已正确落库。
    - 全程响应与日志中不出现明文 API Key/Token/Password。
