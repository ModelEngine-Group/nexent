  case_id: PW-AGENT-03
  feature_id: V5-PW-AGENT-03
  business_rule_ids:
  - V5-PW-AGENT-03-RULE-01
  title: 工具与技能Tab Tools+Skills选择→autosave→Debug真实调用
  type: E2E
  priority: P0
  status: active
  automation: automated
  objective: 验证工具/技能绑定UI到真实运行。
  preconditions:
  - Test MCP含get_test_code
  - 固定测试Skill
  - 真实LLM支持tool call
  test_data:
    legacy_asset_declaration: config/mcp.yaml；assets/skills/*；config/models.yaml
  steps:
  - order: 1
    action: 进入 /agents 页面，选择 Draft Agent。
    expected: Tool/Skill绑定刷新后不丢。
  - order: 2
    action: 点击「工具与技能」Tab（t('agent.config.tab.toolsSkills')）。
    expected: 真实LLM产生可用tool call且marker正确。
  - order: 3
    action: 在「工具」分区点击「选择工具」，搜索并勾选 get_test_code。
    expected: wire证明真实请求到达。
  - order: 4
    action: 在「技能」分区点击「选择技能」，搜索并绑定固定 Skill。
    expected: wire证明真实请求到达。
  - order: 5
    action: 等待 autosave，切换 Agent 再切回并重新进入「工具与技能」Tab，确认仍选中。
    expected: wire证明真实请求到达。
  - order: 6
    action: 点击 Debug 按钮发送必须调用 Tool 的问题。
    expected: wire证明真实请求到达。
  - order: 7
    action: 等待工具执行 UI 和最终 NX-92831。
    expected: wire证明真实请求到达。
  - order: 8
    action: 发送需要 Skill 指导的问题并等待完成。
    expected: wire证明真实请求到达。
  - order: 9
    action: 关联 Test MCP wire log 确认真实调用。
    expected: wire证明真实请求到达。
  expected_results:
  - Tool/Skill绑定刷新后不丢。
  - 真实LLM产生可用tool call且marker正确。
  - wire证明真实请求到达。
