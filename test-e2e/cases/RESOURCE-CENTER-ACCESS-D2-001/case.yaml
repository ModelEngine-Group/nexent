    - 三个旧URL不影响新URL授权结果；撤销新URL后全部禁用，追加后四Tab均显示；审核范围和决策资格只按既有角色权限规则执行，mine用户无决策，资格不从前端参数推导。
    - 范围只由认证身份及现有角色权限决定，伪造参数400；角色/租户变化清缓存；有审核资格不按提交人过滤，含本人和未知提交人；无审核资格仅匹配本人。
