  risk_type: RELIABILITY
  risk: 执行中断与材料失效导致伪完整检查点或副作用重复
  condition:
  - 独占可终止进程的部署、可控时钟、真实持久目录和测试外部副作用计数器
  metrics:
  - 错误complete数
  - 自动重放/外部副作用重复数
  - 到期材料可读数
  - 跨归属因果接受数
  thresholds:
  - 上述四项均为0；中断未知结果必须明确unknown或缺口
  - 恢复后已确认前缀无丢失/重复，新initial可正常归档
  recovery_expectations:
  - 还原部署/配置/时钟，清理本Case文件及测试外部操作，核验canary和正常新运行。
