schema_version: '1.0'
stage: D3
module: CHAT-MESSAGE
case:
  case_id: CHAT-MODEL-CONTROLS-D3-002
  feature_id: CHAT-MODEL-CONTROLS
  requirement_ids: [CHAT-MODEL-CONTROLS-20261014]
  business_rule_ids: [CHAT-MODEL-CONTROLS-RULE-002, CHAT-MODEL-CONTROLS-RULE-004, CHAT-MODEL-CONTROLS-RULE-005]
  title: 模型失效、流式失败和取消重试不产生串轮副作用
  type: INTEGRATION
  priority: P1
  status: active
  automation: automated
  objective: Prove explicit-model failure and cancel/retry recovery through real runtime boundaries without fallback, late draft writes or cross-turn configuration contamination.
  preconditions:
    - real model lookup, runtime cancellation and event/draft synchronization execute against controlled HTTP provider fixtures.
    - Isolated conversations and valid drafts have recorded original configuration; providers can delay output, fail after streaming begins and record all model calls.
    - Both ordinary Agent and creator preparation use the case-owned MCP address before provider failure or cancellation is injected.
  test_data:
    profile: mock
    paths: [ordinary-workbench, ordinary-agent-chat, nl2agent-direct, nl2agent-workbench, nl2skill-direct, nl2skill-workbench]
    models: [default-A, chosen-B, next-C, deleted-B]
    scenarios: [model-disappears-before-send, post-header-provider-error, delayed-cancel, late-old-event, retry-new-model]
  steps:
    - order: 1
      action: Delete chosen-B before submission; submit an otherwise valid selected-B turn on every applicable path. Restore B with a stale failed connectivity result and verify the actual request is still allowed.
      expected: Preflight rejects selected-B with no provider invocation or draft write and no default-A fallback; original draft/input remain recoverable.
    - order: 2
      action: Restore B, start a valid run and make the provider fail after streaming headers; inspect existing terminal error and the current valid draft state.
      expected: Original stream error/cancellation mechanism releases the running lock; no fabricated successful completion or fallback run; already legitimate saved draft fields are retained.
    - order: 3
      action: Start delayed B generation, cancel it, select C and retry with existing retry/conversation identifiers; deliver a delayed old B event after C starts.
      expected: B stops, C receives the new immutable controls/capacity and only C events update the active turn; no extra logical user turn or late B draft write overwrites C. Native retry preserves existing immutable branch rows at one message index and respects worker-drain admission; creator retry reuses its saved user ID. Old SSE is consumed after C starts and delayed provider responses are released after C where admission allows it.
    - order: 4
      action: Return empty normal-stop responses with strict protocol repair both enabled and disabled; optionally return a visible answer on the second request.
      expected: Exactly two identical physical requests; success recovers once, persistent empty ends with error without protocol repair or another Agent step.
  expected_results:
    - Explicit failure never becomes another model run and keeps recoverable valid state.
    - Provider failure and cancellation unlock the appropriate controls while retaining existing terminal/error protocols and committed valid draft state.
    - Retry uses the new selected model with correct history identifiers and ignores stale prior-turn events.
  forbidden_side_effects:
    - No silent default fallback, duplicate generation, extra logical user-turn persistence or preflight-error writes; retain existing native branch rows.
    - No canceled or failed late event overwrites the new run or another session and no rollback of previously legitimate draft saves.
  integration_boundary: [Actual HTTP routes and tenant model lookup to Agent/NL2 runtime cancellation and SDK provider protocol, Real event routing and draft/history synchronization with only external provider failure/delay substituted]
  observations: [Provider call sequence and selected model identity, Sanitized SSE terminal/error/cancel records, Draft and conversation before/after snapshots, Active turn identifiers and capacity snapshot]
  cleanup: [Stop delayed provider fixtures and clean unique test resources, Retain sanitized failure/cancellation evidence outside the product repository]
  execution:
    profiles: [{name: mock, required_services: [model-provider, http-fixture]}]
  acceptance:
    - id: AC-03
      description: Empty stop has one retry in the unified model layer and never cascades into semantic protocol repair.
      steps: [4]
      expected_results: [1, 2]
      forbidden_side_effects: [1, 2]
    - id: AC-01
      description: Model loss and stream failure recover without fallback or unauthorized state changes.
      steps: [1, 2]
      expected_results: [1, 2]
      forbidden_side_effects: [1]
    - id: AC-02
      description: Cancel and retry isolate turn controls and reject late events while preserving committed state.
      steps: [3]
      expected_results: [3]
      forbidden_side_effects: [2]
