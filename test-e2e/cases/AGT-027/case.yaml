  feature_id: F-060
  business_rule_ids:
  - F-060-RULE-01
  title: 上下文传递、嵌套、空结果/错误、顺序｜异常/边界/越权
  type: AGENT-IT
  priority: P0
  status: active
  automation: automated
  objective: 上下文传递、嵌套、空结果/错误、顺序｜异常/边界/越权
  preconditions:
  - Nexent 本地测试全栈已启动，health check 通过。
  - 设置 NEXENT_TEST_HOME，目录不位于 Nexent Git 仓库内。
  - 当次 run_id 已生成，所有新建资源名称带 run_id；测试基线固定为 develop 473b65268ba8cda3db53be735f97678e214c583b；执行时另记录实际被测commit。
  - 所需本地资产存在且校验通过：${NEXENT_TEST_HOME}/config/models.yaml；${NEXENT_TEST_HOME}/config/secrets.env
  - models.yaml 中本用例所需真实 Provider 已配置，secrets.env 中凭据有效，预检连通性通过。
  test_data:
    legacy_asset_declaration: '- ${NEXENT_TEST_HOME}/config/models.yaml

      - ${NEXENT_TEST_HOME}/config/secrets.env'
  steps:
  - order: 1
    action: 从本地 models.yaml 读取真实 LLM 配置，并准备固定测试 Agent、Prompt、Tool/KB/子Agent 依赖；记录当前 git commit 和 model snapshot。
    expected: 功能结果与代码契约一致，测试过程无未处理异常。
  - order: 2
    action: 通过 Nexent 实际 Agent API 创建/选择测试 Agent，保证配置已保存并可在运行接口中解析到正确 agent_id/model_id。
    expected: 关键状态在 API 返回、数据库/存储和后续读取中保持一致。
  - order: 3
    action: 向真实运行入口发送针对“上下文传递、嵌套、空结果/错误、顺序｜异常/边界/越权”设计的固定问题；监听完整 streaming/SSE 事件直到 completed/stopped/failed。
    expected: 失败路径返回明确错误，不出现半写入、重复副作用或跨租户泄露。
  - order: 4
    action: 保存 run_id、step 序列、tool call、retrieval、子Agent调用和最终回答；不要只以最终文本判断通过。
    expected: 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
  - order: 5
    action: ReAct/Plan/串并行场景检查步骤顺序、状态机、工具名和输入输出；并行场景额外比较子任务时间区间是否真正重叠。
    expected: 真实模型调用成功，stream/Agent run 正常结束；自然语言只做稳定关键词/结构/工具调用断言。
  - order: 6
    action: tool_params/metadata/附件上下文场景检查其在实际 Agent runtime、Tool/MCP/A2A 请求中的最终值和作用域。
    expected: 真实模型调用成功，stream/Agent run 正常结束；自然语言只做稳定关键词/结构/工具调用断言。
  - order: 7
    action: 停止/恢复场景真实触发 cancel/stop，并再次查询会话/运行状态，确认不会继续产生后续 token/step。
    expected: 真实模型调用成功，stream/Agent run 正常结束；自然语言只做稳定关键词/结构/工具调用断言。
  - order: 8
    action: 最终回答只做稳定语义断言：非空、指定 marker/工具结果/引用存在；不得断言整段自然语言逐字一致。
    expected: 真实模型调用成功，stream/Agent run 正常结束；自然语言只做稳定关键词/结构/工具调用断言。
  - order: 9
    action: 检查 Telemetry 中 agent/model/tool/retriever span 与执行过程一致，日志不泄露 secret。
    expected: 真实模型调用成功，stream/Agent run 正常结束；自然语言只做稳定关键词/结构/工具调用断言。
  - order: 10
    action: '删除临时 Agent/会话/附件，保留 run_id 与脱敏 trace 到当次结果目录。

      补充异常断言：对本用例涉及的非法/失败条件至少重复一次，确认重试不会产生重复资源、脏状态或权限绕过。'
    expected: 真实模型调用成功，stream/Agent run 正常结束；自然语言只做稳定关键词/结构/工具调用断言。
  expected_results:
  - 功能结果与代码契约一致，测试过程无未处理异常。
  - 关键状态在 API 返回、数据库/存储和后续读取中保持一致。
  - 失败路径返回明确错误，不出现半写入、重复副作用或跨租户泄露。
  - 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
  - 真实模型调用成功，stream/Agent run 正常结束；自然语言只做稳定关键词/结构/工具调用断言。
  forbidden_side_effects: []
