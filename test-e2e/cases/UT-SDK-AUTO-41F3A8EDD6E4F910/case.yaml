  assertions:
  - start() 后 state == ManagerState.RUNNING，_executors 仅含 lane "a"、"b" 两个独立的 BoundedExecutor 对象。
  - lane "a"（max_workers=1）中 A1 进入 RUNNING 后，A2 保持 QUEUED，未被提前执行。
  - 释放 A1 后 A2 才运行，执行顺序严格为 A1→A2，符合同 Lane FIFO 排队语义。
  - lane "b" 的 B1 与 lane "a" 的任务互不阻塞，证明不同 Lane 使用独立 executor 隔离调度。
