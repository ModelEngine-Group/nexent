  title: Skill来源持久化、多副本及引用保护
  type: INTEGRATION
  priority: P1
  status: blocked
  automation: automated
  objective: Skill来源持久化、多副本及引用保护
  preconditions:
  - BLOCKED：目标功能尚未实施；接口、增量迁移、固定脚本和case-local execution绑定是执行前置条件。
  - 在仓库外的隔离测试环境准备run_id及独立租户；禁止使用生产数据或记录密钥。
  - 使用真实产品鉴权、服务和持久层；外部依赖使用受控fixture；不要求真实模型调用。
  test_data: {}
  steps:
  - order: 1
    action: 从两个同名仓库Skill安装到真实SkillInfo，第二次同源用重命名创建副本
    expected: 各副本持久化正确source_repository_id；同源多副本可区分；下载累计按既有成功规则增加，冲突失败不增加。
  - order: 2
    action: 给一个副本加Agent引用，另建只读/历史无来源副本；查询跨用户及跨租户可见列表
    expected: 只返回当前用户有权看到的副本，历史未知不猜测；引用副本保留删除保护，只读副本不可卸载。
  - order: 3
    action: 卸载无引用且可编辑的特定skill_id，重新读源条目与其余副本
    expected: 仅目标本地副本被删除，原仓库与其他副本及累计下载数不变；引用保护失败返回原服务错误且不半删。
  expected_results:
  - 各副本持久化正确source_repository_id；同源多副本可区分；下载累计按既有成功规则增加，冲突失败不增加。
  - 只返回当前用户有权看到的副本，历史未知不猜测；引用副本保留删除保护，只读副本不可卸载。
  - 仅目标本地副本被删除，原仓库与其他副本及累计下载数不变；引用保护失败返回原服务错误且不半删。
  forbidden_side_effects:
  - 不得为了卸载便利解除已有Agent引用。
  - 不得减少累计下载量或误删同名来源。
