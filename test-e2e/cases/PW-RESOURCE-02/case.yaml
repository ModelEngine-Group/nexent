    legacy_row: 8
  actor: Nexent browser user
  journey:
  - 选择测试租户→Groups Tab，创建run_id组。
  - 打开组并设置当前可编辑成员/默认属性。
  - 切Invitations创建run_id邀请码。
  - 独立Context用邀请码注册新用户并登录。
  - 管理员切Users Tab搜索新用户。
  - 通过当前入口把用户加入组或调整角色。
  - 新用户Context刷新，确认权限/UI变化。
  - 管理员移除成员/删除Group/撤销剩余邀请码。
  final_business_result:
  - 组/邀请码/用户关系刷新后存在。
  - 角色/组变更影响用户可见操作。
  - 邀请用户进入目标租户。
