schema_version: '1.0'
stage: D4
module: CHAT-WORKBENCH
case:
  case_id: WB-CONTROLS-D4-005
  feature_id: WB-CONTROLS
  requirement_ids:
  - WB-SHARED-SELECTORS-20261019
  business_rule_ids:
  - WB-CONTROLS-RULE-006
  title: Shared configuration resource controls in Workbench
  type: E2E
  priority: P1
  status: active
  automation: automated
  objective: Verify resource selection through actual Workbench UI with controlled API responses.
  preconditions:
  - Local frontend available with authorized mock user and internal resources.
  test_data:
    profile: mock
  steps:
  - order: 1
    action: Open each Workbench resource drawer and verify shared controls, source tabs, list/pagination geometry, search
      and page-size selection.
    expected: Shared search, selected region, list heading, content and pagination render; Mine/Repository only for Agent/Skill.
      Footer contains only shared Close/Confirm actions; no retrieval/default controls. Default page size is 10 with exactly 10/20/50 options and actual slicing. No management/edit actions. Agent uses shared configuration cards with icons/version; Skill/Knowledge retain compact lists. All three headers expose shared Refresh/Select-all controls; refresh preserves draft and select-all only affects compatible visible items. Knowledge includes configuration metadata. List scroll and fixed pagination
      survive empty search, paging and narrow/short viewports.
  - order: 2
    action: Cancel an Agent draft, reopen, select, filter, switch sources and confirm; inspect Skill source tabs and narrow
      knowledge drawer.
    expected: Cancel discards only pending selection; confirmed Agent mounts, filtering and source switches retain draft,
      no real import/install/edit is triggered.
  expected_results:
  - Resource drawers preserve selections only on confirmation and retain source and filter controls.
  forbidden_side_effects:
  - No external Agent selection or unintended resource creation on open or cancel.
  actor: Authorized mock tenant user
  journey:
  - Open Workbench
  - Inspect direct triggers
  - Cancel draft
  - Confirm internal resource
  - Inspect filtering and repository
  final_business_result:
  - Internal resources can be chosen from drawers without accidental mounts.
  failure_evidence:
  - Browser trace and assertion screenshot.
  execution:
    profiles:
    - name: mock
      required_services: []
  acceptance:
  - id: AC-01
    description: Shared controls, browser geometry, draft isolation and forbidden resource writes.
    steps:
    - 1
    - 2
    expected_results:
    - 1
    forbidden_side_effects:
    - 1
