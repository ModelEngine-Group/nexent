schema_version: '1.0'
stage: D4
module: AGENT-REPO
case:
  case_id: AGENT-REPO-SORT-MAIN-TAG-D4-001
  feature_id: AGENT-REPO-SORT-MAIN-TAG
  requirement_ids:
  - AGENT-REPO-SORT-MAIN-TAG-20261013
  business_rule_ids:
  - AGENT-REPO-SORT-MAIN-TAG-RULE-001
  - AGENT-REPO-SORT-MAIN-TAG-RULE-002
  - AGENT-REPO-SORT-MAIN-TAG-RULE-003
  - AGENT-REPO-SORT-MAIN-TAG-RULE-004
  - AGENT-REPO-SORT-MAIN-TAG-RULE-005
  title: Sort listings by publish time, badge main agents on both tabs and search agents by tag
  type: E2E
  priority: P1
  status: active
  automation: automated
  objective: >-
    On the repository tab and on the my-agents tab, choosing the latest-published order forwards the
    publish-time sort flag and renders dated listings newest first with the undated listing last; every
    listing card separates a main agent from an ordinary agent on both tabs; and the agent management page
    searches by tag, renders a tag that arrived as a stringified array without crashing, and narrows its
    list through the tag filter, which combines with the text query and clears; a sort change while the
    list sits on a later page returns the list to the first page under the newly selected order.
  preconditions:
  - >-
    A running frontend is reachable, and deterministic HTTP fixtures isolate the repository listings, the
    default tag library and the agent list so no live tenant or provider data is required; the agent list
    spans more than one page at the frozen viewport so paging behaviour is observable.
  test_data:
    profile: mock
    locale: zh
    viewport:
      width: 1920
      height: 1080
    repository_titles:
    - 仓库智能体一
    - 仓库智能体二
    - 仓库智能体三
    tag_search_keyword: d4_key
    tag_search_value: d4_value
    stringified_tag_payload: "['d4_value', 'd4_extra']"
    agent_list_rows: 15
    agent_list_page_size: 12
  steps:
  - order: 1
    action: Open the agent repository and choose the latest-published option in the sort control.
    expected: >-
      The listings request carries the publish-time sort flag and the dated listings render newest first with
      the undated listing last, while the untouched default request carries no such flag.
  - order: 2
    action: Inspect the badge on the rendered repository listing cards.
    expected: >-
      The main-agent listing shows the amber main-agent badge while the ordinary listing with no version
      label shows no such badge.
  - order: 3
    action: Search the agent management page by a tag keyword.
    expected: >-
      The list request carries the tag search predicates, the tag-matched agent renders the recovered tag
      value and never the raw stringified array, and the list stays usable.
  - order: 4
    action: Open the my-agents tab of the agent space and choose the latest-published option in the sort control.
    expected: >-
      The my-agents list request carries the publish-time sort flag and the my-agents listings render newest
      published first, and only the main-agent listing shows the amber main-agent badge while the ordinary
      listing shows none.
  - order: 5
    action: Open the tag filter on the agent management page and select the fixture tag value.
    expected: >-
      The list request carries the tag filter predicates, the list narrows to the tag-matched agent only,
      and the recovered tag renders without the raw stringified array.
  - order: 6
    action: >-
      With the tag filter still active, type the title of an untagged agent into the search box, then clear
      the tag filter.
    expected: >-
      The active tag filter and the text query combine as an intersection so no listing remains, and
      clearing the tag filter restores the query-only result.
  - order: 7
    action: On the my-agents tab move to the second page and then choose the latest-published option.
    expected: >-
      The list request returns to the first page and carries the publish-time sort flag, and the listings
      render in the newest-published order.
  expected_results:
  - >-
    The latest-published order is forwarded to the listings endpoint and dated listings render newest first
    with the undated listing last.
  - >-
    A main-agent listing and an ordinary listing are visually distinguished by the amber main-agent badge.
  - >-
    Searching by tag on the agent management page returns the tag-matched agent and renders a tag that
    arrived as a stringified array as an individual tag.
  - >-
    On the my-agents tab the latest-published order is forwarded, the my-agents listings render newest
    published first, and only the main-agent listing carries the amber main-agent badge.
  - >-
    The tag filter on the agent management page forwards its predicates, narrows the list to the
    tag-matched agents and renders the recovered tag instead of the raw stringified array.
  - >-
    The tag filter and the text query act as an intersection, and clearing the tag filter restores the
    query-only result.
  - >-
    Changing the sort option while the list sits on a later page requests the first page under the newly
    selected order.
  forbidden_side_effects:
  - >-
    No unrelated writes, publication, installation or Agent/model execution; browsing, sorting and searching
    only read data.
  actor: Authorized tenant user browsing the agent repository and the agent management page
  journey:
  - Open the agent repository and choose the latest-published option in the sort control.
  - Inspect the badge on the rendered repository listing cards.
  - Search the agent management page by a tag keyword.
  - Open the my-agents tab and choose the latest-published option in its sort control.
  - Narrow the agent management list with the tag filter and select the fixture tag value.
  - Intersect the active tag filter with a text query and then clear the tag filter.
  - Move the my-agents list to the second page and change its sort option.
  final_business_result:
  - >-
    The latest-published order is forwarded to the listings endpoint and dated listings render newest first
    with the undated listing last.
  - >-
    A main-agent listing and an ordinary listing are visually distinguished by the amber main-agent badge.
  - >-
    Searching by tag on the agent management page returns the tag-matched agent and renders a tag that
    arrived as a stringified array as an individual tag.
  - >-
    On the my-agents tab the latest-published order is forwarded, the my-agents listings render newest
    published first, and only the main-agent listing carries the amber main-agent badge.
  - >-
    The tag filter on the agent management page forwards its predicates, narrows the list to the
    tag-matched agents and renders the recovered tag instead of the raw stringified array.
  - >-
    The tag filter and the text query act as an intersection, and clearing the tag filter restores the
    query-only result.
  - >-
    Changing the sort option while the list sits on a later page requests the first page under the newly
    selected order.
  failure_evidence:
  - Fixed Playwright journey assertions, sanitized request payloads and terminal audit.
  acceptance:
  - id: AC-01
    description: >-
      On both the repository tab and the my-agents tab the sort control forwards the latest-published order
      and renders dated listings newest published first with the undated listing last; listing cards on both
      tabs distinguish a main agent from an ordinary agent; and the agent management page searches by tag and
      renders a tag that arrived as a stringified array without crashing, narrows its list through the tag
      filter which intersects with the text query and clears, and returns to the first page when the sort
      option changes while the list sits on a later page.
    steps:
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
    expected_results:
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
    forbidden_side_effects:
    - 1
