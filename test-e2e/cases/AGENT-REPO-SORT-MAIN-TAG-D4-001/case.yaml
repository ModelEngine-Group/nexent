schema_version: '1.0'
stage: D4
module: AGENT-REPO
case:
  case_id: AGENT-REPO-SORT-MAIN-TAG-D4-001
  feature_id: AGENT-REPO-SORT-MAIN-TAG
  requirement_ids:
  - AGENT-REPO-SORT-MAIN-TAG-20261013
  - AGENT-REPOSITORY-REMOVE-SORT
  business_rule_ids:
  - AGENT-REPO-SORT-MAIN-TAG-RULE-001
  - AGENT-REPO-SORT-MAIN-TAG-RULE-002
  - AGENT-REPO-SORT-MAIN-TAG-RULE-003
  - AGENT-REPO-SORT-MAIN-TAG-RULE-004
  - AGENT-REPO-SORT-MAIN-TAG-RULE-005
  title: Browse the default repository order, distinguish main agents, and search agents by tag
  type: E2E
  priority: P1
  status: active
  automation: automated
  objective: >-
    The agent repository uses its default order without a sort selector, including when opened from a legacy sort link.
    Listings still paginate and distinguish main agents from ordinary agents. The agent management page still searches
    by tag and combines the tag filter with the text query.
  preconditions:
  - >-
    A running frontend is reachable, and deterministic HTTP fixtures isolate the repository listings, the
    default tag library and the agent list so no live tenant or provider data is required; the repository
    listings span more than one page at the frozen viewport so paging behaviour is observable.
  test_data:
    profile: mock
    locale: zh
    viewport:
      width: 1920
      height: 1080
    repository_titles:
    - 仓库智能体一
    - 仓库智能体二
    - 仓库智能体三
    repository_listing_rows: 13
    repository_page_size: 12
    tag_search_keyword: d4_key
    tag_search_value: d4_value
    stringified_tag_payload: "['d4_value', 'd4_extra']"
  steps:
  - order: 1
    action: Open the agent tab of the unified resource repository page.
    expected: No sort selector is shown and the API request leaves the order at its default.
  - order: 2
    action: Inspect the rendered repository listing cards.
    expected: >-
      The main-agent listing shows the main-agent marker while the ordinary listing shows the ordinary-agent
      marker and no main-agent marker.
  - order: 3
    action: Search the agent management page by a tag keyword.
    expected: >-
      The list request carries the tag search predicates, the tag-matched agent renders the recovered tag
      value and never the raw stringified array, and the list stays usable.
  - order: 4
    action: Open the tag filter on the agent management page and select the fixture tag value.
    expected: >-
      The list request carries the tag filter predicates, the list narrows to the tag-matched agent only,
      and the recovered tag renders without the raw stringified array.
  - order: 5
    action: >-
      With the tag filter still active, type the title of an untagged agent into the search box, then clear
      the tag filter.
    expected: >-
      The active tag filter and the text query combine as an intersection so no listing remains, and
      clearing the tag filter restores the query-only result.
  - order: 6
    action: Open the repository with a legacy copies-sort URL and move to page two.
    expected: The second page renders without sending any sort flags.
  expected_results:
  - The sort selector is absent, and legacy sort parameters do not change the list request or default order.
  - >-
    A main-agent listing and an ordinary listing are visually distinguished by their main-agent and
    ordinary-agent markers.
  - >-
    Searching by tag on the agent management page returns the tag-matched agent and renders a tag that
    arrived as a stringified array as an individual tag.
  - >-
    The tag filter on the agent management page forwards its predicates, narrows the list to the
    tag-matched agents and renders the recovered tag instead of the raw stringified array.
  - >-
    The tag filter and the text query act as an intersection, and clearing the tag filter restores the
    query-only result.
  - Pagination continues to load the requested page in the default order.
  forbidden_side_effects:
  - >-
    No unrelated writes, publication, installation or Agent/model execution; browsing, paging and searching
    only read data.
  actor: Authorized tenant user browsing the unified resource repository and the agent management page
  journey:
  - Open the agent tab of the unified resource repository page and inspect the toolbar and default results.
  - Inspect the main-agent and ordinary-agent markers on the rendered repository listing cards.
  - Search the agent management page by a tag keyword.
  - Narrow the agent management list with the tag filter and select the fixture tag value.
  - Intersect the active tag filter with a text query and then clear the tag filter.
  - Open a legacy copies-sort URL and move the repository list to the second page.
  final_business_result:
  - The sort selector is absent, and legacy sort parameters do not change the list request or default order.
  - >-
    A main-agent listing and an ordinary listing are visually distinguished by their main-agent and
    ordinary-agent markers.
  - >-
    Searching by tag on the agent management page returns the tag-matched agent and renders a tag that
    arrived as a stringified array as an individual tag.
  - >-
    The tag filter on the agent management page forwards its predicates, narrows the list to the
    tag-matched agents and renders the recovered tag instead of the raw stringified array.
  - >-
    The tag filter and the text query act as an intersection, and clearing the tag filter restores the
    query-only result.
  - Pagination continues to load the requested page in the default order.
  failure_evidence:
  - Fixed Playwright journey assertions, sanitized request payloads and terminal audit.
  acceptance:
  - id: AC-01
    description: >-
      The repository uses its default order with no sort selector, ignores legacy sort links, paginates, and
      distinguishes main agents. The agent management page recovers stringified tags and combines tag filtering
      with the text query.
    steps:
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    expected_results:
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    forbidden_side_effects:
    - 1
