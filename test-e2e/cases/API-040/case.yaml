schema_version: '1.0'
stage: D2
module: V5-BASELINE
case:
  case_id: API-040
  feature_id: F-026
  business_rule_ids:
  - F-026-RULE-01
  title: 平台 overview/capacity 设置删除与分配冲突｜核心流程
  type: API-IT
  priority: P0
  status: active
  automation: automated
  objective: 平台 overview/capacity 设置删除与分配冲突｜核心流程
  preconditions:
  - Nexent 本地测试全栈已启动，health check 通过。
  - 设置 NEXENT_TEST_HOME，目录不位于 Nexent Git 仓库内。
  - 当次 run_id 已生成，所有新建资源名称带 run_id；测试基线固定为 develop 当前批次锁定的产品提交；执行时另记录实际被测commit。
  - 所需本地资产存在且校验通过：${NEXENT_TEST_HOME}/config/users.yaml；${NEXENT_TEST_HOME}/config/secrets.env
  - users.yaml 中 SU/Admin/UserA/UserB 等隔离账号可登录，测试租户数据可被清理。
  test_data:
    legacy_asset_declaration: '- ${NEXENT_TEST_HOME}/config/users.yaml

      - ${NEXENT_TEST_HOME}/config/secrets.env'
  steps:
  - order: 1
    action: 从 config/users.yaml 准备 SU/ASSET_OWNER、TenantA、TenantB 隔离账号，所有测试资源带 RunID 前缀，并记录初始无 platform capacity 声明时的 overview
      基线。
    expected: 功能结果与代码契约一致，测试过程无未处理异常。
  - order: 2
    action: 以 SU/ASSET_OWNER 角色调用 PUT /platform/quota/capacity 声明平台容量（capacity_gb），随后 GET /platform/quota/overview 核对 platform_capacity_bytes/readable、total_allocated_bytes、remaining_allocatable_bytes、allocation_percentage。
    expected: 关键状态在 API 返回、数据库/存储和后续读取中保持一致。
  - order: 3
    action: 调用 PUT /platform/quota/tenants/{tenant_id} 为 TenantA/TenantB 设置 hard_limit（hard_limit_gb 或 hard_limit_mb），再次 GET
      overview 核对 total_allocated_bytes 累加、remaining_allocatable_bytes 相应递减。
    expected: 失败路径返回明确错误，不出现半写入、重复副作用或跨租户泄露。
  - order: 4
    action: GET /platform/quota/overview 逐租户核对 actual_bytes/actual_readable 与平台 total_actual_bytes/total_actual_readable 仅统计源文件账本；核对
      es_physical_bytes/es_physical_readable 与 total_es_physical_bytes/total_es_physical_readable 独立返回且不并入 actual/total_actual。
    expected: 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
  - order: 5
    action: 验证 ES 物理量不参与分配：改变租户 ES 物理索引大小（写入或触发 segment 回收）后，确认 remaining_allocatable_bytes、oversubscription_ratio、allocation_percentage
      与 total_actual_bytes 不受影响。
    expected: GET /platform/quota/overview 返回平台级 total_es_physical_bytes/total_es_physical_readable 与每租户 es_physical_bytes/es_physical_readable；total_actual_bytes
      与各租户 actual_bytes 仅反映源文件账本，不包含 ES 物理容量。
  - order: 6
    action: 验证分配冲突：下调 capacity 至低于 total_allocated_bytes 返回 409+PlatformCapacityBelowAllocation；设置租户 hard_limit 低于其 actual
      usage 返回 409+TenantQuotaBelowUsage；超出剩余平台容量返回 409+PlatformCapacityExceeded；冲突均不产生半写入且不影响其他租户。
    expected: 分配冲突按源文件账本口径计算：capacity 低于 total_allocated_bytes 返回 409+PlatformCapacityBelowAllocation，租户 hard_limit 低于 actual
      usage 返回 409+TenantQuotaBelowUsage，超出平台剩余容量返回 409+PlatformCapacityExceeded。
  - order: 7
    action: 使用不同角色重复读取 overview 与写入操作，确认 SU/ASSET_OWNER/SPEED 可操作、普通用户返回 403，且 tenant scope 不跨租户泄露。
    expected: ES 物理索引大小变化不影响 remaining_allocatable_bytes、oversubscription_ratio、allocation_percentage 及 actual/total_actual
      的计算。
  - order: 8
    action: 调用 DELETE /platform/quota/capacity 与 DELETE /platform/quota/tenants/{tenant_id}，GET overview 确认 platform_capacity_bytes=None、对应
      hard_limit_bytes=None 且无孤儿配置。
    expected: ES 物理索引大小变化不影响 remaining_allocatable_bytes、oversubscription_ratio、allocation_percentage 及 actual/total_actual
      的计算。
  - order: 9
    action: 清理当次创建/修改的租户、配额与 capacity 配置。
    expected: ES 物理索引大小变化不影响 remaining_allocatable_bytes、oversubscription_ratio、allocation_percentage 及 actual/total_actual
      的计算。
  expected_results:
  - 功能结果与代码契约一致，测试过程无未处理异常。
  - 关键状态在 API 返回、数据库/存储和后续读取中保持一致。
  - 失败路径返回明确错误，不出现半写入、重复副作用或跨租户泄露。
  - 日志、Trace、报告中不出现明文 API Key/Token/Password/模型密钥。
  - GET /platform/quota/overview 返回平台级 total_es_physical_bytes/total_es_physical_readable 与每租户 es_physical_bytes/es_physical_readable；total_actual_bytes
    与各租户 actual_bytes 仅反映源文件账本，不包含 ES 物理容量。
  - 分配冲突按源文件账本口径计算：capacity 低于 total_allocated_bytes 返回 409+PlatformCapacityBelowAllocation，租户 hard_limit 低于 actual usage
    返回 409+TenantQuotaBelowUsage，超出平台剩余容量返回 409+PlatformCapacityExceeded。
  - ES 物理索引大小变化不影响 remaining_allocatable_bytes、oversubscription_ratio、allocation_percentage 及 actual/total_actual 的计算。
  forbidden_side_effects: []
