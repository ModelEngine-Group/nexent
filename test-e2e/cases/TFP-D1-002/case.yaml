schema_version: '1.0'
stage: D1
module: RUNTIME-SANDBOX
case:
  case_id: TFP-D1-002
  feature_id: TFP-001
  requirement_ids:
  - TFP-001
  business_rule_ids:
  - TFP-RULE-002
  title: Full-step admission prevents partial local execution
  type: SDK-UT
  priority: P0
  status: active
  automation: automated
  objective: Full-step admission prevents partial local execution
  preconditions:
  - Use isolated official tool instances and a controlled executor factory.
  test_data:
    profile: mock
  steps:
  - order: 1
    action: Submit a tool call followed by an unapproved import, an unapproved call or a bare data expression outside assignment
      and call arguments.
    expected: The whole step is delegated before any local call.
  - order: 2
    action: An aidp_search step followed by ordinary code makes no provider request before whole-step delegation.
    expected: The existing AIDP authorization and complete-step routing contract is preserved.
  - order: 3
    action: Submit JSON imports and tool calls mixed with file-oriented JSON operations, unapproved members, wildcard/relative/dynamic
      imports or ordinary Python syntax.
    expected: Delegate the entire source before executing any local import or tool.
  expected_results: &id001
  - Mixed code is passed once to the original executor.
  - Admitted JSON statements do not cause partial execution of rejected mixed steps.
  - No approved tool is called by the fast path before delegation.
  - An aidp_search step followed by ordinary code makes no provider request before whole-step delegation.
  forbidden_side_effects:
  - No partial execution or tool replay.
  unit_boundary: Restricted AST admission, real LocalPythonExecutor and NexentAgent executor lifecycle
  inputs:
  - Full-step admission prevents partial local execution
  assertions: *id001
