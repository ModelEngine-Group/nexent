  contract:
    protocol: HTTP API
    request_expectations:
    - 从 config/users.yaml 读取隔离测试账号（至少一个 USER 角色 UserA 与一个 Admin），密码/Token 仅从 secrets.env 注入；从 config/models.yaml 获取有效 embedding_model_id。
    - USER 角色调用 POST /indices/{index_name}（index_name 作为用户可见 KB 名称，带 RunID 前缀），请求体显式携带 ingroup_permission=EDIT 与 group_ids=[<组ID>]，记录响应状态与返回的
      index_name。
    - 重新读取该 KB 记录（GET /indices 列表/详情），断言 ingroup_permission 被强制为 PRIVATE 且 group_ids 被清空为 None。
    - USER 角色调用 PATCH /indices/{index_name} 携带 ingroup_permission=EDIT，试图将 PRIVATE 个人 KB 转为共享，记录响应状态与错误信息。
    - USER 角色调用 PATCH /indices/{index_name} 携带 group_ids=[<组ID>]，断言被拒绝且 KB 记录 group_ids 仍为 None。
    - 使用 Admin 账号创建一个 ingroup_permission=EDIT（或 READ_ONLY）的共享 KB，再以 USER 角色 PATCH 该共享 KB，断言被拒绝。
    - 每次被拒绝后重新读取 KB 记录，确认未发生半写入、权限状态未被改变。
    - 清理当次创建的 KB 与测试资源，确认无脏状态残留。
    response_expectations:
    - USER 创建 KB 返回成功，且持久化记录的 ingroup_permission 强制为 PRIVATE、group_ids 清空为 None，不因请求体传入的共享权限/组参数而改变。
    - USER 更新自身 PRIVATE 个人 KB 时，将 ingroup_permission 改为 EDIT/READ_ONLY 被拒绝，抛出 PermissionError（"USER role cannot turn a personal
      knowledge base into a shared knowledge base"），记录仍为 PRIVATE。
    - USER 更新时携带 group_ids 被拒绝，抛出 PermissionError（"USER role cannot assign groups to a personal knowledge base"），记录 group_ids
      不变。
    - USER 更新非 PRIVATE（共享）KB 被拒绝，抛出 PermissionError（"USER role can only manage PRIVATE personal knowledge bases"）。
    - 失败路径不产生半写入、重复副作用或跨租户泄露；日志、报告中不出现明文 API Key/Token/Password/模型密钥。
