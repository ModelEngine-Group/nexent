  unit_boundary: 前端流式状态
  inputs:
  - '- ${NEXENT_TEST_HOME}/config/models.yaml

    - ${NEXENT_TEST_HOME}/config/secrets.env'
  assertions:
  - parse 数据块渲染为 ExecutionCodeBlock：标题「Executed code」、默认展开、python 高亮；空/非字符串 code 返回 null 不渲染。
  - completeTrailingToolCalls 仅将尾部连续 tool-call 置 complete 并置 result=""，跨非工具 part 或 incomplete 的调用不受影响；空「Result:」段被隐藏。
  - warning 渲染为灰色告警框（formatWarningText 仅保留末尾异常、line-clamp-3 截断），error 渲染为红色错误框；存在 final_answer 时 error 提升为 warning。
  - history_summary 渲染为 compacting spinner 或 accepted 折叠摘要，idle 移除摘要。
  - 流式与历史消息均剥离 ANSI 控制序列（stripAnsiControlSequences）。
  - Markdown del 渲染为 span（strikethrough sanitization）。
  - 引用角标按 toolSign+citeIndex 组合 key 匹配，句级点击高亮 scope 正确，纯数字旧角标向后兼容；selectedCitationKey / citationContext 正确传递。
  - 模型选择器仅展示 available 模型并回退首个可用模型，非 available 模型不展示。
  - landing 选择 agent 写入线程元数据并 switchToNewThread，跨会话保留 agentId。
  - 测试过程无未处理异常；日志/报告不出现明文 API Key/Token/Password；组件渲染与上述契约一致。
