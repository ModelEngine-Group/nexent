schema_version: '1.0'
stage: D4
module: V5-BASELINE
case:
  case_id: PW-A2A-PUBLISH-01
  feature_id: V5-PW-A2A-PUBLISH-01
  business_rule_ids:
  - V5-PW-A2A-PUBLISH-01-RULE-01
  title: 本地Agent发布为A2A→外部发现/调用Smoke
  type: E2E
  priority: P0
  status: active
  automation: automated
  objective: 本地Agent发布为A2A→外部发现/调用Smoke
  preconditions:
  - 配置真实 LLM 和本地身份，真实 Nexent 服务与 Agent 编辑页面可用。
  - 北向服务地址读取统一配置，NORTHBOUND_EXTERNAL_URL 已配置，运行依赖（runtime、Redis、MinIO）就绪，不依赖 A2A Mock。
  - 本次隔离 Agent 可编辑；独立客户端可访问配置的服务。
  test_data:
    configuration: config/environment.yaml; config/models.yaml; config/users.yaml
    ownership: 动态资源 ID、本次唯一 nonce，凭据不存入用例。
  steps:
  - order: 1
    action: Create a valid owned agent, publish an ordinary version and open publication before enabling A2A.
    expected: Real settings request returns 404; publication displays A2A not-enabled guidance and no endpoint fields.
  - order: 2
    action: 通过 UI 启用 A2A 并等待 autosave
    expected: is_a2a 持久化成功
  - order: 3
    action: 通过 UI 发布唯一版本
    expected: 返回本次动态 A2A endpoint_id 和 version_no
  - order: 4
    action: 读取该 Agent A2A 设置
    expected: Registration matches the published version and the publication page shows its Agent Card URL, development
      links and advertised REST/JSON-RPC interfaces.
  - order: 5
    action: 独立外部客户端实际发现卡片
    expected: 真实 Northbound 返回已发布 Agent Card
  - order: 6
    action: 检查已发布 endpoint 和版本
    expected: 卡片接口引用当前 endpoint，版本一致
  - order: 7
    action: 外部客户端认证调用已发布 Agent，不携带Message.metadata且不启用allow_chat_metadata。
    expected: 真实模型回答含本次 marker；不因隐式空metadata触发权限拒绝，不重新生成已有 API Key。
  - order: 8
    action: Temporarily abort only the owned agent settings request, reopen publication, then restore transport
      and retry.
    expected: A genuine request failure shows a retry action; retry restores the same registered endpoint.
  expected_results: &id001
  - 发布与 Agent/version 绑定一致
  - 外部真实发现和调用均成功
  - Unregistered A2A 404 is guidance; registered endpoint details are accurate and transport failure recovers on
    retry.
  forbidden_side_effects:
  - 不复用固定 Agent ID，不重新生成已有 API Key，不把模拟浏览器结果计为真实调用。
  source:
    legacy_workbook_sha256: aa4b32414d30f12b3b64e14236268145e556bd7cfc5d3eb8df80731608ebc022
    legacy_sheet: 03_Playwright_Journey
    legacy_row: 34
  actor: Nexent browser test administrator and independent A2A client
  journey:
  - Create a valid owned agent, publish an ordinary version and open publication before enabling A2A.
  - 通过 UI 启用 A2A 并等待 autosave
  - 通过 UI 发布唯一版本
  - 读取该 Agent A2A 设置
  - 独立外部客户端实际发现卡片
  - 检查已发布 endpoint 和版本
  - 外部客户端认证调用已发布 Agent，不携带Message.metadata且不启用allow_chat_metadata。
  - Temporarily abort only the owned agent settings request, reopen publication, then restore transport and retry.
  final_business_result: *id001
  acceptance:
  - id: AC-01
    description: 本次隔离 Agent 通过 UI 开启 A2A 并发布，登记信息和北向卡片对应同一 endpoint 与版本。
    steps:
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    expected_results:
    - 1
    forbidden_side_effects:
    - 1
  - id: AC-02
    description: 独立客户端不携带Message.metadata、不启用allow_chat_metadata，通过真实北向接口认证调用已发布Agent，真实模型回复包含本次唯一标记；不把HTTP 200错误文本当成功。
    steps:
    - 7
    expected_results:
    - 2
    forbidden_side_effects:
    - 1
  - id: AC-03
    description: Unregistered A2A 404 is guidance; registered endpoint details are accurate and transport failure
      recovers on retry.
    steps:
    - 1
    - 4
    - 8
    expected_results:
    - 3
    forbidden_side_effects:
    - 1
  failure_evidence:
  - 本地 assertions.json、events.jsonl、失败截图及 Trace；成功不留截图与 Trace。
