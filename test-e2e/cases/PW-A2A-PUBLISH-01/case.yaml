schema_version: '1.0'
stage: D4
module: V5-BASELINE
case:
  case_id: PW-A2A-PUBLISH-01
  feature_id: V5-PW-A2A-PUBLISH-01
  business_rule_ids: [V5-PW-A2A-PUBLISH-01-RULE-01]
  title: 本地Agent发布为A2A→外部发现/调用Smoke
  type: E2E
  priority: P0
  status: active
  automation: automated
  objective: 本地Agent发布为A2A→外部发现/调用Smoke
  preconditions:
  - 受控 A2A Mock 与所需真实 Nexent 服务就绪，无其他批次故障。
  - 配置真实 LLM 和本地身份，地址读取统一配置。
  - 本次隔离 Agent 可编辑；独立客户端可访问配置的服务。
  test_data:
    configuration: config/a2a.yaml; config/models.yaml; config/users.yaml
    ownership: 动态资源 ID、本次唯一 nonce，凭据不存入用例。
  steps:
  - order: 1
    action: 创建完整隔离 Agent 并进入 Advanced 发布属性
    expected: 有效模型、提示词、描述和作者已配置
  - order: 2
    action: 通过 UI 启用 A2A 并等待 autosave
    expected: is_a2a 持久化成功
  - order: 3
    action: 通过 UI 发布唯一版本
    expected: 返回本次动态 A2A endpoint_id 和 version_no
  - order: 4
    action: 读取该 Agent A2A 设置
    expected: 登记的 Agent 与发布版本一致
  - order: 5
    action: 独立外部客户端实际发现卡片
    expected: 真实 Northbound 返回已发布 Agent Card
  - order: 6
    action: 检查已发布 endpoint 和版本
    expected: 卡片接口引用当前 endpoint，版本一致
  - order: 7
    action: 外部客户端认证调用已发布 Agent
    expected: 真实模型回答含本次 marker；不重新生成已有 API Key
  - order: 8
    action: 停用本次端点并再次发现
    expected: 发现返回 404；不修改其他 Agent
  expected_results:
  - 发布与 Agent/version 绑定一致
  - 外部真实发现和调用均成功
  - 停用状态真实生效
  forbidden_side_effects:
  - 不复用固定 Agent ID，不重新生成已有 API Key，不把模拟浏览器结果计为真实调用。
  source:
    legacy_workbook_sha256: aa4b32414d30f12b3b64e14236268145e556bd7cfc5d3eb8df80731608ebc022
    legacy_sheet: 03_Playwright_Journey
    legacy_row: 34
  actor: Nexent browser test administrator and independent A2A client
  journey:
  - 创建完整隔离 Agent 并进入 Advanced 发布属性
  - 通过 UI 启用 A2A 并等待 autosave
  - 通过 UI 发布唯一版本
  - 读取该 Agent A2A 设置
  - 独立外部客户端实际发现卡片
  - 检查已发布 endpoint 和版本
  - 外部客户端认证调用已发布 Agent
  - 停用本次端点并再次发现
  final_business_result:
  - 发布与 Agent/version 绑定一致
  - 外部真实发现和调用均成功
  - 停用状态真实生效
  failure_evidence:
  - 本地 assertions.json、events.jsonl、失败截图及 Trace；成功不留截图与 Trace。
