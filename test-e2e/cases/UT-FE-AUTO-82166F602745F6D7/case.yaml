  title: 引用角标组合key匹配、旧角标兼容、句级高亮与来源字段透传｜核心流程
  type: FE-COMP
  priority: P1
  status: active
  automation: automated
  objective: 引用角标组合key匹配、旧角标兼容、句级高亮与来源字段透传｜核心流程
  preconditions:
  - 本地依赖/组件测试环境可运行；不要求外部模型服务在线。
  - 设置 NEXENT_TEST_HOME，目录不位于 Nexent Git 仓库内。
  - 当次 run_id 已生成；测试基线固定为 develop 当前批次锁定的产品提交；执行时另记录实际被测commit。
  - 前端 newchat 消息渲染相关组件源码可读取：frontend/app/[locale]/newchat/ui/markdown-text.tsx 及其引用的 sources-panel 组合 key 生成函数。
  test_data:
    legacy_asset_declaration: 无（纯前端组件逻辑，固定测试数据内联于测试代码）
  steps:
  - order: 1
    action: '在组件测试环境加载 newchat 消息 Markdown 渲染组件，注入含 [[a1]][[b1]] 引用角标与对应 source content（sourceA: citeIndex=1/toolSign=''a''；sourceB:
      citeIndex=1/toolSign=''b''）的固定消息数据。'
    expected: 组合 key 精确匹配各自来源，a1 与 b1 互不混淆并返回对应 SearchSource。
  - order: 2
    action: 断言 findCiteSource 使用 getCitationKey({citeIndex, toolSign}) 精确匹配 a1、b1 各自唯一来源，不因 citeIndex 相同而互相混淆。
    expected: 纯数字旧角标回退匹配到相等 citeIndex 来源，历史会话保持可读。
  - order: 3
    action: 注入纯数字旧角标 [[1]] 的历史消息（source 仅含 citeIndex、无 toolSign），断言回退到 /^\d+$/ 分支按 citeIndex 精确匹配，角标仍解析到对应来源。
    expected: 开启句级高亮时 citationContext 返回角标前一句完整 scope 文本，且不跨段落/跨表格单元扩展。
  - order: 4
    action: 开启 ENABLE_CITATION_CLICK_HIGHLIGHT 时点击 a1 角标，断言 citationContext 返回该角标前一完整句子的 scope 文本，且换行/表格单元分隔符能停止 scope 扩展。
    expected: 高亮开启与关闭情况下点击角标均能用 selectedCitationKey 选中并滚动到来源。
  - order: 5
    action: 关闭 ENABLE_CITATION_CLICK_HIGHLIGHT 时点击 a1 角标，断言 selectedCitationKey 仍为组合 key（a1），面板选中并滚动到对应来源卡，citationContext
      为 undefined。
    expected: retrievalHighlightTerms/publishedDate 透传无丢失；匹配不到来源时 loading 正确且无未处理异常。
  - order: 6
    action: 断言 resolveCiteSources/toPanelSource 将 source 的 retrievalHighlightTerms 与 publishedDate 原样透传至面板来源项。
    expected: retrievalHighlightTerms/publishedDate 透传无丢失；匹配不到来源时 loading 正确且无未处理异常。
  - order: 7
    action: 对匹配不到来源的角标断言 loading 状态正确、不抛出未处理异常。
    expected: retrievalHighlightTerms/publishedDate 透传无丢失；匹配不到来源时 loading 正确且无未处理异常。
  - order: 8
    action: 注入同名 AIDP 多切片且 metadata 含零、false、数组、嵌套对象的来源，点击各自引用并检查面板和属性悬浮内容；无 metadata 时检查没有空区域。
    expected: 每条命中的原始 metadata、searchType 与技术引用完整透传；提供方显示 AIDP 而业务 source 原值保留；属性可通过悬浮、聚焦和点击访问，操作不触发文件预览。
  - order: 9
    action: 为 AIDP 来源提供文件名、业务 metadata、切片 ID、图片 URL 和其他可能的下载地址，检查不提供下载；对本地附件检查下载，并在A消息下载未完成时切换到同有a1的B消息，再使A下载失败；同一消息内再次选择引用。
    expected: AIDP 来源始终没有下载动作；本地附件仍走已有存储下载。跨消息不继承下载中或错误状态，同消息再次选择保留进行中的下载。
  - order: 10
    action: 注入原始来源a1、a2和图片a3、a4，按a1、a3、a4、a2引用并检查编号；将3张citeIndex为0的网页图片切换为另一消息1张图片；恢复同一无编号图片同时存在content和registry以及仅在registry中的图片。
    expected: a2在正文、悬浮提示与来源卡均显示4；图片a3/a4显示2/3且引用键不变。未编号网页图片不因默认0合并或残留；历史重复图片只显示一次，仅注册表图片保留。
  expected_results:
  - 组合 key 精确匹配各自来源，a1 与 b1 互不混淆并返回对应 SearchSource。
  - 纯数字旧角标回退匹配到相等 citeIndex 来源，历史会话保持可读。
  - 开启句级高亮时 citationContext 返回角标前一句完整 scope 文本，且不跨段落/跨表格单元扩展。
  - 高亮开启与关闭情况下点击角标均能用 selectedCitationKey 选中并滚动到来源。
  - retrievalHighlightTerms/publishedDate 透传无丢失；匹配不到来源时 loading 正确且无未处理异常。
  - metadata 和技术引用按命中完整透传，原始 key/value 可访问，提供方与业务 source 分开且空 metadata 无区域。
  - AIDP 引用来源不提供下载动作；本地附件回归通过，跨消息下载状态与错误隔离，同消息引用操作不重挂载卡片。
  - 图片参与回答统一编号；正文、提示和标签页编号与身份不变；无编号图片按实际身份合并，切换消息无旧图片残留。
  forbidden_side_effects:
  - AIDP 来源不调用本地存储或按文件名、切片 ID、图片地址猜原文件；查看属性不触发预览或下载。
  - 显示编号不得修改 citeIndex、toolSign 或 selectedCitationKey，也不得在切换来源和图片标签页时重新编号。
  acceptance:
  - id: AC-01
    description: Distinct composite keys and numeric legacy compatibility remain correct.
    steps: [1, 2, 3]
    expected_results: [1, 2]
  - id: AC-02
    description: Sentence scope, selection and scrolling remain correct.
    steps: [4, 5]
    expected_results: [3, 4]
  - id: AC-03
    description: Existing source fields and unmatched markers remain readable.
    steps: [6, 7]
    expected_results: [5]
  - id: AC-04
    description: Per-hit metadata, provider and technical reference reach the real panel and selectable attributes without preview side effects.
    steps: [8]
    expected_results: [6]
    forbidden_side_effects: [1]
  - id: AC-05
    description: AIDP citation downloads remain unavailable; local downloads remain available and isolated across messages without remounting on same-message selection.
    steps: [9]
    expected_results: [7]
    forbidden_side_effects: [1]
  - id: AC-06
    description: Source/image numbering preserves citation identity; uncited images merge once and message changes leave no stale image nodes.
    steps: [10]
    expected_results: [8]
    forbidden_side_effects: [2]
