  unit_boundary: 引用标注与来源面板
  inputs:
  - 无（纯前端组件逻辑，固定测试数据内联于测试代码）
  assertions:
  - 组合 key 精确匹配各自来源，a1 与 b1 互不混淆并返回对应 SearchSource。
  - 纯数字旧角标回退匹配到相等 citeIndex 来源，历史会话保持可读。
  - 开启句级高亮时 citationContext 返回角标前一句完整 scope 文本，且不跨段落/跨表格单元扩展。
  - 高亮开启与关闭情况下点击角标均能用 selectedCitationKey 选中并滚动到来源。
  - retrievalHighlightTerms/publishedDate 透传无丢失；匹配不到来源时 loading 正确且无未处理异常。
