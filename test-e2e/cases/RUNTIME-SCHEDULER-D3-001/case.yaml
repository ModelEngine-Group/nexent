schema_version: '1.0'
stage: D3
module: RUNTIME-SCALING
case:
  case_id: RUNTIME-SCHEDULER-D3-001
  feature_id: RUNTIME-REPLICAS
  requirement_ids:
  - RUNTIME-FIXED-REPLICAS-20261105
  business_rule_ids:
  - RUNTIME-REPLICAS-RULE-03
  - RUNTIME-REPLICAS-RULE-06
  title: 多调度器单周期只执行一次且启动不释放其他租约
  type: INTEGRATION
  priority: P0
  status: blocked
  automation: automated
  objective: 保留任务数据库租约并统一手动/自动会话预约，禁止每个实例启动执行全局恢复。
  preconditions:
  - 正式执行须使用本次测试拥有的独立应用实例和专属 PostgreSQL/Redis 数据域。
  - 至少两个 Runtime 进程使用同一维护完成批次；可确定性访问 A/B 实例并另测稳定 Service，不能以随机路由证明跨实例。
  - 运行协调、数据库、Redis 和 HTTP 路径使用真实实现；长流及故障由受控模型协议服务提供，不替换被测协调器。
  - 机器本地配置提供集群/实例连接与凭据，凭据不写入合同；每次生成资源标签和数据标识，只清理本次拥有的资源。
  test_data:
    scope: 每次运行生成 tenant_a、tenant_b、user_a、user_b、Agent、已存在 conversation_a 及 request_tag；不同租户的共享系统 Agent 使用相同逻辑作用域。
    model: 受控协议服务输出唯一轮次和递增事件序列，支持屏障、长流、完成和失败。
    preparation: 自行准备隔离集群 release、两工作节点、定向 Gateway、测试身份、自动任务及受控模型；清理本次数据、命名空间和动态卷。
  steps:
  - order: 1
    action: 以真实数据库创建一个到期自动任务，在 A/B 同步启动调度领取，记录调度周期/occurrence 和模型调用。
    expected: 该周期只有一个有效领取者和一次业务执行，lock_owner 与实际 owner 一致。
  - order: 2
    action: 在 A 的自动运行长时间执行且续租时重启 B，比较 A 的任务、消息、租约和待执行周期。
    expected: B 普通启动不全局 TIMEOUT 或释放 A 的租约；共同维护截止时间不随 B 启动改变，不跳过本应执行周期。
  - order: 3
    action: 在同一会话手动运行期间触发到期自动任务，再反向在自动运行期间提交手动请求。
    expected: 同一时刻仅一个实际 Agent 执行；自动任务按已有 overlap/misfire 规则记录忙碌，手动请求遵守既有 conflict 契约。
  - order: 4
    action: 在另一事务持有任务行锁期间并发尝试续租和推进错过的周期，分别等到租约到期再放行；在其他实例接手前后尝试写入完成，并分别在旧根执行仍活跃和已退出时重领。
    expected: 以取得行锁后的数据库时间判定失租，过期操作不能续租或推进周期，接手前后均不接受旧结果；已有业务接纳标记的周期不再写消息、不新建预约、不再调用模型。未写入业务的周期允许补跑，下一合法周期正常执行。
  - order: 5
    action: 停用本次自动任务，等待运行收尾并删除本次任务、周期和会话。
    expected: 本次调度、消息和资源清理完成，不改写其他周期或任务。
  expected_results:
  - 两实例争抢同一周期仅一次实际执行；续租与所有者条件保持有效。
  - 普通启动不改变他人租约或共同恢复截止时间；手动/自动共享会话互斥。
  - 任务与周期按当前规则推进并可完整清理。
  forbidden_side_effects:
  - 重启一个实例释放所有调度锁或把健康运行置为 TIMEOUT。
  - 手动/自动竞争造成两次模型/工具业务调用；失租者写入不属于自己的完成状态。
  - 重放外部副作用或清理非本次任务。
  acceptance:
  - id: AC-P1-003
    description: 手动与自动共享互斥。
    steps:
    - 3
    expected_results:
    - 2
    forbidden_side_effects:
    - 2
    - 3
  - id: AC-P1-006
    description: 真实数据库争抢、启动隔离、失租与清理正确。
    steps:
    - 1
    - 2
    - 4
    - 5
    expected_results:
    - 1
    - 2
    - 3
    forbidden_side_effects:
    - 1
    - 2
    - 3
  tags:
  - phase-1
  source:
    spec_path: nexent-doc/docs/Developing/runtime-replica-scaling/proposal.md
    blocked_reason: 缺少获准的隔离双工作节点集群；同机独立进程验证不能替代跨节点正式执行。
    primary_domain: task
    preparation_plan: 测试独占实例、数据库/Redis 数据域、身份和模型协议服务；执行前确认资源归属。
    cleanup_plan: finally 停止测试运行并回收本次数据与实例；不得清空开发者栈、外部 PVC 或共享 Redis。
  integration_boundary:
  - 两个真实调度器→PostgreSQL SKIP LOCKED/续租/owner 条件→会话预约→Runtime 执行与受控模型协议。
  observations:
  - 每周期模型调用、run/occurrence、claim owner、lock_until、共同恢复时间、消息终态和忙碌原因。
  cleanup:
  - 先禁用本次任务，再结束运行并移除本次数据；清理过程不调用全局恢复函数。
