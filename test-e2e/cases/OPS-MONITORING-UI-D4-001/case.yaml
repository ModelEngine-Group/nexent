schema_version: '1.0'
stage: D4
module: OPS-PLATFORM
case:
  case_id: OPS-MONITORING-UI-D4-001
  feature_id: OPS-MONITORING-UI
  requirement_ids: [OPS-MONITORING-UI-20261123, OPS-AGENT-UI-METRICS-20261123, OPS-AGENT-UI-DETAILS-20261123, OPS-AGENT-UI-CHARTS-20261123, OPS-MONITORING-OVERVIEW-20261123, OPS-MODEL-UI-DETAILS-20261124, OPS-MODEL-UI-METRICS-20261124]
  business_rule_ids: [OPS-MONITORING-UI-RULE-01, OPS-MONITORING-UI-RULE-02, OPS-MONITORING-UI-RULE-03, OPS-MONITORING-UI-RULE-04, OPS-MONITORING-UI-RULE-05, OPS-MONITORING-UI-RULE-06, OPS-MONITORING-UI-RULE-07, OPS-MONITORING-UI-RULE-08]
  title: Scope monitoring filters and Agent metrics in the browser
  type: E2E
  priority: P1
  status: active
  automation: automated
  objective: Verify monitoring selections, overview totals and trends, and Agent metric reads using controlled API responses.
  preconditions:
  - Current source Web is available and browser-local directory routes provide an authorized SU session and two distinct tenants.
  test_data:
    profile: mock
  steps:
  - order: 1
    action: Visit the dashboard, inspect its tabs and overview, and change the tenant and dates using presets and a custom interval.
    expected: The overview presents four cards and four trend positions. Tenant changes update authorized totals and trends. Date changes update only the trends. Loading, error, unavailable, missing and zero values remain distinct.
  - order: 2
    action: Select a tenant, group and Agent, inspect Model cards and trends, page, search and clear Model details, scope a Model and refresh, then switch tenants and return.
    expected: Model search and clear submit to the Model endpoint on page one with the selected scope. Escape returns focus to the icon. Tabs share tenant, group and dates, and changing tenants clears group and resource selections.
  - order: 3
    action: Select an MCP service in the session tenant and one of its tools, then select another service and refresh.
    expected: The tool selection clears, the new service's tool list remains scoped, and only applicable directories are queried again.
  - order: 4
    action: Inspect Agent cards and switch between call count, success rate and Token trend. Change the group and refresh.
    expected: The inventory count stays stable under group and date filtering. Summary and trend requests use the current scope. Token values preserve large integers and report usage coverage separately from publication status. Refresh repeats both reads.
  - order: 5
    action: Hold a request, change the Agent scope, release the earlier response, and exercise empty and failed reads.
    expected: Overview and trend loading resolve independently. Missing samples, no data, failure and true zero remain distinguishable. Earlier responses cannot replace the current Agent view.
  - order: 6
    action: Inspect Agent rows and publication, page and sort, open search from the display-name header, search each name field, clear the search, and drill into an Agent from the second tenant.
    expected: Display names occupy one line without a tenant subtitle. Search uses the current scope and preserves empty and error responses. Detail rows preserve missing and zero values and exact Tokens. Drilling into a directory Agent changes the dashboard to that Agent and tenant.
  - order: 7
    action: Switch each ranking metric, change the date and group while on a later detail page, refresh, and select a single Agent.
    expected: The ranking preserves the server order, sample counts and exact Tokens. Refresh reads the current ranking. The table returns to page one while retaining search, sort and page size. The single-Agent chart uses success and failure counts from the summary and shows calls separately, with an empty chart when samples are absent.
  expected_results:
  - The dashboard exposes the intended filters with deterministic calendar dates and explicit unavailable statistics for unconnected resources.
  - Tenant and MCP service transitions clear their dependent selections. MCP refresh only re-reads applicable directories.
  - Agent cards and trend match the active scope and preserve value and publication semantics.
  - Statistics requests refresh within the active range and stale responses never overwrite it.
  - The Agent table supports server search, metric sorting, paging and tenant-qualified drilldown while preserving the list's own publication and request states.
  - All-Agent ranking and single-Agent outcomes follow the active filters. Date and group changes reset only list pagination.
  - The overview shows current Agent and Model inventory and daily calls while preserving coverage. MCP and Skill placeholders issue no monitoring reads.
  - Both detail tables use column search, keep separate search state and submit to their own list endpoints.
  - Model cards use inventory and the scoped summary. Both charts share a single scoped trends read. Switching the left metric does not request data. Refresh rereads summary, trends and the current list.
  forbidden_side_effects:
  - Statistics use the connected Agent and Model GET routes. Table controls do not refresh the cards, trends or ranking. No forced rebuild, single-Agent ranking or cross-tenant MCP tool directory request is sent.
  actor: Authorized super administrator
  journey: [Open dashboard, Change date interval, Scope a resource, Change tenant, Drill from MCP service to tool, Refresh]
  final_business_result:
  - An operator can select a valid monitoring scope and inspect the connected Agent statistics.
  failure_evidence: [Browser control assertions and sanitized request paths]
  execution:
    profiles:
    - name: mock
      required_services: []
  acceptance:
  - id: AC-01
    description: Visible tabs, dates and unavailable states are exercised through the actual route.
    steps: [1]
    expected_results: [1]
  - id: AC-02
    description: Directory requests, dependent filters and refresh obey the tenant and service scopes.
    steps: [2, 3]
    expected_results: [2]
    forbidden_side_effects: [1]
  - id: AC-03
    description: Agent cards and trend preserve scope, with compact Tokens and exact usage details on hover.
    steps: [4]
    expected_results: [3]
  - id: AC-04
    description: Browser requests are isolated by scope and display refresh, empty and failure states.
    steps: [4, 5]
    expected_results: [4]
    forbidden_side_effects: [1]
  - id: AC-05
    description: The detail table uses the active scope and server controls and opens the correct Agent even when two tenants share its numeric identifier.
    steps: [6]
    expected_results: [5]
    forbidden_side_effects: [1]
  - id: AC-06
    description: The Agent chart modes and detail pagination follow scope changes while preserving the metric contracts and list controls.
    steps: [7]
    expected_results: [6]
    forbidden_side_effects: [1]
  - id: AC-07
    description: Overview reads current inventory only by authorized tenant and loads two independent trends for the selected dates.
    steps: [1]
    expected_results: [7]
    forbidden_side_effects: [1]
  - id: AC-08
    description: Both name search controls submit and clear server filters independently and return to page one.
    steps: [2, 6]
    expected_results: [8]
    forbidden_side_effects: [1]
  - id: AC-09
    description: Model cards and charts keep read-only query boundaries, with plain card values and daily error data revealed on chart hover.
    steps: [2]
    expected_results: [9]
    forbidden_side_effects: [1]
