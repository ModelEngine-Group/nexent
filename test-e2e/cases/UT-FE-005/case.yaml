  unit_boundary: useLanguageSwitch、loadLocaleMessages 与真实 i18n
  inputs: *id001
  assertions:
  - 目标 locale 正确，业务路径和 BASE_PATH 保留，NEXT_LOCALE Cookie 更新。
  - 未知 locale 使用英文，缺失键回退英文或 defaultValue。
  - 已有翻译不被清空。
