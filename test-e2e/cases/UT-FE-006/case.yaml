      acceptance.
  unit_boundary: 真实 useAgentStore 和 Nl2AgentFlowProvider，service 为受控边界
  inputs: *id001
  assertions:
  - A 保存结果可读取；B 使用自己的快照，不继承 A 草稿。
  - 旧响应和错误 Agent 快照不能覆盖 B。
  - 草稿回滚，错误可见；未提交草稿不持久化，清理后无旧状态。
  - 不调用持久化 API。
  - 旧 completion 被忽略，sessionGeneration 更新，reset 清空 session。
