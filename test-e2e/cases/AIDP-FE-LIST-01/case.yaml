    forbidden_side_effects:
    - 1
  - id: AC-02
    description: 搜索与分页
    steps:
    - 2
    expected_results:
    - 2
    forbidden_side_effects:
    - 1
  - id: AC-03
    description: 导入与删除刷新
    steps:
    - 3
    expected_results:
    - 3
    forbidden_side_effects:
    - 1
  - id: AC-04
    description: 定时刷新与暂停
    steps:
    - 4
    expected_results:
    - 4
    forbidden_side_effects:
    - 1
  - id: AC-05
    description: 账号与租户隔离
    steps:
    - 5
    expected_results:
    - 5
    forbidden_side_effects:
    - 1
