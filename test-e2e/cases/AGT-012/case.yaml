schema_version: '1.0'
stage: D3
module: V5-BASELINE
case:
  case_id: AGT-012
  feature_id: F-048
  business_rule_ids:
  - F-048-RULE-01
  title: badcase 优化与 debug history 优化｜外部依赖异常与超时
  type: AGENT-IT
  priority: P1
  status: active
  automation: automated
  objective: badcase 优化与 debug history 优化｜外部依赖异常与超时
  preconditions:
  - Target config service and Jiuwen Prompt optimization capability are available.
  - Machine-local models.yaml and secrets.env provide a healthy real LLM for recovery; no credential is embedded in this Case.
  - The runner owns the controlled HTTP asset service; its URL is reachable from the config container.
  test_data:
    fault_modes: [unavailable, timeout]
    provider_timeout_seconds: 1
    provider_error_status: 503
  steps:
  - order: 1
    action: Register a unique controlled Provider scenario and a valid, case-owned model; create an owned Agent and read its complete field snapshot.
    expected: The model ID exists and belongs to the test tenant; no tenant default model is replaced.
  - order: 2
    action: Call the real Debug optimization endpoint with that model for both Provider 503 and response-timeout variants.
    expected: The controlled Provider receives the request, bounded retries terminate, and the current exact application error is returned without optimization data.
  - order: 3
    action: Read the owned Agent again and compare Prompt, identity, models and resource bindings with the initial snapshot.
    expected: Failed optimization performs no partial save.
  - order: 4
    action: Invoke the same optimization endpoint for the owned Agent using the machine-configured healthy real LLM.
    expected: The response is HTTP 200 from Jiuwen with nonempty optimized_full_prompt; suggestions do not auto-save the Agent.
  - order: 5
    action: Delete only the owned Agent, model and controlled fault scenario; retain sanitized request counts, elapsed time and draft comparison evidence locally.
    expected: Cleanup is verified and no raw Provider credential, prompt request body or global service mutation is recorded.
  expected_results:
  - Both real Provider failure and timeout reach the declared fault endpoint; nonexistent model IDs are not used to simulate an outage.
  - Retries terminate within the declared budget; current HTTP 500 carries the exact application error and no successful optimization payload.
  - Failed and successful optimization suggestions do not modify the stored Agent.
  - A machine-configured real LLM successfully optimizes after the fault; no shared service or default model is stopped or replaced.
  - All owned resources are cleaned and sanitized evidence is retained outside Git.
  forbidden_side_effects:
  - Do not partially save Prompt fields, modify another Agent, replace tenant defaults or stop a shared service.
  acceptance:
  - id: AC-01
    description: Real Provider 503 and timeout are observed, bounded and rejected without partial draft mutation.
    steps: [1, 2, 3]
    expected_results: [1, 2, 3]
    forbidden_side_effects: [1]
  - id: AC-02
    description: Real-model recovery succeeds without automatic draft saving; exclusive resources are cleaned with sanitized evidence.
    steps: [4, 5]
    expected_results: [3, 4, 5]
    forbidden_side_effects: [1]
  source:
    legacy_workbook_sha256: aa4b32414d30f12b3b64e14236268145e556bd7cfc5d3eb8df80731608ebc022
    legacy_sheet: 02_测试用例基线
    legacy_row: 93
  integration_boundary:
  - Real Nexent config API and Jiuwen adapter; run-scoped OpenAI-compatible faults only for deterministic 503/timeout injection.
  - Recovery uses the real LLM in machine-local configuration.
  observations:
  - Provider request counts, elapsed time, HTTP status and unchanged draft state.
  cleanup:
  - Delete the owned Agent, model and fault scenario; preserve evidence only in test home.
