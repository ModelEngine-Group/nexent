schema_version: '1.0'
stage: D4
module: AGENT-PUBLICATION
case:
  case_id: AGENT-PUBLICATION-D4-002
  feature_id: AGENT-PUBLICATION
  business_rule_ids:
  - AGENT-PUBLICATION-RULE-002
  title: Publication preview and API key actions navigate in the current tab
  type: E2E
  priority: P0
  status: active
  automation: automated
  objective: Publication preview and API key actions navigate in the current tab
  preconditions:
  - Real Nexent editor and tenant administrator login are available.
  - Configured LLM is available; the case creates and deletes only its own agent.
  test_data:
    configuration: config/environment.yaml; config/models.yaml; config/users.yaml
    ownership: Dynamic owned agent and version; no fixed resource IDs or credentials.
  steps:
  - order: 1
    action: Publish the owned agent and record the editor URL and browser page count.
    expected: Publication access details are visible for the owned agent.
  - order: 2
    action: Click Preview in the publication page.
    expected: The same page navigates to newchat with the owned agent ID and renders that agent as selected; no
      popup is opened.
  - order: 3
    action: Return to the editor, open publication and click Get API key.
    expected: The same page navigates to the user settings route and the API key settings UI is visible; no popup
      is opened.
  - order: 4
    action: Return to the editor and reopen publication.
    expected: The published link is still correct and the publication page remains usable.
  expected_results: &id001
  - Preview selects the owned agent in the existing browser page.
  - API key settings uses the existing browser page without key mutation.
  forbidden_side_effects:
  - Do not invoke the agent, generate or rotate API keys, or mutate unrelated resources.
  actor: Tenant administrator using the real browser UI
  journey:
  - Publish the owned agent and record the editor URL and browser page count.
  - Click Preview in the publication page.
  - Return to the editor, open publication and click Get API key.
  - Return to the editor and reopen publication.
  final_business_result: *id001
  failure_evidence:
  - Case-local assertions.json, failure screenshot and trace under the machine-local test home.
  acceptance:
  - id: AC-01
    description: Preview selects the owned agent in the existing browser page.
    steps:
    - 1
    - 2
    expected_results:
    - 1
    forbidden_side_effects:
    - 1
  - id: AC-02
    description: API key settings uses the existing browser page without key mutation.
    steps:
    - 3
    - 4
    expected_results:
    - 2
    forbidden_side_effects:
    - 1
