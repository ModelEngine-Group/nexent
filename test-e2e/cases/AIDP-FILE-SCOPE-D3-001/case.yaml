{
  "schema_version": "1.0",
  "stage": "D3",
  "module": "AIDP-KNOWLEDGE",
  "case": {
    "case_id": "AIDP-FILE-SCOPE-D3-001",
    "feature_id": "AIDP-FILE-SCOPE",
    "requirement_ids": [
      "AIDP-FILE-SCOPE-REQ-002",
      "AIDP-FILE-SCOPE-REQ-003"
    ],
    "business_rule_ids": [
      "AIDP-FILE-SCOPE-RULE-02",
      "AIDP-FILE-SCOPE-RULE-03",
      "AIDP-FILE-SCOPE-RULE-04"
    ],
    "title": "Real AIDP filtered recall preserves Agent retrieval configuration",
    "type": "INTEGRATION",
    "priority": "P0",
    "status": "blocked",
    "automation": "manual",
    "objective": "Prove with a real AIDP search that an enabled file-name filter restricts recall while the Agent's method, Top K, thresholds and reranking remain unchanged, and that disabling the filter restores the unfiltered result set.",
    "preconditions": [
      "A real AIDP environment with at least two knowledge bases containing files whose names differ."
    ],
    "test_data": {
      "profile": "real-aidp",
      "filter": "file name contains a unique file-name token",
      "topk": [
        1,
        10
      ]
    },
    "steps": [
      {
        "order": 1,
        "action": "Run the Agent with the filter enabled and a small Top K.",
        "expected": "Only chunks from matching files are returned."
      },
      {
        "order": 2,
        "action": "Run the same query with the filter disabled.",
        "expected": "Results return to the unfiltered set."
      }
    ],
    "expected_results": [
      "Filtered recall is server-side",
      "Retrieval configuration is unchanged",
      "Disabling restores the unfiltered set"
    ],
    "forbidden_side_effects": [
      "Do not post-trim results as a substitute for server-side filtering",
      "Do not change Agent retrieval parameters"
    ],
    "unit_boundary": "real AIDP FusionSearch through AidpSearchTool",
    "inputs": [
      "enabled filter",
      "disabled filter",
      "small Top K"
    ],
    "assertions": [
      "filtered result set",
      "unfiltered result set"
    ],
    "acceptance": [
      {
        "id": "AC-01",
        "description": "Filtered recall",
        "steps": [
          1
        ],
        "expected_results": [
          1
        ],
        "forbidden_side_effects": [
          1,
          2
        ]
      },
      {
        "id": "AC-02",
        "description": "Configuration preserved",
        "steps": [
          1,
          2
        ],
        "expected_results": [
          2,
          3
        ],
        "forbidden_side_effects": [
          2
        ]
      }
    ],
    "integration_boundary": [
      "Nexent chat/run API -> Agent runtime -> AidpSearchTool -> real AIDP FusionSearch -> real AIDP KBs and index/graph channels",
      "Root Agent and at least one sub-Agent that also owns an AidpSearchTool"
    ],
    "observations": [
      "FusionSearch request payload fields and the metadata_condition content",
      "Returned hits, scores, metadata.kds_id/file_uuid and retrieval_source channels",
      "Model-facing tool observation, source cards and citation list",
      "Whether any unfiltered request was issued when the filter was enabled"
    ],
    "cleanup": [
      "Delete only case-owned KB files and conversations; leave the fixed historical data directory untouched.",
      "Stop case-owned services and release the environment lease."
    ]
  }
}
