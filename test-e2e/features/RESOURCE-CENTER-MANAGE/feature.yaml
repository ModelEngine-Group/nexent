schema_version: '1.0'
module:
  id: RESOURCE-CENTER
  name: 资源仓库与统一审核
feature:
  feature_id: RESOURCE-CENTER-MANAGE
  name: 仓库展示、安装来源与管理
  status: planned
  description: 资源仓库统一设计；设计阶段，尚未实施或执行业务验收。
  business_rules:
  - rule_id: RESOURCE-CENTER-MANAGE-RULE-003
    description: AC-003：同一结果集和权限操作一致；展示最近上架时间或未记录，保留已有安装/复制次数；不展示、采集或新增调用/对话次数；默认和最热沿用原口径，新增显式最新按 published_at 排且空值末尾。
  - rule_id: RESOURCE-CENTER-MANAGE-RULE-011
    description: AC-011：Agent保留导入预检及冲突处理，MCP保留URL/容器安装和选中共享字段，Skill保留冲突重命名；成功按原口径增加次数，失败不增；安装状态不替代审核状态或本地健康状态。
  - rule_id: RESOURCE-CENTER-MANAGE-RULE-012
    description: AC-012：新SkillInfo写source_repository_id；按当前用户及租户可见副本批量返回installed_copies和installed/not_installed/unknown三态；同名不同源不混淆；多个副本逐个列出，只读只显示已安装；历史未知不得猜测来源或据名称卸载。
  - rule_id: RESOURCE-CENTER-MANAGE-RULE-013
    description: AC-013：调用已有本地删除服务；只删除有权且无引用的指定副本，引用保护和租户检查保留；仓库原件及其他副本不变；累计下载次数不减。
  - rule_id: RESOURCE-CENTER-MANAGE-RULE-014
    description: AC-014：全选只取当前页可操作项，换页/筛选/Tab清选择；MCP 对选中项发一次 POST /mcp-tools/batch_delete 请求，后端沿用单删权限并逐条返回结果；Skill 逐条调用；成功刷新，失败保留选择和错误，不跨页静默删除。
  required_test_stages:
  - D2
  - D3
  - D4
  source:
    requirement_ids:
    - RESOURCE-CENTER-REQ-20261031
    spec_path: ../nexent-doc/docs/Developing/rsc-unified-resource-repository/proposal.md
    notes: 2026-10-31 full requirement design. Existing repository Features and D1 Cases remain unchanged.
