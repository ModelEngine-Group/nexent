schema_version: '1.0'
module:
  id: FILE-CLEANSE
  name: Management file cleansing
feature:
  feature_id: DPR-CLEANSE
  name: Durable authorized file cleansing jobs
  status: active
  description: Authorized admission, lease fencing and durable local dispatch for file cleansing.
  business_rules:
  - rule_id: DPR-CLEANSE-RULE-01
    description: Admission is idempotent and inspection preserves user, tenant and run ownership.
  - rule_id: DPR-CLEANSE-RULE-02
    description: Only the current attempt may complete; recorded unknown outcomes block automatic replay.
  - rule_id: DPR-CLEANSE-RULE-03
    description: Broker acknowledgement follows durable job policy and duplicates do not reexecute a completed job.
  - rule_id: DPR-CLEANSE-RULE-04
    description: Structural cleansing uses a process-owned parser and scoped object ports without old task or model repositories.
  - rule_id: DPR-CLEANSE-RULE-05
    description: Management preserves structure and Runtime performs final text/table chunking with the established format algorithms.
  - rule_id: DPR-CLEANSE-RULE-06
    description: Reverse FileCleanse admission verifies the signed actor, current membership and source ownership, and preserves run/job isolation.
  - rule_id: DPR-CLEANSE-RULE-07
    description: Temporary run artifacts and images belong to the admitted run/job; KB object keys remain unchanged.
  required_test_stages: [D3]
