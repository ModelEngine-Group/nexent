schema_version: '1.0'
module:
  id: CHAT-MESSAGE
  name: Conversation model controls
feature:
  feature_id: CHAT-MODEL-CONTROLS
  name: 六入口共享模型选择与运行控制
  status: active
  description: Unified capability-derived selection, session state and root runtime controls across Workbench, Agent chat
    and four creator entries; sampling overrides use canonical provider-scale values.
  business_rules:
  - rule_id: CHAT-MODEL-CONTROLS-RULE-001
    description: Shared capability-derived reasoning choices preserve each entry's candidate model scope. Unknown and unsupported
      capabilities prevent changes and provide the same localized accessible unsupported-mode message on hover or explicit activation, without permanent visible text or focus-triggered tooltips; switching models clears transient feedback. Toggle-only models never show empty effort controls. For supported models on custom providers, unknown shutdown support permits a compatible toggle; an explicit can_disable=false preference prevents disabling, while known provider declarations and user-selected parameter formats are retained.
  - rule_id: CHAT-MODEL-CONTROLS-RULE-002
    description: One validated session selection supplies initial and subsequent composers, immutable turn requests and creation
      snapshots.
  - rule_id: CHAT-MODEL-CONTROLS-RULE-003
    description: Both Agent conversation modes use one per-outlet preference format and outlet to Agent to conversation merging; historical Workbench values migrate once, without retaining a second editable parameter store.
  - rule_id: CHAT-MODEL-CONTROLS-RULE-004
    description: The selected root model supplies provider binding and capacity while preserving independent models and target
      Agent configuration.
  - rule_id: CHAT-MODEL-CONTROLS-RULE-005
    description: Existing permissions and tenant/capability validation guard execution; locks, cancellation and errors preserve
      valid drafts without silent fallback.
  - rule_id: CHAT-MODEL-CONTROLS-RULE-006
    description: Shared advanced settings use temperature 0-2 and top_p 0-1 (step 0.1); untouched/reset values inherit defaults,
      explicit zero survives immutable root-only runtime snapshots, and session/model scopes remain isolated. Explicit sampling
      must not silently disappear on provider retry. Configured Agent/model defaults are displayed as numbers with exact slider
      positions without creating overrides. Null inherits per field through Agent/model configuration. The legacy SDK path and its read-only model-list projection retain temperature 1.0 and top_p 1.0 defaults. Native resolved-profile requests omit missing/null sampling; when no configured inheritance is known, profile controls show Service default with a neutral operable slider and empty numeric input, without injecting numeric defaults.
  - rule_id: CHAT-MODEL-CONTROLS-RULE-007
    description: Context/input/output token length limits belong exclusively to model onboarding/editing. Agent and conversation controls do not expose or accept new length overrides; historical length values inherit the frozen outlet. Reasoning token budgets remain configurable from declared thinking rules. Upstream compact degree display and trigger summary consume the same shared preference query.
  required_test_stages:
  - D2
  - D3
  - D4
  - D5
  source:
    requirement_ids:
    - SESSION-CONTROLS-BOUNDARY-20261026
    - SESSION-MODEL-UNIFY-20261020
    - CHAT-MODEL-CONTROLS-20261014
    - CHAT-WORKBENCH-REFINEMENTS-20261015
    - CHAT-WORKBENCH-HEADER-DEFAULTS-20261015
    - WB-CREATION-TOGGLE-EXIT-20261015
    - WB-RESOURCE-LISTS-20261015
    - CHAT-SAMPLING-20261016
    - CHAT-SAMPLING-DISPLAY-20261019
    spec_path: ../nexent-doc/nexent/agent-workbench/specs/model-controls/spec.md
    notes: Product and fixed tests implemented; execution and acceptance evidence are maintained separately in the SPEC task
      record. Existing WB-CONTROLS-D4-002/003 remain regression owners for the two ordinary chat entries.
