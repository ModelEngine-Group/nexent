schema_version: '1.0'
module:
  id: AGENT-RUNTIME
  name: Agent runtime tools
feature:
  feature_id: DPR-WEB-IMAGE
  name: Runtime web image filtering without data-process
  status: active
  description: External search image consumers use an injected local Runtime filter with bounded HTTP ownership.
  business_rules:
  - rule_id: DPR-WEB-IMAGE-RULE-01
    description: Exa, Tavily and Linkup emit the existing image event without a data-process address or extra requests.
  - rule_id: DPR-WEB-IMAGE-RULE-02
    description: Runtime owns bounded image reads and decisions in the current managed tool worker and closes resources.
  required_test_stages: [D3]
