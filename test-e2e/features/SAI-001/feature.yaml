schema_version: '1.0'
module:
  id: RUNTIME-SANDBOX
  name: Runtime sandbox
feature:
  feature_id: SAI-001
  name: Isolate concurrent calls to one internal subagent definition
  status: active
  description: Each internal subagent invocation owns independent execution state
    and kernel while preserving parallelism.
  business_rules:
  - rule_id: SAI-001-R1
    description: Overlapping calls use distinct agents and kernels and return only
      their own results.
  - rule_id: SAI-001-R2
    description: Unused definitions are lazy; invocation-owned resources and metadata
      are isolated and reclaimed on termination.
  required_test_stages:
  - D1
  - D3
  - D5
  source:
    spec_path: docs/Developing/runtime-sandbox-subagent-invocation-isolation/proposal.md
    notes: No API or UI behavior changes; D2 and D4 are excluded with rationale in
      design.
