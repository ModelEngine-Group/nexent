schema_version: '1.0'
module:
  id: NAV-MENU
  name: Sidebar navigation
feature:
  feature_id: NAV-MENU-VISIBILITY
  name: Functional sidebar menu visibility
  status: active
  description: Only functional sidebar controls are shown while existing routing and
    access rules remain intact.
  business_rules:
  - rule_id: NAV-MENU-RULE-001
    description: Hide inert sections and speed notification without hiding authorized
      children or avatar.
  - rule_id: NAV-MENU-RULE-002
    description: Preserve permission filtering, locale routing, chat alias, workbench
      gate, auth and ordinary notification actions.
  - rule_id: NAV-MENU-RULE-003
    description: Authorized enabled workbench menu is labeled 工作台 / Workbench and
      appears immediately after Home, before Start Chat.
  - rule_id: NAV-MENU-RULE-004
    description: Shared pages omit global top and bottom bars; account menu retains
      requested information, gated external links and language switching without appearance
      settings or a copyright row.
  - rule_id: NAV-MENU-RULE-005
    description: Collapsed sidebar shows icons only; hover expands to240px over content
      with inline labels, truncation and popup-safe collapse. Brand text is18px bold
      with a full-name tooltip and8px header bottom spacing. A0.5px right divider
      remains visible in every state; selected navigation icons are blue (#2673e5).
  - rule_id: NAV-MENU-RULE-006
    description: An expanded-only header control pins sidebar at240px and resizes
      content; toggling again collapses to64px. Unpinned hover remains an overlay.
  - rule_id: NAV-MENU-RULE-007
    description: Pin/PinOff header toggle uses blue foreground and transparent background
      when pinned. Brand image40px; Sparkles Skill and FolderCog resource glyphs.
      Account popup matches measured v0:256px width,6px padding,60px identity with36px
      avatar,28px primary rows and24px links. About header22.5px,11px/16.5px typography
      at60% muted color; version monospace. Language icon/label/locale/chevron centered
      within1px and label aligned with Profile. Copyright absent. Logout uses exact
      destructive color with10% hover and retains confirmation.
  - rule_id: NAV-MENU-RULE-008
    description: Sidebar background matches demo lab(97.0939% -.108689 -.749958).
      Unselected hover uses70% of sidebar accent lab(92.4476% -.214785 -1.49835);
      selection uses full accent, retained on hover. Rail account/notification controls
      share these colors; open popup triggers use selection. Account setting hover/focus
      uses demo accent lab(94.1288% -2.23359 -10.9012), while readonly rows stay transparent
      and logout preserves danger styling. Profile and language setting inherit default
      menu typography, without custom font family, size or line height; About and
      version keep compact secondary typography.
  required_test_stages:
  - D1
  - D4
  source:
    requirement_ids:
    - NAV-MENU-REQ-001
    - NAV-MENU-REQ-002
    - NAV-MENU-REQ-003
    - NAV-MENU-REQ-004
    - NAV-MENU-REQ-005
    - NAV-MENU-REQ-006
    - NAV-MENU-REQ-007
    spec_path: ../nexent-doc/docs/Developing/nav-sidebar-menu-visibility/proposal.md
