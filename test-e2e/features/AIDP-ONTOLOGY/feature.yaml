schema_version: "1.0"
module:
  id: AIDP-KNOWLEDGE
  name: AIDP knowledge and ontology management
feature:
  feature_id: AIDP-ONTOLOGY
  name: AIDP ontology domain, entity, binding and JSON management
  status: active
  description: >-
    Manage AIDP ontology domains, Type/Entity objects, one-knowledge-base-to-one-ontology
    bindings and JSON export/import through authenticated Nexent proxies. AIDP remains
    the source of truth; Nexent persists no shadow ontology data and does not expose
    AIDP credentials to the browser.
  business_rules:
    - rule_id: AIDP-ONTOLOGY-RULE-01
      description: >-
        Domain and entity writes follow AIDP constraints: domain name <=64 UTF-8 bytes,
        description <=512 bytes, Type cannot have a parent type, and entity PATCH only
        accepts display_name, description, properties and primary_properties.
    - rule_id: AIDP-ONTOLOGY-RULE-02
      description: >-
        A knowledge base is bound to at most one ontology; one ontology can bind many
        knowledge bases. Entity rows display the owning ontology's binding count and
        refresh after a bind or unbind; there is no entity-level binding concept.
    - rule_id: AIDP-ONTOLOGY-RULE-03
      description: >-
        Export keeps the documented types/entities/relations fields without internal IDs.
        Nexent converts an exported file into the flat uppercase DOMAIN_ID/ENTITIES/RELATIONS
        request, adds kind to each entity and preserves relation endpoint kinds. AIDP skips
        existing (api_name, kind) pairs; synchronous partial results are reported per item.
        Async acceptance only confirms submission and never calls AIDP's internal task API.
    - rule_id: AIDP-ONTOLOGY-RULE-04
      description: >-
        The ontology list sends page, page_size and search (never keyword); total is the
        filtered record total used for pagination, not a per-ontology entity/metadata count.
        Missing optional metadata/entity/audit fields stay null and render as an em dash;
        a zero binding count is a real value while an unavailable binding query is not.
  required_test_stages: [D1, D2, D3, D4, D5]
