schema_version: '1.0'
module:
  id: CHAT-MESSAGE
  name: Conversation interaction
feature:
  feature_id: CHAT-CLARIFICATION-HISTORY
  name: Submitted clarification answer history
  status: active
  description: Persist ordinary clarification responses and restore submitted cards across conversation reloads.
  business_rules:
  - rule_id: CHAT-CLARIFICATION-HISTORY-RULE-001
    description: Readable user text and structured answers are persisted atomically with the originating assistant message/unit identity.
  - rule_id: CHAT-CLARIFICATION-HISTORY-RULE-002
    description: Reload and reopening restore submitted text/choice/other answers read-only without extra runs; rejected submissions retain editable input.
  - rule_id: CHAT-CLARIFICATION-HISTORY-RULE-003
    description: Responses never populate another turn or conversation; legacy histories retain their original display.
  required_test_stages: [D4]
  source:
    requirement_ids: [CHAT-CLARIFICATION-HISTORY-001]
    spec_path: ../nexent-doc/docs/Developing/chat-clarification-answer-history/design.md
