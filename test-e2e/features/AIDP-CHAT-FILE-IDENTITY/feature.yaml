schema_version: '1.0'
module:
  id: AIDP-KNOWLEDGE
  name: Knowledge retrieval
feature:
  feature_id: AIDP-CHAT-FILE-IDENTITY
  name: AIDP 聊天溯源原文件身份与北向下载
  status: active
  description: >-
    AIDP FusionSearch 每条命中通过 metadata.kds_id / metadata.file_uuid 携带原文件身份；
    该身份作为结构化技术引用贯穿 SDK、流、持久化、历史与来源卡，页面按登录态 KB READ 下载原文件。
    仅北向运行时，AIDP 检索工具额外向模型提供 northbound_api_download_url，调用方凭 API Key 下载；
    普通页面运行不产生该字段，也不从文件名、图片 URL 或 chunk id 猜原文件。
  business_rules:
    - rule_id: AIDP-CHAT-FILE-IDENTITY-RULE-01
      description: >-
        每条命中仅从 metadata.file_uuid 与 metadata.kds_id 同时存在时形成 locator；
        逐命中保留在 score_details 并随流、持久化与历史恢复，不按文件名合并，不从 filename、file_url、
        chunk id 或请求知识库范围推断身份。
    - rule_id: AIDP-CHAT-FILE-IDENTITY-RULE-02
      description: >-
        页面来源卡仅在显式 locator 存在时显示登录态下载动作，调用既有 AIDP 文档下载代理；
        下载时重新校验目标知识库 READ 与文件归属，文件删除或撤权明确失败，旧记录缺少身份不显示可用下载。
    - rule_id: AIDP-CHAT-FILE-IDENTITY-RULE-03
      description: >-
        只有运行时内部北向入口设置的请求级标识才使 AIDP 检索工具向模型结果增加唯一字段
        northbound_api_download_url；该字段只出现在模型结果，URL 只含 kds_id/file_uuid，不含 API Key、
        签名令牌或 AIDP 内部地址；普通页面默认标识为 false，并发运行不得串值。
    - rule_id: AIDP-CHAT-FILE-IDENTITY-RULE-04
      description: >-
        北向 GET 下载端点用当前北向 API Key 解析身份/租户，按目标知识库 READ 与 AIDP KB 归属校验后
        转发该文件当前最新版本，保留文件名、MIME 与原字节；无凭证、无权限、跨库或已删除文件不返回原文件。
        北向历史按当前调用身份校验会话归属并返回已保存的同一回答正文，不拼接或修正模型输出。
  required_test_stages:
    - D1
    - D2
    - D3
    - D4
    - D5
  source:
    requirement_ids:
      - AIDP-UI-08
    spec_path: local-docs/chat-aidp-source-metadata/changes/2026-11-file-identity/specs/aidp-file-identity/spec.md
    notes: >-
      AIDP 已确认 metadata.file_uuid / metadata.kds_id 为固定字段，file_uuid 可直接用于现有
      KnowledgeFiles Download；真实响应类型与上线状态仍需联调核对。Mock 通过不代表真实 AIDP 联调完成。
