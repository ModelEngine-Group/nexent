schema_version: '1.0'
module:
  id: AUTH-IDENTITY
  name: User identity presentation
feature:
  feature_id: CAS-USER-DISPLAY
  name: CAS username presentation without identity mutations
  status: active
  description: Prefer linked CAS usernames for CAS viewers while retaining legacy identity values and operations.
  business_rules:
  - rule_id: CAS-DISPLAY-RULE-01
    description: CAS viewers prefer nonblank CAS usernames and username identity column labels; other viewers preserve legacy values and email labels.
  - rule_id: CAS-DISPLAY-RULE-02
    description: Optional response metadata does not replace original email, IDs, author text or mutation payloads; existing filtering is preserved except for the explicit CAS search extension in RULE-04.
  - rule_id: CAS-DISPLAY-RULE-03
    description: Batch enrichment uses active explicitly linked identities and safely falls back when unavailable.
  - rule_id: CAS-DISPLAY-RULE-04
    description: CAS user-list search matches active linked CAS usernames or existing emails before counting and pagination; local sessions retain email-only search. Tenant, role, group, ordering and raw identity contracts remain unchanged.
  required_test_stages: [D2]
  source:
    spec_path: nexent-doc/docs/Developing/auth-cas-user-display/design.md
