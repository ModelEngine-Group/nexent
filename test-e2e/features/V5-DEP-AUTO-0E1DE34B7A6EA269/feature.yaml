  status: active
  description: '1. 依赖顺序破坏：nexent 应用 release 仍存在时误卸载基础设施，导致应用运行中断或产生孤儿/半卸载状态。

    2. 敏感信息泄露：ES API Key 以明文或宽松权限落盘，泄露后可被用于越权访问 Elasticsearch。

    3. 数据误删：卸载清理越过白名单删除非 nexent 目录，或误删仍在使用中的本地 PV 数据。

    4. 配置失配：持久化 mode、副本数等非法组合绕过校验，造成单副本数据不一致或存储绑定失败。'
