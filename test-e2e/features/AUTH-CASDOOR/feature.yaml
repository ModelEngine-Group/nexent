schema_version: '1.0'
module:
  id: AUTH-IDENTITY
  name: 身份认证与账号
feature:
  feature_id: AUTH-CASDOOR
  name: Casdoor 登录
  status: active
  description: 在 Casdoor 管理应用和用户，从 Nexent 发起授权码登录并建立本地会话。
  business_rules:
  - rule_id: AUTH-CASDOOR-CONFIG
    description: 完整有效的配置启用 Casdoor 登录入口，公开配置不包含客户端密钥。
  - rule_id: AUTH-CASDOOR-LOGIN
    description: 登录与注册使用 30 分钟的浏览器绑定 state 和 PKCE；过期后提示重新发起授权。已有稳定身份绑定复用本地账号和会话。
  - rule_id: AUTH-CASDOOR-SIGNUP
    description: Nexent 注册弹窗在 Casdoor 启用时提供注册入口；新用户在首次成功回调时直接加入配置的业务租户，无需 Nexent 邀请码或补全页。
  - rule_id: AUTH-CASDOOR-ONLY
    description: Casdoor 首次回调凭有效邮箱和稳定身份自动创建无本地密码的账号及绑定，初始角色为 USER。禁止邮箱密码登录、密码设置、其他提供方关联及解绑唯一的 Casdoor 登录方式；已有本地账号显式绑定不受影响。
  - rule_id: AUTH-CASDOOR-ROLE-SYNC
    description: 配置组织和角色映射后，Casdoor 角色同步到对应 Nexent 账号，无映射角色时为 USER。新自动开户不向 Casdoor 写入角色；历史账号的待写回仍可完成。现有会话和用户列表随之更新。
  - rule_id: AUTH-CASDOOR-FEATURE-POLICY
    description: 启用专用 Casdoor 权限模型后，通过 Casdoor 注册和已绑定 Casdoor 的租户账号使用该模型的功能权限。页面与 API 使用同一份可撤销权限结果，存量绑定账号继续在 Nexent 管理角色和密码。策略可按资源类别配置，兼容原有统一资源策略。
  - rule_id: AUTH-CASDOOR-STAGED-ACTIONS
    description: 可分批启用已接入的操作动作。启用后仅 Casdoor 有效授权能通过动作检查，已有租户和具体资源的检查继续执行。
  - rule_id: AUTH-CASDOOR-GROUP-SYNC
    description: A configured tenant projects its Casdoor organization groups, hierarchy and verified direct members. Authorized Nexent group changes update the same Casdoor records.
  required_test_stages: [D2, D4]
  source:
    requirement_ids: [AUTH-CASDOOR-20261105]
    spec_path: ../nexent-doc/docs/Developing/auth-casdoor-login/proposal.md
