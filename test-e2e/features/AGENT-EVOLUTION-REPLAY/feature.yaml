schema_version: '1.0'
module:
  id: V5-BASELINE
  name: Migrated V5 baseline
feature:
  feature_id: AGENT-EVOLUTION-REPLAY
  name: 自演进业务任务对照评测
  status: active
  description: 对同一发布版本、候选和业务任务分别执行，按题报告有效结果与缺证。
  business_rules:
  - rule_id: AGENT-EVOLUTION-REPLAY-RULE-01
    description: 基线和候选均取得有效判分才计算改进或退步；未完成、故障及缺证保留在总题数中。
  - rule_id: AGENT-EVOLUTION-REPLAY-RULE-02
    description: 用于提示词示例的材料及相同来源组不能再次作为该候选的验证任务。
  - rule_id: AGENT-EVOLUTION-REPLAY-RULE-03
    description: 新 Skill 只使用不同来源的成功开发题生成候选，样本值隔离。按维护权限生成候选，用未见的适用题和不适用题对照，分别核对交付和实际读取。
  - rule_id: AGENT-EVOLUTION-REPLAY-RULE-04
    description: 工具参数格式改动须用同一模型入参验证传输实参已纠正，正常值继续通过，正式版本只装载已确认的映射。MCP 构建按已发布的版本绑定，试评与独立确认使用各自的隔离服务。
  - rule_id: AGENT-EVOLUTION-REPLAY-RULE-05
    description: Skill 脚本专项题以沙箱实际运行的脚本、输入、退出码和输出判分，缺证不能计为通过。
  - rule_id: AGENT-EVOLUTION-REPLAY-RULE-06
    description: 开发实验冻结全部重放轮数和总时限，按租户限制并发，到期保留已有结果，缺少有效判分时不能提名。候选生成在调用模型前扣减租户和来源的额度。模型额度不足时终止当前试跑或生成，并停止后续派发。独立确认使用单独的租户模型额度，只报告整批供应商用量，额度不足时不能据部分结果晋升。
  - rule_id: AGENT-EVOLUTION-REPLAY-RULE-07
    description: 独立确认从上一个已保存的判分恢复。发出前中断可重试，已可能发出的试跑缺少判分时保留无效结论，清理私有副本并阻止晋升。
  - rule_id: AGENT-EVOLUTION-REPLAY-RULE-08
    description: 开发评测进程中断后只重排确认尚未发出的试跑。先收回旧副本，再用新回执重排一次。保留已有判分，拒绝过期回执，不自动重发可能已执行的试跑。
  - rule_id: AGENT-EVOLUTION-REPLAY-RULE-09
    description: 同一 Docker 宿主机上，普通会话与离线评测可配置各自的运行沙箱。配置仅由 Runtime 部署提供，复用和清理只作用于各自的沙箱。
  - rule_id: AGENT-EVOLUTION-REPLAY-RULE-10
    description: 公开评测报告可选录入并关联候选实验，按智能体编辑权限访问。公开分不进入业务评测、提名或晋升。
  - rule_id: AGENT-EVOLUTION-REPLAY-RULE-11
    description: P3 同时向生成器提供待修改与相关的已发布规则，仅待修改规则可替换。未获准的规则、改变位置的改写或不符合结构的回复不能生成候选。
  - rule_id: AGENT-EVOLUTION-REPLAY-RULE-12
    description: 后续候选沿用基线版本已发布的工具移除配置。工具专项题仍须有完整运行回执，按实际配置和调用核对禁止调用及必须调用的要求。
  required_test_stages: [D1, D2, D3, D5]
