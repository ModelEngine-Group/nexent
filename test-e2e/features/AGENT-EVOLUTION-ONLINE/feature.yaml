schema_version: '1.0'
module:
  id: V5-BASELINE
  name: Migrated V5 baseline
feature:
  feature_id: AGENT-EVOLUTION-ONLINE
  name: 会话中的自演进反馈
  status: active
  description: 会话所有人控制自动取证，用户可单独提交建议，业务智能体编辑者处理本版本的建议。
  business_rules:
  - rule_id: AGENT-EVOLUTION-ONLINE-RULE-01
    description: 关闭开关保留已授权记录，撤回后排除本会话已有记录，其他用户无法代为操作。
  - rule_id: AGENT-EVOLUTION-ONLINE-RULE-02
    description: 编辑者的评测工作台只显示本租户所选智能体版本的正式建议和获准复盘的摘要。
  - rule_id: AGENT-EVOLUTION-ONLINE-RULE-03
    description: 同一租户和发布版本每五个获准业务轮次跨会话复盘一次，明确纠正可先做当轮诊断。
  - rule_id: AGENT-EVOLUTION-ONLINE-RULE-04
    description: 即时诊断先用执行事实判断，语义不明时由已配置且受租户预算约束的模型分析。结果引用当前授权的证据，撤权后清除。五轮复盘复用已有结论。诊断领取到期时，其模型调用许可一同到期。
  - rule_id: AGENT-EVOLUTION-ONLINE-RULE-05
    description: 编辑者可把已确认的 Trace 题和手工题加入同一智能体的业务评测集。评测集通过引用复用题目；换版本选题仍保留题面、附件、来源和判据。移出一道题只影响之后的选题。
  required_test_stages: [D2, D3, D5]
