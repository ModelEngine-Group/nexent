{
  "schema_version": "1.0",
  "module": {
    "id": "AIDP-KNOWLEDGE",
    "name": "Knowledge retrieval"
  },
  "feature": {
    "feature_id": "AIDP-FILE-SCOPE",
    "name": "Conversation AIDP advanced metadata filtering",
    "status": "active",
    "description": "Configure a conversation-level file-name metadata filter in the chat retrieval-scope drawer and persist it in knowledge_scope v3 so the AIDP search tool only retrieves chunks from matching files, without changing Agent retrieval configuration.",
    "business_rules": [
      {
        "rule_id": "AIDP-FILE-SCOPE-RULE-01",
        "description": "The existing conversation retrieval drawer keeps its knowledge-base picker (search, tag filter, selection, pagination). Below the list an advanced-filter switch stays off by default; turning it on reveals a single file-name row with an operator select (contains / is / start with / end with, default contains) and a keyword input, plus an on-hint. There is no combination radio, no file list and no file-tag replacement: the composer keeps showing knowledge-base tags only. Turning the switch on with an empty value disables confirmation. Skill @, attachments, IME and send behavior stay unchanged."
      },
      {
        "rule_id": "AIDP-FILE-SCOPE-RULE-02",
        "description": "An enabled filter is saved in conversation knowledge_scope schema v3 as aidp.metadata_filter = {enabled, file_name: {operator, value}}; disabled filters carry no condition. v1/v2 records remain readable and the retired v2 file_scope is ignored. Turning the switch off clears the condition. Scopes remain isolated per conversation, restore on history, and changes apply only to later runs."
      },
      {
        "rule_id": "AIDP-FILE-SCOPE-RULE-03",
        "description": "The backend revalidates KB READ and the Agent/conversation knowledge range, injects kds_list and metadata_filter into every main and sub-Agent AidpSearchTool, and never lets model or sub-Agent arguments replace them. Vector/full-text retrieval uses one FusionSearch metadata_condition on original_file_name with the confirmed operators (contains / is / start with / end with), applied before recall. Graph retrieval cannot consume the condition, so a filtered run with graph enabled fails closed before an unfiltered request. The product does not claim UUID-level isolation and does not use post-topK trimming as the filter."
      },
      {
        "rule_id": "AIDP-FILE-SCOPE-RULE-04",
        "description": "Enabled-but-empty filters, unsupported operators, graph-enabled retrieval, revoked KB access or upstream-rejected conditions fail closed: no unfiltered fallback, no out-of-scope result is exposed, the user receives a concise readable status, and credentials are never exposed."
      },
      {
        "rule_id": "AIDP-FILE-SCOPE-RULE-05",
        "description": "Search method, Top K, reranking and other retrieval parameters remain owned by the Agent tool configuration. The chat drawer does not edit them, does not force a retrieval call, and creates no fake retrieval event or source when the Agent does not call AIDP Search. The message-body @file proposal is out of scope; only the existing Skill @ remains."
      }
    ],
    "required_test_stages": [
      "D1",
      "D2",
      "D3",
      "D4",
      "D5"
    ]
  }
}
