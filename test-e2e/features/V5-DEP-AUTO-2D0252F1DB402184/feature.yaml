    'keywords' / tag_value / resource_tag_assignment）时，历史数据若存在空标签、软删除（delete_flag='Y'）记录或无法唯一归属的社区/市场关联（source_mcp_id 缺失或多匹配）记录，可能导致标签丢失、重复、软删除记录复活为
    active、跨租户/跨资源串标，或迁移静默丢弃数据后 MCP 服务的 list 与 tag stats 读取与源数据不一致，影响标签筛选与已发布详情展示。
