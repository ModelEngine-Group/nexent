  name: agent/tool/context gateway 契约：上下文预算与压缩、受管 MCP/模型并发、沙箱桥接线程回收、工具与观察者消息
  status: active
  description: 'SDK与基础设施 / Core Agent: agent/tool/context gateway 契约：上下文预算与压缩、受管 MCP/模型并发、沙箱桥接线程回收、工具与观察者消息'
  business_rules:
  - rule_id: F-171-RULE-01
    description: agent/tool/context gateway 契约：上下文预算与压缩、受管 MCP/模型并发、沙箱桥接线程回收、工具与观察者消息
  - rule_id: F-171-RULE-03
    description: Context uses only combined and output capabilities, omits completion length limits, and maintains accepted history after responses using usage-calibrated estimates. Normal preparation stays pure; an explicit capacity rejection may use one bounded history-only recovery transaction per logical completion, preserving the protected frame and validating the actual full request before committing old facts. Fully proven structured bulk may use owner-bound typed original sources; any identifier outside covered regions remains strictly protected.
  - rule_id: F-171-RULE-02
    description: When the resolved default output reserve is absent and no explicit
      output budget is supplied, omit the implicit provider max_tokens cap while preserving
      internal context accounting, final-fit, compaction and bounded overflow recovery.
      PR4336 supersedes the earlier explicit-budget behavior; all output-length fields are omitted.
  required_test_stages:
  - D1
  - D3
  source:
    notes: Migrated from V5 01_代码功能清单 without changing the functional description.
