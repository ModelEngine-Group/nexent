schema_version: '1.0'
module:
  id: AUTH-IDENTITY
  name: Authentication
feature:
  feature_id: AUTH-LOCAL
  name: PostgreSQL local accounts and legacy credential migration
  status: active
  description: Authenticate without Supabase while retaining existing identities and
    CAS behavior.
  business_rules:
  - rule_id: AUTH-LOCAL-RULE-01
    description: Native password/JWT authentication uses delete_flag alone for account availability; canonical user_roles/email are account-owned; scalar response roles are computed. API-only identities remain active without email/password and batch creation is atomic across accounts, memberships, groups and keys.
  - rule_id: AUTH-LOCAL-RULE-02
    description: Atomic idempotent migration preserves IDs and compatible password
      hashes without changing permissions; source audit records are neither read nor archived. Coverage gaps, duplicate source identities and email conflicts warn with user ID and available email while deployment continues. New imports retain affected historical profiles and existing imports skip account and membership writes. Consolidated account SQL creates the final schema without account_status or pending placeholders; existing status columns are converted and removed on replay. Schema/profile/credential changes commit together. Execution errors stop deployment and the transaction owner handles uncommitted writes. Unavailable source identities remain in original records; any local account rows already created for them are retained, including the default SPEED system identity. Recognizable legacy API-only users retain working API keys; successful applied imports reclaim local Supabase containers while keeping data volumes and failures preserve the stack.
  required_test_stages:
  - D2
  - D5
  source:
    notes: User-approved removal and historical migration; SPEC auth-local-account-migration.
