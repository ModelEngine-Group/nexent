schema_version: '1.0'
module:
  id: AGENT-REPO
  name: Agent repository listings
  description: Agent repository catalog listings plus the agent management page that browses the same agents.
feature:
  feature_id: AGENT-REPO-SORT-MAIN-TAG
  name: Agent repository default order, main-agent indicator and tag search
  status: active
  description: >-
    The agent tab of the unified resource repository page lists tenant agents in its default order and marks each listing card as a main or an ordinary agent; the agent management page matches agents by tag
    on top of its name and description search, recovering tags that arrive as a stringified array instead of crashing,
    and narrows its list through a tag filter that combines with the text query and clears.
  business_rules:
  - rule_id: AGENT-REPO-SORT-MAIN-TAG-RULE-001
    description: >-
      The agent repository has no sort selector and uses the default list order, including when a legacy sort
      query parameter is present.
  - rule_id: AGENT-REPO-SORT-MAIN-TAG-RULE-002
    description: >-
      Every agent listing card on the agent tab of the unified resource repository page marks whether the listing's
      published agent version is a main agent or an ordinary agent, so main and ordinary agents are visually
      distinguished. The marker follows the published version frozen in the listing, so editing the main-agent option
      after publication leaves an already-published card unchanged until that edit is published as a new version.

  - rule_id: AGENT-REPO-SORT-MAIN-TAG-RULE-003
    description: >-
      The agent management page matches agents by tag from its search box, including a tag persisted as a stringified
      array, renders the recovered tag instead of the raw stringified value, and keeps the list usable.
  - rule_id: AGENT-REPO-SORT-MAIN-TAG-RULE-004
    description: >-
      The agent management page's tag filter narrows the list to the agents carrying the selected tag, combines with
      the free-text query as an intersection rather than a union, and clearing the tag filter restores the
      query-only result.
  - rule_id: AGENT-REPO-SORT-MAIN-TAG-RULE-005
    description: >-
      The agent repository loads the requested page in the default order without forwarding legacy sort parameters.
  required_test_stages:
  - D4
  source:
    requirement_ids:
    - AGENT-REPO-SORT-MAIN-TAG-20261013
    - AGENT-REPOSITORY-REMOVE-SORT
    notes: >-
      Traditional backend UT and frontend component UT prove the ordering helper, route forwarding and tag
      normalization; this Feature owns the browser-level acceptance of the three user-visible behaviors.
