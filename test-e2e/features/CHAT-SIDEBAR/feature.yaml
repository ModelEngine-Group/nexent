schema_version: '1.0'
module:
  id: CHAT-SIDEBAR
  name: Conversation sidebar
feature:
  feature_id: CHAT-SIDEBAR
  name: Conversation sidebar preserved after merge
  status: active
  description: Persisted visibility, normalized rename, agent-group batch selection
    and server-ID batch deletion preserve sidebar state.
  business_rules:
  - rule_id: CHAT-SIDEBAR-RULE-008
    description: Workbench uses a localized sidebar title above a full-width new-conversation action, without a conversation header. Its collapse uses responsive floating expand and compose actions. Agent discovery collapse uses one expand button. Selected-Agent collapse uses floating transparent controls, progressively hiding the title, back action and compose action at available content widths of 1340px, 1188px and 1106px. At 1034px or less only the panel-expand icon remains, retaining its original 12px left/top inset and 32px target. No header is added. Narrow mode reserves a 32px additional gutters on both sides combined with existing message padding for the original button; wider modes preserve conversation spacing. Navigation hover expansion renders above the floating button; expanded operations and mobile sheet state are retained.
  - rule_id: CHAT-SIDEBAR-RULE-003
    description: Workbench pin/unpin persists on the owning personal conversation for the authenticated user,
      using persisted conversation IDs. Tenant changes retain that personal preference. Focus/reconnect refresh hydrates missing pinned histories beyond the loaded page. Pins are newest first across devices;
      repinning moves first. Workbench rows show localized relative times when timestamps
      are available; recency/search/rename/paging
      and Agent-chat pins are preserved. Failed saves do not report success; drafts
      and inaccessible/non-Workbench conversations cannot be pinned. Pin times use
      UTC TIMESTAMP storage and explicit UTC ISO responses independently of the
      database or application timezone.
  - rule_id: CHAT-SIDEBAR-RULE-001
    description: Persisted conversations remain visible; unsent drafts stay hidden;
      rename propagates normalized title and remote identity; batch deletion resolves
      server IDs and resets deleted active threads.
  - rule_id: CHAT-SIDEBAR-RULE-002
    description: In agent-chat batch mode, selecting an agent selects or clears every
      persisted conversation for that agent across paginated list results, updates the
      selected/total state, and leaves conversations from other agents unchanged.
  - rule_id: CHAT-SIDEBAR-RULE-004
    description: Visible messages update dedicated activity; activity-based pagination and automatic metadata
      refresh preserve composer, runtime and pin semantics. Activity is stored as
      a UTC TIMESTAMP without time zone; database/session timezone changes cannot
      shift writes, cursor boundaries, pin metadata or public epoch timestamps.
  - rule_id: CHAT-SIDEBAR-RULE-005
    description: Workbench sidebar selection updates the URL to the selected saved
      conversation without document navigation or runtime replacement. New and
      unsaved conversations remove stale conversation parameters; unrelated query
      parameters and hashes remain. Reload restores the selected saved conversation.
      Each Workbench saved-history activation or reload shares one detail GET across
      restoration consumers; repeated selection of the active history issues none.
      Re-entry obtains fresh server data; version conflicts force a fresh read.
  - rule_id: CHAT-SIDEBAR-RULE-006
    description: Assistant finalization locks its owned live conversation before
      the message. Concurrent single or batch deletion follows conversation-first
      ordering, with batch conversation locks ordered by ID. Finalization cannot
      write after deletion wins; activity and message finalization remain atomic.
  - rule_id: CHAT-SIDEBAR-RULE-007
    description: Automatic titles use an owned live title revision, independent of
      message activity and unrelated audit updates. Every stored rename advances
      that revision, including same-title renames, so manual changes and the first
      successful competing title save win without holding locks during model calls.
  required_test_stages:
  - D1
  - D4
  - D3
  - D5
