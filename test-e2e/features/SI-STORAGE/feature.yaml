schema_version: '1.0'
module:
  id: INFRA-STORAGE
  name: Infrastructure
feature:
  feature_id: SI-STORAGE
  name: StorageInterface scoped storage adapters
  status: active
  description: >-
    Lightweight storage ports, explicit scope and capability checks, a logical
    record catalog, Redis KV and explicit-vector Elasticsearch adapters.
    Application migration and remaining default adapters are separate implementation batches.
  business_rules:
  - rule_id: SI-STORAGE-RULE-01
    description: Contract imports load no vendor drivers or application configuration.
  - rule_id: SI-STORAGE-RULE-02
    description: Trusted bindings enforce service, tenant, namespace and capability restrictions.
  - rule_id: SI-STORAGE-RULE-03
    description: KV revision and TTL updates are atomic and uncertain writes are not automatically replayed.
  - rule_id: SI-STORAGE-RULE-04
    description: Managed object reads retain revision and range semantics; conversion uses ObjectStore and reclaims each attempt.
  - rule_id: SI-STORAGE-RULE-05
    description: Vector storage accepts explicit vectors only, enforces tenant and collection scope, and preserves per-item write outcomes without inference or automatic replay.
  required_test_stages: [D3]
  source:
    notes: >-
      infrastructure-storage-access-interface SPEC, initial SI-P0/SI-P1 slice.
      Current unit proof belongs to traditional UT; local Redis verification is
      recorded separately and is not a formal D3 or full application acceptance.
