schema_version: '1.0'
module:
  id: OPS-PLATFORM
  name: Operations platform
feature:
  feature_id: OPS-AGENT-FACTS
  name: Agent monitoring source facts
  status: active
  description: Write Agent execution observations, publish daily metrics and expose tenant-authorized summaries, directory pages, trends and rankings.
  business_rules:
  - rule_id: OPS-AGENT-FACTS-RULE-01
    description: A main Agent's start, end and terminal replay share one Elasticsearch document routed by the execution start time.
  - rule_id: OPS-AGENT-FACTS-RULE-02
    description: A formal main Agent run emits start and terminal facts with core run timing independent of trajectory capture. An SSE reconnection replays that run.
  - rule_id: OPS-AGENT-FACTS-RULE-03
    description: Publish each confirmed execution once on its start day, preserving measured ended-run durations as an integer sum and sample count.
  - rule_id: OPS-AGENT-FACTS-RULE-04
    description: Read execution counts and weighted average durations from published Agent rows with inclusive dates, initiating group and Agent filters, and enforce the Ops tenant scope.
  - rule_id: OPS-AGENT-FACTS-RULE-05
    description: Current Agent counts use active draft rows independently of historical date and group filters. Published resource pages, inclusive daily trends and exact top five counts preserve per-tenant identities, known zero, unknown coverage and deterministic ordering.
  - rule_id: OPS-AGENT-FACTS-RULE-06
    description: Each actual child Adapter run has its existing independent invocation ID, immediate parent and root ID, two revisions and independent timing. Terminal replay preserves one fact per execution with trajectory capture disabled.
  - rule_id: OPS-AGENT-FACTS-RULE-07
    description: Success rate is succeeded_count divided by succeeded_count plus failed_count after merging selected rows. Explicit succeeded and failed or timed_out terminal outcomes enter those counts independently of available timing fields. Cancelled, ongoing and unknown outcomes are excluded, and a zero denominator returns null.
  - rule_id: OPS-AGENT-FACTS-RULE-08
    description: Agent Tokens merge attributed published model rows by actual Agent and request start day, excluding requests without Agent execution identity and retaining model usage coverage and independent publication status.
  required_test_stages: [D3]
  source:
    requirement_ids: [OPS-AGENT-FACTS-20261117, OPS-AGENT-RUNTIME-FACTS-20261118, OPS-AGENT-DAILY-20261118, OPS-AGENT-QUERY-20261118, OPS-AGENT-VIEWS-20261119, OPS-AGENT-CHILDREN-20261119, OPS-AGENT-SUCCESS-20261119, OPS-AGENT-TOKENS-20261119]
    notes: Agent collection contract and shared Ops monitoring pipeline.
