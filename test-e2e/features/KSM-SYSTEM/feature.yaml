  "feature": {
    "feature_id": "KSM-SYSTEM",
    "name": "Kubernetes SYSTEM sandbox migration",
    "status": "active",
    "description": "S1 equivalent execution per Runtime owner, scoped running-state safety and no new database schema; graceful shutdown is out of scope.",
    "business_rules": [
      {
        "rule_id": "KSM-SYSTEM-R1",
        "description": "One lazy SYSTEM sandbox per trusted Runtime Pod UID uses a fixed immutable profile, TLS and scoped management permissions."
      },
      {
        "rule_id": "KSM-SYSTEM-R2",
        "description": "Existing Python, script, workspace, file delivery and host tools retain their Docker contracts with separate invocation kernels."
      },
      {
        "rule_id": "KSM-SYSTEM-R3",
        "description": "Run reservation, generations, protected exact business associations and conservative recovery prevent duplicate execution and cross-owner mutation."
      },
      {
        "rule_id": "KSM-SYSTEM-R4",
        "description": "Deployment restrictions remain until multi-instance proof passes. Runtime uses existing shutdown; no preStop drain, management credential or guarantee of completion during scale-in/restart."
      }
    ],
    "required_test_stages": [
      "D3",
      "D4",
      "D5"
    ],
