  name: 离线 k8s 目标镜像经 ctr 导入 containerd(k8s.io)、ctr 缺失 Docker 回退、sudo/非 root 分支，以及 k8s 目标强制打包官方技能 zip
  status: active
  description: 离线 k8s 部署环境通常仅提供 containerd 而非 Docker。load-images.sh 的 k8s 目标若错用 Docker 加载、ctr 不可用时回退/报错不当、或非 root 用户无法访问 containerd
    socket，镜像将无法导入 k8s.io 命名空间，导致离线 k8s 部署无法拉起 Pod；build_offline_package.sh 若未在 k8s 目标强制打包官方技能 zip，将导致离线环境缺失技能资产。
