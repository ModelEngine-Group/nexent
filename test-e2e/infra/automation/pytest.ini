[pytest]
testpaths = d1 d2 d3 d5
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = --strict-markers --strict-config
markers =
    case_id(value): exact workbook case ID represented by the test
    stage(value): D1, D2, D3, or D5
    p0: blocking priority
    p1: important priority
    p2: non-blocking priority
    be_ut: backend unit behavior
    sdk_ut: SDK unit behavior
    fe_comp: frontend component behavior (executed by the D1 Node sub-runner)
    api_it: HTTP API integration
    contract: protocol/wire contract
    agent_it: real-model agent integration
    sec: security
    rel: reliability
    deploy: deployment
    special_id(value): D5 expanded special-matrix ID contributing evidence to a parent case
