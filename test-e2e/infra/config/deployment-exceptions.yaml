# Only deployment-sensitive exceptions belong here; ordinary Cases are unchanged.
schema_version: 1
profiles:
  modelengine:
    environment:
      MODEL_ENGINE_ENABLED: 'true'
  aidp:
    environment:
      ENABLE_AIDP_KNOWLEDGE: 'true'
      AIDP_SERVER_URL: '{mock_product_url}'
      AIDP_API_KEY: '{mock_aidp_key}'
      AIDP_TENANT_ID: aidp
  tfp:
    environment:
      NEXENT_AGENT_CORE: smolagents
      NEXENT_SANDBOX_DEFAULT_SCOPE: session
      NEXENT_SANDBOX_WORKSPACE_MODE: bind
      NEXENT_SANDBOX_CONTAINER_WORKSPACE_ROOT: /mnt/nexent/workdir
      NEXENT_SANDBOX_FAILURE_POLICY: error
      NEXENT_TOOL_FASTPATH_ENABLED: 'true'
      NEXENT_TOOL_FASTPATH_ALLOWED_TOOLS: ReadSkillConfigTool
cases:
  CTR-047: modelengine
  PW-KB-AIDP-01: aidp
  API-AUTO-0210A73052FA9CE0: aidp
  API-AUTO-22F6CB69A36D094D: aidp
