schema_version: 1
# Routing contacts, not defect attribution. Counts do not participate in routing.
domains:
  # Agent management.
  skill:
    label: Skill仓库
    owner: '@李佳阳'
    feature_categories: [Skill仓库, 技能]
    feature_id_patterns: ['^V5-PW-SKILL-', '^V5-UT-FE-023$']
  mcp:
    label: MCP仓库
    owner: '@李佳阳'
    feature_categories: [MCP仓库, MCP]
    feature_id_patterns: ['^V5-PW-MCP-', '^V5-UT-BE-016$', '^V5-UT-FE-024$']
  agent_repository:
    label: Agent仓库
    owner: '@李佳阳'
    feature_categories: [Agent仓库]
    feature_id_patterns: ['^V5-PW-MARKET-AGENT-', '^V5-UT-BE-014$', '^V5-UT-FE-022$']
  knowledge:
    label: 知识库配置
    owner: '@曹杰'
    feature_categories: [知识库配置, 知识库与文件]
    feature_id_patterns: ['^V5-PW-KB-(?!AIDP-)', '^V5-UT-BE-01[012]$', '^V5-UT-FE-02[678]$']
  model:
    label: 模型管理
    owner: '@李佳阳'
    feature_categories: [模型管理, 模型与多模态]
    feature_id_patterns: ['^V5-PW-(MODEL|MEDIA)-', '^V5-UT-BE-009$', '^V5-REL-02$']
  system:
    label: 配置管理
    owner: '@武兆福'
    feature_categories: [配置管理, 系统管理, 全局前端, 前端与全局UI, 平台运维能力]
    feature_id_patterns: ['^V5-PW-UI-', '^V5-UT-FE-038$']
  guardrails:
    label: 安全护栏
    owner: '@武兆福'
    feature_categories: [安全护栏]
    feature_id_patterns: []
  aidp:
    label: AIDP对接
    owner: '@曹杰'
    feature_categories: [AIDP对接]
    feature_id_patterns: ['^AIDP-', '^V5-PW-KB-AIDP-']
  northbound:
    label: 北向生态能力
    owner: '@夏一辰'
    feature_categories: [北向生态能力, Northbound, Northbound API]
    feature_id_patterns: ['^V5-UT-BE-02[14]$']
  a2a_acp:
    label: A2A & ACP
    owner: '@徐雅琦'
    feature_categories: [A2A, ACP, A2A & ACP]
    feature_id_patterns: ['^V5-PW-A2A-', '^V5-UT-BE-017$', '^V5-UT-FE-025$']
  # Agent runtime.
  memory:
    label: 记忆管理
    owner: '@王靖泷'
    feature_categories: [记忆管理, 记忆]
    feature_id_patterns: ['^V5-PW-(MEM|MEMORY)-', '^V5-UT-BE-025$', '^V5-UT-FE-033$']
  runtime:
    label: Agent Loop
    owner: '@潘业宏'
    feature_categories: [Agent Loop, 智能体运行时与对话, 智能体运行与对话, 会话与分享]
    feature_id_patterns: ['^CMSR-', '^V5-PW-(CHAT|SHARE|PLAN|REACT)-', '^V5-UT-BE-018$', '^V5-UT-FE-0(29|30|31|32)$', '^V5-REL-04$']
  context:
    label: 上下文工程
    owner: '@夏一辰'
    feature_categories: [上下文工程]
    feature_id_patterns: ['^V5-PW-(PROMPT|CONTEXT)-', '^V5-UT-FE-01[78]$']
  task:
    label: 定时任务
    owner: '@董济宝'
    feature_categories: [定时任务, 自动任务]
    feature_id_patterns: ['^V5-PW-TASK-', '^V5-UT-BE-019$', '^V5-UT-FE-034$', '^V5-REL-01$']
  agent_config:
    label: NL2Agent
    owner: '@徐雅琦'
    feature_categories: [NL2Agent, 智能体配置]
    feature_id_patterns: ['^V5-PW-(AGENT|NL2AGENT|VERSION)-', '^V5-UT-BE-0(13|15)$', '^V5-UT-FE-0(15|16|19|20|21)$']
  sandbox:
    label: 容器沙箱
    owner: '@杜宇骁'
    feature_categories: [容器沙箱, 沙箱]
    feature_id_patterns: ['^V5-PW-SANDBOX-']
  collaboration:
    label: 多智能体协作
    owner: '@潘业宏'
    feature_categories: [多智能体协作]
    feature_id_patterns: ['^V5-PW-PARALLEL-']
  human_in_loop:
    label: 人在回路&A2UI
    owner: '@潘业宏'
    feature_categories: [人在回路&A2UI, 人在回路, A2UI, HITL]
    feature_id_patterns: ['^V5-PW-HITL-', '^V5-REL-11$']
  # Agent operations. Self-evolution routing can be added once its Feature lands and has a contact.
  evaluation:
    label: 智能体评估
    owner: '@丁驰'
    feature_categories: [智能体评估, 评估]
    feature_id_patterns: ['^V5-PW-EVAL-', '^V5-UT-BE-020$', '^V5-UT-FE-035$']
  deployment:
    label: 安装部署/升级
    owner: '@贺思聪'
    feature_categories: [安装部署/升级, 安装部署与升级, 安装部署, 部署与升级]
    feature_id_patterns: ['^V5-DEP-']
  observability:
    label: 智能体可观测
    owner: '@贺思聪'
    feature_categories: [智能体可观测]
    feature_id_patterns: []
  resource_management:
    label: 资源管理
    owner: '@丁驰'
    feature_categories: [资源管理, 租户与资源权限, 平台资源治理]
    feature_id_patterns: ['^V5-PW-QUOTA-', '^V5-UT-BE-008$', '^V5-UT-FE-012$']
  user_permissions:
    label: 用户与权限管理
    owner: '@夏一辰'
    feature_categories: [用户与权限管理, 身份认证与账号]
    feature_id_patterns: ['^V5-PW-(AUTH|PROFILE)-', '^V5-UT-BE-00[67]$', '^V5-UT-FE-0(0[89]|1[01]|37)$']
  ops_dashboard:
    label: 运维看板
    owner: '@苏明明'
    feature_categories: [运维看板]
    feature_id_patterns: []
  system_configuration_alerts:
    label: 系统配置与告警
    owner: '@马群'
    feature_categories: [系统配置与告警]
    feature_id_patterns: []
