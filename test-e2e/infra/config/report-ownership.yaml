schema_version: 1
# Routing contacts, not defect attribution. Counts do not participate in routing.
domains:
  skill:
    label: Skill仓库
    owner: '@马群'
    feature_categories: [技能]
    feature_id_patterns: ['^V5-PW-SKILL-', '^V5-UT-FE-023$']
  mcp:
    label: MCP仓库
    owner: '@马群'
    feature_categories: [MCP]
    feature_id_patterns: ['^V5-PW-MCP-', '^V5-UT-BE-016$', '^V5-UT-FE-024$']
  agent_repository:
    label: Agent仓库
    owner: '@马群'
    feature_categories: []
    feature_id_patterns: ['^V5-PW-MARKET-AGENT-', '^V5-UT-BE-014$', '^V5-UT-FE-022$']
  knowledge:
    label: Nexent知识库 & AIDP知识库
    owner: '@曹杰'
    feature_categories: [知识库与文件]
    feature_id_patterns: ['^V5-PW-KB-', '^V5-UT-BE-01[012]$', '^V5-UT-FE-02[678]$']
  model:
    label: 模型管理
    owner: '@武兆福'
    feature_categories: [模型与多模态]
    feature_id_patterns: ['^V5-PW-(MODEL|MEDIA)-', '^V5-UT-BE-009$', '^V5-REL-02$']
  evaluation:
    label: 智能体评估
    owner: '@丁驰'
    feature_categories: [评估]
    feature_id_patterns: ['^V5-PW-EVAL-', '^V5-UT-BE-020$', '^V5-UT-FE-035$']
  system:
    label: 系统管理整体
    owner: '@武兆福'
    feature_categories: [身份认证与账号, 租户与资源权限, 系统管理, 全局前端, 前端与全局UI, 平台运维能力, 平台资源治理]
    feature_id_patterns: ['^V5-PW-(AUTH|PROFILE|QUOTA|RESOURCE|UI)-', '^V5-UT-BE-00[678]$', '^V5-UT-FE-0(0[89]|1[012]|3[78])$']
  memory:
    label: 记忆系统
    owner: '@王靖泷'
    feature_categories: [记忆]
    feature_id_patterns: ['^V5-PW-(MEM|MEMORY)-', '^V5-UT-BE-025$', '^V5-UT-FE-033$']
  runtime:
    label: 智能体运行
    owner: '@潘业宏'
    feature_categories: [智能体运行时与对话, 智能体运行与对话, 会话与分享, A2A, Northbound, Northbound API]
    feature_id_patterns: ['^CMSR-', '^V5-PW-(CHAT|A2A|SHARE|HITL|PLAN|REACT|PARALLEL)-', '^V5-UT-BE-0(17|18|21|24)$', '^V5-UT-FE-0(25|29|30|31|32)$', '^V5-REL-(04|11)$']
  context:
    label: 上下文工程
    owner: '@夏一辰'
    feature_categories: [上下文工程]
    feature_id_patterns: ['^V5-PW-(PROMPT|CONTEXT)-', '^V5-UT-FE-01[78]$']
  task:
    label: 定时任务
    owner: '@董济宝'
    feature_categories: [自动任务]
    feature_id_patterns: ['^V5-PW-TASK-', '^V5-UT-BE-019$', '^V5-UT-FE-034$', '^V5-REL-01$']
  agent_config:
    label: 智能体开发配置
    owner: '@徐雅琦'
    feature_categories: [智能体配置]
    feature_id_patterns: ['^V5-PW-(AGENT|NL2AGENT|VERSION)-', '^V5-UT-BE-0(13|15)$', '^V5-UT-FE-0(15|16|19|20|21)$']
  sandbox:
    label: 沙箱
    owner: '@杜宇骁'
    feature_categories: [沙箱]
    feature_id_patterns: ['^V5-PW-SANDBOX-']
  deployment:
    label: 安装部署/升级
    owner: '@贺思聪'
    feature_categories: [安装部署与升级, 安装部署, 部署与升级]
    feature_id_patterns: ['^V5-DEP-']
# Explicit exceptions outrank broad categories; ambiguous unmatched work stays unassigned.
