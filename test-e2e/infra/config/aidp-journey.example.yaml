# AIDP journey profile selection (machine-local; copy to
# <test-home>/config/aidp-journey.yaml and fill in real values for the
# real_smoke profile — this file is an example and must never carry real
# credentials).
#
# PW-KB-AIDP-01 is the only case reading this file: its execution.yaml
# declares `profile_selection: aidp-journey`, so the suite worker resolves
# the profile here BEFORE any preparation, records selected_profile into
# the case evidence (runtime/ext-knowledge-attach.json) and derives the
# effective required mock services from the case contract:
#   - mock: knowledge-provider (the ext-knowledge instance serves the
#     controlled AIDP; the product deployment must point AIDP at it).
#     The deployment must also register the controlled KB for the journey
#     tenant once (ACTIVE nexent.aidp_kb_permission_t row owned by the
#     tenant admin): the product intersects the AIDP catalog with local
#     permission rows and has no HTTP flow to register an existing remote
#     KB, so an unregistered seed stays invisible to the UI.
#   - real_smoke: no mock attach; the real AIDP oracle below must be
#     complete or the case is dependency-blocked.
# The selection participates in the machine-config fingerprint, so a resume
# cannot silently reuse results from a different profile.
schema_version: 1
selected_profile: mock

# Oracle for the real_smoke profile (required only when selected above).
# Every value must come from a durable, explicitly provisioned real test
# knowledge base; an unconfigured real_smoke profile blocks the case with a
# concrete dependency reason instead of falling back to mock.
real_smoke:
  kb_id: "real-kds-id-replace-me"
  kb_name: "真实测试知识库名称"
  doc_name: "预期可见的文档名称.pdf"
  query: "请引用原文回答该知识库中的固定验证问题。"
  expected_text: "预期检索返回的稳定文本片段"
  expected_source: "预期引用的来源文档标题.pdf"
