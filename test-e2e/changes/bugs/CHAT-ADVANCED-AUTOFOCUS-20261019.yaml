schema_version: '1.0'
change:
  change_id: CHAT-ADVANCED-AUTOFOCUS-20261019
  change_type: bugfix
  bug_id: CHAT-ADVANCED-AUTOFOCUS-20261019
  title: Prevent model menu autofocus from opening advanced settings
  description: Keep the shared sampling panel closed until pointer hover or explicit click/keyboard activation.
  observed_behavior: Opening the model menu focuses Advanced settings when the preceding thinking switch is disabled; its focus handler immediately opens the sampling panel.
  expected_behavior: Opening the model menu or focusing Advanced settings leaves the panel closed. Hover, click, Enter, Space and ArrowRight open it deliberately; parameter editing and reset retain existing behavior.
  escaped_stage: D4
  coverage_gap:
    type: missing_assertion
    description: Unit tests used focus as the opening action. The existing browser journey hovered the advanced row without first asserting the disabled-thinking autofocus state remains closed.
  feature_contract_changed: false
  affected_features:
    existing: [CHAT-MODEL-CONTROLS, WB-CONTROLS]
    added: []
    modified: []
    retired: []
  affected_cases:
    existing: [CHAT-MODEL-CONTROLS-D4-003]
    added: []
    modified: [WB-CONTROLS-D4-002]
    retired: []
  traditional_ut:
    decision: strengthen
    behaviors:
      - Real model-menu autofocus with a disabled thinking control must not open the advanced panel or write parameters.
      - Hover and explicit click/keyboard activation open the panel; keyboard dismissal and repeated opening remain usable.
      - Existing sampling bounds, decimal defaults, disabled state, reset and scoped model context remain unchanged.
    reason: Extend the existing shared component UT and existing D4 journey; no new D1 or API/runtime case is needed for a focus-only UI correction.
    test_selectors:
      - frontend/tests/workbench/ModelParameterSettings.test.tsx
      - frontend/tests/workbench/ModelSelectorThinking.test.tsx
  notes: Reuse the existing chat-workbench-resource-controls SPEC in the sibling document repository. Strengthen WB-CONTROLS-D4-002 step 2 for both Workbench and Agent chat with unsupported reasoning. Its saved-reset step deliberately reopens the panel after the unchanged pending lock, instead of relying on passive autofocus; all numeric, lock, DOM/draft, payload and exactly-one-PATCH assertions remain. Reuse the creator journey unchanged. Backend/SDK reasoning capability recognition, model parameter payloads, persistence and container environment are outside this fix.
