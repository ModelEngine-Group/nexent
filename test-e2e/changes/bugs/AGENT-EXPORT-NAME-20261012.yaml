schema_version: '1.0'
change:
  change_id: AGENT-EXPORT-NAME-20261012
  change_type: bugfix
  bug_id: AGENT-EXPORT-NAME-20261012
  title: Agent export used the variable name instead of the display name
  description: Exporting an agent must name the downloaded file after the agent display name, applying RFC 5987 encoding for non-ASCII ZIP filenames from the backend.
  observed_behavior: The exported ZIP was named after the agent variable name, so users received files like my_agent_var.zip instead of the visible agent name.
  expected_behavior: JSON export keeps the display-name-based filename and ZIP export sets Content-Disposition to attachment with an RFC 5987 encoded UTF-8 display-name filename.
  escaped_stage: D3
  coverage_gap:
    type: missing_assertion
    description: API-066 exercised export/import round-trips but never asserted the export filename contract for either the JSON or the skill-bound ZIP path.
  feature_contract_changed: false
  traditional_ut:
    decision: strengthen
    reason: The fix commit extends backend export tests with RFC 5987 and non-ASCII filename cases and adds a frontend component test for Content-Disposition filename decoding.
    behaviors:
    - ZIP export sets Content-Disposition with an RFC 5987 UTF-8 encoded display-name filename.
    - Frontend export decodes filename* and falls back safely for plain or missing headers.
    - Export files can be re-imported and keep tenant-safe references.
    test_selectors:
    - test/backend/app/test_agent_app.py
    - frontend/tests/component/agentExportFilename.test.tsx
  affected_features:
    existing: [F-053]
    added: []
    modified: []
    retired: []
  affected_cases:
    existing: []
    added: []
    modified: [API-066]
    retired: []
  notes: Product commit 9b74b220a. PW-AGENT-IMPORT-01 already proves the JSON display-name download at D4 and remains unchanged regression coverage.
