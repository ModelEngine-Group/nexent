schema_version: '1.0'
change:
  change_id: WORKBENCH-STREAM-STATUS-20261128
  change_type: bugfix
  bug_id: WORKBENCH-STREAM-STATUS-20261128
  title: Render the Workbench run status from the turn outcome
  description: Keep message-level execution status separate from inline errors in the shared chat adapter.
  observed_behavior: An intermediate error marks the whole response failed while the Agent is still running and can reset the clarification card. An unavailable replay also marks the original assistant message terminal even when conversation detail confirms it is still generating.
  expected_behavior: A live response remains running until a terminal outcome is known. A confirmed active message stays recoverable and reconnects using its original message ID. Terminal failure and cancellation retain their distinct states, and replay can restore the saved terminal result of that exact message.
  escaped_stage: production
  coverage_gap:
    type: missing_assertion
    description: Existing tests missed intermediate snapshots after an error and a reconnect while the exact persisted assistant message still reports streaming.
  feature_contract_changed: false
  affected_features:
    existing: [AGENT-CORE-CONFIG, SYS-AGENT-LIFECYCLE]
    added: []
    modified: []
    retired: []
  affected_cases:
    existing: []
    added: []
    modified: [WB-SESSION-RECOVERY-D4-001]
    retired: []
  traditional_ut:
    decision: strengthen
    behaviors:
    - Verify that an intermediate error cannot mark a Workbench creator turn failed or reset its clarification card.
    - Verify terminal completion, failure and cancellation, and preserve fallback for legacy streams.
    - Verify a resumed stream without a terminal event only restores the original assistant message when its persisted status is terminal.
    - Verify that an active persisted message reconnects after EOF or unavailable replay, preserving content and message identity without publishing a terminal result or creating a new turn.
    - Verify that ending the local retry budget keeps the message recoverable and that a rejected detail check still preserves the current stream result.
    reason: Controlled stream and replay tests exercise the actual adapter and resume hook without relying on a model to emit a specific event sequence.
    test_selectors:
    - frontend/tests/workbench/ExecutionStreamState.test.ts
    - frontend/tests/workbench/ConversationResumeBranch.test.tsx
    - frontend/tests/workbench/UnifiedOutputStream.test.ts
  notes: >-
    Reuses the outcome and clarification behavior in runtime-agent-core-factory AC-NA-02/03 and
    AGENT-CORE-CONFIG-RULE-004. This change concerns the frontend projection of existing events.
    The focused adapter regression supplies the intermediate error sequence and asserts each
    published status. The existing session recovery D4 case covers reconnecting the same active
    assistant after the first replay is unavailable, using isolated browser routes and owned cleanup.
