schema_version: '1.0'
change:
  change_id: TITLE-A2A-BOUNDARIES-20261010
  change_type: bugfix
  bug_id: TITLE-A2A-BOUNDARIES-20261010
  title: Preserve manual conversation titles and ordinary metadata-free A2A invocation
  description: Protect manual rename with a database compare-and-set snapshot and a frontend stale-result guard. Preserve absent Message.metadata instead of injecting an empty update in either A2A message method.
  observed_behavior: Delayed automatic titles overwrite successful manual renames; metadata-free A2A requests become explicit empty metadata updates and receive a Runtime permission failure.
  expected_behavior: Concurrent manual titles win without changing API shapes. Metadata-free A2A calls execute the published version normally; explicit metadata keeps current validation and permission checks.
  escaped_stage: D4
  feature_contract_changed: true
  coverage_gap:
    type: missing_boundary
    description: Existing D4 journeys expose both failures; deterministic UT must protect delayed completion, atomic storage preconditions, missing metadata and explicit metadata security boundaries.
  affected_features:
    existing: []
    added: []
    modified: [V5-PW-CHAT-01, V5-PW-A2A-PUBLISH-01]
    retired: []
  affected_cases:
    existing: []
    added: []
    modified: [PW-CHAT-01, PW-A2A-PUBLISH-01]
    retired: []
  traditional_ut:
    decision: strengthen
    behaviors:
      - Delayed generation cannot overwrite manual rename, including a rename to the same title.
      - Generated-title persistence checks ownership, active status, title and audit timestamp atomically.
      - Workbench fallback uses opt-in default-title-only conditional rename; ordinary manual rename keeps its existing request and response behavior.
      - Both A2A message methods preserve absent metadata through serialization; explicit metadata remains an update subject to existing checks.
    reason: Reuse the two real D4 journeys; add bounded race/security regressions without manufacturing new D1-D5 cases.
    test_selectors:
      - test/backend/services/title_observability/test_title_rename_race.py
      - test/backend/services/test_a2a_published_version.py
      - test/backend/services/test_runtime_proxy_service.py
      - test/backend/app/test_conversation_management_app.py
      - frontend/tests/conversationTitle.test.ts
  notes: 'Baselines: nexent-doc/docs/Developing/generate-session-title-by-session-model and four-service-runtime-decoupling. Additive rename field only_if_default_title defaults false; the opt-in fallback returns data=false on a concurrent/nondefault title rather than overwriting it. No migration, public entrypoint selector or permission bypass. D4 runtime acceptance requires a deployment containing this fix; local UT is separate evidence.'
