schema_version: '1.0'
change:
  change_id: AUTO-RESULT-PROPOSAL-20261124
  change_type: bugfix
  bug_id: AUTO-RESULT-PROPOSAL-20261124
  title: Reuse task results and route chat-based task proposals explicitly
  description: Restore result caching and deliver a pending proposal from the dedicated chat entry.
  observed_behavior: Reopening a loaded result repeats both GETs. Create in Chat can end with the model reporting no scheduling tool, with no pending proposal.
  expected_behavior: Result reopening reuses loaded data. Create in Chat submits the current user request to the existing proposal service and creates a task only on confirmation.
  escaped_stage: D4
  coverage_gap:
    type: missing_assertion
    description: The existing browser cases detect the failure. The deterministic regression also checks the original model reply and the entrypoint in the chat request.
  feature_contract_changed: false
  affected_features:
    existing: [F-126, V5-PW-TASK-01]
    added: []
    modified: []
    retired: []
  affected_cases:
    existing: [AUTO-RESULT-D4-001]
    added: []
    modified: [PW-TASK-01]
    retired: []
  traditional_ut:
    decision: strengthen
    test_selectors:
    - frontend/tests/workbench/AutomationResultExpansion.test.tsx
    - frontend/tests/workbench/ConversationModelDrafts.test.ts
    - test/backend/app/test_agentos_prepared_run.py
    - test/backend/app/test_agentos_evaluation_compiler.py
    - test/backend/services/test_agentos_automation_callback.py
    - test/backend/services/test_agent_automation_lifecycle.py
    - test/backend/services/test_prepared_turn_admission_errors.py
    - test/sdk/core/agents/test_agent_prompt_composer.py
    behaviors:
    - Successful empty and populated results are reusable, concurrent opens share a load, and load errors can be retried.
    - The automation entry selects a signed prepared proposal turn, while ordinary chats keep their current execution path.
    - Replaying the recorded no-tool model answer in the general chat path does not prevent the dedicated path from journaling a pending proposal.
    - The user must confirm the proposal to create the task, and missing scheduling data or proposal failure does not expose a confirmable card.
    - The dedicated entry rejects invalid Agent requests and rejects missing tool bindings before starting a run. Signed proposal callbacks retain the owned turn and handle upstream errors and malformed replies.
    reason: Existing D4 cases cover observable UI behavior; the isolated tests fix the historical model reply and verify dispatch and state boundaries without depending on model sampling.
  notes: >
    Design in nexent-doc/docs/Developing/chat-automation-proposal-routing/design.md.
    No new D1 duplicates traditional UT. No deployment or schema migration is required.
