    modified: []
    retired: []
  affected_cases:
    existing: []
    added: []
    modified: [UT-FE-AUTO-A2A0CB86E6D3E2F3, UT-FE-AUTO-A60EF4DAA250E60E]
    retired: []
  notes: Design at nexent-doc/docs/Developing/chat-agent-default-model/design.md. Existing formal scripts only need their configuration mock adapted; contracts remain unchanged. No new D1 and no API/runtime/deployment changes.
