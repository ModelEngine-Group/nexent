schema_version: '1.0'
change:
  change_id: CHAT-AUTOMATION-RUN-BACKFILL-20261027
  change_type: bugfix
  bug_id: CHAT-AUTOMATION-RUN-BACKFILL-20261027
  title: Backfill automation sources without historical activity writes
  description: Use direct run message references without unit-table access or explicit deduplication; omit historical activity backfill and retain creation-time fallback until the next visible message.
  observed_behavior: Source classification scans message units and repeatedly checks runs; activity backfill rescans the message table for each pending conversation.
  expected_behavior: Expand run message IDs and update only matching CHAT messages; preserve NULL and existing activity without rewriting conversation rows. Lists fall back to creation time, and new visible messages initialize activity.
  escaped_stage: D5
  coverage_gap:
    type: missing_assertion
    description: Existing fixtures create the unit table and omit incomplete run references; activity assertions require historical population rather than NULL preservation and omit the next-message transition.
  feature_contract_changed: true
  affected_features:
    existing: []
    added: []
    modified: [CHAT-SIDEBAR]
    retired: []
  affected_cases:
    existing: []
    added: []
    modified: [CHAT-ACTIVITY-D5-001, AUTO-QUOTA-D3-001]
    retired: []
  traditional_ut:
    decision: reuse
    behaviors:
    - Ordinary CHAT quota enforcement and trusted AUTOMATION writes retain their existing behavior.
    - Automation prompt writes retain their explicit AUTOMATION source; public requests cannot choose that source.
    reason: Product changes are confined to deployment SQL. Reuse runtime policy and provenance UT as adjacent regressions; the real PostgreSQL D5 fixture detects the migration defect without duplicating it as a SQL-text UT.
    test_selectors:
    - test/backend/database/test_conversation_activity.py
    - test/backend/services/test_agent_automation_conversation_adapter.py
  notes: >-
    Baseline b759b23cf on djb/bugfix-aotumation-sql-check. Maintain the existing
    automation/activity SPEC in the separate nexent-doc repository at
    nexent/chat-automation-activity-and-quota/design.md.
    The user's explicit instruction authorizes replacing this identified backfill
    inside the consolidated v2.8.0 migration despite the default immutable-SQL rule;
    a later migration would still execute after the original slow backfill.
    Preserve all other migration sections, runtime code, existing D1 Cases and
    historical evidence. Only disposable PostgreSQL fixtures are mutated.
    Runtime outcome and run/message association code is outside this SQL change.
    The latest user decision supersedes aggregate activity backfill with no backfill. Product deployment remains outside this change's scope.
