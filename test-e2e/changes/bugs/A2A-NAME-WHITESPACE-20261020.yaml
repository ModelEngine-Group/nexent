schema_version: '1.0'
change:
  change_id: A2A-NAME-WHITESPACE-20261020
  change_type: bugfix
  bug_id: A2A-NAME-WHITESPACE-20261020
  title: Reject whitespace in callable A2A Agent names
  description: Validate names during discovery, refresh, registration and publication.
  observed_behavior: Names containing spaces can be stored and later fail when used for invocation.
  expected_behavior: Reject whitespace before saving a callable name or creating publication snapshots.
  escaped_stage: unknown
  coverage_gap:
    type: missing_assertion
    description: Existing service and publication UT cover valid names but do not assert whitespace rejection before writes.
  feature_contract_changed: false
  affected_features:
    existing: [F-089, V5-PW-A2A-PUBLISH-01, V5-PW-A2A-DISCOVERY-01]
    added: []
    modified: []
    retired: []
  affected_cases:
    existing: []
    added: []
    modified: []
    retired: []
  traditional_ut:
    decision: add
    test_selectors:
      - test/backend/services/test_a2a_name_validation.py
      - test/backend/services/test_a2a_client_service.py
      - test/backend/services/test_a2a_server_service_registration.py
      - test/backend/services/test_agent_version_a2a_publication.py
      - test/backend/services/test_agent_version_service.py
      - frontend/tests/workbench/A2ADiscoveryErrors.test.ts
    behaviors:
      - Reject leading, trailing, internal and Unicode whitespace without changing valid names.
      - Reject invalid discovered and refreshed names before persistence.
      - Reject registration names and Card name overrides before persistence.
      - Reject A2A publication before snapshot and version writes; retain ordinary publication behavior.
      - Show localized whitespace guidance for URL discovery, Nacos discovery and refresh; preserve API failure details and generic fallback.
    reason: A local name-validation rule and write ordering are proved by isolated service UT. Existing formal journeys cover successful discovery and invocation, with no route or protocol change.
  notes: >-
    Design ../nexent-doc/docs/Developing/dev-agent-a2a-published-version/changes/a2a-name-whitespace/design.md.
    Inspected F-089, discovery/publication D4 contracts, existing catalog, registration and publication UT.
    No new D1 duplicates isolated validation. D2-D5 journey/protocol/risk obligations are unchanged;
    formal Cases are retained, with no formal execution claimed for this unit-validation fix.
    Verification: 147 A2A/name/publication UT and 107 publisher UT passed separately;
    disabling validation in a separate test process produced 29 regression failures.
    Copyright and whitespace checks passed. Design and implementation formal validation passed.
    Frontend error-visibility follow-up: 15 workbench UT passed using real API error parsing
    with controlled fetch; both languages and URL/Nacos/refresh are covered. No browser run claimed.
