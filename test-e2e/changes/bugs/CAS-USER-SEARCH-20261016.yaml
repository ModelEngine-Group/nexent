schema_version: '1.0'
change:
  change_id: CAS-USER-SEARCH-20261016
  change_type: bugfix
  bug_id: CAS-USER-SEARCH-20261016
  title: Search CAS user names and emails with matching placeholder
  description: Extend the existing user-list search for authenticated CAS sessions and localize its placeholder.
  observed_behavior: CAS user names are displayed but search still matches only emails and says Search email.
  expected_behavior: CAS sessions can search active linked usernames or emails across all pages; local sessions retain email-only search.
  escaped_stage: D2
  coverage_gap:
    type: missing_assertion
    description: Previous display-only tests deliberately preserved email search and never asserted a username unrelated to its email.
  feature_contract_changed: true
  traditional_ut:
    decision: add
    reason: Database execution must prove name/email matching, pagination and scoped filtering; frontend tests prove session-dependent placeholder and unchanged requests.
    behaviors:
    - Match CAS names independently of emails, including case-insensitive partial names and duplicate names/bindings.
    - Preserve local email search, tenant boundaries, active rows, role/group filters, counts, sorting and raw identities.
    - Keep blank/no-match searches and query errors consistent with the existing contract.
    - Update CAS placeholders in both locales and preserve original search request shape.
    test_selectors:
    - test/backend/database/test_user_tenant_search_db.py
    - test/backend/app/test_user_search_app.py
    - frontend/tests/component/casResourceIdentity.test.tsx
    - frontend/tests/component/casIdentityApiContract.test.tsx
    - frontend/tests/component/casUserSearch.test.tsx
    - frontend/tests/component/userIdentity.test.tsx
