    existing: [F-018]
    added: []
    modified: [CAS-USER-DISPLAY]
    retired: []
  affected_cases:
    existing: []
    added: []
    modified: [CAS-DISPLAY-D2-001]
    retired: []
  notes: The user explicitly expanded the previous display-only scope on 2026-10-16. The existing local design is nexent-doc/docs/Developing/auth-cas-user-display/design.md. CAS authentication journeys retain skipped_by_policy status; no new login or deployment behavior is introduced.
