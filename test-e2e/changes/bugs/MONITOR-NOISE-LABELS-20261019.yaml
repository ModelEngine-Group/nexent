schema_version: '1.0'
change:
  change_id: MONITOR-NOISE-LABELS-20261019
  change_type: bugfix
  bug_id: MONITOR-NOISE-LABELS-20261019
  title: Configure monitoring exclusions and propagate consistent main Agent trace names
  description: Extend the existing export filter and set Chinese display names on request-scoped Workbench and NL2Skill configurations. The October 21 follow-ups configure exclusion lists and propagate a trace-ID-scoped main Agent name to child spans and recording HTTP ancestors before incremental export.
  observed_behavior: Noise exclusions and Chinese labels are implemented. The follow-up Langfuse investigation found the same trace ID under empty and named filters; only the main agent.run carried langfuse.trace.name while its HTTP root and children lacked it.
  expected_behavior: By default omit Elasticsearch search, indices.stats, indices.get_settings, indices.get_alias, bulk, indices.exists and indices.delete spans, plus the exact knowledge.process.submit and knowledge.upload.batch span names. MONITORING_EXCLUDED_ELASTICSEARCH_OPERATIONS and MONITORING_EXCLUDED_SPAN_NAMES replace the respective comma-separated list; unset retains defaults, explicit empty disables the respective filter, and entries are trimmed and deduplicated. Retain exact matching, database scoping, other operations and business tools. Workbench and NL2Skill traces use 智能工作台 and 技能创建助手 while executable identifiers and published snapshots remain unchanged. The first named main Agent fixes the trace name for same-trace children and recording HTTP ancestors, including early batches and sequential runs; different traces remain isolated and child identities remain unchanged. Verify real Langfuse filter consistency separately from producer UT.
  escaped_stage: production
  feature_contract_changed: true
  coverage_gap:
    type: missing_assertion
    description: Original tests retained Elasticsearch search and lacked Chinese labels. Follow-ups add configurable exclusions and close the trace-name gap; prior trace tests required only the main span's name and explicitly excluded child attributes. New assertions cover early batches, real FastAPI middleware, managed workers, sequential runs, concurrency and detached traces. The existing formal exporter Case tests configuration parsing only; the new D3 checks actual Langfuse ingestion and filters.
  affected_features:
    existing: [F-078]
    added: []
    modified: [F-169]
    retired: []
  affected_cases:
    existing: [UT-SDK-014]
    added: [MON-D3-TRACE-NAME-001]
    modified: []
    retired: []
  traditional_ut:
    decision: strengthen
    behaviors:
      - Filter the seven selected Elasticsearch operations on success and failure without changing requests, responses or errors.
      - Suppress the two exact knowledge-ingestion span names for root and nested synchronous/asynchronous calls while preserving return values and exceptions.
      - Retain other Elasticsearch operations, non-Elasticsearch spans, other knowledge spans, Agent runs and business search tools with their parent relationships.
      - Provide Chinese built-in runtime display names for legacy and missing Workbench labels without mutating published snapshots or child identities.
      - Preserve NL2Skill's executable name and existing runtime options while adding its Chinese display name.
      - Preserve exclusion defaults when unset, replace each list independently when configured, and disable the respective filter with an empty value; normalize comma-separated entries and reject invalid SDK list types.
      - Forward backend environment values through both bootstrap import paths into actual SDK batch-export filtering without introducing SDK environment reads or requiring optional OpenTelemetry dependencies.
      - Propagate a main Agent's trace-ID-scoped name to same-trace child spans and recording HTTP ancestors before early child export, retaining child identities, parentage, filtering and error behavior.
      - Isolate names across concurrent requests, detached traces and subsequent runs, including managed-thread propagation and exceptional cleanup.
      - Retain the first resolved trace name across sequential main runs in one trace while preserving each run's own Agent identity.
    reason: Strengthen production-path exporter and naming UT without adding a duplicate D1. UT-SDK-014 remains a separate parser regression. MON-D3-TRACE-NAME-001 adds distinct manual proof across the real runtime, Collector and Langfuse boundary; its blocked status cannot be satisfied by in-memory exporter UT.
    test_selectors:
      - test/sdk/core/agents/observability/test_elasticsearch_spans.py
      - test/sdk/core/agents/observability/test_monitoring_exclusions.py
      - test/backend/utils/test_monitoring_exclusions.py
      - test/backend/utils/test_monitoring.py
      - test/backend/utils/test_monitoring_knowledge_filter.py
      - test/backend/utils/test_knowledge_telemetry.py
      - test/sdk/core/agents/observability/test_trace_name.py
      - test/sdk/core/agents/observability/test_trace_name_propagation.py
      - test/sdk/core/agents/observability/test_sandbox_warmup.py
      - test/sdk/core/agents/observability/test_run_span_context.py
      - test/sdk/monitor/test_monitoring.py
      - test/sdk/core/agents/observability/test_agent_display_name.py
      - test/backend/services/test_workbench_monitoring_labels.py
      - test/backend/services/test_workbench_service.py
      - test/backend/services/test_workbench_service_coverage.py
      - test/backend/services/test_nl2skill_service.py
  notes: 'Design and acceptance: test-e2e/changes/bugs/MONITOR-NOISE-LABELS-20261019/design.md. The sibling nexent-doc/nexent_SPEC document baseline is unavailable in this checkout. No HTTP/schema/provisioning or deployment execution change is implied. MON-D3-TRACE-NAME-001 adds manual real Langfuse ingestion/filter proof beyond UT and requires a disposable updated deployment. Do not infer storage overwrite details from the observed same-ID name-filter inconsistency; runtime acceptance and historical records remain separate from producer UT.'
