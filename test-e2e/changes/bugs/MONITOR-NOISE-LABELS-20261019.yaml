      - test/sdk/core/agents/observability/test_agent_display_name.py
      - test/backend/services/test_workbench_monitoring_labels.py
      - test/backend/services/test_workbench_service.py
      - test/backend/services/test_workbench_service_coverage.py
      - test/backend/services/test_nl2skill_service.py
  notes: 'Design and acceptance: test-e2e/changes/bugs/MONITOR-NOISE-LABELS-20261019/design.md. The sibling nexent-doc/nexent_SPEC document baseline is unavailable in this checkout; the local design records this limitation. No runtime model, HTTP, database schema, provisioning revision or deployment changes are required. Formal Case execution is reported separately from current-fix UT acceptance.'
