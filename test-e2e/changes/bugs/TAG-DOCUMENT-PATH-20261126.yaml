  traditional_ut:
    decision: add
    behaviors:
      - Preserve document paths through gateway reads and writes with existing access controls and required task context.
      - Keep the client save guard in place until assignment loading succeeds and allow retry after a read error.
    reason: Verify request transport, the fixed gateway allowlist, and the modal failure path locally. The formal D2 case uses its existing owned tag_resources fixture and writes the current value IDs back before verifying them.
    test_selectors:
