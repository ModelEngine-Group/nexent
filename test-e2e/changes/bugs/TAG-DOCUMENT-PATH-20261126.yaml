  bug_id: TAG-DOCUMENT-PATH-20261126
  title: Restore document tag assignment through the gateway
  description: Carry the provider-scoped document identifier in the assignment query.
  observed_behavior: The document tag editor cannot load current assignments when the document identifier includes a slash.
  expected_behavior: Authorized users can read and replace assignments for uploaded documents through the gateway.
  escaped_stage: D3
  coverage_gap:
    type: missing_boundary
    description: Previous management route coverage bypassed gateway path validation and request forwarding.
