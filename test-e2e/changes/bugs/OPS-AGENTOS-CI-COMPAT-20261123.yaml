    retired: []
  traditional_ut:
    decision: strengthen
    behaviors: [Keep process-local timing out of strict prepared transport models, Preserve real SDK execution clocks, Start shared health without monitoring dependencies, Reject invalid Ops database names before engine creation, Resolve declared source packages in subprocess tests]
    reason: Actual CI exposed untested preparation DTO compatibility and isolated process assumptions; retain all original failing assertions and add the narrow wire-model regression.
