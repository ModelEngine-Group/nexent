  bug_id: OPS-AGENTOS-CI-COMPAT-20261123
  title: Preserve prepared wire contracts and isolated monitoring startup
  description: Fix preparation timing on strict transport DTOs, lazy optional monitoring configuration and CI test isolation while preserving schemas and monitoring metrics.
  observed_behavior: Preparation assigned a process-local clock to strict transport models, minimal shared Web startup loaded monitoring configuration eagerly, and isolated CI subprocesses lacked declared package paths.
  expected_behavior: Prepared DTOs remain serializable, optional monitoring is lazy, invalid Ops database names fail before engine creation, and isolated tests load the intended source packages.
  escaped_stage: D3
  coverage_gap:
    type: missing_assertion
    description: Targeted regressions omitted production prepared DTO compilers and CI process assumptions; the subsequent full run passed but exposed missing patch-level unit proof for batch replay, publication, ES completeness and worker cleanup.
