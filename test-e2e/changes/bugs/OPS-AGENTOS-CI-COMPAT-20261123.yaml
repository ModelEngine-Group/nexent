    added: []
    modified: []
    retired: []
  traditional_ut:
    decision: strengthen
    behaviors: [Keep process-local timing out of strict prepared transport models, Preserve real SDK execution clocks, Start shared health without monitoring dependencies, Reject invalid Ops database names before engine creation, Resolve declared source packages in subprocess tests, Preserve batch replay and publication failure boundaries, Reject incomplete ES reads and mismatched bulk conflicts, Keep store publication guards and worker cleanup]
    reason: Retain all original failing assertions and the wire-model regression; complete delivery with unit proof of uncovered replay, publication, ES and resource-lifetime contracts already exercised by unchanged formal PG/ES cases.
