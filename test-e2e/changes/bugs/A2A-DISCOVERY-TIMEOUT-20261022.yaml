schema_version: '1.0'
change:
  change_id: A2A-DISCOVERY-TIMEOUT-20261022
  change_type: bugfix
  bug_id: A2A-DISCOVERY-TIMEOUT-20261022
  title: Bound Agent discovery and expose timeout failures
  description: Use a backend-owned 10-second discovery deadline with explicit frontend errors and guaranteed loading cleanup.
  observed_behavior: Discovery inherits 300-second HTTP attempts and the UI waits without a clear failure.
  expected_behavior: Discovery times out clearly, ends loading and supports retry.
  escaped_stage: unknown
  coverage_gap:
    type: missing_boundary
    description: Existing CTR-033 asserts the old long timeout; frontend tests lack pending-request and loading-state assertions.
  feature_contract_changed: true
  affected_features:
    existing: [V5-PW-A2A-DISCOVERY-01]
    added: []
    modified: [F-089, F-090]
    retired: []
  affected_cases:
    existing: []
    added: []
    modified: [CTR-033, CTR-035]
    retired: []
  traditional_ut:
    decision: strengthen
    test_selectors:
      - test/backend/app/test_a2a_client_app.py
      - test/backend/services/test_a2a_client_service.py
      - frontend/tests/workbench/A2ADiscoveryErrors.test.ts
      - frontend/tests/workbench/A2ADiscoveryLoading.test.tsx
    behaviors:
      - Bound discovery, cancel overdue service work and preserve successful responses and ordinary error details.
      - Use a single 10-second Card request for URL and Nacos discovery.
      - Await backend discovery responses without a frontend deadline or abort signal; localize backend HTTP 504.
      - Clear URL and Nacos loading on failure and allow successful retry with localized errors.
    reason: Extend existing isolated endpoint, service and rendered-component UT; runtime HTTP proof remains CTR-033 and CTR-035.
  notes: >-
    Design ../nexent-doc/docs/Developing/dev-agent-a2a-published-version/changes/dev-agent-discovery-timeout/design.md.
    CTR-033 previously asserted three 300-second attempts; the user's explicit discovery deadline changes that contract.
    Invocation and refresh timeouts remain outside scope. No duplicate D1 or unrelated D4 journey expansion.
    Verification: backend endpoint UT 16 passed; catalog and shared HTTP UT 137 passed separately;
    initial frontend service/component UT 33 passed before the user-requested removal of the frontend fallback. Type-check and test lint passed; no added product lint diagnostics
    versus HEAD. Formal CTR-033 and CTR-035 were attempted but blocked by administrator sign-in HTTP 401,
    before discovery; runtime acceptance is pending. See design for sanitized evidence paths and semantic review.
    User revision removed the frontend deadline and AbortController; backend 10-second timeout and UI finally cleanup remain.
    Revised frontend UT 33 passed, endpoint regression UT 16 passed, type-check and formal asset validation passed.
