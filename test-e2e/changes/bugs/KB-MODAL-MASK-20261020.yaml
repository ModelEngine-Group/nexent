  change_type: bugfix
  bug_id: KB-MODAL-MASK-20261020
  title: Remove the deprecated knowledge creation modal mask prop
  description: Migrate the knowledge configuration page's creation Modal from maskClosable=false to mask.closable=false.
  observed_behavior: Entering knowledge configuration renders the creation Modal with the deprecated maskClosable prop and emits an Ant Design development warning even while the modal is closed.
  expected_behavior: Entering knowledge configuration emits no maskClosable deprecation warning; clicking the creation modal mask still does not close it.
  escaped_stage: D4
  coverage_gap:
    type: missing_assertion
    description: Catalog interaction tests do not cover development console deprecation warnings on the parent configuration page.
  feature_contract_changed: false
  affected_features:
    existing: []
    added: []
    modified: []
    retired: []
  affected_cases:
    existing: []
    added: []
    modified: []
    retired: []
  traditional_ut:
    decision: exempt
    behaviors: []
    reason: This is a non-behavioral Ant Design prop migration retaining the explicit false value. Browser console and mask interaction checks are the relevant proof; no cosmetic-only test or Python/backend test is added.
  notes: >-
    Only the knowledge configuration creation Modal is changed. Existing close callbacks, keyboard behavior, form state and upload handling remain unchanged. Existing formal Cases and scripts are preserved; no new D1-D5 quota. Sibling nexent-doc is unavailable, so no external SPEC is created in the product repository.
    Verification: live browser navigation and opening creation showed no maskClosable console warning. Clicking the mask kept the creation dialog open; cancellation closed it without creating data. Copyright and implementation-phase asset checks passed with --require-ut-change KB-MODAL-MASK-20261020. Full-file lint reported existing hook/any issues outside the one-line patch; the file also has existing format drift, which was not broadly rewritten.
