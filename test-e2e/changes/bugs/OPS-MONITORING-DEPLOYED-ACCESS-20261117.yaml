    existing: [OPS-MODEL-MONITORING-D5-001]
    added: []
    modified: [OPS-MODEL-MONITORING-D3-001]
    retired: []
  traditional_ut:
    decision: strengthen
    behaviors: [Exercise the full year and legacy refresh targets, Check the proxy routing and neighboring paths, Check Helm service references with or without trajectory]
    reason: Existing tests covered short refresh targets and the trajectory proxy but lacked these model monitoring deployment cases.
    test_selectors: [test/backend/ops/test_monitoring_api.py, test/backend/ops/test_trajectory_proxy.py, test/backend/deploy/test_ops_chart.py, frontend/tests/apiProxyRouting.test.mjs]
