  change_type: bugfix
  bug_id: OPS-MONITORING-DEPLOYED-ACCESS-20261117
  title: Restore model monitoring through the deployed Ops entry points
  description: Route Web requests to Ops, read service credentials from the Helm sources, and compact the signed refresh target for the supported date range.
  observed_behavior: Web dispatched monitoring requests to Config, standalone Ops read the Elasticsearch endpoint and credentials from the environment Secret, and a full date range could create an oversized status URL.
  expected_behavior: The Web path is handled by Ops, Helm obtains the service settings with trajectory capture off or on, and the refresh status URL stays bounded while retaining individual day targets.
  escaped_stage: D3
  coverage_gap:
    type: missing_assertion
    description: The integration case previously constructed a standalone router and skipped the Ops application root path. Existing proxy and deployment tests lacked Ops model monitoring coverage.
  feature_contract_changed: false
  affected_features:
    existing: [OPS-MODEL-MONITORING]
    added: []
    modified: []
    retired: []
