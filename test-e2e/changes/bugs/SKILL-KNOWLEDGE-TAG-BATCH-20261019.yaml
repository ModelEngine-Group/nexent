  traditional_ut:
    decision: add
    behaviors:
      - Batch only visible skill IDs and knowledge index names, isolating page results.
      - Enforce tenant ownership and existing skill group and knowledge access rules with bounded queries.
      - Validate positive skill IDs and nonempty index names; preserve selection, refresh and pagination behavior.
    reason: Unit proofs cover orchestration and SQL construction; manual runtime request counts remain separate from unchanged formal regressions.
    test_selectors:
      - test/backend/services/test_skill_knowledge_tag_batch.py
