  bug_id: SKILL-KNOWLEDGE-TAG-BATCH-20261019
  title: Batch visible skill and knowledge-base tag reads
  description: Load canonical skill and knowledge-base assignments once per visible page using bounded database queries.
  observed_behavior: Every visible skill or knowledge-base row independently requests its assignments.
  expected_behavior: One page request reads tags using tenant-scoped skill/knowledge-base and assignment IN queries with existing read permissions.
  escaped_stage: D4
  coverage_gap:
    type: missing_assertion
    description: Existing picker tests cover selection and tag filtering but do not assert batch reads or canonical tag ID payloads.
  feature_contract_changed: false
