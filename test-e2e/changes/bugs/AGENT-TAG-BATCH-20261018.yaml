change:
  change_id: AGENT-TAG-BATCH-20261018
  change_type: bugfix
  bug_id: AGENT-TAG-BATCH-20261018
  title: Batch visible collaborative agent tag reads
  description: Load canonical agent assignments once per visible page using bounded database queries.
  observed_behavior: Every visible collaborative agent card independently requests its assignments.
  expected_behavior: One page request reads tags using tenant-scoped agent and assignment IN queries with existing read permissions.
  escaped_stage: D4
  coverage_gap:
    type: missing_assertion
    description: Existing picker tests cover selection and tag filtering but do not assert batch reads or canonical tag ID payloads.
  feature_contract_changed: false
  affected_features:
    existing: [F-177, AGENT-EDITOR-WORKFLOWS]
    added: []
    modified: []
    retired: []
  affected_cases:
    existing: [API-AUTO-3DDBA5C9A0148698, AGENT-EDITOR-D4-004]
    added: []
    modified: []
    retired: []
  traditional_ut:
    decision: add
    behaviors:
      - Batch only visible canonical agent tag IDs, isolate page results and never request tags for external cards without local identities.
      - Enforce tenant draft visibility and existing read permissions using bounded queries, preserving empty assignments.
      - Validate and deduplicate positive IDs; preserve selection, refresh and pagination behavior.
    reason: Unit proofs cover orchestration and SQL construction; manual runtime request counts remain separate from unchanged formal regressions.
    test_selectors:
      - test/backend/services/test_agent_tag_batch.py
      - frontend/tests/component/agentDrawer.test.tsx
      - frontend/tests/component/resourceTagFilter.test.tsx
  notes: 'Design: ../nexent-doc/docs/Developing/chat-resource-drawer-reuse/design.md, Collaborative agent tag batching. Reuse tool batch tests as adjacent regressions.'
