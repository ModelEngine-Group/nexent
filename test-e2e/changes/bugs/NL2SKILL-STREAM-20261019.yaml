schema_version: '1.0'
change:
  change_id: NL2SKILL-STREAM-20261019
  change_type: bugfix
  bug_id: NL2SKILL-STREAM-20261019
  title: Preserve incremental Skill output and retry rollback
  description: Route final_answer deltas through the incremental Skill classifier and restore parser state on failed model attempts.
  observed_behavior: Later final_answer fragments are discarded after the first Skill tag; retry rollback leaves partial tags in the parser.
  expected_behavior: Reassemble Skill files and summary exactly once across tag boundaries, ignore duplicate completion bodies, and discard failed attempt buffers.
  escaped_stage: D1
  coverage_gap:
    type: missing_assertion
    description: Existing UT expects later final_answer content to be dropped and lacks phased deltas, parser rollback and reasoning-tag isolation assertions. AGT-040 only checks done and the word skill, not reconstructed files.
  feature_contract_changed: false
  traditional_ut:
    decision: strengthen
    reason: Add deterministic SSE transformation regressions using the real classifier and frontend draft reducer; reuse model controls and snapshot tests unchanged.
    behaviors:
    - Preserve every delta across fragmented Skill, file and summary tags and avoid duplicate complete bodies.
    - Restore parser state on rollback and retain event attempt metadata and commit ordering.
    - Preserve legacy output, targeted writes, draft snapshots and model parameter forwarding.
    - Explicit model reasoning may quote control tags but never writes generated Skill files.
    test_selectors:
    - test/backend/services/test_nl2skill_stream.py
    - test/backend/services/test_nl2skill_service.py
    - test/backend/utils/test_content_classifier_utils.py
    - test/backend/services/test_run_model_controls.py
    - test/backend/services/test_sampling_model_controls.py
    - frontend/tests/workbench/SkillCreationReasoningStream.test.ts
    - frontend/tests/workbench/CreationRuntime.test.ts
    - frontend/tests/workbench/WorkbenchPageLifecycle.test.tsx
    - frontend/tests/workbench/ConversationModelControls.test.tsx
    - frontend/tests/workbench/ConversationRestore.test.ts
  affected_features:
    existing: [F-078]
    added: []
    modified: []
    retired: []
  affected_cases:
    existing: []
    added: []
    modified: []
    retired: []
  notes: Direct update of nexent-doc/nexent/agent-workbench/design.md, section NL2SKILL-STREAM-20261019. No new formal Case duplicates isolated parser UT. AGT-040 is historical runtime inventory, not proof of file reconstruction. Separate browser-led real-model verification is recorded in the design; it is not counted as formal Case execution.
