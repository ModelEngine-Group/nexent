schema_version: '1.0'
change:
  change_id: AGENT-GUIDE-TIMING-20261019
  change_type: bugfix
  bug_id: AGENT-GUIDE-TIMING-20261019
  title: Show creation onboarding before the editor's first interactive paint
  description: Remove the redundant agentInfo fetch prerequisite and open the guide from its mount callback once its targets exist.
  observed_behavior: The editable workspace becomes available before a duplicate agent-info response and a scheduled animation frame open onboarding.
  expected_behavior: Onboarding opens when the requested editable Agent and guide targets mount, without waiting for a duplicate info response or another frame; completed guides and readonly access retain their existing rules.
  escaped_stage: D4
  coverage_gap:
    type: missing_assertion
    description: Existing editor cases cover creation and completion persistence, but not initial guide opening without animation-frame delivery.
  feature_contract_changed: false
  affected_features:
    existing: [AGENT-EDITOR-WORKFLOWS]
    added: []
    modified: []
    retired: []
  affected_cases:
    existing: []
    added: []
    modified: []
    retired: []
  traditional_ut:
    decision: add
    behaviors:
    - Open immediately with mounted targets even if animation frames have not run
    - Respect completed onboarding preferences
    - Avoid opening against missing targets
    test_selectors:
    - frontend/tests/workbench/AgentCreationGuideTiming.test.tsx
    reason: Frontend lifecycle regression with real DOM target resolution and controlled tour rendering; no backend/Python behavior changes or duplicate D1 assets.
  notes: >-
    The editor already waits until its requested Agent is current; a second info request is not needed for target readiness.
    A hidden local anchor scopes target lookup before the parent workspace ref is attached in the initial commit.
    AGENT-EDITOR-RULE-001 remains unchanged; existing D4 assets do not prove opening latency.
    Referenced sibling nexent-doc repository is absent. Formal browser timing evidence remains unverified; component tests are not a D4 pass.
