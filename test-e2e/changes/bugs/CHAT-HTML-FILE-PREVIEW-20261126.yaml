    existing: [F-105, V5-PW-FILE-01]
    added: []
    modified: []
    retired: []
  affected_cases:
    existing: [API-108, API-109, PW-FILE-01]
    added: []
    modified: []
    retired: []
  notes: Design at nexent-doc/docs/Developing/chat-html-file-preview/design.md. Existing formal cases cover adjacent stored-file and chat attachment paths.
