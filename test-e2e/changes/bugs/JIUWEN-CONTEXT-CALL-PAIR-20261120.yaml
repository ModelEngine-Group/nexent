schema_version: '1.0'
change:
  change_id: JIUWEN-CONTEXT-CALL-PAIR-20261120
  change_type: bugfix
  bug_id: JIUWEN-CONTEXT-CALL-PAIR-20261120
  title: Preserve actual Jiuwen call identities in post-response maintenance
  description: Keep text-converted calls paired and associate same-name results by the already matched provider ID.
  observed_behavior: The maintenance assistant snapshot uses raw calls while pending execution uses converted calls;
    text execution therefore produces an orphan tool result. Completion consumes the first same-name pending call.
  expected_behavior: The maintenance snapshot records authorized native calls actually dispatched. Results consume
    their matching provider call ID; ambiguous missing identities never guess another pending call.
  escaped_stage: D3
  coverage_gap:
    type: missing_assertion
    description: Existing maintenance tests used raw-empty and native-nonempty doubles without asserting pairing,
      and exercised only one pending call. Add text pairing, reverse same-name completion and unknown-ID assertions.
  feature_contract_changed: false
  affected_features:
    existing: [JIUWEN-CONTEXT]
    modified: []
    added: []
    retired: []
  affected_cases:
    existing: [JIUWEN-CONTEXT-D3-001]
    modified: []
    added: []
    retired: []
  traditional_ut:
    decision: strengthen
    behaviors:
    - Preserve converted text-execution call ID, name and arguments in the maintenance assistant snapshot.
    - Match reverse same-name results by provider ID, ignore foreign and ambiguous completions.
    - Preserve unique legacy completion, duplicate/cancel/nested isolation and post-response-only scheduling.
    reason: Unit assertions reproduce the association defect without external services. No duplicate D1 is needed;
      actual integrated history/protocol acceptance remains separately required and paused.
    test_selectors:
    - test/sdk/core/agents/test_jiuwen_context.py
    - test/sdk/core/agents/test_jiuwen_errors.py
  notes: 'SPEC: ../nexent-doc/docs/Developing/model-access-native-agent/followups/20261112-remove-output-budget/02 Technical Design.md,
    paused-fix FIX-JW-01/02/03, existing AC-006/008/009/011. Scope restores context accounting identity only;
    it adds no execution authority, reasoning-as-answer, vendor fallback or retry. Formal/real-model execution is
    paused by the designated coordinator. A passing UT does not establish that all reported phantom calls are resolved.'
