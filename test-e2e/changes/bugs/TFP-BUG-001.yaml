schema_version: '1.0'
change:
  change_id: TFP-BUG-001
  change_type: bugfix
  bug_id: TFP-BUG-001
  title: Pair deferred official tools with the effective run policy configuration
  description: Use the same filtered configuration sequence for tool construction and official fast-path registration.
  observed_behavior: Docker Agent construction fails with a strict zip length mismatch when the run policy filters out any configured tool.
  expected_behavior: Root and child Agents register only policy-executable official tools with their matching configuration, remain cold for eligible actions, and exclude blocked tools.
  escaped_stage: unknown
  coverage_gap:
    type: missing_boundary
    description: UT covered run-policy filtering without a Docker executor and deferred factory construction without a policy, but missed their combination and positional matching after filtering.
  feature_contract_changed: false
  traditional_ut:
    decision: add
    reason: Add focused factory regression assertions for the policy and deferred-executor combination while reusing registry, lifecycle and prompt-policy UT.
    behaviors:
    - Preserve configuration and exact tool identity pairing after prefix, suffix, empty and schema-version filtering for root and child Agents.
    - Preserve hidden executable tools while excluding MCP identities and filtered-out tools from the official host fast path.
    - Preserve zero Docker acquisitions for eligible actions and eager behavior for explicit opt-out.
    test_selectors:
    - test/sdk/core/agents/test_nexent_agent_tool_fastpath_policy.py
    - test/sdk/core/agents/test_tool_fastpath_registry.py
    - test/sdk/core/agents/test_nexent_agent_tool_fastpath.py
    - test/sdk/core/agents/test_nexent_agent_context_runtime_factory.py
  affected_features:
    existing: [TFP-001]
    added: []
    modified: []
    retired: []
  affected_cases:
    existing: [TFP-D1-004, TFP-D1-006]
    added: []
    modified: []
    retired: []
  no_case_change_reason: The defect is the factory's unit-level configuration-instance pairing. Traditional UT proves that correction; existing identity and lifecycle Cases remain unchanged regression checks, without claiming they detect this new policy variant.
  notes: Reuse the TFP-001 SPEC at nexent-doc/docs/Developing/runtime-sandbox-tool-fastpath/design.md and its TFP-RULE-002/005 contracts. No production incident is assumed from the review screenshot. HTTP, policy/schema semantics, strict identity checks and deployment behavior remain unchanged; live D3/D4 prerequisites stay outside this unit-level fix.
