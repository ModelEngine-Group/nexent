  bug_id: TRIAGE-GATEWAY-THINKING-CONFIG-20261022
  title: Configure the verified gateway reasoning toggle transport
  description: Record a deployed gateway configuration gap found while clearing the FAF prerequisites. No product-code defect or deployed repair is claimed.
  observed_behavior: Explicit deep_thinking=false sends enable_thinking=false for the deployed compatible-gateway DeepSeek and GLM models, which still return genuine reasoning. The same gateway disables reasoning with thinking.type=disabled.
  expected_behavior: Explicit off reaches the verified gateway in its required wire format through an exact endpoint/model profile; unrelated models and global defaults remain unchanged.
  escaped_stage: D3
  coverage_gap:
    type: missing_boundary
    description: Existing controlled-provider model-control tests and SDK profile tests cover declared translations, but do not verify this deployed gateway's required transport and installed profile. FAF correctly preserved genuine reasoning and exposed the invalid pure-answer prerequisite.
  feature_contract_changed: false
  affected_features:
    existing: [CHAT-MODEL-CONTROLS, FAF-001]
    added: []
    modified: []
    retired: []
  affected_cases:
    existing: [CHAT-MODEL-CONTROLS-D3-001, FAF-D3-001, FAF-D4-001]
    added: []
