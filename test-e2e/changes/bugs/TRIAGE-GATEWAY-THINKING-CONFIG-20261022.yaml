    retired: []
  notes: Record only. The current resolver and SDK already support exact operator-verified toggle_wire_format profiles, but model_reasoning_wire_profiles.json is absent in both deployed config and runtime containers. Native existing-model runs, a transparent scoped relay with unchanged capability resolution, direct gateway comparisons and isolated candidate-profile translation establish the configuration cause. The candidate is retained outside Git and has not been mounted or applied; services were not restarted. The established SPEC is ../nexent-doc/nexent/agent-workbench/specs/model-controls/spec.md R-003; no behavior change is proposed. Existing UT inspected include test_explicit_toggle_wire_overrides_models_dev_without_changing_effort and backend catalog profile tests; their controlled proof does not certify deployed configuration. Future operational repair must rerun the actual gateway off/on comparison and downstream FAF regression with the repaired models. See docs/handoffs/2026-10-22-pyh-faf-thinking-followup.md for evidence, boundaries and verification requirements.
