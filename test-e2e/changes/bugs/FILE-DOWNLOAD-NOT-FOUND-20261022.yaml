schema_version: '1.0'
change:
  change_id: FILE-DOWNLOAD-NOT-FOUND-20261022
  change_type: bugfix
  bug_id: FILE-DOWNLOAD-NOT-FOUND-20261022
  title: Return 404 for a confirmed missing downloaded storage object
  description: Use authoritative storage metadata after a failed read to distinguish absence from operational errors and map the domain absence to HTTP 404.
  observed_behavior: Downloading a deleted report returns HTTP 500 even though MinIO reports NoSuchKey, failing the existing TFP cleanup assertions.
  expected_behavior: A confirmed missing object returns 404; existing reports retain their bytes and headers, unauthorized callers remain denied and storage failures remain errors.
  escaped_stage: D3
  coverage_gap:
    type: no_gap
    description: Existing TFP-D3-001 and TFP-D4-001 cleanup assertions reproduce the defect. Add focused traditional UT for missing versus operational failure without duplicating formal cases.
  feature_contract_changed: false
  affected_features:
    existing: [TFP-001]
    added: []
    modified: []
    retired: []
  affected_cases:
    existing: [TFP-D3-001, TFP-D4-001]
    added: []
    modified: []
    retired: []
  traditional_ut:
    decision: strengthen
    behaviors:
    - Failed reads become domain not-found only when strict metadata confirms absence
    - Existing empty objects and storage permission failures are not classified as absent
    - Stream and base64 absence map to HTTP 404 while success and authorization remain unchanged
    test_selectors:
    - test/backend/services/test_file_management_service.py
    - test/backend/app/test_file_management_app.py
    - test/backend/database/test_attachment_db.py
    - test/sdk/storage/test_minio.py
    - test/backend/app/test_conversation_share_app.py
    - test/backend/app/test_northbound_knowledge_app.py
    reason: Reuse the existing service and HTTP success/error tests and strict storage metadata implementation; add focused regression branches, retaining full deployed D3/D4 proof.
  notes: >-
    Baseline: nexent-doc/docs/Developing/runtime-sandbox-tool-fastpath/design.md;
    TFP-RULE-004/005 and AC-CLEANUP cover compatible artifact cleanup.
    The failure-only metadata probe avoids changing SDK tuple contracts or adding
    overhead to successful downloads. File access checks still run before storage.
    Change evidence: nexent-doc/nexent/file-download-not-found-20261022/design.md.
    The shared MinIO instance lacked .minio.sys/tmp/.trash. Restoring that empty
    directory made S3 deletion remove all nine journal-owned reports. The cause
    of the directory's disappearance is not established; no Windows filesystem
    defect is claimed. Application assertions were not relaxed.
