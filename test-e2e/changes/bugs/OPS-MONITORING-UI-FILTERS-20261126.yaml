  bug_id: OPS-MONITORING-UI-FILTERS-20261126
  title: Fix monitoring filters, list order and stale pagination
  description: Validate custom dates, restore name ordering after metric sorting, and use only the current list response for pagination.
  observed_behavior: The calendar accepts future dates, metric sorting cannot be cleared, and a pending list request can show an earlier result count.
  expected_behavior: The calendar ends at UTC today, each list defaults to name order, and a metric sort can be cleared while retaining the active scope and search.
  escaped_stage: unknown
  coverage_gap:
    type: missing_boundary
    description: Existing tests exercise regular dates and both metric sort directions but omit future dates, cancelling sort, and pending pagination.
