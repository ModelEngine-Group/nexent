    test_selectors:
    - frontend/tests/component/monitoringFilters.test.tsx
    - frontend/tests/component/skillMonitoring.test.tsx
    - test/backend/ops/test_monitoring_api.py
    behaviors:
    - Accept UTC today and reject future custom date endpoints across a local date boundary.
    - Send explicit name ordering and order filtered rows before slicing pages.
    reason: Unit regressions cover date validation and server order. The existing browser case covers controls and scoped requests.
