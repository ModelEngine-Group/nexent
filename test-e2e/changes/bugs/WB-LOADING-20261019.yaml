schema_version: '1.0'
change:
  change_id: WB-LOADING-20261019
  change_type: bugfix
  bug_id: WB-LOADING-20261019
  title: Wait for Workbench initialization before showing the composer
  description: Use a unified loading boundary while conversation, models, capabilities or resource restoration are pending.
  observed_behavior: The composer briefly displays unavailable-model or unavailable-service warnings before initialization completes.
  expected_behavior: Pending initialization shows loading; completed empty or failed loads leave loading and expose persistent feedback.
  escaped_stage: D4
  coverage_gap:
    type: missing_assertion
    description: Existing Composer tests and resource journeys do not assert delayed Workbench initialization visibility.
  feature_contract_changed: true
  affected_features:
    existing: []
    added: []
    modified: [WB-CONTROLS]
    retired: []
  affected_cases:
    existing: [WB-CONTROLS-D4-001]
    added: []
    modified: []
    retired: []
  traditional_ut:
    decision: add
    behaviors:
    - Hide the composer until all initialization dependencies settle, regardless of completion order
    - Bootstrap success and failure both end loading; resolved empty and failed states remain visible
    - Resource restoration reenters loading without exposing intermediate warnings
    test_selectors:
    - frontend/tests/workbench/WorkbenchLoadingBoundary.test.tsx
    - frontend/tests/workbench/WorkbenchBootstrapLoading.test.tsx
    - frontend/tests/workbench/Composer.test.tsx
    reason: Frontend boundary and provider UT prove pending and settled state transitions. No Python changes. Existing D4 remains adjacent regression; no duplicate formal D1 for boolean and promise transitions.
  notes: Direct update to ../nexent-doc/docs/Developing/chat-unified-composer/design.md, section Workbench initialization loading. Existing D4 drawer journey does not certify delayed-loading acceptance or visual timing.
