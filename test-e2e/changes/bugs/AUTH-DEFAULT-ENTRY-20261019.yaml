schema_version: '1.0'
change:
  change_id: AUTH-DEFAULT-ENTRY-20261019
  change_type: bugfix
  bug_id: AUTH-DEFAULT-ENTRY-20261019
  title: Select an authorized default entry when Home is hidden
  description: Wait for permissions and route SU to accessible management instead of Workbench.
  observed_behavior: Root always opens Workbench and its denial guard returns to root indefinitely.
  expected_behavior: Root selects an accessible enabled page after applied authorization; failures show retry and never navigate; no destination leaves Home visible.
  escaped_stage: production
  coverage_gap:
    type: unknown_baseline
    description: Historical UX-WB-D4-003 is referenced in layout docs but absent from this checkout; adjacent sidebar cases do not cover root entry.
  feature_contract_changed: false
  affected_features:
    existing: []
    added: []
    modified: []
    retired: []
  affected_cases:
    existing: []
    added: []
    modified: []
    retired: []
  traditional_ut:
    decision: add
    behaviors:
    - SU selects an accessible management page rather than denied conversation routes.
    - Loading or failed authorization prevents premature redirects, including cached permissions.
    - Failed requests show localized retry; retry applies shared permissions before authorized navigation.
    - Repeated failure and malformed responses remain recoverable; empty routes are valid.
    - Speed mode recovers identically and guests ignore unrelated authorization errors.
    - Workbench preference, legacy alias, deployment gates and guest entry are preserved.
    - Empty or nonfunctional permissions stop automatic navigation and retain Home.
    reason: Root selection is frontend unit behavior; no Python code changes. New D1 would duplicate controlled-provider unit assertions; historical browser assets are unavailable.
    test_selectors:
    - frontend/tests/component/homepageRedirect.test.tsx
    - frontend/tests/component/authorizationRecovery.test.tsx
  notes: 'Design: ../nexent-doc/docs/Developing/auth-permission-default-entry/design.md. No sidebar, API or permission grants change; NAV-MENU-VISIBILITY cases remain unaffected. Browser journey coverage is unverified.'
