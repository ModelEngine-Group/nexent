schema_version: '1.0'
change:
  change_id: TPC-BUG-001
  change_type: bugfix
  bug_id: TPC-BUG-001
  title: Thinking prefix validation rejects valid skill actions
  description: Relax descriptive thinking prefixes and protect exhaustion against
    unexecuted raw actions.
  observed_behavior: Incomplete or narrated thinking prefixes reject valid actions;
    exhaustion may publish them as final.
  expected_behavior: Valid action executes; invalid marked output never becomes a
    raw final.
  escaped_stage: production
  coverage_gap:
    type: missing_contract
    description: Existing tests enforce paired-only thinking and lack third-generation
      action-shaped raw-final exclusion.
  feature_contract_changed: true
  affected_features:
    existing: []
    added:
    - TPC-001
    modified: []
    retired: []
  affected_cases:
    existing: []
    added:
    - TPC-D3-001
    - TPC-D4-001
    modified: []
    retired: []
  traditional_ut:
    decision: strengthen
    behaviors:
    - Accept incomplete, repeated and narrated reasoning prefixes while preserving
      exact code bodies.
    - Reject malformed protocol-marked output at exhaustion without execution, memory
      commit or raw final.
    - Preserve ordinary final payloads and specialized strict final-envelope boundaries.
    reason: Strengthen isolated output-protocol matrices and add true CoreAgent repair-loop
      unit regressions with substituted execution; deployed integration and browser
      proof remain independently formal.
    test_selectors:
    - test/sdk/core/agents/test_output_protocol.py::test_thinking_prefix_does_not_require_a_complete_single_block
    - test/sdk/core/agents/test_output_protocol.py::test_ordinary_final_envelope_accepts_descriptive_prefix
    - test/sdk/core/agents/test_output_protocol.py::test_ac_021_protocol_markers_inside_python_literals_and_comments_are_preserved
    - test/sdk/core/agents/test_output_protocol.py::test_ac_004_final_envelope_preserves_arbitrary_payload
    - test/sdk/core/agents/test_think_prefix_repair.py::test_rejected_outputs_exhaust_without_effects
    - test/sdk/core/agents/test_think_prefix_repair.py::test_valid_third_action_is_not_replayed
    - test/sdk/core/agents/test_output_protocol.py::test_thinking_tags_in_final_payload_are_literal_data
  notes: User requested regenerating the unmerged PR tests under test-baseline 0408fd933
    rules. Actual UT inputs/assertions reviewed. Replace only this PR-added D1/D5
    drafts; baseline historical Cases are unchanged. Isolated grammar, exact final
    payload, truncation and real three-generation repair-budget decisions are traditional
    UT. D3 adds the deployed provider/classifier/executor/skill/SSE/history boundary
    with controlled first/third-attempt code and legacy actions, malformed/thinking-only/invalid-final/truncated
    exhaustion and cleanup. D4 adds authenticated saved browser journey and reload.
    No separate D1 adds a necessary boundary beyond UT plus actual D3. The former
    D5 manually advanced the counter and did not prove an independent running-loop
    risk; replace it with true _run_stream UT. No five-stage quota, copied UT wrapper,
    or fabricated product change. Existing bug record and Feature owner retained.
    SPEC evidence/regenerated-20261012 holds the proof-gap and AC traceability table.
