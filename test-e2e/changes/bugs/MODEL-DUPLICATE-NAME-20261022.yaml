    added: []
    retired: []
  affected_cases:
    existing: []
    modified: []
    added: []
    retired: []
  notes: Existing SPEC duplicate-name behavior is correct; change only application error classification. Adjacent PW-MODEL-01 does not reproduce duplicate creates and is not selected for its unrelated full Agent journey. Focused dev browser/API reproduction supplements owning UT; no new D1, no image build or remote updates.
