schema_version: '1.0'
change:
  change_id: RUNTIME-STABILITY-20261120
  change_type: bugfix
  bug_id: RUNTIME-STABILITY-20261120
  title: Preserve real execution history, owner boundaries and native public output
  description: Retain accepted actions and committed views, authorized original reads, actual tool spans and stateful
    public replay without executing history.
  observed_behavior: Cross-turn history loses accepted actions or reader ownership, and AgentOS migration bypasses native
    public mapping and correlated tool observation.
  expected_behavior: Restore only backend-bound actions/views and authorized real results; preserve original facts, native
    call identity, existing public output and safe actual tool tracing.
  escaped_stage: D3
  coverage_gap:
    type: missing_assertion
    description: Reuse owner/history, tool observation and public mapping tests; existing D3 Cases prove persistence,
      protocol and replay collaboration.
  feature_contract_changed: true
  affected_features:
    existing: [CHAT-TRAJECTORY, CMSR-005, JIUWEN-CONTEXT, JIUWEN-OUTPUT]
    added: []
    modified: [F-171]
    retired: []
  affected_cases:
    existing: [CHAT-TRAJECTORY-REAL-MODEL-D3-001, CMSR-D3-001, JIUWEN-CONTEXT-D3-001]
    added: []
    modified: [AGENT-HISTORY-D3-001, AOS-MODEL-D3-001, AOS-TRANSPORT-D3-001, CONTEXT-POST-RESPONSE-D3-001, JIUWEN-OUTPUT-D3-001]
    retired: []
  traditional_ut:
    decision: strengthen
    behaviors:
      - Restore closed actions, committed summary/preview and raw uncovered facts/errors through authorized storage and signed transport,
        with bounded owner-scoped originals and provider capacity reporting.
      - Each fresh CoreAgent run aligns Core/reader owners and restores only real results in current authorized history;
        reject foreign, previous live-only and unproven checkpoint/catalog grants.
      - Preserve complete native groups and registered LocalFunction schema-default provenance, including original provider
        IDs, group metadata and raw arguments through storage and tools.
      - Trace actual Jiuwen calls with stable platform/turn/request/local/provider identities and correct parent scope;
        distinguish structured error results from execution exceptions without exposing secrets.
      - Use the existing native public mapper for tool/result pairs, step capacity, localized errors, explicit final/stop/waiting
        and truthful terminal confirmation; retain ordinary CodeAgent/files/creator behavior.
      - Resume cursors from the same authorized retained prefix through ACK once, preserving cursor errors, group acknowledgement
        and transport cleanup without inference/tool replay or new retention/RPC limits.
      - Keep persistence/failure contracts and source authority; stored legacy summary text grants no source authority.
        Completion input estimates never reject a send or trigger compression in either runtime.
      - Measure summary gain by rendered request cost in both formats; preserve recent-action boundaries, immutable native
        actions and valid history summaries.
      - Replay accepted visible code as assistant then user runtime results, without synthetic actions; cross-turn execution
        evidence stays user data and actual final answers stay assistant.
      - AgentOS HTTP fixtures keep retired output-limit inputs as negative tests and the existing authorization allowlist
        on all three Skill tools.
      - Preserve successful tools/answers when maintenance admission is full; retry only unaccepted maintenance within
        existing deadlines off the tool worker, with cancellation, busy errors and preserved provider capacity errors.
      - Read summary-covered CodeAgent/native originals through a backend-bound conversation reader with unchanged
        pagination/budgets; reject foreign/deleted/non-result units and never authorize reads from summary references.
      - Close native context transactions only for parentless results with an exact provider ID; nested same-name
        successes, structured failures and exceptions cannot consume a pending top-level call or start maintenance early.
      - Treat local input estimates as advisory in both runtimes; over-window estimates reach model send boundaries.
        Only valid provider input usage reaching the existing threshold triggers post-response compression; missing
        or unknown usage never substitutes an estimate. No overflow rebuild callback or new recovery flow.
    reason: Reuse targeted UT and existing self-contained Case preparation/cleanup; preserve all prior variants and D1
      contracts without a new test framework.
    test_selectors:
      - test/backend/app/test_agentos_prepared_run.py
