  notes: SPEC10 Scope Reduction defines retained behavior; SPEC09 retains original failure evidence. Recovery/catalog
    extensions and independent Ops fixes remain withdrawn. Raw journal/DB/context history and current mapper contracts
    remain unchanged; real-model/container acceptance is separate. AC-REVIEW-01/02/03/04 in the current technical design
    cover bounded maintenance admission, backend-authorized originals after summaries and exact root native-result
    correlation; AC-REVIEW-04 supersedes both runtimes' estimate-based rejection and compression triggers. Existing D3 preparation is reused.
