      - test/sdk/core/agents/test_context_message_format.py
      - test/sdk/core/agents/test_context_scope_reduction.py
      - test/sdk/core/agents/test_execution_owner_lifecycle.py
      - test/sdk/core/agents/test_jiuwen_adapter_wiring.py
      - test/sdk/core/agents/test_jiuwen_context.py
      - test/sdk/core/agents/test_jiuwen_errors.py
      - test/sdk/core/agents/test_jiuwen_context_admission.py
