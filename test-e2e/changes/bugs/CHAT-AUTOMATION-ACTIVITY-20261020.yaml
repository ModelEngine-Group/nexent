schema_version: '1.0'
change:
  change_id: CHAT-AUTOMATION-ACTIVITY-20261020
  change_type: bugfix
  bug_id: CHAT-AUTOMATION-ACTIVITY-20261020
  title: Separate automation quota and synchronize conversation activity
  description: Two additive columns, trusted message sources, transactional activity and safe visible metadata refresh.
  observed_behavior: Automation stops when user rows reach 100 and persisted answers do not advance conversation
    order.
  expected_behavior: Ordinary CHAT rows retain the configured limit; automation rows are exempt; new activity fronts
    the history without losing local state.
  escaped_stage: D4
  coverage_gap:
    type: missing_boundary
    description: Existing quota UT mocks scalar counts and sidebar tests prove pin refresh only; real mixed-source
      and activity refresh boundaries are missing.
  feature_contract_changed: true
  affected_features:
    existing: []
    added: []
    modified:
    - F-126
    - CHAT-SIDEBAR
    retired: []
  affected_cases:
    existing: []
    added:
    - AUTO-QUOTA-D3-001
    - CHAT-ACTIVITY-D4-001
    - CHAT-ACTIVITY-D5-001
    modified:
    - CHAT-SIDEBAR-D3-001
    - CHAT-SIDEBAR-D4-001
    retired: []
  traditional_ut:
    decision: strengthen
    behaviors:
    - Only CHAT user messages consume the ordinary conversation quota; scheduled and run-now messages remain executable
      at the limit.
    - Committed visible messages advance monotonic activity atomically; placeholders, title/config/pin changes and
      skipped runs do not.
    - Owned lists and buckets use activity and deterministic IDs; an old active history enters the first page without
      duplicates.
    - Visible-page polling/focus/reconnect refreshes metadata without changing active runtime, stream, composer
      or pins.
    - An additive idempotent migration backfills explicit automation messages and real message activity without
      classifying entire conversations.
    reason: Unit policy/source/activity/refresh proofs complement real persistence/browser/migration boundaries.
      No duplicate D1.
    test_selectors:
    - test/backend/database/test_conversation_activity.py
    - test/backend/database/test_conversation_db.py
    - test/backend/database/test_workbench_pin_db.py
    - test/backend/services/test_agent_automation_conversation_adapter.py
    - test/backend/services/test_agent_service.py
    - frontend/tests/workbench/ConversationActivityAdapter.test.ts
    - frontend/tests/workbench/ConversationActivitySync.test.tsx
    - frontend/tests/workbench/ConversationActivityRuntime.test.tsx
  notes: 'Design: ../nexent-doc/nexent/chat-automation-activity-and-quota/design.md. User authorized commit and remote
    push after browser retest. Two columns on existing tables only; preserve pre-existing Cases. Existing pin regression
    scripts are unchanged; their bindings now declare their inspected self-owned fixtures so the repository runner
    can execute them.'
