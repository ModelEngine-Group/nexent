  change_type: bugfix
  bug_id: AIDP-RET-FORM-RECOVERY-20261023
  title: Preserve editable AIDP retrieval drafts and English channel labels
  description: Restore candidate linkage after clearing the total limit, keep an invalid hybrid limit editable, and translate English channel summaries.
  observed_behavior: Clearing top_k propagates NaN to linked candidates and loses equality linkage; clearing a positive hybrid_top_k hides its input; English channelShort keys render untranslated.
  expected_behavior: Temporarily empty totals retain the last valid equality baseline and fixed candidate values; invalid hybrid limits remain editable; English labels resolve normally. Cancel must discard the draft.
  escaped_stage: D4
  coverage_gap:
    type: missing_boundary
    description: The existing retrieval journey covers configuration and cancellation but does not explicitly exercise clearing and repairing numeric drafts or English channel summaries.
  feature_contract_changed: false
  affected_features:
    existing: [AIDP-RETRIEVAL]
    added: []
    modified: []
    retired: []
  affected_cases:
    existing: [AIDP-RET-RUNTIME]
    added: []
    modified: [AIDP-RET-JOURNEY]
    retired: []
  traditional_ut:
    decision: exempt
    behaviors:
    - Candidate equality linkage survives temporary empty top_k without overwriting separately configured candidates.
    - Invalid hybrid_top_k stays visible for correction and still blocks confirmation.
    - English channel labels resolve without raw translation keys.
    test_selectors: []
    reason: The user explicitly excludes frontend UT in this ongoing task. These changes affect only frontend draft interaction and localization; verify real rendered controls in a browser plus TypeScript, lint and locale parity. Backend/SDK UT is separate regression evidence for the suspected runtime reports, not proof of this frontend behavior.
  notes: 'Bug source: local-docs/aidp-graph-retrieval/handoffs/requirement-bugs-fix-handoff-20261023.md, POST-11/F01, POST-08/F02 and POST-22. Existing local SPEC: AIDP-RET-R03/S06 and R04/S07; the user-approved equal-value linkage remains unchanged, with no persisted follow flag. Manual D4 journey strengthened, no duplicate D1 or frontend UT added. NB-05 wire evidence already contains hybrid_top_k=4 with topk=5; runtime propagation is not disproved by distinct parameter values. Workbench root and mounted child policies must be observed separately before changing backend behavior. Shared Syncthing documents remain read-only; local verification evidence is kept outside Git.'
