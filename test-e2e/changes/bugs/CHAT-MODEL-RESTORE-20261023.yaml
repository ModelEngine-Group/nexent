schema_version: '1.0'
change:
  change_id: CHAT-MODEL-RESTORE-20261023
  change_type: bugfix
  bug_id: CHAT-MODEL-RESTORE-20261023
  title: Preserve Agent chat model controls through history loading
  description: Keep page-owned scoped controls and the chat subtree alive during cold history switches.
  observed_behavior: Cold history loading unmounts Chat and clears hook-local model state; returning selects the Agent default instead of the last selected model.
  expected_behavior: Returning within the page restores the last selected model and its reasoning and sampling controls, with independent session scopes and unchanged immutable run snapshots and request serialization.
  escaped_stage: production
  coverage_gap:
    type: missing_boundary
    description: Existing UT switches scopes without remounting; the browser journey does not cross a pending history-load boundary.
  feature_contract_changed: false
  affected_features:
    existing: [CHAT-MODEL-CONTROLS, WB-CONTROLS]
    added: []
    modified: []
    retired: []
  affected_cases:
    existing: []
    added: []
    modified: [WB-CONTROLS-D4-003]
    retired: []
  traditional_ut:
    decision: strengthen
    behaviors:
    - Retain model, reasoning, explicit zero sampling and rejection state when consumers remount under a stable page owner.
    - Isolate user, Agent, thread and model scopes; removed explicit models block sending rather than falling back; fresh owners start clean.
    - Keep earlier snapshots immutable and retain mounted content with inert loading interaction guards.
    reason: Frontend state ownership changes only; existing default, serializer and snapshot tests remain. No Python change and no duplicate formal D1 needed.
    test_selectors:
    - frontend/tests/workbench/ConversationModelControls.test.tsx
    - frontend/tests/workbench/ConversationLoadingBoundary.test.tsx
  notes: >-
    Reuse nexent-doc/nexent/agent-workbench/changes/chat-unified-model-controls/design.md,
    CHAT-MODEL-CONTROLS-RULE-002 and WB-CONTROLS-D4-003. Correct Feature contracts remain unchanged.
    Strengthen D4 with a deferred history response and exact subsequent outgoing request assertions.
    D2/D3/D5 contracts are unchanged. Refresh and cross-device persistence are outside this page-lifetime fix.
