  change_id: COMPOSER-KNOWLEDGE-CAPABILITY-20261020
  change_type: bugfix
  bug_id: COMPOSER-KNOWLEDGE-CAPABILITY-20261020
  title: Restore ordinary-chat knowledge selection capability gate
  description: Gate shared Composer knowledge controls by the active source and current Agent version, preserving Workbench.
  observed_behavior: A scope callback exposes knowledge selection for Agents without a corresponding retrieval tool; runtime ignores that scope with a warning.
  expected_behavior: Ordinary chat exposes the picker only for a ready matching capability; old scopes and late responses do not bypass the gate. Workbench behavior is unchanged.
  escaped_stage: D4
  coverage_gap:
    type: missing_assertion
    description: Composer fixtures expected an action with no capability response; page tests did not assert stale capability isolation.
  feature_contract_changed: true
  affected_features:
    existing: []
    added: []
    modified: [WB-CONTROLS]
    retired: []
  affected_cases:
    existing: [WB-CONTROLS-D4-004]
    added: []
    modified: []
    retired: []
  traditional_ut:
    decision: strengthen
    behaviors:
    - Source-aware action and chip visibility, drawer invalidation, empty defaults and Workbench preservation.
    - Pending, failed, mismatched and late Agent/version capability results cannot leak across selections.
    test_selectors:
    - frontend/tests/workbench/Composer.test.tsx
    - frontend/tests/component/agentChatRefreshRestore.test.tsx
    - frontend/tests/component/agentChatPageDeepLink.test.tsx
    reason: Existing render tests directly prove current-fix UI/state obligations. Backend and SDK remain unchanged; no Python UT changes or duplicate formal D1. Existing D4 proves retained Workbench behavior.
  notes: 'Design and acceptance traceability: ../nexent-doc/docs/Developing/chat-shared-resource-selectors/design.md and task.md, capability gate follow-up. No knowledge scope persistence, permissions or runtime tool mounting changes. Count metadata and NL2Agent recommendation are analysis-only.'
