schema_version: '1.0'
change:
  change_id: MODEL-CONTROLS-UI-20261022
  change_type: bugfix
  bug_id: MODEL-CONTROLS-UI-20261022
  title: Explain model reasoning availability and preserve narrow composer controls
  description: Correct shared presentation eligibility, explain unknown/unsupported capability and avoid empty or collapsed controls.
  observed_behavior: Missing metadata silently disables thinking; unknown/unsupported toggle metadata enables the switch; toggle-only models show empty effort rows; narrow composers collapse model labels. The initial explanation fix repeats permanent text and auto-opens the tooltip on menu focus.
  expected_behavior: Shared UI eligibility respects capability status and usable controls, shows the same localized unsupported-mode message for all unavailable states only on hover or explicit activation without visible permanent text or focus-triggered tooltips, omits empty rows and preserves visible narrow model actions without changing session or wire state.
  escaped_stage: production
  coverage_gap:
    type: missing_boundary
    description: Existing unit and browser coverage omits toggle-only/status-toggle combinations, unavailable feedback and narrow toolbar geometry.
  feature_contract_changed: true
  affected_features:
    existing: []
    added: []
    modified: [CHAT-MODEL-CONTROLS, WB-CONTROLS]
    retired: []
  affected_cases:
    existing: []
    added: []
    modified: [WB-CONTROLS-D4-003]
    retired: []
  traditional_ut:
    decision: strengthen
    behaviors:
    - Distinguish absent/unknown/unsupported capability and supported legacy explicit controls without changing model context.
    - Prevent unavailable callbacks, expose the same localized accessible unsupported-mode message for all unavailable states only on hover or explicit activation, reset feedback on model changes, never show it on focus alone, and omit empty effort rows for toggle-only models.
    - Preserve supported effort/budget selection, defaults, sampling values and turn snapshots through existing tests.
    reason: Frontend presentation-only correction; strengthen existing unit tests and the browser journey. No Python behavior or API/provider contract changes and no duplicate D1 required.
    test_selectors:
    - frontend/tests/workbench/ModelSelectorThinking.test.tsx
    - frontend/tests/workbench/ModelReasoningAvailability.test.ts
    - frontend/tests/workbench/Composer.test.tsx
    - frontend/tests/workbench/ConversationModelControls.test.tsx
    - frontend/tests/workbench/AgentModels.test.ts
    - frontend/tests/workbench/AgentDebugModelControls.test.ts
  notes: >-
    Reuse ../nexent-doc/nexent/agent-workbench/changes/chat-unified-model-controls/design.md,
    MODEL-CONTROLS-UI-20261022 appendix and the R-001 baseline. Existing ModelSelectorThinking,
    ConversationModelControls, AgentModels and WB-CONTROLS-D4-003 assertions inspected.
    Strengthen D4 for actual tooltip interaction and narrow geometry; existing request assertions remain.
    D2/D3/D5 are unaffected because serializers, snapshots, runtime and provider resolution remain unchanged.
