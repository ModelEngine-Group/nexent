  title: Workbench resource lists fill drawers with fixed pagination
  description: Separate fixed resource filters and pagination from flexible scrolling lists.
  observed_behavior: Modal-era minimum list heights leave unused drawer space and pagination moves with list content in all three Workbench resource drawers.
  expected_behavior: Resource lists fill available drawer height and independently scroll while filters, pagination and confirmation remain fixed across sources and filtering.
  escaped_stage: D4
  coverage_gap:
    type: missing_assertion
    description: Existing browser journey proves selection and filtering but did not assert list fill or fixed pagination across viewport and result changes.
