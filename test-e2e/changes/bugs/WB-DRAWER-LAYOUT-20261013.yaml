    test_selectors: [frontend/tests/workbench/AgentPicker.test.tsx, frontend/tests/workbench/SkillPicker.test.tsx, frontend/tests/workbench/KnowledgePicker.test.tsx, frontend/tests/workbench/SharedResourceComponents.test.tsx]
    behaviors:
      - Draft cancellation, confirmation, source filtering, import and skill configuration remain unchanged.
      - Ordinary knowledge modal and shared resource card interaction retain their contracts.
    reason: Existing controller tests exercise actual selection and persistence boundaries; rendered geometry requires the browser rather than implementation-mirroring class tests.
  notes: Existing chat-workbench-resource-controls design owns this follow-up. Workbench layout slots are opt-in; unrelated resource drawers retain defaults. No new Case or business contract.
