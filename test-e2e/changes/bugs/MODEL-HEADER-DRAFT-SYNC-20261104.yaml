  title: Synchronize externally replaced HTTP Header editor values
  description: Synchronize changed external values while retaining incomplete local header drafts on equivalent parent updates.
  observed_behavior: The Header editor initializes local rows once and continues to display and submit old headers after its value prop changes.
  expected_behavior: Changed external values replace the displayed rows and validity; equivalent maps and controlled echoes preserve local drafts.
  escaped_stage: D4
