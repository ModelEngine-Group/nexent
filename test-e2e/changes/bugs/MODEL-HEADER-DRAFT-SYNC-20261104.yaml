  notes: User approved the PR4122 review correction. Design and AC-H1 to AC-H3 are in nexent-doc/docs/Developing/model-access-native-agent/PR4121-REVIEW-FIXES-20261103.md. The final onboarding edit caller remounts the form on outlet/revision changes and is not changed. This fix completes the shared component's controlled-value behavior; no API, secret storage or provider interaction changes.
