    behaviors:
    - External replacements and clears update rows and validity without submitting stale headers.
    - Equivalent maps and controlled echoes preserve incomplete drafts and stored null values.
    reason: Real React rerenders and input events directly prove the component state boundary; header persistence and authentication rules are unchanged. No duplicate formal D1 is needed.
