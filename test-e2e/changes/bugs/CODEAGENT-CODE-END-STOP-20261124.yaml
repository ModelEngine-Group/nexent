    existing: [F-171]
    added: []
    modified: []
    retired: []
  affected_cases:
    existing: []
    added: []
    modified: [CONTEXT-POST-RESPONSE-D3-001]
    retired: []
  traditional_ut:
    decision: strengthen
    reason: Exercise the actual CodeAgent dispatch and protocol rejection paths in the existing UT modules.
    behaviors:
      - Reject incomplete strict code actions without dispatch and preserve the existing legacy and provider-capability branches.
    test_selectors:
