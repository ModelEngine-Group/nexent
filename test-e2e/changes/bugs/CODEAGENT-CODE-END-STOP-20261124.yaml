change:
  change_id: CODEAGENT-CODE-END-STOP-20261124
  change_type: bugfix
  bug_id: CODEAGENT-CODE-END-STOP-20261124
  title: Keep the CodeAgent closing tag out of model stop sequences
  description: Allow the model to finish code actions when the literal closing tag occurs within generated content.
  observed_behavior: The stop delimiter can cut off reasoning or code and an incomplete action can be closed by the runtime.
  expected_behavior: Keep RESULT as the strict CodeAgent stop sequence and validate complete model output without repairing the closing tag.
  escaped_stage: D3
  coverage_gap:
    type: missing_assertion
    description: The existing HTTP case did not check the stop field or execute a complete action containing a closing-tag literal.
  feature_contract_changed: false
