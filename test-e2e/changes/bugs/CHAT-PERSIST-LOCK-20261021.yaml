schema_version: '1.0'
change:
  change_id: CHAT-PERSIST-LOCK-20261021
  change_type: bugfix
  bug_id: CHAT-PERSIST-LOCK-20261021
  title: Serialize assistant finalization and conversation deletion in one lock order
  description: Lock the owned live conversation before the assistant message and order batch conversation locks by ID.
  observed_behavior: Message-first finalization and conversation-first deletion deadlock; real PostgreSQL returns 40P01 and may roll back deletion.
  expected_behavior: Concurrent finalization and deletion settle without deadlock; deletion-first finalization is rejected without writes.
  escaped_stage: D5
  coverage_gap:
    type: missing_boundary
    description: Existing mocked transaction UT and activity persistence integration do not exercise concurrent finalization/deletion or reversed overlapping batches.
  feature_contract_changed: true
  affected_features:
    existing: []
    added: []
    modified: [CHAT-SIDEBAR]
    retired: []
  affected_cases:
    existing: [AUTO-QUOTA-D3-001]
    added: [CHAT-PERSIST-D5-001]
    modified: []
    retired: []
  traditional_ut:
    decision: strengthen
    behaviors:
    - Finalization acquires an owned live conversation lock before reading or mutating assistant messages.
    - Missing, deleted or inaccessible conversations reject finalization before any message or activity write.
    - Batch ownership resolution acquires live conversation locks in ascending ID order before cascade updates.
    - Existing success, terminal-state rejection, atomic activity, quota and delete contracts remain intact.
    reason: Isolated SQL/state UT plus a real PostgreSQL D5 contention boundary; existing D3 is regression-only. No frontend, API, schema or new D1 changes.
    test_selectors:
    - test/backend/database/test_conversation_lock_order.py
    - test/backend/database/test_conversation_db.py
    - test/backend/database/test_conversation_activity.py
    - test/backend/services/test_conversation_management_service.py
    - test/backend/app/test_conversation_management_app.py
  notes: 'Baseline 48c386728. Existing design: ../nexent-doc/nexent/chat-automation-activity-and-quota/design.md,
    persistence/deletion concurrency follow-up. Real single and batch 40P01 were reproduced in disposable schemas.
    Add one reliability D5 for both lock winners and overlapping reversed batches; preserve all existing Cases.
    User authorized fix, verification and commit. No deployment or schema migration is required.
    Verification: three new UT fail on the baseline and pass after the fix; 320 relevant UT pass.
    Eight real PostgreSQL contention variants and the unchanged quota/activity D3 regression pass.
    New executable lines and branches are covered locally; diagnostic schemas are cleaned.'
