schema_version: '1.0'
change:
  change_id: SAI-BUG-004
  change_type: bugfix
  bug_id: SAI-BUG-004
  title: Current develop branch still reuses internal worker agent instances
  description: Port invocation isolation and ownership fixes from 94276c343 and 3aadbdfe5
    while preserving current TLS, workspace and prompt contracts.
  observed_behavior: Internal workers are constructed once and shared across overlapping
    calls; failed lease cleanup can kill the shared container.
  expected_behavior: Each call owns its agent, model, state and kernel; shared skills
    survive child cleanup and parent stops propagate.
  escaped_stage: production
  coverage_gap:
    type: binding_omission
    description: Existing SAI contracts/scripts lived in the prior test/ layout and
      were not registered in the new case-local test-e2e suite.
  feature_contract_changed: false
  affected_features:
    existing:
    - SAI-001
    added: []
    modified: []
    retired: []
  affected_cases:
    existing: []
    added: []
    modified:
    - SAI-D1-007
    - SAI-D1-001
    - SAI-D1-002
    - SAI-D1-003
    - SAI-D1-004
    - SAI-D1-005
    - SAI-D1-006
    - SAI-D3-001
    - SAI-D5-001
    retired: []
  notes: 'Preserve SAI IDs and legacy source assets. Reconcile SAI-001 into case-local
    layout after develop aad4a458c. Existing SPEC: docs/Developing/runtime-sandbox-subagent-invocation-isolation/design.md.
    No API or browser contract changes; D2/D4 remain excluded. Docker scopes use isolated
    test resources.'
  traditional_ut:
    decision: add
    behaviors:
    - Configuration clones isolate data while preserving injected clients
    - Wrapper invocation factory enters and exits for call and forward including failure
    - Parent-linked cancellation remains local and resource closes are idempotent
    - Failed kernel cleanup preserves shared container
    - Root cleanup drains children and retains shared skills until completion
    reason: Existing UT covers old dispatch and general sandbox behavior but does
      not protect the new factory/configuration/ownership branches.
    test_selectors:
    - test/sdk/core/agents/test_agent_invocation_config.py
    - test/sdk/core/agents/test_subagent_invocation_wrapper.py
    - test/sdk/core/agents/test_sandbox_lease_cleanup.py
    - test/sdk/core/agents/test_subagent_resource_ownership.py
    - test/sdk/core/concurrency/test_cancellation_scope.py
