    behaviors:
    - Preserve CAS and local identity presentation, including missing-provider fallbacks and viewer changes.
    - Preserve account-menu profile entry and current-user display.
    reason: Reuse adjacent frontend regressions for this localized configuration gate. These suites do not assert the new profile visibility rule; no dedicated automated regression is claimed. Python behavior is unchanged.
    test_selectors:
    - frontend/tests/component/accountMenu.test.tsx
    - frontend/tests/component/userIdentity.test.tsx
  notes: 'Design and verification limits: nexent-doc/docs/Developing/auth-cas-user-display/design.md, profile linked-account visibility follow-up. Existing D2 metadata/search assertions are unaffected; no formal Case changes. Actual CAS/OAuth authentication journeys retain their skipped_by_policy status. Profile refresh and account-switch browser acceptance are not claimed from adjacent component tests.'
