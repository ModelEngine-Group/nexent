schema_version: '1.0'
change:
  change_id: WB-SINGLE-PIN-DELETE-20261020
  change_type: bugfix
  bug_id: WB-SINGLE-PIN-DELETE-20261020
  title: Clear cached Workbench pins after single-history deletion
  description: Run scoped pin-cache reconciliation after successful adapter deletion and before the sidebar reloads.
  observed_behavior: Single-history deletion skips cache pruning, so ensureQueryData can rehydrate the deleted pin.
  expected_behavior: Successful single deletion removes the cached pin before reload; a failed deletion preserves confirmed pins and unrelated histories.
  escaped_stage: D4
  coverage_gap:
    type: missing_assertion
    description: Existing cache tests call pruning directly and batch browser coverage does not exercise adapter single deletion.
  feature_contract_changed: false
  affected_features:
    existing: [CHAT-SIDEBAR]
    added: []
    modified: []
    retired: []
  affected_cases:
    existing: [WB-PIN-DELETE-D4-001]
    added: []
    modified: []
    retired: []
  traditional_ut:
    decision: strengthen
    behaviors:
    - Single adapter deletion clears cached metadata before the subsequent list call
    - Failed deletion never invokes cache cleanup
    - Existing batch pruning preserves failed and unrelated pins
    test_selectors:
    - frontend/tests/workbench/WorkbenchPinDeletion.test.ts
    - frontend/tests/workbench/WorkbenchThreadAdapter.test.ts
    reason: Extend real adapter and QueryClient collaboration at the controlled persistence boundary without duplicating formal D1. No Python behavior changes.
  notes: >-
    PR 4138 review also identified React 18 readonly-ref overload selection; explicitly nullable anchorRef preserves compatibility with React 18 and 19.
    Existing batch D4 is adjacent regression, not single-delete browser acceptance. The referenced sibling SPEC repository and formal browser runtime remain unavailable.
