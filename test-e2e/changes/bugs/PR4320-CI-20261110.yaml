    - JIUWEN-OUTPUT-D4-001
    - JIUWEN-OUTPUT-D5-001
    - JIUWEN-RELEASE-D3-001
    - JIUWEN-RESOURCES-D5-001
    added: []
    retired: []
  traditional_ut:
    decision: strengthen
    behaviors:
    - Canonical allowlisted codes cannot invoke exception-controlled string representations
      during logging.
    - Explicit null and non-negative integer totals preserve monitoring compatibility;
      invalid values fail before metrics or tracker mutations.
    - Authorized Skills alone enable Skill tool guidance; initial outlet snapshots retain
      the runtime outlet-only token-length policy across later sampling edits.
    - Deployment Core defaults and rejection remain strict; package, prompt and model
      snapshot contracts use canonical owners in per-file isolated execution.
    reason: Strengthen local security and boundary assertions without duplicating
      UT as new formal Cases; reuse HTTP and resource integration regressions.
    test_selectors:
    - test/sdk/core/model_service/test_protocol_diagnostics.py
    - test/sdk/monitor/test_monitoring_token_totals.py
    - test/backend/agents/test_global_agent_core.py
    - test/backend/services/test_model_runtime_provisioning_service.py
    - test/backend/utils/test_agent_prompt_bundle.py
  notes: SPEC runtime-agent-core-factory PR4320 CI section. Header-only formal script
    changes retain all acceptance contracts/bindings and need static validation, not
    artificial journey reruns. Existing D3 owns HTTP/process cleanup with self-contained
    preparation; no new D1 or deployment switch. No workflow, suppression, branch
    protection or assertion removal. Published consolidated SQL is unchanged; operator
    approved removal of three obsolete reintroduced copies.
