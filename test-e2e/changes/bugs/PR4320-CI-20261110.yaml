schema_version: '1.0'
change:
  change_id: PR4320-CI-20261110
  change_type: bugfix
  bug_id: PR4320-CI-20261110
  title: Repair Jiuwen PR diagnostics and isolated regression compatibility
  description: Use canonical diagnostic strings, validate explicit usage totals, retain
    strict deployment parsing and align isolated tests with approved SDK ownership.
  observed_behavior: CI reports clear-text logging flows, invalid explicit totals
    are accepted, and isolated suites still depend on removed paths or obsolete prompt
    ownership.
  expected_behavior: Only canonical protocol codes reach logging; invalid reported
    totals are rejected before side effects; approved runtime and security contracts
    remain tested under canonical paths.
  escaped_stage: D1
  coverage_gap:
    type: missing_boundary
    description: Ordinary string diagnostics do not exercise hostile string representations;
      combined local collection masked import-time SDK package stubs.
  feature_contract_changed: false
  affected_features:
    existing:
    - SDK-MODEL-TRANSPORT
    - JIUWEN-RESOURCES
    - AGENT-CORE-CONFIG
    - JIUWEN-CONTEXT
    - JIUWEN-MODEL-BRIDGE
    - JIUWEN-OUTPUT
    - JIUWEN-RELEASE
    modified: []
    added: []
    retired: []
  affected_cases:
    existing:
    - MODEL-SERVICE-TRANSPORT-D3-001
    - JIUWEN-RESOURCES-D3-001
    modified:
    - JIUWEN-CONTEXT-D3-001
    - JIUWEN-CONTEXT-D4-001
    - JIUWEN-CONTEXT-D5-001
    - JIUWEN-IMAGE-D3-001
