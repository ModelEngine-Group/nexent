schema_version: '1.0'
change:
  change_id: COMPOSER-DEFAULTS-20261018
  change_type: bugfix
  bug_id: COMPOSER-DEFAULTS-20261018
  title: Unify shared Composer defaults across Workbench, newchat and NL2Agent
  description: Make Workbench presentation the shared default and separate supported controls from page styling.
  observed_behavior: Page presentation flags select different shells, inputs, model labels and send buttons; embedded layout implicitly hides controls.
  expected_behavior: All three entries share the white composer and transparent paper-plane send button; each exposes only its supported controls.
  escaped_stage: D4
  coverage_gap:
    type: missing_assertion
    description: Composer UT covers Workbench send states and conversation resource drafts separately but not shared default styling or model-only resource loading.
  feature_contract_changed: true
  affected_features:
    existing: []
    added: []
    modified: [WB-CONTROLS]
    retired: []
  affected_cases:
    existing: [WB-CONTROLS-D4-001, WB-CONTROLS-D4-002]
    added: []
    modified: []
    retired: []
  traditional_ut:
    decision: strengthen
    behaviors:
    - Shared default presentation without page-specific style opt-ins
    - Independent optional component composition and resource-loading boundaries
    - Empty and disabled send, cancellation, model forwarding and knowledge draft preservation
    - Optically balanced taller composer, muted equal-size creation/toolbar labels, and direct resource drawer controls
    test_selectors:
    - frontend/tests/workbench/Composer.test.tsx
    - frontend/tests/workbench/Nl2AgentPanelControls.test.tsx
    - frontend/tests/workbench/CreationActions.test.tsx
    - frontend/tests/workbench/KnowledgePicker.test.tsx
    - frontend/tests/workbench/SkillPicker.test.tsx
    reason: Extend existing component coverage; preserve neighboring D4 cases without creating duplicate D1 assertions. No backend changes. No aggregate capability preset; NL2Agent omits optional components and callbacks.
  notes: Design at ../nexent-doc/docs/Developing/chat-unified-composer/design.md. Existing historical SPEC reference is unavailable; no new browser journey is claimed by component results.
