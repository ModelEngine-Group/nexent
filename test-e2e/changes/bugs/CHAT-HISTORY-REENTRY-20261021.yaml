  change_type: bugfix
  bug_id: CHAT-HISTORY-REENTRY-20261021
  title: Restore repeated Agent history entry and stable expand icon height
  description: Explicitly restore the selected Agent on every history activation and retain the floating expand icon vertical center when docking.
  observed_behavior: Reopening the same cached conversation can leave discovery visible; docking changes the icon vertical center and ignores the page top offset.
  expected_behavior: Repeated history activation restores the Agent chat without starting a conversation; docking changes horizontal position only.
  escaped_stage: D4
  coverage_gap:
    type: unknown_baseline
    description: Existing sidebar UT checks layout and callbacks but omits repeated history selection and docking vertical coordinates.
  feature_contract_changed: true
  traditional_ut:
    decision: strengthen
    reason: Frontend-only regression; Python UT and API stages are irrelevant. Extend trigger and floating sidebar component checks.
    behaviors:
    - Reopen the same history after returning to discovery repeatedly.
    - Resolve metadata and fallback bindings, preserve invalid metadata and cancelled activation behavior.
    - Keep the original expand button position and size when width decreases, with a reserved gutter.
    - Keep floating expand controls below the primary navigation hover layer.
    - Preserve Workbench collapse through conversation, model, bootstrap and resource loading boundaries.
    test_selectors:
    - frontend/tests/component/historyThreadTrigger.test.tsx
    - frontend/tests/component/threadSidebarFloating.test.tsx
    - frontend/tests/component/workbenchConversationLayout.test.tsx
    - frontend/tests/component/sharedShellLayout.test.tsx
