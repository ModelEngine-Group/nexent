  notes: Strengthen manual D4-002 with the requested compact gutter and navigation stacking. Focused local browser checks cover repeated entry; full manual mobile journey remains pending. Design notes are in nexent-doc/docs/Developing/nav-conversation-sidebar-collapse/design.md.
