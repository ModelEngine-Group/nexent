schema_version: '1.0'
change:
  change_id: WB-TAG-ANCHOR-20261013
  change_type: bugfix
  bug_id: WB-TAG-ANCHOR-20261013
  title: Tag dropdown overlaps the selected value field
  description: Anchor tag definition and value dropdowns inside their moving field wrappers.
  observed_behavior: Selecting the first tag inserts a summary above the trigger while its body-portaled dropdown retains the previous position and overlaps the field.
  expected_behavior: An open dropdown follows its trigger when selected-condition chips change the filter layout, without covering the trigger or changing predicates.
  escaped_stage: D4
  coverage_gap:
    type: missing_assertion
    description: D4-001 selects a multi-value filter but did not check open dropdown geometry after the selected-condition summary appears.
  feature_contract_changed: false
  affected_features:
    existing: [WB-CONTROLS]
    added: []
    modified: []
    retired: []
  affected_cases:
    existing: []
    added: []
    modified: [WB-CONTROLS-D4-001]
    retired: []
  traditional_ut:
    decision: add
    test_selectors: [frontend/tests/workbench/TagFilterControls.test.tsx]
    behaviors:
      - Real Ant Design dropdown stays inside its field anchor during multi-selection and selected-condition removal.
      - Predicate values remain correct when adding or removing conditions.
    reason: Unit DOM ownership and state regression complements D4 real browser layout; jsdom cannot measure overlap.
  notes: Reuse existing chat-workbench-resource-controls design and task documents. The shared tag filter callers are Popover-based; no tag API or storage contract changes. Pre-fix D4 detects 52px overlap.
