schema_version: '1.0'
change:
  change_id: PDF-PREVIEW-CMAP-20261022
  change_type: bugfix
  bug_id: PDF-PREVIEW-CMAP-20261022
  title: Restore Chinese text in PDF previews
  description: Supply same-version local CMaps and standard fonts to the shared PDF viewer, including deployments with a base path.
  observed_behavior: A ReportLab STSong-Light / UniGB-UCS2-H PDF shows only its horizontal rule in the preview while the downloaded PDF displays correctly.
  expected_behavior: The preview renders the original Chinese and Latin text using local PDF.js resources without changing PDF bytes or download behavior.
  escaped_stage: production
  coverage_gap:
    type: missing_assertion
    description: officePreview unit tests cover renderer selection; PW-FILE-01 checks that the preview opens but does not inspect rendered Chinese glyphs or CMap requests.
  feature_contract_changed: false
  affected_features:
    existing: [F-163]
    added: []
    modified: []
    retired: []
  affected_cases:
    existing: []
    added: [PDF-PREVIEW-D1-001]
    modified: []
    retired: []
  traditional_ut:
    decision: add
    behaviors:
      - Resource preparation copies same-version CMaps and fonts, refreshes changed files, and fails on missing dependencies.
      - The viewer forwards stable document options with local resource URLs under the configured base path.
    reason: Frontend-only behavior requires Node and frontend component UT; Python backend and SDK units are unaffected. Real PDF.js browser rendering supplies additional component evidence beyond mocked Document assertions.
    test_selectors:
      - frontend/tests/pdfAssets.test.mjs
      - frontend/tests/component/PdfViewer.test.tsx
  notes: See ../nexent-doc/docs/Developing/management-pdf-preview-rendering/design.md. Preserve PW-FILE-01 unchanged; its upload/model/history journey is outside the changed rendering-resource boundary. The new D1 exercises real configuration, resource preparation, PDF.js worker, HTTP resource loading and canvas rendering with a controlled local PDF and server; no backend or provider protocol is under test.
