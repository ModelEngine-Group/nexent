schema_version: '1.0'
change:
  change_id: OPS-DATA-PROCESS-BOOTSTRAP-20261124
  change_type: bugfix
  bug_id: OPS-DATA-PROCESS-BOOTSTRAP-20261124
  title: Keep DataProcess independent of Ops SQL initialization
  description: Add an independent auto/off Ops SQL startup policy and declare off for DataProcess in its image and Docker/Helm deployment.
  observed_behavior: Shared monitoring defaults cause DataProcess to execute a missing Ops migration helper and exit before its application command.
  expected_behavior: DataProcess executes its command without Ops migration files or database access; monitoring services retain automatic initialization and waiting behavior.
  escaped_stage: D5
  coverage_gap:
    type: missing_boundary
    description: Existing launcher UT and deployment proof cover monitoring-enabled consumers but omit non-Ops images with the shared monitoring flag enabled and no migration files.
  feature_contract_changed: false
  affected_features:
    existing: [OPS-MODEL-MONITORING]
    added: []
    modified: []
    retired: []
  affected_cases:
    existing: []
    added: []
    modified: [OPS-MODEL-MONITORING-D5-001]
    retired: []
  traditional_ut:
    decision: strengthen
    behaviors:
    - DataProcess image, Compose and Helm declare Ops SQL startup off despite inherited monitoring settings.
    - Off launches successfully with no Ops migration helper; auto preserves migrate/wait ordering and fail-closed behavior.
    - Invalid Ops SQL modes fail before any migration or application command runs.
    reason: Reuse launcher and image contracts, adding the missing service-boundary condition instead of a duplicate D1.
    test_selectors:
    - test/backend/deploy/test_ops_monitoring_bootstrap.py
    - test/backend/deploy/test_service_image_sources.py
    - test/backend/deploy/test_backend_launchers.py
  notes: Existing D5 retains real PostgreSQL automatic/concurrent/waiting/failure assertions and adds a non-Ops launch with no helper and no new Ops database. Self-contained owned databases and subprocesses are cleaned in finally; the existing model responsibility domain is retained. No application module-path change, shared monitoring disable, historical SQL edit or workflow change.
