  change_type: bugfix
  bug_id: CONTEXT-CAPACITY-DIAGNOSTICS-20261120
  title: Record safe estimate provenance at the combined-window rejection boundary
  description: Distinguish local and calibrated estimates from real provider usage on both Core rejection paths.
  observed_behavior: The generic warning says after compaction even when no summary ran, and the hard guard
    omits calibration source and numeric evidence needed to attribute pre-dispatch failures.
  expected_behavior: The unchanged rejection emits safe numeric window/estimate/usage-origin diagnostics;
    assembly wording does not claim maintenance. Unknown provider usage remains None.
  escaped_stage: D3
  coverage_gap:
    type: missing_assertion
    description: Existing rejection UT asserts the exception and absence of compaction but not safe diagnostic
      provenance. Five variants cover local/calibrated Smol, real zero usage, model mismatch and local Jiuwen input.
  feature_contract_changed: false
  affected_features:
    existing: [F-171, JIUWEN-CONTEXT]
    modified: []
    added: []
    retired: []
  affected_cases:
    existing: [CONTEXT-POST-RESPONSE-D3-001, JIUWEN-CONTEXT-D3-001]
    modified: []
    added: []
    retired: []
  traditional_ut:
    decision: strengthen
    behaviors:
    - Keep hard rejection and preparation without maintenance unchanged.
    - Log local/calibrated estimate, C and usage provenance without prompt content or credentials.
    - Preserve missing provider usage as unknown rather than zero.
    reason: This is failure-boundary observability, not a new compaction policy or a solution for cross-run
      continuation. Existing functional contracts remain selected but execution is paused.
    test_selectors:
    - test/sdk/core/agents/test_post_response_context.py
    - test/sdk/core/agents/test_jiuwen_context.py
