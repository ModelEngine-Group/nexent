  traditional_ut:
    decision: strengthen
    behaviors:
    - Ordinary chat has no temporary skill action in idle, running and disabled states; knowledge cancellation is unchanged.
    - Workbench still delegates its skill button to the supplied callback and creation modes hide resource controls.
    test_selectors:
    - frontend/tests/workbench/Composer.test.tsx
    reason: Visibility and callback delegation are directly observable in existing render tests. No backend, request or persistence behavior changes; no duplicate formal unit Case.
