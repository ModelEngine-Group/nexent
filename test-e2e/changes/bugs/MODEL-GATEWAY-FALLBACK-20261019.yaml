schema_version: '1.0'
change:
  change_id: MODEL-GATEWAY-FALLBACK-20261019
  change_type: bugfix
  bug_id: MODEL-GATEWAY-FALLBACK-20261019
  title: Resolve custom gateway reasoning controls by native model on URL miss
  description: Add a conservative model-name fallback without inheriting official provider identity or budgets.
  observed_behavior: A valid models.dev snapshot makes unlisted gateway URLs return no reasoning capability even for known Qwen models.
  expected_behavior: Only unmatched nonempty URLs may use an unambiguous declared native-model profile; return generic toggle and effort controls while retaining gateway identity.
  escaped_stage: D1
  coverage_gap:
    type: missing_boundary
    description: Existing catalog and SDK UT cover URL resolution and generic adapters separately but not unmatched gateway capability selection and its request parameters.
  feature_contract_changed: true
  affected_features:
    existing: []
    added: []
    modified: [F-180]
    retired: []
  affected_cases:
    existing: [UT-BE-028]
    added: []
    modified: []
    retired: []
  traditional_ut:
    decision: add
    test_selectors:
      - test/backend/configs/test_model_catalog_gateway_fallback.py
      - test/backend/configs/test_model_catalog_loader.py
      - test/sdk/core/models/test_openai_llm.py
    behaviors:
      - Resolve known native models only after all gateway URL candidates miss, preserving gateway metadata.
      - Preserve provider-specific matches and reject missing, unsupported, malformed and ambiguous model declarations.
      - Translate resolved fallback controls into generic effort and enabled or disabled flags without native-provider budgets or adapters.
    reason: Selection branches need isolated regression coverage; real SDK request construction checks the resolver output without duplicating unit tests as a new formal D1.
  no_case_change_reason: Reuse UT-BE-028 unchanged for catalog schema and normalization regression. No HTTP or browser contract changes; new branch coverage stays in traditional UT.
  notes: Design lives in nexent-doc/docs/Developing/chat-gateway-reasoning-fallback/design.md. Existing F-180 runtime cases remain preserved; UT does not claim gateway runtime compatibility or complete historical formal acceptance.
