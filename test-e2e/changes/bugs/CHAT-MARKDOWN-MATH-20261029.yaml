    retired: []
  traditional_ut:
    decision: add
    behaviors:
    - Render inline, display, bracket and table-cell formulas using the real parser and KaTeX.
    - Preserve code, prices, common Markdown, citation wiring and Mermaid dispatch; tolerate malformed and partial math.
    - Keep running and completed reasoning math consistent.
    test_selectors:
    - frontend/tests/workbench/MarkdownRendering.test.tsx
    - frontend/tests/workbench/SkillFileCard.test.tsx
