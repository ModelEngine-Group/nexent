  bug_id: CHAT-MARKDOWN-MATH-20261029
  title: Restore math rendering in conversation answers and reasoning
  description: Share math plugins and delimiter preprocessing across answer and running/completed reasoning while preserving common Markdown behavior.
  observed_behavior: Newchat only registers GFM and citations; valid LaTeX formulas display literally in answers and reasoning.
  expected_behavior: Dollar and bracket formulas render as KaTeX, malformed formulas fail locally, and code/prices/common Markdown remain intact.
