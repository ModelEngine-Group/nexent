schema_version: '1.0'
change:
  change_id: SYSTEM-CONFIG-AUTH-20261111
  change_type: bugfix
  bug_id: SYSTEM-CONFIG-AUTH-20261111
  title: Restore current account and speed identity authorization
  description: Read operations roles from the current account table and preserve the established SPEED demo identity without granting system-configuration access.
  observed_behavior: DevSpace speed returns a null role and empty navigation routes, while a valid operations JWT fails on the removed user_tenant_t.user_role column.
  expected_behavior: Speed mode resolves SPEED permissions without activating its disabled login identity; ops authorizes only an active account whose actual role has the system-configuration grant.
  escaped_stage: D2
  coverage_gap:
    type: missing_assertion
    description: Existing authorization doubles accept any SQL and user-info tests do not cover the retained but login-disabled SPEED system identity.
  feature_contract_changed: false
  affected_features:
    existing: [SYSTEM-CONFIGURATION, NAV-MENU-VISIBILITY]
    added: []
    modified: []
    retired: []
  affected_cases:
    existing: [NAV-MENU-D1-001]
    added: []
    modified: [SYS-CONFIG-MANAGEMENT-D2-001]
    retired: []
  traditional_ut:
    decision: add
    test_selectors:
    - test/backend/ops/test_system_configurations.py
    - test/backend/services/test_user_management_speed.py
    behaviors:
    - Reject the retired user_tenant_t.user_role query and authorize through the active user_account_t role projection.
    - Resolve SPEED role permissions for the default speed identity even though ordinary login is disabled for that system account.
    - Preserve explicit OPS_ADMIN-only configuration access and deny SPEED and SU without additional grants.
    reason: Unit and API doubles reproduce the current schema and disabled SPEED projection; existing D2 and sidebar cases retain their separate HTTP and component boundaries.
  notes: Existing SPEC at openspec/changes/add-system-configuration-page retains its permission requirements. No new formal Case is needed; the existing D2 script is strengthened and no SPEED or SU grant is introduced.
