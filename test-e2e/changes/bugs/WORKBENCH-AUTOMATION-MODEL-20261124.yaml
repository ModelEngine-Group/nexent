  change_type: bugfix
  bug_id: WORKBENCH-AUTOMATION-MODEL-20261124
  title: Preserve the requested model in Workbench automation proposals
  description: Stage the request's model choice with the automation metadata at prepared turn admission.
  observed_behavior: Workbench staged its resolved execution model even when the request selected a different model or omitted the selection.
  expected_behavior: The proposal inherits the explicit request model. An omitted model remains unset for automation defaults.
  escaped_stage: production
  coverage_gap:
    type: missing_assertion
    description: Workbench admission tests asserted staging and confirmation but did not inspect automation model provenance.
  feature_contract_changed: false
