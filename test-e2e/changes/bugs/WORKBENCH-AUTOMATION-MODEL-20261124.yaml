    modified: []
    retired: []
  traditional_ut:
    decision: strengthen
    behaviors:
    - Verify the public Workbench send stages the requested model even if the execution snapshot resolves a different model.
    - Verify an omitted request model stays unset and the prepared turn still reaches Runtime confirmation.
    reason: The ASGI regression exercises public request dispatch and the actual staging logic with controlled persistence and Runtime boundaries.
    test_selectors:
    - test/backend/services/test_agent_run_workbench_coverage.py
  notes: Existing proposal cases cover downstream task flows. The staging bug requires checking the payload at the Workbench admission boundary.
