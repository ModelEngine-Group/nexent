schema_version: '1.0'
change:
  change_id: USER-MODEL-READ-20261022
  change_type: bugfix
  bug_id: USER-MODEL-READ-20261022
  title: Restore ordinary user model selection in Agent chat and Workbench
  description: Restore the missing USER RESOURCE MODEL READ grant using fixed ID 143 in the user-requested v2.8.0 SQL bundle; preserve existing semantic grants and reject unrelated ID collisions.
  observed_behavior: USER model list requests fail with 403 and both shared model pickers receive an empty list.
  expected_behavior: USER can read tenant models without model write or management menu permissions.
  escaped_stage: production
  coverage_gap:
    type: missing_boundary
    description: Existing RBAC UT uses synthetic grants and model-control API fixtures bypass seeded permissions; neither executes the deployment grant repair.
  feature_contract_changed: false
  affected_features:
    existing: [CHAT-MODEL-CONTROLS]
    added: []
    modified: []
    retired: []
  affected_cases:
    existing: []
    added: [USER-MODEL-READ-D5-001]
    modified: []
    retired: []
  traditional_ut:
    decision: strengthen
    behaviors:
    - USER model read grants pass the real permission dependency while model create, update and delete remain forbidden.
    - Missing grants deny reads and reloading the permission cache picks up a repaired grant.
    reason: Strengthen the existing permission UT for read-only model consumption; actual SQL repair, preservation and repeatability require separate D5 PostgreSQL proof.
    test_selectors:
    - test/backend/permissions/test_rbac.py
    - test/backend/permissions/test_depends.py
  notes: >-
    Baseline ../nexent-doc/nexent/agent-workbench/specs/model-controls/spec.md R-001/R-005.
    Design ../nexent-doc/nexent/agent-workbench/changes/chat-user-model-read/design.md.
    User explicitly requested appending SQL to the existing v2.8.0 bundle, overriding its normal immutability rule for this change only.
    Preserve historical SQL and existing Feature/Case contracts. No new D1 duplicates UT.
    This SQL-only fix leaves frontend error presentation unchanged. Deployment must reload each serving process's RBAC cache.
