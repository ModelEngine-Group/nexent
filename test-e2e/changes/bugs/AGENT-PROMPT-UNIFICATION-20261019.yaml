  notes: 'Design: ../nexent-doc/nexent/nl2agent-resource-recommendation-flow/design.md,
    2026-10-19 storage/runtime section. No live database migration. 2026-10-20 user-authorized
    in-place SQL update drops legacy columns after merging; existing D5 strengthened
    for removal and rollback. User clarification: no legacy-client support; compatibility
    is limited to decoding older exported Agent files. Historical sensitive fields
    remain masked without adding removed fields to current responses.
    PR 4137 develop integration (2026-10-20): preserve the infrastructure and management
    service relocation, evaluation single-prompt policy, and updated test imports.
