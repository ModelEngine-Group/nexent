schema_version: '1.0'
change:
  change_id: AGENT-PROMPT-UNIFICATION-20261019
  change_type: bugfix
  bug_id: AGENT-PROMPT-UNIFICATION-20261019
  title: Use duty_prompt as the sole configured Agent prompt
  description: Migrate legacy prompt sections and align generation, editing and execution.
  observed_behavior: Partial duty edits retain conflicting legacy runtime instructions
    and tools still advertise legacy fields.
  expected_behavior: All legacy sections migrate once; only duty_prompt is edited,
    generated and consumed.
  escaped_stage: D3
  coverage_gap:
    type: missing_boundary
    description: Existing template UT covers full saves but not legacy data migration,
      legacy tool rejection or single-source runtime consumption.
  feature_contract_changed: false
  affected_features:
    existing:
    - F-045
    added: []
    modified: []
    retired: []
  affected_cases:
    existing:
    - AGT-003
    - UT-BE-AUTO-3B69B045EA9A318F
    added: []
    modified:
    - AGT-AUTO-6A6BC7594487E771
    - AGENT-PROMPT-D5-001
    retired: []
  traditional_ut:
    decision: strengthen
    behaviors:
    - Reject legacy draft fields and non-array example questions before saving.
    - Bilingual generation saves only duty_prompt and exposes no legacy prompt fields.
    - Only old exported Agent files consolidate legacy fields at import; current requests
      and exports expose only duty_prompt.
    - Runtime, optimization and evaluation ignore poisoned legacy fields.
    - SDK and all context callers expose only duty_prompt; removed parameters/templates
      are rejected and platform guidance remains intact.
    - Legacy fields are absent from ORM, API and frontend state/cache/persistence;
      unrelated partial edits remain unchanged.
    reason: Unit assertions cover policy and adapters; real SQL migration needs a
      distinct disposable PostgreSQL D5 boundary.
