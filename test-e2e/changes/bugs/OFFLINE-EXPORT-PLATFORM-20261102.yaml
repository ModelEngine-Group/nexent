schema_version: '1.0'
change:
  change_id: OFFLINE-EXPORT-PLATFORM-20261102
  change_type: bugfix
  bug_id: OFFLINE-EXPORT-PLATFORM-20261102
  title: Export offline images for the requested platform on modern Docker
  description: >-
    Match docker save to the platform already selected by docker pull when both
    client and server support API 1.48, retaining the original export command
    for Docker 18.09 and other older or unrecognized API versions.
  observed_behavior: >-
    Actions job 124467441278 successfully pulls all arm64 images on an amd64
    Docker 29.4.2 containerd runner, then docker save fails while reading the
    absent amd64 manifest b6a8a0906cb82407c0144e57fcab51fe1f8f431c2eccbd4c577ece0b0430ac14.
  expected_behavior: >-
    Export only linux/<requested platform> when both Docker APIs support the
    platform option. Preserve legacy export compatibility and propagate export
    errors without retrying an unrestricted export.
  escaped_stage: D5
  coverage_gap:
    type: missing_assertion
    description: >-
      deploy/tests/test_build_offline_package.sh stubs every Docker save as
      successful without checking its platform. Existing infrastructure tests
      exercise the formal scenario dispatcher, not the real export function.
      Add isolated regression assertions for API negotiation and export errors.
  feature_contract_changed: false
  affected_features:
    existing: [F-174]
    added: []
    modified: []
    retired: []
  affected_cases:
    existing: []
    added: []
    modified: []
    retired: []
  no_case_change_reason: >-
    The affected logic is a local command-selection contract. Traditional UT
    supplies the additional proof; the existing deployment shell suite covers
    adjacent packaging behavior. DEP-003 and DEP-05 were removed by user request
    in D5-OFFLINE-CASES-REMOVAL-20261010 and are not recreated. No formal D1-D5
    execution or successful real containerd export is claimed.
  traditional_ut:
    decision: add
    behaviors:
      - Select the requested arm64 or amd64 platform at API 1.48 and newer.
      - Keep the legacy export command when either client or server API is older.
      - Handle malformed API output and failed version probes conservatively.
      - Preserve output paths and propagate export errors without an unrestricted retry.
    reason: >-
      Test the actual Bash functions with a controlled Docker executable. Existing
      tests do not detect the absent platform option. Runtime deployment and
      browser/API boundaries are not changed by command selection.
    test_selectors:
      - test/backend/deploy/test_offline_image_export.py
  notes: >-
    Evidence: https://github.com/ModelEngine-Group/nexent/actions/runs/41175375169/job/124467441278,
    commit 046d77c8c479d30ccd1ed44cd37f727547798d0f. DockerHub's exact logged
    index maps the missing digest to amd64; the companion amd64 package succeeds.
    Scope: pull_with_retry, save_image_to_tar, both save_all_images loops and
    build-offline-package.yml's platform matrix. F-174 already owns offline
    image completeness. No Feature contract, workflow, deployment, registry or
    existing formal Case changes are required. The sibling nexent-doc directory
    and its previously referenced offline-package-platform-safe-export SPEC are
    unavailable in this checkout; external SPEC maintenance remains blocked.
