    - frontend/tests/component/agentImportPrompt.test.tsx
    behaviors:
    - The picker opens the wizard only when it returns parsed data.
    - Cancelling the wizard or file chooser leaves no open import state.
    reason: Unit tests cover import state and parsing. D4 verifies both route entry points and file chooser wiring.
