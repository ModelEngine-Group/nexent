schema_version: '1.0'
change:
  change_id: WB-PIN-SYNC-20261016
  change_type: bugfix
  bug_id: WB-PIN-SYNC-20261016
  title: Hydrate refreshed Workbench pins and store personal pin time on conversations
  description: Repair focus refresh for unloaded histories and migrate legacy pins into a nullable conversation
    timestamp.
  observed_behavior: Focus refresh changes pin IDs but never imports missing metadata; a visible embedded browser
    may also receive user activity without emitting visibilitychange, leaving the query unchanged.
  expected_behavior: Remote pins appear on focus without page reload; pins follow personal conversations
    without conversation-activity or model changes; visible-page re-entry also refreshes pins.
  escaped_stage: D4
  coverage_gap:
    type: missing_boundary
    description: Provider UT asserts refreshed IDs and adapter UT initial hydration separately; D4 reloads
      instead of refocusing after another device pins an unloaded history.
  feature_contract_changed: true
  affected_features:
    existing: []
    added: []
    modified:
    - CHAT-SIDEBAR
    retired: []
  affected_cases:
    existing: []
    added:
    - CHAT-SIDEBAR-D5-001
    modified:
    - CHAT-SIDEBAR-D3-001
    - CHAT-SIDEBAR-D4-001
    retired: []
  traditional_ut:
    decision: strengthen
    behaviors:
    - Timestamp ownership, ordered/idempotent writes and preserved activity
    - Missing-pin metadata triggers one supported list reload with the shared snapshot
    - Visible-page focus and interaction refresh, coalescing and subscription cleanup
    - Pagination deduplication, errors and unchanged Agent-chat behavior
    reason: Existing unit proof lacks the focus refresh plus missing-history combination; migration and
      full runtime browser proof remain separate.
    test_selectors:
    - test/backend/database/test_workbench_pin_db.py
    - test/backend/services/test_workbench_pin_service.py
    - test/backend/apps/test_workbench_pins_app.py
    - frontend/tests/workbench/WorkbenchPinHistorySync.test.tsx
    - frontend/tests/workbench/ServerThreadPins.test.tsx
    - frontend/tests/workbench/WorkbenchThreadAdapter.test.ts
  notes: Existing SPEC chat-workbench-resource-controls/design.md section WB-PIN-SYNC-20261016. Personal
    conversation preference supersedes per-tenant independent state. Preserve all D1; no model wiring
    changes; no commit/push.
