schema_version: '1.0'
change:
  change_id: WB-EDITOR-STALE-DRAFT-20261019
  change_type: bugfix
  bug_id: WB-EDITOR-STALE-DRAFT-20261019
  title: Reload generated Agent drafts on editor entry
  description: Refresh the requested persisted draft even when Workbench preloaded the same Agent ID.
  observed_behavior: Editor skips initialization for a preselected ID and can retain pre-generation fields until browser refresh.
  expected_behavior: Editor entry reads the latest draft after pending saves and renders generated fields without manual refresh.
  escaped_stage: D4
  coverage_gap:
    type: missing_assertion
    description: Existing draft creation UT and editor-generation D4 do not assert entry with a stale preloaded same-ID store. Loader regression is added in traditional UT; full browser entry proof remains a documented gap.
  feature_contract_changed: false
  affected_features:
    existing: [AGENT-EDITOR-WORKFLOWS, V5-PW-NL2AGENT-01]
    added: []
    modified: []
    retired: []
  affected_cases:
    existing: []
    added: []
    modified: []
    retired: []
  traditional_ut:
    decision: add
    behaviors:
    - Reload the same preselected Agent and replace generated fields without writes
    - Wait for pending saves and preserve drafts on save or read failure
    - Ignore stale responses after navigation or unmount and reject invalid IDs
    test_selectors:
    - frontend/tests/component/agentEditorDraft.test.tsx
    - frontend/tests/component/agentConfigLayout.test.tsx
    reason: Frontend loader lifecycle is the changed unit; Python and generation contracts are unchanged. Existing formal generation journey does not detect this entry branch, and no duplicate unit D1 is added.
  notes: Lightweight design at ../nexent-doc/docs/Developing/chat-workbench-editor-refresh/design.md. Existing PW-NL2AGENT-01 is capability inventory only, not claimed as current-fix execution or navigation coverage. Browser proof remains pending.
