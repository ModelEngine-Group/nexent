  title: Reasoning-only output budget exhaustion lacks actionable diagnosis
  description: Correlate rejected output with the model budget and response shape without leaking content by default.
  observed_behavior: A model exhausts 4096 output tokens on reasoning-only content three times; logs classify generic
    protocol failure and the UI blames protocol compliance.
  expected_behavior: Each rejection identifies budget exhaustion versus malformed Action, with bounded output preview
    available only by explicit diagnostic opt-in.
  escaped_stage: production
