schema_version: '1.0'
change:
  change_id: MODEL-DEBUG-THINKING-20261019
  change_type: bugfix
  bug_id: MODEL-DEBUG-THINKING-20261019
  title: Agent debug drops an explicit thinking-off selection
  description: Preserve explicit thinking intent in Agent debug requests while retaining existing model selection, sampling and snapshot behavior.
  observed_behavior: With Qwen thinking enabled by default, Agent debug UI off omits generation_config and reasoning_effort; provider receives enable_thinking true. Ordinary Agent chat and Workbench explicitly forward false correctly.
  expected_behavior: Agent debug preserves explicit disabled intent at the request boundary without changing saved Agent settings, previous turn snapshots or other model parameters.
  escaped_stage: D4
  coverage_gap:
    type: missing_boundary
    description: ConversationModelControls UT proves hook state and immutable controls, while CHAT-MODEL-CONTROLS-D4-001 covers the four creators and D4-002 covers six-entry scope and lifecycle. These assertions do not prove Agent debug off serialization through the actual adapter.
  feature_contract_changed: false
  traditional_ut:
    decision: strengthen
    reason: Add request-boundary regressions through the actual adapter; hook-only assertions cannot detect the agent-debug exclusion. Python behavior is unchanged and existing SDK empty-response tests are reused for analysis only.
    behaviors:
    - Agent debug explicitly serializes false even when the selected model defaults to thinking enabled.
    - Debug auto and concrete effort preserve intent without mutating Agent configuration or previous turn controls.
    - Omitted intent remains omitted; debug sampling exclusion, custom model priority, backend errors and immutable source controls remain unchanged.
    - Ordinary chat, Workbench and creator parameter forwarding remain unchanged.
    test_selectors:
    - frontend/tests/workbench/AgentDebugModelControls.test.ts
    - frontend/tests/workbench/ConversationModelControls.test.tsx
    - frontend/tests/workbench/StreamCancellation.test.ts
    - frontend/tests/workbench/CreationRuntime.test.ts
    - frontend/tests/workbench/ConversationRestore.test.ts
    - frontend/tests/workbench/WorkbenchPageLifecycle.test.tsx
  affected_features:
    existing: [CHAT-MODEL-CONTROLS, WB-CONTROLS]
    added: []
    modified: []
    retired: []
  affected_cases:
    existing: [WB-CONTROLS-D4-003]
    added: []
    modified: []
    retired: []
  notes: Design and acceptance are recorded in nexent-doc/nexent/agent-workbench/changes/chat-unified-model-controls/design.md and task.md. Existing WB-CONTROLS-D4-003 is selected unchanged for ordinary Workbench and Agent chat forwarding regression, not proof of debug behavior. Debug request serialization is covered by adapter UT plus browser-led real smoke; no duplicate D1 or creator Case expansion. Automatic-mode empty output is analyzed separately without changing SDK retry or stream semantics.
