schema_version: '1.0'
change:
  change_id: TOOL-TAG-BATCH-20261018
  change_type: bugfix
  bug_id: TOOL-TAG-BATCH-20261018
  title: Batch visible tool assignment reads in the resource picker
  description: Replace per-row reads with one page request and bounded database queries.
  observed_behavior: Each visible tool mounts a self-fetching tag component and resolves tool visibility separately.
  expected_behavior: Read the visible page in one request using tenant-scoped tool and assignment IN queries.
  escaped_stage: D4
  coverage_gap:
    type: missing_assertion
    description: Existing assignment and picker tests do not assert page-level request counts or batch query scope.
  feature_contract_changed: false
  affected_features:
    existing: [F-177, AGENT-EDITOR-WORKFLOWS]
    added: []
    modified: []
    retired: []
  affected_cases:
    existing: [API-AUTO-3DDBA5C9A0148698, AGENT-EDITOR-D4-004]
    added: []
    modified: []
    retired: []
  traditional_ut:
    decision: add
    behaviors:
      - One page query supplies all row labels without per-tool reads; page changes and revisions use isolated query keys.
      - Tool visibility and tag reads use tenant-scoped IN queries with bounded query counts and preserve empty tag results.
      - Duplicate, invalid, empty and excessive IDs, invisible tools and failures are handled without data disclosure.
    reason: Unit assertions prove request orchestration and SQL construction; existing formal cases are unchanged regressions and do not establish live performance acceptance.
    test_selectors:
      - test/backend/services/test_tool_tag_batch.py
      - frontend/tests/component/toolTagBatch.test.tsx
      - frontend/tests/component/toolDrawer.test.tsx
  notes: 'Design: ../nexent-doc/docs/Developing/chat-resource-drawer-reuse/design.md, Tool assignment batching correction. Runtime regression execution depends on an available local stack and configured test home.'
