schema_version: '1.0'
change:
  change_id: EXECUTION-OWNER-LIFECYCLE-20261121
  change_type: bugfix
  bug_id: EXECUTION-OWNER-LIFECYCLE-20261121
  title: Keep run-scoped execution readers aligned with authorized historical sources
  description: Synchronize fresh CodeAgent owner and historical grants before preparing each run.
  observed_behavior: CodeAgent rotates the reader owner while its ContextManager and authorized historical sources
    retain the constructor owner, so a rendered valid reference is denied.
  expected_behavior: Each fresh run registers only real execution results present in its authorized current history
    and synchronizes Core and reader owners; foreign and previous live-only results remain denied.
  escaped_stage: D3
  coverage_gap:
    type: missing_assertion
    description: Existing output persistence integration checked source preservation but did not execute a new CodeAgent
      reader against that saved source.
  feature_contract_changed: false
  affected_features:
    existing:
    - JIUWEN-OUTPUT
    modified: []
    added: []
    retired: []
  affected_cases:
    existing: []
    modified:
    - JIUWEN-OUTPUT-D3-001
    added: []
    retired: []
  traditional_ut:
    decision: add
    behaviors:
    - Each fresh run registers only real execution results present in its authorized current history and synchronizes
      Core and reader owners; foreign and previous live-only results remain denied.
    - Withdraw checkpoint proof/catalog grants; legacy summary text remains data and does not authorize a reference.
    reason: Existing history permission tests do not exercise owner rotation through the real CoreAgent.run boundary;
      no duplicate formal D1 is needed.
    test_selectors:
    - test/sdk/core/agents/test_execution_owner_lifecycle.py
  notes: >-
    Current approved scope: SPEC10 Scope Reduction 20261123.md; original diagnosis: SPEC09 EO-01..04.
    Reuse JIUWEN-OUTPUT-D3-001 execution preparation/cleanup; no new D1 or real-model acceptance claim.
