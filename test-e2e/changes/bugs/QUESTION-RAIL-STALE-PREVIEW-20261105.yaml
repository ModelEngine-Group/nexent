schema_version: "1.0"
change:
  change_id: QUESTION-RAIL-STALE-PREVIEW-20261105
  change_type: bugfix
  bug_id: QUESTION-RAIL-STALE-PREVIEW-20261105
  title: Switch question rail previews when hovering adjacent ticks
  observed_behavior: Moving the mouse from Q3 to adjacent Q2 can leave the Q3 preview visible.
  expected_behavior: Preview follows the hovered tick and closes when the mouse leaves it.
  escaped_stage: unknown
  feature_contract_changed: false
  description: >-
    A large Q3 tooltip creates a Radix hover grace corridor overlapping the
    adjacent Q2 tick. Moving the mouse to Q2 leaves Q3 displayed because the
    provider's pointer-in-transit state suppresses Q2 activation. Disable
    hoverable content for this display-only rail preview; preserve pointer,
    keyboard, current-position and navigation behavior elsewhere.
  affected_features:
    existing: []
    added: []
    modified: []
    retired: []
  affected_cases:
    existing: []
    added: []
    modified: []
    retired: []
  coverage_gap:
    type: missing_assertion
    description: >-
      Existing rail tests cover keyboard focus and click but not moving between
      adjacent ticks inside a tall preview's hover grace corridor. A new UT
      reproduces the stale Q3 content before the fix. No formal Case binding
      exists for this frontend-only interaction in the owning change record.
  traditional_ut:
    decision: strengthen
    test_selectors:
      - frontend/tests/component/questionDirectory.test.tsx
    behaviors:
      - Moving from Q3 to Q2 replaces Q3 with exactly one Q2 preview.
      - Leaving Q2 dismisses its preview without entering the display-only card.
      - Existing keyboard focus, click, search and active rail scrolling remain valid.
    reason: >-
      Strengthen existing component tests using real Radix Tooltip behavior and
      controlled element geometry; the new test fails before the product fix.
      Python UT is unrelated because no Python behavior changes. No duplicate
      formal D1 Case or new external runtime boundary is introduced.
  notes: >-
    Owner baseline QUESTION-DIRECTORY-RAIL-20261105, retaining the original
    QUESTION-DIRECTORY-JUMP-20261102 behavior. Sibling nexent-doc is unavailable;
    external SPEC synchronization remains blocked. The supplied screenshot and
    the failing adjacent-pointer regression establish this fix's scope. Keep
    current-position marking independent of hover preview; Q3 may remain the
    reading position while the Q2 preview is shown. Raw model/tool text in a
    reply excerpt is a separate concern and is not changed in this fix.
