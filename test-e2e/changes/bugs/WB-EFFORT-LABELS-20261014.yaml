  bug_id: WB-EFFORT-LABELS-20261014
  title: Localize every supported shared model reasoning effort
  description: Complete Chinese and English labels without changing model capability selection, callbacks or registered model context.
  observed_behavior: The shared selector falls back to raw xhigh because only auto, low, medium and high have locale entries.
  expected_behavior: All eight ReasoningEffort values have localized labels; high and xhigh remain distinct and all underlying values remain unchanged. Unknown provider values retain their supplied fallback name.
  escaped_stage: D4
  coverage_gap:
    type: missing_assertion
    description: Existing selector tests cover default low, medium and high but do not exercise localized provider-specific effort values.
  feature_contract_changed: false
  affected_features:
    existing: [WB-CONTROLS]
    added: []
    modified: []
    retired: []
  affected_cases:
    existing: [WB-CONTROLS-D4-002]
    added: []
    modified: []
    retired: []
  traditional_ut:
    decision: strengthen
    test_selectors: [frontend/tests/workbench/ModelSelectorThinking.test.tsx]
    behaviors:
      - Every supported effort has a visible Chinese and English label in the real shared selector.
      - Selecting each localized option forwards its original value and registers unchanged model context.
      - Unknown provider labels retain fallback behavior; disabling thinking still omits reasoning effort.
    reason: Real i18next locale resources and shared component interaction directly detect the missing translation while proving retained parameter semantics.
  no_case_change_reason: Existing D4-002 exercises shared Workbench and Agent-chat model settings and absence of sampling writes. Locale enum coverage belongs in focused UT; reuse the browser journey for unchanged integration.
  notes: Existing chat-workbench-resource-controls design owns this fix. Only locale entries change in product code. No capability mapping, request adapter, model setting or backend changes.
