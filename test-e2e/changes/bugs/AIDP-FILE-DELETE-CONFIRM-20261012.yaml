schema_version: '1.0'
change:
  change_id: AIDP-FILE-DELETE-CONFIRM-20261012
  change_type: bugfix
  bug_id: BUG-AIDP-FILE-DELETE-CONFIRM
  title: Keep failed file deletion recoverable without unhandled promise rejections
  description: Use the existing App confirmation API in await mode. Preserve failure messages, the file and the open dialog; allow retry and cancellation. Strengthen the existing file-page D1 through actual confirmation buttons, without adding another Case.
  observed_behavior: Static confirmation re-rejects failed onOk promises after the page displays the file deletion error; component execution reports unhandled rejections.
  expected_behavior: Failed deletion displays its reason and leaves the file and dialog intact, without unhandled rejections. Retry success closes the dialog and refreshes files/count; cancellation closes without another request or refresh.
  escaped_stage: D1
  coverage_gap:
    type: missing_boundary
    description: The earlier failed-delete test directly owned the confirmation callback; it proved the business rejection but did not execute the static button's promise handling.
  feature_contract_changed: false
  affected_features:
    existing: [F-111]
    added: []
    modified: []
    retired: []
  affected_cases:
    existing: [AIDP-FE-LIST-01]
    added: []
    modified: [AIDP-FE-FILES-01]
    retired: []
  traditional_ut:
    decision: reuse
    behaviors: [Deletion forwards only selected file UUIDs, Zero successful deletions do not invalidate caches]
    reason: Reuse adjacent request/cache UT without duplicating the existing frontend component contract. This bug has no changed isolated validator or error mapper; the real confirmation regression belongs to the existing D1 and is demonstrated to fail before the fix.
    test_selectors:
    - test/ext_components/aidp/test_aidp_mgmt_app.py::TestAidpDocumentFileOperations::test_remove_forwards_only_uuids
    - test/ext_components/aidp/test_aidp_mgmt_app.py::TestAidpDocumentFileOperations::test_remove_does_not_invalidate_cache_when_no_file_succeeds
  notes: Workspace-local design is AIDP-FILE-DELETE-FIX.md, outside Git and the read-only shared directories. Impact search covered the file-page handler, its row action, existing App/confirmation helper, actual AntD static/hook promise handling and F-111/AIDP-FE-FILES-01 contracts. The previous test-backfill finding is resolved here. Only this file-delete confirmation is changed; list deletion, backend protocol, upload and handed-off detail tabs are unaffected. Actual retry/cancel failure regressions replace the callback substitute and reproduce the defect before the product change. AIDP service-test policy remains paused.
