schema_version: '1.0'
change:
  change_id: CHAT-ROUTE-SYNC-20261020
  change_type: bugfix
  bug_id: CHAT-ROUTE-SYNC-20261020
  title: Synchronize Workbench conversation selection with the URL
  description: Reflect runtime selection in the current URL without navigation or composer persistence changes.
  observed_behavior: Selecting C from a URL for A leaves A in the address and a document reload reopens A.
  expected_behavior: Saved selection updates the conversation parameter; new selection clears stale IDs; reload reopens the selected saved conversation.
  escaped_stage: D4
  coverage_gap:
    type: missing_assertion
    description: Existing activity and pin journeys assert foreground preservation but do not compare explicit selection with the URL or reload target.
  feature_contract_changed: true
  affected_features:
    existing: []
    added: []
    modified:
    - CHAT-SIDEBAR
    retired: []
  affected_cases:
    existing:
    - CHAT-ACTIVITY-D4-001
    added:
    - CHAT-ROUTE-D4-001
    modified: []
    retired: []
  traditional_ut:
    decision: add
    behaviors:
    - Saved runtime selection synchronizes the URL and controlled thread without replacing the runtime or per-thread composer state.
    - New and optimistic drafts clear stale conversation parameters while unrelated query, hash and browser history state remain.
    - Initial canonical and legacy deep links restore the requested conversation; list reload preserves the current selection and URL.
    reason: Frontend provider and real-runtime regression proof; Python behavior is unchanged. Browser reload is a distinct D4 boundary; no additional D1 is needed.
    test_selectors:
    - frontend/tests/workbench/WorkbenchConversationUrl.test.tsx
    - frontend/tests/workbench/WorkbenchBootstrapLoading.test.tsx
    - frontend/tests/workbench/ConversationEntrypoints.test.tsx
    - frontend/tests/workbench/ConversationActivityRuntime.test.tsx
    - frontend/tests/workbench/ConversationActivitySync.test.tsx
  notes: 'Baseline 0a98262b9. Existing SPEC: ../nexent-doc/docs/Developing/chat-workbench-session-state/design.md,
    URL synchronization follow-up. Existing activity D4 is regression-only. Add one focused selection/reload
    browser journey; no API, persistence, schema or draft-storage changes. User authorized local deployment
    and right-browser validation, then explicitly authorized commit and push after verification. Verification: 16 relevant frontend tests passed;
    CHAT-ROUTE-D4-001 and unchanged CHAT-ACTIVITY-D4-001 passed. The new regression fails on the baseline.
    Right-browser saved selection, reload, new-conversation and legacy-link checks passed without backend data writes.'
