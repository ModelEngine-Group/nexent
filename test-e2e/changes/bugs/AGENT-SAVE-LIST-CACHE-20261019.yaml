schema_version: '1.0'
change:
  change_id: AGENT-SAVE-LIST-CACHE-20261019
  change_type: bugfix
  bug_id: AGENT-SAVE-LIST-CACHE-20261019
  title: Invalidate Agent lists after successful editor autosave
  description: Use the application's shared query client to invalidate Agent lists when persisted Agent information changes.
  observed_behavior: Returning to an Agent list within its sixty-second stale interval retains the previous saved name.
  expected_behavior: Successful saves invalidate paged and legacy Agent list queries so returning refetches current information. Failed saves preserve confirmed list data.
  escaped_stage: D4
  coverage_gap:
    type: missing_assertion
    description: Existing autosave assertions verify the editor snapshot but not freshness of the cached list after navigation.
  feature_contract_changed: false
  affected_features:
    existing: [AGENT-EDITOR-WORKFLOWS]
    added: []
    modified: []
    retired: []
  affected_cases:
    existing: []
    added: []
    modified: []
    retired: []
  traditional_ut:
    decision: add
    behaviors:
    - Pending save retains fresh cache until server success
    - Confirmed saves invalidate all Agent list variants and force fresh names within staleTime
    - Rejected and unsuccessful saves preserve list data and unrelated caches
    test_selectors:
    - frontend/tests/workbench/AgentSaveListCache.test.ts
    reason: Exercise the real autosave store and QueryClient against a controlled persistence boundary; no backend/Python behavior changes or duplicate formal D1.
  notes: >-
    Existing AGENT-EDITOR-RULE-003 persistence intent remains unchanged. The current editor-list queries use the agents prefix; published snapshots are independent and unchanged.
    Shared query client moves from RootProvider into lib without changing lifetime or options.
    Referenced sibling nexent-doc is absent and browser navigation acceptance remains unverified; UT is not a D4 pass.
