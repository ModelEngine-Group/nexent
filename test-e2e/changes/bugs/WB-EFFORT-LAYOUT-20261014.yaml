schema_version: '1.0'
change:
  change_id: WB-EFFORT-LAYOUT-20261014
  change_type: bugfix
  bug_id: WB-EFFORT-LAYOUT-20261014
  title: Prevent reasoning option check overlap and popup movement
  description: Restore dedicated checkmark spacing and content-fitting effort trigger
    with end-aligned model/effort popovers, without changing parameter callbacks.
  observed_behavior: The narrow effort option overrides shared SelectItem indicator
    padding; label changes alter trigger width and move start-aligned popovers.
  expected_behavior: Labels and checks have independent space; switching supported
    effort values retains panel and popup anchor coordinates in Workbench and Agent
    chat. Model capability, values, callbacks and requests stay unchanged. The trigger
    uses only the selected label, chevron and standard padding, without fixed-width
    blank space.
  escaped_stage: D4
  coverage_gap:
    type: missing_assertion
    description: Existing D4-003 proves supported values and requests but does not
      measure indicator overlap or repeated-popup anchor geometry.
  feature_contract_changed: false
  affected_features:
    existing:
    - WB-CONTROLS
    added: []
    modified: []
    retired: []
  affected_cases:
    existing: []
    added: []
    modified:
    - WB-CONTROLS-D4-003
    retired: []
  traditional_ut:
    decision: reuse
    test_selectors:
    - frontend/tests/workbench/ModelSelectorThinking.test.tsx
    - frontend/tests/workbench/Composer.test.tsx
    behaviors:
    - Existing localized effort/capability callbacks and exact generation context
      remain unchanged.
    reason: Presentation-only change has no new unit state contract. Reuse interaction/value
      UT and strengthen real-browser geometric assertions; jsdom cannot prove layout.
  notes: Existing chat-workbench-resource-controls SPEC and shared selector reference.
    Modify only ModelSelector presentation, not global Select or model adapters. D4
    measures Workbench and Agent-chat label/check geometry and stable popup coordinates;
    no new D1 or backend proof required.
