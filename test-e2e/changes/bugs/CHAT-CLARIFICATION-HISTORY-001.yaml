schema_version: '1.0'
change:
  change_id: CHAT-CLARIFICATION-HISTORY-001
  change_type: bugfix
  bug_id: CHAT-CLARIFICATION-HISTORY-001
  title: Restore submitted clarification answers after reloading conversations
  description: Persist structured answers alongside readable user text and replay them into their originating card.
  observed_behavior: Refresh resets answers and submitted status to empty component defaults.
  expected_behavior: Submitted cards recover all answer controls and submitted state from server history.
  escaped_stage: production
  coverage_gap:
    type: missing_assertion
    description: Existing ordinary clarification tests assert immediate submission and historical disabling but never reload submitted answers.
  feature_contract_changed: true
  affected_features:
    existing: []
    added: [CHAT-CLARIFICATION-HISTORY]
    modified: []
    retired: []
  affected_cases:
    existing: []
    added: [CHAT-CLARIFICATION-HISTORY-D4-001]
    modified: []
    retired: []
  traditional_ut:
    decision: add
    behaviors:
    - Validate answer IDs/types/required/options/lengths and reject stale or foreign source forms.
    - Persist user text and structured response atomically and return both through history.
    - Restore card values/submitted state with turn/conversation isolation and legacy compatibility.
    reason: Existing six helper tests and browser immediate-submit/read-only assertions do not detect lost persisted answers. No new D1 is needed in addition to UT and the browser journey.
    test_selectors:
    - test/backend/services/test_clarification_response.py
    - frontend/tests/component/clarificationHistory.test.tsx
    - frontend/tests/workbench/ClarificationHistoryAdapter.test.ts
    - frontend/tests/workbench/ClarificationRequest.test.ts
  notes: See ../nexent-doc/docs/Developing/chat-clarification-answer-history/design.md. Ordinary chat protocol only; NL2Agent V5-UT-FE-019 is unaffected. Browser endpoints are controlled; no live provider claims.
