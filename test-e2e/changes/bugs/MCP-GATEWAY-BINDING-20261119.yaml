schema_version: '1.0'
change:
  change_id: MCP-GATEWAY-BINDING-20261119
  change_type: bugfix
  bug_id: MCP-GATEWAY-BINDING-20261119
  title: Bind Gateway origin and signing configuration at the deployed MCP entrypoint
  description: Supply the explicit deployment arguments required by the independent credential delegation client.
  observed_behavior: Valid forwarded sessions receive HTTP 403 because the deployed tenant router calls the credential client without its mandatory Gateway URL and signing key.
  expected_behavior: Valid same-tenant sessions complete signed Gateway delegation and reach their MCP application; invalid or cross-tenant sessions remain rejected.
  escaped_stage: D3
  coverage_gap:
    type: missing_assertion
    description: Existing protocol tests supply a configured resolver directly and do not exercise the backend HTTP entrypoint's dependency binding.
  feature_contract_changed: false
  affected_features:
    existing: [GW-AUTH]
    added: []
    modified: []
    retired: []
  affected_cases:
    existing: [GW-AUTH-D3-001]
    added: []
    modified: []
    retired: []
  traditional_ut:
    decision: add
    behaviors:
    - The deployed MCP router passes the configured Gateway origin and signing key to credential delegation.
    - A valid same-tenant session reaches its tenant application with request-local identity.
    - Other-tenant identities and unavailable delegation remain forbidden without executing tenant handlers.
    reason: Add the missing concrete entrypoint assembly regression; reuse existing protocol and legacy MCP service tests without duplicating a formal Case.
    test_selectors:
    - test/backend/services/test_mcp_gateway_binding.py
    - test/backend/gateway/test_mcp_delegation.py
    - test/backend/services/test_mcp_service.py
  notes: Design at ../nexent-doc/docs/Developing/auth-mcp-gateway-delegation/design.md. GW-AUTH-RULE-03 and GW-AUTH-D3-001 retain their contracts. The linked upstream independent-image SPEC is unavailable in this document checkout. UT covers the missing entrypoint binding; the reused D3 Case covers the signed protocol and tenant boundary. Read-only deployed SSE initialization/list_tools evidence remains separate from formal results and performs no tool invocation.
