schema_version: '1.0'
change:
  change_id: AUTH-ENTRY-ROUTES-20261021
  change_type: bugfix
  bug_id: AUTH-ENTRY-ROUTES-20261021
  title: Remove legacy chat grants from Workbench authorization
  description: Require explicit Workbench authorization against develop 7dd0e0350.
  observed_behavior: The route guard accepts a legacy /chat grant for Workbench, while the exact permission utility and sidebar require /workbench.
  expected_behavior: Legacy /chat grants never authorize Workbench. Explicit /workbench grants remain valid; the legacy /chat plus /newchat homepage fixture selects /newchat.
  escaped_stage: production
  coverage_gap:
    type: missing_assertion
    description: Authorization recovery tests lack direct Workbench denial assertions for legacy grants, and the homepage suite retains an obsolete /chat-to-Workbench expectation.
  feature_contract_changed: false
  affected_features:
    existing: []
    added: []
    modified: []
    retired: []
  affected_cases:
    existing: []
    added: []
    modified: []
    retired: []
  traditional_ut:
    decision: strengthen
    behaviors:
    - Deny direct Workbench access for /chat alone, /chat plus /newchat, and /newchat alone.
    - Allow explicit /workbench grants, including when legacy /chat is also present; keep the guard consistent with canAccessRoute.
    - Preserve ordinary nested and shared route authorization and authorization recovery.
    - Correct the obsolete homepage expectation for /chat plus /newchat to /newchat.
    - Retain supported homepage priorities, ordered management-page fallback, and Home for empty or root-only grants; remove expectations for the explicitly withdrawn route filter.
    reason: The frontend authorization branches are proved with the real provider/hook and controlled router/HTTP boundaries. No Python behavior changes; no duplicate formal D1 is needed.
    test_selectors:
    - frontend/tests/component/homepageRedirect.test.tsx
    - frontend/tests/component/authorizationRecovery.test.tsx
  notes: >-
    Design ../nexent-doc/docs/Developing/auth-permission-default-entry/design.md, review follow-up dated 2026-10-21.
    AUTH-DEFAULT-ENTRY-20261019 references that missing local design and unavailable UX-WB-D4-003.
    Workbench layout/default-entry SPEC and NAV-MENU Cases were inspected; sidebar tests do not prove the
    real useAuthorization guard. Existing sidebar uses exact grants already and is unchanged.
    Scope narrowed by user request: homepage production code and fallback test changes are withdrawn.
    Follow-up test synchronization replaces unsupported disabled-Workbench/section fallback fixtures
    with ordered management grants and removes the section-only Home expectation. No invalid-route
    filtering is required or claimed; no formal Case is deleted, skipped or weakened.
    Disabling Home and Workbench still selects /newchat when that grant exists. The earlier fallback
    risk required an additional no-newchat permission combination not established for standard roles.
    No formal Case execution or browser journey completeness is claimed. D2/D3/D5 are outside this local
    authorization fix; existing immutable SQL migration already converts historical grants.
