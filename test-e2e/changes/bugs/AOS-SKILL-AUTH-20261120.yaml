schema_version: '1.0'
change:
  change_id: AOS-SKILL-AUTH-20261120
  change_type: bugfix
  bug_id: AOS-SKILL-AUTH-20261120
  title: Preserve published Skill authorization through AgentOS export
  description: Align the ordinary published Skill exporter with the existing authorized builder contract.
  observed_behavior: Northbound runs with published Skills return HTTP 500 before model dispatch because GUIDE and CONFIG include the required authorization list that their exporter does not expect.
  expected_behavior: All three Skill tools require the exact sorted bound names and retain strict class, source, metadata, root and parameter validation before Runtime materialization.
  escaped_stage: D3
  coverage_gap:
    type: missing_assertion
    description: The owning UT fixture hand-assembled obsolete GUIDE and CONFIG params instead of consuming the actual preparation builder. Prior deployed Skill Case execution was blocked on test credentials.
  feature_contract_changed: false
  affected_features:
    existing: [F-051, TPC-001, CMSR-005]
    added: []
    modified: []
    retired: []
  affected_cases:
    existing: [TPC-D3-001, CMSR-D3-001]
    added: []
    modified: []
    retired: []
  traditional_ut:
    decision: strengthen
    behaviors:
    - Actual published preparation builder exports and materializes the authorized guide, config and script with pinned files.
    - Missing, incorrect, extra or duplicate authorization names and unknown parameters remain rejected.
    - Existing wrong-root, unbound, cross-tenant, changed-file and Workbench checks remain strict.
    reason: Reuse the owning suite with real internal builder collaboration and controlled external persistence; no duplicated formal D1.
    test_selectors:
    - test/backend/app/test_agentos_prepared_skills.py
    - test/backend/agents/test_create_agent_info_workbench_coverage.py
  notes: Existing baseline is nexent-doc/docs/Developing/four-service-runtime-decoupling/changes/management-agentos-service-boundaries/design.md, AOS-SKILL-AUTH-20261120 section. This restores an established data/authorization contract and is not a Simple fix. F-051 owns binding authorization; TPC-D3-001 reuses real deployed Skill read/SSE/persistence; CMSR-D3-001 is adjacent stream recovery regression. Existing Feature/Case contracts remain unchanged. The frozen pre-pilot northbound 500 and zero provider requests are retained; scored trials remain zero until the repaired source and environment are explicitly refrozen.
