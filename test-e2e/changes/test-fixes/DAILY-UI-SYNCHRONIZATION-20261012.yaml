schema_version: '1.0'
change:
  change_id: DAILY-UI-SYNCHRONIZATION-20261012
  change_type: test-fix
  title: Repair whitespace, pagination and asynchronous UI acceptance timing
  description: >-
    The completed dc44d4aba Daily has a generated Markdown title that the raw
    anchored regex cannot restore, a target model beyond the first resource
    page, a valid SSE final_answer judged before transport/render completion,
    and a scheduled-task confirmation attempted while its tool is still running.
    Preserve exact history-title matching with normalized text. Traverse resource
    pages for positive and negative assertions, prepare an owned configured-model
    alias to avoid mistaking legitimate same-name tenant models for leakage,
    using the current API without default backfill and clean up under its owner
    identity. Exclude still-mounted hidden Compare history when reading the
    normal Debug answer. Await the exact Debug request's bounded
    transport completion plus a short rendering commit window; reasoning is not
    an answer. Await an enabled create button in the assistant proposal, inspect
    generated nonempty title/instruction/interval within its card, and require
    successful confirmation with matching persisted task ID, title and schedule.
    Use an ordinary natural-language request, not unsupported exact-title tool
    meta syntax; do not bypass UI confirmation with direct task creation.
    These are candidate test fixes, not proof of live acceptance. No product,
    global configuration, model budget, credentials, deployment or CI changes.
    D4 model metadata now uses the existing Python YAML loader rather than a
    regex requiring id as the first field. Preserve configured max_tokens and
    resolve the existing secret_env_key in-process; do not export secret values
    through the metadata bridge. Model preparation uses an isolated owner
    browser so the administrator UI session starts logged out.
    Assign only the owned Chart conversation a unique persisted label through
    the public API before restoring it, avoiding duplicate default titles.
    Keep exact sidebar matching and all diagram/citation/XSS assertions. Task
    Journey uses a recurring request without an additional first-fire delay;
    timing precision remains in API/REL as required by its original baseline.
    Preserve the observed delayed-proposal inconsistency as a diagnostic lead,
    not evidence of correct delayed scheduling.
  affected_features:
    existing: [V5-PW-CHART-01, V5-PW-PROMPT-02, V5-PW-RESOURCE-04, V5-PW-TASK-01]
    added: []
    modified: []
    retired: []
  affected_cases:
