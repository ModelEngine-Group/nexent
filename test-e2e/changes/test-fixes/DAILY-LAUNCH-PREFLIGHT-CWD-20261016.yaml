schema_version: '1.0'
change:
  change_id: DAILY-LAUNCH-PREFLIGHT-CWD-20261016
  change_type: test-fix
  title: Pass the checkout explicitly into the Daily preflight instead of resolving it from the process cwd
  description: >-
    The Ubuntu Daily run failed 36 seconds after the 2026-10-15 schedule:
    the launcher starts from the GitHub runner workspace
    (/home/jason/actions-runner/_work/...) while the checkout lives at
    /root/project/nexent, and the external-knowledge preflight called
    repository_root(), a cwd-based walk-up, which raised "Cannot locate
    repository root" and aborted the run. The same change had also turned a
    per-case dependency into a batch gate: a profile-selected case whose
    machine-local selection config is missing was reported as a doctor
    problem, and Daily refuses to start on any doctor problem. Fix: the
    preflight takes the checkout as an explicit argument
    (static_config_problems(home, records, *, repo)) and doctor passes its
    already-resolved checkout through; nothing in the preflight resolves a
    repository from the process working directory any more, and the
    profile-config gate is gone. The launcher itself already resolves the
    checkout from its own file location, so no other production change is
    needed.
  affected_features:
    existing: []
    added: []
    modified: []
    retired: []
  affected_cases:
    existing: []
    added: []
    retired: []
    modified: []
  no_case_change_reason: >-
    No Case contract, script or binding changes belong to this record: the
    fix is confined to the machine-local preflight and the suite doctor call
    site. The one Case contract change in this branch (PW-KB-AIDP-01 gaining
    a plain mock dependency) is recorded separately in
    AIDP-JOURNEY-MOCK-ONLY-20261016.
  notes: >-
    Verified by the 1:1 Daily simulation on this machine: the old revision
    (bb4cdad0c) exits 2 within a second and its diagnostic re-run reproduces
    "Cannot locate repository root from .../runner-work/_work/nexent/nexent"
    (stack: suite.py doctor -> local_preflight.py repository_root), while the
    fixed revision passes the preflight and completes the batch (D0-D6,
    4/4 PASS, --publish-latest green). Offline, the tools test directory
    keeps exactly its pre-existing failure set (one existing test call site
    adapted to the new explicit-repo signature; no new cases added).
