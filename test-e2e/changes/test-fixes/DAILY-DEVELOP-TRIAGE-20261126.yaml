  change_type: test-fix
  title: Repair verified test and preparation failures from the November 23 deployment run
  description: Keep the current Management SSE facade and creator model binding covered. Match the frontend
    component providers and selectors used at the tested boundaries. Supply required PostgreSQL fixture
    tables and resolve tenant membership against the owned schema. Create the retrieval conversation through
    the product API and load the deployed configuration before direct fixture writes. Use per-model preferences
    for the real final-answer run. Preserve missing authorized real fixtures as explicit blocked outcomes.
    Match the current authorization payload in browser fixtures and require the public not-found error
    for an absent Agent on both attempts. Register a temporary streaming health scenario before the CMSR
    provider health check. Read Debug cancellation state under the tenant-scoped Runtime owner.
    Classify TPC provider requests by the stream and message shape independently of token budgets.
    Report the incompatible deployment Core as a missing prerequisite before provisioning TPC and CMSR assets.
