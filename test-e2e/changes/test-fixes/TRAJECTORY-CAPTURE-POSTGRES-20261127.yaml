  change_id: TRAJECTORY-CAPTURE-POSTGRES-20261127
  change_type: test-fix
  title: Reconcile Runtime trajectory bootstrap with isolated PostgreSQL
  description: >-
    Verify default local capture through the real Runtime configuration in a
    fresh process. Check the allocated execution UUID, durable archive hash,
    committed source and accepted answer, and reuse of PostgreSQL tables and
    sequences. Repair the controlled fixture's catalog, preparation timing,
    and assertions for native ancestry and its simplified cold projection.
  affected_features:
    existing: [CHAT-TRAJECTORY]
    added: []
    modified: []
    retired: []
  affected_cases:
    existing: []
    added: []
    modified: [CHAT-TRAJECTORY-CAPTURE-D3-001]
