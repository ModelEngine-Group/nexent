schema_version: '1.0'
change:
  change_id: DEPLOYMENT-EXCEPTIONS-20261023
  change_type: test-fix
  title: Run deployment-sensitive knowledge cases with explicit redeployment and Local recovery
  description: >-
    Keep ordinary cases unchanged. A small repository exception catalog selects
    ModelEngine and AIDP deployment modes only when the corresponding case is selected.
    Require machine-local consent, back up configuration outside config and Git,
    reuse existing deployment hooks without changing data roots, verify actual runtime
    flags, and restore Local even after test/deployment failure. A pending recovery
    blocks later launches before synchronization. Aggregate one complete report;
    targeted verification never notifies. Switch Ubuntu from the optional external
    shared Mock container/ensure hook to the upstream suite-owned process lifecycle.
    Execution evidence and legacy acceptance completeness remain separate.
    Live verification exposed adapter state JSON written under the checkout;
    route suite-owned adapter and AIDP state into each Case's private runtime
    directory, retaining standalone persistence defaults and the source fingerprint guard.
  traditional_ut:
    decision: exempt
    behaviors: []
    reason: Test orchestration and skills only; product behavior and existing business assertions are unchanged.
  no_case_change_reason: Existing Case contracts and scripts remain unchanged; only their deployment scheduling and recovery are corrected.
