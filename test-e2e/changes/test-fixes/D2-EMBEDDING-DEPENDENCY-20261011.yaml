schema_version: '1.0'
change:
  change_id: D2-EMBEDDING-DEPENDENCY-20261011
  change_type: test-fix
  title: Bound vector dependency retries without weakening knowledge contracts
  description: >-
    The full batch at product f28a9550fa18e1265dda64b49ab9cb6da6c10fd3 had
    connectivity_false and RemoteProtocolError during USER knowledge privacy
    preparation, and a 409 dimension probe rejection while preparing a temporary
    model for the hybrid-search missing-model assertion. An isolated Ubuntu
    direct request reproduced ConnectionResetError 104; subsequent host/container
    requests and both resolved IPs returned 200 with dimension 2560. This proves
    intermittent connection resets, not an invalid model name or permanent key
    failure; the exact upstream reset source remains unknown. Keep existing
    credentials, endpoint, TLS verification and product code unchanged. Health
    retries use fresh clients and retain every outcome, never a previous success
    after a failed force recheck. Prerequisite creation retries only the exact
    409 vector dimension error issued before persistence, at most three times;
    unrelated errors and ambiguous transport writes are not retried. Keep a
    typed missing-model result separate from health/configuration/ambiguity
    errors, and prevent temporary models from changing tenant defaults. Retain
    all privacy, filtering, isolation and missing-model business assertions.
    Four AIDP policy exclusions are unchanged. Historical batch results are not
    rewritten and no running Ubuntu source/config is changed.
  affected_features:
    existing: [F-168, F-185]
    added: []
    modified: []
    retired: []
  affected_cases:
    existing: []
    added: []
    modified: [API-AUTO-551F4FB10B22BB13, API-AUTO-0A1F1A158A053D79]
    retired: []
