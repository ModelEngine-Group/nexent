change:
  change_id: LOCAL-AGENT-JOURNEY-001
  change_type: test-fix
  title: Align draft Agent setup with editable fields and independent tabs
  description: >-
    The previous Windows evidence shows the newly selected Agent name in an input,
    not a text node. Verify the name's input value during create and selection.
    Model-not-configured is a legitimate warning before selecting the model; it
    must not be confused with no Agent selected. Keep real model selection and
    Debug completion mandatory. Execute description/model/prompt in Basic step 3,
    Tools and Skills in step 4, and Advanced policies in step 5 as the Case states.
    Select the exact Agent resource card's Edit action instead of the removed
    selector menu. Step 7 switches to a second run-owned Agent and back; both
    owned Agents are registered for cleanup.
