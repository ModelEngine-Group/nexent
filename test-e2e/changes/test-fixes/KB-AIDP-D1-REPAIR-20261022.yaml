schema_version: '1.0'
change:
  change_id: KB-AIDP-D1-REPAIR-20261022
  change_type: test-fix
  title: Repair stale knowledge/AIDP cases and make the ext mock suite-owned
  description: >-
    Align the failing knowledge/AIDP test assets with the current product UI and
    service contracts without changing product code. Add the missing fetchWithAuth
    export to the AIDP D1 fixture, use the knowledge-base delete confirmation label,
    import validateAidpFiles from its current module, update the knowledge-list tag
    assertions for projected kb.tags and lazy tag metadata, accept the AIDP UI image
    url while keeping it out of model text, and follow the redesigned chat attachment
    entry and knowledge catalog heading/create button in the D4 page helpers.
    D4 helpers also follow the current role=option knowledge drawer rows,
    workbench debug composer, unnamed publish modal, sidebar thread trigger,
    SSE completion and the full Chromium/blob-download path. The AIDP oracle
    uses the seed-only "low-latency retrieval" phrase so a translated final
    answer still proves the same source. The suite-owned ext mock uses the
    conventional 30090 port so the product's deployment-time AIDP_SERVER_URL
    can reach it. Give the multi-step graph edit component test
    an explicit timeout so it is not flaky when Vitest runs case files in
    parallel. Framework integration: start the ext-knowledge mock as a
    suite-owned controlled service for cases that declare an ext logical
    service, exactly like test-assets/test-mcp. The attach layer then only
    checks health and resets per-case state; machine-local ext-knowledge.yaml,
    identity and lock are no longer required. Product behavior is unchanged.
  affected_features:
    existing: []
    added: []
    modified: []
    retired: []
  affected_cases:
    existing: []
    added: []
    modified:
    - AIDP-FE-FILES-01
    - AIDP-FE-GRAPH-01
    - AIDP-FE-LIST-01
    - UT-FE-027
    - UT-FE-AUTO-BECEA5CE0869F353
    - UT-SDK-AUTO-717BD679DD9A2E82
    - CTR-046
    - CTR-047
    - PW-FILE-01
    - PW-KB-AIDP-01
    - PW-KB-LOCAL-01
    retired: []
  notes: >-
    D1 verification: AIDP-FE-FILES-01 7/7, AIDP-FE-GRAPH-01 5/5,
    AIDP-FE-LIST-01 7/7, UT-FE-027 1/1 and UT-FE-AUTO-BECEA5CE0869F353 7/7
    passed together (27 tests). UT-SDK-AUTO-717BD679DD9A2E82 passed 1/1.
    Formal suite runs on the batch product baseline (deploy 0436, locally
    built kb-aidp-test images): the nine non-AIDP/non-Local cases passed 9/9
    in one batch, PW-KB-AIDP-01 passed 1/1 after relaxing its oracle to the
    seed-only "low-latency retrieval" phrase (the model may translate around
    the full sentence), and PW-KB-LOCAL-01 passed 1/1 in a separate
    Local-ES-mode batch. The same cases had passed 10/10 plus 1/1 before the
    rebase onto develop 1b8ed0153. The D4 run additionally required: a fixed
    suite-owned mock port 30090 so the product's deployment-time
    AIDP_SERVER_URL can reach it; the full Chromium channel for blob-backed
    downloads; the current role=option knowledge row, data-workbench-composer
    debug composer and unnamed publish modal selectors; the sidebar thread
    trigger for post-reload resume; and an SSE-finished wait before reading the
    final answer. The authenticated file stream is used only when headless
    Chromium cancels a blob-backed download. The AIDP permission seed was
    updated only for the runs and restored; the deploy/env snapshot was
    restored. Framework unit tests passed 38 tests plus 5 subtests;
    validate_execution.py, validate_changes.py and validate_test_assets.py
    --phase implementation passed. The framework change adds no new command,
    argument or entry point: the existing suite worker starts and stops the
    mock through the same controlled-services lifecycle used by
    test-assets/test-mcp, and no machine-local YAML is read. UT-FE-027 remains
    a narrow helper assertion and does not cover its full legacy title; that
    pre-existing coverage gap is not expanded in this repair.
