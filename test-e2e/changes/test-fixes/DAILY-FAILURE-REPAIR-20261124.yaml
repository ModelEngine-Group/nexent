schema_version: '1.0'
change:
  change_id: DAILY-FAILURE-REPAIR-20261124
  change_type: test-fix
  title: Repair Daily fixtures and current browser paths
  description: >-
    Restore deterministic browser authentication and complete system-configuration
    snapshots. Keep tag-statistics Agent display names while generating valid Python
    internal names. Derive the Skill-list batch from the per-case result directory
    when TEST_BATCH is absent. Follow the current configuration-list Agent listing
    action, verify selected MCP tools through the current service popover, allow the
    container deployment response to use the established deployment window, and
    scope Skill take-down cleanup to the visible confirmation modal. No product
    acceptance result is weakened. Separate bounded backend corrections cover
    repository import identities, Skill tool configuration parity and transient
    MCP discovery after a restart, each with traditional unit and runtime proof.
