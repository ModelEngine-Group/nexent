  traditional_ut:
    decision: add
    reason: >-
      Runtime retesting exposed three product contract defects in addition to the
      test maintenance. Focused unit regressions prove repository import identity
      propagation, authorized Skill configuration parity, transient MCP discovery
      retry behavior and process-environment credential overrides.
    behaviors:
    - Pass AuthenticatedIdentity with user_id and tenant_id through ordinary,
      Skill-bearing and official repository import paths.
    - Accept the exact builtin run_skill_script, read_skill_md and
      read_skill_config configuration emitted by the Agent compiler.
    - Retry only MCPConnectionError during tool discovery with a bounded backoff,
      preserving persistent failures and complete tool snapshots.
    test_selectors:
    - test/backend/services/test_agent_repository_service.py::test_import_agent_from_repository_increments_downloads
    - test/backend/services/test_agent_repository_service.py::test_import_agent_from_repository_passes_skill_resolutions
    - test/backend/services/test_official_agent_service.py::test_install_bundle_with_skills
    - test/backend/services/test_official_agent_service.py::test_install_bundle_without_skills
    - test/backend/services/test_official_agent_service.py::test_install_bundle_creates_kb_and_remaps_refs
    - test/backend/services/test_remote_mcp_service.py::TestRefreshMcpServiceToolCount::test_retries_transient_session_failure
    - test/backend/services/test_snapshot_export_boundaries.py::test_snapshot_accepts_builtin_authorized_skill_configuration
  notes: >-
    The original API-074 and PW-SKILL-01 runtime HTTP 500 failures are not hidden
    by this test repair and remain in the local retest selection. Shared AgentPage
    tool binding keeps the existing persistence assertion and adds a real selected
    checkbox assertion. PW-SKILL-02 retains every business step and assertion;
    only its cleanup implementation changes. Local execution results stay outside
    the repository. The process credential override regression is maintained at
    test-e2e/infra/tools/tests/test_auth_config.py as suite infrastructure proof,
    separately from traditional backend UT selectors.
