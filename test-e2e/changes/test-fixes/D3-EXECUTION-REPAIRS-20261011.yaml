schema_version: '1.0'
change:
  change_id: D3-EXECUTION-REPAIRS-20261011
  change_type: test-fix
  title: Aggregate complete Case results and load registered Memory Mock configuration
  description: >-
    CMSR-D3-001 binds two required functions but collection rejected the second
    as a duplicate Case. Allow members/parameter variants only within the same
    script and stage, and emit one terminal record after all members complete
    setup/call/teardown. Preserve every phase result; later failures, cleanup
    failures and incomplete/maxfail sessions cannot inherit an earlier PASS.
    AGT-071 loads the existing three NEXENT_EXTERNAL_MEMORY settings from
    secrets.env, memory-mock.env or exports with conflicting values rejected
    without disclosing credentials. Do not change machine-local credentials,
    endpoints, product configuration or the running Ubuntu batch. Preserve
    explicit JUnit policy/safety/dependency skip classifications and keep AIDP
    disabled. AGT-051 and API-120 require fresh vector health before writes,
    retain creation/indexed diagnostics and bounded read-only retrieval evidence,
    and verify owned-resource deletion rather than accepting arbitrary cleanup
    HTTP 400. A later failed health probe is diagnostic and does not establish
    causality or turn a missing business marker into PASS/dependency automatically.
    Indexed true alone is not proof that an embedding vector was created.
    Provider TLS reset/EOF remains an external unresolved problem. AGT-043
    remains unmodified: its legacy negative implementation does not exercise
    a controlled summary-provider timeout; removing an unrelated prerequisite
    would not certify the declared contract. Legacy broad memory obligations
    such as quota/deduplication/isolation need separate semantic coverage review,
    not automatic whole-feature expansion or reduced expected results. No
    product code or CI workflow changes; offline mutation tests validate runner
    and fixture behavior, not product acceptance or historical batch outcomes.
  affected_features:
    existing: [CMSR-005, F-178, F-123, F-120, F-111]
    added: []
    modified: []
    retired: []
  affected_cases:
