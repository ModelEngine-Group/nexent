schema_version: '1.0'
change:
  change_id: AIDP-JOURNEY-MOCK-ONLY-20261016
  change_type: test-fix
  title: Retire the AIDP mock/real profile selection; the journey always runs the mock
  description: >-
    There is no real AIDP environment to smoke-test against (short and mid
    term), so the mock profile is the only executable target and the whole
    profile-selection mechanism was dead weight: PW-KB-AIDP-01 had to be
    resolved from a machine-local config/aidp-journey.yaml before any
    preparation, and a missing file blocked the case. The mechanism is now
    retired: the case declares its mock dependency directly through the
    plain required_mock_services path (knowledge-provider), the script runs
    a single fixed mock oracle with no NEXENT_TEST_SELECTED_PROFILE /
    NEXENT_TEST_AIDP_REAL_* plumbing, ext_attach no longer resolves profile
    selections or exports real_smoke values, the validator no longer accepts
    profile_selection, and the example/schema files are deleted. No machine
    needs a machine-local journey file at all.
  affected_features:
    existing: [V5-PW-KB-AIDP-01]
    added: []
    modified: []
    retired: []
  affected_cases:
    existing: []
    added: []
    modified: [PW-KB-AIDP-01]
    retired: []
  notes: >-
    The case contract change is machine-visible: execution.yaml drops
    profile_selection and declares required_mock_services directly,
    case.yaml drops the execution.profiles block and the real_smoke
    wording, and the spec always uses the seed oracle (aidp-kb-product).
    Verified offline: ext_attach tests green after removing the profile
    test class, the dependency-receipt test uses a plain attach reason,
    and the asset validator regenerates a registry in which
    PW-KB-AIDP-01 carries required_mock_services [knowledge-provider]
    like its sibling mock cases.
