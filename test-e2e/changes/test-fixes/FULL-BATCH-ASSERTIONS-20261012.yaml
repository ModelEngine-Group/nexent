change:
  change_id: FULL-BATCH-ASSERTIONS-20261012
  change_type: test-fix
  title: Correct isolated-memory, rejected-history, owned cleanup and Skill journey acceptance
  description: >-
    Repairs the completed 65effab5a Ubuntu batch without changing product code,
    credentials or historical results. AGT-071 seeds local long-term memory only
    after hot-update acceptance, retains NOT_FOUND and proves the new org is
    queried instead of the old org. CMSR rejects all failed model/action units
    while allowing only exact ordered pre-Step-1 memory tools/logs in history
    and the formatter's empty, metadata-free final-answer view placeholder;
    emitted or persisted answers and negative mutations must still fail.
    Document-scope cleanup retries only the
    documented 409/060109 in-flight guard within a finite deadline, records
    failures and preserves the primary exception. PW-AGENT-03 owns a meaningful
    Skill with a reference-only answer, verifies consumption in a fresh Debug
    runtime, and deletes Agents before its Skill. Completed Debug output missing
    its required answer fails promptly; framework assertions are business FAIL,
    not automatically AUTOMATION_ERROR. These classifications do not attribute
    root cause to product code. AIDP remains blocked, scale-performance assets
    remain missing, and SiliconFlow TLS reset/EOF is not fixed by this change.
    Legacy document-scope fence/charge/fault-injection obligations remain
    acceptance-unreviewed; this cleanup correction is not proof of full coverage.
    No extra environment variables, CI, fetch, deployment or notification.
