    added: []
    modified: [CTR-046, CTR-047, CTR-016, CTR-017, PERF-09, AGT-001, AGT-002, REL-02]
    retired: []
  notes: >-
    Baseline 39ed74b5215b78d45c8449913dfcf427269dc223. Offline evidence:
    mock-services dispatcher tests 26/26 OK (Windows Python), ext attach
    fake tests 24/24 OK, publisher tests 23/23 OK, mock import smoke OK,
    fidelity collect-only 63 items (57 original + 6 new). Authorized run
    evidence: fidelity executed 63/63 PASS (no skips), and the eight
    consumers plus the repaired daily cases ran green against the official
    dockerized test deployment (local-latest images built from this
    baseline, deploy.sh with a one-off root dir). A containerized product
    uses product_url http://ext-knowledge:30090 through the product network
    overlay; the runner reaches the same instance on the loopback address.
    AGT-002
    needed a wider wait on the forced-failure regenerate call: the current
    adapter spends its full five-attempt retry budget against the controlled
    503s, which exceeds the default model timeout. A full d4 typecheck
    still needs the d4 node_modules install outside the batch.
    Post-review corrections (PR #4090 review pass): the worker process now
    binds RESULT_DIR itself and adopts any prerequisite receipt, so attach
    and dependency failures report BLOCKED_BY_DEPENDENCY with their concrete
    reason instead of a bare AUTOMATION_ERROR (regression tests added — the
    previous tests set RESULT_DIR themselves and masked the gap); the base
    compose publishes the port on loopback only per D-001 (the all-interface
    publishing was an execution-phase leftover from the hybrid host-mode
    exploration); release() decides the instance state before dropping the
    lock; the schema description matches the allowed host-mode equality of
    runner_url/product_url; the fidelity conftest clears the wire log per
    test and restores the identity environment variables; the control plane
    validates the whole /_reset service list first and checks AIDP sub-app
    response codes on fail-next/fail-reset. Second review pass
    (jeffwu-1999): the _attach_locked exception path now rewrites the
    released state while the lock is still held (the release() rule was
    not fully ported); resolve_profile_selection blocks loudly with a
    dependency receipt when the case contract is unreadable or has no
    execution.profiles entry for the selected profile, instead of
    silently attaching an empty dependency set; four regression tests
    cover both orderings of the failure state and both blocking paths.
