  change_id: A2A-PROTOCOL-TIMEOUT-20261009
  change_type: test-fix
  title: Implement supported protocol switching and real product timeout checks
  description: >-
    Bind five existing Cases to independent scripts. Test real JSONRPC and
    HTTP+JSON endpoints and refuse an unadvertised disabled gRPC binding;
    this is not a claim of implemented gRPC wire interoperability.
    Timeout checks allow the actual 300 second product deadline and three
    attempts, record redacted wire, restore the fault and clean owned Agents.
    Preserve explicit product-error expectations instead of accepting HTTP 500.
