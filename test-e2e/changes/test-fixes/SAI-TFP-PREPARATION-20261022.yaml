schema_version: '1.0'
change:
  change_id: SAI-TFP-PREPARATION-20261022
  change_type: test-fix
  title: Declare self-contained SAI preparation and retain TFP prerequisite gates
  description: >-
    The Ubuntu batch blocked SAI-D3-001 and SAI-D5-001 before execution because
    their bindings omitted the mandatory per-case preparation declaration.
    Explicitly declare empty preparation: the existing scripts own their
    verification image, deterministic model and disposable Docker resources.
    They require no platform anchors, business asset families or D4 preparation.
    A local rerun also exposed an eager-kernel assumption in the SAI-only probe:
    the current factory defaults to a DeferredToolExecutor, so the immediate
    kernel-lease assertion incorrectly reports Docker fallback. Explicitly
    disable fast-path in this probe's factory to exercise its declared eager
    Docker boundary. Preserve all assertions, timeouts and product behavior.
  affected_features:
    existing: [SAI-001, TFP-001]
    added: []
    modified: []
    retired: []
  affected_cases:
    existing: [TFP-D3-001, TFP-D4-001]
    added: []
    modified: [SAI-D3-001, SAI-D5-001]
    retired: []
  notes: >-
    TFP-D3-001 and TFP-D4-001 remain blocked until the dedicated deployed
    fixture prerequisites and real execution evidence are available, as
    required by TFP-E2E-BACKFILL-20261013. Verify deployed SDK fingerprints,
    Docker/session/bind/fast-path configuration, workspace ownership, fixture
    skill, cross-tenant identities, controlled provider reachability, storage,
    Langfuse observations and D4 browser dependencies before unblocking.
    Static validation and collection are not runtime acceptance passes.
    The only helper changed is sai_kernel_probe.py, referenced exclusively by
    these two SAI Cases through sai_docker.py. No product code, deployment,
    TFP execution script or unrelated Case is changed.
