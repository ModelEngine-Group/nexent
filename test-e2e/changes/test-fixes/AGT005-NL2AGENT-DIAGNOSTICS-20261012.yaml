schema_version: '1.0'
change:
  change_id: AGT005-NL2AGENT-DIAGNOSTICS-20261012
  change_type: test-fix
  title: Clarify missing-capability input and retain timed NL2Agent evidence
  description: >-
    Removes ignored legacy complexity from the current NL2Agent request, specifies
    the intended assistant and mandatory missing external dependency without
    forcing a protocol response, and retains the existing strict structured
    clarification/resource-choice/completed-degradation acceptance and 300-second
    stream limit. Reads the tenant default model rather than assuming the draft
    Agent's model controls NL2Agent. Persists bounded phase timings even when the
    stream fails; event fragments and character counts are not token counts.
    Read-only Ubuntu runtime inspection found configured legacy max_tokens=4096
    but main_model max_tokens/max_output_tokens and the W1/W2 capacity snapshots
    absent. This change does not fix product alias parameter propagation, mutate
    shared model configuration, or declare that a persisted setting reached the
    provider wire. Historical failed evidence remains unchanged.
    The first targeted replay completed in 224.883 seconds with a valid
    clarification card, but exposed a stale test rule forbidding all state
    writes. The current localized NL2Agent full-generation workflow explicitly
    saves description before resource search. Align the Case and script to allow
    only one acknowledged description-only save on the same draft before the
    card, with read-back; preserve every other field and all model/resource
    bindings. Reject completion, prompt writes, missing acknowledgment, wrong
    draft, repeated saves and writes after the pause. This is not an arbitrary
    relaxation based on observed success.
    The second live replay finished in 142.809 seconds but remained FAIL: the
    runtime model serialized example_questions into a JSON string instead of the
    required list[str], the real save tool rejected it with invalid_agent_fields,
    and prompt_generation_failed was not recovered. Do not accept final_answer
    alone, repair generated product output in the test, or retry until PASS.
    Product parameter propagation and model generation reliability remain open
    under the user's test-only direction.
  affected_features:
    existing: [F-045]
    added: []
    modified: []
    retired: []
  affected_cases:
    existing: []
    added: []
    modified: []
    retired: []
  no_case_change_reason: AGT-005 was subsequently deleted at explicit user request; this record preserves the diagnostic history, not an executable Case reference.
