  change_id: WINDOWS-D1-TRIAGE-20260930
  change_type: test-fix
  title: Repair D1 case-local execution and Windows test doubles
  description: >-
    Scope is the 43 failed and 7 blocked D1 Cases in the three-batch merged report.
    Resolve test-only libraries from the isolated frontend runner; run the entire
    Case-local Vitest file so unnamed boundary sub-scenarios are not filtered out.
    Update only observed Agent component paths to the current agentId route.
    Supply DB system-Agent classification, query count and reasoning metadata in
    controlled unit fixtures. Exercise real Windows directory-link escapes with
    NTFS junction fallback when symbolic-link privilege is unavailable.
    Assert the typed MCP connection timeout instead of obsolete error wording.
    Update icon_url field boundaries using resource-card refactor 3a378d51d as
    change evidence, preserving tag and sensitive-log assertions. Do not change
    product sources or database-test safety policy. Retire the historical built-in
    OTel Case against removal commit b8f8f6f29; retain its ID and evidence rather
    than synthesizing a passing replacement. Update F-186's optional hook contract.
    Use ESM React imports in case-local mock factories, provide QueryClient and
    current route/store seams, update combined-filter interaction selectors,
    preserve the current landing-thread metadata contract (0c9ff869c), and test
    the real Debug-Chat-Thread chain after the workbench refactor (106729394).
    Drain Ant Design callbacks before JSDOM teardown. Retain both default text
    logs and JUnit, including unhandled-error evidence and nonzero process exits.
    Replace five unrelated placeholder scripts with real locale, Agent state,
    group/invitation form, Memory version/configuration and Cookie-auth tests.
    Synchronize their steps/assertions and update the obsolete refresh contract
    against e98b84b2b. Component results do not imply full browser integration.
