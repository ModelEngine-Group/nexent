schema_version: '1.0'
change:
  change_id: MODEL-HEALTH-PRECONDITION-20261023
  change_type: test-fix
  title: Remove model-management health gates from ordinary business prerequisites
  no_case_change_reason: >-
    Formal business acceptance and case-local bindings are unchanged. Only the
    shared prerequisite helpers and their infrastructure regression tests change.
  traditional_ut:
    decision: exempt
    behaviors: []
    reason: No backend or SDK product behavior changes; helper behavior is covered by infrastructure regression tests.
  description: >-
    Model listing is allowed for ordinary users, while saved-model healthcheck
    requires model:update. The shared resolver reused a successful catalog
    reader for an unconditional management healthcheck, incorrectly blocking
    business tests with HTTP 403. Resolve configured tenant-local models without
    probing connectivity. Remove repeated probes from existing VLM assets,
    D4 voice/embedding preparation and memory business preconditions. Newly
    created owned models retain one activation because product runtime requires
    available status rather than the initial not_detected status. Keep explicit connectivity,
    permission assertions and post-failure opt-in diagnostics intact. Business
    requests retain their original identities and real Provider assertions;
    missing models, runtime failures and cleanup failures remain failures.
    No product code, model preference, credential, role or pipeline is changed.
    The existing Cases below are the 56 dependency-blocked Cases selected from
    the previous Ubuntu batch for a targeted rerun, not automatically marked PASS.
