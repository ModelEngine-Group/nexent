  change_type: test-fix
  title: Repair evidenced test harness and stale contract failures from Ubuntu Daily
  description: Drain Ant Design delayed timers before JSDOM teardown. Use the current Agent editor dynamic route
    and update the case reference. Keep the task enqueue contract's broker and result backend in memory before importing
    Celery, since enqueue itself is stubbed. Patch the canonical local MCP constant as well as the NL2Agent service
    alias in its context-budget fixture. Use MODEL_TIMEOUT for LLM name regeneration, not the ordinary HTTP timeout.
    Scope the Local KB create action to a native toolbar button. Pass the authorized KB owner into SEC-02's shared
    file ACL scenario. Read Memory Provider error messages through the product-wide message envelope while preserving
    wire error-code assertions. Separate tenant-scoped tag metadata reads from MANAGE-only mutations and usage;
    remove fixed database IDs from the governance attack paths. Do not edit product code, operator configuration,
    or turn failures into policy skips. Prepare repository listing model health with the existing same-tenant reviewer,
    preserving developer-owned Agent creation and publishing permissions.
