    modified: [API-162, API-163]
    retired: []
  notes: >-
    Direct HTTP probes are read-only. The isolated ASGI clients close after each
    test and pytest restores their signing configuration and readiness fixtures.
    API-AUTO-95BBFF3CC39D73F0 retains scoped thread-capacity snapshot proof.
    Legacy deployment shutdown timing and log assertions still require
    separate deployment verification.
