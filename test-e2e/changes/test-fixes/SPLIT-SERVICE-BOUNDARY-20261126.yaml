  change_type: test-fix
  title: Probe Config and Runtime separately from Gateway
  description: >-
    The Config and Runtime business clients share the public Gateway origin.
    Restore direct health probes and verify owned OpenAPI routes and cross-service
    rejections against the real downstream applications using synthetic signing
    keys. Probe anonymous and private-route rejections at the deployed Gateway.
