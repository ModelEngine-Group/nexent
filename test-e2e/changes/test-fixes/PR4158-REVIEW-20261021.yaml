    existing: [CHAT-SIDEBAR, WB-CONTROLS]
    added: []
    modified: []
    retired: []
  affected_cases:
    existing: []
    added: []
    modified: [CHAT-SIDEBAR-D4-002]
    retired: []
  notes: Existing ResourceCard and SelectedResourceChips tests fail on raw translation keys; Composer deliberately stubs translation and therefore needs real locale lookup for resource copy. UserMessageEditComposer fails before rendering initial runtime messages, independently of i18n. Existing sidebar UT cannot prove browser responsive CSS and page navigation. Strengthen the existing D4 rather than add duplicate D1 cases. The D4 uses real UI and controlled HTTP fixture responses, not a real model smoke test.
