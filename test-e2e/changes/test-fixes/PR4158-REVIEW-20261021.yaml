change:
  change_id: PR4158-REVIEW-20261021
  change_type: test-fix
  title: Repair resource localization tests and automate sidebar browser acceptance
  description: Initialize real locale catalogs for resource tests, retain key-based Composer stubs outside localized resource copy, wait for actual runtime message initialization, and implement the existing sidebar D4 journey.
  traditional_ut:
    decision: strengthen
    reason: Test-only review follow-up. Existing component tests cover callbacks and loading state; D4 adds real browser geometry, route lifecycle and mobile drawer proof. No Python behavior changes.
    behaviors:
    - Resolve resource accessibility labels and removal actions through the maintained locale catalogs.
    - Preserve all existing Composer layout and inline edit send/cancel/read-only assertions.
    test_selectors:
    - frontend/tests/workbench/ResourceCard.test.tsx
    - frontend/tests/workbench/SelectedResourceChips.test.tsx
    - frontend/tests/workbench/Composer.test.tsx
    - frontend/tests/workbench/UserMessageEditComposer.test.tsx
