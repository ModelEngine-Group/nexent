change:
  change_id: A2A-AUTH-RELATIONS-20261009
  change_type: test-fix
  title: Implement scoped discovery failures, credentials and Agent relationships
  description: >-
    Add case-local selectors, matching step contracts and bindings for seven
    existing Cases. The Mock exposes current test credentials only through a
    control-token protected no-store endpoint. Scripts do not embed credentials
    or database IDs; wire evidence contains fingerprints. Faults are restored
    and owned resources are deleted even when a product assertion fails.
    Preserve rejection of foreign-owned Agent relation IDs as acceptance;
    never weaken it to match an incorrect successful product response.
