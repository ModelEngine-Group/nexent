  notes: 'Baseline develop 33e994eac. Test-only repair authorized by the user. F-171
    existing assertions already prove W2 dispatch and overflow recovery; retain them
    and restore omitted constructor state in their test factories. DeepSeek D3 owns
    its loopback provider and D4 owns routed browser fixtures, so both explicitly
    declare empty preparation. AGT-010 uses shared.prompt_fault and runner-owned anchors,
    not an ext-served Mock; remove only the false required_mock_services declaration.
    AGT-012 reuses the same owned fault lifecycle and classifies only the exact Jiuwen
    capability rejection as dependency failure; other 400 responses must fail assertions.
    Jiuwen availability is a configuration-service prerequisite, not bypassed or mocked
    in live acceptance. PW-PROMPT-01 uses the description accessible name. PW-PROMPT-02
    shares AgentPage Compare helpers, whose visible textbox selector must handle both
    textarea and Lexical inputs plus retained hidden histories. Traditional product
    UT changes are inapplicable because no product behavior changes; run the existing
    formal D1 contracts and infrastructure fault regressions separately from live
    D3/D4. Preserve every original provider-call, no-save, reload, comparison and
    output assertion. No new Cases. Obsolete UI/retired-field actions are reconciled
    below while core business obligations remain enforced. Execution evidence will
    be recorded in docs/handoffs/2026-10-22-context-prompt-triage.md. Live verification
    also exposed an empty duty_prompt in AGT-012; initialize and read back the owned
    draft prompt before injecting faults. PR #4051 removed constraint/few-shot prompt
    fields and the current high-fidelity UI has a single Prompt editor. PW-PROMPT-01
    therefore preserves its real-generation, unrelated-configuration, manual-save,
    reselection and refresh obligations through current fields and UI; remove obsolete
    tab/modal actions and add explicit AC-01/02/03 bindings. The protected unrelated
    snapshot includes name, author, description, models, tools, skills, children,
    greeting and example questions. This is a stale-contract repair, not a relaxation
    of output or persistence assertions. The current Agent card exposes Configure
    through More actions; update AgentPage.select using the exact owned card, and
    verify a neighboring card cannot be selected accidentally. PW-PROMPT-02 now
    explicitly returns through the configuration step before editing the second
    Prompt, then reopens Debug without clearing Compare histories; the full-screen
    Compare layout otherwise hides the configuration editor.'
