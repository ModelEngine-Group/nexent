  change_id: PREREQUISITE-COMPLETION-20261023
  change_type: test-fix
  title: Complete owned knowledge mock deployment and explicit case preparation
  description: >-
    Historical verification on deployed revision 1b8ed015: twelve selected cases could not attach because the Ubuntu test home lacked
    ext-knowledge.yaml and a deployed owned instance. Add explicit operator setup,
    a configuration-preserving D0 ensure hook and read-only identity/route readiness
    checks. Seven additional cases lacked preparation declarations. Self-contained
    HTTP/browser/PostgreSQL fixtures explicitly request no unrelated shared assets;
    the real NL2Agent journey requests tenant anchors and the configured LLM.
    Keep all business assertions and cleanup requirements unchanged. The
    USER-MODEL-READ-D5-001 directory is copied unchanged from deployed revision
    1b8ed01538ec31c8cd8b6c8df9c584a3225ab6ef before adding its preparation binding;
    this branch predates that existing Case. Its migration is verified against
    the deployed revision, not invented or copied into this branch's product SQL.
    Machine-local configuration is not committed. A prerequisite repair is not
    evidence that the product acceptance or every selected Case now passes.
    After integrating upstream 012d76ec2 (PR 4179), the default suite owns its
    per-case mock process and does not require the external YAML or a separate
    deployment hook. Keep upstream startup/stop ordering and remove mandatory
    external checks from suite doctor. The operator helper and its identity
    checks are retained only for explicit optional external deployments.
    Seven preparation declarations and their current-change validation remain.
