    modified: []
    retired: []
  affected_cases:
    existing: []
    added: []
    modified: []
    retired: []
  no_case_change_reason: >-
    Only traditional frontend unit fixtures and assertions change. Existing formal
    Case assets and acceptance contracts remain unchanged; no additional formal
    component or runtime proof is introduced by this test repair.
  notes: >-
    Traditional UT selectors are frontend/tests/workbench/Composer.test.tsx and
    frontend/tests/workbench/KnowledgePicker.test.tsx. Preserve resource ordering,
    planning selection, creation modes, stop/recovery and retrieval draft isolation
    assertions rather than skipping the six originally failing tests.
