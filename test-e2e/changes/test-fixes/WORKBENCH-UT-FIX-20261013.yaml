  change_id: WORKBENCH-UT-FIX-20261013
  change_type: test-fix
  title: Align Workbench unit fixtures and retrieval configuration coverage
  description: >-
    Provide isolated routing, deployment, tool catalog and resource fixtures plus
    a real QueryClientProvider for Composer tests. Include AddAttachment in the
    assistant runtime fixture and select the Agent resource chip by its accessible
    name instead of assuming the preceding toolbar button is an Agent selector.
    Move retrieval draft/edit/save assertions to the current Composer entry point,
    add cancel/reopen coverage, and verify knowledge selection preserves existing
    retrieval parameters without mutating caller input. Product behavior is unchanged.
