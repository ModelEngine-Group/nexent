  notes: User instruction on 2026-10-29 explicitly supersedes the R1 to R4 old-import retention contract. No external
    consumer compatibility or old Python pickle support is promised. Library-specific execution compatibility modules
    and the unchanged legacy memory API algorithm seam are not import-alias files and remain. No deployment is requested.
    Historical R1 to R4 UT selector bindings now point to the replacement canonical/removal tests; their original
    execution evidence remains historical. Other listed Case scripts receive import/source binding updates only;
    execution is claimed only for the eight selected Jiuwen and SAI Cases recorded in SPEC section 18.
