  traditional_ut:
    decision: strengthen
    behaviors:
    - Canonical factory contracts Core adapters and sandbox submodules import without historical facades.
    - Removed Python paths and historical pickle globals no longer resolve in a clean process or wheel.
    - Configuration imports remain lightweight and optional Jiuwen failures do not fall back to another Core.
    - JSON and canonical type serialization, CM history budgets and resource lifecycle remain unchanged.
    - Every internal import dynamic lookup mock patch and file loader uses its actual canonical owner.
    - Models and model-service compatibility directories retain their exact file sets and bytes.
    reason: Replace obsolete compatibility-only assertions with canonical and removal checks, retain all business
      UT and formal D1 assets, and reuse existing runtime D3/D5.
