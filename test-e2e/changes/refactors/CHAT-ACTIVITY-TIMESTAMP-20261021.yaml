schema_version: '1.0'
change:
  change_id: CHAT-ACTIVITY-TIMESTAMP-20261021
  change_type: refactor
  title: Store conversation activity as a UTC timestamp without time zone
  description: Align the activity column with conversation creation timestamps while preserving UTC instants and public pagination contracts.
  affected_features:
    existing: [F-126]
    added: []
    modified: [CHAT-SIDEBAR]
    retired: []
  affected_cases:
    existing: []
    added: []
    modified: [CHAT-ACTIVITY-D5-001, AUTO-QUOTA-D3-001, CHAT-PERSIST-D5-001, CHAT-TITLE-D5-001]
    retired: []
  traditional_ut:
    decision: strengthen
    behaviors:
    - Naive UTC storage values serialize to the same aware wire cursor and epoch milliseconds independent of the application timezone.
    - Activity writes explicitly use a UTC database clock; comparisons and fallback indexes use matching naive UTC timestamps.
    - Existing quota, terminal message, title revision, deletion, ownership and pin contracts remain intact.
    reason: Strengthen existing cursor and pin UT and the existing D3/D5 migration boundaries; adjust fixtures for the new storage contract without adding duplicate Cases.
    test_selectors:
    - test/backend/database/test_conversation_activity.py
    - test/backend/database/test_workbench_pin_db.py
    - test/backend/database/test_conversation_db.py
    - test/backend/database/test_conversation_lock_order.py
    - test/backend/services/title_observability/test_title_rename_race.py
    - test/backend/services/title_observability/test_title_tracing.py
    - test/backend/services/test_conversation_management_service.py
    - test/backend/app/test_conversation_management_app.py
  notes: >-
    Baseline 8b880ad5f. The user explicitly changed the earlier TIMESTAMPTZ decision for this PR's activity field.
    Migration 007 is not present on remote develop and may be revised; merged SQL remains immutable.
    Keep a guarded conversion for already-deployed pre-merge timestamptz data, rebuilding its dependent index before type conversion.
    Public cursor encoding remains timezone-aware for old cursor compatibility; only storage and SQL comparisons become naive UTC.
    Reuse the existing automation/activity design. No global timestamp, scheduler, pin-column type, frontend or deployment changes.

    Verification: three new regression UT fail before the change; 355 relevant UT pass after it.
    Six fresh/upgrade migration variants, three quota/activity/session-timezone variants, eight deletion and eleven title regression variants pass.
    Strict formal validation, copyright, whitespace and changed-statement coverage checks pass; fixture schemas are removed.
