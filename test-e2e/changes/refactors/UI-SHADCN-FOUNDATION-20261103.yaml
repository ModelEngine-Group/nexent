schema_version: '1.0'
change:
  change_id: UI-SHADCN-FOUNDATION-20261103
  change_type: refactor
  requirement_id: UI-SHADCN-FOUNDATION-20261103
  title: Establish Radix shadcn layers and remove Ant Design from shared common components
  no_case_change_reason: This foundation changes presentation and shared frontend/tool contracts only. Existing formal business journeys retain their contracts; AGENT-EDITOR-D4-001 updates only its guide locator from an Ant Design class to a stable project data attribute. Focused UT plus representative browser smoke is selected for this increment; full module and journey migrations remain later scoped changes.
  description: Implement the shared UI foundation, controlled pagination, compatibility entry points and safe upstream maintenance tools. Preserve business requests, permissions and pagination callbacks. Full application Ant Design removal remains subsequent batches.
  affected_features:
    existing: [AGENT-EDITOR-WORKFLOWS]
    added: []
    modified: []
    retired: []
  affected_cases:
    existing: [AGENT-EDITOR-D4-001]
    added: []
    modified: []
    retired: []
  traditional_ut:
    decision: strengthen
    test_selectors:
      - frontend/tests/component/agentBulkDelete.test.tsx
      - frontend/tests/component/agentListTable.test.tsx
      - frontend/tests/component/sharedUiFoundation.test.tsx
      - frontend/tests/component/commonRadixMigration.test.tsx
      - frontend/tests/component/standardComponents.test.tsx
      - frontend/tests/component/standardDrawer.test.tsx
      - frontend/tests/component/standardModalEscape.test.tsx
      - frontend/tests/component/createAgentModal.test.tsx
      - frontend/tests/component/agentLandingPagination.test.tsx
      - frontend/scripts/__tests__/ui-maintenance.test.mjs
    behaviors:
      - Bulk deletion skips read-only and invalid identifiers, separates failed requests from successes, continues later requests and invalidates both list caches.
      - Table deletion requires confirmation; cancellation sends no request and partial failure retains failed selections.
      - Shared common components have no Ant Design imports; future imports are rejected even if an obsolete budget entry remains.
      - Input clearing preserves native controlled and uncontrolled change events, composition-aware Enter and read-only behavior.
      - Modal and drawer shells preserve drafts, close policies and hidden-effect cleanup through real Radix components.
      - Metadata properties and JSON tabs, windowed streaming CSV rows and PDF page navigation retain their contracts.
      - Guide steps preserve target positioning, non-interactive background and caller-owned completion; notices survive originating workflow unmount.
      - Basic buttons use semantic indigo tokens without a brand-only common wrapper.
      - Submission prevents duplicate actions without adding request logic to basic UI.
      - Controlled pagination preserves page-size reset, empty lists, disabled controls and callbacks.
      - Existing Standard entry points retain their actual consumer contracts while shedding Ant Design implementation.
      - Dependency boundaries reject new legacy imports and upstream synchronization never overwrites working files or conflates unknown provenance with an upstream original.
    reason: Shared frontend component and maintenance-tool contracts are proved by focused UT and representative browser rendering. No API, protocol, persistence or agent runtime changes. Existing formal Cases are preserved; their business contracts are not modified. No new D1 duplicating isolated UT is introduced. This change does not certify full application migration or formal journey acceptance.
  notes: SPEC ui-shadcn-radix-migration in the document repository; initial foundation delivery only. Test selectors and actual evidence are recorded after implementation. Python UT is irrelevant to the frontend/tool-only scope. Browser appearance and keyboard smoke evidence are reported separately from UT.
