  feature_contract_changed: false
  no_case_change_reason: Existing acceptance contracts and assertions remain unchanged; only implementation
    imports and mock lookup sites are updated. Existing Cases supply the required component evidence without
    adding duplicate Cases.
  notes: User selected behavior-preserving responsibility refactoring. Existing formal contracts remain;
    traditional UT strengthens factory/import/lifecycle boundaries. No new formal D1 duplicates unit assertions.
    Follow-up authorization on 2026-10-23 removes the old backend/agents package entirely. Formal scripts
    and shared fixtures now import and patch canonical Management/Runtime owners. Existing acceptance
    assertions remain unchanged.
  traditional_ut:
    decision: strengthen
    behaviors:
    - Preserve Agent configuration, overlays, export and preparation behavior
    - Preserve streaming, memory fallback, cancellation and shared-state notifications
    - Assert Runtime factory and local execution ownership without business database imports
    - Reject the old backend/agents package and imports across product and test code
    reason: Reuse existing preparation and streaming regressions; add focused architecture and injected
      factory/lifecycle tests.
    test_selectors:
