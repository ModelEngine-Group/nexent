schema_version: '1.0'
change:
  change_id: PROMPT-TEMPLATE-UI-CLEANUP-20261019
  change_type: refactor
  title: Retire private prompt-template management and Agent bindings
  description: Remove private template CRUD, persistence, startup synchronization
    and Agent binding fields across frontend and backend. Generation and naming use
    bundled SDK defaults. Add an idempotent SQL migration.
  affected_features:
    existing: []
    added: []
    modified: []
    retired:
    - F-049
  affected_cases:
    existing: []
    added: []
    modified: []
    retired: []
  no_case_change_reason: API-059 was retired by this change and explicitly deleted on 2026-10-22; no surviving Case is changed by this historical record.
  feature_contract_changed: true
  traditional_ut:
    decision: strengthen
    behaviors:
    - Default generation works in Chinese and English, falls back for unsupported
      language, and reports missing SDK resources.
    - Retired binding fields disappear from Agent requests, exports, ORM and frontend
      payloads; existing saved prompt text remains.
    - Prompt generation, naming, configuration startup and Agent import/export retain
      the remaining behavior.
    - Benchmark export no longer selects the dropped column and preserves prompts
      and version metadata.
    reason: Remove private CRUD UT with the retired capability, reuse generation and
      Agent regressions, and add explicit defaults-only and contract-removal assertions.
      Existing runtime-resource D1 Cases remain active.
    test_selectors:
    - test/backend/services/test_default_generation_prompts.py
    - test/backend/services/test_prompt_service.py
    - test/backend/services/test_agent_service.py
    - test/backend/services/test_core_service_slimming.py
    - test/backend/app/test_config_app.py
    - test/backend/app/test_prompt_app.py
    - frontend/tests/agentVersionSwitchGuard.test.ts
    - frontend/tests/agentUsageGuideLocales.test.ts
    - test/sdk/benchmark/test_export_agent_config.py
    - test/sdk/benchmark/test_run_benchmark_execution.py
  notes: User expanded initial frontend-only cleanup to full feature retirement. SDK
    runtime prompt bundles, NL2Agent/NL2Skill resources, Agent creation templates
    and AIDP graph prompts remain. Preserve all D1 Cases. Apply new migration through
    the normal deployment path; no existing database is modified during code verification.
