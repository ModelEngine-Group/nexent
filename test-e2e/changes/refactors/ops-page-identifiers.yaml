schema_version: '1.0'
change:
  change_id: AUTH-OPS-PAGE-IDS-20261123
  change_type: refactor
  title: Separate Ops navigation permission identifiers from routes
  description: Store ops-dashboard and ops-configuration as navigation identifiers while preserving existing accessibleRoutes and role grants.
  affected_features:
    existing: [AUTH-MULTI-ROLE]
    added: []
    modified: []
    retired: []
  affected_cases:
    existing: [AUTH-MULTI-ROLE-D2-001, AUTH-MULTI-ROLE-D2-002, AUTH-MULTI-ROLE-D2-003, AUTH-MULTI-ROLE-D3-001, AUTH-MULTI-ROLE-D5-001]
    added: [AUTH-MULTI-ROLE-D5-002]
    modified: []
    retired: []
  feature_contract_changed: false
  no_case_change_reason: Existing D2 assertions already require the unchanged Ops route and authorization contract; add D5 for migration preservation and repeatability.
  notes: Reuse AUTH-MULTI-ROLE-RULE-05 and the existing system responsibility domain. No frontend contract change. D5 owns a UUID PostgreSQL database and drops it in finally; no shared factories or deployed data are used. Mapping behavior belongs in UT, not an additional D1. Existing shared HTTP fixture uses a validated default configuration snapshot with no background tasks; current router and password utility imports replace obsolete paths. Run all five existing fixture consumers as regression.
  traditional_ut:
    decision: strengthen
    behaviors:
    - Map both Ops identifiers to their existing routes, preserving route order and deduplicating mixed legacy and new grants.
    - Preserve resource action permissions, unrelated navigation, missing-field handling and empty grant sets without adding access.
    reason: Existing formatter tests cover legacy inputs but do not cover stable Ops identifiers or coexistence during upgrades.
    test_selectors:
    - test/backend/services/test_ops_navigation_permissions.py
    - test/backend/services/test_user_management_service.py
