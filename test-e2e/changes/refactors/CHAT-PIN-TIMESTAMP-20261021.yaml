schema_version: '1.0'
change:
  change_id: CHAT-PIN-TIMESTAMP-20261021
  change_type: refactor
  title: Store personal Workbench pin time as a UTC timestamp
  description: Convert the remaining timezone-aware conversation column to native UTC storage while preserving pin ordering and API time instants.
  affected_features:
    existing: []
    added: []
    modified: [CHAT-SIDEBAR]
    retired: []
  affected_cases:
    existing: [CHAT-ACTIVITY-D5-001, CHAT-TITLE-D5-001, CHAT-PERSIST-D5-001]
    added: []
    modified: [CHAT-SIDEBAR-D5-001, CHAT-SIDEBAR-D3-001, AUTO-QUOTA-D3-001]
    retired: []
  traditional_ut:
    decision: strengthen
    behaviors:
    - Conversation timestamp columns use native UTC storage and pin writes explicitly use a UTC database clock.
    - Naive pin timestamps retain a timezone-aware ISO wire response without assuming the process timezone.
    - Pin idempotency, monotonic ordering, concurrent ownership isolation and audit/activity preservation remain unchanged.
    reason: Strengthen pin serialization/model/SQL UT and existing pin migration and integration Cases; retain activity, title and deletion regressions without adding Cases.
    test_selectors:
    - test/backend/database/test_workbench_pin_db.py
    - test/backend/database/test_conversation_activity.py
    - test/backend/database/test_conversation_db.py
    - test/backend/database/test_conversation_lock_order.py
    - test/backend/services/title_observability/test_title_rename_race.py
    - test/backend/services/title_observability/test_title_tracing.py
    - test/backend/services/test_conversation_management_service.py
    - test/backend/app/test_conversation_management_app.py
    - test/backend/apps/test_workbench_pins_app.py
    - test/backend/services/test_workbench_pin_service.py
  notes: >-
    Baseline 98c2fded0. Migration 004 is present on remote develop and must remain immutable.
    Add versioned migration 009 with an idempotent UTC conversion of the existing column, preserving NULLs, precision, index and audit fields.
    Keep explicit UTC ISO strings at the API boundary. Reuse the existing automation/activity design with a pin follow-up.
    Scope is the conversation table; unrelated scheduler and other business timestamp columns are not modified. No deployment is included.

    Verification: two added regression UT fail on the baseline; all 388 relevant UT pass after implementation.
    Ten pin migration, three pin API and twenty-eight adjacent PostgreSQL variants pass; original 004 matches remote develop byte-for-byte.
    Native UTC storage, explicit UTC wire instants, microseconds, NULLs, tie ordering, index plans and replay are asserted across three database timezones.
    Strict formal validation, copyright, whitespace and changed-statement coverage checks pass; disposable schemas are removed.
