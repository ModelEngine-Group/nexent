  traditional_ut:
    decision: strengthen
    test_selectors:
      - frontend/tests/workbench/Nl2AgentWorkflowProgress.test.tsx
      - frontend/tests/workbench/Nl2AgentRetrievalProgress.test.tsx
      - frontend/tests/workbench/Nl2AgentPanelControls.test.tsx
      - frontend/tests/workbench/AgentCreationHistoryCard.test.ts
      - test/backend/services/test_nl2agent_semantic_retrieval.py
    behaviors:
      - Header is hidden before creation starts and during local optimization; saving a creation description does not hide the active workflow.
      - Derive steps from trusted events/cards, restore historical progress and isolate target, conversation and run changes.
      - No-model mode has no semantic-unavailable warning; genuine hybrid failure keeps fallback information.
      - Waiting, cancellation, errors and completion never invent business success or model output.
    reason: Existing retrieval and card tests do not prove panel-level steps and replay; add frontend tests, reuse backend contracts, and add browser proof.
