schema_version: "1.0"
change:
  change_id: AUTO-OPEN-DOCUMENT-20261109
  change_type: requirement
  requirement_id: AUTO-OPEN-DOCUMENT-20261109
  title: Automatically show newly generated documents beside chat
  description: >-
    After an observed live run finishes, open its newly generated previewable
    document in a right-side surface while chat stays usable. Prefer Office
    originals over companion PDFs and ignore executable/intermediate scripts.
    Do not auto-open historical files during loading, conversation switching or
    read-only views. Manual close suppresses further automatic opening for that
    run; the artifacts list can reopen any file. Deduplicate by stored object
    identity so metadata/token updates do not reopen a closed document. Support
    preview loading/error states and download. Use a full-width surface on narrow
    screens. No editing, native Word launch, model or backend changes are included.
  affected_features:
    existing: []
    added: []
    modified: []
    retired: []
  affected_cases:
    existing: []
    added: []
    modified: []
    retired: []
  traditional_ut:
    decision: add
    test_selectors:
      - frontend/tests/component/autoArtifactPreview.test.tsx
      - frontend/tests/component/artifactDocumentPanel.test.tsx
      - frontend/tests/component/inlineFilePreview.test.tsx
      - frontend/tests/component/rawStreamPreviewViewer.test.tsx
      - frontend/tests/officePreview.test.ts
    behaviors:
      - Open only new supported documents after a live run completes.
      - Preserve history/load/scope isolation, explicit close and manual reopening.
      - Prefer Office originals and ignore intermediate scripts and missing sources.
      - Reuse streaming OOXML rendering without treating original Office bytes as PDF.
      - Keep other shared drawer/fullscreen callers compatible and download available.
    reason: >-
      Add focused preview lifecycle/source-selection/component tests and reuse
      existing document-renderer tests. No Python behavior changes; Python UT is
      unrelated. Preserve formal Cases; deployed browser layout and generated-file
      integration remain separate from isolated component checks.
  notes: >-
    User confirmed automatic display, without editing. Existing artifact aggregation
    and document viewers are reused. No temporary test dependencies are committed.
    External nexent-doc and ../docs/前端ui.md are absent, so SPEC synchronization
    and deployed browser acceptance remain pending. Existing bookmark/annotation
    modifications are preserved. No deployment or push is performed.
