schema_version: '1.0'
change:
  change_id: CONTEXT-TWO-CAPACITIES-20261112
  change_type: requirement
  requirement_id: CONTEXT-TWO-CAPACITIES-20261112
  title: Use two model capacities with usage-based post-response maintenance
  description: Ignore retired input/reserve settings and omit output limits; calibrate context usage and maintain only
    after accepted responses.
  affected_features:
    existing: [CMSR-005, F-036, F-171, JIUWEN-CONTEXT]
    added: []
    modified: [F-171]
    retired: []
  affected_cases:
    existing: [CONTEXT-POST-RESPONSE-D3-001, JIUWEN-CONTEXT-D3-001, MODEL-LEGACY-TOOLS-D3-001, MODEL-RECOVERY-D3-001,
      UT-SDK-AUTO-74430BEE8438F486]
    added: [CONTEXT-POST-RESPONSE-D3-001]
    modified: [MODEL-RECOVERY-D3-001, UT-SDK-AUTO-74430BEE8438F486]
    retired: []
  traditional_ut:
    decision: strengthen
    behaviors:
      - Retired input/reserve settings cannot affect capacity, fingerprints or output limits; keep trusted snapshot and
        model identity validation.
      - Prepare performs no maintenance; accepted responses calibrate input estimates and schedule bounded maintenance
        at safe step boundaries.
      - Missing or invalid usage, real zero usage, model changes, compaction, tool results, errors and cancellation preserve
        truthful state and recoverable history.
      - Hard rejection preserves policy and emits safe local/calibrated estimates, context_window_tokens and usage provenance;
        never imply compaction ran or expose prompt/credentials.
    reason: Reuse capacity, runtime and adapter UT; existing D3 Cases cover transport and usage boundaries without duplicating
      UT as D1.
