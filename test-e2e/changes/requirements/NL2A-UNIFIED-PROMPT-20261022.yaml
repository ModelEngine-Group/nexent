    retired:
    - AGT-006
    - AGT-007
    - AGT-008
  traditional_ut:
    decision: strengthen
    behaviors:
    - Ordinary Agent models use prompt directly without legacy-specific rejection
      or conversion; tool and event schema validation remains unchanged
    - External JSON import consolidates responsibilities, constraints and examples,
      including historical spelling variants; conflicts fail without mutation
    - Marketplace detail and installation consume canonical snapshots without legacy
      conversion
    - Frontend file parsing normalizes before the wizard; removed generation cache
      cannot replace the saved Agent prompt
    - ORM and raw SQL read/write the physical prompt column directly; retired ORM
      constructor keys are rejected
    - Single-prompt UI focus has no retired tab state; ordinary fixtures use canonical
      fields; import/migration/negative regression examples retain legacy inputs
    - Removed generation route returns 404 without authentication/model work; NL2Agent
      canonical draft persistence and existing optimization routes remain functional
    reason: Strengthen existing bounded validation/import and frontend tests. Extend
      existing deployment Case for real PostgreSQL migration, rollback and idempotence;
      no duplicate D1 Case.
