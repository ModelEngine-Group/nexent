schema_version: '1.0'
change:
  change_id: NL2A-UNIFIED-PROMPT-20261022
  requirement_id: NL2A-UNIFIED-PROMPT-20261022
  change_type: requirement
  title: Expose the unified NL2Agent prompt contract
  description: Use prompt exclusively in internal APIs, tools, events, cache and marketplace
    snapshots. Migrate stored marketplace JSON once; retain legacy field consolidation
    only when importing external JSON files. Rename the physical duty_prompt column
    to prompt and remove ORM/raw-SQL aliases. At the user request, append all three
    prompt migration sections to v2.7.0_merged_migrations.sql in deployment order. Ordinary models have
    no prompt-specific legacy rejection validator. Remove stale split-prompt UI state,
    unused translations/types, fixtures and current documentation. Retire the unused /prompt/generate API and its standalone
    generation hook/cache/backend pipeline; NL2Agent is the only generation entry.
  feature_contract_changed: true
  affected_features:
    existing:
    - F-047
    - F-048
    - F-054
    - F-069
    - F-178
    - FAF-001
    - NL2AGENT-PROTOCOL
    added: []
    modified:
