    retired: []
  traditional_ut:
    decision: add
    behaviors:
    - Exact enum and numeric domain references restore the original schema while extra restrictions remain unchanged.
    - Fixed false, zero and null use saved key presence; inactive rules retain their independent constraints without defaults applied.
    - Missing, malformed, duplicate or inconsistent references and oversized/non-JSON data fail without changing declarations or exposing values.
    reason: Existing rule tests validate effective policies, not storage reference syntax or lossless reconstruction. Pure codec proof stays in UT; no duplicate D1 is needed.
    test_selectors: [test/sdk/core/model_service/test_outlet_rules.py]
  no_case_change_reason: Database and runtime are not connected by this codec. Full-row and database transaction verification remain required separately; historical formal Cases are preserved.
  notes: Reference syntax was documented before implementation. The change is not a complete outlet storage or migration acceptance claim.
