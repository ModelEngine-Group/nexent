  title: Restore saved parameter rules without duplicated domains
  description: Replace exact duplicate schema domains and saved fixed values with strict same-row references.
  affected_features:
    existing: [SDK-MODEL-OUTLET-STORAGE]
    added: []
    modified: [SDK-MODEL-OUTLET-STORAGE]
    retired: []
  affected_cases:
    existing: []
    added: []
