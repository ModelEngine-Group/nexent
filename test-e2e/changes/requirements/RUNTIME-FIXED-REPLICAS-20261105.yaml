  notes: 已接入停机批次、维护 Job、固定副本数和共享存储预检；Agent、Workbench、自动任务、北向、持久化评测、NL2Agent 和 NL2Skill 已接入预约。停止和共享回放已验证组件行为；Agent/Workbench 和北向支持显式游标，Web 恢复固定原 assistant 分支。Feature 保持 planned，Case 保持 blocked；尚无真实 Kubernetes 部署、跨节点共享、指定 Pod 或稳定代理的正式验收证据。
    test/deploy 下的命令回归覆盖动态/已有 hostPath 卷、默认/显式 Filesystem 放行、已有裸块卷不暂停、动态卷预检失败不写入或激活。跨节点共享仍由 RUNTIME-SHARED-STORAGE-D3-001 验证真实读写。
    默认责任 runtime；停机部署、共享存储、HPA Case 归 deployment，调度 Case 归 task。未增加 D1；D4 无新增用户流程。
