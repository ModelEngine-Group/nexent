  traditional_ut:
    decision: strengthen
    behaviors:
    - 普通 Kubernetes Pod 启动不全局恢复；维护前提、幂等、批次校验与失败保持停止。
    - 未终态旧 bootstrap/维护 Job 或 Pod 阻止新批次；同步官方 Skill 前和放行 bootstrap SQL 前验证部署锁。
    - 即使暂时没有 Pod，也不将未确认的缩零配置或仍报告副本的 Deployment 视为全停；维护 Job 独立核验 Runtime 状态。
    - 全停维护失败时调度运行和租约随其他 PostgreSQL 遗留状态回滚；同批次成功才提交，单 Runtime 启动行为不变。
    - 维护回收遗留 streaming 消息时，Redis 终态写入绑定该消息，不覆盖同会话已完成的后续执行。
    - 同会话预约、租户/Agent 全局配额、稳定锁键和锁序、真实收尾后释放、依赖故障及准备/提交失败补偿。
    - 北向用户消息在 Runtime 接纳后由 control-io 写入；拒绝不追加消息，取消时保留预约直到写入退出，A2A 请求保持原转发行为。
    - 评测由已启动的 worker 原子认领 PENDING 和持久化预约；失败回滚、真实收尾才释放，普通清理不处理仍由 Runtime 持有的工作。
    - NL2Agent/NL2Skill 在写消息、重置流和构建执行器前取得会话预约；Redis 使用预约代次，取消等待在途写入和真实 worker 收尾；NL2Skill 的容量不足与排队超时保留 429 响应体并提供 Retry-After。
    - NL2Agent 接纳后的真实执行可通过 MCP 的 Gateway 委托校验；MCP 绑定已发布的 Gateway 服务地址和共享签名配置，不降级为非委托鉴权。
    - Redis 轮次、可重放 SSE 游标、Unicode 文本后缀、丢帧和尾部读取、截断回退、未授权控制和断开订阅不取消执行。
    - 固定 Runtime 副本数边界、暂停时为零、共享存储预检、失败不激活与停机回退。
    - 支持满足绑定、RWX 和文件系统条件的 hostPath 卷用于单节点部署，继续拒绝 spec.local。
    - 多调度器启动不误恢复、租约与失租、忙碌/misfire；工作区路径/归属及非 Run 保留。
    - 调度执行接纳与收尾使用 PostgreSQL 时钟核对租约，过期 owner 在新实例领取前后均不能提交结果。
    - 调度续租与错过周期写入在获得任务行锁后使用 PostgreSQL 实时时钟；等待行锁期间过期时不得写入。
    - 重领按任务、身份和准确触发时间查找已原子提交的自动化 prompt；已开始的周期跳过，未开始及下一周期仍可执行，查找失败不执行。
    reason: 维护和协调器 UT 覆盖启动隔离、锁序、失败和容量边界；不替代实际跨进程业务接纳和分布式流的正式证明。
