  title: Runtime 第一阶段：固定多副本与停机手动扩缩容
  description: '仅 Kubernetes，每次手动扩缩容先全部业务停止，再配置固定 Runtime 副本；不实施动态伸缩或失联自动接管。本次仅设计，SPEC: nexent-doc/docs/Developing/runtime-replica-scaling/proposal.md。'
