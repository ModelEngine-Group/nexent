    behaviors:
    - Deploy prepare/apply resumes private snapshots and records import/cleanup separately from versioned SQL; host mode needs no database packages.
    - API-only null-email accounts remain passwordless; account/membership/group/key writes share a transaction.
    - Only committed local applies reclaim source DB/Auth/Kong; preview, failure and remote sources retain containers/data.
    - Password success/invalid/boundary and legacy hash compatibility.
    - JWT expiry/tamper/disabled/deleted account rejection and provider provisioning.
    - Migration dry-run/idempotence/conflict and no secret disclosure.
    reason: Existing Supabase-mocked UT must follow native storage; D2 proves HTTP
      and D5 proves PostgreSQL migration beyond isolated UT.
  notes: SPEC ../nexent-doc/docs/Developing/auth-local-account-migration. CAS/OAuth
    journeys remain policy-skipped; provider UT required. No generic session table.
