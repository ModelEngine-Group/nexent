schema_version: "1.0"
change:
  change_id: QUESTION-DIRECTORY-JUMP-20261102
  change_type: requirement
  requirement_id: QUESTION-DIRECTORY-JUMP-20261102
  title: 会话内问题目录跳转
  description:
    'List every user question asked during a single agent conversation in a
    directory popover ("问题目录") and jump the message viewport to the
    selected turn. The popover offers a keyword filter over the full question
    text (case-insensitive, resets when it closes). The entry renders as a
    floating chip when the surface has no persistent header (main newchat
    flow) and as a header icon button on surfaces that have one (workbench
    presentation, share mode, read-only conversation page). Jumping locates
    the message root via its data-message-id attribute, smooth-scrolls the
    viewport, and briefly highlights the target. Navigation stays available
    while a run streams and in read-only/share contexts. Hovering (or
    focusing) a directory row opens a preview card with the full question and
    an excerpt of its first assistant reply (capped at 400 chars, text-free
    assistant messages skipped, "no reply yet" placeholder); the row the
    viewport is currently scrolled to (last question above the viewport
    midline, rAF-throttled capture-phase scroll tracking) is highlighted and
    labelled as the current position.'
  affected_features:
    existing: []
    added: []
    modified: []
    retired: []
  affected_cases:
    existing: []
    added: []
    modified: []
    retired: []
  traditional_ut:
    decision: add
    test_selectors:
      - frontend/tests/component/questionDirectory.test.tsx
    behaviors:
      - collectQuestionDirectory extracts user messages in conversation order with
        1-based indices, uses the first non-empty text part (first line, truncated
        to 60 chars with ellipsis, full text preserved for the tooltip), falls
        back to the first attachment name for attachment-only turns, and skips
        assistant messages plus turns with neither text nor attachments.
      - scrollThreadToMessage locates the message root through its
        data-message-id attribute, smooth-scrolls it into view, flashes a
        highlight, and reports missing or empty targets as false.
      - QuestionDirectoryButton hides without questions, opens the directory
        popover from the trigger, lists each question with its jump affordance,
        invokes onJump with the target message id, closes the popover after an
        entry is clicked, filters entries by a case-insensitive keyword over the
        full question text (attachment turns included), shows an empty state
        for unmatched keywords, and resets the keyword when the popover closes.
      - collectQuestionDirectory attaches an excerpt of the first assistant
        reply that follows each question (text-free assistant messages do not
        consume the pending reply, the excerpt is capped at 400 chars with an
        ellipsis, and unanswered questions keep an empty excerpt).
      - useActiveQuestionId reports the last question whose message top sits
        above the viewport midline, recomputes rAF-throttled on scroll events
        (capture phase, inner scroll containers included), and resolves an
        empty question set to null.
      - QuestionDirectoryButton highlights the row matching activeMessageId
        (aria-current="location" plus a current-position label) and opens a
        hover/focus preview card showing the full question and its reply
        excerpt (or the no-reply placeholder); the card closes on mouse
        leave/blur and when the popover closes.
    reason: |-
      The feature is a frontend navigation layer over already-proven contracts:
      thread message state comes from the existing runtime subscription, the
      popover reuses the shared Radix-based popover component, and no new
      inter-component, service, or protocol boundary is introduced. Per the D1
      admission rules the targeted UT supplies the necessary component proof,
      so no formal Case is added.
  notes: |
    Core scope confirmed by the user (popover form, header entry point,
    attachment-name fallback, read-only support). The scroll-spy current
    position indicator and a Codex-style hover preview card (question plus
    assistant reply excerpt) were added in the same branch after comparing
    with Codex's conversation timeline; per-question answer status and a
    keyboard shortcut remain deferred.
