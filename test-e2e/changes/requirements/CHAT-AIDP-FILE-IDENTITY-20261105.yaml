schema_version: '1.0'
change:
  change_id: CHAT-AIDP-FILE-IDENTITY-20261105
  change_type: requirement
  requirement_id: AIDP-UI-08
  title: AIDP 聊天溯源原文件身份与北向 API Key 下载
  description: >-
    从 AIDP FusionSearch 每命中 metadata.file_uuid/metadata.kds_id 提取原文件定位，贯穿 SDK 命中转换、
    流来源、持久化、历史与页面来源卡；页面只在显式定位时通过登录态代理下载。仅北向运行的 AIDP 工具
    向模型结果增加 northbound_api_download_url，新增北向 GET 鉴权下载路由按当前 API Key 身份校验
    知识库 READ 和 AIDP KB 文件归属后转发当前最新原文件。普通页面运行不产生该字段，旧记录无定位不显示下载。
  affected_features:
    existing: [F-065]
    added: []
    modified: [F-065]
    retired: []
  affected_cases:
    existing: [UT-FE-AUTO-82166F602745F6D7]
    added: []
    modified: [UT-FE-AUTO-82166F602745F6D7]
    retired: []
  traditional_ut:
    decision: strengthen
    behaviors:
      - AIDP 命中只在 metadata.file_uuid 与 metadata.kds_id 同时存在时形成技术定位，逐命中保留且不从文件名、图片 URL 或 chunk id 推断。
      - 北向请求级标识只由内部入口沿 run/Agent/子智能体/ToolConfig 传递，普通页面默认关闭，不进入通用 tool_params 或进程全局状态。
      - SDK 工具只在北向实例的模型结果增加 northbound_api_download_url；页面来源数据与普通运行保持旧 schema。
      - 北向下载路由按 API Key 身份、目标知识库 READ 和 AIDP KB 文件归属校验，错误不泄露 AIDP 凭据；北向历史保持调用身份归属。
    reason: >-
      现有 AIDP 工具转换、工具配置、北向服务、AgentOS 工具物化与下载代理测试已拥有隔离契约。本变更在
      这些套件内补强身份、请求级标识与错误边界；不新增 E2E 用例家族，只修改受影响的既有 D1 前端用例。
      真实 AIDP/真实模型/浏览器场景不作为本 PR 的自动化通过条件。
    test_selectors:
      - test/ext_components/aidp/test_aidp_search_tool.py
      - test/backend/agents/test_create_agent_info.py
      - test/backend/services/test_northbound_service.py
      - test/backend/services/test_prepared_public_turn.py
      - test/backend/app/test_agentos_prepared_local_tool.py
      - test/backend/app/test_northbound_knowledge_app.py
  notes: >-
    按本机 E2E 规则删除新增的 AIDP-FILE-IDENTITY 用例家族，只保留既有引用 D1 的历史用例修改。
    真实 AIDP 是否已返回 metadata.file_uuid/metadata.kds_id、字段类型及当前版本下载字节仍需联调；
    Mock AIDP + 真实模型只能证明协议与界面行为，不能替代真实原字节验收。
