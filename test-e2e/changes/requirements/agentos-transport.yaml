schema_version: '1.0'
change:
  change_id: AOS-TRANSPORT-20261109
  change_type: requirement
  title: Introduce the AgentOS service transport
  description: Implement the first signed transport slice for existing Northbound
    and A2A run/stop calls.
  affected_features:
    existing:
    - GW-AUTH
    added:
    - AOS-TRANSPORT
    modified: []
    retired: []
  affected_cases:
    existing:
    - GW-AUTH-D3-001
    added:
    - AOS-TRANSPORT-D3-001
    modified: []
    retired: []
  feature_contract_changed: true
  traditional_ut:
    decision: strengthen
    behaviors:
    - Service credential binds the exact operation and payload and expires.
    - Streaming forwarding preserves headers and closes upstream resources.
    - Only typed legacy run/stop payloads dispatch.
    - Evaluation case requests preserve observer events and cannot select a real conversation.
    - Automation schedules run and inspect through AgentOS, and Runtime cancels an abandoned background request.
    - Prepared evaluation resolves an exact tenant model revision and constructs SDK objects inside Runtime.
    - Management sends a supported evaluation snapshot once and Runtime rebinds builtin file access to the signed actor.
    - Management compiles an authorized ordinary conversation snapshot with selected Agent version and stored metadata.
    - Prepared Agent.run writes raw observer events to a scoped journal for Agent.resume without loading Management.
    - Evaluations require a prepared snapshot. The signed legacy evaluation route rejects execution with HTTP 410.
    - Signed resume authorizes the conversation and replays a strict run-scoped cursor.
    - Ordinary conversation admission uses the signed AgentOS compatibility transport and preserves request and SSE context.
    - Prepared Runtime converts declared skill outputs to scoped object references before workspace cleanup.
    - Management supplies authorized historical context and commits accepted history checkpoints with the projection receipt.
    - Management resumes prepared observer events, rejects incomplete runs and commits terminal projections with the receipt.
    - Ordinary assistant projections replay by run ID and payload digest after committing their receipt in the same transaction.
    - Management claims a stable run ID for signed ordinary submissions and handles retry before contacting Runtime.
    - Signed inspect and stop enforce actor ownership and scope cancellation to the exact run journal.
    - Durable runtime state fences a stopped automation admission and preserves a committed assistant outcome after an expired Runtime lease.
    - Public and automation cancellation use only their captured run identity and keep user and tenant authorization.
    - Prepared evaluation preserves a static child callable and typed generation overrides, and rejects transport credential overrides.
    - Prepared evaluation rechecks external A2A relations and configuration revisions and keeps endpoint credentials out of the signed request.
    - Prepared MCP evaluation pins enabled versioned tools and tenant connections without serializing transport or tool credentials.
    - Prepared evaluations retain historical attachment placement, recheck object scope in Runtime and regenerate only requested download URLs.
    - Prepared evaluation rechecks versioned skill bindings, reads verified guide and configuration files, and refuses changed revisions.
    - Skill-derived MCP tools preserve parameter precedence, reject conflicting skill contributions, and bind the exact sources without transmitting credentials.
    - Prepared evaluations use the Runtime sandbox deployment policy and regenerate executor context while retaining existing event semantics.
    - The production evaluation compiler exports the required parallel executor for the root and each child; Runtime restores it without changing tool order.
    - Prepared knowledge search preserves authorized index and document scope, pins model revisions, and refuses revoked permission before accessing the vector store.
    - Prepared analysis passes model references and rechecks tenant scope, model revisions and S3 object access in Runtime.
    - Prepared local tools reconstruct the configured tenant and Agent version instance in Runtime without forwarding credentials.
    - Prepared skill-derived local tools pin active contributing skill bindings, preserve explicit precedence and refuse changed configuration.
    - Prepared independent AIDP tools use the stored provider scope and generate signed references accepted by the existing Management image proxy.
    - Prepared shared AIDP tools recheck tenant and group permissions before retrieving from configured knowledge bases.
    - Prepared LangChain tools pin their persisted binding and deployed plugin revision without transporting code.
    - Prepared workspace and SSH tools pin local configuration, and provider bodies are rebuilt from the signed Agent version without serializing the body.
    - Skill-derived independent AIDP signs the contributing binding for the image proxy, which rechecks that binding before downloading.
    - Runtime compatibility ingress requires a signed Gateway session, and compatibility inspect and stop use the Runtime registry with user and tenant ownership checks.
    - Northbound dispatches supported turns once, preserves public stream framing, falls back only before dispatch, and stops the scoped pending run.
    reason: Extend existing runtime proxy tests and verify authentication and neutral
      protocol boundaries.
