schema_version: '1.0'
change:
  change_id: AOS-TRANSPORT-20261109
  change_type: requirement
  title: Introduce the AgentOS service transport
  description: Implement the first signed transport slice for existing Northbound
    and A2A run/stop calls.
  affected_features:
    existing:
    - GW-AUTH
    added:
    - AOS-TRANSPORT
    modified: []
    retired: []
  affected_cases:
    existing:
    - GW-AUTH-D3-001
    added:
    - AOS-TRANSPORT-D3-001
    modified: []
    retired: []
  feature_contract_changed: true
  traditional_ut:
    decision: strengthen
    behaviors:
    - Service credential binds the exact operation and payload and expires.
    - Streaming forwarding preserves headers and closes upstream resources.
    - Only typed legacy run/stop payloads dispatch.
    - Evaluation case requests preserve observer events and cannot select a real conversation.
    - Automation schedules run and inspect through AgentOS, and Runtime cancels an abandoned background request.
    - Prepared evaluation resolves an exact tenant model revision and constructs SDK objects inside Runtime.
    - Management sends a supported evaluation snapshot once and Runtime rebinds builtin file access to the signed actor.
    - Signed resume authorizes the conversation and replays a strict run-scoped cursor.
    - Ordinary conversation admission uses the signed AgentOS compatibility transport and preserves request and SSE context.
    - Ordinary assistant projections replay by run ID and payload digest after committing their receipt in the same transaction.
    - Signed ordinary submissions bind a stable run ID to the actor, key and normalized request before execution.
    - Signed inspect and stop enforce actor ownership and scope cancellation to the exact run journal.
    - Durable runtime state fences a stopped automation admission and preserves a committed assistant outcome after an expired Runtime lease.
    - Public and automation cancellation use only their captured run identity and keep user and tenant authorization.
    - Prepared evaluation preserves a static child callable and typed generation overrides, and rejects transport credential overrides.
    - Prepared evaluation rechecks external A2A relations and configuration revisions and keeps endpoint credentials out of the signed request.
    - Prepared MCP evaluation pins enabled versioned tools and tenant connections without serializing transport or tool credentials.
    - Prepared evaluations retain historical attachment placement, recheck object scope in Runtime and regenerate only requested download URLs.
    - Prepared evaluation rechecks versioned skill bindings, reads verified guide and configuration files, and refuses changed revisions.
    reason: Extend existing runtime proxy tests and verify authentication and neutral
      protocol boundaries.
    test_selectors:
