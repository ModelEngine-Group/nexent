  notes: Primary ownership runtime. Existing blocked higher-boundary Cases remain
    required; query D2 will own self-contained HTTP/file fixtures with controlled
    PG authorization, no external providers. Preparation families empty because resources
    are private temporary files and managed worker lifecycle, released by fixtures.
    Real-model/shared-volume/enterprise-load acceptance requires its actual runtime
    surface.
    RETENTION-D5 now has a partial file-risk script and owned subprocess helper.
    It adds process-death and actual cross-process lock evidence beyond isolated
    cleanup UT, without duplicating a new D1. Formal scripts also cover isolated
    environment/factory configuration and real-file batch limits; only static
    checks and collection are performed for them. Traditional UT verifies the
    scheduled two-second deadline fix separately. Missing HTTP/PG and managed
    timer startup/wakeup assertions keep the Case blocked and without a complete
    execution binding.
    QUERY-D2 adds post-physical-read expiry, actual local cleanup and controlled
    membership-revocation variants, retaining the actual decoder and HTTP route.
    The final error must withhold the decoded body; only collection/static checks
    are performed while formal acceptance is deferred.
