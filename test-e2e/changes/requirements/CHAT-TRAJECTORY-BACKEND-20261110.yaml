  change_id: CHAT-TRAJECTORY-BACKEND-20261110
  change_type: requirement
  requirement_id: CHAT-TRAJECTORY-BACKEND-20261110
  title: 依据最新设计完善轨迹后端查询与清理
  description: 延续已实现OTLP存储和TTFT，实施可观测中心授权集合/全量统计、会话覆盖、静态节点快照与正文分块，以及管理员目录和主动清理。继续补齐实际模型物理请求、结构化输出、重试关联与安全部分输出；完整采集与风险验收依既有设计逐项核对。
