schema_version: '1.0'
change:
  change_id: AGENT-EVOLUTION-PHASE1
  change_type: requirement
  requirement_id: AGENT-EVOLUTION-PHASE1
  title: 智能体自演进一期
  description: 根据授权轨迹和业务评测反馈生成资源候选，同题评测、独立确认后按业务范围发布和回退。
  affected_features:
    existing: []
    added: [AGENT-EVOLUTION-REPLAY, AGENT-EVOLUTION-ONLINE]
    modified: [V5-PW-EVAL-RUN-01]
    retired: []
  affected_cases:
    existing: []
    added: [EVAL-CALIBRATION-D2-001, EVOLUTION-PAIR-REPORT-D1-001, EVOLUTION-ONLINE-SCOPE-D2-001, EVOLUTION-EXAMPLE-SOURCE-D2-001]
    modified: []
    retired: []
  traditional_ut:
    decision: add
    test_selectors:
    - test/backend/database/test_evolution_consent.py
    - test/backend/ops/test_evolution_review.py
    - test/backend/services/test_evolution_suggestion.py
    - test/backend/services/test_evolution_observation.py
    - test/backend/services/test_evolution_prompt_candidates.py
    - test/backend/services/test_evolution_skill_package.py
    - test/backend/services/test_evolution_skill_discovery.py
    - test/backend/services/test_evolution_tool_use.py
    - test/backend/services/test_evolution_tool_sets.py
    - test/backend/services/test_evolution_replay.py
    - test/backend/services/test_evolution_examples.py
    - test/backend/services/test_evolution_feedback_handoff.py
    - test/backend/app/test_agentos_prepared_skills.py
    - test/backend/gateway/test_exposure.py
    - test/sdk/core/tools/test_read_skill_md_tool.py
    - test/sdk/core/agents/test_replay_tool_bindings.py
    - frontend/tests/component/conversationEvolutionSwitch.test.tsx
    - frontend/tests/component/evolutionExperiments.test.tsx
    behaviors:
    - 会话授权按原始请求生效，重试沿用原授权。
    - 撤回或到期后重试不能沿用旧授权，缺证轮次与没有发现问题的轮次分别统计。
    - 只有人工原话中的明确改进意图可以登记；一次性交付和引用内容不能代替提交授权。
    - 判据缺证或裁判故障时不能把样本判为业务失败。
    - 提示词局部改写保留占位符及相近成功例，权限变化时丢弃生成结果。
    - P2 仅从有通过回执的业务开发题抽取批准原文，按目标行为、互补行为和来源去重，并隔离同源试题。
    - 不挂载组保留其他 Skill 及同一业务工具授权，目标正文不展示、不落入其运行目录。S2 报告按实际读取次数及三组可判题数区分证据。
    - S1 从实际漏选、误选和正确交付记录生成简介候选；可选同类 Skill、额外误读和维护权限变化均单独核对。
    - 工具专项在根工具入口比较调用次数、实参及完成先后；缺证单列，交付正确也能发现漏调或错参。
    reason: UT 覆盖授权和计分边界，D2 另测带身份的校准请求、持久化判据及返回契约。
  notes: 对应 management-agent-self-evolution 的 proposal、design 和 task。随开发增量登记其余 AC 的证明边界。
