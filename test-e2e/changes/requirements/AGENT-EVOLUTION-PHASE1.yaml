    behaviors:
    - MCP 构建候选核对新旧实参、初态和业务终态。按智能体发布版本装载构建，拒绝普通会话改写绑定，试评与独立确认分别使用隔离服务。
    - 本人查询建议可区分目标题改善、保护题失败、缺少对照及独立确认暂缓；其他题的改善不能覆盖该建议的目标题失败。
    - 模型生成预占次数和时间，超额时不访问模型。迟到回复不能存为候选。启用用量限额后，每次向供应商发请求前预留 token 和费用，收到有效供应商回执后按实际用量结算。
    - 开发重放和模型裁判共享实验模型额度，用量按回执结算。超额、撤销或过期的任务不能继续申请调用。
    - 开发实验在启动前计入所有对照组、固定回归及追问。总时限包括排队，预算不足不提交，到期停派，迟到不能计分。
    - 会话授权按原始请求生效，重试沿用原授权。
    - 撤回或到期后重试不能沿用旧授权，缺证轮次与没有发现问题的轮次分别统计。
    - 只有人工原话中的明确改进意图可以登记；一次性交付和引用内容不能代替提交授权。
    - 判据缺证或裁判故障时不能把样本判为业务失败。
    - 评分取根智能体确认的答案；排除子任务和撤销的输出，流式正文转为最终回答时保留全文。
    - 提示词局部改写保留占位符及相近成功例，权限变化时丢弃生成结果。
    - S3 从多个独立成功开发题提取共用步骤，获指定且有创建权的人可生成隔离包。并发拦截和重复请求均不重复生成。用未见材料核对真实读取和正确跳过，原版本身的交付按业务标准评分。
    - P2 仅从有通过回执的业务开发题抽取批准原文，按目标行为、互补行为和来源去重，并隔离同源试题。
    - 不挂载组保留其他 Skill 及同一业务工具授权，目标正文不展示、不落入其运行目录。S2 报告按实际读取次数及三组可判题数区分证据。
    - S1 从实际漏选、误选和正确交付记录生成简介候选；可选同类 Skill、额外误读和维护权限变化均单独核对。
    - 工具专项在根工具入口比较调用次数、实参及完成先后；缺证单列，交付正确也能发现漏调或错参。
    - 候选对比自动带上租户与智能体的固定回归题；移出题集不改变已冻结的实验，同源材料不能交给生成器。
    - 组合引用两个有有效回执的单项实验；原版、A、B 和 A+B 同题运行，缺少任一组不得计为四组均有效。
    - 授权轨迹产生单轮题草稿。出题者确认必要附件和独立预期，系统区分原任务和后续纠正，同源任务不能跨分区。
    - 多轮按用户请求顺序重放，各组只承接自己的回答，附件按轮开放；核对各轮回执，按整题检查工具调用、Skill 使用和交付结果。
    - 读写文本文件的任务按组重置真实文件工具的独立目录，每轮读取实际内容，另核对受保护文件的写入。
    - 实验开始前冻结目标题和主指标。回执与冻结版本相符、目标达标且所有保护题与固定回归通过，才能提交独立确认。禁止写入单列原因。
    - 独立评测人在私有目录核验材料，只登记题目与来源摘要。业务开发题和独立题按租户、智能体互斥，版本变化、并发登记和迁移前的业务题均需核对。
    - 编辑者提交通过筛选的候选。独立评测人锁定题集与门槛，同源任务只用于这一轮确认。资源或判据漂移不能复用开发结果。
    - 独立执行按题配对，核对回执、有效覆盖和预设门槛。开发侧可查看进度和汇总，不能取回独立题。撤权阻止写入，重试复用已完成的结论。
    - 新会话采用当前发布版本；已有会话按实际版本续跑。提交时重新核对，竞争导致的旧编译不能启动。
    - 发布人授权、候选摘要和业务基线版本分别校验；旧版无法读取则暂停新会话，恢复后可重试回退。
    - S3 晋升只将确认过的指南绑定到目标智能体新版本，之后发布可继承。回退及旧会话按实际版本取包。
    - T3 仅移除独立确认中的工具。下一版继承已生效的工具选择，其他智能体、草稿及旧会话仍按原清单运行。
    reason: UT 覆盖授权和计分边界，D2 另测带身份的校准请求、持久化判据及返回契约。
  notes: 对应 management-agent-self-evolution 的 proposal、design 和 task。随开发增量登记其余 AC 的证明边界。
