schema_version: "1.0"
change:
  change_id: BRANCH-NUMBERED-TITLES-20261106
  change_type: requirement
  requirement_id: BRANCH-NUMBERED-TITLES-20261106
  title: Use numbered titles for branched conversations
  description: >-
    Replace the legacy Chinese branch suffix with a space and ASCII number,
    beginning at (2), as requested in the screenshot. Skip titles already used
    by the current user's active conversations; branches of numbered branches
    increment the trailing number without stacking suffixes. Strip the legacy
    branch marker when creating a new branch, without renaming historical rows.
    Keep the 100-character title limit including the numeric suffix. Perform
    title allocation inside the existing user-locked branch transaction.
  affected_features:
    existing: []
    added: []
    modified: []
    retired: []
  affected_cases:
    existing: []
    added: []
    modified: []
    retired: []
  traditional_ut:
    decision: strengthen
    test_selectors:
      - test/backend/database/test_branch_titles.py
      - test/backend/database/test_conversation_branch_db.py
    behaviors:
      - Format normal, Unicode, empty and legacy source titles with numeric suffixes.
      - Increment numbered branches and skip occupied titles without stacking suffixes.
      - Truncate titles including digit-width boundaries while preserving the number.
      - Query only active titles owned by the source user inside the existing quota lock.
      - Preserve branch copying, ownership checks and invalid-turn rejection.
    reason: >-
      Title formatting and repository query wiring are isolated unit contracts.
      Strengthen existing branch UT and add focused title-helper UT rather than
      duplicate them in formal D1. No route, payload, schema or frontend change.
      Live database concurrency and browser acceptance are not claimed by UT.
  notes: >-
    Baseline BRANCH-CONVERSATION-TO-NEW-CHAT-20261102. The sibling nexent-doc
    repository is unavailable; external SPEC synchronization remains pending.
    Preserve existing uncommitted frontend changes. Existing data is not renamed.
    The user advisory lock serializes branch allocations for one owner; this is
    not a global uniqueness guarantee against unrelated manual title renames.
