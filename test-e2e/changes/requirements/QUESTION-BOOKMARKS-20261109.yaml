schema_version: "1.0"
change:
  change_id: QUESTION-BOOKMARKS-20261109
  change_type: requirement
  requirement_id: QUESTION-BOOKMARKS-20261109
  title: Account-persisted question bookmarks
  description: >-
    Add a bookmark toggle to the upper-right of each question preview. Save
    explicit desired state by conversation and user-message identity on the
    server. Restore it after reopening or changing browsers. Mark bookmarked
    ticks independently of the current-reading dot. Support pointer entry into
    the preview, immediate switching between adjacent ticks, keyboard focus and
    Escape. Do not reopen the removed full directory, change model inputs, copy
    bookmarks to branches or change conversation activity. Shared read-only
    conversations cannot mutate bookmarks. Loading or failed reads cannot be
    mistaken for a known unmarked state; failed writes retain previous state.
  affected_features:
    existing: []
    added: []
    modified: []
    retired: []
  affected_cases:
    existing: []
    added: []
    modified: []
    retired: []
  traditional_ut:
    decision: add
    test_selectors:
      - frontend/tests/component/questionDirectory.test.tsx
      - frontend/tests/component/questionBookmarks.test.tsx
      - test/backend/services/test_question_bookmarks.py
    behaviors:
      - Persist and remove bookmark state with owner and user-message scope.
      - Reject invalid identity, identifiers, non-user messages and foreign conversations.
      - Preserve activity timestamps and isolate query caches by account and conversation.
      - Keep interactive preview open during pointer transfer and switch adjacent questions.
      - Restore bookmarks, expose failures and prevent duplicate pending writes.
    reason: >-
      Existing questionDirectory component UT only proves display/navigation;
      existing pin tests concern whole Workbench conversations. Strengthen rail
      UT and add isolated API/service/database and hook tests. No duplicate D1.
      Cross-browser API persistence, migration rollout and browser pointer/layout
      acceptance require a deployed application; these remain unverified until
      runtime prerequisites are available. Existing formal Cases are preserved.
  notes: >-
    Baseline is the current question rail after REMOVE-QUESTION-DIRECTORY-POPOVER-20261109.
    The user explicitly requests account persistence. Use one boolean column on
    owner-private conversation user messages, false by default, with a new additive
    migration. API ownership comes from authenticated user identity, never the body.
    External SPEC/UI repositories are absent; synchronization is pending. No
    deployment, production mutation or remote push is included.
