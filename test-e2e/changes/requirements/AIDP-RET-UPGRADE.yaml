    "notes": "Real provider and browser evidence remain required and blocked until prerequisites are established. No new D1 quota; retain all historical D1. Local design/tasks are outside the product repository. Review follow-up: validation runs only at save/import/test/request input boundaries. Persisted policies are trusted; SDK construction only resolves defaults and documented legacy names. Official v2.4.0-v2.7.0 sources confirm hybrid_search and absent advanced fields; no arbitrary malformed database types are assumed. Protocol fixture prepares external input once before constructing the two wrappers; no real provider or browser execution is claimed. User-approved review follow-up: unify retrieval errors instead of preserving wrapper-specific error text; missing result becomes an error for both wrappers, empty result remains valid. Retry warning logs include status/count/delay; final failures are logged once at the shared boundary. SDK parameter metadata now has explicit Chinese descriptions; specialized frontend form translations remain their own source. 2026-10-20 approved backend review fixes: consolidate the two scope validators into prepare_retrieval_request; external upload preparation is separate from trusted repository snapshot transfer. Internal writes and mounting no longer revalidate policy or carry skip flags. Revert tool_db/create_agent_info PR changes; preserve sparse storage and historical tool-test exception classification. Add backend draft/published-version, unchanged-input and raw-override inheritance regressions; reuse existing D2 protocol Case without new Cases. Second backend review pass removes query-reuse plumbing from run.py and keeps explicit root/version context; unchanged-policy selection is shared by external conversation save and run entry, and tool override preparation reuses existing lookup. Newly added ordinary imports are module-level. Frontend is deferred by the user. Traditional UT and formal evidence remain separately reported."
