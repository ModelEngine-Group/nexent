    The user confirmed the directory does not exist and authorized continuing this UI change.
    Follow-up visual requirement: the close X uses the same 24px icon and button dimensions
    as neighboring header actions, overriding the shared 14px close-icon default locally.
    Do not invent a SPEC root inside the product repository.
