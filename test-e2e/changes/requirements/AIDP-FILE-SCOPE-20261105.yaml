    "title": "Conversation AIDP file-scoped retrieval",
    "description": "Implement AIDP-UI-07 as a conversation-level retrieval scope in the existing right drawer. The drawer exposes mutually exclusive 'by knowledge base' and 'by files' modes; file mode shows collapsible KB groups, loads only the first KB page on entry, fetches other KBs on expansion, and paginates each KB independently. File-name search covers all KBs with backend keyword queries, at most three concurrent requests and the first 20 matches per KB; matched KBs auto-expand without progress or failure messaging. The mode derives kds_ids from selected files and replaces KB tags with file tags, without an extra banner. The previous @-based knowledge-file entry is removed for this iteration; Skill @, attachments, send and history are preserved. Filename filtering uses metadata_condition.original_file_name, graph-enabled file scope fails closed, and real AIDP recall/topK acceptance remains blocked.",
