    "requirement_id": "AIDP-FILE-SCOPE-REQ-001",
    "title": "Conversation AIDP advanced metadata filtering",
    "description": "Implement AIDP-UI-07 as a conversation-level retrieval scope in the existing right drawer. The knowledge-base picker keeps its existing search, tag filter and pagination. A new advanced-filter switch reveals one or more file-name conditions (operator + keyword per row) with an all/any match policy; saving persists it in knowledge_scope schema v3 as aidp.metadata_filter. The tool projects each row as a FusionSearch metadata_condition on original_file_name (contains / is / start with / end with), applies it before recall, keeps the Agent retrieval configuration unchanged, and is hidden and ignored for graph-enabled retrieval (the request still runs without metadata_condition) and fails closed only when the condition cannot be expressed. The retired file-list mode, file tags and v2 file_scope are not exposed; Skill @, attachments, send and history are preserved. Real AIDP filtered recall acceptance remains blocked.",
