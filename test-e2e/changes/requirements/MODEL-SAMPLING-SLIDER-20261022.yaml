schema_version: '1.0'
change:
  change_id: MODEL-SAMPLING-SLIDER-20261022
  change_type: requirement
  requirement_id: MODEL-SAMPLING-SLIDER-REQ-001
  title: Share Agent sampling controls with model advanced configuration
  description: Replace model temperature and Top P number fields with the existing Agent slider and numeric stepper while preserving optional values and payload shape.
  affected_features:
    existing: []
    added: []
    modified: [F-037]
    retired: []
  affected_cases:
    existing: []
    added: []
    modified: []
    retired: []
  traditional_ut:
    decision: add
    test_selectors:
      - frontend/tests/component/modelSamplingControls.test.tsx
    behaviors:
      - Rendering does not emit defaults; numeric input, stepping and slider interaction update the same optional sampling value.
      - Temperature and Top P respect their separate ranges; explicit zero and clearing preserve payload semantics.
      - Non-LLM fields remain type-gated and disabled controls cannot change values.
    reason: Existing frontend UT and UT-FE-001 do not assert this sampling control contract. Focused component UT supplies the missing interaction and state evidence; no duplicate formal D1 is added. Existing formal Cases are preserved. API, runtime, provider and deployment boundaries do not change.
  notes: Design at ../nexent-doc/docs/Developing/model-sampling-slider. Current acceptance is the local controlled-component contract; historical UT-FE-001 remains unchanged and is not claimed as current acceptance evidence. Focused sampling and localization frontend UT passed (13 tests); TypeScript, copyright checks and design/implementation formal asset validation passed. Targeted ESLint completed with zero errors and one pre-existing unused-variable warning. Follow-up live-browser inspection confirmed sliders in freshly loaded model editing and single-add advanced settings without saving business data. The original tab retained old client code. Formal Case execution is not claimed.
