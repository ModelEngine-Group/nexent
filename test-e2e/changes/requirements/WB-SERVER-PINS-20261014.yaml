schema_version: '1.0'
change:
  change_id: WB-SERVER-PINS-20261014
  change_type: requirement
  requirement_id: WB-SERVER-PINS-20261014
  title: Persist Workbench pins on the backend across devices
  description: Replace browser-only Workbench pin state with authenticated user/tenant
    backend persistence, strict newest-first order and retained history behavior.
  affected_features:
    existing: []
    added: []
    modified:
    - CHAT-SIDEBAR
    retired: []
  affected_cases:
    existing: []
    added:
    - CHAT-SIDEBAR-D3-001
    modified:
    - CHAT-SIDEBAR-D4-001
    retired: []
  traditional_ut:
    decision: add
    behaviors:
    - Identity, validation, scope and database error boundaries
    - Backend canonical order, idempotency and repinning
    - Frontend server loading/save failures, identity isolation and unchanged Agent-chat
      provider
    - Pinned history paging and no browser-storage authority
    reason: Existing local-storage tests cannot prove server persistence or authorization.
      Add focused backend and frontend UT; strengthen browser journey; real PostgreSQL
      integration separately proves durable state.
    test_selectors:
    - test/backend/services/test_workbench_pin_service.py
    - test/backend/apps/test_workbench_pins_app.py
    - frontend/tests/workbench/ThreadPins.test.tsx
    - frontend/tests/workbench/ServerThreadPins.test.tsx
    - frontend/tests/workbench/WorkbenchThreadAdapter.test.ts
  notes: 'Existing SPEC chat-workbench-resource-controls AC-05. No new D1: existing
    unit proof is retained; D3 adds actual database/HTTP integration and D4 adds separate
    browser contexts. New additive migration; no historical SQL modification.'
