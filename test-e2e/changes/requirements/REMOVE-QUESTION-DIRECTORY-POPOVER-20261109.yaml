schema_version: "1.0"
change:
  change_id: REMOVE-QUESTION-DIRECTORY-POPOVER-20261109
  change_type: requirement
  requirement_id: REMOVE-QUESTION-DIRECTORY-POPOVER-20261109
  title: Remove the expanded history-question directory entry
  description: >-
    Remove the list icon shown in the user's screenshot and its searchable
    question-directory popover. Keep the left-side question ticks, hover/focus
    previews, active reading-position marker and click navigation. Do not delete
    conversation records or change sidebar history, model input or persistence.
    Remove the now-unused popover component and its superseded UT; retain the
    rail and question collection/navigation regressions.
  affected_features:
    existing: []
    added: []
    modified: []
    retired: []
  affected_cases:
    existing: []
    added: []
    modified: []
    retired: []
  traditional_ut:
    decision: strengthen
    test_selectors:
      - frontend/tests/component/questionDirectory.test.tsx
    behaviors:
      - Render only question ticks, without the full-directory trigger or search popover.
      - Retain tick jumping, keyboard-focus previews, hover switching and active-position scrolling.
      - Retain question collection, answer excerpts and missing-message behavior.
    reason: >-
      This bounded frontend removal replaces obsolete popover UT with an absence
      regression and retains utility/rail coverage. Python UT is unrelated; no
      backend or external protocol changes and no duplicate formal D1 is needed.
  notes: >-
    Supersedes the full-directory secondary-entry requirement in
    QUESTION-DIRECTORY-RAIL-20261105 and the popover UI in
    QUESTION-DIRECTORY-JUMP-20261102. Existing formal Cases are preserved.
    The screenshot scopes this removal to the list icon/popover; rail navigation
    remains. External SPEC synchronization is unavailable because sibling
    nexent-doc is absent. No deployment or automatic push is performed.
