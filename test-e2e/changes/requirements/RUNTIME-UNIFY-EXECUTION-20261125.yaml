  description: '固定副本在无在途业务的窗口停启，不依赖维护批次。普通会话与 Creator 共用 agent_execution_t。SPEC: nexent-doc/docs/Developing/runtime-replica-scaling/changes/runtime-unify-agent-execution/proposal.md。'
