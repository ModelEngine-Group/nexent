  traditional_ut:
    decision: strengthen
    behaviors:
    - 持久会话准入使用统一执行行，Creator 当前运行及历史回放分别验证运行 ID 与绑定关系。
    - 会话配额与停机数据库批次解耦，旧所有者晚到的更新不能覆盖现有执行。
    - 固定副本启动隔离其他进程的状态，异常全停恢复才处理遗留执行。
    - 副本调整等待旧业务 Pod 退出，保留初始化成功和部署锁作为激活条件。
    reason: UT 覆盖单服务逻辑、SQL 写入与部署分支。正式用例覆盖真实跨进程竞争、日志关联和 Kubernetes 停启顺序。
