  notes: Implemented OPS permissions with supporting role-array refactor, fixed invitation
    grants, atomic local registration and administrator invariants. AUTH-LOCAL-D2-001
    fixture setup now uses authoritative arrays; its original identity/API-key assertions
    remain. API-027 is retained. OAuth/CAS journeys remain skipped_by_policy; their
    unchanged mapping policies are covered by UT. Operations business CRUD is not
    implemented. Roles are now authoritative on user_account_t.user_roles with computed scalar responses and a read-only
    membership projection; writes lock both account and membership rows. Existing
    account-profile UT and D3 registration assertions cover this ownership. The completed one-time migration Case and script were deleted at the
    user's request; local execution evidence remains available and migration acceptance
    does not add a maintained operations migration Case. Existing AUTH-LOCAL-D5-001 is strengthened only for its account-import and deployment responsibilities, including user_roles and scalar-column removal.
    Coverage backfill adds isolated assertions for locked invitation updates and redemption, registration rollback,
    user endpoint error mapping, and the inventory query projection and pagination. Existing D2 and D3 retain
    live tenant authorization and registration concurrency proof. D2 and D4 also exercise
    shared resource tabs, scoped lists and details, and the absence of write controls.
