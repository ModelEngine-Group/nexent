change:
  change_id: AUTH-MULTI-ROLE-20261031
  change_type: requirement
  requirement_id: AUTH-MULTI-ROLE-20261031
  title: 新增运维管理员权限（含多角色支持重构）
  description: Scope is role arrays, union authorization, administrator assignments,
    invitation grants and UI access only.
  affected_features:
    existing:
    - AUTH-LOCAL
    added:
    - AUTH-MULTI-ROLE
    modified:
    - AUTH-LOCAL
    retired: []
  affected_cases:
    existing:
    - API-027
    added:
    - AUTH-MULTI-ROLE-D2-001
    - AUTH-MULTI-ROLE-D2-002
    - AUTH-MULTI-ROLE-D2-003
    - AUTH-MULTI-ROLE-D3-001
    - AUTH-MULTI-ROLE-D4-001
    - AUTH-MULTI-ROLE-D5-001
    modified:
    - AUTH-LOCAL-D2-001
    - AUTH-LOCAL-D5-001
    retired: []
  traditional_ut:
    decision: strengthen
    behaviors:
    - Normalize nonempty role arrays and reject unknown or incompatible identities;
      preserve single-role external mappings.
    - Union action-specific permissions and scopes while preserving tenant/private/special-resource
      constraints.
    - Grant and revoke ADMIN DEV USER OPS using current actor/target scope; prevent
      self and last ADMIN removal.
    - Keep invitation roles immutable and issuer-independent after creation; preserve
      group defaults and atomic registration failures.
    - Replace the complete array without role versions and reject old single-role
      writes that would truncate a multi-role target.
    - Store account roles only in user_roles; compute legacy scalar responses and
      preserve account import, schema replay and role_permission_t.user_role.
    - Reject retired SPEED inputs and remove missing-credential/implicit-admin fallbacks;
      migration prechecks protect active SPEED-only subjects and ASSET_OWNER remains
      unchanged.
    - Reuse the resource page for OPS with tenant-scoped reads, hidden write controls,
      redacted credentials and diagnostics that do not persist resource changes.
    reason: Existing RBAC and DAC UT prove single-role cases; user UT covers own-tenant
      ADMIN and cross-tenant/SU rejection; invitation UT has old admin-invite restriction
      that must change. Strengthen those units rather than duplicate them as formal
      D1; actual transaction and HTTP boundaries require D2/D3/D5.
    test_selectors:
