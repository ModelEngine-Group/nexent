  traditional_ut:
    decision: add
    test_selectors:
    - test/backend/services/test_casdoor_feature_policy.py
    - frontend/tests/component/casdoorSkillPermissions.test.tsx
    behaviors:
    - Only the configured organization and model, enabled approved permissions and recognized actions can grant access.
