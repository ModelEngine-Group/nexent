    behaviors:
    - Validate exactly nineteen typed positive integer, finite positive number and boolean settings without environment fallback.
    - Detect missing, duplicate and invalid stored rows; merge and persist changed keys in one locked transaction.
    - Keep getters network-free, coalesce notifications, serialize refresh, retain the last valid snapshot and close owned resources.
    - Bound configuration driver connection, SQL statement and lock waits; timeout failures retain the last valid snapshot and permit subsequent retries.
    - Own an OPS ThreadManager in lifespan and route configuration database/Redis I/O through one bounded control-io entry.
    - Enforce explicit operations read/update authorization for OPS and SU plus safe 400/401/403/422/503 API responses, including unavailable recommendations.
    - Preserve drafts across filtering, background queries, notification-degraded saves and edits made during a save.
    reason: New catalog, transaction, refresh, API and draft behavior require isolated success, boundary and error proof; D2/D3/D4 prove their distinct runtime boundaries.
  notes: >-
    Existing OPS-BOOTSTRAP D1/D5 remain active with their original Case IDs. Their contracts are strengthened only for the
    newly required lazy configuration dependencies, configuration secrets and routes while preserving health and isolation.
    No new D1 is added: isolated catalog and refresh behavior belongs to traditional UT, while D2 proves the HTTP contract,
    D3 proves real PostgreSQL/Redis consumer behavior and D4 proves the browser journey. Recommendation resource rules are
    out of scope because the current catalog has no reliable rule; only the explicit unavailable response is covered.
    The D3 runtime probe also constructs ParallelExecutorTool from a fractional database timeout, proving the complete
    snapshot-to-SDK construction path. The direct fixed-script run uses an isolated database and Redis with owned cleanup.
