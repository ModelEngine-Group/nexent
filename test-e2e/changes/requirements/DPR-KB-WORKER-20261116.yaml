schema_version: '1.0'
change:
  change_id: DPR-KB-WORKER-20261116
  change_type: requirement
  requirement_id: DPR-002
  title: Compose a Runtime upload attempt through real scoped storage and Model.invoke
  description: >-
    A Runtime worker verifies its durable payload, obtains fresh signed Management grants, begins
    the fenced attempt and executes pinned artifact chunking and ModelService invocation into VectorStore.
    Only confirmed current writes publish visibility. Cancellation closes future writes; partial and
    unknown outcomes retain their actual status without automatic replay or provider fallback.
  affected_features:
    existing: [DPR-KNOWLEDGE]
    added: []
    modified: [DPR-KNOWLEDGE]
    retired: []
  affected_cases:
    existing: [SI-VECTOR-D3-001, DPR-KB-HTTP-D3-001, DPR-KB-D3-001]
    added: [DPR-KB-WORKER-D3-001]
    modified: []
    retired: []
  traditional_ut:
    decision: strengthen
    behaviors:
    - Bind exact source/artifact reads and tenant-qualified explicit vector schemas.
    - Resolve registered embedding dimensions without probing a provider.
    - Publish only confirmed current attempts and skip completed duplicates.
    - Prevent delayed writes or completion after cancellation, preserve unknown writes and stop on grant change or deletion.
    reason: >-
      Reuse existing job, model and ingestion UT. Add owned worker and write-gate regressions;
      actual PG/MinIO/ES and signed grant D3 proves cross-component protocols. No duplicate D1.
    test_selectors:
    - test/backend/services/test_knowledge_worker.py
    - test/backend/services/test_knowledge_ingestion_writes.py
    - test/backend/services/test_model_embedding_dimensions.py
    - test/backend/infrastructure/test_knowledge_execution_ports.py
  notes: >-
    Model adapters and parser output remain controlled. Physical indexes use a new fixed namespace
    and leave legacy data intact; final historical migration, queue/lifespan, images and real models remain pending.
