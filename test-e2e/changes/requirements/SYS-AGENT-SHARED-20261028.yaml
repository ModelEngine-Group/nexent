    behaviors:
    - NL2Agent configuration history controls count/list only owned conversations for the current target and public executor, resume the saved ID, and start fresh local turns without duplicate persistence.
    - Ordered SQL owns both creator identities on fresh install and upgrade; Python initializes/releases only Workbench and history migration requires seeded public IDs.
    - Standalone creator history leaves workbench_config null and restores identity/target without changing configuration or duplicating history lists.
    - Three shared identities and one creator history path use executor agent_id plus typed target, preserving retry/owner isolation and frontend restore.
    - Workbench admission is tenant scoped at the configured default 50, shared across users/versions; token cleanup and native Agent limits remain unchanged.
    - Read-only shared runtime lookups and current Workbench pointer, including rollback.
    - NL2Agent prompt/tools load from code with identity-only persistence and isolated
      tenant runtime.
    - Ordered SQL initializes creators and migrates histories; Workbench-only Python initialization/publication and one-shot legacy merge preserve histories
      and versioned bindings.
    - Tenant creation/startup/bootstrap never provision system Agents.
    reason: Existing UT covers isolated lifecycle and history contracts; strengthen
      changed ownership assertions and add request isolation/backfill protection.
      SYS-AGENT-D5-001 separately proves real PostgreSQL concurrency and rollback.
  notes: SPEC docs/Developing/chat-shared-system-agents. No new D1 quota; D5 tests
    real database release behavior and does not claim live-model/browser acceptance.
