    existing: []
    added: []
    modified: [AGENT-LIST-VIEWS]
    retired: []
  affected_cases:
    existing: []
    added: []
    modified: [AGENT-LIST-D1-001, AGENT-LIST-D1-002, AGENT-LIST-D4-002]
    retired: []
  traditional_ut:
    decision: strengthen
    test_selectors:
      - frontend/tests/component/agentListCard.test.tsx
      - frontend/tests/component/myAgentMainBadge.test.tsx
      - frontend/tests/component/mineApplyListingModal.test.tsx
    behaviors:
      - Card configuration and version-menu callbacks remain connected without publication shortcuts.
      - Repository cards omit listing and evaluation entries while retaining review and usage-guide actions.
      - The existing application dialog retains tag validation, icon upload and prefill coverage.
    reason: Frontend entry relocation reuses existing API and mutation contracts. At the user's request, the dedicated listing-action test file was removed; its eligibility, evaluation-navigation and submission-outcome assertions are no longer retained as component UT. Existing component suites and formal regressions remain. Python and deployment behavior do not change.
  notes: Design and execution evidence maintained in ../nexent-doc/docs/Developing/dev-agent-listing-evaluation/task.md. D4 retains its existing synthetic routes and self-contained preparation with no real business assets.
