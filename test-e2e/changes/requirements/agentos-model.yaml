schema_version: '1.0'
change:
  change_id: AOS-MODEL-20261109
  change_type: requirement
  title: Introduce typed AgentOS model operations
  description: Establish tenant-scoped model access and invocation in Runtime using the existing model records and SDK adapters.
  affected_features:
    existing: []
    added: [AOS-MODEL]
    modified: []
    retired: []
  affected_cases:
    existing: [AOS-TRANSPORT-D3-001]
    added: [AOS-MODEL-D3-001]
    modified: []
    retired: []
  feature_contract_changed: true
  traditional_ut:
    decision: add
    behaviors:
    - Model input rejects provider connection overrides.
    - Wrong tenant, revision or modality never reaches the SDK.
    - Model metadata omits credentials.
    - Runtime owns model writes and probes under the signed tenant; Management retains role bindings.
    - Tenant deletion stops before cascading if Runtime model cleanup fails.
    reason: Existing adapter and legacy model management tests do not exercise the new AgentOS model contract.
    test_selectors:
    - test/backend/services/test_agentos_model.py
    - test/backend/services/test_agentos_model_administration.py
    - test/backend/services/test_model_management_service.py
    - test/backend/services/test_model_health_service.py
    - test/backend/app/test_model_managment_app.py
    - test/backend/app/test_voice_app.py
    - test/backend/services/test_tenant_service.py
    - test/backend/app/test_tenant_app.py
    - test/backend/services/test_agent_name_contract.py
    - test/backend/services/test_evaluator_service.py
    - test/backend/services/test_conversation_management_service.py
    - test/backend/app/test_conversation_management_app.py
  requirement_id: AOS-REQ-008
