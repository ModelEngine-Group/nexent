schema_version: '1.0'
change:
  change_id: MODEL-PROFILE-COMPOSITION-20261013
  change_type: requirement
  requirement_id: MODEL-PROFILE-COMPOSITION-20261013
  title: Compose model profiles with explicit Nexent supplements
  description: Keep copied source data separate from Nexent roles, parameter permissions
    and provider bindings; compose exact drafts with conflict diagnostics.
  affected_features:
    existing: []
    added:
    - SDK-MODEL-PROFILE-COMPOSITION
    modified: []
    retired: []
  affected_cases:
    existing:
    - MPN-D1-001
    added:
    - MPC-D1-001
    modified: []
    retired: []
  traditional_ut:
    decision: add
    behaviors:
    - Strict profile contracts and registered traditional instruction mapping reject
      unknown fields/versions/unsupported roles.
    - Supplement parsing, explicit conflict handling and revision inputs are deterministic
      and preserve caller-owned data.
    reason: Existing contracts and parameter tests do not validate complete profile
      definitions, supplements or selection composition. Keep isolated assertions
      in UT and verify actual connected component behavior separately.
    test_selectors:
    - test/sdk/core/model_service/test_instruction_mapping.py
  notes: Design before component wiring. D2/D3/D4 and deployed outlet acceptance remain
    later service/runtime slices.
