schema_version: '1.0'
change:
  change_id: DPR-KB-IMAGES-20261117
  change_type: requirement
  requirement_id: DPR-004
  title: Remove the last SDK data-process image consumer
  description: Inject Runtime KB image filtering, preserve SDK search projection and retire old service image methods and route.
  affected_features:
    existing: [DPR-WEB-IMAGE]
    added: []
    modified: [DPR-WEB-IMAGE]
    retired: []
  affected_cases:
    existing: [DPR-WEB-IMAGE-D3-001, DPR-IMAGE-PROXY-D3-001, DPR-PARSER-IMAGES-D5-001]
    added: [DPR-KB-IMAGES-D3-001]
    modified: [DPR-PARSER-IMAGES-D5-001]
    retired: []
  traditional_ut:
    decision: strengthen
    behaviors:
    - Preserve scope, document path filtering, citation numbering and original empty-filter image events.
    - Install actor-bound local image capability and current run cancellation without SDK environment reads.
    - Verify Runtime exact read-only object role, deadline, no unauthorized reads and source closure.
    - Preserve web-only source scope and generic proxy encoding while sharing pure decoding.
    - Remove no-caller service image route and methods without affecting remaining task APIs.
    reason: Existing SDK UT already proves search and projection; replace old HTTP mocks with capability assertions. Real HTTP/MinIO D3 adds protocol and managed-worker evidence, not a duplicate D1. Case preparation owns its labelled MinIO, sockets and workers without shared factories. Historical KB ACL and presigned HTTP migration remain pending.
