    - test/sdk/multi_modal/test_image_codec.py
    - test/sdk/multi_modal/test_image_filter.py
    - test/backend/services/test_knowledge_reference_images.py
    - test/backend/services/test_web_image_filter.py
    - test/backend/services/test_image_sources.py
    - test/backend/services/test_image_content.py
    - test/backend/infrastructure/test_source_upload_composition.py
    - test/backend/app/test_agentos_prepared_knowledge.py::test_knowledge_alias_shape_is_rejected_before_storage_access
    - test/backend/app/test_agentos_prepared_knowledge.py::test_distinct_knowledge_catalog_aliases_keep_independent_sdk_configuration
    - test/backend/app/test_data_process_app.py
    - test/backend/services/test_data_process_service.py
