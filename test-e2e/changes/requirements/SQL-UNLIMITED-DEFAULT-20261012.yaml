schema_version: '1.0'
change:
  change_id: SQL-UNLIMITED-DEFAULT-20261012
  change_type: requirement
  requirement_id: SQL-UNLIMITED-DEFAULT-20261012
  title: Remove implicit SQL limits and cap returned rows without modifying SQL
  description: Default all tools to unlimited rows and use cursor.fetchmany for explicit positive max_rows instead of appending LIMIT to SQL; retain existing dialect preprocessing.
  affected_features:
    existing: []
    added: [SDK-SQL-ROWS]
    modified: []
    retired: []
  affected_cases:
    existing: []
    added: []
    modified: []
    retired: []
  traditional_ut:
    decision: strengthen
    behaviors:
      - All three concrete tools execute default, null, zero and negative limits without adding a limit or fetching only 100 rows, returning all 101 fixture rows.
      - Explicit positive row limits use fetchmany without injecting LIMIT or TOP; SQL-provided limits, semicolons, comments, CTEs and non-query statements receive no additional clauses.
      - Security rejection happens before connection; query errors close the connection and return the existing error JSON.
    reason: Defaults, emitted SQL and cursor fetch selection are isolated tool contracts proved with controlled drivers. No live database, query-performance or transaction acceptance is claimed, and duplicate formal component tests add no necessary evidence.
    test_selectors:
      - test/sdk/core/tools/sql_tools/test_default_row_limit.py
      - test/sdk/core/tools/sql_tools/test_mysql_tool.py
      - test/sdk/core/tools/sql_tools/test_postgres_tool.py
      - test/sdk/core/tools/sql_tools/test_mssql_tool.py
      - test/sdk/core/tools/sql_tools/test_sql_database_base_tool.py
  no_case_change_reason: Existing formal Feature searches found no SQL tool ownership or affected cases. The acceptance criteria concern isolated defaults/dispatch; traditional UT supplies the required proof without creating duplicate formal Cases.
  notes: 'Acceptance: default/null returns all rows; positive max_rows still limits; tool schema descriptions match defaults; security, errors and cleanup remain unchanged. Scope: sdk/nexent/core/tools/sql_tools only. The canonical sibling nexent-doc repository and module registry are unavailable in this checkout, so canonical SPEC documentation remains blocked. No live SQL integration, performance or Agent journey acceptance is claimed.'
