schema_version: '1.0'
change:
  change_id: WB-HISTORY-PINS-20261014
  change_type: requirement
  requirement_id: WB-HISTORY-PINS-20261014
  title: Reliable Workbench history pinning
  description: Reuse the shared history menu for pin/unpin with stable server IDs, a dedicated top group, per-user tenant browser persistence and unchanged conversation operations.
  affected_features:
    existing: []
    added: []
    modified: [CHAT-SIDEBAR]
    retired: []
  affected_cases:
    existing: [CHAT-SIDEBAR-D1-001, WB-CONTROLS-D4-002]
    added: [CHAT-SIDEBAR-D4-001]
    modified: []
    retired: []
  traditional_ut:
    decision: add
    test_selectors: [frontend/tests/workbench/ThreadPins.test.tsx, frontend/tests/workbench/WorkbenchThreadAdapter.test.ts]
    behaviors:
      - Stable server identity survives local-ID changes, preserves legacy identity and rejects unpersisted drafts.
      - Storage parsing, rapid toggles, storage failure and user scope changes retain the expected in-memory and persisted state.
      - Group partition preserves normal order, excludes filtered histories and supports absent timestamps.
      - Initial-page metadata hydrates authorized Workbench pins outside the page; subsequent page cursors retain original offsets and omit already hydrated duplicates. Missing or foreign histories do not fail the ordinary list.
    reason: Add focused shared pin-state and partition proof; reuse existing sidebar component integration and add browser persistence journey rather than a duplicate D1.
  notes: Existing chat-workbench-resource-controls SPEC is extended for Workbench history. Browser-local persistence only; no backend writes, cross-device synchronization, migration or model-generation changes. Agent-chat pin storage remains compatible.
