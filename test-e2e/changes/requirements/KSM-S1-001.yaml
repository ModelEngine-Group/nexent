    "notes": "Primary responsibility sandbox. Integrated a2f137126 then be2e2caa8 onto develop 3bcd558ac on 2026-11-18, adapting to the split SDK, Jiuwen and trajectory lifecycle. SYSTEM is the supported Kubernetes scope; SESSION and actual Runtime autoscaling joint acceptance remain future work. Single-node Docker Desktop verification does not establish multi-node/CSI behavior. The earlier real NetworkPolicy negative probe failed because denied Pod HTTP still returned 200; no CNI change is authorized and network enforcement is not accepted. Owned D3-D5 implementations and preparation/cleanup bindings now exist. Five corresponding assets are registered in the external V5 suite, including PW-KSM-DOWNLOAD-001; structural registration is separate from business execution. Full-tree strict validation has the same four unrelated NB issues as the complete develop baseline. Current integration execution evidence and remaining acceptance gaps are recorded in the external PR report. The user removed graceful scale-in/restart completion on 2026-11-13; keep KSM-DRAIN-D2-001 retired and preserve live-run ownership and coordination failure protection. Historical drain passes are not current acceptance."
