schema_version: "1.0"
change:
  change_id: ADD-TO-CHAT-ANNOTATIONS-STRUCTURED-20261102
  change_type: requirement
  requirement_id: ADD-TO-CHAT-ANNOTATIONS-STRUCTURED-20261102
  title: 回复选中批注结构化传输（LibreChat 式）
  description:
    'Upgrades the reply-annotation ("add to chat") channel from frontend-only
    text folding to a structured implementation. Pending annotations are now
    sent as AgentRequest.annotations (snake_case wire items
    quoted_text/comment/source_excerpt, capped at 10 entries / 1500 / 500 /
    120 chars, truncated rather than rejected) alongside the clean composer
    text. The backend persists them as a message_annotations unit on the user
    message (mirroring clarification_response) and merges the numbered quote
    blocks into the model-facing text at request time: the current turn in
    prepare_agent_run (create_run query kwarg) and past turns in
    get_historical_context, while the stored message_content stays clean.
    History reads return the structured annotations field. On the frontend,
    a send with annotations and no in-flight uploads takes over the append
    (thread.append) so the optimistic user message carries the annotations as
    message metadata and renders a collapsed annotation badge above the
    message text that expands to read-only reference cards (quoted text,
    optional comment, source reply excerpt); cards are
    restored from history after reload. With in-flight uploads the send rides
    the library submission flow and carries annotations via the composer
    runConfig channel (no optimistic cards until reload). Ordinary sends
    without annotations are untouched, rejected sends keep the annotations
    and restore the draft, and stale runConfig payloads are cleared so they
    cannot leak into clarification sends or edit resends.'
  affected_features:
    existing: []
    added: []
    modified: []
    retired: []
  affected_cases:
    existing: []
    added: []
    modified: []
    retired: []
  traditional_ut:
    decision: add
    test_selectors:
      - frontend/tests/component/messageAnnotation.test.tsx
      - test/backend/services/test_message_annotations.py
      - test/backend/database/test_conversation_db.py
    behaviors:
      - toMessageAnnotationWireItems maps camelCase annotations onto the
        snake_case wire shape, caps the list at the max count and truncates
        oversized quoted text/comment fields.
      - fromMessageAnnotationWireItems validates entries (dropping unusable
        ones), returns an empty list for non-array payloads, re-applies the
        defensive caps and round-trips the outgoing mapping.
      - createMessageAnnotation drops whitespace-only comments and applies
        the defensive caps; adding beyond the max count is rejected in the
        Thread with a localized warning.
      - MessageAnnotationCards renders a collapsed count badge that expands
        to one read-only card per annotation (quote, comment, source excerpt)
        and drops invalid entries.
      - normalize_message_annotations validates, trims and drops unusable
        entries, rejects non-list payloads, returns None when nothing usable
        remains, and truncates oversized fields instead of rejecting them.
      - format_annotations_for_llm returns the text unchanged without
        annotations, composes numbered quote blocks ("> " lines, optional
        comment, source excerpt header), joins multiple blocks, and omits
        the "---" separator for annotation-only sends.
      - parse_message_annotation_unit round-trips persisted payloads and
        rejects malformed/empty ones.
      - AgentRequest retains structured annotations; save_conversation_user
        passes the normalized payload to the atomic message save.
      - get_conversation_history returns the annotations field without
        replacing the readable message text (malformed units are skipped).
      - create_conversation_message persists annotations as a
        message_annotations unit for user rows only (assistant rows skip the
        unit); historical turns merge the annotation units into the
        model-facing user_message while deleted units are ignored.
      - test_conversation_db.py get_historical_context mock sequence updated
        for the additional annotation-unit query (regression guard for the
        existing summary/boundary assertions).
    reason: |-
      The upgrade spans the request payload (additive annotations field),
      unit persistence, prompt construction and the user bubble, all covered
      by targeted UT at their owning layers: frontend component/util tests
      for the wire mapping, caps, takeover send and badge/card rendering; backend
      tests for contract normalization/formatting, service passthrough,
      history projection and repository persistence/merge against isolated
      SQLite rows. The model-facing merge is invisible to external protocol
      boundaries and the northbound API does not expose the field, so no
      formal Case is added.
  notes: |
    Supersedes the frontend-only folding implementation recorded in
    ADD-TO-CHAT-MESSAGE-ANNOTATIONS-20261102: the fold function, its labels
    (quoteLabel/sourceLabel) and related tests were removed; formatting now
    happens in the backend (fixed English labels) so the stored user text
    stays clean. Manual takeover uses the library's own
    composeEventHandlers(preventDefault) contract; the fallback path parks
    the payload on the composer runConfig and clears it once the run settles
    (ordinary sends, clarification cards and edit resends cannot carry stale
    annotations). The composeSend double-invocation guard of the fold era is
    obsolete because the manual append is idempotent. Annotation-only sends
    (quoted reply without typed text) resolve the annotations before the
    adapter's empty-query guard so the request goes out with an empty query
    and the backend merges the quotes into the model-facing text.
    Northbound API does not transparently expose annotations; resume runs do
    not carry them.
