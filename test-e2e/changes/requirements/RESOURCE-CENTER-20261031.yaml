  traditional_ut:
    decision: strengthen
    behaviors:
    - 复用旧接口与状态UT，验证新URL注册、mine/all_authorized范围；不新增排除本人或自审限制。
    - 新增混合查询过滤/count/全局排序、null时间、Unicode意见长度与错误码UT。
    - 补充三类旧新写入映射、revision原子条件、提交时间/上架时间与故障回滚UT。
    - 补充Skill来源批量映射、只读/历史未知/引用保护及前端缓存/失败保留/批量部分失败UT。
    - 验证我的 MCP 批删只发送一次请求，排除只读项，区分本地与仓库的同号记录，并保留部分失败项。后端验证参数、登录和单删权限。
    - 复审补充：共享Session/UNSET与NULL、请求级分页快照、响应丢失恢复、安装三态与通知失败边界。
    - 新URL登记与原有审核范围兼容、无审核资格仅本人、submitted_user_id实际提交身份，新旧审核路由沿用现有操作资格。
    - AC-002并行兼容：新版内部URL生成器、通知和返回路径使用新深链；保留旧页面、链接、角色登记和普通后端API。
    - AC-002外部直达：统一URL构造/解析、URL优先、登录后恢复、前进后退、逐入口Tab/view/类型ID映射，尤其本人结果通知与他人待审通知不同目标。
    - 实现方案补充：通知列表从既有unique_id兼容返回字符串仓库ID、事件参数映射；审核all保留行/pending才移出；三类详情fixture。
    - 新申请不可变、通过发布/驳回不写仓库、删除实体增列；传统UT与独立PostgreSQL验证不等于正式Case通过。
