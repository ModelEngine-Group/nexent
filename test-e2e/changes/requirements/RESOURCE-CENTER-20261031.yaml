  notes: '2026-11-03 implementation batch 1 adds metadata models, an additive migration, review contracts and route
    helpers. Legacy pages, links and grants are retained per latest user instruction; old-route deletion is deferred.
    MCP review credentials are masked. Backend UT 34 passed and frontend UT 25 passed; no formal Case PASS is claimed.
    The following design-stage note is historical: No product code, fixed script, execution binding or runtime PASS
    is claimed. All new automated Cases are blocked until implementation. Deployment-mode switching is not part
    of the new Cases; migration is checked on an isolated DB. Design review: D3-002 now proves runtime dual-write
    only; new D5-002 owns migration risk. No automatic environment redeployment or exactly-once notification claim.
    User-confirmed permission revision: register the new URL directly to roles; do not implement a historical permission
    conversion platform. All repository users see the review Tab; scope is mine or all_authorized, not a Tab visibility
    grant. User explicitly removes old page URL compatibility and all active hardcoded links; route-reference-audit.md
    records the design-time inventory. Product route changes are pending. Latest correction supersedes previous
    others-only/self-review restrictions: authorized reviewers keep original scope including self; no new self-review
    prohibition.'
