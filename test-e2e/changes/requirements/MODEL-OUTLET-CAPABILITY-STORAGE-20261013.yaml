    behaviors:
    - Preserve strict BOOLEAN/NULL status conversion, unknown/empty domains and detached round-trip values.
    - Reject duplicated, incomplete, inconsistent, non-JSON or oversized capability storage without leaking values.
    - Enforce positive INT4 context limits and existing typed reasoning/modality/response contracts after restoration.
    reason: Existing contracts validate capabilities in memory, not their persisted ownership. Pure partition/restore belongs in UT; no extra D1 adds necessary component evidence.
