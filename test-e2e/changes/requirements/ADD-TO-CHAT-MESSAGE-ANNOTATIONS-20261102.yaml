schema_version: "1.0"
change:
  change_id: ADD-TO-CHAT-MESSAGE-ANNOTATIONS-20261102
  change_type: requirement
  requirement_id: ADD-TO-CHAT-MESSAGE-ANNOTATIONS-20261102
  title: 回复选中批注（添加到对话）
  description:
    'Selecting text inside one assistant reply shows a floating "Add to chat"
    bubble above the selection. Confirming it (optionally after typing a
    comment) stores a pending annotation and renders a count chip above the
    composer input; hovering the chip opens the annotation list where each
    entry can be edited or deleted and the trailing button clears all.
    Annotations attach to the next outgoing message only: sending folds each
    one into the message text as a numbered quote block (quoted reply text
    prefixed with ">", an optional comment line, and the first-40-char excerpt
    of the source reply), followed by a "---" separator and the user-typed
    text. An annotation-only send (empty composer text) is allowed. The fold
    is idempotent for the send-button/form-submit double invocation; a
    rejected run keeps the annotations and restores the user draft, and the
    annotations are consumed once the run accepts. Switching threads resets
    pending annotations. Selections are quotable only inside the content area
    of a single assistant message (reasoning, tool, execution-code, and
    subagent containers are excluded); the bubble is disabled in read-only
    threads, share mode, skill-file chats, and the preview layouts.'
  affected_features:
    existing: []
    added: []
    modified: []
    retired: []
  affected_cases:
    existing: []
    added: []
    modified: []
    retired: []
  traditional_ut:
    decision: add
    test_selectors:
      - frontend/tests/component/messageAnnotation.test.tsx
    behaviors:
      - formatAnnotationsIntoMessage returns the text unchanged without
        annotations, composes numbered quote blocks with the "from reply"
        excerpt and optional comment lines, and joins the user text behind a
        "---" separator (annotation-only sends keep the block alone).
      - truncateAnnotationText collapses whitespace and truncates to the
        limit with an ellipsis.
      - getAnnotationSourceExcerpt joins only the text parts of the source
        assistant message, returns "" for user or unknown messages, and
        truncates long replies to the excerpt limit.
      - createMessageAnnotation keeps the quoted text verbatim, trims the
        comment (dropping whitespace-only values), and captures the source
        excerpt at creation time.
      - resolveAnnotationSelection accepts a selection whose endpoints sit in
        the content area of the same assistant message, normalizes CRLF, and
        rejects collapsed/empty selections, reasoning and tool containers,
        cross-message selections, and user-message selections.
      - ComposerAnnotationChip renders nothing without annotations, opens
        the annotation list on hover, deletes a single entry, clears all
        entries, saves an inline-edited trimmed comment, and cancels editing
        without saving.
    reason: |-
      The feature is pure frontend composition at send time: no backend
      route, payload, or protocol changes are involved, and the send path
      reuses the existing ordinary-send rejection/restore flow. The targeted
      component UT covers the new unit behavior (message composition,
      selection resolution, chip list interactions) at its owning layer; the
      existing workbench Composer suite still passes unchanged. No new
      external protocol or cross-component runtime contract is introduced,
      so no formal Case is added.
  notes: |
    Core scope confirmed by the user: the bubble only offers "Add to chat"
    (no side chat), an optional comment is enough to send (empty composer
    text allowed), each annotation carries the first-40-char excerpt of its
    source reply, and the chip expands its list on hover. Quoted text is
    sent inside the message content (markdown-style "> " lines) so the model
    resolves the reference from the full conversation history without any
    message-reference protocol.
