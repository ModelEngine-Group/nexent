schema_version: '1.0'
change:
  change_id: RESOURCE-DRAWER-20261016
  change_type: requirement
  requirement_id: RESOURCE-DRAWER-20261016
  title: Unify reusable resource selection drawers
  description: Unify shared resource drawers and configuration consumers with external categories and controlled inputs; defer Workbench and conversation migration while preserving existing imports through thin compatibility exports.
  affected_features:
    existing: [WB-CONTROLS, AGENT-EDITOR-WORKFLOWS]
    added: []
    modified: []
    retired: []
  affected_cases:
    existing: [WB-CONTROLS-D4-001, AGENT-EDITOR-D4-004]
    added: []
    modified: []
    retired: []
  traditional_ut:
    decision: strengthen
    behaviors:
    - All five resource drawers allow 10, 20 or 50 items per page, resize actual slices, reset to page one and preserve draft selections.
    - Configuration selectors use unified group-value tag filtering, authorized-ID intersection, stale-response isolation and unchanged selection drafts.
    - Assigned skill labels render without flat tags; optional Knowledge and Skill managers save unified assignments and refresh labels with edit guards.
    - Knowledge statistics share the descriptive second line; Agent cards support hover and keyboard or pointer selection without double toggles.
    - Knowledge displays known modality and ordinary tags beside the name, with an independent right-aligned source badge and compact description-free rows.
    - Knowledge shows embedding metadata and whole-row hover includes statistics and actions.
    - Skill edit callbacks respect permissions and configuration remains visible with disabled explanations when unsupported.
    - Agent cards show plain gray version metadata below the name, assigned tags below the description, and configuration-consistent uploaded and fallback icon backgrounds.
    - Knowledge, Skill and Tool share ResourceItem with left selection indicators, name-adjacent tags, preserved metadata and independent configuration actions.
    - Optional tag management is hidden by default and appears in the common list header before refresh when configured.
    - Knowledge defaults to an icon-free metadata list; agent cards use saved icons and numeric-ID fallbacks for missing or failed images.
    - Shared drawer accepts external categories and controlled query without fake hidden-section values.
    - Default list/card items expose metadata and independent actions while preserving disabled selection.
    - Shared Knowledge and Skill drawers support external catalogs and confirmation callbacks; Workbench and conversation source remain unchanged.
    reason: Frontend unit contracts and existing browser regressions cover this change. Python, API and runtime contracts are unchanged; no duplicate D1 is needed.
    test_selectors:
    - frontend/tests/component/resourceDrawer.test.tsx
    - frontend/tests/component/agentDrawer.test.tsx
    - frontend/tests/component/skillDrawer.test.tsx
    - frontend/tests/component/toolDrawer.test.tsx
    - frontend/tests/component/modelDrawer.test.tsx
    - frontend/tests/component/resourceTagFilter.test.tsx
    - frontend/tests/component/resourceTagManagement.test.tsx
    - frontend/tests/component/knowledgeDrawer.test.tsx
    - frontend/tests/component/resourcePickerLocalization.test.tsx
    - frontend/tests/workbench/AddResourceDrawerCompatibility.test.tsx
    - frontend/tests/workbench/AgentPicker.test.tsx
    - frontend/tests/workbench/SkillPicker.test.tsx
    - frontend/tests/workbench/KnowledgePicker.test.tsx
    - frontend/tests/workbench/Composer.test.tsx
  notes: SPEC ../nexent-doc/docs/Developing/chat-resource-drawer-reuse/proposal.md. Browser cases are regression reuse, not newly certified acceptance.
