    existing: [WB-CONTROLS]
    added: [CHAT-MODEL-CONTROLS]
    modified: []
    retired: []
  affected_cases:
    existing: [WB-CONTROLS-D4-002, WB-CONTROLS-D4-003]
    added: [CHAT-MODEL-CONTROLS-D2-001, CHAT-MODEL-CONTROLS-D2-002, CHAT-MODEL-CONTROLS-D3-001, CHAT-MODEL-CONTROLS-D3-002, CHAT-MODEL-CONTROLS-D4-001, CHAT-MODEL-CONTROLS-D4-002, CHAT-MODEL-CONTROLS-D4-003]
    modified: []
    retired: []
  traditional_ut:
    decision: strengthen
    test_selectors:
      - test/sdk/test_run_agent_cancellation_controls.py
      - test/sdk/core/agents/test_run_agent.py
      - test/backend/services/test_run_model_controls.py
      - test/backend/services/test_nl2agent_service.py
      - test/backend/services/test_nl2skill_service.py
