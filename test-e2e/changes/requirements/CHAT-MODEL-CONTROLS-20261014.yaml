      - test/backend/agents/test_create_agent_info_workbench_coverage.py
      - test/backend/app/test_agent_app.py
      - test/backend/app/test_skill_app.py
      - frontend/tests/workbench/ConversationModelControls.test.tsx
      - frontend/tests/workbench/AgentModels.test.ts
      - frontend/tests/workbench/ModelSelectorThinking.test.tsx
      - frontend/tests/workbench/Composer.test.tsx
    behaviors:
      - Reuse capability/scope/default and frontend sampling tests; strengthen controller isolation, initial/subsequent creator state, immutable turn serialization and asynchronous default races.
      - Strengthen DTO presence handling for omitted fields, false, auto, all eight efforts, null, budget zero/ranges and duplicate configuration conflicts.
      - Strengthen NL2 model resolver and root overlay isolation, actual selected capacity, inherited sampling/custom/output parameters and preservation of independent business models.
      - Strengthen permission/unavailable selection, run locks, cancellation, retry and late event protection without replacing existing draft or SSE behavior.
    reason: Existing AgentModels/ModelSelectorThinking/Composer, NL2 service and generation overlay unit assertions cover isolated policies but lack the new creator wiring and partial override branches. Actual unit selectors are listed above; no UT is registered as a formal D1 case.
  notes: Seven added Cases now have case-local scripts and explicit acceptance bindings; active denotes implemented executability, not acceptance PASS. Reuse both existing WB browser contracts unchanged. D2 proves real endpoint validation; D3 proves actual runtime-to-provider protocol and capacity; D4 proves browser state/request journeys. No additional D1/D5 quota, deployment, database migration or claimed execution result.
