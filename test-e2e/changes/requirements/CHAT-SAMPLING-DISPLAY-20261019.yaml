schema_version: '1.0'
change:
  change_id: CHAT-SAMPLING-DISPLAY-20261019
  change_type: requirement
  requirement_id: CHAT-SAMPLING-DISPLAY-20261019
  title: 共享高级设置展示统一 SDK 采样默认值并支持空值继承
  description: Resolve null sampling through turn, Agent, model and shared SDK defaults (temperature 1.0, top_p 1.0). Expose
    effective read-only metadata and show exact numeric defaults and slider positions without creating turn overrides.
  affected_features:
    existing: []
    added: []
    modified:
    - CHAT-MODEL-CONTROLS
    - WB-CONTROLS
    retired: []
  affected_cases:
    existing:
    - CHAT-MODEL-CONTROLS-D4-001
    - CHAT-MODEL-CONTROLS-D4-002
    - WB-CONTROLS-D4-003
    added: []
    modified:
    - CHAT-MODEL-CONTROLS-D4-003
    - WB-CONTROLS-D4-002
    - CHAT-MODEL-CONTROLS-D3-001
    retired: []
  traditional_ut:
    decision: strengthen
    behaviors:
    - Show configured numbers and exact decimal slider positions, including zero and asynchronously loaded defaults.
    - Resolve Agent sampling over model defaults and the same SDK defaults by field; null inherits and zero remains explicit.
    - SDK ModelConfig and OpenAIModel use identical defaults for omitted or null arguments; model-list metadata never fills
      stored fields.
    - Opening, focusing and restoring inherited defaults must not serialize them as explicit overrides or alter reasoning/model/session
      state.
    reason: Existing UI UT and D4 own the inherited/default editing and real request journey. Strengthen these owners; strengthen
      SDK/backend inheritance UT and existing D3 provider-wire proof for null/default resolution. No additional Case or D1
      layer is needed.
    test_selectors:
    - frontend/tests/workbench/ModelParameterSettings.test.tsx
    - frontend/tests/workbench/AgentModels.test.ts
    - frontend/tests/workbench/ConversationModelControls.test.tsx
    - test/backend/services/test_run_model_controls.py
    - test/sdk/core/models/test_sampling_defaults.py
    - test/backend/services/test_sampling_defaults.py
    - frontend/tests/workbench/ModelSamplingMetadata.test.ts
    - test/sdk/core/agents/test_agent_model.py
    - test/backend/services/test_model_management_service.py
  notes: User revised the prior provider-default policy to unified SDK inheritance. User-approved SDK fallback 1.0/1.0
    is authoritative; task-specific explicit 0.3 and all reasoning/capacity/provider behavior remain unchanged. Add only read-only
    effective_sampling to the model-list response; no schema, global model write or persistence migration.
