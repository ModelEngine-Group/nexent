schema_version: '1.0'
change:
  change_id: DPR-KB-SEARCH-20261117
  change_type: requirement
  requirement_id: DPR-002
  title: Authorize and execute AgentOS text retrieval and reranking in Runtime
  description: >-
    Management attests an ordered complete local KB scope through a signed callback.
    Runtime executes accurate, semantic and hybrid text retrieval using readonly VectorStore,
    invokes embedding and rerank through Model.invoke, checks visibility before rerank
    and before return, and applies one total bounded HTTP deadline without retry or fallback.
  affected_features:
    existing: [DPR-KNOWLEDGE]
    added: []
    modified: [DPR-KNOWLEDGE]
    retired: []
  affected_cases:
    existing: [DPR-KB-HTTP-D3-001, DPR-KB-D3-001, SI-VECTOR-D3-001]
    added: []
    modified: [DPR-KB-WORKER-D3-001]
    retired: []
  traditional_ut:
    decision: strengthen
    behaviors:
    - Resolve current ordered KB grants with batched identity reads and no file/job dependency.
    - Enforce complete scope, model revision/dimensions, file filtering and authoritative visibility.
    - Execute three modes and strict Model.invoke rerank without leaking stale content or adding fallback.
    - Sign both HTTP directions, cancel the only client at the total deadline, and close readonly ports.
    reason: >-
      Reuse real SQLite RecordStore and managed-thread fixtures plus original authorization
      and HTTP regressions. Strengthen the multi-store signed HTTP D3 for actual retrieval,
      rerank and post-delete absence. Preserve formal D1 without adding duplicate unit cases.
    test_selectors:
    - test/backend/services/test_knowledge_search.py
    - test/backend/services/test_knowledge_search_authorization.py
    - test/backend/services/test_knowledge_authorization.py
    - test/backend/services/test_cleanse_authorization.py
    - test/backend/app/test_agentos_knowledge_api.py
    - test/backend/infrastructure/test_agentos_knowledge_client.py
    - test/backend/infrastructure/test_knowledge_search_ports.py
  notes: >-
    Model adapters remain controlled in integration tests; real provider/Langfuse settings
    are absent locally. Legacy title weighting, highlight/image/citation parity and SDK
    consumers, shared/external KBs, historical migration and final images remain pending.
