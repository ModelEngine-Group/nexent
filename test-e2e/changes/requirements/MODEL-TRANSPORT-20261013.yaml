  traditional_ut:
    decision: add
    behaviors:
    - SSE fragmentation, fields, bounded buffers and incomplete events.
    - Prepared request, adapter reconstruction and safe transport failure branches.
    - Logical sync/async calls, bounded pre-output retries, credential snapshots,
      run budgets and shared admission cleanup.
    - Versioned protocol and authentication registration, tenant/outlet credential
      ownership, and native-tool capability checks for historical messages.
    - The legacy model and unified service import the same limiter implementation
      and global instance after its internal relocation.
    - Smolagents-compatible message/stream output, Code history role projection,
      separate observer content and reasoning, and actual physical attempt numbers.
    - Deferred response acceptance by the existing CoreAgent resolver, suppressed
      repair output, and rollback of failed or prematurely closed visible attempts.
    - Explicit legacy stop/structured-output aliases use declared parameter rules
      and bindings without mutating persisted outlet defaults or inventing capabilities.
    - Reuse existing W1/W2 fingerprint and identity checks; bind trusted output
      caps through declarations and reject stale or cross-model budgets before send.
    - Preserve the run-agent test package stub path when resolving the relocated
      shared limiter; no product change or weakened runtime assertions.
    - Legacy empty-response control is consumed before parameter validation; empty and
      transport failures share one physical retry budget without replaying visible output.
    - Common monitoring trace lifetime spans sync/async calls, retries and cleanup;
      reported usage stays distinct from missing counts and legacy inferred totals.
    - Code response diagnostics and cache DTOs reset across attempts; cache arithmetic
      requires declared usage semantics and provider counts, with no inferred capability.
    - Context rebuilds replace messages only after releasing the failed response and
      permit, use at most two recoveries within the original physical attempt budget,
      and retain frozen credentials, run deadline, cancellation and outer attempt identity.
    - Legacy connection-only probes use saved outlet parameters through ModelService
      without inventing output caps; cancellation propagates instead of reporting unavailable.
    - Actual NexentAgent construction validates the supplied outlet's tenant/model/URL,
      preserves frozen profile defaults and credentials, and reuses the run cancellation owner.
    - Injected outlet selection validates tenant and record identity, detaches snapshots,
      performs no credential or HTTP access, and keeps concurrent selections independent.
    - The authored Alibaba CN Qwen3.5-plus profile declares Code/planning string stop
      sequences; actual construction and HTTP preserve them without changing saved defaults.
      Undeclared JSON Schema output remains rejected for this exact combination.
    - The actual Alibaba CN Qwen3.5-plus output rule binds the unchanged W2 answer
      budget to max_tokens; no inferred total-thinking cap or persisted default is added.
    - Saved-outlet auxiliary prompt generation consumes normalized text and configured
      defaults, closes streams, propagates cancellation and never adds an outer retry.
    - Long-text entry points reuse the unchanged truncation preparation with the saved
      outlet sender; missing capacity fails explicitly. VLM is excluded by user scope.
    - Sync cancellation shuts down owned sockets but defers client close to the request
      owner after blocked reads unwind; preserve late-connect cleanup and idempotence.
    reason: New transport behavior is absent from profile tests; D3 adds actual protocol
      collaboration.
