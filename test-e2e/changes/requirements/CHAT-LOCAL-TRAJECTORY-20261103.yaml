schema_version: '1.0'
change:
  change_id: CHAT-LOCAL-TRAJECTORY-20261103
  change_type: requirement
  requirement_id: CHAT-LOCAL-TRAJECTORY-20261103
  title: 正文完整内嵌OTLP的本地轨迹与管理员自研轨迹查看设计
  description: 本地按租户/用户/首次根Agent/会话ID分组；每会话meta.json保存归属、执行清单和确认进度，每执行一份OTLP JSONL，全部正文内嵌属性/Events。按Span/Event字段有界返回轨迹节点DTO与正文，256KiB为刷盘阈值，单行可更大。PG复用现有结构，业务trace_id=conversation_id，默认保留30天，200并发；本阶段实施后端文件存储和现有监控本地导出接入，读取API与前端仍按设计待实施。
    补充可配置定期清理和按before_days主动清理当前租户；直接复用用户POST、扩展2个会话GET，新增3个轨迹GET和1个清理POST，分批返回固定截止时间与实际结果，失败留待重试。
  affected_features:
