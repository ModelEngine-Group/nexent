schema_version: '1.0'
change:
  change_id: IMAGE-BASE-TOOLS
  change_type: requirement
  requirement_id: IMAGE-BASE-TOOLS
  title: Include basic troubleshooting utilities in every repository-built runtime image
  description: Extend existing apt/apk package installation layers to provide vim, ps, top, curl, wget and less; move terminal vim into the shared slim/conda package list.
  affected_features:
    existing: []
    added: []
    modified: [F-173]
    retired: []
  affected_cases:
    existing: []
    added: [DEP-IMAGE-BASE-TOOLS]
    modified: []
    retired: []
  traditional_ut:
    decision: exempt
    behaviors:
      - No Python, frontend or shell unit behavior changes; only runtime OS package manifests change.
    reason: This package-manifest-only change does not modify Python, frontend or shell unit behavior. Existing deploy/tests/test_images_build.sh checks build dispatch, arguments and variant selection separately; real package installation and command execution belong to the manual D5 boundary, not package-name assertions in Python UT.
  notes: 'Approved implementation plan: update eight runtime Dockerfiles using vim/procps/curl/wget/less on Debian/Ubuntu and vim/procps-ng/curl/wget/less on Alpine. Reuse existing mirrors, caches and cleanup; preserve final sandbox users and Docker 18.09 compatibility. Validate installation layers on the four declared base images and inspect all runtime inheritance paths. Full application-image rebuilding, publishing and deployment are outside this change. Keep local evidence outside Git. D1-D4 are not applicable because no component, API, service or UI behavior changes. The sibling nexent-doc repository is unavailable; the user-approved plan supplies current-change acceptance, while canonical SPEC documentation remains unavailable.'
